<li><strong>ISO/IEC 42001</strong> — an international standard for an AI <em>management system</em> — the ongoing organizational processes for governing AI (auditable/certifiable, like ISO 27001).</li>
<li><strong>EU AI Act</strong> (Regulation (EU) 2024/1689) — binding law using a risk-tiered approach: unacceptable-risk uses banned, high-risk uses heavily regulated (documentation, data governance, human oversight, accuracy, transparency), limited-risk uses subject to transparency duties. Its timetable was amended in July 2026 by the Digital Omnibus on AI (Regulation (EU) 2026/1744): the high-risk tier was deferred to December 2027 and August 2028, while the prohibitions, the AI literacy duty, the general-purpose AI obligations and the Article 50 transparency rules all remain live on their original dates. <em>No substantive obligation was weakened — only the clock moved.</em> TTM Days 50–51 work the current timetable, the provider/deployer role split and Annex III classification in operational detail; treat the mapping below as orientation, not as a compliance position.</li>
</ul>

<h2>Make the mapping an artifact, not a table in a slide</h2>
<p>A framework mapping that lives only in prose cannot be queried, diffed, or handed to an auditor. Ten minutes of structure turns it into something that goes in the repo and answers questions:</p>
<pre><code><span class="kw">import</span> pandas <span class="kw">as</span> pd

crosswalk = pd.DataFrame([
  {<span class="st">"evidence"</span>: <span class="st">"day-10-dataset-profile"</span>,   <span class="st">"nist"</span>: <span class="st">"MAP-2"</span>,      <span class="st">"eu_ai_act"</span>: <span class="st">"Art.10"</span>, <span class="st">"iso42001"</span>: <span class="st">"A.7"</span>, <span class="st">"sr26_2"</span>: <span class="st">"development"</span>},
  {<span class="st">"evidence"</span>: <span class="st">"day-24-classifier"</span>,        <span class="st">"nist"</span>: <span class="st">"MEASURE-1"</span>, <span class="st">"eu_ai_act"</span>: <span class="st">"Art.15"</span>, <span class="st">"iso42001"</span>: <span class="st">"A.6"</span>, <span class="st">"sr26_2"</span>: <span class="st">"development"</span>},
  {<span class="st">"evidence"</span>: <span class="st">"day-36-bias-audit"</span>,        <span class="st">"nist"</span>: <span class="st">"MEASURE-2"</span>, <span class="st">"eu_ai_act"</span>: <span class="st">"Art.10(2)(f)"</span>, <span class="st">"iso42001"</span>: <span class="st">"A.5"</span>, <span class="st">"sr26_2"</span>: <span class="st">"validation"</span>},
  {<span class="st">"evidence"</span>: <span class="st">"day-48-nn-interpretability"</span>, <span class="st">"nist"</span>: <span class="st">"MEASURE-3"</span>, <span class="st">"eu_ai_act"</span>: <span class="st">"Art.13"</span>, <span class="st">"iso42001"</span>: <span class="st">"A.8"</span>, <span class="st">"sr26_2"</span>: <span class="st">"validation"</span>},
  {<span class="st">"evidence"</span>: <span class="st">"day-56-llm-eval-harness"</span>,  <span class="st">"nist"</span>: <span class="st">"MEASURE-4"</span>, <span class="st">"eu_ai_act"</span>: <span class="st">"Art.50"</span>, <span class="st">"iso42001"</span>: <span class="st">"A.8"</span>, <span class="st">"sr26_2"</span>: <span class="st">"out of scope (GenAI)"</span>},
  {<span class="st">"evidence"</span>: <span class="st">"day-58-model-card"</span>,        <span class="st">"nist"</span>: <span class="st">"GOVERN-1"</span>,  <span class="st">"eu_ai_act"</span>: <span class="st">"Art.11"</span>, <span class="st">"iso42001"</span>: <span class="st">"A.4"</span>, <span class="st">"sr26_2"</span>: <span class="st">"governance"</span>},
  {<span class="st">"evidence"</span>: <span class="st">"day-57-monitoring-plan"</span>,   <span class="st">"nist"</span>: <span class="st">"MANAGE-4"</span>,  <span class="st">"eu_ai_act"</span>: <span class="st">"Art.72"</span>, <span class="st">"iso42001"</span>: <span class="st">"A.9"</span>, <span class="st">"sr26_2"</span>: <span class="st">"monitoring"</span>},
])
crosswalk.to_csv(<span class="st">"FRAMEWORK-CROSSWALK.csv"</span>, index=<span class="kw">False</span>)

<span class="cm"># the question this artifact exists to answer:</span>
<span class="cm"># "show me the evidence behind our NIST MEASURE claims"</span>
print(crosswalk[crosswalk[<span class="st">"nist"</span>].str.startswith(<span class="st">"MEASURE"</span>)])

<span class="cm"># and the more uncomfortable one: what has NO evidence behind it?</span>
claimed = {<span class="st">"MAP-2"</span>, <span class="st">"MEASURE-1"</span>, <span class="st">"MEASURE-2"</span>, <span class="st">"MEASURE-3"</span>, <span class="st">"MEASURE-4"</span>,
           <span class="st">"GOVERN-1"</span>, <span class="st">"GOVERN-4"</span>, <span class="st">"MANAGE-1"</span>, <span class="st">"MANAGE-4"</span>}
print(<span class="st">"claimed with no evidence:"</span>, sorted(claimed - set(crosswalk[<span class="st">"nist"</span>])))</code></pre>
<p>The <code>sr26_2</code> column is there because the same evidence answers to a second regime: US banking model-risk guidance (SR 26-2, April 2026), whose three pillars are development and use, validation and monitoring, and governance and controls. Note the LLM harness is marked out of scope — that guidance explicitly excludes generative AI, which is exactly the kind of boundary a crosswalk should make visible rather than paper over. TTM Days 33 and 54 develop this.</p>
<p>That last line is the whole point of the exercise. Any organisation can produce a slide claiming NIST alignment. The crosswalk makes the claim <em>falsifiable</em> — every row either points at a real artifact or it does not, and the set difference prints the gaps out loud. This is the same move you will make professionally on someone else&rsquo;s framework claims; practise it first on your own.</p>

<h2>Your course, mapped</h2>
<table class="vocab">
<tr><th>What you learned</th><th>Where it lands</th></tr>
<tr><td>Data profiling, representation, proxies (Ph.1)</td><td>NIST <em>Map</em>; EU AI Act Art. 10 data governance; datasheets</td></tr>
<tr><td>Training, validation, leakage (Ph.2)</td><td>NIST <em>Map/Measure</em>; accuracy &amp; robustness requirements</td></tr>
<tr><td>Metrics &amp; fairness, impossibility theorem (Ph.3)</td><td>NIST <em>Measure</em>; EU AI Act bias &amp; accuracy; disparate-impact law</td></tr>
<tr><td>Deep learning &amp; interpretability (Ph.4)</td><td>EU AI Act transparency &amp; human-oversight duties</td></tr>
<tr><td>LLM harms &amp; evaluation (Ph.5)</td><td>OWASP LLM Top 10; NIST GenAI profile; transparency obligations</td></tr>
<tr><td>Deployment, drift, monitoring, docs (Ph.6)</td><td>NIST <em>Manage</em>; ISO 42001 management system; EU AI Act post-market monitoring</td></tr>
</table>

<div class="box hl"><div class="bt">▲ Why you are now unusually valuable</div><p>Most people in this space hold one half. Technical people can train a model but glaze over at "Article 10" or "the Measure function." Compliance people know the frameworks cold but can't tell whether a model actually satisfies them — they can cite the requirement but not verify it. <strong>You can do both.</strong> You can read "the system must be tested for bias and accuracy" and then <em>actually run that test</em> and judge whether the model passes. That translation layer — between the regulation and the running code — is scarce, and it's exactly where you now stand.</p></div>

<div class="box wa"><div class="bt">■ Frameworks are a floor, not a ceiling</div><p>A caution to carry: passing a framework's requirements is the <em>minimum</em>, not proof of a good outcome. Frameworks can lag technology, be satisfied superficially (documentation theater, Day 58), or miss context-specific harms. Compliance and ethics overlap but aren't identical — a system can be technically compliant and still cause harm the framework didn't anticipate. Your judgment has to extend past the checklist to the actual human impact. The frameworks tell you where to look; they don't do the looking for you.</p></div>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>This is the synthesis your whole career has been building toward: fluent in the frameworks (your GRC foundation) <em>and</em> able to verify them against real model behavior (these 59 days). You don't just assert a model should be fair, explainable, and monitored — you can measure fairness, probe explainability, and design monitoring. Tomorrow you prove it, on a complete model, start to finish.</p></div>

<h2>Today's takeaway</h2>
<p>Every skill you built maps onto NIST AI RMF, ISO 42001, and the EU AI Act — and your rare value is translating between the regulation and the running code, while remembering frameworks are a floor, not a ceiling. Tomorrow: the capstone that ties all 60 days into one audit.</p>
`,
quiz:{q:"What makes someone who completes this course unusually valuable in AI governance?",options:["They can operate on both sides: fluent in the frameworks AND able to verify a model against them by actually running the tests","They're capable of training the largest and most computationally expensive models in the industry, which is the scarce skill that regulated employers compete for","They've memorized the exact article and clause numbers of every major framework, so they can cite the precise legal provision behind any finding without looking it up","They can quote the relevant framework language from memory in a live audit, which is what establishes credibility with regulators and counsel in a review meeting"],answer:0,explain:"Most professionals hold either the technical or the compliance half. The rare, valuable capability is translating between them — reading a requirement like 'test for bias and accuracy' and actually running and judging that test — while recognizing that framework compliance is a minimum, not a guarantee of good outcomes."}},

{n:60,title:"Capstone — The Complete Audit (Deliverable #6)",read:"Capstone · 20 min read · ~6 hr build · Final portfolio deliverable",body:`
<p>Sixty days ago you may have never written a line of code. Today you perform a complete, end-to-end audit of a machine learning system — technical and governance, start to finish — and produce the capstone deliverable that anchors your entire portfolio. This is the job you set out to be able to do. Let's prove you can.</p>

<div class="box hl"><div class="bt">▲ The whole course in one breath</div><p>You learned what ML is and how data becomes a decision (Ph.1); how models are trained and how they learn (Ph.2); how to measure them and the mathematics of fairness, including the impossibility theorem (Ph.3); how deep learning works and why it's opaque (Ph.4); how LLMs work, fail, and get evaluated (Ph.5); and how models are deployed, drift, and get governed and documented against the major frameworks (Ph.6). Every piece now comes together.</p></div>

<h2>The capstone audit</h2>
<p>Take your Day 24 classifier (or build a fresh one on a new dataset for a real challenge) and produce a complete audit report covering all six phases. This isn't new coding so much as <em>integration</em> — assembling everything you've built into one professional document.</p>
<ol>
<li><strong>System &amp; data (Ph.1):</strong> What does it predict? Profile the data — representation, proxies, missingness. What history is baked in?</li>
<li><strong>Model &amp; training (Ph.2):</strong> What model, trained how? Check the split for leakage. Is the complexity justified vs a simpler model (Day 48)?</li>
<li><strong>Fairness measurement (Ph.3):</strong> Per-group confusion matrices, precision/recall, FPR/FNR, the four-fifths ratio. Which fairness definitions does it pass and fail? State the impossibility-theorem tradeoff explicitly.</li>
<li><strong>Interpretability (Ph.4):</strong> How explainable is it? Can you explain an individual decision? What compensating controls does the opacity require?</li>
<li><strong>(If applicable) LLM/generative dimension (Ph.5):</strong> hallucination, injection, or bias-probe results.</li>
<li><strong>Deployment &amp; governance (Ph.6):</strong> Monitoring plan for drift and per-group decay. Required documentation. Framework mapping. Your accountable recommendation: deploy, deploy-with-conditions, or don't — and why.</li>
</ol>

<h2>The assembly harness</h2>
<p>Integration is a coding task too, and doing it by hand is how numbers in a report drift out of sync with the notebook that produced them. Build the audit&rsquo;s evidence pack in one cell, then write prose <em>from</em> the pack:</p>
<pre><code><span class="kw">import</span> json, pandas <span class="kw">as</span> pd
<span class="kw">from</span> sklearn.metrics <span class="kw">import</span> confusion_matrix, roc_auc_score, recall_score, precision_score

<span class="kw">def</span> <span class="fn">group_block</span>(d, y=<span class="st">"y"</span>, p=<span class="st">"pred"</span>):
    out = {}
    <span class="kw">for</span> g, s <span class="kw">in</span> d.groupby(<span class="st">"group"</span>):
        tn, fp, fn_, tp = confusion_matrix(s[y], s[p], labels=[0, 1]).ravel()
        out[g] = {<span class="st">"n"</span>: len(s),
                  <span class="st">"selection_rate"</span>: round(s[p].mean(), 3),
                  <span class="st">"FPR"</span>: round(fp / (fp + tn), 3) <span class="kw">if</span> (fp + tn) <span class="kw">else</span> <span class="kw">None</span>,
                  <span class="st">"FNR"</span>: round(fn_ / (fn_ + tp), 3) <span class="kw">if</span> (fn_ + tp) <span class="kw">else</span> <span class="kw">None</span>,
                  <span class="st">"recall"</span>: round(recall_score(s[y], s[p], zero_division=0), 3),
                  <span class="st">"precision"</span>: round(precision_score(s[y], s[p], zero_division=0), 3)}
    <span class="kw">return</span> out

blocks = group_block(df_test)
rates  = pd.Series({g: v[<span class="st">"selection_rate"</span>] <span class="kw">for</span> g, v <span class="kw">in</span> blocks.items()})

evidence = {
  <span class="st">"overall"</span>:   {<span class="st">"auc"</span>: round(roc_auc_score(y_test, proba), 3), <span class="st">"n"</span>: len(df_test)},
  <span class="st">"per_group"</span>: blocks,
  <span class="st">"four_fifths"</span>: {<span class="st">"ratio"</span>: round(rates.min() / rates.max(), 3),
                   <span class="st">"worst_group"</span>: rates.idxmin(), <span class="st">"flag"</span>: bool(rates.min() / rates.max() &lt; 0.80)},
  <span class="st">"tradeoff"</span>: {<span class="st">"prioritized"</span>: <span class="st">"equalized odds"</span>,
               <span class="st">"sacrificed"</span>: <span class="st">"cross-group calibration"</span>,
               <span class="st">"why"</span>: <span class="st">"false positives fall on individuals in this use"</span>},
  <span class="st">"recommendation"</span>: <span class="st">"deploy-with-conditions"</span>,
  <span class="st">"conditions"</span>: [<span class="st">"per-group monitoring, monthly"</span>, <span class="st">"named owner"</span>, <span class="st">"re-audit in 12 months"</span>],
  <span class="st">"limitations"</span>: [<span class="st">"no temporal validation"</span>, <span class="st">"single dataset"</span>, <span class="st">"labels encode past decisions"</span>],
}
open(<span class="st">"AUDIT-EVIDENCE.json"</span>, <span class="st">"w"</span>).write(json.dumps(evidence, indent=2))
print(json.dumps(evidence[<span class="st">"four_fifths"</span>], indent=2))</code></pre>
<p>Now every number in your written report has exactly one source, and the report can be regenerated when the model changes. Notice the three keys that are not metrics: <code>tradeoff</code>, <code>recommendation</code>, and <code>limitations</code>. Those are the ones that make it an audit rather than a scorecard, and they are required keys precisely because they are the ones people leave out. If any of the three is empty, you have not finished.</p>

<div class="box wa"><div class="bt">■ The mark of mastery</div><p>A novice audit says "the model is biased" or "the model is fine." A master's audit says: "The model shows a 14-point FPR gap disfavoring group B; it cannot satisfy both calibration and equalized odds given the base-rate difference; I recommend prioritizing equalized odds for this use because the cost of false positives here falls on individuals, accepting the calibration tradeoff, with the residual risk documented and these three monitoring triggers in place." <strong>Specificity, honesty about tradeoffs, and an accountable recommendation under genuine uncertainty.</strong> That is the voice of a professional, and you can now write in it.</p></div>

<h2>File Deliverable #6 — and complete your portfolio</h2>
<p>Commit the capstone to <code>day-60-capstone-audit/</code> with a full <code>WHAT-I-LEARNED.md</code>. Then update your repo <code>README.md</code> to present all six deliverables as a coherent body of work. Consider adding a short "About this portfolio" line: <em>hands-on ML/DL work demonstrating the ability to build, evaluate, and govern machine learning systems across the AI lifecycle.</em></p>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>Your portfolio now demonstrates the complete arc: you can profile data, train models, measure fairness with rigor, handle deep learning and LLMs, and produce framework-aligned governance recommendations — all as public, verifiable evidence. You are no longer someone who talks about AI governance. You are someone who does it, with the receipts to prove it. That was the entire point of building the machine.</p></div>

<h2>You built the machine</h2>
<p>You crossed from "I don't understand what the engineers are doing" to "I can build what they build, and I can find what they miss." That combination — technical fluency fused with governance judgment — is rare, needed, and now yours. The frameworks will keep evolving, the models will keep advancing, and your foundation will hold, because you learned the machine from the neuron up. Go put it to work. And keep the portfolio growing — the best practitioners never stop building.</p>
<p style="margin-top:24px;font-family:var(--mono);font-size:13px;color:var(--signal)">— End of course. Tap the CHEAT SHEET for a one-page reference to everything.</p>

const CHEAT={title:"Cheat Sheet",sub:"Building the Machine — one-page reference to all 60 days",body:`
<div class="box hl"><div class="bt">▲ The core audit motion (Day 4)</div><p>Compute a metric for everyone. Compute the same metric <strong>per group</strong>. <strong>Compare.</strong> Almost every fairness measurement is a variation of this. In pandas: <code>df.groupby('group')['outcome'].mean()</code>.</p></div>

<h2>Key formulas</h2>
<table class="vocab">
<tr><th>Metric</th><th>Formula / meaning</th></tr>
<tr><td>Precision</td><td>TP / (TP + FP) — of the flagged, how many were right</td></tr>
<tr><td>Recall (TPR)</td><td>TP / (TP + FN) — of the real cases, how many were caught</td></tr>
<tr><td>False Positive Rate</td><td>FP / (FP + TN) — of the innocent, how many wrongly flagged</td></tr>
<tr><td>False Negative Rate</td><td>FN / (FN + TP) — of the real cases, how many missed (= 1 − recall)</td></tr>
<tr><td>Four-fifths ratio</td><td>(least-selected group rate) / (most-selected group rate) — below 0.80 flags adverse impact</td></tr>
<tr><td>Decision</td><td>features × weights, summed (dot product) → sigmoid → threshold</td></tr>
</table>

<h2>The three fairness definitions — and the theorem</h2>
<ul>
<li><strong>Demographic parity:</strong> equal selection rate across groups. Strong when the label is biased.</li>
<li><strong>Equalized odds:</strong> equal TPR and FPR across groups. Respects the label; weak when the label is biased.</li>
<li><strong>Calibration:</strong> a given probability means the same real frequency for every group.</li>
</ul>
<div class="box wa"><div class="bt">■ Impossibility theorem (Day 34)</div><p>When base rates differ, no model can satisfy calibration + equal FPR + equal FNR at once. There is no unqualifiedly "fair" model. The question is: <strong>which fairness did we prioritize, why, and who bears the cost?</strong></p></div>

<h2>Killer audit questions by lifecycle stage</h2>
<table class="vocab">
<tr><th>Stage</th><th>Ask</th></tr>
<tr><td>Frame</td><td>What exactly is predicted, and who decided that was fair to predict?</td></tr>
<tr><td>Data</td><td>Who's over/under-represented? What proxies exist? What history is baked in?</td></tr>
<tr><td>Train</td><td>What loss was optimized? How was the split done — any leakage? (99.7% accuracy = suspect leakage.)</td></tr>
<tr><td>Evaluate</td><td>Show the confusion matrix per group. What's the base rate? Precision/recall/FPR/FNR by group?</td></tr>
<tr><td>Threshold</td><td>Who set it, on what basis? (It's a policy, not math.)</td></tr>
<tr><td>Explain</td><td>Can you explain one individual decision? What compensating controls cover the opacity?</td></tr>
<tr><td>Deploy</td><td>Human oversight? Appeal path? Least-privilege if it's an LLM?</td></tr>
<tr><td>Monitor</td><td>How will you know if it drifts or becomes unfair — per group, who watches, how often?</td></tr>
</table>

<h2>Traps to catch on sight</h2>
<ul>
<li><strong>Fairness through unawareness</strong> — deleting the protected column; proxies rebuild it (Day 8).</li>
<li><strong>Accuracy paradox</strong> — high accuracy on imbalanced data hides uselessness and minority failure (Day 29).</li>
<li><strong>Base-rate fallacy</strong> — a 95% test flags mostly innocents when the event is rare (Day 30).</li>
<li><strong>Leakage</strong> — suspiciously perfect performance; a feature available only after the outcome (Day 12).</li>
<li><strong>"The data said so"</strong> — a correlation is a question, not a defense (Day 9).</li>
<li><strong>Documentation theater</strong> — "tested for bias: yes" with no method or numbers (Day 58).</li>
<li><strong>Deep learning as default</strong> — complexity must beat the simpler interpretable model to earn its place (Day 48).</li>
<li><strong>Simpson's paradox</strong> — an aggregate trend can reverse inside every subgroup; always slice (Day 9).</li>
<li><strong>Train-vs-test gap</strong> — great on train, poor on test = overfitting; it hits data-thin groups hardest (Day 17).</li>
<li><strong>Single-split score</strong> — demand the cross-validated average AND the spread across folds (Day 22).</li>
</ul>

<h2>LLM-specific (Phase 5)</h2>
<ul>
<li><strong>Hallucination</strong> — plausible falsehoods; RAG reduces but doesn't eliminate. Ask "what happens when it's wrong, and who's hurt?"</li>
<li><strong>Prompt injection</strong> (OWASP LLM #1) — hidden instructions hijack behavior; a trust-boundary problem; blast radius = model's privileges.</li>
<li><strong>Counterfactual probe</strong> — swap a name/pronoun in identical prompts; does output change?</li>
<li><strong>Alignment (RLHF)</strong> is a behavioral surface over persistent pretraining bias; aligned to whom, by whose standards?</li>
</ul>

<h2>Documentation &amp; supply chain</h2>
<ul>
<li><strong>Model card</strong> — purpose, intended and out-of-scope use, per-group performance, known limitations (Day 58).</li>
<li><strong>Datasheet</strong> — dataset provenance: source, collection method, representation, known biases (Day 58).</li>
<li><strong>Transfer learning</strong> — fine-tuned models inherit the base model's unseen biases; demand provenance and model cards for the base (Day 47).</li>
</ul>

<h2>Framework map</h2>
<table class="vocab">
<tr><td>NIST AI RMF</td><td>Govern · Map · Measure · Manage (voluntary, practical)</td></tr>
<tr><td>ISO/IEC 42001</td><td>Auditable AI management system (ongoing processes)</td></tr>
<tr><td>EU AI Act</td><td>Risk-tiered binding law; high-risk = docs, data governance, oversight, accuracy, transparency</td></tr>
<tr><td>OWASP LLM Top 10</td><td>The LLM security harms (injection, leakage, etc.)</td></tr>
</table>

<div class="box gov"><div class="bt">✦ The whole job in one line</div><p>Ask the question, run the test, record the result, surface the tradeoff, name who decided. Frameworks are the floor, not the ceiling.</p></div>

<h2>Your six portfolio deliverables</h2>
<ul>
<li><strong>Day 10</strong> — Dataset profile (representation &amp; proxies)</li>
<li><strong>Day 24</strong> — First classifier, end-to-end</li>
<li><strong>Day 36</strong> — Bias audit & mitigation (per-group/intersectional metrics, tradeoff, before-and-after)</li>
<li><strong>Day 48</strong> — Neural network + interpretability judgment</li>
<li><strong>Day 56</strong> — LLM evaluation harness (reusable tool)</li>
<li><strong>Day 60</strong> — Complete capstone audit</li>
</ul>

const store={
  key:'building-the-machine-v1',
  /* Prefers window.storage (the sandboxed artifact host); falls back to
     localStorage when the file is opened directly in a browser. */
  hasWS(){return typeof window!=='undefined'&&window.storage&&typeof window.storage.get==='function';},
  async read(){
    const blank={done:[],quiz:{}};
    try{
      if(this.hasWS()){
        const r=await window.storage.get(this.key);
        return r&&r.value?JSON.parse(r.value):blank;
      }
      return JSON.parse(localStorage.getItem(this.key))||blank;
    }catch(e){return blank;}
  },
  write(d){
    try{
      const v=JSON.stringify(d);
      if(this.hasWS()){window.storage.set(this.key,v).catch(()=>{});return;}
      localStorage.setItem(this.key,v);
    }catch(e){}
  }
};
let S={done:[],quiz:{}};
let cur=0; // index into DAYS
let showingRef=null; // 'cheat' | 'answers' | null

const $=id=>document.getElementById(id);
function total(){return DAYS.filter(d=>d.n>=1).length;}
function doneCount(){return S.done.filter(n=>n>=1).length;}

function buildPips(){
  const host=$('pipHost');host.innerHTML='';
  PHASES.forEach(ph=>{
    const lab=document.createElement('div');lab.className='phase-label';lab.textContent=ph.label;host.appendChild(lab);
    if(ph.load){const ld=document.createElement('div');ld.className='phase-load';ld.textContent=ph.load;host.appendChild(ld);}
    const grid=document.createElement('div');grid.className='pips';
    for(let n=ph.range[0];n<=ph.range[1];n++){
      const idx=DAYS.findIndex(d=>d.n===n);
      if(idx<0)continue;
      const p=document.createElement('div');
      p.className='pip'+(n===0?' zero':'');
      p.textContent=n===0?'0':n;
      p.dataset.idx=idx;
      p.setAttribute('role','button');
      p.setAttribute('tabindex','0');
      p.setAttribute('aria-label',(n===0?'Start Here':'Day '+n)+': '+DAYS[idx].title);
      p.onclick=()=>go(idx);
      p.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go(idx);}};
      grid.appendChild(p);
    }
    host.appendChild(grid);
  });
  const grid=document.createElement('div');grid.className='pips';grid.style.marginTop='14px';
  const refPip=(cls,label,which)=>{
    const e=document.createElement('div');
    e.className='pip '+cls;e.textContent=label;
    e.setAttribute('role','button');e.setAttribute('tabindex','0');
    e.setAttribute('aria-label',label);
    e.onclick=()=>goRef(which);
    e.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();goRef(which);}};
    grid.appendChild(e);
  };
  if(CHEAT)refPip('cs','CHEAT SHEET','cheat');
  refPip('ak','ANSWER KEY','answers');
  host.appendChild(grid);
  paintPips();
}
function paintPips(){
  document.querySelectorAll('.pip').forEach(p=>{
    if(p.classList.contains('cs')){p.classList.toggle('on',showingRef==='cheat');return;}
    if(p.classList.contains('ak')){p.classList.toggle('on',showingRef==='answers');return;}
    const idx=+p.dataset.idx;const d=DAYS[idx];
    p.classList.toggle('done',S.done.includes(d.n));
    p.classList.toggle('on',!showingRef&&idx===cur);
  });
}
function updateProg(){
  const t=total(),c=doneCount();
  const pct=t?Math.round(c/t*100):0;
  $('progfill').style.width=pct+'%';
  $('pmDays').textContent=c+' / '+t+' days';
  $('pmPct').textContent=pct+'%';
}
function esc(s){return s;}

function render(){
  const d=DAYS[cur];const col=$('col');
  const ph=PHASES.find(p=>d.n>=p.range[0]&&d.n<=p.range[1]);
  let h='';
  h+='<div class="eyebrow">'+(d.n===0?'Start Here':'Day '+d.n)+'<span class="sep">/</span>'+(ph?ph.label:'')+'</div>';
  h+='<h1 class="daytitle">'+d.title+'</h1>';
  h+='<div class="readmeta">'+(d.read||'')+(d.n>=1?'  ·  Day '+d.n+' of 60':'')+'</div>';
  h+='<div class="lesson">'+d.body+'</div>';
  if(d.vocab&&d.vocab.length){
    h+='<h2>Key terms</h2><table class="vocab"><tr><th>Term</th><th>What it means</th></tr>';
    d.vocab.forEach(v=>h+='<tr><td>'+v.term+'</td><td>'+v.def+'</td></tr>');
    h+='</table>';
  }
  if(d.quiz){
    h+='<div class="quiz" id="quizBox"><div class="qh">Quick check</div><div class="qq">'+d.quiz.q+'</div>';
    d.quiz.options.forEach((o,i)=>{h+='<button class="opt" data-i="'+i+'"><span class="ol">'+String.fromCharCode(65+i)+'</span>'+o+'</button>';});
    h+='<div class="explain" id="explain"></div></div>';
  }
  // nav
  h+='<div class="nav">';
  h+='<button class="btn ghost" id="prevBtn"'+(cur===0?' disabled':'')+'>← Prev</button>';
  const isDone=S.done.includes(d.n);
  h+='<button class="btn prime" id="doneBtn">'+(isDone?'✓ Completed':'Mark complete')+'</button>';
  h+='<button class="btn ghost" id="nextBtn"'+(cur===DAYS.length-1?' disabled':'')+'>Next →</button>';
  h+='</div>';
  col.innerHTML=h;

  if($('mobTitle'))$('mobTitle').textContent=d.n===0?'Start Here':'Day '+d.n;
  // wire quiz
  if(d.quiz){
    const saved=S.quiz[d.n];
    col.querySelectorAll('.opt').forEach(btn=>{
      btn.onclick=()=>answer(+btn.dataset.i,d);
    });
    if(saved!=null)revealQuiz(d,saved,true);
  }
  $('prevBtn').onclick=()=>{if(cur>0)go(cur-1)};
  $('nextBtn').onclick=()=>{if(cur<DAYS.length-1)go(cur+1)};
  $('doneBtn').onclick=()=>{toggleDone(d)};
  window.scrollTo(0,0);$('main').scrollTop=0;
  paintPips();
}
function answer(i,d){
  if(S.quiz[d.n]!=null)return;
  S.quiz[d.n]=i;store.write(S);
  revealQuiz(d,i,false);
}
function revealQuiz(d,chosen,restore){
  const opts=document.querySelectorAll('#quizBox .opt');
  opts.forEach((b,i)=>{
    b.disabled=true;
    if(i===d.quiz.answer)b.classList.add('correct');
    if(i===chosen&&chosen!==d.quiz.answer)b.classList.add('wrong');
  });
  const ex=$('explain');
  const right=chosen===d.quiz.answer;
  ex.innerHTML='<b>'+(right?'Correct.':'Not quite.')+'</b> '+d.quiz.explain;
  ex.classList.add('show');
}
function toggleDone(d){
  const i=S.done.indexOf(d.n);
  if(i>=0)S.done.splice(i,1);else S.done.push(d.n);
  store.write(S);updateProg();render();
}
function go(idx){showingRef=null;cur=idx;render();closeRail();}
function goRef(which){showingRef=which;renderRef();closeRail();}
/* Answer key is GENERATED from DAYS so it can never drift from the inline quizzes. */
function buildAnswerKey(){
  let rows='<div class="eyebrow">Reference</div><h1 class="daytitle">Answer Key</h1>'
    +'<div class="readmeta">Every quick-check question, its answer, and why · '+DAYS.filter(d=>d.quiz).length+' items</div>'
    +'<div class="lesson"><div class="box wa"><div class="bt">■ Use this after, not during</div><p>Answering first and being wrong is what makes the explanation stick. Come here to review a phase, to check a run of answers at once, or to find the day that covers something you have forgotten — each entry links back to its source day.</p></div></div>';
  PHASES.forEach(ph=>{
    const items=DAYS.filter(d=>d.quiz&&d.n>=ph.range[0]&&d.n<=ph.range[1]);
    if(!items.length)return;
    rows+='<h2 class="akph">'+ph.label+'</h2>';
    items.forEach(d=>{
      const i=DAYS.findIndex(x=>x.n===d.n);
      rows+='<div class="ak"><div class="akd" data-goto="'+i+'">Day '+d.n+' · '+d.title+'</div>'
          +'<div class="akq">'+d.quiz.q+'</div>'
          +'<div class="aka"><strong>'+String.fromCharCode(65+d.quiz.answer)+'.</strong> '+d.quiz.options[d.quiz.answer]+'</div>'
          +'<div class="akw">'+d.quiz.explain+'</div></div>';
    });
  });
  return rows;
}
function renderRef(){
  if(showingRef==='answers'){
    $('col').innerHTML=buildAnswerKey();
    $('col').querySelectorAll('.akd').forEach(el=>{
      el.setAttribute('role','button');el.setAttribute('tabindex','0');
      const jump=()=>go(+el.dataset.goto);
      el.onclick=jump;
      el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();jump();}};
    });
    if($('mobTitle'))$('mobTitle').textContent='Answer Key';
    window.scrollTo(0,0);$('main').scrollTop=0;paintPips();return;
  }
  if(!CHEAT)return;
  $('col').innerHTML='<div class="eyebrow">Reference</div><h1 class="daytitle">'+CHEAT.title+'</h1><div class="readmeta">'+(CHEAT.sub||'')+'</div><div class="lesson">'+CHEAT.body+'</div>';
  if($('mobTitle'))$('mobTitle').textContent='Cheat Sheet';
  window.scrollTo(0,0);$('main').scrollTop=0;paintPips();
}
function closeRail(){$('rail').classList.remove('open');$('scrim').classList.remove('on');}

// mobile
$('menuBtn')&&($('menuBtn').onclick=()=>{$('rail').classList.add('open');$('scrim').classList.add('on');});
$('scrim')&&($('scrim').onclick=closeRail);

(async()=>{
  S=await store.read();
  buildPips();updateProg();render();
})();
</script>
