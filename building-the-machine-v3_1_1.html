<style>
:root{
  --bg:#0E1116; --panel:#161B22; --panel2:#1B222C; --edge:#26303B;
  --ink:#D7DEE6; --muted:#8B98A6; --faint:#78848F;
  --signal:#33C2CE; --signal-dim:#1E7F88; --signal-glow:rgba(51,194,206,.16);
  --green:#57B98A; --green-bg:rgba(87,185,138,.10);
  --amber:#E0A32E; --amber-bg:rgba(224,163,46,.10);
  --red:#E5675B; --red-bg:rgba(229,103,91,.10);
  --violet:#9A86F0; --violet-bg:rgba(154,134,240,.10);
  --code-bg:#0A0D12; --code-edge:#1E2732;
  /* DESIGN SYSTEM — deliberate decision, not drift.
     Building the Machine and Taming the Machine are two volumes of ONE course.
     They therefore SHARE the type system (below) and differ only in palette:
     BTM runs cool graphite + teal signal; TTM runs warm graphite + ember.
     Palette carries the volume identity; typography carries the product identity.
     Any change to these three variables must be mirrored in the sibling file. */
  --disp:'Space Grotesk',ui-sans-serif,system-ui,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --body:'Newsreader',ui-serif,Georgia,Cambria,'Times New Roman',serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
  --rail:300px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.72;-webkit-font-smoothing:antialiased}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ---------- Layout ---------- */
.wrap{display:flex;min-height:100vh}
.rail{width:var(--rail);flex:0 0 var(--rail);background:linear-gradient(180deg,#10151B,#0C1015);border-right:1px solid var(--edge);position:sticky;top:0;height:100vh;overflow-y:auto;padding:22px 18px 40px}
.main{flex:1;min-width:0;display:flex;justify-content:center;padding:38px 30px 120px}
.col{width:100%;max-width:760px}

/* ---------- Rail ---------- */
.brand{font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:-.01em;color:var(--ink);line-height:1.2}
.brand .b2{display:block;font-size:11.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--signal);margin-top:8px}
.trace{height:34px;margin:14px 0 6px}
.edition{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.08em;margin-bottom:16px}
.progwrap{margin:14px 0 20px}
.progmeta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.06em;margin-bottom:6px}
.progbar{height:6px;background:#0A0E13;border-radius:6px;overflow:hidden;border:1px solid var(--edge)}
.progfill{height:100%;width:0;background:linear-gradient(90deg,var(--signal-dim),var(--signal));border-radius:6px;transition:width .4s ease}
.phase-label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:16px 0 3px;padding-left:2px}
.phase-load{font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;color:var(--faint);opacity:.85;margin:0 0 8px;padding-left:2px}
.pips{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.pip{aspect-ratio:1;border:1px solid var(--edge);background:var(--panel);border-radius:7px;color:var(--muted);font-family:var(--mono);font-size:12px;font-weight:500;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .12s,border-color .15s,background .15s;user-select:none}
.pip:hover{transform:translateY(-2px);border-color:var(--signal-dim);color:var(--ink)}
.pip.on{border-color:var(--signal);color:var(--bg);background:var(--signal);box-shadow:0 0 0 3px var(--signal-glow)}
.pip.done{border-color:var(--green);color:var(--green)}
.pip.done.on{background:var(--signal);color:var(--bg);border-color:var(--signal)}
.pip.zero{color:var(--violet);border-color:#2c2743}
.pip.cs{grid-column:span 2;aspect-ratio:auto;padding:9px 0;border-color:var(--amber);color:var(--amber);border-radius:7px;font-size:11px;letter-spacing:.1em}
.pip.cs.on{background:var(--amber);color:var(--bg)}

/* ---------- Content ---------- */
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--signal);margin-bottom:12px}
.eyebrow .sep{color:var(--faint);margin:0 8px}
h1.daytitle{font-family:var(--disp);font-weight:700;font-size:34px;line-height:1.12;letter-spacing:-.02em;margin:0 0 6px;color:#EAF0F5}
.readmeta{font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:26px;letter-spacing:.03em}
.lesson{font-size:18.5px}
.lesson p{margin:0 0 17px}
.lesson h2{font-family:var(--disp);font-weight:600;font-size:22px;letter-spacing:-.01em;color:#E4EBF1;margin:34px 0 12px;padding-top:6px}
.lesson h3{font-family:var(--disp);font-weight:600;font-size:17px;color:var(--signal);margin:24px 0 8px;letter-spacing:.01em}
.lesson strong{color:#F0F5F9;font-weight:600}
.lesson em{color:#E8EEF3}
.lesson ul,.lesson ol{margin:0 0 18px;padding-left:22px}
.lesson li{margin:0 0 9px}
.lesson a{color:var(--signal);text-decoration:none;border-bottom:1px solid var(--signal-dim)}
.lesson a:hover{border-bottom-color:var(--signal)}
code{font-family:var(--mono);font-size:.82em;background:#11161d;border:1px solid var(--code-edge);border-radius:4px;padding:1px 6px;color:#9FE6EE}
pre{background:var(--code-bg);border:1px solid var(--code-edge);border-left:3px solid var(--signal-dim);border-radius:8px;padding:16px 18px;overflow-x:auto;margin:0 0 20px}
pre code{background:none;border:none;padding:0;font-size:13.5px;line-height:1.62;color:#C6D2DD}
.cm{color:#5f7181}.kw{color:#c58af0}.st{color:#8fd694}.fn{color:#7fd7e0}.nu{color:#e0a36a}

/* boxes */
.box{border-radius:9px;padding:15px 18px 16px;margin:0 0 22px;border:1px solid var(--edge);background:var(--panel)}
.box .bt{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;margin-bottom:7px;display:flex;align-items:center;gap:8px}
.box p:last-child{margin-bottom:0}
.box.hl{border-left:3px solid var(--signal);background:linear-gradient(90deg,var(--signal-glow),transparent 60%)}
.box.hl .bt{color:var(--signal)}
.box.an{border-left:3px solid var(--green);background:var(--green-bg)}
.box.an .bt{color:var(--green)}
.box.wa{border-left:3px solid var(--amber);background:var(--amber-bg)}
.box.wa .bt{color:var(--amber)}
.box.gov{border-left:3px solid var(--violet);background:var(--violet-bg)}
.box.gov .bt{color:var(--violet)}
.box.field{border-left:3px solid var(--red);background:var(--red-bg)}
.box.field .bt{color:var(--red)}

/* vocab table */
table.vocab{width:100%;border-collapse:collapse;margin:0 0 22px;font-size:15.5px}
table.vocab th{text-align:left;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--edge);padding:8px 10px}
table.vocab td{border-bottom:1px solid #1b2027;padding:10px;vertical-align:top}
table.vocab td:first-child{color:var(--signal);font-family:var(--mono);font-size:13px;white-space:nowrap;width:34%}

/* quiz */
.quiz{border:1px solid var(--edge);border-radius:11px;background:var(--panel2);padding:20px 20px 8px;margin:30px 0 8px}
.quiz .qh{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);margin-bottom:10px}
.quiz .qq{font-family:var(--disp);font-weight:500;font-size:17px;color:#EAF0F5;margin-bottom:14px;line-height:1.4}
.opt{display:block;width:100%;text-align:left;font-family:var(--body);font-size:16px;color:var(--ink);background:var(--panel);border:1px solid var(--edge);border-radius:8px;padding:11px 14px;margin-bottom:9px;cursor:pointer;transition:border-color .14s,background .14s}
.opt:hover{border-color:var(--signal-dim)}
.opt .ol{font-family:var(--mono);font-size:12px;color:var(--muted);margin-right:10px}
.opt.correct{border-color:var(--green);background:var(--green-bg)}
.opt.correct .ol{color:var(--green)}
.opt.wrong{border-color:var(--red);background:var(--red-bg)}
.opt.wrong .ol{color:var(--red)}
.opt:disabled{cursor:default}
.explain{font-size:15.5px;color:var(--muted);border-top:1px solid var(--edge);margin-top:6px;padding:14px 2px 12px;display:none}
.explain.show{display:block}
.explain b{color:var(--green)}

/* nav */
.nav{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:40px;padding-top:24px;border-top:1px solid var(--edge)}
.btn{font-family:var(--disp);font-weight:600;font-size:14px;padding:11px 20px;border-radius:9px;border:1px solid var(--edge);background:var(--panel);color:var(--ink);cursor:pointer;transition:border-color .14s,background .14s,transform .1s}
.btn:hover{border-color:var(--signal-dim);transform:translateY(-1px)}
.btn:disabled{opacity:.35;cursor:default;transform:none}
.btn.prime{background:var(--signal);border-color:var(--signal);color:#06222a}
.btn.prime:hover{background:#42d3df}
.btn.ghost{background:transparent}

.mobbar{display:none}
@media (max-width:860px){
  .rail{position:fixed;left:0;top:0;z-index:40;transform:translateX(-100%);transition:transform .25s;width:280px}
  .rail.open{transform:translateX(0)}
  .main{padding:70px 18px 120px}
  .col{max-width:100%}
  h1.daytitle{font-size:27px}
  .lesson{font-size:17.5px}
  .mobbar{display:flex;position:fixed;top:0;left:0;right:0;height:52px;background:var(--panel);border-bottom:1px solid var(--edge);align-items:center;gap:12px;padding:0 14px;z-index:30}
  .mobbar button{background:var(--panel2);border:1px solid var(--edge);color:var(--ink);border-radius:8px;padding:7px 12px;font-family:var(--mono);font-size:12px;cursor:pointer}
  .mobbar .mt{font-family:var(--disp);font-weight:600;font-size:13px;color:var(--signal)}
  .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:35}
  .scrim.on{display:block}
}

/* ── Answer key (generated from DAYS) ───────────────────────────── */
.pip.ak{grid-column:span 2;aspect-ratio:auto;padding:9px 0;border-color:var(--violet);color:var(--violet);border-radius:7px;font-size:11px;letter-spacing:.08em}
.pip.ak.on{background:var(--violet);color:var(--bg)}
.akph{font-family:var(--disp);font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--violet);margin:30px 0 12px;padding-bottom:7px;border-bottom:1px solid var(--edge)}
.ak{border:1px solid var(--edge);border-left:3px solid var(--violet);border-radius:0 9px 9px 0;background:var(--panel);padding:14px 17px;margin:0 0 13px}
.ak .akd{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--violet);margin-bottom:7px;cursor:pointer;display:inline-block;border-bottom:1px dashed transparent}
.ak .akd:hover,.ak .akd:focus-visible{border-bottom-color:var(--violet)}
.ak .akq{font-family:var(--disp);font-weight:600;font-size:15.5px;color:var(--ink);margin-bottom:9px;line-height:1.45}
.ak .aka{font-size:15px;line-height:1.6;color:var(--green);background:var(--green-bg);border-radius:7px;padding:9px 12px;margin-bottom:9px}
.ak .akw{font-size:14.5px;line-height:1.62;color:var(--muted)}

/* ── Keyboard focus (pips and answer-key links are role=button divs) ─ */
.pip:focus-visible,.akd:focus-visible,.opt:focus-visible,.btn:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

/* ── Print: cheat sheet, answer key and interview bank are printable ─ */
@media print{
  #rail,#scrim,.topbar,.nav,.quiz .opt,#menuBtn{display:none !important}
  #main{overflow:visible !important;height:auto !important}
  html,body{background:#fff !important;color:#111 !important}
  #col{max-width:none !important;padding:0 !important}
  h1,h2,h3,.daytitle,.akq,.iqq{color:#111 !important}
  .box,.ak,.iq,pre,table{page-break-inside:avoid;break-inside:avoid;background:#f7f7f7 !important;border-color:#bbb !important}
  .lesson p,.ak .akw,.iq .iqa{color:#222 !important}
  pre code,pre code span{color:#111 !important}
  a::after{content:" (" attr(href) ")";font-size:10px;color:#555}
  .akph{page-break-after:avoid}
}
</style>

<div class="wrap">

    <svg class="trace" viewBox="0 0 260 34" preserveAspectRatio="none" aria-hidden="true">

      <div class="progmeta"><span id="pmDays">0 / 60 days</span><span id="pmPct">0%</span></div>

<script>
/* ============================================================
   BUILDING THE MACHINE — render engine
   ============================================================ */
const PHASES=[
  {label:"Start Here",range:[0,0],load:"1 day · ~1 hr"},
  {label:"P1 · Foundations",range:[1,10],load:"10 days · ~5 hr · one 2 hr lab (d10)"},
  {label:"P2 · Classical ML",range:[11,24],load:"14 days · ~7 hr · one 3 hr capstone (d24)"},
  {label:"P3 · Evaluation & Fairness",range:[25,36],load:"12 days · ~7 hr · one 4 hr lab (d36)"},
  {label:"P4 · Deep Learning",range:[37,48],load:"12 days · ~7 hr · one 3 hr lab (d48)"},
  {label:"P5 · LLMs & GenAI",range:[49,56],load:"8 days · ~5 hr · one 3 hr lab (d56)"},
  {label:"P6 · Deploy & Govern",range:[57,60],load:"4 days · ~9 hr · 6 hr capstone (d60)"},
];
const DAYS=[
{n:0,title:"Build Your Portfolio First",read:"Setup · 15 min read · ~45 min hands-on · no experience needed",body:`
<p>Before you learn a single thing about machine learning, you're going to build the place where your work will live. Every lab, every model, every audit you produce in the next 60 days becomes <strong>evidence</strong> — proof to an employer, a hiring manager, or the engineering team you'll one day govern that you don't just talk about AI, you've had your hands in it.</p>
<p>That evidence lives on <strong>GitHub</strong>. If you've never touched it, good — I'll assume you've never seen a line of code or a "repo" in your life, and we'll go slowly.</p>

<div class="box an"><div class="bt">◆ Analogy</div><p>Think of GitHub as a <strong>public filing cabinet with your name on it</strong>. Anyone you hand the link to can open a drawer and see your work, neatly labeled. A résumé <em>claims</em> you can audit a model for bias. A GitHub portfolio <em>shows</em> the audit. In our field, showing beats claiming every time.</p></div>

<div class="box wa"><div class="bt">■ What this actually costs — read before Day 1</div><p>This is a 60-day course in structure and roughly <strong>41 hours of work</strong> in substance. Budget <strong>4&ndash;5 hours a week over nine weeks</strong>. Most days are a 15-minute lesson you can do over coffee; the load is concentrated in six major labs and capstones.</p><p><strong>Plan around these:</strong> Day 10 (~2 hr), Day 24 (~3 hr), Day 36 (~4 hr), Day 48 (~3 hr), Day 56 (~3 hr) and Day 60 (~6 hr). Each produces a portfolio deliverable. Every day's header carries its own estimate, and each phase in the sidebar shows its total and where the heavy days fall.</p><p>If you go on to <em>Taming the Machine</em>, know that the sequel is roughly twice this — about 94 hours — because writing assessments is slower than learning concepts.</p></div>

<h2>What GitHub actually is</h2>
<p>GitHub is a website that stores folders of files (called <strong>repositories</strong>, or "repos") and shows them to the world in a clean, organized way. That's the whole idea for now. Later, engineers use it for complicated version-tracking; you don't need any of that yet. You need three skills: <strong>make a repo, upload files into folders, and write a short note explaining each one.</strong> That's it.</p>

<div class="box hl"><div class="bt">▲ Why this matters for a governance analyst</div><p>You will spend your career reviewing other people's models. The teams you challenge will sometimes assume a "compliance person" doesn't understand the technology. A portfolio where <em>you</em> trained a classifier, measured its bias, and wrote up the finding erases that assumption in about ten seconds. It is the single most credible thing you can carry into that room.</p></div>

<h2>Step 1 — Create a free account</h2>
<ol>
<li>Go to <strong>github.com</strong> and click <strong>Sign up</strong>.</li>
<li>Use a professional username — <code>jsmith-aigov</code>, not <code>xX_darklord_Xx</code>. This becomes part of your public link.</li>
<li>Pick the <strong>Free</strong> plan. You never need to pay for anything in this course.</li>
<li>Verify your email. Done.</li>
</ol>

<h2>Step 2 — Create your portfolio repository</h2>
<ol>
<li>Click the <strong>+</strong> in the top-right corner → <strong>New repository</strong>.</li>
<li><strong>Repository name:</strong> <code>building-the-machine-portfolio</code></li>
<li><strong>Description:</strong> "My hands-on machine learning &amp; AI governance work — 60-day practitioner course."</li>
<li>Set it to <strong>Public</strong> (the whole point is that people can see it).</li>
<li>Check the box <strong>Add a README file</strong>. This creates your front page automatically.</li>
<li>Click <strong>Create repository</strong>.</li>
</ol>
<p>You now own a public portfolio. The link looks like <code>github.com/your-username/building-the-machine-portfolio</code>. That link goes on your résumé and LinkedIn.</p>

<h2>Step 3 — The folder structure we'll use</h2>
<p>Not every day produces a file. About <strong>six days</strong> in this course end in a <em>Deliverable</em> — a real notebook or audit you'll save. Each one gets its own folder, named with its day number so it sorts neatly. Here's the exact structure. Don't build it all now; you'll create each folder the day you need it.</p>
<pre><code>building-the-machine-portfolio/
├── README.md                         <span class="cm">← your portfolio front page</span>
├── day-10-foundations-lab/
│   ├── notebook.ipynb                <span class="cm">← the Colab file you download</span>
│   ├── WHAT-I-LEARNED.md             <span class="cm">← your reflection (template below)</span>
│   └── assets/                       <span class="cm">← charts, screenshots</span>
├── day-24-first-classifier/
├── day-36-bias-audit/
├── day-48-neural-network/
├── day-56-llm-eval/
└── day-60-capstone-audit/</code></pre>

<div class="box wa"><div class="bt">■ Common beginner mistake</div><p>Don't dump everything in the top level with names like <code>final2_REAL.ipynb</code>. A messy repo reads as messy thinking. The folder-per-deliverable structure <em>is</em> part of what you're demonstrating: that you organize evidence like a professional.</p></div>

<h2>Step 4 — How to upload files (no software to install)</h2>
<p>You do this entirely in your web browser — nothing to install on a locked-down work laptop. To create a folder <em>and</em> put a file in it at the same time:</p>
<ol>
<li>On your repo page, click <strong>Add file</strong> → <strong>Create new file</strong>.</li>
<li>In the filename box, type the folder and file together with a slash: <code>day-10-foundations-lab/WHAT-I-LEARNED.md</code>. The slash tells GitHub to make the folder automatically.</li>
<li>Paste your content in the big box below.</li>
<li>Scroll down, click <strong>Commit changes</strong> ("commit" just means "save").</li>
</ol>
<p>To upload a file you already have (like a notebook downloaded from Colab): open the folder, click <strong>Add file → Upload files</strong>, then drag the file in and commit.</p>

<h2>Step 5 — The "What I Learned" template</h2>
<p>Every deliverable folder gets a <code>WHAT-I-LEARNED.md</code> file. The <code>.md</code> means <strong>Markdown</strong> — a plain-text format where <code>#</code> makes a heading and <code>-</code> makes a bullet. GitHub turns it into a nice page automatically. Copy this template exactly and fill it in each time:</p>
<pre><code><span class="kw"># Day XX — [Title of the Deliverable]</span>

<span class="kw">**Date completed:**</span> 2026-07-15
<span class="kw">**Phase:**</span> [e.g., Phase 2 — Classical ML]
<span class="kw">**Tools used:**</span> Python, pandas, scikit-learn, Google Colab

<span class="kw">## What I built</span>
One or two sentences describing what this notebook actually does.

<span class="kw">## What I learned</span>
- Key concept #1, in my own words.
- Key concept #2.
- A mistake I made and how I fixed it.

<span class="kw">## Why it matters for AI governance</span>
Two or three sentences connecting this work to a real governance
task — an audit, a risk, or a framework (NIST AI RMF, ISO 42001,
EU AI Act, etc.).

<span class="kw">## What I'd check if I were governing this model</span>
- A question I would ask the team that built it.
- A risk I would want documented.</code></pre>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>That last section — "what I'd check if I were governing this model" — is the one that separates you from a bootcamp graduate. Anyone can train a model. You're learning to train one <em>and then interrogate it</em>. Write that section like the auditor you're becoming.</p></div>

<h2>Step 6 — Write your README front page</h2>
<p>Your repo already has a <code>README.md</code>. Open it, click the pencil ✎ to edit, and replace it with something like this:</p>
<pre><code><span class="kw"># Building the Machine — My AI Governance Portfolio</span>

Hands-on machine learning and deep learning work completed as part
of a 60-day AI governance practitioner course. Each folder contains
a working notebook, my reflection, and a governance perspective.

<span class="kw">## Deliverables</span>

{n:1,title:"What Machine Learning Actually Is",read:"Lesson · 14 min read",body:`
<p>Welcome to Day 1. By the end of today you'll have written and run your first line of real code, and you'll understand — precisely, not vaguely — what makes a machine learning system different from ordinary software. That distinction is the root of almost every governance risk you'll ever assess, so we start here.</p>

<h2>Ordinary software: humans write the rules</h2>
<p>Traditional software is a stack of rules a human wrote by hand. A tax program says: <em>if income is over this amount, apply that rate.</em> Somebody typed those rules. If the program does something wrong, you can open it, find the rule, and read exactly why. The logic is <strong>visible and auditable by design</strong>.</p>
<pre><code><span class="kw">def</span> <span class="fn">approve_loan</span>(income, debt):
    <span class="kw">if</span> income &gt; 50000 <span class="kw">and</span> debt &lt; 10000:
        <span class="kw">return</span> <span class="st">"approve"</span>
    <span class="kw">return</span> <span class="st">"deny"</span></code></pre>
<p>You can see the whole policy. Every decision traces back to a rule a person can defend.</p>

<h2>Machine learning: the machine writes the rules</h2>
<p>Machine learning flips this. Instead of writing the rules, you show the machine <strong>thousands of past examples</strong> — loan applications and whether each was repaid — and the machine figures out the rules <em>itself</em> by finding patterns. You never write "if income &gt; 50000." The model derives its own version of that logic from the data.</p>

<div class="box an"><div class="bt">◆ Analogy</div><p>Ordinary software is a recipe someone wrote: exact steps, in order. Machine learning is a cook who tasted ten thousand dishes and learned what "good" tastes like — but can't fully explain the recipe. Ask why they added more salt and you get "it felt right." That gap between <em>a decision</em> and <em>a stated reason</em> is the entire reason your job exists.</p></div>

<h2>Why this is the root of governance risk</h2>
<p>Because the machine wrote the rules, three uncomfortable things follow:</p>
<ul>
<li><strong>The logic can be opaque.</strong> The "rules" are millions of numbers, not readable sentences. This is the black-box problem.</li>
<li><strong>The model inherits whatever is in the data.</strong> If past loan officers discriminated, the patterns in the data encode that discrimination — and the model learns it faithfully, calling it "signal."</li>
<li><strong>"The model learned it" is not a defense.</strong> A model reflecting biased history isn't neutral just because no human wrote the biased rule. Someone <em>chose</em> the data, the target, and the threshold. We'll spend weeks on exactly who owns those choices.</li>
</ul>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>The NIST AI Risk Management Framework exists precisely because ML systems don't behave like rule-based software. You can't audit a model by reading its rules — there are none to read. You audit it by examining its <em>data</em>, its <em>objective</em>, and its <em>measured behavior across groups</em>. Those three lenses are the spine of this course.</p></div>

<h2>The three broad kinds of ML</h2>
<p>You'll hear these constantly, so meet them now:</p>
<ul>
<li><strong>Supervised learning</strong> — learning from labeled examples (applications <em>with</em> known outcomes). The vast majority of high-stakes decision systems. Most of our course.</li>
<li><strong>Unsupervised learning</strong> — finding structure in data with no labels (grouping customers). Useful, lower-stakes, we'll touch it.</li>
<li><strong>Reinforcement learning</strong> — learning by trial and reward (game-playing, some robotics, and part of how chatbots get tuned). We'll meet it when we reach LLMs.</li>
</ul>

<h2>Your first line of code</h2>
<p>Open a new tab and go to <strong>colab.research.google.com</strong> — Google Colab, a free coding environment that runs in your browser. Nothing to install. Click <strong>New notebook</strong>, click into the grey cell, type this, and press <strong>Shift+Enter</strong> to run it:</p>
<pre><code><span class="kw">print</span>(<span class="st">"I am building the machine."</span>)</code></pre>
<p>The line below the cell is your program's output. That's it — you've run code. Tomorrow we map the full lifecycle of a model from idea to deployment, and where you, the governance analyst, plug in at every stage.</p>

<div class="box wa"><div class="bt">■ Watch for</div><p>People say "the AI decided." There is no "the AI." There's a dataset someone assembled, an objective someone defined, and a threshold someone set. Train yourself to replace "the AI decided" with "whose choices produced this?" — that question is your whole toolkit in four words.</p></div>
`,
quiz:{q:"What is the fundamental difference between machine learning and traditional software?",options:["ML always requires far more computing power than any traditional software system could ever need","Traditional software can only run on servers, while ML models run exclusively in the cloud","ML systems are simply traditional software that has been rewritten in a different programming language","In traditional software humans write the rules; in ML the machine derives the rules from data examples"],answer:3,explain:"Traditional software executes rules a human wrote and can read back. ML infers its own rules from example data — which is why the logic can be opaque and why the model inherits whatever biases live in that data."}},

{n:2,title:"The Machine Learning Lifecycle",read:"Lesson · 15 min read",body:`
<p>A model isn't a moment; it's a <strong>lifecycle</strong>. Understanding the stages tells you exactly where risk enters and where you, the governance analyst, must be standing to catch it. Miss a stage and you're auditing the smoke instead of the fire.</p>

<h2>The six stages</h2>
<ol>
<li><strong>Frame the problem.</strong> Someone decides what the model should predict and defines "success." This is the most under-audited stage and often where the deepest harm is designed in.</li>
<li><strong>Collect &amp; prepare data.</strong> Gather examples, clean them, choose which features to include. Bias overwhelmingly enters here.</li>
<li><strong>Train the model.</strong> The algorithm finds patterns that connect the features to the outcome.</li>
<li><strong>Evaluate.</strong> Measure how well it performs — overall <em>and</em> per group. This is where fairness is proven or disproven.</li>
<li><strong>Deploy.</strong> Put the model into real decisions affecting real people.</li>
<li><strong>Monitor.</strong> Watch it over time, because the world changes and models silently rot.</li>
</ol>

<div class="box an"><div class="bt">◆ Analogy</div><p>It's like building and running a bridge. Framing is deciding where the bridge goes and how much weight it must hold. Data and training are the materials and construction. Evaluation is the load test. Deployment is opening it to traffic. Monitoring is the inspector who comes back every year — because a bridge that passed inspection in 2020 can be unsafe by 2026. Models rot the same way.</p></div>

<h2>Where governance plugs in at each stage</h2>
<table class="vocab">
<tr><th>Stage</th><th>Your governance question</th></tr>
<tr><td>Frame</td><td>What exactly is being predicted, and is that a fair and lawful thing to predict at all?</td></tr>
<tr><td>Data</td><td>Where did it come from? Who's over- or under-represented? What history is baked in?</td></tr>
<tr><td>Train</td><td>What is the model optimizing for, and what does that objective ignore?</td></tr>
<tr><td>Evaluate</td><td>How does performance differ across protected groups? What was the threshold and who set it?</td></tr>
<tr><td>Deploy</td><td>Is there human oversight? Can a person appeal or reverse a decision?</td></tr>
<tr><td>Monitor</td><td>How will we know if it drifts or degrades? Who's watching, and how often?</td></tr>
</table>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>This lifecycle maps almost one-to-one onto the NIST AI RMF functions — <strong>Govern, Map, Measure, Manage</strong>. "Map" is framing and data. "Measure" is evaluation and monitoring. "Manage" is deployment decisions and mitigation. When an engineer shows you a model, silently locate which lifecycle stage you're being shown — and ask what happened in the stages they're <em>not</em> showing you.</p></div>

<h2>The most dangerous stage is the first</h2>
<p>Everyone wants to audit the algorithm. But the gravest problems are usually designed in at <strong>framing</strong>. If a hiring model is framed as "predict who resembles our current high performers," and your current high performers are 90% one demographic, no amount of clever math downstream saves you — the objective itself encodes the bias. You learned nothing wrong; the system learned exactly what it was told to.</p>

<div class="box wa"><div class="bt">■ Watch for</div><p>When a team is proud of a model's accuracy, your first question is not "how accurate?" It's "<em>accurate at predicting what, exactly, and who decided that was the right thing to predict?</em>" Accuracy at the wrong target is precision-guided harm.</p></div>

<h2>Today's takeaway</h2>
<p>A model has a life story. Bias, error, and harm each enter at specific chapters. Your job is to read the whole story — not just the exciting training chapter the data scientists want to show you. Tomorrow we get concrete about the raw material of it all: <strong>data</strong>, and how to open a real dataset with code.</p>
`,
quiz:{q:"At which lifecycle stage does the deepest, hardest-to-fix bias most often get designed in?",options:["Framing the problem (deciding what to predict and what 'success' means)","Deployment, because that's the only stage where the model interacts with real people","Monitoring, since that's the sole point where degraded performance becomes visible","Training the algorithm, where the optimizer's math choices introduce all the error"],answer:0,explain:"If the objective itself is flawed — e.g., 'predict who resembles our mostly-homogeneous current staff' — every downstream stage faithfully amplifies it. Framing is the least-audited and highest-leverage stage."}},

{n:3,title:"Data — The Raw Material of Every Model",read:"Lesson · 16 min read",body:`
<p>Models are downstream of data the way a river is downstream of its source. Poison the source and every stretch of river is poisoned, no matter how clean the banks look. Today you learn the anatomy of a dataset and how to open one with Python. This is where the math and coding start folding in — gently.</p>

<h2>The shape of data: rows and columns</h2>
<p>Almost all the data you'll audit arrives as a <strong>table</strong> — rows and columns, like a spreadsheet.</p>
<ul>
<li>Each <strong>row</strong> is one example — one person, one loan, one transaction.</li>
<li>Each <strong>column</strong> is one <strong>feature</strong> — one measured attribute (age, income, zip code).</li>
<li>One special column is the <strong>label</strong> (or <strong>target</strong>) — the thing we want to predict (repaid: yes/no).</li>
</ul>

<div class="box an"><div class="bt">◆ Analogy</div><p>A dataset is a classroom roster. Each row is a student; each column is something you know about them (grade, attendance, test score). The label is the thing you're trying to predict — say, "will pass the year." The model's job is to learn which columns predict that label. Your job is to ask whether any of those columns is really a stand-in for something you're not allowed to use.</p></div>

<h2>Features and labels, precisely</h2>
<p>We write this relationship as <strong>features → label</strong>, or in the notation you'll see everywhere, <strong>X → y</strong>. Capital <em>X</em> is the block of feature columns (the inputs). Lowercase <em>y</em> is the single label column (the answer). The model learns a function that maps X to y. Burn that in: <strong>X is what the model knows; y is what it's guessing.</strong></p>

<h2>Opening a real dataset in Python</h2>
<p>We use a tool called <strong>pandas</strong> — the standard Python library for tables. In Colab, pandas is already installed. A table loaded into pandas is called a <strong>DataFrame</strong>, usually named <code>df</code>. Run this in a fresh Colab cell:</p>
<pre><code><span class="kw">import</span> pandas <span class="kw">as</span> pd

<span class="cm"># A tiny loan dataset, typed out so you can see every value</span>
data = {
    <span class="st">'age'</span>: [25, 45, 33, 52, 29],
    <span class="st">'income'</span>: [30000, 85000, 52000, 61000, 28000],
    <span class="st">'zip'</span>: [<span class="st">'11205'</span>, <span class="st">'10021'</span>, <span class="st">'11205'</span>, <span class="st">'10021'</span>, <span class="st">'11205'</span>],
    <span class="st">'repaid'</span>: [1, 1, 0, 1, 0]   <span class="cm"># 1 = yes, 0 = no  &lt;- this is y</span>
}
df = pd.DataFrame(data)
<span class="kw">print</span>(df)</code></pre>
<p>You just loaded a dataset. <code>age</code>, <code>income</code>, and <code>zip</code> are features (X). <code>repaid</code> is the label (y).</p>

<h2>The first three things to check on any dataset</h2>
<p>Before anyone trains anything, a governance analyst looks at:</p>
<ol>
<li><strong>How big is it?</strong> Five rows can't support a fair model for a million people. Run <code>df.shape</code> — it tells you (rows, columns).</li>
<li><strong>What are the columns, really?</strong> Run <code>df.columns</code>. Then ask, of each one: <em>should this legally and ethically influence the decision?</em></li>
<li><strong>Who's in it — and who isn't?</strong> A dataset is a sample of the world. If a group barely appears, the model will be worst exactly for them, and no headline accuracy number reveals it.</li>
</ol>

<div class="box wa"><div class="bt">■ Watch for that <code>zip</code> column</div><p>Notice <code>zip</code> sitting quietly among the features. Zip code correlates strongly with race and income in the US. A model using zip can discriminate by race <em>without ever seeing race</em>. This is a <strong>proxy variable</strong>, and it's one of the most common ways bias sneaks past a naive review. We devote a full day to it soon — for now, just notice how innocent it looks in the table.</p></div>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>"Garbage in, garbage out" is the oldest line in computing, but in AI governance it's a compliance principle. The EU AI Act's data-governance requirements (Article 10) demand that training data be relevant, representative, and examined for bias. That's not a technical nicety — it's a legal obligation you may one day have to evidence. Learning to <em>open and inspect data yourself</em> is how you verify it instead of taking a vendor's word.</p></div>

<h2>Today's takeaway</h2>
<p>Data is rows (examples) and columns (features), with one column as the label. X → y. And hidden among innocent-looking columns are proxies that can carry bias invisibly. Tomorrow we go deeper into pandas and actually <em>interrogate</em> a dataset — counting, slicing, and summarizing it the way an auditor would.</p>
`,
quiz:{q:"In a dataset, what is a 'proxy variable' and why does it matter?",options:["A feature that stands in for a protected attribute (like zip code for race), letting a model discriminate without seeing the protected attribute directly","A backup copy of the dataset kept in reserve in case the original file is corrupted or deleted mid-training, protecting the run from having to start over","A column made up largely of missing or null values, which the model quietly ignores during training and which therefore contributes nothing to its predictions","The specific label or target column that the model is trained to predict from all the other features in the table, sometimes called the outcome variable"],answer:0,explain:"A proxy correlates with a protected characteristic. A model using zip code can effectively discriminate by race even though 'race' never appears as a column — which is exactly why removing the protected column alone does not make a model fair."}},

{n:4,title:"Interrogating a Dataset with pandas",read:"Lesson · 17 min read",body:`
<p>Yesterday you opened a dataset. Today you learn to <strong>question</strong> one — the exact moves an analyst makes in the first ten minutes of looking at any data. These few commands will serve you for your entire career, so run each one in Colab as we go. We'll keep building on the loan DataFrame <code>df</code> from Day 3.</p>

<h2>The four-command opening inspection</h2>
<h3>1. <code>df.head()</code> — look at the top rows</h3>
<pre><code>df.head()   <span class="cm"># shows the first 5 rows by default</span></code></pre>
<p>Always look before you calculate. You catch obvious problems — blank cells, impossible values, a column that's all zeros — with your eyes in seconds.</p>

<h3>2. <code>df.describe()</code> — the numeric summary</h3>
<pre><code>df.describe()</code></pre>
<p>This prints, for every numeric column: the count, mean (average), standard deviation (spread), min, max, and the quartiles. It's your first statistical X-ray. If <code>income</code> has a max of 9,999,999, someone fat-fingered a number — or that's a millionaire skewing your average.</p>

<h3>3. <code>df['column'].value_counts()</code> — who's in here</h3>
<pre><code>df[<span class="st">'zip'</span>].value_counts()</code></pre>
<p>This counts how many rows fall into each category. It's how you check representation. If one zip code is 95% of your rows, your model will barely learn about the others — and will be least reliable exactly where data is thinnest.</p>

<h3>4. <code>df.isnull().sum()</code> — what's missing</h3>
<pre><code>df.isnull().sum()   <span class="cm"># counts blank cells per column</span></code></pre>
<p>Missing data is never random. If income is missing more often for one group, and the model quietly drops those rows, that group vanishes from training. The gap becomes a bias.</p>

<div class="box an"><div class="bt">◆ Analogy</div><p>These four commands are the vital-signs check a nurse runs before the doctor arrives: pulse, temperature, blood pressure, breathing. You don't diagnose from them — you <em>flag what needs a closer look</em>. An analyst who skips them is a nurse who skips the chart.</p></div>

<h2>Slicing: asking "what about just this group?"</h2>
<p>The single most important move in bias analysis is <strong>filtering the data to one group and looking again</strong>. In pandas you filter with a condition inside square brackets:</p>
<pre><code><span class="cm"># Just the rows from zip 11205</span>
group = df[df[<span class="st">'zip'</span>] == <span class="st">'11205'</span>]
<span class="kw">print</span>(group)

<span class="cm"># What fraction of THIS group repaid?</span>
<span class="kw">print</span>(group[<span class="st">'repaid'</span>].mean())</code></pre>
<p>Because <code>repaid</code> is stored as 1s and 0s, its <strong>mean is literally the repayment rate</strong> — the average of a 0/1 column is the proportion of 1s. That's a small, beautiful piece of math you'll use constantly: <em>the mean of a yes/no column is a rate.</em></p>

<div class="box hl"><div class="bt">▲ The core bias-audit motion</div><p>Compute a number for the whole dataset. Then compute the same number for each group. Then compare. Almost every fairness measurement you will ever perform is a variation of exactly that three-step motion. Today you did it with repayment rate. Later you'll do it with error rates, and the math gets no harder — only the stakes do.</p></div>

<h2>Putting it together</h2>
<pre><code><span class="cm"># Repayment rate for each zip, side by side</span>
df.groupby(<span class="st">'zip'</span>)[<span class="st">'repaid'</span>].mean()</code></pre>
<p><code>groupby</code> does the "compute-per-group" step for you in one line. If one zip shows a 0.40 repayment rate and another shows 0.85, you've found something worth a conversation — maybe a real economic difference, maybe a biased data-collection process, maybe both. The number doesn't tell you <em>why</em>; it tells you <em>where to look</em>.</p>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>When you eventually review a vendor's model, you'll ask for the training data or a data sheet. If they hand it over, these commands let you <em>independently verify</em> their representativeness claims instead of trusting a slide. An auditor who can run <code>value_counts()</code> on the actual data is worth ten who can only nod at a PowerPoint.</p></div>

<h2>Today's takeaway</h2>
<p>Four commands to inspect (<code>head</code>, <code>describe</code>, <code>value_counts</code>, <code>isnull</code>), and one motion to audit (compute overall, compute per group, compare — via <code>groupby</code>). Tomorrow we make the math underneath these numbers explicit: averages, and the sneaky ways a single average hides a disparity.</p>
`,
quiz:{q:"Why is the MEAN of a column of 1s and 0s (like 'repaid': yes=1/no=0) so useful?",options:["It automatically removes any missing values from the column before the rest of the analysis runs","It usually reorders the rows so the dataset runs from the lowest value to the highest","It forecasts what values are likely to appear in that column at some future date","The mean of a 0/1 column equals the proportion of 1s — so it directly gives you a rate you can compare across groups"],answer:3,explain:"Averaging a yes/no column gives the fraction that are 'yes' — a rate. Computing that rate overall and then per group, and comparing, is the fundamental motion behind nearly every fairness measurement."}},

{n:5,title:"Averages, and the Disparities They Hide",read:"Lesson · 16 min read",body:`
<p>Yesterday the <em>mean</em> did quiet work for us. Today we put it under a microscope, because the average is the most trusted and most misleading number in all of analytics. A model, a dashboard, and an executive summary all lean on averages — and an analyst who doesn't understand how averages lie will sign off on harm without ever seeing it.</p>

<h2>The three "averages"</h2>
<p>"Average" is sloppy language for three different things:</p>
<ul>
<li><strong>Mean</strong> — add everything up, divide by the count. The one people usually mean. Sensitive to extremes.</li>
<li><strong>Median</strong> — line the values up in order, take the middle one. Ignores extremes.</li>
<li><strong>Mode</strong> — the most common value. Useful for categories.</li>
</ul>
<p>In notation you'll meet the mean written with the summation symbol <strong>Σ</strong> (Greek capital sigma), which simply means "add up this list." Don't fear it — <em>Σ is a shopping-list total, nothing more.</em> The mean is Σ(values) ÷ (count).</p>

<pre><code>incomes = [30000, 85000, 52000, 61000, 28000]
<span class="kw">import</span> statistics <span class="kw">as</span> st
<span class="kw">print</span>(st.mean(incomes))     <span class="cm"># 51200</span>
<span class="kw">print</span>(st.median(incomes))   <span class="cm"># 52000</span></code></pre>

<h2>How the mean hides a disparity</h2>
<p>Suppose a lender reports: "Our average approved-loan applicant earns $51,200 — a healthy, middle-class portfolio." Reassuring. Now look inside:</p>
<pre><code>group_a = [95000, 91000, 88000]   <span class="cm"># mean 91,333</span>
group_b = [22000, 24000, 21000]   <span class="cm"># mean 22,333</span></code></pre>
<p>The <em>combined</em> mean might still land near a comfortable middle number — while the reality is two completely separate populations being treated as one. <strong>The average is a curtain.</strong> It reports the center of a crowd while saying nothing about whether the crowd is one group or two groups a mile apart.</p>

<div class="box an"><div class="bt">◆ Analogy</div><p>Put one foot in a bucket of ice water and one in a bucket of boiling water. <em>On average</em> you're comfortable. The mean is technically correct and completely useless — because the thing that matters is the <strong>spread between the groups</strong>, which the average is designed to erase.</p></div>

<div class="box hl"><div class="bt">▲ The analyst's reflex</div><p>Every time you're handed an average, ask: "<em>The average of what population, and what does it look like split by group?</em>" A single number describing a diverse population is a claim to be tested, not a fact to be accepted. This one reflex will catch more real problems than any framework checklist.</p></div>

<h2>Doing the split in code</h2>
<p>This is Day 4's motion again, now with intent:</p>
<pre><code><span class="kw">import</span> pandas <span class="kw">as</span> pd
df = pd.DataFrame({
    <span class="st">'group'</span>: [<span class="st">'A'</span>,<span class="st">'A'</span>,<span class="st">'A'</span>,<span class="st">'B'</span>,<span class="st">'B'</span>,<span class="st">'B'</span>],
    <span class="st">'income'</span>: [95000,91000,88000,22000,24000,21000]
})
<span class="kw">print</span>(df[<span class="st">'income'</span>].mean())              <span class="cm"># the reassuring overall number</span>
<span class="kw">print</span>(df.groupby(<span class="st">'group'</span>)[<span class="st">'income'</span>].mean())  <span class="cm"># the truth</span></code></pre>
<p>The overall mean and the per-group means tell two different stories. <strong>The per-group story is almost always the true one.</strong></p>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>When a model's performance is reported as a single accuracy figure — "94% accurate!" — that's an average across everyone. It can hide a model that is 98% accurate for the majority group and 70% accurate for a minority group. The headline looks great; the harm is real and buried. In a few weeks you'll break exactly these numbers apart per group. Today's lesson is why you must.</p></div>

<h2>Today's takeaway</h2>
<p>Three averages, and one permanent suspicion: a single average across a mixed population hides the very disparities you're paid to find. The fix is always the same — split and compare. Tomorrow we quantify <em>how spread out</em> a group is, because spread itself is a reliability signal you'll learn to read.</p>
`,
quiz:{q:"A lender reports the average income of approved applicants is $51,200 and calls the portfolio 'healthy middle-class.' What's the analyst's correct reflex?",options:["Ask what the distribution looks like split by group, since a single mean can hide two very different populations averaged together","Accept the figure as reported, since a $51,200 average clearly signals a financially healthy loan portfolio","Request a larger sample, since $51,200 is often just statistical noise from too few records","Convert the mean into a median instead and treat that single number as the final answer"],answer:0,explain:"A mean across a mixed population can sit in a comfortable middle while masking two groups far apart. The reflex is always 'average of what population, and what does it look like per group?' — split and compare."}},
{n:6,title:"Spread — Reading a Group's Reliability",read:"Lesson · 15 min read",body:`
<p>Yesterday: the average tells you the <em>center</em>. Today: the <strong>spread</strong> tells you how much to trust that center — and spread is a signal governance analysts routinely ignore at their peril.</p>

<h2>Two groups, same average, different worlds</h2>
<pre><code>town_a = [50, 50, 50, 50, 50]     <span class="cm"># everyone identical</span>
town_b = [10, 90, 50, 5, 95]      <span class="cm"># wildly scattered</span></code></pre>
<p>Both average 50. But a prediction of "50" is a near-certainty for Town A and a near-guess for Town B. The mean is the same; the <strong>reliability</strong> of the mean is not. That reliability is what <em>spread</em> measures.</p>

<h2>Variance and standard deviation</h2>
<p>The standard measure of spread is <strong>standard deviation</strong> (written σ, lowercase sigma, or "std"). You don't need to compute it by hand — but you must know what it says: <em>on average, how far do the values sit from the mean?</em> A small std means the group is tight and predictable; a large std means it's scattered and a single summary number is fragile.</p>
<pre><code><span class="kw">import</span> statistics <span class="kw">as</span> st
<span class="kw">print</span>(st.stdev([50,50,50,50,50]))   <span class="cm"># 0.0  -> perfectly tight</span>
<span class="kw">print</span>(st.stdev([10,90,50,5,95]))    <span class="cm"># ~42  -> wildly spread</span></code></pre>
<p>Variance is just standard deviation squared — same idea, different units. When someone says "variance," hear "spread."</p>

<div class="box an"><div class="bt">◆ Analogy</div><p>Two archers both average a bullseye. One puts every arrow in the center ring; the other hits far left and far right, averaging to the center by luck. Same mean, very different archers. Standard deviation is what separates the skilled archer from the lucky one — and models, like archers, can be accurate on average while being wildly unreliable case by case.</p></div>

<h2>Why spread is a governance signal</h2>
<p>When a model's error is reported as an average, a <strong>large spread</strong> hidden underneath means some individuals are being wronged badly even though the average looks fine. A loan model that's "off by $2,000 on average" might be dead-on for most people and catastrophically wrong for a scattered few — and those few are real people denied real loans.</p>

<div class="box hl"><div class="bt">▲ The reflex, extended</div><p>Day 5 gave you "average of what population?" Add its partner: "<em>and how spread out is it?</em>" A tight distribution makes a mean trustworthy. A wide one makes the mean a headline hiding a mess. Ask for both, always.</p></div>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>This is why fairness work never stops at "average performance is equal across groups." Two groups can share an average error while one group's errors are tightly clustered and the other's are wildly scattered — meaning individuals in the second group are far more likely to be seriously misjudged. Equal averages, unequal reliability, is a genuine fairness harm the average alone will never reveal.</p></div>

<h2>Today's takeaway</h2>
<p>Spread (std / variance) tells you how much to trust an average. Small spread = reliable; large spread = fragile summary hiding individual harm. Tomorrow we cross into the machine's own language: representing a person as a list of numbers, and turning that list into a decision with a single multiplication.</p>
`,
quiz:{q:"Two groups both have an average model error of $2,000, but Group X's errors are tightly clustered and Group Y's are wildly scattered. What does this tell a governance analyst?",options:["The model is equally fair to both groups, since matching average error means matching real-world outcomes","Individuals in Group Y are far more likely to be seriously misjudged — equal averages can hide unequal reliability","Nothing useful — spread is a purely technical detail with no bearing on how any individual is actually treated","Group X was probably given a larger training sample than Group Y during model development"],answer:1,explain:"Equal averages with unequal spread means Group Y experiences more extreme individual errors. Spread (standard deviation) is a fairness signal the average alone erases."}},

{n:7,title:"A Person as Numbers — Feature Vectors & the Dot Product",read:"Lesson · 17 min read",body:`
<p>Here's the idea at the heart of how nearly every model makes a decision. It sounds abstract for one minute, then becomes the most practical thing you know. Stay with me: today you learn how a model turns a human being into a single number that becomes a verdict.</p>

<h2>Step 1 — A person is a list of numbers</h2>
<p>To a model, you are not a story. You are a <strong>feature vector</strong>: an ordered list of your measured features.</p>
<pre><code>applicant = [33, 52000, 0]   <span class="cm"># [age, income, prior_defaults]</span></code></pre>
<p>That list is the vector. "Vector" is an intimidating word for "an ordered list of numbers." That's the whole definition. You are, to the model, three numbers in a row.</p>

<h2>Step 2 — The model has a list of weights</h2>
<p>The model, through training, has learned a matching list of <strong>weights</strong> — one per feature — that say how much each feature pushes the decision, and in which direction:</p>
<pre><code>weights = [0.1, 0.002, -5.0]   <span class="cm"># age, income, prior_defaults</span></code></pre>
<p>Income has a small positive weight (more income → slightly more approvable). Prior defaults has a large negative weight (each default strongly pushes toward denial). <strong>The weights are the model's learned opinion.</strong> They're what the machine "wrote" instead of rules.</p>

<h2>Step 3 — The dot product turns it into one number</h2>
<p>To reach a decision, the model <strong>multiplies each feature by its weight and adds them all up</strong>. That single operation is the <strong>dot product</strong>, and it is the beating heart of machine learning:</p>
<pre><code>score = (33 × 0.1) + (52000 × 0.002) + (0 × -5.0)
score = 3.3 + 104 + 0 = 107.3</code></pre>
<p>In Python, done properly:</p>
<pre><code><span class="kw">import</span> numpy <span class="kw">as</span> np
applicant = np.array([33, 52000, 0])
weights   = np.array([0.1, 0.002, -5.0])
score = np.dot(applicant, weights)
<span class="kw">print</span>(score)   <span class="cm"># 107.3</span></code></pre>

<div class="box an"><div class="bt">◆ Analogy</div><p>The dot product is a <strong>weighted report card</strong>. Each subject (feature) has a grade (your value) and a credit-weight (how much that subject counts toward your GPA). Multiply grade by weight, sum across subjects, and you get one number that decides whether you pass. A model decides your loan, your job application, your parole the exact same way: features × weights, summed.</p></div>

<div class="box hl"><div class="bt">▲ Why this is everything</div><p>Linear models, logistic regression, and even a single "neuron" in a deep neural network all do this same core move: dot product of features and weights. Master this one picture and the inside of a shocking number of "AI systems" stops being a mystery. The rest is variations on <em>features × weights, summed.</em></p></div>

<h2>Where bias lives in this picture</h2>
<p>Bias can enter three ways, and you can now name each precisely:</p>
<ul>
<li><strong>In a feature</strong> — a proxy like zip code is in the vector at all.</li>
<li><strong>In a weight</strong> — the model learned to weight a proxy heavily because biased history rewarded it.</li>
<li><strong>In what's missing</strong> — a feature that would have protected a group was never collected.</li>
</ul>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>When an engineer says a model is "explainable," often what they can show you <em>is the weights</em> — which features pushed a decision and how hard. You now know how to read that: a large-magnitude weight on a sensitive or proxy feature is a red flag you can point to directly. That's the beginning of real algorithmic auditing, and you got there with one multiplication.</p></div>

<h2>Today's takeaway</h2>
<p>A person is a feature vector. The model holds weights. A dot product — features times weights, summed — turns a human into a single score. Bias hides in features, weights, or omissions. Tomorrow we chase the sneakiest of those: the proxy variable, in full.</p>
`,
quiz:{q:"A model computes its score as (features × weights, summed) — the dot product. Where can bias enter this computation?",options:["In a feature (e.g., a proxy like zip code), in a weight the model learned, or in a protective feature that was never collected","Only in how fast the computation runs, since slower arithmetic accumulates more floating-point rounding error and that drift is what shows up as unfair scores","Only if an engineer deliberately writes a discriminatory rule into the source code, since a model that merely learns from data cannot acquire bias on its own","Nowhere at all — a dot product is pure arithmetic, and arithmetic is neutral by nature, so bias must enter somewhere later in the pipeline rather than here"],answer:0,explain:"Bias can sit in which features are present (proxies), in the learned weights (heavy weight on a proxy), or in omissions (a protective feature never collected). Naming which of the three is a core auditing skill."}},

{n:8,title:"Proxy Variables — Bias Hiding in Plain Sight",read:"Lesson · 17 min read",body:`
<p>We've flagged proxies twice. Today we corner the concept, because the single most common mistake in "de-biasing" a model is one you must be able to catch on sight: <strong>deleting the protected column and declaring victory.</strong></p>

<h2>The seductive, wrong fix</h2>
<p>A team is told their hiring model discriminates by gender. Their fix: "We removed <code>gender</code> from the data. Problem solved." It is not solved. It may not even be improved. Here's why.</p>

<h2>Why removing the column doesn't remove the bias</h2>
<p>A <strong>proxy variable</strong> is a feature that correlates with a protected attribute strongly enough to substitute for it. The model, hunting for any pattern that predicts the outcome, will happily reconstruct the protected attribute from its proxies:</p>
<ul>
<li><strong>Zip code</strong> → race and income (residential segregation is real and measurable).</li>
<li><strong>First name</strong> → gender and ethnicity.</li>
<li><strong>Alma mater, hobbies, "years of continuous employment"</strong> → gender, age, disability, parental status.</li>
<li><strong>Purchase history</strong> → pregnancy, health conditions, religion.</li>
</ul>
<p>Delete <code>gender</code> and leave <code>first_name</code>, <code>college</code>, and <code>employment_gap</code> in the data, and the model can rebuild a gender signal with disturbing accuracy — then discriminate on it, now invisibly, because "we don't even collect gender."</p>

<div class="box an"><div class="bt">◆ Analogy</div><p>It's like trying to hide someone's identity by removing their name tag while leaving their fingerprints, handwriting, and voice on everything. The name is the <em>obvious</em> identifier; the proxies are the <em>reliable</em> ones. Erasing the label doesn't erase the person the data still describes.</p></div>

<div class="box wa"><div class="bt">■ The "fairness through unawareness" trap</div><p>This wrong fix has a name: <strong>fairness through unawareness</strong> — the belief that a model can't be biased about what it can't see. It is one of the most thoroughly debunked ideas in the field, and you will still hear it in meetings constantly. Recognizing it instantly is a core competency of your role.</p></div>

<h2>Hunting proxies in code</h2>
<p>You find proxies by measuring correlation between features and the protected attribute — <em>which means you must keep the protected attribute available for testing even if it's excluded from training.</em> Here's the shape of it:</p>
<pre><code><span class="kw">import</span> pandas <span class="kw">as</span> pd
<span class="cm"># Does 'zip' predict the protected attribute 'race'?</span>
<span class="cm"># Cross-tabulate to see if certain zips map to certain groups</span>
pd.crosstab(df[<span class="st">'zip'</span>], df[<span class="st">'race'</span>], normalize=<span class="st">'index'</span>)</code></pre>
<p>If a given zip is 90% one group, that zip <em>is</em> a race signal. The stronger a feature predicts the protected attribute, the more dangerous it is as a proxy — even, and especially, when the protected attribute isn't in the training data.</p>

<div class="box hl"><div class="bt">▲ The correct posture</div><p>Real fairness requires the opposite of unawareness: you <strong>measure</strong> the protected attribute (carefully, lawfully, and stored separately) precisely so you can <em>test</em> whether the model's behavior differs across groups. You can't audit for a disparity you refuse to look at. Blindness is not neutrality.</p></div>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>This tension is live in law and policy. Some regimes restrict collecting protected attributes; fairness testing requires them. Navigating that — often via privacy-protected or aggregated measurement — is exactly the kind of judgment call an AI governance professional is paid to make. Flag it now: "we can't fairness-test without some access to the protected attribute" is a sentence you'll say many times.</p></div>

<div class="box field"><div class="bt">✱ From the field</div><p>Years ago a vendor assured my team their screening model couldn't discriminate because "we don't even collect race." Their top three features were zip code, first name, and high school attended. One crosstab showed the model knew race better than a census form. The meeting got very quiet. Bring the crosstab.</p></div>

<h2>Today's takeaway</h2>
<p>Deleting the protected column doesn't remove bias, because proxies reconstruct it. "Fairness through unawareness" is a trap. Real fairness means measuring across groups, which means <em>keeping</em> the protected attribute for testing. Tomorrow: why "the data showed a correlation" is never, by itself, a defense.</p>
`,
quiz:{q:"A team removes 'gender' from their hiring model's training data and declares it unbiased. What's the flaw?",options:["Proxy variables (name, college, employment gaps) let the model reconstruct gender and discriminate invisibly — this is the debunked 'fairness through unawareness' trap","Nothing at all — removing the protected attribute from the training data is sufficient to make the model provably fair, since it can no longer see what it isn't given","They should have gone further and dropped rows until the remaining sample was perfectly balanced between groups, which is the step that actually removes the bias","Gender was never a meaningful predictor in a hiring model to begin with, so removing the column changed nothing and the unbiased claim holds for a different reason"],answer:0,explain:"Models rebuild protected attributes from correlated proxies. 'Fairness through unawareness' — assuming a model can't be biased about what it can't see — is discredited. True fairness requires measuring across groups, not hiding the attribute."}},

{n:9,title:"Correlation, Causation, and 'The Data Said So'",read:"Lesson · 16 min read",body:`
<p>Models find <strong>correlations</strong> — features that move together with the outcome. They do not find <strong>causes</strong>. Confusing the two is the intellectual error underneath a huge share of AI harms, and today you learn to separate them cold.</p>

<h2>Correlation: moving together</h2>
<p>Two things correlate when they tend to rise and fall together. Ice-cream sales and drowning deaths correlate strongly. Does ice cream cause drowning? No — <strong>hot weather</strong> causes both. The correlation is real; the causal story is nonsense. The hidden third factor (heat) is called a <strong>confounder</strong>.</p>

<div class="box an"><div class="bt">◆ Analogy</div><p>A rooster crows every morning right before sunrise. The correlation is perfect. But the rooster doesn't cause the sun to rise. A model trained only on "rooster crowed → sun rose" would predict beautifully and understand nothing. Most models are, in this precise sense, very sophisticated roosters.</p></div>

<h2>Why models can't tell the difference</h2>
<p>A model learns "feature X predicts outcome Y." It has no idea whether X <em>causes</em> Y, whether Y causes X, or whether some confounder causes both. It only knows they move together in the training data. That's why:</p>
<ul>
<li>A model might learn that patients seen by the <em>oncology</em> department have worse outcomes — and conclude oncology is dangerous, when really the sickest patients get sent there.</li>
<li>A hiring model might learn that a certain zip code predicts "low performance" — when the real cause is that biased managers rated those employees lower.</li>
</ul>
<p>The model faithfully reports the correlation. The <strong>causal story is yours to supply</strong>, and it's where your domain judgment earns its keep.</p>

<h2>Simpson's Paradox — the disappearing trend</h2>
<p>The most jarring way correlation misleads: a trend that holds for the whole group can <strong>reverse</strong> inside every subgroup. A classic: a university appears to admit men at a higher rate than women overall — looks like bias against women. But split by department, <em>each department</em> admits women at an equal or higher rate. Women simply applied more to the most competitive departments. Same numbers, opposite conclusion, depending on whether you split.</p>

<div class="box wa"><div class="bt">■ Why this terrifies analysts</div><p>Simpson's Paradox means an aggregate fairness number can say "fair" while every subgroup says "unfair" — or the reverse. You cannot trust a top-line statistic. You must slice. This is Day 4's and Day 5's lesson escalated to a formal warning: <strong>the aggregate can lie about its own parts.</strong></p></div>

<div class="box hl"><div class="bt">▲ "The data showed it" is not a defense</div><p>When a team justifies a model's behavior with "we didn't decide anything — the data showed this correlation," your reply is: <em>a correlation is a question, not an answer.</em> What causes it? Is the cause lawful and fair to act on? Would acting on it entrench past discrimination? The model found the pattern; humans remain accountable for acting on it.</p></div>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>This is the deep reason "the algorithm is objective" is a myth worth dismantling in every meeting. An algorithm objectively reports correlations from data that a biased world produced. Objectivity about a biased input is not fairness — it's biased history, laundered through math and handed back with a confidence score.</p></div>

<h2>Today's takeaway</h2>
<p>Models find correlations, never causes. Confounders create fake relationships; Simpson's Paradox lets aggregates lie about subgroups. "The data said so" describes a pattern, never justifies a decision. Tomorrow you put all of Phase 1 to work in your first real lab — and file it in your portfolio.</p>
`,
quiz:{q:"A model finds that a certain zip code strongly predicts 'low employee performance.' Why is 'the data showed this correlation' not a sufficient justification to use it?",options:["Correlations a model surfaces on its own are always spurious noise and should be discarded without investigation, since only human-hypothesized patterns are real","Zip codes are categorical geographic labels, and categorical labels of that kind cannot mathematically correlate with a continuous performance metric in the first place","A correlation could reflect a confounder or past discrimination (e.g., biased manager ratings); it's a question about cause, not a defense for acting on it","The model made a calculation error somewhere during training that a straightforward bug fix would resolve, after which the spurious zip-code pattern would disappear"],answer:2,explain:"Correlation isn't causation. The pattern may be driven by a confounder or by past discrimination baked into the outcome data. A correlation raises the question 'what causes this and is it fair to act on?' — it never answers it."}},

{n:10,title:"Phase 1 Lab — Profile a Dataset (Deliverable #1)",read:"Review + Lab · 15 min read · ~2 hr lab · Portfolio deliverable",body:`
<p>Ten days in, you have real skills: you understand what ML is, the lifecycle, how data is shaped, how to inspect and slice it, what averages and spread reveal and hide, how a model turns features into a decision, and how proxies and correlation mislead. Today you <strong>use all of it</strong> on a real dataset and file your first portfolio deliverable.</p>

<div class="box hl"><div class="bt">▲ Phase 1 in one breath</div><p>A model learns rules from data instead of being given them (Day 1). Risk enters at every lifecycle stage, worst at framing (Day 2). Data is X → y (Day 3). You inspect with head/describe/value_counts/isnull and audit by slicing per group (Day 4). Averages hide disparities (Day 5); spread reveals reliability (Day 6). A decision is features × weights, summed (Day 7). Proxies reconstruct protected attributes (Day 8), and correlation is never a causal defense (Day 9).</p></div>

<h2>The lab</h2>
<p>Open a fresh Colab notebook. We'll use a real, famous dataset — the <strong>adult income</strong> dataset (predicts whether income exceeds $50K, and is a classic bias case study). Load it directly:</p>
<pre><code><span class="kw">import</span> pandas <span class="kw">as</span> pd
<span class="kw">from</span> sklearn.datasets <span class="kw">import</span> fetch_openml
adult = fetch_openml(<span class="st">"adult"</span>, version=2, as_frame=<span class="kw">True</span>)  <span class="cm"># stable API — no fragile URL to break</span>
df = adult.frame.rename(columns={<span class="st">'class'</span>: <span class="st">'income'</span>})
df.head()</code></pre>
<p>Now run the full inspection you learned, and <strong>write down what you find</strong> at each step:</p>
<ol>
<li><code>df.shape</code> — how many people, how many features?</li>
<li><code>df.describe()</code> — anything impossible or extreme?</li>
<li><code>df['sex'].value_counts()</code> and the same for <code>race</code> — who is over- and under-represented?</li>
<li><code>df.isnull().sum()</code> — where is data missing, and could that missingness be uneven across groups?</li>
<li>The audit motion: <code>df.groupby('sex')['income'].value_counts(normalize=True)</code> — does the high-income rate differ by sex? By how much?</li>
<li>Proxy hunt: which columns could act as proxies for sex or race? Name at least two and say why.</li>
</ol>

<div class="box wa"><div class="bt">■ Do the analysis, then judge it</div><p>You'll likely find a large gap in high-income rates between groups. Resist two opposite mistakes: don't declare "the model will be biased!" (you haven't built one yet), and don't shrug "that's just the data." Practice the exact posture from Day 9 — describe the disparity precisely, then ask what could cause it and whether a model trained on it would entrench it.</p></div>

<h2>File Deliverable #1 in your portfolio</h2>
<p>Now put Day 0 to work. In your GitHub repo:</p>
<ol>
<li>In Colab: <strong>File → Download → Download .ipynb</strong>. This saves your notebook.</li>
<li>In your repo, create the folder by uploading into <code>day-10-foundations-lab/</code> (use <strong>Add file → Upload files</strong>, then drag your <code>.ipynb</code> in).</li>
<li>Add a <code>WHAT-I-LEARNED.md</code> using the Day 0 template. For the "Why it matters for AI governance" section, connect your findings to the EU AI Act's data-representativeness requirement (Article 10).</li>
<li>Update your repo <code>README.md</code> to link the new folder.</li>
</ol>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>What you just did — independently profiling a dataset for representation and disparity before a single model exists — is exactly the "Map" function of the NIST AI RMF and the data-governance evidence an EU AI Act conformity assessment expects. You didn't read about it. You did it, and it's now public evidence in your portfolio.</p></div>

<h2>Phase 1 complete</h2>
<p>You've built the foundation: the mindset, the data skills, and the core math of a decision. Phase 2 is where it gets thrilling — you'll <strong>train actual models</strong>: linear regression, logistic regression, decision trees, and ensembles, and you'll watch, in code, how a machine learns its weights. See you on Day 11.</p>
`,
vocab:[
{term:"Feature (X)",def:"An input attribute the model uses; one column of the data."},
{term:"Label / target (y)",def:"The outcome the model predicts; the answer column."},
{term:"DataFrame",def:"A table of data in pandas; the standard object you inspect and slice."},
{term:"Mean vs median",def:"Mean is the arithmetic average (sensitive to extremes); median is the middle value (robust to extremes)."},
{term:"Standard deviation (σ)",def:"A measure of spread — how far values typically sit from the mean; a reliability signal."},
{term:"Feature vector",def:"A person or example represented as an ordered list of numbers."},
{term:"Dot product",def:"Features × weights, summed — the core operation that turns a feature vector into a score."},
{term:"Proxy variable",def:"A feature correlated with a protected attribute, letting a model discriminate without seeing it directly."},
{term:"Fairness through unawareness",def:"The debunked idea that hiding a protected attribute makes a model fair; proxies defeat it."},
{term:"Confounder",def:"A hidden third factor causing two things to correlate without one causing the other."},
{term:"Simpson's Paradox",def:"When a trend in aggregated data reverses within every subgroup; why you must slice."}
],
quiz:{q:"In the Phase 1 lab you find that one group has a much higher high-income rate than another. What is the professionally correct next step?",options:["Declare the future model biased on the strength of this finding and halt the project immediately, before anyone has the chance to train something on tainted data","Delete records from the group with fewer high earners until the remaining dataset is perfectly balanced, so the model cannot learn the disparity in the first place","Describe the disparity precisely, then ask what could cause it and whether a model trained on it would entrench past discrimination","Ignore it, since data that was collected honestly and without manipulation cannot itself be a source of concern — only the modeling choices made later can be"],answer:2,explain:"You haven't built a model yet, so you can't declare it biased; but 'that's just the data' abdicates judgment. The correct posture (Day 9) is to quantify the disparity, then reason about cause and whether acting on it would entrench discrimination."}},
{n:11,title:"Supervised, Unsupervised, and What You're Predicting",read:"Lesson · 15 min read",body:`
<p>Phase 2 is where you start training real models. But before you build, you need the map of model <em>types</em>, because the type determines what can go wrong and how you audit it. Two questions sort almost every model you'll ever meet.</p>

<h2>Question 1 — Do we have labeled answers?</h2>
<p><strong>Supervised learning</strong> means every training example comes with the correct answer attached. Loan applications <em>with</em> the known repaid/defaulted outcome. The model learns by comparing its guesses to the known answers and correcting itself. This is the vast majority of high-stakes decision systems — hiring, lending, medical, criminal justice — and nearly all of our course.</p>
<p><strong>Unsupervised learning</strong> means there are no answers — just data, and the model finds structure on its own. "Group these customers into similar segments" with no pre-defined groups. Useful for exploration, generally lower-stakes, but it hides a trap we'll name in a moment.</p>

<h2>Question 2 — Are we predicting a number or a category?</h2>
<p>Within supervised learning:</p>
<ul>
<li><strong>Regression</strong> predicts a <em>number</em> on a continuous scale — a house price, a credit limit, a risk score. "How much?"</li>
<li><strong>Classification</strong> predicts a <em>category</em> — approve/deny, fraud/not-fraud, which of five diagnoses. "Which kind?"</li>
</ul>

<div class="box an"><div class="bt">◆ Analogy</div><p>Supervised learning is studying with an answer key; unsupervised is being handed a pile of photos and asked to sort them into groups nobody named. Regression asks "how tall?"; classification asks "cat or dog?" Every model you audit is some combination of these two questions — pin them down first and half the confusion evaporates.</p></div>

<div class="box wa"><div class="bt">■ The unsupervised trap</div><p>Because unsupervised models invent their own groupings, they can quietly cluster people along protected lines — a "customer segment" that's really a proxy for race or age — and hand that grouping to a downstream decision. No label said "race," so it feels innocent. It isn't. When a team says "we just segmented customers," ask what the segments correlate with.</p></div>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>Regulatory risk tiers often track the decision type. A regression risk score and a binary classification both become high-risk under the EU AI Act when they gate access to employment, credit, or essential services. Your first triage question on any system: supervised or unsupervised, regression or classification, and <em>what real-world decision does the output gate?</em></p></div>

<h2>Today's takeaway</h2>
<p>Two questions — labeled answers or not, number or category — classify almost any model and set its audit profile. Tomorrow, the most important and most violated rule in all of applied ML: how you split your data, and the silent catastrophe called leakage.</p>
`,
quiz:{q:"A model outputs a continuous credit-limit dollar amount from labeled historical data. How do you classify it?",options:["Unsupervised classification, since dollar amounts form natural clusters","Unsupervised regression, because no category labels are present","Supervised classification, since credit limits are grouped into tiers","Supervised regression (labeled answers, predicting a number)"],answer:3,explain:"It learns from labeled historical examples (supervised) and predicts a number on a continuous scale (regression). Classification would predict a category like approve/deny."}},

{n:12,title:"The Split — Train, Validation, Test, and Leakage",read:"Lesson · 17 min read",body:`
<p>Today's rule is the one whose violation causes more embarrassing model failures than any other, and one you can catch cold once you understand it. It's also a favorite exam question in real audits.</p>

<h2>Why you must split the data</h2>
