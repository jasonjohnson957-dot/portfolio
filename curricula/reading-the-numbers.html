<p>This is the intellectual core of the whole month. There is no button that makes a model &ldquo;fair&rdquo; on all counts — the definitions genuinely conflict when base rates differ. So the real questions are governance questions: <strong>which definition did we choose, why does it fit this use case, who decided, and is the trade-off documented?</strong> A vendor who claims their model is simply &ldquo;fair,&rdquo; with no mention of which definition, either doesn't understand this result or is hoping you don't.</p></div>
<div class="finding note"><span class="sev">Note · the famous case</span>
<p>The public COMPAS recidivism debate was, at heart, this theorem: the tool was roughly calibrated across race but had unequal false-positive rates — two defensible fairness definitions that could not both hold. Both sides were &ldquo;right,&rdquo; because the metrics were mathematically incompatible.</p></div>
`,
quiz:{q:"A vendor states their model 'is fair' with no further detail. Given the impossibility theorem, what's the correct response?",
opts:["Accept it — fairness is a single achievable property","Ask which fairness definition was chosen and why, since when base rates differ the definitions provably conflict and cannot all hold at once","Demand the model satisfy all definitions simultaneously","Fairness metrics never conflict"],
a:1, ex:"The impossibility theorem proves that with differing base rates, fairness definitions conflict — no model satisfies them all. 'Fair' is meaningless without specifying which definition, why it fits, and who owns the documented trade-off."}
},

/* DAY 28 */
{
arc:"eval", title:"Explainability Math — Feature Importance, SHAP & LIME",
obj:"Read what an explanation is claiming, and where explanations can mislead.",
body:`
<p>When a model is complex (Day 21), <strong>explainability</strong> tools estimate which features drove a prediction. You'll be handed their output and asked to interpret it, so learn to read the two flavors: <em>global</em> (the model overall) and <em>local</em> (this one decision).</p>
<ul>
<li><strong>Feature importance</strong> — a ranking of which features most influence the model <em>overall</em> (global view).</li>
<li><strong>SHAP</strong> — borrows a fair-division idea from game theory to split a <em>single</em> prediction across its features: how much each feature pushed <em>this one</em> decision up or down, and in which direction (local view).</li>
<li><strong>LIME</strong> — approximates the complex model with a simple, readable one <em>near a single case</em>, to explain that case.</li>
</ul>
<pre><span class="tag">Reading a SHAP result</span>each feature gets a value:  sign = direction,  size = strength
+0.30 zip_code   → pushed this decision strongly toward "deny"
−0.05 income     → pushed slightly toward "approve"

<span class="cm">the biggest bars are the features that mattered most for THIS person</span></pre>
<div class="finding high"><span class="sev">Highlight · Explanations are evidence, and evidence can mislead</span>
<p>If a SHAP summary shows a proxy feature (ZIP code, name) carrying heavy weight, that's a concrete bias lead. But treat explanations with care: they are <em>approximations</em>, they can be unstable (a small input change flips the story), and there's active research on &ldquo;fairwashing&rdquo; — producing innocent-looking explanations for a biased model. Use them to <em>generate questions</em>, not to close the case. And always keep global (overall) separate from local (this one person) claims.</p></div>
`,
quiz:{q:"A SHAP summary shows a ZIP-code feature is the largest driver of denials. How should an analyst treat this?",
opts:["Ignore it — SHAP is decorative","As a concrete bias lead worth investigating (a likely proxy), while remembering explanations are approximations that can be unstable or gamed","As definitive proof of intentional discrimination","As evidence the model is fair"],
a:1, ex:"Heavy weight on a proxy like ZIP code is a real lead for proxy-driven bias. But SHAP/LIME are approximations that can be unstable or 'fairwashed,' so use them to raise questions, not to conclusively settle them."}
},

/* DAY 29 */
{
arc:"eval", title:"Reading a Model Card & Mapping to Frameworks",
obj:"Know which numbers to demand in a fairness report and how each maps to a pinned framework.",
body:`
<p>The payoff: you can now open a model card or fairness report and read it like an auditor. Here's the checklist and the framework mapping — with control IDs pinned to the versions current at publication (June 2026), so you can always tell what was authoritative.</p>
<h3>What to look for (and what's missing is itself a finding)</h3>
<ul>
<li>Metrics reported <strong>per group</strong>, not just overall — selection rates, TPR, FPR, precision.</li>
<li>The <strong>base rates</strong> and <strong>sample sizes</strong> per group (Days 9, 13).</li>
<li><strong>Which fairness definition</strong> was chosen, and the acknowledged trade-off (Day 27).</li>
<li>Confidence intervals or significance on the disparities (Day 13).</li>
<li>Evidence the training and deployment populations match, and how drift is monitored (Day 11).</li>
</ul>
<div class="finding note"><span class="sev">Reading a sample line</span>
<p>&ldquo;Overall accuracy 91%, AUC 0.93.&rdquo; Your reflex: <em>both numbers are aggregate and threshold- or ranking-only.</em> Where are the per-group precision, recall, and FPR? Where's the base rate? A confident headline with no per-group breakdown is a gap, not a reassurance.</p></div>
<h3>Mapping the math to frameworks</h3>
<ul>
<li><strong>Bias / fairness metrics</strong> → NIST AI RMF 1.0 <code class="inl">MEASURE 2.11</code> (fairness &amp; bias evaluation); EU AI Act (Regulation (EU) 2024/1689) <code class="inl">Art. 10</code> (data governance for high-risk systems); ISO/IEC 42005:2025 impact assessment.</li>
<li><strong>Error-rate disparities &amp; human cost</strong> → EU AI Act <code class="inl">Art. 14</code> (human oversight); NIST AI RMF 1.0 <code class="inl">MANAGE 4.1</code>.</li>
<li><strong>Automated decisions on individuals</strong> → GDPR (Regulation (EU) 2016/679) <code class="inl">Art. 22</code>.</li>
<li><strong>Management &amp; documentation of the whole system</strong> → ISO/IEC 42001:2023.</li>
</ul>
<div class="finding warn"><span class="sev">Warning · Verify before you cite</span>
<p>These IDs were authoritative at publication (June 2026), but this area moves fast — re-confirm before a formal report. As one live example, the EU AI Act's high-risk application dates are subject to the proposed &ldquo;Digital Omnibus&rdquo; adjustments still in progress as of mid-2026.</p></div>
`,
quiz:{q:"A model card reports only overall accuracy and a single AUC. What is the most important gap to raise?",
opts:["The report should use a nicer chart","There are no per-group metrics, base rates, sample sizes, or a stated fairness definition — the numbers needed to actually judge fairness are missing","Accuracy and AUC fully establish fairness","Model cards never contain fairness data"],
a:1, ex:"Overall accuracy and AUC hide per-group behavior. A defensible review needs per-group error rates, base rates and sample sizes, and a stated fairness definition with its trade-off — their absence is itself a finding to map against MEASURE 2.11 and related controls."}
},

/* DAY 30 */
{
arc:"eval", title:"Capstone & Math Cheat Sheet",
obj:"Read a full fairness report end to end, then keep the reference card for good.",
body:`
<p>You made it. Thirty days ago the notation looked like a wall; now you can read a fairness report and find the load-bearing number. Let's put it together, then you keep the cheat sheet.</p>
<h3>The capstone read-through</h3>
<p>You're handed a hiring model's report. Walk it with the month's tools, in order:</p>
<ol>
<li>Check the <strong>feature list</strong> for protected traits and proxies (Day 15) — what can the model even see?</li>
<li>Confirm metrics are reported <strong>per group</strong>, with <strong>base rates and sample sizes</strong> (Days 9, 13).</li>
<li>Read the <strong>confusion-matrix</strong> metrics — precision, recall, FPR — for <em>each</em> group (Days 22–23).</li>
<li>Compute the <strong>disparate-impact ratio</strong> and check it against 0.80 (Day 25).</li>
<li>Ask which of <strong>equalized odds / predictive parity / calibration</strong> was chosen, and why (Days 26–27).</li>
<li>Confirm a named owner <strong>owns the impossibility trade-off</strong> (Day 27).</li>
<li>Note honestly <strong>what the metrics can't see</strong>, and map each finding to a framework (Day 29).</li>
</ol>
<p>That sequence is the job — technical literacy plus governance judgment, in one pass.</p>
<h3>The evaluator's math cheat sheet</h3>
<table class="cs">
<tr><th>Quantity</th><th>Formula</th><th>Reads as</th></tr>
<tr><td>Mean</td><td>(1/n) Σ xᵢ</td><td>average</td></tr>
<tr><td>Std deviation</td><td>√variance</td><td>typical spread</td></tr>
<tr><td>Impact ratio</td><td>low rate ÷ high rate</td><td>≥ 0.80 to pass four-fifths</td></tr>
<tr><td>Conditional prob</td><td>P(A|B)</td><td>A given B</td></tr>
<tr><td>Base rate</td><td>positives ÷ total</td><td>how common overall</td></tr>
<tr><td>Precision</td><td>TP / (TP+FP)</td><td>of flags, share correct</td></tr>
<tr><td>Recall / TPR</td><td>TP / (TP+FN)</td><td>of real positives, share caught</td></tr>
<tr><td>FPR</td><td>FP / (FP+TN)</td><td>of real negatives, share falsely flagged</td></tr>
<tr><td>FNR</td><td>FN / (FN+TP)</td><td>of real positives, share missed</td></tr>
<tr><td>Accuracy</td><td>(TP+TN) / all</td><td>overall correctness (beware imbalance)</td></tr>
<tr><td>AUC</td><td>area under ROC</td><td>ranking quality, 0.5–1.0</td></tr>
<tr><td>Demographic parity</td><td>equal P(Ŷ=1 | group)</td><td>equal positive rates</td></tr>
<tr><td>Equalized odds</td><td>equal TPR &amp; FPR by group</td><td>equal errors both ways</td></tr>
<tr><td>Predictive parity</td><td>equal precision by group</td><td>&ldquo;yes&rdquo; equally trustworthy</td></tr>
<tr><td>Calibration</td><td>score = reality, per group</td><td>0.70 means 70% for everyone</td></tr>
<tr><td>Sigmoid</td><td>1/(1+e^(−z))</td><td>score → probability</td></tr>
<tr><td>Gradient step</td><td>w − η·gradient</td><td>how models learn</td></tr>
</table>
<h3>The five math questions to always ask</h3>
<ol>
<li><strong>Representation:</strong> what's in the feature vector, and what's a proxy?</li>
<li><strong>Base rate &amp; sample:</strong> how common is the outcome, and how many people per group?</li>
<li><strong>Errors:</strong> what are the false-positive and false-negative rates <em>per group</em>?</li>
<li><strong>Definition:</strong> which fairness metric was chosen, and who owns the impossibility trade-off?</li>
<li><strong>Limits:</strong> what disparity could these numbers miss, and which framework does each map to?</li>
</ol>
<div class="finding high"><span class="sev">Highlight · You're ready</span>
<p>You can now read the math of a machine-learning system, locate the number a fairness claim rests on, recognize when a metric is hiding a harm, and explain to leadership why &ldquo;just make it fair&rdquo; is not a computation but a documented choice. Paired with the Python course, you can inspect both the code and the mathematics of AI governance. Go put it to work.</p></div>
`,
quiz:{q:"Which statement best captures the skill built over these 30 days?",
opts:["You can now derive proofs and train deep networks from scratch","You can read the math of an ML system, find the load-bearing fairness number, spot when a metric hides a harm, and frame fairness as a documented choice under the impossibility theorem","Automated metrics have replaced human judgment","Accuracy is the only number that matters"],
a:1, ex:"The course goal: mathematical literacy to read and interrogate ML/DL numbers — representation, base rates, error rates, fairness definitions, and their provable trade-offs — combined with the governance judgment to treat fairness as a documented choice, not a single computation."}
}
];

/* ============================================================
   ENGINE
   ============================================================ */
const STORE_KEY = "mathgov_progress_v1";
let answered = {};   // {dayIndex: chosenIndex}
let done = {};       // {dayIndex: true}
let current = 0;

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){ const s = JSON.parse(raw); answered=s.answered||{}; done=s.done||{}; current=s.current||0; }
  }catch(e){ /* file:// or sandbox without storage — run in-memory */ }
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify({answered,done,current})); }catch(e){}
}

function esc(s){return s;}

function buildRail(){
  const log = document.getElementById('log');
  log.innerHTML='';
  let lastArc=null;
  DAYS.forEach((d,i)=>{
    if(d.arc!==lastArc){
      const h=document.createElement('div');
      h.className='arc'; 
      const hh=document.createElement('div'); hh.className='arc-h'; hh.textContent=ARCS[d.arc];
      h.appendChild(hh); log.appendChild(h);
      lastArc=d.arc;
    }
    const item=document.createElement('div');
    item.className='day-item'+(i===current?' active':'')+(done[i]?' done':'');
    item.setAttribute('role','button'); item.tabIndex=0;
    item.innerHTML='<div class="pip">'+(done[i]?'&#10003;':String(i+1).padStart(2,'0'))+'</div>'+
                   '<div class="t">'+d.title+'</div>';
    item.addEventListener('click',()=>go(i));
    item.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go(i);}});
    log.appendChild(item);
  });
}

function updateCoverage(){
  const n=Object.keys(done).filter(k=>done[k]).length;
  const pct=Math.round(n/DAYS.length*100);
  document.getElementById('covBar').style.width=pct+'%';
  document.getElementById('covPct').textContent=pct+'%';
}

function render(){
  const d=DAYS[current];
  const c=document.getElementById('content');
  document.getElementById('crumb').textContent='Day '+String(current+1).padStart(2,'0')+' / 30';
  c.innerHTML=
    '<div class="eyebrow">'+ARCS[d.arc]+'</div>'+
    '<h2 class="daytitle">Day '+(current+1)+' &mdash; '+d.title+'</h2>'+
    '<div class="objective">'+d.obj+'</div>'+
    d.body+
    quizHTML(d);
  wireQuiz(d);
  // buttons
  document.getElementById('prevTop').disabled = current===0;
  document.getElementById('prevBot').disabled = current===0;
  const lastDay = current===DAYS.length-1;
  document.getElementById('nextTop').textContent = lastDay?'Finish':'Next \u2192';
  document.getElementById('nextBot').textContent = done[current]?(lastDay?'Course complete':'Next day \u2192'):'Mark complete \u2192';
  // refresh rail active state
  document.querySelectorAll('.day-item').forEach((el,i)=>{
    el.classList.toggle('active',i===current);
    el.classList.toggle('done',!!done[i]);
    const pip=el.querySelector('.pip');
    if(pip) pip.innerHTML = done[i]?'&#10003;':String(i+1).padStart(2,'0');
  });
  window.scrollTo({top:0,behavior:'instant' in window?'instant':'auto'});
  document.querySelector('.stage').scrollTop=0;
}

function quizHTML(d){
  let opts='';
  d.quiz.opts.forEach((o,i)=>{ opts+='<button class="opt" data-i="'+i+'">'+o+'</button>'; });
  return '<div class="quiz">'+
    '<div class="qh">Checkpoint &mdash; Day '+(current+1)+'</div>'+
    '<div class="q">'+d.quiz.q+'</div>'+
    opts+
    '<div class="explain" id="explain"></div>'+
  '</div>';
}

function wireQuiz(d){
  const c=document.getElementById('content');
  const buttons=c.querySelectorAll('.opt');
  const explain=c.querySelector('#explain');
  const prev=answered[current];
  function reveal(chosen){
    buttons.forEach(b=>{
      const i=+b.dataset.i;
      b.classList.add('disabled');
      if(i===d.quiz.a) b.classList.add('correct');
      if(i===chosen && chosen!==d.quiz.a) b.classList.add('wrong');
    });
    explain.innerHTML='<strong>'+(chosen===d.quiz.a?'Correct. ':'Not quite. ')+'</strong>'+d.quiz.ex;
    explain.classList.add('show');
  }
  if(prev!==undefined) reveal(prev);
  buttons.forEach(b=>{
    b.addEventListener('click',()=>{
      if(answered[current]!==undefined) return;
      const chosen=+b.dataset.i;
      answered[current]=chosen;
      save();
      reveal(chosen);
    });
  });
}

function go(i){
  if(i<0||i>=DAYS.length) return;
  current=i; save(); render(); updateCoverage();
}
function markAndNext(){
  done[current]=true; save();
  updateCoverage();
  if(current<DAYS.length-1){ go(current+1); }
  else { render(); }  // last day: just mark done
}

document.getElementById('nextTop').addEventListener('click',()=>{ if(current<DAYS.length-1) go(current+1); });
document.getElementById('prevTop').addEventListener('click',()=>go(current-1));
document.getElementById('prevBot').addEventListener('click',()=>go(current-1));
document.getElementById('nextBot').addEventListener('click',markAndNext);
document.addEventListener('keydown',e=>{
  if(e.target.classList && e.target.classList.contains('opt')) return;
  if(e.key==='ArrowRight') { if(current<DAYS.length-1) go(current+1); }
  if(e.key==='ArrowLeft') go(current-1);
});

load(); buildRail(); render(); updateCoverage();
</script>
</body>
</html>
