{cat:"Scenario",q:"How would you assess an LLM-based customer service system for governance risk?",a:"<p>I'd profile it first: what can it actually do — answer, or take actions like issuing refunds or closing accounts — because an LLM with tool access is a decision system, not a chatbot. Then the intended uses one at a time, plus a foreseeable-use register, since capability creep is the norm here.</p><p>The risk families I'd catalogue: hallucination producing false commitments a customer relies on; prompt injection through customer-supplied text or documents, which matters far more when the system has tool access; inconsistent treatment across demographic signals in the conversation — name, dialect, phrasing — which I'd test with counterfactual minimal pairs and deterministic decoding; refusal and escalation inconsistency; data leakage across sessions; and the supply chain, since the base model is a declared inheritance whose training corpus nobody in the room has seen.</p><p>Measurement is probe design rather than a standard test set: scripted scenario suites scored for correctness, consistency, and tone across matched variants; adversarial red-team probes; and logging analysis of real transcripts once live. Controls I'd expect: action limits and confirmation gates, an escalation path with a trigger definition, human review of a sampled transcript stream with per-group sampling, and monitoring on refusal and escalation rates. And I'd insist the assessment state clearly what probe coverage does and doesn't establish.</p>",tie:"BTM Days 52–56 · TTM Days 19–20, 51–52"},

{cat:"Scenario",q:"Your finding is challenged as 'just noise.' Walk me through your defense.",a:"<p>I'd answer with the interval, not with volume. The finding was reported as an effect size with a confidence interval and an adjusted p-value, so the defense is already built: here's the magnitude, here's the range consistent with the data, here's whether the interval excludes the null, and here's the multiple-comparison correction with the number of tests we ran disclosed.</p><p>If the challenge is specifically about sample size, I'd show the bootstrap distribution — how often the gap persists across resamples — and I'd be candid where the data is thin, because a finding I've flagged as inconclusive is one I can defend precisely by not overclaiming it. Credibility comes from the findings I declined to assert as much as the ones I did.</p><p>I'd also point to the pre-specified analysis plan committed before results, which answers the unspoken version of the challenge — that I went hunting until something turned up. And if the challenger is right, I'd say so. An assessor who has never revised a finding under challenge isn't demonstrating rigor; they're demonstrating that challenges don't reach them.</p>",tie:"TTM Days 3–6, 30, 58"},

{cat:"Scenario",q:"An affected individual asks why the model denied them. What has to exist for you to answer?",a:"<p>Four things. A retrievable record of the decision — inputs as they were at decision time, model version, threshold, and output. A local explanation, which for a tree ensemble means SHAP values identifying the largest contributors for that individual, rendered in plain language rather than feature names and log-odds. A human who can review the case and has authority to change it. And a documented appeal path with a response commitment.</p><p>If any of those are missing, that's a control gap and it goes in the assessment — most commonly the missing one is decision-time input capture, because teams log predictions but not the exact feature vector, which makes any later explanation a reconstruction rather than a record.</p><p>I'd add two rigor points. Explanations should be verified, not just generated: if perturbing the top attributed features barely moves the prediction, the explanation is a story. And I'd compare explanation profiles across groups, because if denials for one group consistently ride on different features than another's, that's a disparity in decision mechanism that rate metrics don't surface — one of the more advanced findings available to an auditor.</p>",tie:"BTM Days 46, 59 · TTM Days 14, 29, 38"},

{cat:"Scenario",q:"You inherit a model in production with no documentation and no assessment. Where do you start?",a:"<p>Triage before analysis. First, get it into the inventory with a consequence-based entry and a preliminary tier, because an unlisted model receives no governance by default. Second, establish what it actually does right now: pull the current decision volume, the population, the threshold in force, and who owns it — that last question frequently has no answer, and 'no accountable owner for a production decision system' is itself a finding I'd escalate immediately rather than saving for the report.</p><p>Third, reconstruct what can be reconstructed: training data lineage, model version and date, any evaluation ever performed. Where reconstruction fails, that gap is documented rather than papered over. Fourth, run a rapid current-state evaluation on recent production data — per-group outcome and error rates, calibration, and drift against whatever historical distribution exists. That tells me whether this is an urgent problem or a documentation problem.</p><p>Then the full sequence: MAP, measure, control gaps, treatment with owners and dates. But I'd deliberately front-load a short interim memo — tier, immediate risks, the owner question, and two or three cheap controls to activate this week — because a system running unassessed doesn't pause while I write ninety pages.</p>",tie:"TTM Days 34–39, 57"},
{cat:"Governance & Frameworks",q:"How do you decide how much governance a given AI system needs?",a:"<p>Proportionality, scored at intake and revisited on change. The dimensions that drive it: what's at stake for the affected person — inconvenience versus rights, livelihood, or safety; reversibility, since an appealable decision is very different from a permanent one; autonomy, meaning advisory versus determinative, and I score the foreseeable reality rather than the aspirational design because advisory outputs become determinative when volume rises; breadth of population; vulnerability of the affected groups; data sensitivity; opacity; and whether harm concentrates on specific groups or diffuses.</p><p>That produces a tier or impact level, and the level mechanically attaches obligations — assessment depth, oversight requirements, notice and recourse, monitoring intensity, reassessment cadence. The reason to be disciplined about this isn't bureaucratic tidiness; it's that heavy governance applied uniformly is unaffordable and collapses into theater, whereas light obligations for low-impact systems buy the organizational capacity to do serious work where it's owed. When an executive asks why one system needs so much process, the answer should be a citation to a scored rubric, not a debate.</p>",tie:"TTM Days 34, 53"},

{cat:"Technical",q:"A hiring tool passes every impact ratio. Is it fair?",a:"<p>It has cleared the mandated screen on outcome disparity at one decision point. That is not the same as fair, and it is not even the same as valid.</p><p>Two things remain unexamined. First, error distribution &mdash; equal selection rates say nothing about who gets wrongly screened out, so I would run the extended battery: FNR by group and intersection with intervals and multiplicity correction. Second, and more fundamentally: is the score evidence of anything? A tool can distribute a meaningless number with perfect equality. Under the Uniform Guidelines &mdash; the same regulation the four-fifths rule comes from &mdash; a selection procedure showing adverse impact needs validity evidence, criterion-related, content or construct. So I would ask what the tool claims to measure, which validity strategy is documented, what the criterion was and who produced it, and what the reliability is.</p><p>An equally-distributed coin flip deciding livelihoods passes every ratio in the table. The honest conclusion from a passing legal core is &lsquo;no adverse-impact signal on the mandated screen&rsquo; &mdash; never &lsquo;the tool is fair.&rsquo;</p>",tie:"TTM Days 44&ndash;47, 49"},

{cat:"Technical",q:"What is differential prediction, and how does it differ from the fairness metrics you would compute?",a:"<p>Differential prediction &mdash; the Cleary model, in employment testing since the 1960s &mdash; asks whether the relationship between the score and actual job performance differs by group. You regress performance on score with a group interaction and read two coefficients separately.</p><p>An intercept difference means candidates from one group with identical scores actually perform better or worse than the tool predicts, so a single cut-off systematically misallocates. A slope difference means one point of score does not buy the same performance across groups &mdash; the instrument is measuring something different for each, which is a construct problem no threshold adjustment repairs.</p><p>How it differs from the Phase 3 metrics: demographic parity, equalized odds and calibration all compare the model against a <em>label</em>. Differential prediction compares it against an external criterion of job performance and asks whether the score means the same thing. It is the psychometric ancestor of the fairness literature and predates it by about fifty years. The honest caveat is that it needs a performance measure, which most audits lack, and that measure carries its own bias &mdash; so where it is unavailable I record the question and fall back on documentary validity review.</p>",tie:"BTM Days 31&ndash;33 &middot; TTM Days 29, 46&ndash;47"},

{cat:"Governance & Frameworks",q:"A vendor says their assessment is validated. What do you ask?",a:"<p>Five questions, none of which need model access.</p><p>Which of the three Uniform Guidelines strategies is claimed &mdash; criterion-related, content or construct? Vendors often gesture at all three and document none. What was the criterion, who produced it, and was it itself examined for group differences? Criterion validity usually means correlation with supervisor ratings, which carry documented demographic patterns, so a tool that predicts those ratings faithfully may be reproducing bias with excellent measured validity. What is the reliability, on what sample, and does it differ by group &mdash; because an unreliable measure cannot be valid, and differential reliability means one group&rsquo;s outcomes are more arbitrary. How representative was the validation sample of the population now being scored; a study on two hundred incumbents at one site does not transport automatically to a national applicant pool. And what is the effect size &mdash; a correlation of 0.10 is detectable in a large sample and close to meaningless against a substantial adverse impact.</p><p>If the answers are thin, that matters doubly: the business-necessity defense is weak, and the bar an alternative has to clear is correspondingly low.</p>",tie:"TTM Days 46&ndash;47 &middot; BTM Day 45"},

{cat:"Behavioral",q:"Tell me about a time you found a problem nobody asked you to look for.",a:"<p>Portfolio candidates should answer this honestly from their own work rather than inventing employment. In building my evaluation gauntlet, I ran per-group decision-flip rates under small input perturbations — a test nobody's standard checklist includes — and found that decisions for one group flipped several times more often than for another under a 2% income nudge, even though selection rates and error rates looked comparable.</p><p>The reason I looked was a habit rather than a hunch: I'd made 'compute it per group' reflexive for every metric, so when I added a robustness scan, running it by group was automatic. The finding mattered because it's a fairness dimension no standard battery surfaces — one group's outcomes were simply more precarious and more gameable, which is a real harm even when the aggregate rates balance.</p><p>What I took from it: most novel findings don't come from clever new methods, they come from applying an existing discipline one level further than convention requires. I now write that scan into my standing battery and into the assessments I produce.</p>",tie:"TTM Days 20, 24, 45"},

{cat:"Behavioral",q:"Describe a time you had to deliver an unwelcome finding.",a:"<p>The structural version of this I can speak to concretely: in my mitigation lab I demonstrated that the intervention which best closed the equalized-odds gap simultaneously widened the selection-rate gap and required the protected attribute at decision time — meaning the 'fix' I'd been building toward carried costs the recommendation had to headline rather than bury.</p><p>The temptation was to lead with the metric that improved. What I did instead was report the target achieved, the definitions traded, the accuracy cost with intervals, and the legal sensitivity of group-based thresholds — then present it as a priced trade requiring a signature rather than as a solution.</p><p>The lesson I carry into unwelcome findings generally: the willingness to headline your own intervention's costs is exactly what makes your claimed improvements believable. And procedurally, I'd pre-brief anyone who'd be surprised before a public room, because a finding that lands cold triggers defense of face instead of engagement with the evidence.</p>",tie:"TTM Days 27, 40, 58"},

{cat:"Behavioral",q:"Tell me about a time you were wrong.",a:"<p>Early in my evaluation work I treated a large per-group gap on a small subgroup as a headline finding. It was a 9-point gap and it looked decisive. When I bootstrapped it, the interval spanned nearly zero to twenty points — the effect was real-looking but the data couldn't support the claim I'd been about to make.</p><p>I'd made the specific error I now warn others about: confusing a point estimate for knowledge. What made it correctable was building uncertainty quantification into my tooling rather than leaving it to discipline — my audit module's significance method won't return a bare p-value on a thin subgroup; it flags low power and wide intervals in the output itself.</p><p>That's the general principle I took away: when I catch myself in a reasoning error, the durable fix is usually a change to the instrument or the process, not a resolution to be more careful. Controls built into tooling survive fatigue and deadline pressure; intentions don't.</p>",tie:"TTM Days 3–5, 10"},

{cat:"Behavioral",q:"How do you handle disagreement with someone more senior or more technical than you?",a:"<p>I separate the disagreement into what's empirical and what's judgment, because they need different handling. If we disagree about a fact — whether a gap is significant, whether a test was valid — that's resolvable with evidence, and I'll bring the interval, the correction, and the plan and be genuinely open to being wrong. Technical seniority often means they see something I don't, and the fastest path is to ask what test would change my mind.</p><p>If we disagree about judgment — which fairness definition should govern, whether residual risk is acceptable — I try to be very clear that it's a judgment call, state my reasoning and my recommendation, and then be explicit about whose decision it actually is. A lot of friction comes from analysts arguing as though they hold decision authority they don't have, or executives treating a normative choice as a technical one.</p><p>Either way, I document the position and the resolution. If the decision goes against my recommendation, that's legitimate — my obligation is that it was made with accurate evidence and recorded with an accountable signature, not that it matched my preference.</p>",tie:"TTM Days 39, 58"},

{cat:"Behavioral",q:"How do you explain technical findings to non-technical audiences?",a:"<p>Verdict first, plain language carries the point, the number carries the proof. I open with what I need from them and what I'm recommending, then give three findings maximum, each as one sentence a director understands with the statistic in parentheses — 'the model is substantially more likely to wrongly reject qualified applicants from this group (false-negative rate 2.1 times higher, interval 1.5 to 2.8).'</p><p>Two habits do most of the work. First, I budget severity words: if everything is critical, nothing is, so those words attach only to what my rating anchors earned. Second, I replace adjectives with structure — the best editorial note I've internalized is that 'concerning' should always be rewritten as concerning to whom, costing what, unless what. Every judgment word should decompose into a stakeholder, a magnitude, and a condition.</p><p>I also bring individual exhibits when I can. A matched pair of near-identical applicants with opposite outcomes moves a room that glazes over at a false-positive-rate table, and it's the same evidence.</p>",tie:"TTM Days 29, 40, 58"},

{cat:"Behavioral",q:"Tell me about a time you had to learn something difficult quickly.",a:"<p>Fine-tuning a transformer, honestly. I had solid tabular ML foundations and no practical experience with the transformers ecosystem, and I needed to get from concept to a working fine-tuned model on free-tier hardware, which adds real constraints — sampled data, sequence truncation, a distilled base model.</p><p>My approach was to anchor the unfamiliar to what I already understood: pretraining and fine-tuning as transfer learning, the training loop as the same gradient descent, the classification head as a small model on top of inherited representations. That framing turned an intimidating library into a small number of decisions I could reason about.</p><p>The part I'm most glad I did was immediately auditing what I'd built rather than celebrating that it worked. Running counterfactual name probes against my own model — trained on movie reviews with no name-outcome pattern — demonstrated imported bias from a pretraining corpus I'd never seen. Learning the technique and learning its governance implications in the same two days is how I try to learn anything in this field; capability without the audit reflex is exactly what produces the problems we get hired to find.</p>",tie:"TTM Days 17–18"},

{cat:"Behavioral",q:"How do you prioritize when everything is urgent?",a:"<p>By consequence and reversibility, and I try to make the prioritization visible rather than doing it silently in my head. Concretely, I use the same logic my risk matrix uses: what's the worst plausible outcome for the most affected party, how likely is it under current controls, and how reversible is it if we're wrong?</p><p>That produces some counterintuitive ordering. A cheap control fix with an immediate effect — assigning threshold ownership, activating a monitor on metrics we already compute — often outranks a deeper analysis, because it reduces live exposure this week while the analysis takes a month. I'd rather ship the interim memo with three activatable items than hold everything for the complete document.</p><p>I also try to name what I'm deprioritizing and why, in writing, to whoever's affected. Most conflict over priorities comes from people discovering their thing was deprioritized rather than from disagreeing with the reasoning. And if genuinely everything is high consequence, that's a capacity finding to escalate, not a puzzle to solve by working faster.</p>",tie:"TTM Days 36, 47, 57"},

{cat:"Behavioral",q:"Describe your approach to documentation.",a:"<p>I treat documentation as evidence rather than administration, because in this field it becomes exactly that — read later by auditors, regulators, and possibly opposing counsel, under conditions I won't control.</p><p>Three practices. Everything reproducible: seeded randomness, pinned tool versions, and analysis committed to version control, so a number in a report can be regenerated rather than merely trusted. Pre-specification: the analysis plan is written and committed before results are computed, which is what makes both findings and null findings credible — the timestamp does work no assertion can. And traceability: every claim in an executive summary chains to a finding, which chains to a register risk, a pre-specified test, and an evidence link. I check that chain deliberately before release, because one orphaned claim makes a reviewer discount all the chained ones.</p><p>I also document limitations as prominently as results — what I couldn't measure, what the sample didn't support, what falls outside scope. Disclosed limitations are integrity; discovered ones look like concealment.</p>",tie:"TTM Days 30, 37, 41"},

{cat:"Behavioral",q:"How do you stay current in a field that changes this fast?",a:"<p>I separate the durable from the churning, because trying to track everything produces a shallow layer of headlines and no depth. The durable layer is statistics, evaluation methodology, and the structure of risk and assurance work — bootstrap intervals, multiple-testing discipline, control gap analysis. Those transfer across every model architecture and every new regulation, and they're where I invest most of my study time.</p><p>The churning layer is model capabilities, tooling, and specific regulatory instruments. There I track primary sources rather than commentary — standards bodies and regulators directly, model and system cards from major releases, and the technical evaluation literature. When a new instrument appears, my first question is structural: what does it require computed, at what threshold, disclosed to whom? Most of them turn out to be recombinations of ideas I already hold.</p><p>And I try to keep building. Reading about an evaluation technique and having run it are different kinds of knowledge, and only the second one survives a follow-up question in a room.</p>",tie:"TTM Days 19, 42, 50, 59"},

{cat:"Behavioral",q:"Why AI governance rather than a pure data science or pure compliance role?",a:"<p>Because the interesting failures live exactly at the seam, and very few people are standing there. A pure modeling role optimizes metrics without much say in whether the metric encodes the right values or whether anyone owns the threshold that turns a score into a decision. A pure compliance role can articulate the obligations without being able to verify whether the technical claims underneath them are true — which means accepting vendor assertions that a two-hour analysis would falsify.</p><p>What drew me is being able to do both halves without dropping either: compute a bootstrap interval on an intersectional impact ratio in the morning and defend the resulting obligation to a skeptical executive in the afternoon. That combination is what makes it possible to say 'this vendor's no-significant-disparity claim is an underpowered non-result over a subgroup of sixty people' — a sentence that requires the statistics and the governance posture simultaneously.</p><p>The honest personal answer is also that I find the normative questions genuinely interesting. The impossibility theorem means someone has to decide who absorbs residual unfairness. I'd rather be in that conversation with the evidence than adjacent to it.</p>",tie:"BTM Day 34 · TTM Days 5, 45, 59"},

{cat:"Behavioral",q:"What would you do in your first ninety days here?",a:"<p>Listen, inventory, then produce one thing that's useful.</p><p>First thirty: understand the landscape — what systems exist, who owns them, what governance already runs, what the organization's actual regulatory exposure is, and where the friction is. I'd want to meet the model teams as colleagues rather than as an inspector arriving, because the quality of everything downstream depends on whether people route problems to me or around me.</p><p>Second thirty: assess the inventory's completeness and tier what's there. Unlisted systems are the largest hidden risk in most organizations, and consequence-based inclusion usually surfaces several — the vendor tool, the flagging system, the spreadsheet model that gates a decision.</p><p>Third thirty: pick one high-tier system and take it end to end — assessment, control gaps, monitoring activated, findings presented with owned conditions. A completed example does more to establish a governance function than a policy document, because it shows the organization what the process actually costs and produces. Then I'd use what I learned from that engagement to propose the standing process rather than proposing it in the abstract on day one.</p>",tie:"TTM Days 34, 41, 57–58"},

{cat:"Behavioral",q:"What are you not good at yet?",a:"<p>Organizational navigation under real pressure. My portfolio work is methodologically rigorous, but it was performed solo on public data — nobody's bonus depended on my findings, no vendor pushed back through their account executive, no regulator asked a follow-up question I hadn't anticipated. I know the methods cold and I've thought hard about how findings get defended, but I haven't yet lived the version where a room has genuine stakes in a different answer.</p><p>The related gap is calibration to organizational risk appetite. Deciding what's proportionate — when a finding warrants escalation versus a register row and a review date — is judgment built from seeing consequences play out, and I've read about that rather than accumulated it.</p><p>What I'd want early is exposure to those conversations with someone experienced in the room, and honest feedback when my severity calls are off in either direction. I'd rather be told I'm over-escalating than develop the habit unchallenged. The methods I can defend today; the judgment layer is what I'm looking to build here.</p>",tie:"TTM Days 39, 58–59"}

const store={
  key:'taming-the-machine-v1',
  /* Prefers window.storage (the sandboxed artifact host); falls back to
     localStorage when the file is opened directly in a browser. Kept
     byte-identical in shape to Building the Machine's store. */
  hasWS(){return typeof window!=='undefined'&&window.storage&&typeof window.storage.get==='function';},
  async read(){
    const blank={done:[],quiz:{}};
    try{
      if(this.hasWS()){
        const r=await window.storage.get(this.key);
        return r&&r.value?JSON.parse(r.value):blank;
      }
      return JSON.parse(localStorage.getItem(this.key))||blank;
    }catch(e){return blank;}
  },
  write(d){
    try{
      const v=JSON.stringify(d);
      if(this.hasWS()){window.storage.set(this.key,v).catch(()=>{});return;}
      localStorage.setItem(this.key,v);
    }catch(e){}
  }
};

function buildPips(){
  const host=$('pipHost');host.innerHTML='';
  PHASES.forEach(ph=>{
    const lab=document.createElement('div');lab.className='phase-label';lab.textContent=ph.label;host.appendChild(lab);
    if(ph.load){const ld=document.createElement('div');ld.className='phase-load';ld.textContent=ph.load;host.appendChild(ld);}
    const grid=document.createElement('div');grid.className='pips';
    for(let n=ph.range[0];n<=ph.range[1];n++){
      const idx=DAYS.findIndex(d=>d.n===n);
      if(idx<0)continue;
      const p=document.createElement('div');
      p.className='pip'+(n===0?' zero':'');
      p.textContent=n;
      p.dataset.idx=idx;
      p.setAttribute('role','button');
      p.setAttribute('tabindex','0');
      p.setAttribute('aria-label',(n===0?'Start Here':'Day '+n)+': '+DAYS[idx].title);
      p.onclick=()=>go(idx);
      p.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go(idx);}};
      grid.appendChild(p);
    }
    host.appendChild(grid);
  });
  const grid=document.createElement('div');grid.className='pips';grid.style.marginTop='14px';
  const refPip=(cls,label,which)=>{
    const e=document.createElement('div');
    e.className='pip '+cls;e.textContent=label;
    e.setAttribute('role','button');e.setAttribute('tabindex','0');
    e.setAttribute('aria-label',label);
    e.onclick=()=>goRef(which);
    e.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();goRef(which);}};
    grid.appendChild(e);
  };
  if(CHEAT)refPip('cs','CHEAT SHEET','cheat');
  if(INTERVIEW)refPip('iv','INTERVIEW PREP','interview');
  refPip('ak','ANSWER KEY','answers');
  host.appendChild(grid);
  paintPips();
}
function paintPips(){
  document.querySelectorAll('.pip').forEach(p=>{
    if(p.classList.contains('cs')){p.classList.toggle('on',showingRef==='cheat');return;}
    if(p.classList.contains('iv')){p.classList.toggle('on',showingRef==='interview');return;}
    if(p.classList.contains('ak')){p.classList.toggle('on',showingRef==='answers');return;}
    const idx=+p.dataset.idx;const d=DAYS[idx];
    p.classList.toggle('done',S.done.includes(d.n));
    p.classList.toggle('on',!showingRef&&idx===cur);
  });
}
function updateProg(){
  const t=total(),c=doneCount();
  const pct=t?Math.round(c/t*100):0;
  $('progfill').style.width=pct+'%';
  $('pmDays').textContent=c+' / '+t+' days';
  $('pmPct').textContent=pct+'%';
}

function render(){
  const d=DAYS[cur];const col=$('col');
  const ph=PHASES.find(p=>d.n>=p.range[0]&&d.n<=p.range[1]);
  let h='';
  h+='<div class="eyebrow">'+(d.n===0?'Start Here':'Day '+d.n)+'<span class="sep">/</span>'+(ph?ph.label:'')+'</div>';
  h+='<h1 class="daytitle">'+d.title+'</h1>';
  h+='<div class="readmeta">'+(d.read||'')+(d.n>=1?'  ·  Day '+d.n+' of 60':'')+'</div>';
  h+='<div class="lesson">'+d.body+'</div>';
  if(d.vocab&&d.vocab.length){
    h+='<h2>Key terms</h2><table class="vocab"><tr><th>Term</th><th>What it means</th></tr>';
    d.vocab.forEach(v=>h+='<tr><td>'+v.term+'</td><td>'+v.def+'</td></tr>');
    h+='</table>';
  }
  if(d.quiz){
    h+='<div class="quiz" id="quizBox"><div class="qh">Quick check</div><div class="qq">'+d.quiz.q+'</div>';
    d.quiz.options.forEach((o,i)=>{h+='<button class="opt" data-i="'+i+'"><span class="ol">'+String.fromCharCode(65+i)+'</span>'+o+'</button>';});
    h+='<div class="explain" id="explain"></div></div>';
  }
  h+='<div class="nav">';
  h+='<button class="btn ghost" id="prevBtn"'+(cur===0?' disabled':'')+'>← Prev</button>';
  const isDone=S.done.includes(d.n);
  h+='<button class="btn prime" id="doneBtn">'+(isDone?'✓ Completed':'Mark complete')+'</button>';
  h+='<button class="btn ghost" id="nextBtn"'+(cur===DAYS.length-1?' disabled':'')+'>Next →</button>';
  h+='</div>';
  col.innerHTML=h;

  if($('mobTitle'))$('mobTitle').textContent=d.n===0?'Start Here':'Day '+d.n;
  if(d.quiz){
    const saved=S.quiz[d.n];
    col.querySelectorAll('.opt').forEach(btn=>{btn.onclick=()=>answer(+btn.dataset.i,d);});
    if(saved!=null)revealQuiz(d,saved);
  }
  $('prevBtn').onclick=()=>{if(cur>0)go(cur-1)};
  $('nextBtn').onclick=()=>{if(cur<DAYS.length-1)go(cur+1)};
  $('doneBtn').onclick=()=>{toggleDone(d)};
  window.scrollTo(0,0);$('main').scrollTop=0;
  paintPips();
}
function answer(i,d){
  if(S.quiz[d.n]!=null)return;
  S.quiz[d.n]=i;store.write(S);
  revealQuiz(d,i);
}
function revealQuiz(d,chosen){
  const opts=document.querySelectorAll('#quizBox .opt');
  opts.forEach((b,i)=>{
    b.disabled=true;
    if(i===d.quiz.answer)b.classList.add('correct');
    if(i===chosen&&chosen!==d.quiz.answer)b.classList.add('wrong');
  });
  const ex=$('explain');
  ex.innerHTML='<b>'+(chosen===d.quiz.answer?'Correct.':'Not quite.')+'</b> '+d.quiz.explain;
  ex.classList.add('show');
}
function toggleDone(d){
  const i=S.done.indexOf(d.n);
  if(i>=0)S.done.splice(i,1);else S.done.push(d.n);
  store.write(S);updateProg();render();
}
function go(idx){showingRef=null;cur=idx;render();closeRail();}
function goRef(which){showingRef=which;renderRef();closeRail();}
/* Answer key is GENERATED from DAYS so it can never drift from the inline quizzes. */
function buildAnswerKey(){
  let rows='<div class="eyebrow">Reference</div><h1 class="daytitle">Answer Key</h1>'
    +'<div class="readmeta">Every quick-check question, its answer, and why · '+DAYS.filter(d=>d.quiz).length+' items</div>'
    +'<div class="lesson"><div class="box wa"><div class="bt">■ Use this after, not during</div><p>Answering first and being wrong is what makes the explanation stick. Come here to review a phase, to check a run of answers at once, or to find the day that covers something you have forgotten — each entry links back to its source day.</p></div></div>';
  PHASES.forEach(ph=>{
    const items=DAYS.filter(d=>d.quiz&&d.n>=ph.range[0]&&d.n<=ph.range[1]);
    if(!items.length)return;
    rows+='<h2 class="akph">'+ph.label+'</h2>';
    items.forEach(d=>{
      const i=DAYS.findIndex(x=>x.n===d.n);
      rows+='<div class="ak"><div class="akd" data-goto="'+i+'">Day '+d.n+' · '+d.title+'</div>'
          +'<div class="akq">'+d.quiz.q+'</div>'
          +'<div class="aka"><strong>'+String.fromCharCode(65+d.quiz.answer)+'.</strong> '+d.quiz.options[d.quiz.answer]+'</div>'
          +'<div class="akw">'+d.quiz.explain+'</div></div>';
    });
  });
  return rows;
}
function renderRef(){
  if(showingRef==='answers'){
    $('col').innerHTML=buildAnswerKey();
    $('col').querySelectorAll('.akd').forEach(el=>{
      el.setAttribute('role','button');el.setAttribute('tabindex','0');
      const jump=()=>go(+el.dataset.goto);
      el.onclick=jump;
      el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();jump();}};
    });
    if($('mobTitle'))$('mobTitle').textContent='Answer Key';
    window.scrollTo(0,0);$('main').scrollTop=0;paintPips();return;
  }
  const R=showingRef==='cheat'?CHEAT:INTERVIEW;
  if(!R)return;
  let h='<div class="eyebrow">Reference</div><h1 class="daytitle">'+R.title+'</h1><div class="readmeta">'+(R.sub||'')+'</div><div class="lesson">'+R.body+'</div>';
  if(R.items){ // interview Q&A entries
    R.items.forEach((it,i)=>{
      h+='<div class="iq"><div class="iqcat">Q'+(i+1)+' · '+it.cat+'</div><div class="iqq">'+it.q+'</div><div class="iqa">'+it.a+'</div><div class="iqtie">↳ Ties to: '+it.tie+'</div></div>';
    });
  }
  $('col').innerHTML=h;
  if($('mobTitle'))$('mobTitle').textContent=R.title;
  window.scrollTo(0,0);$('main').scrollTop=0;paintPips();
}
function closeRail(){$('rail').classList.remove('open');$('scrim').classList.remove('on');}
$('menuBtn')&&($('menuBtn').onclick=()=>{$('rail').classList.add('open');$('scrim').classList.add('on');});
$('scrim')&&($('scrim').onclick=closeRail);

(async()=>{
  S=await store.read();
  buildPips();updateProg();render();
})();
</script>
</body>
</html>
