quiz:{q:"How does your audit correctly handle a category with impact ratio 0.77 and bootstrap CI [0.71, 0.84]?",options:["Report a definitive adverse-impact violation, since the point estimate falls below the 0.80 screening value","Report no adverse-impact concern, since the interval's upper bound reaches above the 0.80 screening value","Exclude the category from the published summary under the rule covering categories below two percent","Flag it inconclusive: the estimate signals adverse impact but the interval straddles 0.80 — investigate"],answer:3,explain:"The straddling interval is the middle state Day 4 defined: consistent with both signal and no-signal. Reporting it as such — rather than rounding to either certainty — is what distinguishes a statistically literate audit, and often converts into a concrete data-volume recommendation."}},

{n:45,title:"Beyond the Ratios — The Error-Rate Battery with Significance",read:"Build Lab · 15 min read · ~2.5 hr lab",body:`
<p>The legal core asks "who gets selected?" A serious audit also asks "<strong>who gets wronged?</strong>" — because equal selection can coexist with wildly unequal error. Today you attach your full Phase 3 battery to the audit, with the multiplicity discipline that makes dozens of numbers into findings rather than noise.</p>

<h2>The battery, assembled</h2>
<p>For each category structure (marginals + intersections), where outcome labels exist:</p>
<ul>
<li><strong>FPR / FNR per category</strong> — who is wrongly advanced, who wrongly screened out (BTM Day 27's moral asymmetry: in hiring, FNR is the qualified candidate wrongly rejected — usually the audit's ethical center).</li>
<li><strong>Precision per category</strong> — of those the tool advanced, how many proved qualified; unequal precision means the tool's "yes" carries different meaning by group.</li>
<li><strong>Calibration per category</strong> — Brier + reliability, if the tool scores (Days 8, 13).</li>
<li><strong>Stability per category</strong> — decision-flip rates under realistic perturbation (Day 20): whose outcomes are fragile.</li>
<li><strong>Individual exhibits</strong> — run your Day 29 matched-pair function over the audit population and carry across the discordance rate, its directional asymmetry, and the three tightest pairs. Built there, reported here.</li>
</ul>
<p>All of it pre-specified in the analysis plan; all gaps carried with CIs; the full set of comparisons counted and <strong>BH-corrected</strong> (Day 30), with the ticket count printed in the methodology. One honest caveat for the label-based rows: hiring labels ("proved qualified") are themselves downstream of past human judgment — BTM Day 32's label-trust problem — so the battery's error-rate findings state their dependence on label quality as a standing limitation.</p>


<h2>The battery in code</h2>
<p>Everything above is one function over your Day 10 module plus a multiple-comparison correction at the end. Note that the BH step runs <strong>once, over the whole comparison set</strong> — not per metric, not per dimension. Counting the tickets correctly is the honesty:</p>
<pre><code><span class="kw">import</span> numpy <span class="kw">as</span> np, pandas <span class="kw">as</span> pd
<span class="kw">from</span> sklearn.metrics <span class="kw">import</span> confusion_matrix, precision_score, brier_score_loss, roc_auc_score
<span class="kw">from</span> statsmodels.stats.multitest <span class="kw">import</span> multipletests
<span class="kw">from</span> statsmodels.stats.proportion <span class="kw">import</span> proportions_ztest

<span class="kw">def</span> <span class="fn">rates_for</span>(y, yhat):
    tn, fp, fn, tp = confusion_matrix(y, yhat, labels=[0, 1]).ravel()
    <span class="kw">return</span> {<span class="st">"n"</span>: len(y),
            <span class="st">"FPR"</span>: fp / (fp + tn) <span class="kw">if</span> (fp + tn) <span class="kw">else</span> np.nan,
            <span class="st">"FNR"</span>: fn / (fn + tp) <span class="kw">if</span> (fn + tp) <span class="kw">else</span> np.nan,
            <span class="st">"precision"</span>: precision_score(y, yhat, zero_division=np.nan)}

<span class="kw">def</span> <span class="fn">error_battery</span>(df, dim, y=<span class="st">"y"</span>, yhat=<span class="st">"pred"</span>, proba=<span class="kw">None</span>, min_n=30):
    rows = {}
    <span class="kw">for</span> grp, sub <span class="kw">in</span> df.groupby(dim):
        r = rates_for(sub[y], sub[yhat])
        <span class="kw">if</span> proba: r[<span class="st">"brier"</span>] = brier_score_loss(sub[y], sub[proba])
        r[<span class="st">"thin_cell"</span>] = r[<span class="st">"n"</span>] &lt; min_n       <span class="cm"># flag, never silently drop</span>
        rows[grp] = r
    <span class="kw">return</span> pd.DataFrame(rows).T

<span class="cm"># --- gap vs the reference (best-performing) group, one p-value per comparison ---</span>
<span class="kw">def</span> <span class="fn">gaps_with_p</span>(df, dim, metric=<span class="st">"FNR"</span>, y=<span class="st">"y"</span>, yhat=<span class="st">"pred"</span>):
    tbl, out = error_battery(df, dim, y, yhat), []
    ref = tbl[metric].idxmin()                        <span class="cm"># lowest error = reference group</span>
    <span class="kw">for</span> grp <span class="kw">in</span> tbl.index:
        <span class="kw">if</span> grp == ref: <span class="kw">continue</span>
        a, b = df[df[dim] == grp], df[df[dim] == ref]
        cnt  = np.array([(a[yhat] != a[y]).sum(), (b[yhat] != b[y]).sum()])
        nobs = np.array([len(a), len(b)])
        _, p = proportions_ztest(cnt, nobs)
        out.append({<span class="st">"group"</span>: grp, <span class="st">"vs"</span>: ref, <span class="st">"metric"</span>: metric,
                    <span class="st">"gap"</span>: tbl.loc[grp, metric] - tbl.loc[ref, metric],
                    <span class="st">"n"</span>: len(a), <span class="st">"p"</span>: p})
    <span class="kw">return</span> pd.DataFrame(out)

<span class="cm"># --- ONE correction across every comparison the audit ran ---</span>
all_tests = pd.concat([gaps_with_p(df, d, m)
                       <span class="kw">for</span> d <span class="kw">in</span> [<span class="st">"sex"</span>, <span class="st">"race"</span>, <span class="st">"sex_race"</span>]
                       <span class="kw">for</span> m <span class="kw">in</span> [<span class="st">"FPR"</span>, <span class="st">"FNR"</span>, <span class="st">"precision"</span>]], ignore_index=<span class="kw">True</span>)
all_tests[<span class="st">"p_adj"</span>] = multipletests(all_tests[<span class="st">"p"</span>], method=<span class="st">"fdr_bh"</span>)[1]
print(<span class="st">"tickets bought:"</span>, len(all_tests))           <span class="cm"># this number goes in the methodology</span>
print(all_tests.sort_values(<span class="st">"p_adj"</span>).round(4))</code></pre>
<div class="box wa"><div class="bt">■ Two metrics to add if you are aiming at financial services</div><p>Credit-model validators report the same discriminatory power you do, under different names, and using the wrong vocabulary marks you as an outsider in the first five minutes. <strong>Gini</strong> is a linear transform of AUC — <code>gini = 2 * auc - 1</code> — so an AUC of 0.78 is a Gini of 0.56 and you already have it. <strong>KS</strong> is the maximum vertical gap between the cumulative distributions of goods and bads: <code>from scipy.stats import ks_2samp; ks_2samp(proba[y==1], proba[y==0]).statistic</code>. Report both per group alongside your error battery. Rules of thumb vary by portfolio and should never be quoted as universal thresholds, but a validator will expect you to know that KS below roughly 0.20 is weak separation on a consumer scorecard and that both metrics need a per-group read for the same reason every other metric does (Day 7).</p></div>

<p>Two disciplines the code enforces. Thin cells are <strong>flagged, not dropped</strong> — a row reading &ldquo;n=19, not interpretable&rdquo; is itself a finding, and quietly omitting it is the abuse Day 5 warned you about. And the printed ticket count goes into the methodology verbatim, because a reader who cannot see how many comparisons you ran cannot evaluate the ones you reported.</p>

<div class="box tmpl"><div class="bt">▤ Build: the findings ledger (assessment §5)</div><p>Extend Day 37's fixed format with one audit-specific field — <strong>legal core vs. extended battery</strong> — so every finding declares whether it lands inside the LL144-mandated computation or your added rigor: "F-2 [extended]: FNR for [intersection cell] is 2.3× the reference (gap 12 pts, CI [5, 19], BH-adj p=.02); label-quality caveat applies; maps to R-09." Reviewers can then see at a glance what the law compelled versus what your audit chose to see.</p></div>

<div class="box an"><div class="bt">◆ Analogy</div><p>A building code requires the fire-exit count (the legal core: countable, enforceable, public). A serious fire-safety engineer also tests door pressures, alarm audibility per floor, and evacuation times for wheelchair users (the extended battery: where the actual deaths hide). Passing code while failing the engineering is common — and the engineer's report says both, clearly labeled, because conflating "code-compliant" with "safe" is the industry's oldest fatal confusion.</p></div>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>The core-vs-extended labeling also future-proofs the document: as statutes evolve (more jurisdictions are drafting LL144 descendants with broader batteries), your extended findings are the ones regulators move toward mandating. An audit built this way reads as ahead of the law rather than minimally compliant — a positioning your future employers explicitly shop for.</p></div>

<h2>The stage the legal core cannot see — auditing the whole decision system</h2>
<p>Everything so far audits the <em>tool</em>. But no candidate is rejected by a tool; they are rejected by a <em>system</em> — model score, then a human reviewer, then an override, then an escalation, then an appeal, then a final decision. LL144 scopes to the AEDT. Disparity accumulates across the whole chain, and it can be manufactured at any link, including the ones the statute never looks at.</p>
<p>This is Day 43's audit-shopping problem turned into a measurement. If earlier stages have already filtered the pool, a clean impact ratio at the final stage can be an artifact of who was left to measure. So compute the ratio <strong>at every stage, and on the cumulative funnel</strong>:</p>
<pre><code><span class="kw">import</span> pandas <span class="kw">as</span> pd

<span class="cm"># one row per candidate; boolean columns marking who survives each stage</span>
STAGES = [<span class="st">"applied"</span>, <span class="st">"model_advanced"</span>, <span class="st">"reviewer_advanced"</span>,
          <span class="st">"escalation_survived"</span>, <span class="st">"offer"</span>]

<span class="kw">def</span> <span class="fn">funnel_audit</span>(df, group_col, stages=STAGES):
    rows = []
    <span class="kw">for</span> i, st <span class="kw">in</span> enumerate(stages):
        <span class="cm"># conditional: of those who reached this stage, who passed it?</span>
        entered = df[df[stages[i-1]]] <span class="kw">if</span> i <span class="kw">else</span> df
        cond = entered.groupby(group_col)[st].mean()
        <span class="cm"># cumulative: of ALL applicants, who is still alive here?</span>
        cum  = df.groupby(group_col)[st].mean()
        rows.append({<span class="st">"stage"</span>: st,
                     <span class="st">"n_entering"</span>: len(entered),
                     <span class="st">"cond_ratio"</span>: cond.min() / cond.max(),
                     <span class="st">"cum_ratio"</span>:  cum.min()  / cum.max()})
    <span class="kw">return</span> pd.DataFrame(rows)

<span class="kw">print</span>(funnel_audit(cases, <span class="st">"group"</span>))</code></pre>
<p>Two columns, two different questions. <strong>Conditional ratio</strong> asks: is <em>this stage</em> treating the people who reach it unequally? <strong>Cumulative ratio</strong> asks: what has the system done to a candidate's odds by this point? A stage can look near-parity conditionally while the cumulative ratio slides steadily — small, individually-defensible losses compounding into a large one. That compounding is invisible to any single-stage audit, which is precisely why this table belongs in the extended battery.</p>

<div class="box wa"><div class="bt">■ Where the human stage misbehaves — four patterns to test for</div><p>The reviewer stage is not a corrective; it is another decision-maker, and it has its own failure modes. <strong>Rubber-stamping</strong>: an override rate near zero means oversight is ceremonial (Day 16), so measure it and measure it per group. <strong>Selective override</strong>: reviewers may overturn the model more readily for some groups than others — compute override rates by group <em>and by direction</em>, since overriding a rejection is a very different act from overriding an advance. <strong>Compensating bias</strong>: a reviewer stage can partly correct model disparity, which looks like good news until you notice it means outcomes now depend on which reviewer you drew. <strong>Appeal access</strong>: appeals only help those who file them, so a fair appeals process with unequal uptake redistributes nothing — measure filing rates, not just outcomes.</p><p>Each of these is a per-group rate you already know how to compute, with an interval you already know how to put on it. What is new is remembering to look.</p></div>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>This is the analysis that answers the question every human-oversight requirement raises and almost never verifies: <em>does the human in the loop actually change anything, and does it change equally for everyone?</em> The EU AI Act's oversight provisions, ISO 42001's oversight controls and your own Day 38 control-gap table all assume a reviewer who exercises independent judgement. The funnel table is how you check whether that assumption survives contact with production.</p><p>State the scope honestly in the report: LL144's mandated computation covers the AEDT, so stage-wise findings are labelled <strong>extended</strong>. But they are the findings most likely to explain an outcome disparity that the tool-level audit cannot account for — and if the model looks clean while the funnel does not, you have just located the problem somewhere no vendor's bias audit would ever have looked.</p></div>

<h2>Today's takeaway</h2>
<p>Attach FPR/FNR, precision, calibration, stability, matched-pair exhibits and the stage-by-stage funnel audit to the legal core — pre-specified, CI-carried, BH-corrected, label-caveated, and labeled core-vs-extended. The tool is one link; the system is the chain, and disparity compounds along it. Tomorrow: from measuring disparity to explaining it — root-cause analysis.</p>
`,
quiz:{q:"A tool passes every LL144 impact ratio (all ≥ 0.85) but your extended battery finds one group's FNR is double the reference with a CI excluding zero. What does this combination mean?",options:["The extended battery must be misconfigured, since the mandated computation returned a passing result","Nothing actionable follows, because the published metrics are the ones the statute makes enforceable","Equal selection with unequal error: similar advance rates, but qualified members of one group screened out","The error-rate finding supersedes the ratios and establishes that the tool is unlawful as deployed"],answer:2,explain:"Outcome parity and error parity are different axes (BTM Days 31–32): matching selection rates says nothing about who bears the mistakes. The audit reports both, labeled core vs. extended — compliant on the mandated floor, flagged on the dimension where qualified people are being wronged."}},

{n:46,title:"Root Cause — From Disparity to Mechanism",read:"Build Step · 14 min read · ~2 hr build",body:`
<p>Your tables now say <em>what</em> is unequal. The audit's most valuable section says <em>why</em> — because remediation without mechanism is guesswork, and because "the model did it" is never the actual mechanism. Today: the root-cause investigation, using tools you already hold.</p>

<h2>The mechanism checklist</h2>
<p>For each substantive disparity finding, work the hypotheses in order of tractability:</p>
<ul>
<li><strong>Representation:</strong> Is the disadvantaged group thin in training data? (Per-group n's; BTM Day 17.) Mechanism: the model literally learned less about them.</li>
<li><strong>Proxy pathways:</strong> Which features carry group signal into the score? Triangulate — SHAP by group, permutation importance, PDPs at group boundaries (Days 14–15) — and name the candidate proxies (BTM Day 8's zip-code lesson).</li>
<li><strong>Label history:</strong> Does the target encode past human decisions with their own disparities? (BTM Day 32.) Mechanism: the model faithfully reproduces the record it was fed.</li>
<li><strong>Measurement gaps:</strong> Are features noisier or differently-meaningful for one group (credit thinness, employment-history conventions, tokenization effects for text — Day 17's truncation point)?</li>
<li><strong>Threshold placement:</strong> Does the disparity concentrate near the cut? (Score-distribution overlays per group; a threshold sitting on one group's density peak converts small score gaps into large outcome gaps — BTM Day 14 with teeth.)</li>
<li><strong>Pipeline artifacts:</strong> Imbalance handling, resampling, calibration drift by group (Days 12–13) — disparities manufactured in preprocessing rather than learned from the world.</li>
<li><strong>Construct invalidity:</strong> Is the tool measuring the right thing, and measuring it well? A résumé screener claiming to assess "leadership potential" may be scoring vocabulary richness and school prestige. Mechanism: the disparity is not a flaw in how the construct was measured — it is that the wrong construct was measured, and the proxy for it tracks background. This family is the one most audits never open, and under the Uniform Guidelines it is also the employer's defense, so you will meet it in Day 47 whether or not you go looking.</li>
</ul>

<h2>The mechanism most audits skip — and the law that requires it</h2>
<p>The four-fifths rule you compute in Day 44 comes from the Uniform Guidelines on Employee Selection Procedures, 29 CFR 1607, at §4D. The <em>same regulation</em>, at §5 and §15, says that where a selection process shows adverse impact, the user must maintain evidence of <strong>validity</strong> — and it names exactly three acceptable strategies:</p>
<ul>
<li><strong>Criterion-related validity</strong> — empirical data showing the procedure predicts or correlates with important elements of job performance. The strongest evidence, and the hardest to produce honestly.</li>
<li><strong>Content validity</strong> — the content of the procedure is representative of important aspects of the job. A coding exercise for a coding job; a typing test for a typing job.</li>
<li><strong>Construct validity</strong> — the procedure measures an identifiable characteristic determined to be important for successful performance. The Guidelines themselves call this the most complex strategy and set the highest bar for it.</li>
</ul>
<p>So the auditor's question is not only "is the score distributed unequally" but "<em>is this score evidence of anything?</em>" A tool can pass every impact ratio in your Day 44 table while predicting job performance no better than chance. That is not fairness. That is an equally-distributed coin flip deciding people's livelihoods — and it is the finding an experienced I/O psychologist will raise in the first meeting if you have not.</p>

<div class="box wa"><div class="bt">■ Reliability is a ceiling on validity — ask for it first</div><p>Before any validity claim, ask what the tool's <strong>reliability</strong> is: does it give the same answer for the same person on Tuesday as on Thursday (test–retest), and do its components hang together (internal consistency)? The relationship is not a nicety — an unreliable measure <em>cannot</em> be valid, because a score that moves at random cannot be correlated with anything stable. This gives you a fast, devastating opening question that requires no access to the model: <em>"What is the test–retest reliability, and on what sample?"</em> Vendors who cannot answer usually have not measured it, which tells you how seriously to take the validity claim that follows.</p><p>The fairness angle: reliability is often <em>lower for the groups least represented in the tool's development sample</em>. Differential reliability means one group's scores carry more noise — so their outcomes are more arbitrary, which is Day 20's stability finding arriving from a different direction.</p></div>

<div class="box gov"><div class="bt">✦ The criterion problem — where the auditor earns the fee</div><p>Criterion validity sounds like the gold standard until you ask what the criterion <em>is</em>. It is almost always supervisor performance ratings — a human judgment with its own well-documented demographic patterns. So "our tool is validated: it correlates 0.3 with performance ratings" may mean "our tool successfully predicts who supervisors rate highly," which is BTM Day 32's label-trust problem wearing a lab coat. A model that reproduces biased ratings with high fidelity will show excellent criterion validity and cause real harm.</p><p>Your audit question set: what was the criterion measure, who produced it, was it itself examined for group differences, and was the validation sample representative of the population the tool is now applied to? A validity study run on 200 incumbents at one site does not transfer automatically to a national applicant pool — and the Guidelines' own transportability provisions say so.</p></div>
<p>Each supported mechanism gets its evidence cited; each ruled-out mechanism gets a sentence too ("representation adequate: smallest category n=1,940"). Mechanisms you <em>cannot</em> distinguish with available data are named as competing explanations — root-cause candor, not root-cause theater.</p>

<h2>Working the checklist in code</h2>
<p>Four of the six families are directly measurable, and each probe is a handful of lines over tools you already own. Run them cheapest-evidence-first:</p>
<pre><code><span class="cm"># 1. REPRESENTATION — is the disadvantaged group thin in training?</span>
print(train.groupby(<span class="st">"sex_race"</span>).size().sort_values())

<span class="cm"># 2. PROXY PATHWAYS — which features carry group signal? Two independent reads.</span>
<span class="kw">import</span> shap
sv = shap.TreeExplainer(model).shap_values(X_test)
by_group = pd.DataFrame(sv, columns=X_test.columns).assign(g=df_test[<span class="st">"sex_race"</span>].values)
print(by_group.groupby(<span class="st">"g"</span>).mean().T.round(3))    <span class="cm"># mean push per feature, per group</span>

<span class="kw">from</span> sklearn.linear_model <span class="kw">import</span> LogisticRegression
proxy_auc = {}                                     <span class="cm"># can each feature alone predict the group?</span>
<span class="kw">for</span> c <span class="kw">in</span> X_test.columns:
    lr = LogisticRegression(max_iter=1000).fit(X_train[[c]], g_train)
    proxy_auc[c] = roc_auc_score(g_test, lr.predict_proba(X_test[[c]])[:, 1])
print(pd.Series(proxy_auc).sort_values(ascending=<span class="kw">False</span>).head(8))    <span class="cm"># &gt;0.65 = candidate proxy</span>

<span class="cm"># 3. THRESHOLD PLACEMENT — does the disparity concentrate at the cut?</span>
<span class="kw">for</span> t <span class="kw">in</span> [.3, .4, .5, .6, .7]:
    r = df_test.assign(sel=proba &gt; t).groupby(<span class="st">"sex"</span>)[<span class="st">"sel"</span>].mean()
    print(t, <span class="st">"impact ratio"</span>, round(r.min() / r.max(), 3))    <span class="cm"># flat = structural; steep = placement</span>

<span class="cm"># 4. LABEL HISTORY — does the disparity live in y, before any model touches it?</span>
print(train.groupby(<span class="st">"sex_race"</span>)[<span class="st">"y"</span>].mean().round(3))    <span class="cm"># base rates in the record itself</span></code></pre>
<p>Read them together, not separately. A steep threshold curve with modest proxy AUCs points at <em>placement</em> — a remedy that costs a policy meeting. Flat across thresholds, a high proxy AUC on one feature, and a base-rate gap already present in the labels points at data and target definition — a remedy that costs a rebuild. That is why this day sits before Day 47: <strong>the remedy inherits the diagnosis</strong>, and recommending the wrong one is how audits lose credibility with the engineering team you need on side.</p>

<div class="box an"><div class="bt">◆ Analogy</div><p>An accident investigator doesn't file "the plane crashed" — they trace the causal chain: sensor iced → autopilot misread → alarm design buried the warning → training never covered the mode. Each link implies a different fix, and fixing the wrong link leaves the crash available for reuse. Disparity findings without mechanism are "the plane crashed" reports; your checklist is the investigation that makes the fix land on the right link.</p></div>

<div class="box wa"><div class="bt">■ Mechanism determines remedy — that's the payoff</div><p>Watch how directly the mapping runs: representation gaps → data collection, not model surgery; proxy pathways → feature governance and the Day 26 taxonomy; label history → target redesign (the deepest fix, most often dodged); threshold placement → threshold redesign with an owner (the cheapest fix, most often available); pipeline artifacts → engineering correction and re-validation; construct invalidity → no model fix exists, because the instrument is measuring the wrong thing — the remedy is redesign or retirement of the tool, which is why this diagnosis is the most consequential and the least welcome. A recommendation section written without this mapping prescribes treatments for undiagnosed diseases — which is most bias-audit recommendation sections, and why they don't work.</p></div>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>Root cause is also where your audit's fairness definitions earn their keep: a disparity explained by label history reframes what "accuracy" was even measuring (accurate to a biased record); one explained by threshold placement relocates responsibility from "the algorithm" to a specific, ownable policy choice. Interviewers love this question — "you found a disparity; walk me through what you'd do next" — and the mechanism checklist <em>is</em> the answer.</p></div>

<h2>Today's takeaway</h2>
<p><strong>Seven</strong> mechanism families, worked in order, evidence for and against, competing explanations named when data can't separate them — because the remedy inherits its target from the diagnosis. The seventh, construct invalidity, is the one to add to your reflexes: ask what the tool claims to measure, what evidence supports that claim, and what its reliability is, before you accept that the score means anything at all. Tomorrow: the employer's side of that question — validity as the business-necessity defense — and the less-discriminatory-alternative search.</p>
`,
quiz:{q:"A vendor's assessment reports criterion validity of 0.31 against supervisor performance ratings. Why is that not the end of the enquiry?",options:["Criterion validity is not among the three strategies the Uniform Guidelines will accept as valid evidence","The criterion is supervisor ratings, which carry their own bias — the tool may faithfully predict a biased judgement","A correlation of 0.31 comfortably exceeds the regulatory minimum, so no further validity evidence is needed","Criterion validity applies only to content-based work samples, not to scored psychometric assessments here"],answer:1,explain:"Criterion validity is only as trustworthy as the criterion. Supervisor ratings are human judgements with documented demographic patterns, so a tool correlating well with them may be reproducing bias with excellent measured validity — BTM Day 32's label-trust problem in a lab coat. Ask who produced the criterion, whether it was examined for group differences, how representative the validation sample was, and what the effect size means against the observed adverse impact."}},

{n:47,title:"Remediation and the Less-Discriminatory-Alternative Search",read:"Build Step · 16 min read · ~1 hr build",body:`
<p>Findings diagnosed; now the section that changes things. A bias audit's remediation chapter has one distinctive obligation the risk assessment's didn't: the documented search for a <strong>less discriminatory alternative (LDA)</strong> — increasingly the legal and professional expectation, and the place your Phase 3 lab becomes the exhibit a challenge would turn on. This is also the IOU from Day 42: your BTM Day 36 audit recommended that someone run an LDA test before deployment. Today you are that someone.</p>

<h2>The LDA logic</h2>
<p>US disparate-impact doctrine runs a three-step dance: disparity shown → employer defends the practice as job-related/business-necessary → <em>the practice can still fail if a less discriminatory alternative serving the same business need was available and refused.</em> For algorithms, that third step is empirically checkable in a way it never was for interviews: you can <em>construct</em> alternatives and measure them. Which means an audit that doesn't search for LDAs has skipped the step that most threatens — or most protects — its subject.</p>

<h2>Step two first — you cannot evaluate an alternative to a defense you haven't examined</h2>
<p>Notice the sequence has a middle. Before the LDA question is even coherent, the employer asserts the practice is job-related and consistent with business necessity — and under the Uniform Guidelines (Day 46) that assertion is supposed to rest on documented validity evidence. Your audit has to interrogate it, because "serving the same business need" in step three is measured against whatever step two actually established. If the tool's validity evidence is thin, the LDA bar is correspondingly low: almost anything serves a business need the tool was never shown to serve.</p>
<p>The interrogation is five questions, and none require model access:</p>
<ol>
<li><strong>Which strategy is claimed</strong> — criterion-related, content, or construct? Vendors often gesture at all three and document none.</li>
<li><strong>What was the criterion</strong>, who produced it, and was it examined for group differences? (Day 46's criterion problem.)</li>
<li><strong>What is the reliability</strong>, on what sample, and does it differ by group?</li>
<li><strong>How representative was the validation sample</strong> of the population the tool now scores? A study on incumbents at one site does not automatically transport to a national applicant pool.</li>
<li><strong>What is the effect size</strong> of the validity claim — a correlation of 0.10 with performance is statistically detectable in a large sample and practically close to nothing, especially weighed against a substantial adverse impact.</li>
</ol>

<h2>Differential prediction — the psychometric test ML fairness reinvented</h2>
<p>There is one validity check you can run yourself with the data already loaded for the LDA table, and it is the oldest fairness test in employment testing — the <strong>Cleary model</strong>, in the literature since the 1960s. The question: does the relationship between score and job performance <em>differ by group?</em> Regress performance on score with group and an interaction term:</p>
<pre><code><span class="kw">import</span> statsmodels.formula.api <span class="kw">as</span> smf

<span class="cm"># perf = measured job performance; score = the tool's output; grp = protected group</span>
m = smf.ols(<span class="st">"perf ~ score * C(grp)"</span>, data=df).fit()
<span class="kw">print</span>(m.summary())

<span class="cm"># intercept difference -> the tool systematically over- or under-predicts</span>
<span class="cm">#   performance for one group at the same score (predictive bias)</span>
<span class="cm"># slope difference    -> the score means something different for each group;</span>
<span class="cm">#   one point of score does not buy the same performance</span></code></pre>
<p>Read the two coefficients separately, because they are different findings. A significant <strong>intercept</strong> difference means candidates from one group with identical scores actually perform better (or worse) than the tool predicts — using one cut-off for everyone then systematically misallocates opportunity. A significant <strong>slope</strong> difference means the instrument is not measuring the same thing across groups at all, which is a construct problem, not a threshold problem, and no re-tuning of the cut fixes it.</p>

<div class="box wa"><div class="bt">■ The insight worth carrying into an interview</div><p>Differential prediction and <strong>measurement invariance</strong> — does the instrument measure the same construct, on the same scale, across groups? — are the psychometric ancestors of everything in Phase 3. The employment-testing field worked on this for fifty years before algorithmic fairness existed, and a well-known critique argues the ML literature borrowed the four-fifths statistic from the Uniform Guidelines while leaving behind the validity apparatus that makes it meaningful. You can now hold both halves. When someone asks how you would audit a hiring tool, the answer that separates you is: <em>"First I would ask what it claims to measure and what validity evidence supports that, then test differential prediction — before I compute a single impact ratio, because a ratio on a meaningless score is a meaningless ratio."</em></p><p>The honest limitation, and state it: differential prediction requires a job-performance measure, which most audits do not have and which carries its own bias when they do. Where it is unavailable, say so in the limitations and fall back on the documentary questions above. An unanswerable question that you asked and recorded is worth far more than one you never raised.</p></div>


<h2>Building the LDA table in code</h2>
<p>The section stands or falls on one thing: every delta carries a <strong>paired</strong> bootstrap CI. Paired, because baseline and variant are scored on the same test rows — resample the rows, not the models, so the two are compared on identical draws and the shared sampling noise cancels:</p>
<pre><code><span class="kw">import</span> numpy <span class="kw">as</span> np, pandas <span class="kw">as</span> pd
<span class="kw">from</span> sklearn.metrics <span class="kw">import</span> roc_auc_score

<span class="kw">def</span> <span class="fn">worst_ratio</span>(sel, grp):
    r = pd.Series(sel).groupby(pd.Series(grp).values).mean()
    <span class="kw">return</span> r.min() / r.max()

<span class="kw">def</span> <span class="fn">paired_delta_ci</span>(y, grp, base_p, var_p, thr=.5, B=2000, seed=0):
    <span class="cm"># resample ROWS once per draw; score both candidates on the same rows</span>
    rng, n, d_auc, d_ir = np.random.default_rng(seed), len(y), [], []
    <span class="kw">for</span> _ <span class="kw">in</span> range(B):
        i = rng.integers(0, n, n)
        d_auc.append(roc_auc_score(y[i], var_p[i]) - roc_auc_score(y[i], base_p[i]))
        d_ir.append(worst_ratio(var_p[i] &gt; thr, grp[i]) - worst_ratio(base_p[i] &gt; thr, grp[i]))
    q = <span class="kw">lambda</span> a: (np.quantile(a, .025), np.quantile(a, .975))
    <span class="kw">return</span> {<span class="st">"dAUC"</span>: np.mean(d_auc), <span class="st">"dAUC_CI"</span>: q(d_auc),
            <span class="st">"dIR"</span>: np.mean(d_ir),   <span class="st">"dIR_CI"</span>: q(d_ir)}

<span class="cm"># --- the candidate set you already own ---</span>
candidates = {
    <span class="st">"baseline (audited tool)"</span>      : base_proba,
    <span class="st">"reweighed (Day 27)"</span>           : rw_proba,
    <span class="st">"threshold-optimized (Day 27)"</span> : to_proba,
    <span class="st">"threshold redesigned"</span>         : base_proba,      <span class="cm"># same model, different cut — see thr below</span>
    <span class="st">"proxies removed"</span>              : noproxy_proba,
    <span class="st">"logistic challenger (Day 21)"</span> : logit_proba,
}

rows = []
<span class="kw">for</span> name, p <span class="kw">in</span> candidates.items():
    thr = 0.58 <span class="kw">if</span> name == <span class="st">"threshold redesigned"</span> <span class="kw">else</span> 0.50
    d = paired_delta_ci(y_test.values, grp_test.values, base_proba, p, thr=thr)
    rows.append({<span class="st">"variant"</span>: name, <span class="st">"AUC"</span>: roc_auc_score(y_test, p),
                 <span class="st">"worst_IR"</span>: worst_ratio(p &gt; thr, grp_test),
                 **{k: (np.round(v, 4) <span class="kw">if</span> np.isscalar(v) <span class="kw">else</span> tuple(np.round(v, 4))) <span class="kw">for</span> k, v <span class="kw">in</span> d.items()}})
lda = pd.DataFrame(rows)

<span class="cm"># --- the LDA test: performance indistinguishable AND fairness materially better ---</span>
lda[<span class="st">"is_LDA"</span>] = lda.apply(<span class="kw">lambda</span> r: r[<span class="st">"dAUC_CI"</span>][0] &lt; 0 &lt; r[<span class="st">"dAUC_CI"</span>][1]
                                        <span class="kw">and</span> r[<span class="st">"dIR_CI"</span>][0] &gt; 0, axis=1)
print(lda.to_string(index=<span class="kw">False</span>))</code></pre>
<p>The <code>is_LDA</code> column is the section's whole argument compressed into a boolean: the performance interval <em>straddles zero</em> (you cannot show the variant is worse) while the impact-ratio interval sits <em>entirely above zero</em> (you can show it is fairer). A <code>True</code> in that column is the sentence that changes what the employer is choosing between. A table of all <code>False</code> is also a result — and a far stronger one than not having looked, because it converts &ldquo;could you have done better?&rdquo; from an open accusation into a documented, reproducible search.</p>

<div class="box tmpl"><div class="bt">▤ Build: the LDA comparison (assessment §6 core)</div><p>Assemble the candidate set — you already own the machinery: <strong>baseline</strong> (the audited tool) · <strong>reweighed variant</strong> (Day 27) · <strong>threshold-optimized variant</strong> (Day 27, legal posture flagged) · <strong>threshold-redesigned variant</strong> (if Day 46 found placement effects — often the winner) · <strong>reduced-feature variant</strong> (candidate proxies removed; measure what accuracy actually costs — frequently less than assumed) · <strong>simpler-model challenger</strong> (your logistic baseline; Day 21's fair-fight rules). One table: performance metric(s), the audit's core ratios, the extended battery's key gaps — every delta with a paired-bootstrap CI. Then the sentence the whole section exists for: <em>"Variant X achieves statistically indistinguishable performance (ΔAUC CI [−0.008, +0.011]) with the worst-case impact ratio improved from 0.74 to 0.88."</em> If such a variant exists, its refusal becomes the employer's documented choice; if none does, the audit has evidenced the defense.</p></div>

<h2>Writing the remediation rows</h2>
<p>Every recommendation inherits Day 40's grammar (verb, owner, date) plus the mechanism linkage from Day 46 and the taxonomy from Day 26: <em>what intervention, at which point, targeting which definition, expected effect with evidence, side effects priced, approval required.</em> Sequence them: immediate (threshold ownership, monitoring activation — this week), structural (data collection for thin cells, feature governance — this quarter), and foundational (label redesign — this year, and say why it's worth it).</p>

<div class="box an"><div class="bt">◆ Analogy</div><p>An environmental engineer who finds contamination doesn't just report the concentration — they're expected to evaluate feasible treatment options with costs and efficacy, because "cleaner alternatives existed and were declined" is precisely what the tribunal will ask. The LDA table is your treatment-options analysis: the document that converts "could you have done better?" from rhetoric into a filled-in table.</p></div>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>Notice the professional posture the LDA search enforces: it's symmetric. It can indict (an available alternative was refused) or defend (the search was performed; nothing dominated). Either way the organization ends up with a documented, evidence-based position instead of an untested claim — which is what separates governance from litigation bait. This table is also, quietly, the most impressive artifact in your entire portfolio for technical interviews.</p></div>

<h2>Today's takeaway</h2>
<p>The LDA search is the audit's distinctive obligation: construct the candidate variants, compare with paired CIs on one table, and let the evidence either surface a dominating alternative or document that none exists. Recommendations: mechanism-linked, taxonomy-specified, sequenced, owned. Tomorrow: packaging — the public summary versus the full report.</p>
`,
quiz:{q:"Your LDA table shows a reduced-feature variant with ΔAUC CI [−0.006, +0.009] versus baseline and worst-case impact ratio improved from 0.74 to 0.89. What has the audit established?",options:["A less discriminatory alternative with indistinguishable performance exists — keeping the baseline is a choice","That the baseline tool is unlawful as deployed and must be withdrawn from use pending remediation","That the variant should be promoted immediately, since it dominates the baseline on both dimensions","Nothing of legal weight, because model discrimination metrics are not recognised evidentiary standards"],answer:0,explain:"A performance-equivalent, substantially-less-disparate variant converts the abstract 'could you have done better?' into a concrete refusal-or-adoption decision with the evidence attached. The audit's job is to surface that decision and route it to accountable sign-off — deployment still runs through Day 21's gates and Day 39's acceptance."}},

{n:48,title:"Two Documents — The Public Summary and the Full Report",read:"Build Step · 15 min read · ~1 hr build",body:`
<p>LL144's sharpest governance innovation isn't a statistic — it's <strong>mandatory publication</strong>. The audit summary goes on the employer's public careers site. That creates a two-document discipline every serious audit now follows: a public summary that must stand alone under hostile reading, and a full report that carries the complete machinery. Today: what goes where, and why.</p>


<h2>Publication is one of three obligations — know all three cold</h2>
<p>The audit is the part you build, but an interviewer will test whether you understand the compliance object it sits inside. LL144 imposes <strong>three</strong> duties on the employer or employment agency, and an audit alone satisfies none of them:</p>
<ul>
<li><strong>The audit itself</strong> — conducted by an independent auditor, <em>no more than one year</em> before the tool is used (Day 43).</li>
<li><strong>Publication</strong> — a summary of the most recent audit&rsquo;s results, posted &ldquo;clearly and conspicuously&rdquo; on the employer&rsquo;s website, carrying the date of the audit and the tool&rsquo;s distribution date.</li>
<li><strong>Candidate notice</strong> — provided <strong>at least ten business days</strong> before the AEDT is used, identifying the job qualifications and characteristics the tool assesses, and informing the individual of their right to request an <strong>alternative selection process or reasonable accommodation</strong>. The opt-out instruction is published alongside the audit summary.</li>
</ul>
<p>Two things about the opt-out are worth internalising, because this is the single most misreported provision in the secondary literature. <strong>LL144 requires notice, not provision.</strong> The candidate must be told they may request an alternative selection process or a reasonable accommodation, and given instructions for making that request — but the DCWP rules state expressly that nothing in the subchapter <em>requires</em> an employer to provide an alternative selection process, and the DCWP FAQ frames the accommodation instructions as pointing to <em>other</em> laws. So the accurate formulation is: LL144 creates a right to <em>ask</em>; whether the employer must <em>grant</em> anything is governed elsewhere — most often the ADA or state and city disability law, which can independently compel a reasonable accommodation. Keep the two obligations separate in your writing. Plenty of vendor guides collapse them into "candidates have a right to a human review," and an interviewer who knows the rule will hear that as a tell. The second point: notice is where the largest share of real-world non-compliance sits — it is far easier to commission an audit than to rewire an applicant-tracking system to fire a compliant notice ten business days ahead of a screen.</p>

<div class="box gov"><div class="bt">✦ Why this precision earns its keep</div><p>This is a live demonstration of a Phase 5 habit: when a compliance claim will appear in a document with your name on it, verify it against the rule text or the regulator's own FAQ, not against the eighth blog post in the search results. Several widely-cited guides assert an unconditional right to an alternative process. The rules say otherwise. Being the person who cites the primary source correctly is worth more in a review than any amount of framework vocabulary.</p></div>

<div class="box wa"><div class="bt">■ The penalty structure — why this is not a paperwork risk</div><p>Civil penalties run from <strong>$500 for a first violation to $1,500 for each subsequent violation</strong>, and — the clause that matters — <strong>each day a non-compliant AEDT remains in use is a separate violation</strong>. A tool screening candidates for a quarter without a current audit is not one $500 problem; it is a compounding daily one. DCWP enforces. Say this precisely in an interview: the exposure is a function of <em>duration</em>, which is why the first thing you do on any engagement is inventory the tools and their audit dates (Day 34), not compute anything.</p></div>

<h2>The public summary (what the statute requires, done well)</h2>
<p>Required content: the date of the most recent audit, the distribution date of the tool, and the results — <strong>selection/scoring rates and impact ratios for every required category</strong>, including intersections, with the data sources and the small-category exclusions disclosed (Day 43). Your craft additions that cost nothing and prevent misreading: per-category n's; one plain-language paragraph on what an impact ratio is and is not ("a screening indicator, not a legal determination"); and honest labels on inconclusive cells ("limited data; see full methodology"). The summary is written for three simultaneous readers — a candidate deciding whether to apply, a journalist hunting a headline, a plaintiff's expert hunting an omission — and the discipline is the same for all three: <em>no number without its denominator, no claim the full report doesn't carry.</em></p>

<h2>The full report (everything you've built)</h2>
<p>The Day 33 skeleton, audit-flavored: independence statement (42) · scope block (43) · the legal core tables (44) · the extended battery with corrections and caveats (45) · root-cause analysis (46) · LDA table and sequenced remediation (47) · limitations, register linkage, evidence appendices. The full report is where nuance lives; the summary is where accountability lives; the two must never disagree on a number — reconciliation between them is the last pre-release check.</p>

<div class="box an"><div class="bt">◆ Analogy</div><p>A restaurant's posted health-grade placard and the inspector's full report. The placard is standardized, public, glanceable — and legally required to match the report behind it. Imagine the scandal architecture if placards said A while reports said C: that reconciliation requirement is the whole trust mechanism. Your two documents are placard and report, and the no-disagreement rule is absolute.</p></div>

<div class="box hl"><div class="bt">▲ What publication actually produced — the null-compliance finding</div><p>Before you assume disclosure works, know the evidence. A 2024 study had 155 investigators record LL144 compliance across <strong>391 employers</strong>. They found <strong>18 posted audit reports and 13 posted transparency notices.</strong> And of the audits that were published, nearly all reported impact ratios above 0.8. The authors named the mechanism <em>null compliance</em>: because the employer holds substantial discretion over whether a given tool is in scope at all, an absent report cannot be read as non-compliance — so the transparency regime generates a signal that cannot be interpreted. Pair that with the December 2025 Comptroller finding (Day 42) and you have the honest picture: publication mandates without proactive review produce sparse, self-selected, uniformly reassuring disclosure. This is the best answer available to &ldquo;what&rsquo;s wrong with the current bias-audit regime?&rdquo; — and the strongest argument for why the auditor&rsquo;s own standards, not the statutory floor, are what make the work worth anything.</p></div>

<div class="box wa"><div class="bt">■ The transparency squeeze — name it, navigate it</div><p>Publication creates a real tension you should be able to discuss fluently: sunlight drives accountability, but it also tempts <em>metric management</em> — organizations optimizing the published number (impact ratios) while the unpublished dimensions (error-rate fairness, calibration) drift. It's Goodhart's law — once a measure becomes a target it stops being a good measure — operating on the audit itself. Your counterweights: the extended battery exists and is findable; the monitor (Day 31) watches the unpublished dimensions; and your summary's plain-language paragraph explicitly says the ratios are not the whole picture. An auditor who anticipates the gaming of their own instrument is playing the full game.</p></div>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>The two-document pattern generalizes far beyond LL144 — model cards vs. internal validation reports, ISO 42005's stakeholder-facing outputs vs. the working assessment, regulatory filings vs. engineering annexes. Learn the discipline once: <em>public artifact readable alone, full artifact carrying everything, zero numerical daylight between them.</em> Tomorrow you assemble both — Deliverable #5.</p></div>

<h2>Today's takeaway</h2>
<p>Three obligations, not one: current audit, conspicuous publication, ten-business-day candidate notice carrying request instructions (notice, not provision) — penalties compounding daily. Summary: required results with n's, plain-language framing, disclosed exclusions — written for the candidate, the journalist, and the opposing expert at once. Full report: the complete Phase 5 machinery. Reconciled to the digit, always. Tomorrow: assembly.</p>
`,
quiz:{q:"Why does the public summary include per-category n's and a plain-language 'what an impact ratio is and is not' paragraph, beyond the statute's minimum?",options:["To give the summary sufficient length that readers treat the published disclosure as a serious document","Because standalone numbers invite misreading: denominators and framing prevent false alarm and false comfort","Because the enforcing agency's rules require an explanatory narrative alongside the numerical tables","To provide a self-contained substitute for the full report, which most readers will never request"],answer:1,explain:"A published ratio without its n or its interpretive frame becomes whatever the reader's incentives want it to be. The two cheap additions preempt the predictable misreadings while keeping the placard-report reconciliation exact — craft that protects subject, employer, and auditor simultaneously."}},

{n:49,title:"Assembly — Your Model Bias Assessment (Deliverable #5)",read:"Capstone Build · 20 min read · ~6 hr build · Flagship deliverable",body:`
<p>Assembly day for flagship two. By tonight: a complete bias assessment built to LL144 methodology — public summary and full report — on your own model, with the extended battery no minimal-compliance audit carries.</p>

<div class="box hl"><div class="bt">▲ Phase 5 in one breath</div><p>LL144 supplies the operative standard and independence is its structural control (42). Scoping fixes categories, windows, unknowns and the disclosed 2% exclusions before any math runs — and the population is built in SQL, de-duplicated by a stated rule and reconciled against pandas, because an impact ratio on a wrongly-assembled population cannot be repaired downstream (43). The legal core: rates → impact ratios vs. the most-selected category, scoring rates via the median construction, four-fifths as conventional screen with CIs deciding clear/straddling/inconclusive (44). The extended battery adds error rates, precision, calibration, stability, matched pairs and the stage-by-stage funnel audit — pre-specified, BH-corrected, label-caveated, labeled core-vs-extended (45). Root cause walks seven mechanism families — the seventh being construct invalidity, where the Uniform Guidelines' validity requirements live — because remedy inherits diagnosis (46). Step two interrogates the validity evidence behind the business-necessity defense and tests differential prediction, then the LDA search converts 'could you have done better' into a filled-in table with paired CIs (47). And two reconciled documents split accountability from nuance (48).</p></div>

<h2>Assembly checklist</h2>
<ol>
<li><code>bias-assessment-full.md</code> — the complete report in the Phase 5 order: independence statement, scope block, methodology (pre-specified plan + ticket count + tool versions), legal core tables, extended findings ledger, root-cause section, <strong>validity evidence review</strong>, LDA table + sequenced remediation, limitations, appendices linking the Day 32 notebook and register row R-09.</li>
<li><strong>The extraction artifacts</strong> — the population-build SQL with its header comment (population defined, de-duplication rule, date window), the row-count reconciliation ladder with every drop explained, the demographic skew check on the unknown bucket, and the SQL-versus-pandas cross-check result. Methodology states the population was independently reconstructed and reconciled.</li>
<li><strong>The funnel table</strong> — conditional and cumulative impact ratios at every stage from application to final decision, with reviewer override rates by group and direction, appeal filing rates, and the stage where disparity actually accumulates named explicitly. Labelled extended.</li>
<li><strong>The validity section</strong> (new, and the part most portfolios lack): what the tool claims to measure, which of the three Uniform Guidelines strategies is claimed, the five interrogation questions from Day 47 with whatever answers your scenario supports, reliability evidence or its absence, and — where a performance measure exists — the differential-prediction regression with slope and intercept read separately. Where the evidence cannot be obtained, record the question and the gap rather than omitting the section.</li>
<li><code>bias-assessment-public-summary.md</code> — one to two pages: audit date, tool, category tables with n's and ratios, exclusions disclosed, the plain-language paragraph, pointer to methodology.</li>
<li><strong>Reconcile</strong> — every number in the summary located and matched in the full report. Digit-exact.</li>
<li><strong>Check against the Day 42 table.</strong> Walk all nine rows and confirm each one now sits in the right-hand column: attestation present, mandated categories with disclosed exclusions, historical data with a stated window, findings carrying n's and CIs and labeled core-vs-extended, the primary definition pre-specified with its defense, a root-cause section, a validity-evidence review, an LDA table with paired CIs, and two reconciled documents. Any row still reading like the left column is unfinished work, not a stylistic choice.</li>
<li><strong>Triple-read</strong> (Day 41's discipline): candidate, journalist, opposing expert.</li>
</ol>

<h2>File Deliverable #5</h2>
<p>Commit both documents + <code>WHAT-I-LEARNED.md</code> to <code>taming-the-machine/d49-bias-assessment/</code>. Reflection: <em>where did the legal minimum and your professional judgment diverge most — and what does that gap teach you about the difference between compliance and assurance?</em></p>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>Portfolio arithmetic, updated: you now hold a NIST-aligned risk assessment <em>and</em> a bias assessment built to LL144 methodology with an LDA analysis — on models you built. One flagship remains: Phase 6 widens the aperture from "is this model risky/fair" to "should this system exist in this form at all" — the Responsible AI assessment, built on ISO 42005's impact-assessment structure with Microsoft's RAI template and Canada's AIA as working references. Then the governance package, the executive defense, and the job market. The finish line is visible.</p></div>
`,
vocab:[
{term:"AEDT",def:"Automated employment decision tool — LL144's regulated object; substantially assists or replaces hiring/promotion judgment."},
{term:"Independence statement",def:"Who audited, relationships, payment, who could alter findings — before any math."},
{term:"EEO-1 categories",def:"The federal race/ethnicity reporting framework LL144 audits slice by."},
{term:"Unknown bucket",def:"Candidates without self-identified demographics; its size is itself a data-governance finding."},
{term:"Small-category rule",def:"<2% categories may be excluded from ratios — with mandatory disclosure of the exclusion."},
{term:"Impact ratio",def:"Category rate ÷ most-selected category's rate; the published core number."},
{term:"Scoring rate",def:"Share of a category above the overall median score — LL144's continuous-tool construction."},
{term:"Four-fifths screen",def:"Sub-0.80 ratio as conventional adverse-impact signal; a screen, not a codified verdict."},
{term:"Core vs. extended",def:"Findings labeled as legally mandated computation vs. added professional rigor."},
{term:"Mechanism checklist",def:"Representation, proxies, label history, measurement gaps, threshold placement, pipeline artifacts."},
{term:"LDA search",def:"Constructed alternatives compared with paired CIs; doctrine's third step made empirical."},
{term:"Two-document rule",def:"Public summary readable alone; full report carries everything; zero numerical daylight."}
],
quiz:{q:"An employer's audit reports only the impact-ratio tables, all above 0.80, and concludes 'the tool is fair.' Using Phase 5's framework, what's the precise critique?",options:["The published tables are non-compliant, because error-rate metrics are part of the mandated computation","Compliance conflated with assurance: the core passed, but fairness needs error, calibration and mechanism","There is no critique to make: impact ratios above the screening threshold do establish that a tool is fair","The results should not have been published at all until the extended battery had been independently run"],answer:1,explain:"The mandated computation is a floor: outcome disparity at one decision point under a conventional screen. 'Fair' is a claim about error distribution, meaning, and mechanism that the core cannot carry — the exact compliance-vs-assurance gap your extended battery exists to close, and a distinction interviewers probe directly."}},
{n:50,title:"Anatomy of a Responsible AI Assessment",read:"Lesson · 16 min read · Phase 6 begins",body:`
<p>Your first two flagships asked "is this model risky?" and "is this model fair?" The third asks the widest question in the discipline: <strong>"should this system exist, in this form, in this context — and under what obligations?"</strong> That's the <strong>Responsible AI (impact) assessment</strong>, and unlike the first two, its center of gravity is people and consequences, not model internals.</p>

<h2>The EU AI Act, operationally</h2>
<p>Phase 4 opened with supervisory model risk. Phase 5 opened with LL144. This phase opens with the regime that shapes more AI governance job descriptions than either: <strong>Regulation (EU) 2024/1689</strong>, the EU AI Act. You have met it a dozen times in these two courses as a supporting citation. Today you learn it as an operating framework, because &ldquo;familiar with the EU AI Act&rdquo; on a résumé is checked in about ninety seconds by an interviewer who asks what applies right now.</p>
<p><strong>The timeline moved this summer, and the change is counterintuitive.</strong> The AI Act entered into force on 1 August 2024 with staggered application. On 19 November 2025 the Commission proposed the <em>Digital Omnibus on AI</em> to defer the heaviest tier, citing harmonised standards from CEN-CENELEC running late, incomplete Commission guidance, and Member States that had not resourced their market surveillance authorities. The second trilogue collapsed on 28 April 2026; political agreement followed on 7 May; Parliament endorsed the text on 16 June by 423 to 57; the Council gave final approval on 29 June. <strong>Regulation (EU) 2026/1744</strong> was published in the Official Journal on <strong>24 July 2026</strong> and entered into force on <strong>27 July 2026</strong> — six days before the deadline it moved.</p>

<div class="box tmpl"><div class="bt">▤ What applies when — the version to memorise</div>
<table class="vocab">
<tr><th>Date</th><th>What applies</th><th>Status</th></tr>
<tr><td>2 Feb 2025</td><td><strong>Article 5</strong> prohibited practices · <strong>Article 4</strong> AI literacy duty</td><td>In force, unchanged</td></tr>
<tr><td>2 Aug 2025</td><td><strong>GPAI</strong> provider obligations (Arts 51–55)</td><td>In force, unchanged</td></tr>
<tr><td><strong>2 Aug 2026</strong></td><td><strong>Article 50 transparency</strong> — disclose AI interaction, label AI-generated content · AI Office enforcement powers over GPAI providers</td><td><strong>Live now — NOT deferred</strong></td></tr>
<tr><td>2 Dec 2026</td><td>Article 50(2) marking and machine-readable detection for systems placed on the market before 2 Aug 2026 · <strong>new Article 5 prohibition</strong> on AI generating non-consensual intimate imagery and CSAM</td><td>Pending</td></tr>
<tr><td>2 Aug 2027</td><td>Member States to establish national AI regulatory sandboxes</td><td>Deferred from earlier</td></tr>
<tr><td><strong>2 Dec 2027</strong></td><td><strong>Annex III</strong> stand-alone high-risk systems — hiring, credit scoring, education, biometrics, law enforcement, critical infrastructure</td><td>Deferred 16 months</td></tr>
<tr><td>2 Aug 2028</td><td><strong>Annex I</strong> high-risk AI embedded in regulated products — medical devices, machinery, toys</td><td>Deferred 12 months</td></tr>
</table>
<p>Penalties are unchanged: up to <strong>€35M or 7%</strong> of worldwide turnover for prohibited practices, <strong>€15M or 3%</strong> for transparency and high-risk breaches.</p></div>

<div class="box wa"><div class="bt">■ &ldquo;The EU delayed the AI Act&rdquo; — the sentence that will cost you an interview</div><p>That headline is wrong twice, and correcting it precisely is the cheapest credibility you can buy in this field. It is wrong that everything moved: the Article 5 prohibitions, the Article 4 AI literacy duty, the GPAI obligations and the Article 50 transparency rules are all live, and Article 50 went live <em>on schedule</em> three weeks before you are reading this. It is wrong that the delay is a pause: the Omnibus deferred deadlines without changing a single substantive obligation, and it <em>added</em> a prohibition. The accurate one-liner is: <em>&ldquo;Annex III high-risk deferred to December 2027 and Annex I to August 2028, but Article 50 transparency applied on schedule in August 2026, GPAI never moved, and there's a new Article 5 prohibition landing in December.&rdquo;</em> An interviewer who hears that stops testing whether you follow primary sources.</p><p>The second-order point matters more. The hard part of AI Act compliance was never the documentation template — it is finding every AI system in the organisation, classifying each one, and keeping the inventory current as product ships. None of that depends on standards being final. A team that starts now has eighteen months to refine; a team that starts in late 2027 has weeks.</p></div>

<h2>Article 50 — the obligation that is live today</h2>
<p>Because it applies now while the high-risk tier does not, Article 50 is where a practitioner's first real EU deliverable usually lands. Four duties, each attaching to a different actor:</p>
<ul>
<li><strong>Interaction disclosure.</strong> A person interacting with an AI system must be informed of that, unless it is obvious to a reasonably observant person. This is the chatbot rule.</li>
<li><strong>Synthetic content marking.</strong> Providers of systems generating synthetic audio, image, video or text must mark outputs in a <em>machine-readable</em> format detectable as artificially generated. Systems already on the market before 2 August 2026 have until <strong>2 December 2026</strong>.</li>
<li><strong>Emotion recognition and biometric categorisation.</strong> Deployers must inform the people exposed.</li>
<li><strong>Deep fake and public-interest text disclosure.</strong> Deployers must disclose that content has been artificially generated or manipulated.</li>
</ul>
<p>Note the provider/deployer split running through that list — tomorrow's topic, and the reason two organisations looking at the same system can owe completely different things. Note also that machine-readable marking is a <em>technical</em> requirement: watermarking, cryptographic provenance such as C2PA-style content credentials, or metadata that survives normal handling. &ldquo;We put a disclaimer in the footer&rdquo; does not satisfy Article 50(2), and spotting that gap is the kind of finding that gets a junior practitioner noticed.</p>

<h2>AI literacy — the deliverable you can own in week one</h2>
<p>Article 4 has been in force since February 2025 and is the most under-served obligation in the Act, which makes it an unusually good first project for someone new to a governance function. It requires providers and deployers to take measures ensuring a <em>sufficient level of AI literacy</em> among staff and others operating AI on their behalf, taking into account their technical knowledge, experience, education, and the context of use.</p>
<p>&ldquo;Sufficient&rdquo; is not defined, which means the artifact is a judgment call you must defend — exactly the kind of thing this course has been training. A defensible programme has four parts: <strong>audience segmentation</strong> (executives, builders, deployers-in-the-business, and everyone with a chat window need different things), <strong>content mapped to what each group can actually do wrong</strong>, <strong>evidence of completion</strong> that survives an audit, and a <strong>refresh cadence</strong> tied to your own change triggers (Day 55). Write the one-page programme design for your portfolio organisation. It takes an hour and it is a deliverable most AIGP holders cannot produce.</p>

<h2>The three working references</h2>
<p>You'll build from the convergent structure of three public instruments, each contributing a signature strength:</p>
<ul>
<li><strong>ISO/IEC 42005</strong> — the international standard for AI system impact assessment: <em>process</em> discipline (when to assess, when to reassess, how the assessment integrates with an ISO 42001 management system so it feeds governance rather than shelf-ware).</li>
<li><strong>Microsoft's RAI Impact Assessment template</strong> — the practitioner's <em>document</em> structure: system profile → intended uses analyzed one at a time → stakeholder analysis → harms taxonomy with fairness considerations → mitigations. Its signature move: every intended use gets its own full pass, because "the system" doesn't have impacts — <em>uses</em> do.</li>
<li><strong>Canada's Algorithmic Impact Assessment</strong> — the <em>proportionality engine</em>: a scored questionnaire (65 risk + 41 mitigation questions in its current form) rolling up to four impact levels, each level triggering escalating mandatory obligations — and completed assessments are published. Score → level → obligations → sunlight.</li>
</ul>
<p>Synthesized, your document: <strong>profile → intended (and foreseeable) uses → stakeholders → harms & benefits → impact level with proportionate obligations → mitigations & monitoring → publication posture.</strong> The Day 33 skeleton still underneath; the aperture wider at every section.</p>

<div class="box an"><div class="bt">◆ Analogy</div><p>Your risk assessment was the structural engineer's report on the bridge; the bias audit was the load-testing lab's certification of one critical property. The RAI assessment is the <em>environmental and community impact statement</em>: who lives downstream, what happens to the river, who was consulted, what alternatives were weighed — including the alternative of not building. Different question, different evidence, different readers; a bridge can be structurally perfect and still be the wrong bridge in the wrong place.</p></div>

<div class="box wa"><div class="bt">■ The trap this genre invites</div><p>Impact assessments are where organizations most love to perform virtue — pages of principles, zero falsifiable commitments. Your inoculation is everything the last 49 days built: harms stated with affected parties and magnitudes; mitigations with owners, dates, and measurable effects; monitoring wired to your Day 31 instrument; obligations triggered by a scored level, not a mood. The genre's reputation problem is your differentiation opportunity.</p></div>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>Placement matters: ISO 42005 is designed to slot into an ISO 42001 AIMS — the impact assessment is a required <em>input</em> to the management system's risk treatment, not a standalone essay. Day 54 makes that linkage concrete with Annex A controls and the Statement of Applicability. Your three flagships will interlock the same way: risk assessment as container, bias audit as deep-dive, RAI assessment as the context layer — one governance package, which is exactly what Day 57 assembles.</p></div>

<h2>Today's takeaway</h2>
<p>The EU AI Act operationally: Annex III deferred to December 2027 and Annex I to August 2028 by Regulation (EU) 2026/1744, but Article 50 transparency went live on schedule in August 2026, prohibitions and AI literacy have applied since February 2025, GPAI since August 2025, and a new prohibition lands in December 2026. Article 50 is today's obligation; AI literacy is the deliverable you can own immediately. <em>(Current to August 2026; CEN-CENELEC harmonised standards still outstanding — re-check before relying on this.)</em> The RAI assessment asks "should this exist in this form": ISO 42005 for process, Microsoft's template for per-use document structure, Canada's AIA for scored proportionality. Falsifiable commitments over performed virtue, always. Tomorrow: the system profile and the per-use analysis that anchors everything.</p>
`,
quiz:{q:"Why does Microsoft's template force a full analysis pass per intended use rather than one pass for 'the system'?",options:["To produce a longer document, which signals to reviewers that the analysis was conducted thoroughly","Because regulators assess fees per declared use case, so each must be separately enumerated and costed","Because systems do not have impacts — uses do: stakeholders, harms and oversight differ per deployment","Because each distinct intended use is served by a separately trained model with its own evaluation data"],answer:2,explain:"Impact is a property of a system-in-context: population, decision stakes, autonomy level, and failure consequences all attach to the use, not the weights. Per-use analysis is the structural guard against assessing a comfortable abstraction while the risky deployment rides along unexamined."}},

{n:51,title:"The System Profile and Intended-Use Analysis",read:"Build Step · 16 min read · ~1 hr build",body:`
<p>Today you write the assessment's foundation: the <strong>system profile</strong> (what this thing is, in language a non-engineer can act on) and the <strong>intended-use analysis</strong> — including the uses nobody intends but everyone should foresee.</p>

<h2>The system profile</h2>
<p>One page, structured: what the system does and doesn't do; inputs and their provenance (lineage from Day 34, now including the supply chain — your Day 17 fine-tune means a pretrained component with unknown corpus enters the profile as a <em>declared inheritance</em>); outputs and their form (score? classification? generated text?); the decision architecture (advisory vs. determinative, and where humans sit — Day 16's routing made explicit); deployment context (volume, geography, integration points); and lifecycle status. The profile's test: could a new legal counsel or board member read it cold and correctly answer "what could this do to a person?"</p>

<h2>Intended uses — one pass each</h2>
<p>Per Day 50's structure, enumerate the intended uses and give each its own analysis: the problem it solves, for whom; why an AI approach over alternatives (including the null alternative — the honest paragraph most assessments skip); fitness evidence (your Phase 2/3 results, cited not repeated); and the use's <em>boundary conditions</em> — populations, geographies, and decision types it was <em>not</em> validated for. Boundaries are the section's teeth: "validated on US adult income data, 2020-era collection; not validated for [other population/era]" is one sentence that prevents the most common real-world failure — silent scope creep into unvalidated territory.</p>

<div class="box tmpl"><div class="bt">▤ Build: the misuse and foreseeable-use register</div><p>Then the section that separates serious assessments from brochures: <strong>reasonably foreseeable non-intended uses.</strong> Three prompts generate it: <em>Capability creep</em> — what adjacent decision will someone repurpose this for? (A hiring screen becomes a promotion screen; a fraud flag becomes a customer-worth score.) <em>Automation creep</em> — the advisory output that becomes de facto determinative when volume rises and reviewers rubber-stamp (Day 16's automation bias, now a register entry with a named tripwire: override rates falling below X%). <em>Adversarial use</em> — who benefits from gaming it, and what does Day 20 say about how? Each entry: use → likelihood driver → harm → the control that blocks or detects it. ISO 42005 and the EU AI Act both push assessment beyond intended use for exactly this reason: the gap between intended and actual is where incidents live.</p></div>

<div class="box an"><div class="bt">◆ Analogy</div><p>Pharmaceutical labeling: indication (intended use), contraindications (boundary conditions), and known off-label patterns the manufacturer must anticipate and warn against. A drug company that documented only the indication — while knowing physicians routinely prescribe off-label — would be negligent by design. Your foreseeable-use register is the contraindications-and-off-label section for an algorithm.</p></div>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>The boundary conditions and misuse register also generate your reassessment triggers (ISO 42005's process contribution): any use crossing a stated boundary, any tripwire firing, any new population — each mandates a new assessment pass, and the document says so. That converts the assessment from a launch gate into a living contract with the deployment. Day 55 wires those triggers into the monitoring and change-management machinery you already built.</p></div>

<h2>Today's takeaway</h2>
<p>Establish your role before anything else — provider, deployer, importer or distributor — and watch for the transitions that turn a deployer into a provider. Classify against Annex III with the narrow-task filters and the profiling override, and write the one-page classification for your own model. FRIA, DPIA, Article 22 and ISO 42005 are four different instruments; know which is which. Then: profile a non-engineer can act on, with supply-chain inheritances declared; per-use analysis with the null alternative addressed and boundaries stated; a foreseeable-use register covering capability creep, automation creep, and adversarial use — each with its blocking or detecting control. Tomorrow: the stakeholder and harms analysis, the assessment's moral center.</p>
`,
quiz:{q:"Why does the intended-use analysis require stating boundary conditions ('not validated for X population/era/decision') with the same prominence as capabilities?",options:["Because unstated boundaries enable silent scope creep, while stated ones become reassessment triggers","Because prominent limitation language is the principal mechanism for reducing the vendor's legal exposure","Because validation datasets are commercially sensitive and cannot be described in a published assessment","Because clearly stated constraints discourage adoption, which is the safest outcome for a novel system"],answer:0,explain:"Systems rarely fail at their validated center; they fail when quietly extended to populations, eras, or decisions nobody re-validated. Boundaries written into the assessment convert 'we never tested that' from a post-incident confession into a pre-committed gate."}},

{n:52,title:"Stakeholders, Harms, and Benefits — The Moral Center",read:"Build Step · 17 min read · ~1 hr build",body:`
<p>Today the assessment does its distinctive work: a systematic accounting of <strong>who is affected and how</strong> — harms <em>and</em> benefits, named parties, honest magnitudes. This is Day 35's stakeholder discipline widened to societal aperture, structured by a harms taxonomy so nothing obvious gets missed.</p>

<h2>The harms taxonomy — walk every branch</h2>
<p>For each stakeholder from your two-ring map, sweep five harm families (synthesized from Microsoft's taxonomy and the impact-assessment literature):</p>
<ul>
<li><strong>Allocation harms:</strong> opportunities and resources withheld or misdirected — the loan denied, the candidate screened out. Your bias audit is the evidence engine here; cite it, don't repeat it.</li>
<li><strong>Quality-of-service harms:</strong> the system works worse for some — your per-group error, calibration, and stability findings, plus Day 17's truncation point for text systems.</li>
