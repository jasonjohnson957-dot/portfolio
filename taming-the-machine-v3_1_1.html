<p>Leave model and data alone; modify the output stage. <strong>Threshold optimization</strong> picks per-group thresholds satisfying a chosen fairness criterion — this is the one you ran in BTM Day 36, and the before-and-after table you produced there is exactly its signature: the targeted metric improves, another moves against you. Surgical, fully auditable, no retraining — and it makes the group-based treatment explicit, which is precisely its legal sensitivity.</p>

<div class="box an"><div class="bt">◆ Analogy</div><p>A restaurant's food keeps coming out inconsistent across stations. Pre-processing re-portions the ingredients delivered to each station; in-processing retrains the cooks with new recipes; post-processing stations a corrector at the pass, adjusting plates before they leave. Earlier fixes address causes and travel further; later fixes are cheaper, faster, and visible — and the visible one requires you to admit, on the record, that plates are being adjusted by station.</p></div>

<div class="box wa"><div class="bt">■ The selection logic an assessor applies</div><p>Which intervention fits is a governance decision with real constraints: post-processing's explicit group-based thresholds face legal headwinds in some domains (notably US employment/credit contexts) while being celebrated in others; in-processing bakes a fairness definition permanently into weights nobody can later inspect; reweighing is modest but defensible everywhere. And every mitigation targets <em>one</em> fairness definition — improving it can worsen another (BTM Day 34 never leaves). The assessor's questions: which definition was targeted, what happened to the others, what accuracy was traded, and who approved the trade?</p></div>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>Your Phase 5 bias assessment's recommendation section will present mitigation options through exactly this taxonomy — intervention point, targeted definition, side effects, legal posture — because a recommendation that just says "debias the model" is as useful as a doctor prescribing "medicine." Naming the intervention class, its tradeoffs, and its approval requirements is what makes the recommendation executable.</p></div>

<h2>Today's takeaway</h2>
<p>Mitigate pre (reweighing — rebalance influence), in (constraints/adversarial — change the objective), or post (thresholds — adjust decisions); each targets one fairness definition, trades something, and carries a distinct legal posture. Tomorrow you run the two workhorses and measure exactly what they trade.</p>
`,
quiz:{q:"Why must a bias-mitigation recommendation name the intervention point (pre/in/post) rather than just saying 'debias the model'?",options:["Because the classes differ in mechanism, targeted definition, side effects and legal posture — name the trade","Because the AIF360 library's API requires the intervention point to be declared before a method can be called","Because pre-processing is the correct default in every context, so a recommendation should specify reweighing","Because post-processing methods are prohibited outright in most jurisdictions that regulate automated decisions"],answer:0,explain:"'Debias' isn't an action. Reweighing, constrained training, and threshold optimization change different components, optimize different definitions, and face different regulatory receptions — the recommendation's job is to make that choice, its costs, and its approver explicit."}},

{n:27,title:"Mitigation Hands-On — Reweighing & Threshold Optimization",read:"Lab · 12 min read · ~1.5 hr lab",body:`
<p>Theory becomes evidence today. In BTM Day 36 you ran one mitigation and reported a before-and-after table — the right instinct, and roughly what most published bias work shows. Today you do the version that survives an opposing expert: <strong>two</strong> mitigations from different points in the taxonomy, compared against baseline, with <strong>every delta carrying a confidence interval</strong> and every side effect named. Same tools, professional standard.</p>

<h2>Reweighing (pre-processing)</h2>
<pre><code><span class="cm"># weight = (expected joint frequency) / (observed joint frequency)</span>
<span class="cm"># so that group ⟂ outcome in the training signal</span>
p_g = df_train.groupby(<span class="st">"sex"</span>).size() / len(df_train)
p_y = df_train[<span class="st">"y"</span>].value_counts(normalize=<span class="kw">True</span>)
p_gy = df_train.groupby([<span class="st">"sex"</span>, <span class="st">"y"</span>]).size() / len(df_train)
w = df_train.apply(<span class="kw">lambda</span> r: p_g[r[<span class="st">"sex"</span>]] * p_y[r[<span class="st">"y"</span>]] / p_gy[r[<span class="st">"sex"</span>], r[<span class="st">"y"</span>]], axis=1)

model_rw = XGBClassifier(**params).fit(X_train, y_train, sample_weight=w)</code></pre>
<p>Ten lines, no library magic — you can derive every weight by hand, which is exactly why reweighing survives hostile review.</p>

<h2>Threshold optimization (post-processing) — same tool, tighter reporting</h2>
<pre><code><span class="kw">from</span> fairlearn.postprocessing <span class="kw">import</span> ThresholdOptimizer
to = ThresholdOptimizer(estimator=model, constraints=<span class="st">"equalized_odds"</span>,
                        predict_method=<span class="st">"predict_proba"</span>,
                        prefit=<span class="kw">True</span>)          <span class="cm"># wrap the trained model, don't retrain (BTM Day 36)</span>
to.fit(X_train, y_train, sensitive_features=g_train)
preds_to = to.predict(X_test, sensitive_features=g_test)</code></pre>
<p>Fairlearn searches per-group thresholds satisfying the chosen constraint at least accuracy cost. Note what prediction now <em>requires</em>: the sensitive feature at decision time — an operational and legal fact your writeup must state, not bury. That requirement is easy to miss when the API makes it a keyword argument; in deployment it is a data-collection mandate and a compliance question.</p>

<h2>The before/after table — your evidence artifact</h2>
<p>Run all three models (baseline, reweighed, threshold-optimized) through <code>MetricFrame</code> + your bootstrap CIs, into one table: accuracy, selection gap, EO gap, calibration by group — <em>with intervals</em>. Expect the honest, slightly deflating truth: reweighing narrows gaps moderately at small accuracy cost; threshold optimization nails its target definition while other definitions move, sometimes backward; nothing reaches zero-everything (the theorem holds). <strong>That table, uncertainty included, is what a professional mitigation analysis looks like</strong> — and almost no published tutorial shows the CIs.</p>

<div class="box an"><div class="bt">◆ Analogy</div><p>Physical therapy versus a shoe insert. Reweighing retrains the gait — slower, modest, addresses the pattern. Threshold optimization is the orthotic — immediate, targeted, and it only works while worn (and everyone can see you're wearing it). A clinic that promised either would "fully cure" you is selling something; measured improvement with stated side effects is medicine.</p></div>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>Your before/after table with CIs is the exhibit behind the less-discriminatory-alternative analysis (Day 21, BTM Day 35): here is an alternative, here is its disparity reduction, here is its accuracy cost, choose and sign. When Phase 5's assessment recommends mitigation, this lab is the demonstration that your recommendations come with evidence attached — the difference between advising and hand-waving.</p></div>

<h2>Today's takeaway</h2>
<p>Reweighing: derivable, defensible, moderate. Threshold optimization: precise on its target, needs group at decision time, moves other metrics. Evidence standard: the three-model table with bootstrap CIs and every trade priced. Tomorrow: fairness at the intersections, where single-axis analysis goes blind.</p>
`,
quiz:{q:"Your table shows ThresholdOptimizer closed the equalized-odds gap to ~0 but widened the selection-rate gap, and prediction now requires the sensitive feature. How do you report this?",options:["As the priced trade it is: target met, parity worsened, cost quantified, group-at-decision flagged","As an unqualified success, since the fairness definition selected in the analysis plan reached its target value","As a failed mitigation, because a valid intervention should improve every fairness metric it is evaluated on","As a clean result, omitting the selection-rate movement so the recommendation reads without contradiction"],answer:0,explain:"Mitigation optimizes one definition; others move — that's the impossibility theorem operating, not a bug. Professional reporting states the target achieved, the definitions traded, the accuracy price, and the group-at-decision-time fact, so approvers sign the actual trade."}},

{n:28,title:"Intersectional Fairness — Where Single Axes Go Blind",read:"Lesson · 16 min read",body:`
<p>You have already computed intersectional cells — BTM Day 36 had you pass <code>sensitive_features=df[['sex','race']]</code> and read the crossed rows, and it warned you that a model can pass on each attribute alone while failing one specific intersection. That's the mechanic. Today is the part that makes it usable in a legal document: <em>why</em> the marginals go blind, what the crossing does to your statistics, and how to report a cell you can't measure well.</p>

<h2>The blindness, demonstrated arithmetically</h2>
<p>A hiring model selects men and women at equal rates ✓, and Black and white applicants at equal rates ✓. Both single-axis audits pass. Yet Black women can be selected at half the rate of everyone else — their deficit arithmetically hidden because each marginal is a <em>weighted average over the cells it contains</em>, so a deficit in one cell is offset by surpluses in the others sharing each axis. This isn't hypothetical: the well-known "gender shades" audits of face analysis found error rates for darker-skinned women far exceeding what either the gender gap or the skin-tone gap alone predicted. Marginals can both pass while a cell fails badly.</p>
<pre><code><span class="cm"># the crossing you ran in BTM Day 36 — now with the numbers that matter</span>
mf = MetricFrame(metrics=selection_rate, y_true=y, y_pred=preds,
                 sensitive_features=df[[<span class="st">"sex"</span>, <span class="st">"race"</span>]])
cells = mf.by_group
<span class="kw">print</span>(cells)                                  <span class="cm"># every sex × race cell</span>
<span class="kw">print</span>(cells.min() / cells.max())              <span class="cm"># worst-cell impact ratio</span>
<span class="kw">print</span>(df.groupby([<span class="st">"sex"</span>,<span class="st">"race"</span>]).size())      <span class="cm"># ALWAYS print cell sizes alongside</span></code></pre>
<p>That last line is the one BTM didn't ask for, and it's the one that keeps you honest.</p>

<h2>The statistical price of cells</h2>
<p>Crossing two attributes multiplies groups into cells, and <strong>cell sizes collapse</strong>: a 2,000-row test set with healthy marginals can hold 40 people in a specific intersection. Everything from Days 3–5 now bites at once — wide CIs, underpowered tests, wobbling estimates. The professional posture holds both truths: intersections are where the worst harms hide, <em>and</em> intersectional estimates are the least certain numbers in your report. So: bootstrap every cell; report intervals; flag thin cells explicitly ("n=38, CI [0.31, 0.68] — insufficient data for a determination, which is itself the finding, and a data-collection recommendation").</p>

<div class="box an"><div class="bt">◆ Analogy</div><p>Auditing a building's accessibility by checking "all floors reachable ✓" and "all rooms have doorways ✓" — while the one elevator that reaches the accessible rooms is broken. Each checklist passes; the <em>combination</em> a real person must traverse fails. Intersectional audit walks the actual paths people take, not the marginal checklists — and accepts that the rarest paths are the hardest to measure.</p></div>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>This is now regulation, not aspiration: NYC Local Law 144 <em>requires</em> impact ratios for intersectional sex × race/ethnicity categories, with rules for thin cells (categories under 2% of data may be excluded — with disclosure). Your Phase 5 assessment computes exactly these cells, intervals attached; today's lab motion <em>is</em> the legally mandated analysis. Few candidates can perform it; fewer can perform it with honest uncertainty. You'll do both.</p></div>

<h2>Today's takeaway</h2>
<p>Marginal fairness can coexist with cell-level failure; compute the full crossing (one MetricFrame line), bootstrap every cell, and report thin cells as findings rather than silently dropping them. Tomorrow: from groups to individuals — counterfactual and individual fairness.</p>
`,
quiz:{q:"Both single-axis audits pass (equal rates by sex; equal rates by race), but the sex × race crossing shows one cell selected at half the top cell's rate. How is this arithmetically possible?",options:["It is not possible — if both marginal audits pass correctly, one of the two must contain a computational error","Intersectional tables double-count individuals who belong to both categories, inflating the apparent deficit","Marginals average over cells, so one intersection's deficit is offset by surpluses in the others","The failing cell is necessarily too small to support a rate estimate, so the discrepancy is a sampling artifact"],answer:2,explain:"Each marginal is a weighted average across the cells it contains, so compensating surpluses can mask a localized deficit entirely. This is why LL144 mandates intersectional categories — and why cell-level analysis with honest CIs is the professional standard."}},

{n:29,title:"Individual & Counterfactual Fairness",read:"Lesson · 15 min read · ~45 min lab",body:`
<p>BTM Day 36 closed by naming two frameworks and telling you honestly that you wouldn't code them: <strong>individual fairness</strong> (Dwork et al., 2012) and <strong>counterfactual fairness</strong> (Kusner et al., 2017). Both are group fairness's complement — they ask about <em>a person</em>, not an average. Today you learn how far you can actually operationalize each with an auditor's toolkit, and — just as important — where the honest stopping point is.</p>

<h2>Individual fairness: similarity in, similarity out</h2>
<p>The principle (Dwork's formulation): individuals similar on <em>legitimate</em> features should receive similar predictions. Its practical test is one you already own — Day 20's perturbation analysis, reframed: find pairs of near-identical applicants with divergent outcomes. Every such pair is a concrete, human-legible exhibit ("applicants #841 and #1077 differ by $300 of income; one approved, one denied"). The deep catch, and the reason BTM said it rarely ships: <em>who defines similar?</em> The similarity metric decides which features may matter, which is the fairness question restated, not escaped — so state the metric and its rationale in writing, and treat it as a governance artifact rather than a modeling detail.</p>

<h2>Counterfactual fairness: flip only the attribute</h2>
<p>Kusner's framing: a decision is fair if it would be unchanged in a world where only the protected attribute differed, holding fixed everything not causally downstream of it. You've run the empirical shadow of this twice — BTM Day 56's name swaps and TTM Day 18's minimal pairs — for text, where flipping is easy. For tabular models, naive flipping (edit the <code>sex</code> column, re-predict) tests only <em>direct</em> use; it's necessary but weak, because proxies carry the signal even when the flipped column changes nothing (BTM Day 8). The rigorous version requires a causal model of which features the attribute influences — usually beyond an audit's reach, and saying so precisely is the professional move: <em>"naive counterfactual tests passed; proxy pathways remain untested by this method and were assessed via Days 14–15 instead."</em></p>

<div class="box wa"><div class="bt">■ The terminology trap BTM warned you about</div><p>Two different things share the word. <strong>Counterfactual fairness</strong> is the formal causal-model framework above, applied to classifiers. <strong>Counterfactual testing</strong> — swapping a name or pronoun in an identical prompt and checking whether the output moves — is an empirical probing technique for generated text (BTM Day 55, TTM Days 18–19). They rhyme, and using them interchangeably in front of someone who knows the difference is a credibility leak. In writing, name which one you mean: "minimal-pair counterfactual probing" versus "counterfactual fairness in the Kusner sense."</p></div>

<div class="box an"><div class="bt">◆ Analogy</div><p>Group fairness inspects the restaurant's aggregate service statistics by table section. Individual fairness watches two diners who ordered the same dish and checks the plates match. Counterfactual fairness asks: same diner, same order, different-sounding surname on the reservation — same table? Same wait? All three lenses; none substitutes for the others. Aggregate stats can balance while specific diners are being served indefensibly.</p></div>

<div class="box wa"><div class="bt">■ Where these lenses earn their keep</div><p>Individual-level findings do two jobs group metrics can't. They <strong>persuade</strong>: an executive who glazes over at FPR gaps snaps awake at a matched pair with opposite outcomes. And they <strong>ground appeals</strong>: "individuals may contest decisions" (a standard oversight control) is operationalized by exactly this machinery — retrieve the decision, its explanation (Day 14), and its nearest matched pairs. If the pairs look arbitrary, the appeal has substance.</p></div>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>Your Phase 5 assessment gets a section most bias audits lack: <em>individual-level testing</em> — matched-pair analysis, naive counterfactual flips with their limitation stated, and consistency of explanation profiles across matched pairs (Day 14's cross-group waterfall comparison). Group tables satisfy the regulation; individual exhibits carry the room.</p></div>

<h2>Building the matched pairs — the lab</h2>
<p>Individual-level findings only persuade if the pair is genuinely comparable, so the construction matters more than the code. Match on the <em>legitimate</em> features, verify the match is tight, then look at the outcome:</p>
<pre><code><span class="kw">import</span> numpy <span class="kw">as</span> np, pandas <span class="kw">as</span> pd
<span class="kw">from</span> sklearn.preprocessing <span class="kw">import</span> StandardScaler
<span class="kw">from</span> sklearn.neighbors <span class="kw">import</span> NearestNeighbors

LEGIT = [<span class="st">"income"</span>, <span class="st">"years_experience"</span>, <span class="st">"education_num"</span>]   <span class="cm"># your defended similarity metric</span>

<span class="kw">def</span> <span class="fn">matched_pairs</span>(df, group_col, a, b, preds, k=1, max_dist=0.25):
    Z = pd.DataFrame(StandardScaler().fit_transform(df[LEGIT]), index=df.index)
    A, B = df[df[group_col] == a].index, df[df[group_col] == b].index
    nn = NearestNeighbors(n_neighbors=k).fit(Z.loc[B])
    dist, idx = nn.kneighbors(Z.loc[A])
    rows = []
    <span class="kw">for</span> i, ai <span class="kw">in</span> enumerate(A):
        bi, d = B[idx[i][0]], dist[i][0]
        <span class="kw">if</span> d &gt; max_dist:                      <span class="cm"># reject loose matches — a bad pair is worse than none</span>
            <span class="kw">continue</span>
        <span class="kw">if</span> preds[ai] != preds[bi]:            <span class="cm"># same profile, different decision</span>
            rows.append({<span class="st">"a"</span>: ai, <span class="st">"b"</span>: bi, <span class="st">"distance"</span>: round(d, 3),
                         <span class="st">"pred_a"</span>: preds[ai], <span class="st">"pred_b"</span>: preds[bi]})
    <span class="kw">return</span> pd.DataFrame(rows).sort_values(<span class="st">"distance"</span>)

pairs = matched_pairs(test_df, <span class="st">"sex"</span>, <span class="st">"Female"</span>, <span class="st">"Male"</span>, preds)
<span class="kw">print</span>(len(pairs), <span class="st">"discordant pairs within tolerance"</span>)
<span class="kw">print</span>(pairs.head(5))          <span class="cm"># the tightest matches are the strongest exhibits</span></code></pre>
<p>Three disciplines make this evidence rather than anecdote. <strong>Reject loose matches</strong> — the <code>max_dist</code> cut is doing real work, because a pair a reader can pick apart ("but she has four fewer years of experience") damages you more than presenting nothing. <strong>Report the rate, not only the examples</strong> — "142 of 1,908 within-tolerance pairs received discordant decisions, 78% of them favouring the male member" is a finding; three cherry-picked pairs are a story. And <strong>state the similarity metric</strong> in the writeup with its justification, because choosing which features count as legitimate <em>is</em> the fairness judgement, not a preprocessing detail.</p>

<div class="box wa"><div class="bt">■ Reading the direction</div><p>Discordant pairs alone prove only that the model is not a deterministic function of your three chosen features — which it never is. What matters is <em>asymmetry</em>: if discordance were arbitrary noise you would expect roughly half the pairs to favour each group. A strong lean in one direction, tested against 50% with a binomial test, is the finding. Compute it, put an interval on it, and you have converted a persuasive anecdote into a defensible statistic without losing the anecdote's power in the room.</p></div>

<h2>Today's takeaway</h2>
<p>Individual fairness: similar in, similar out — but the similarity metric must be defended. Counterfactual: flip the attribute; naive flips miss proxies, and stating that limit is rigor, not weakness. Matched pairs persuade and power appeals — built on a defended similarity metric, filtered for tightness, and reported as a discordance <em>rate</em> with its directional asymmetry tested, not as three hand-picked stories. Tomorrow: the full statistical treatment of fairness gaps — significance done right at scale.</p>
`,
quiz:{q:"A tabular model passes the naive counterfactual test (flipping the 'sex' column changes no decisions). What has actually been established?",options:["That the model satisfies counterfactual fairness in the full causal sense that Kusner's framework specifies","That the group fairness metrics will also pass, since direct non-use of the attribute implies equal treatment","Only that the attribute is not used directly — proxy pathways are untested and belong in the limitations","That the similarity metric underlying the individual-fairness comparison has been appropriately specified"],answer:2,explain:"Editing one column tests direct reliance only; the signal travels through proxies untouched by the flip (BTM Day 8). Rigorous counterfactual fairness needs the causal downstream — usually infeasible — so the honest report pairs the naive result with its stated limits and complementary proxy analysis."}},

{n:30,title:"Fairness Gaps at Scale — Significance Done Right",read:"Lesson · 15 min read",body:`
<p>Phase 1 gave you tests and their abuses; Phase 3 has multiplied your metrics and your groups. Put them together and a trap opens: <strong>an audit that computes dozens of gaps will find "significant" ones by luck alone.</strong> Today: multiple-testing discipline — the difference between an audit and a fishing expedition, in either direction.</p>

<h2>The arithmetic of false discovery</h2>
<p>At α = 0.05, each test has a 1-in-20 false-positive rate <em>by design</em>. Your Phase 5 battery might run: 4 metrics × 6 groups + 10 intersectional cells ≈ <strong>34 comparisons</strong>. Expected false "findings" if the model were perfectly fair: 34 × 0.05 ≈ 1.7. So an audit reporting "two significant disparities" out of 34 uncorrected tests has reported… approximately the noise floor. And the mirror abuse is worse: a motivated party can run comparisons until something clears 0.05 — in whichever direction they wanted.</p>

<h2>The corrections</h2>
<ul>
<li><strong>Bonferroni:</strong> divide α by the number of tests (0.05/34 ≈ 0.0015). Brutally simple, very conservative — with thin cells it can render everything "not significant," which is its own distortion.</li>
<li><strong>Benjamini–Hochberg (FDR):</strong> the modern default. Rank the p-values; find the largest p below (rank/total) × α; that p and everything smaller survives. Controls the <em>false discovery rate</em> — "of the findings I report, what share are expected to be flukes?" — a far better fit for audit work than Bonferroni's all-or-nothing.</li>
</ul>
<pre><code><span class="kw">from</span> statsmodels.stats.multitest <span class="kw">import</span> multipletests
reject, p_adj, *_ = multipletests(p_values, alpha=0.05, method=<span class="st">"fdr_bh"</span>)
<span class="cm"># report p_adj (adjusted p-values) alongside effect sizes and CIs</span></code></pre>

<div class="box an"><div class="bt">◆ Analogy</div><p>Buy one lottery ticket, winning means something. Buy 34 and celebrate the near-certain small win as destiny, and you've fooled yourself with volume. Every statistical test is a ticket; corrections re-price the celebration for how many you bought. The audit that discloses its ticket count — and adjusts — is the one that survives an opposing expert.</p></div>

<div class="box wa"><div class="bt">■ The pre-specification shield</div><p>The strongest protection isn't mathematical — it's procedural: <strong>write the analysis plan before touching results.</strong> Which metrics, which groups, which cells, which correction, what thresholds — committed in the assessment's scope section in advance. Pre-specification is what makes your positive findings credible (not fished-for) <em>and</em> your null findings meaningful (not selectively framed). It converts "trust me" into "check me." Every Phase 4–6 assessment you write will open with one.</p></div>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>This is also your shield when reviewing <em>others'</em> fairness claims — in both directions. A vendor's "no significant disparities across 40 tests" without correction and power analysis is unfalsifiable mush; an activist report's single dramatic p = 0.04 from an exploratory sweep of dozens is equally soft. The reviewer who asks "how many comparisons, pre-specified where, corrected how?" is applying the same standard symmetrically — which is what independence actually means.</p></div>

<h2>Today's takeaway</h2>
<p>Many comparisons manufacture false findings at a knowable rate; BH/FDR is the audit-appropriate correction; pre-specification of the full analysis plan is the procedural shield that makes findings — and non-findings — credible. Tomorrow: wiring all of Phase 3 into a live fairness-and-drift monitor.</p>
`,
quiz:{q:"An audit runs 34 uncorrected significance tests and reports 'two statistically significant disparities.' What's the correct assessment of that claim?",options:["Two positive findings out of that many tests is strong converging evidence of systematic disparate treatment","The battery should be rerun at a more permissive alpha so genuine subgroup disparities are not suppressed","Significance testing has no valid role in bias auditing, so the entire set of comparisons should be discarded","About 1.7 false positives are expected from 34 tests under fairness — two uncorrected hits is the noise floor"],answer:3,explain:"Uncorrected multiplicity makes 'some hits' the expected outcome even for a fair model. BH adjustment, effect sizes with CIs, and a pre-registered analysis plan are what separate findings from fishing — a standard you apply to your own audits and everyone else's alike."}},

{n:31,title:"Building the Monitor — Fairness & Drift, Live",read:"Lab · 12 min read · ~2 hr lab",body:`
<p>Assessments are snapshots; production is a movie. Today you wire Phase 1's math and Phase 3's metrics into the artifact that watches the movie: a <strong>monitoring harness</strong> that recomputes drift and fairness on schedule, compares against thresholds, and knows who to wake up.</p>

<h2>The monitor, structurally</h2>
<pre><code><span class="kw">class</span> <span class="fn">FairnessMonitor</span>:
    <span class="st">"""Scheduled drift + fairness checks against a frozen baseline."""</span>
    <span class="kw">def</span> <span class="fn">__init__</span>(self, baseline_X, baseline_metrics, thresholds):
        self.base_X = baseline_X            <span class="cm"># training-era distributions</span>
        self.base_m = baseline_metrics      <span class="cm"># launch-time fairness table</span>
        self.t = thresholds                 <span class="cm"># the tripwires, owned in writing</span>

    <span class="kw">def</span> <span class="fn">run</span>(self, X_new, y_new, preds, groups):
        report = {}
        report[<span class="st">"psi"</span>] = {c: psi(self.base_X[c], X_new[c]) <span class="kw">for</span> c <span class="kw">in</span> X_new}
        report[<span class="st">"psi_by_group"</span>] = ...        <span class="cm"># Day 7's differentiator</span>
        mf = MetricFrame(metrics={...}, y_true=y_new, y_pred=preds,
                         sensitive_features=groups)
        report[<span class="st">"fairness_deltas"</span>] = mf.difference() - self.base_m[<span class="st">"difference"</span>]
        report[<span class="st">"alerts"</span>] = self.check(report)   <span class="cm"># threshold breaches -> named severity</span>
        <span class="kw">return</span> report</code></pre>
<p>Three design decisions carry all the governance weight. <strong>The baseline is frozen</strong> — you compare against launch-time reality, not last month's (or drift becomes the new normal one imperceptible step at a time, the boiled-frog failure). <strong>Thresholds are pre-committed and owned</strong> — PSI 0.10/0.25, fairness-delta tolerances, minimum-n rules for thin months — set before deployment by a named approver, not improvised when an alert is inconvenient. <strong>Every alert maps to a response</strong> — investigate / restrict / retrain-and-revalidate / suspend — with an owner and a clock.</p>

<div class="box wa"><div class="bt">■ The label-lag problem, honestly</div><p>One hard reality most monitoring tutorials skip: fairness metrics need <em>outcomes</em> (y_new), and outcomes arrive late — loan defaults take months to materialize. So mature monitoring runs two loops: a fast loop on what's immediately observable (input drift, score distributions, selection rates per group — no labels needed) and a slow loop that backfills error-rate fairness as truth arrives. Your monitoring spec must say which metrics live in which loop, or it's promising real-time knowledge it cannot have.</p></div>

<div class="box an"><div class="bt">◆ Analogy</div><p>A dam isn't declared safe at its ribbon-cutting; it's instrumented — strain gauges at pre-marked tolerances, an engineer on call, and a written protocol for which readings close the spillway versus evacuate the valley. Your monitor is the instrumentation; the thresholds-with-owners are the protocol. A model with neither isn't governed — it's unattended.</p></div>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>This artifact <em>is</em> the "post-market monitoring" that the EU AI Act mandates, the MANAGE function's continuous half in NIST terms, and ISO 42001's operation clauses made executable. In Phase 4, your risk assessment's monitoring section will essentially be this class's configuration written as prose: metrics, loops, thresholds, owners, responses, cadence. You're building the reference implementation of your own future recommendation.</p></div>

<div class="box wa"><div class="bt">■ PSI has a sibling, and banking uses both</div><p>PSI is the industry-standard drift gauge in model risk — if you say &ldquo;population stability index&rdquo; in a validation interview you are speaking the local language. Its companion is <strong>CSI</strong>, the characteristic stability index: identical arithmetic applied to a <em>single feature's</em> distribution rather than the score distribution. The division of labour is useful. PSI on the score tells you <em>that</em> the population moved; CSI per feature tells you <em>which input</em> moved and therefore where to look. Compute both in the same pass — the function is already written — and report CSI for the top-contributing features from your Day 14 SHAP ranking. A monitoring section that reports score PSI alone can only ever raise an alarm; one that reports feature CSI alongside it hands the model owner a starting point.</p></div>

<h2>Today's takeaway</h2>
<p>Frozen baselines beat creeping normals; pre-committed, owned thresholds beat improvised ones; every alert needs a mapped response; and the fast/slow loop split is the honest answer to label lag. Tomorrow: Phase 3's capstone — mitigate a biased model and prove every claim.</p>
`,
quiz:{q:"Why must the monitor compare against a FROZEN launch-time baseline rather than a rolling 'last quarter' baseline?",options:["Rolling baselines re-normalize each increment of drift, so a model can decay to failure without ever alerting","A frozen reference array is typically held in memory once, whereas a rolling window may be recomputed each cycle","Rolling comparisons violate the distributional assumptions that the PSI statistic depends on to be valid","Regulators explicitly prohibit rolling comparison windows in any post-market monitoring documentation"],answer:0,explain:"Compare-to-recent absorbs slow drift into 'normal': each month deviates little from the last while cumulative deviation from launch grows unbounded. The frozen baseline preserves the original approved state as the reference — the boiled-frog defense."}},

{n:32,title:"Phase 3 Capstone — Mitigate and Prove It (Deliverable #3)",read:"Capstone Lab · 15 min read · ~4 hr lab · Portfolio deliverable",body:`
<p>Phase 3 ends the way real remediation work ends: not with "we applied a fairness technique," but with a <strong>defended demonstration</strong> — baseline measured, intervention applied, improvement proven with uncertainty, side effects priced, monitoring armed.</p>

<div class="box tmpl"><div class="bt">▤ How this differs from your BTM Day 36 audit</div><p>You've written a bias audit before, and it was a real one. Put the two side by side, because the delta <em>is</em> Phase 3: BTM measured with point estimates — this one carries bootstrap intervals on every gap. BTM ran one mitigation — this one runs two from different taxonomy points and prices both. BTM reported the crossed cells — this one reports their sample sizes and flags the ones too thin to conclude from. BTM chose a fairness definition — this one pre-specifies that choice in writing <em>before</em> results, with a defense. And BTM ended at the write-up — this one ends with a configured monitor, because a fairness result with no watchdog expires quietly. Same skeleton, professional load-bearing.</p></div>

<div class="box hl"><div class="bt">▲ Phase 3 in one breath</div><p>Fairlearn computes but never qualifies — your module supplies the interval, the multiplicity correction, and the minimum cell size (25); mitigations act pre (reweighing), in (constraints), or post (thresholds — the one you already ran in BTM Day 36), each targeting one definition and trading others (26–27); intersectional cells hide the worst harms behind passing marginals and demand honest thin-cell handling (28); individual fairness (Dwork) and counterfactual fairness (Kusner) catch what group tables miss and power appeals, provided you keep them distinct from LLM counterfactual probing (29); multiple-testing correction plus pre-specification separate audits from fishing (30); and monitors with frozen baselines, owned thresholds, and fast/slow loops keep fairness true after launch (31).</p></div>

<h2>The capstone protocol</h2>
<ol>
<li><strong>Pre-specify.</strong> Before computing anything: a half-page analysis plan — metrics, groups, intersections, correction method (BH), thresholds, and the primary fairness definition you'll target, with a sentence defending that choice for this use case.</li>
<li><strong>Baseline.</strong> Your Day 24 champion through the full battery: MetricFrame gaps + intersectional cells + bootstrap CIs + BH-adjusted significance + matched-pair exhibits. This is the "before."</li>
<li><strong>Intervene twice.</strong> Reweighing and ThresholdOptimizer, per Day 27.</li>
<li><strong>Prove.</strong> The three-model comparison table, every delta with a CI, side effects included (the definitions you did NOT target, accuracy, calibration by group). State plainly which trade you recommend and why.</li>
<li><strong>Arm the monitor.</strong> Configure your Day 31 FairnessMonitor for the recommended model: thresholds, loops, responses, owners. Include its config as an appendix.</li>
</ol>

<div class="box wa"><div class="bt">■ The credibility test</div><p>Read your own writeup as a hostile expert would: Is every claim intervaled? Is the ticket count disclosed and corrected? Are thin cells flagged rather than dropped? Are the <em>worsened</em> metrics reported as prominently as the improved ones? The willingness to headline your intervention's costs is precisely what makes the improvements believable — and it is the single strongest stylistic difference between advocacy and assessment.</p></div>

<h2>File Deliverable #3</h2>
<p>Commit to <code>taming-the-machine/d32-mitigation-lab/</code>: the analysis plan (written first — the Git timestamp proves it), the notebook, the comparison table, the monitor config, and <code>WHAT-I-LEARNED.md</code>. Reflection prompt: <em>which fairness definition did you decline to target, and who bears that choice?</em></p>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>You now possess the complete technical arc — measure, mitigate, prove, monitor — that Phases 4–6 will wrap in professional documents. Notice what you've become able to do that most "AI governance" candidates cannot: not just cite the impossibility theorem but <em>navigate</em> it with priced trades; not just recommend monitoring but hand over a working monitor. The remaining skill is the wrapper — and the wrapper is what organizations buy. Phase 4 begins the assessments.</p></div>
`,
vocab:[
{term:"MetricFrame",def:"Fairlearn's per-group/per-cell metric engine; evidence generator, not judge."},
{term:"Reweighing",def:"Pre-processing weights making group ⟂ outcome in the training signal; derivable and defensible."},
{term:"Constrained optimization / adversarial debiasing",def:"In-processing: fairness inside the loss; powerful, opaque, permanent."},
{term:"ThresholdOptimizer",def:"Post-processing per-group thresholds; precise, requires group at decision time."},
{term:"Intersectional cell",def:"A crossed subgroup (e.g., sex × race); where marginal audits go blind and CIs go wide."},
{term:"Individual fairness",def:"Similar people, similar predictions — under a defended similarity metric."},
{term:"Counterfactual test (naive)",def:"Flip the attribute, re-predict; tests direct use only, proxies escape."},
{term:"Bonferroni / Benjamini–Hochberg",def:"Multiple-testing corrections; BH controls false-discovery rate — the audit default."},
{term:"Pre-specification",def:"Committing the analysis plan before results; the shield that makes findings and nulls credible."},
{term:"Frozen baseline",def:"Launch-time reference for monitoring; defeats drift-by-renormalization."},
{term:"Fast/slow monitoring loops",def:"Label-free metrics now; outcome-based fairness backfilled as truth arrives."}
],
quiz:{q:"Why does the capstone require committing the analysis plan to Git BEFORE running the baseline battery?",options:["Version control requires a written plan to be committed before any analysis notebook can be tracked","It reserves the deliverable folder name so later commits attach to the correct portfolio directory","Plans render more cleanly than notebooks on GitHub, so reviewers encounter the readable file first","The timestamp evidences pre-specification: comparisons were fixed before results, so findings are not fished"],answer:3,explain:"Pre-specification is procedural integrity: it converts 'trust my analysis' into 'verify my analysis followed its commitments.' The committed-first plan is the same discipline clinical trials use — and it's Day 30's shield, made tangible in your portfolio."}},
{n:33,title:"Anatomy of a Model Risk Assessment",read:"Lesson · 16 min read · Phase 4 begins",body:`
<p>Everything until now made you a strong technical evaluator. The next nine days make you an <strong>assessor</strong> — someone who can take a model, interrogate it against a framework, and produce the document an organization actually governs with. We build a complete <strong>AI Model Risk Assessment</strong>, section by section, on your own Phase 2 model, aligned to the NIST AI RMF with ISO/IEC 23894 and the banking model-risk tradition — SR 11-7, since April 2026 SR 26-2 — informing the structure.</p>

<h2>Where this assessment sits in supervisory model risk</h2>
<p>One detour before we build, because it decides how you describe this artifact to a bank. In US financial services, &ldquo;model risk assessment&rdquo; is a <strong>term of art</strong>, and the discipline behind it is older and narrower than AI governance. Know its shape and you can speak to both audiences; miss it and you will use the right words for the wrong document.</p>
<p>From 2011 to 2026 the anchor was <strong>SR 11-7</strong> (with OCC Bulletin 2011-12 and FDIC FIL-22-2017). On <strong>17 April 2026</strong> the Federal Reserve, OCC and FDIC replaced them — along with SR 21-8 on BSA/AML model risk — with the <strong>Revised Guidance on Model Risk Management</strong>: SR 26-2 / OCC Bulletin 2026-13 / FDIC FIL-15-2026. Six things changed that you should be able to state:</p>
<ul>
<li><strong>Principles, not a rulebook.</strong> SR 11-7 was enforced as de facto binding — deviations drove Matters Requiring Attention, and a 2019 GAO ruling classified it as a rule under the Congressional Review Act. SR 26-2 is explicitly non-binding. Examiners now ask whether a firm's risk discipline is defensible on its own terms rather than whether it matches a paragraph.</li>
<li><strong>Materiality tiering is the organising principle</strong> — controls proportional to tier, and <em>the tiering itself must be auditable</em>. This is Day 34's lesson, promoted to the centre of the framework.</li>
<li><strong>An applicability threshold.</strong> Most relevant to banking organisations above <strong>$30 billion</strong> in total assets; smaller institutions only where model use is significant. OCC Bulletin 2025-26 had already clarified that annual validation is not a community-bank requirement.</li>
<li><strong>A narrower model definition.</strong> It adds the word &ldquo;complex&rdquo; and <em>excludes</em> simple arithmetic such as spreadsheet calculations, plus deterministic rule-based processes and software. SR 11-7's expansive definition had pulled end-user computing into scope at many banks.</li>
<li><strong>Expanded vendor and third-party treatment.</strong> &ldquo;We bought it&rdquo; was never a defence and is now addressed at length.</li>
<li><strong>Independence framed as rigour.</strong> SR 11-7 was read as requiring separate reporting lines; SR 26-2 says the quality of validation depends on the rigour of the process.</li>
</ul>
<p><strong>The three pillars carry forward unchanged</strong>, and they are the vocabulary you will be tested on: <strong>robust development and use</strong> · <strong>validation and monitoring</strong> · <strong>governance, policies and controls</strong>. Inside validation sit three more: <strong>conceptual soundness</strong> (tomorrow), <strong>ongoing monitoring</strong> (your Day 31 monitor), and <strong>outcomes analysis</strong> (your Day 23 backtest). You have already built two of the three.</p>

<div class="box hl"><div class="bt">▲ The carve-out that is your opening</div><p>Here is the fact worth carrying into any 2026 interview in financial services. <strong>SR 26-2 explicitly does not cover generative or agentic AI</strong> — Governor Bowman confirmed this on 1 May 2026, and the agencies have signalled a separate interagency request for information. Banks are deploying those systems regardless. Only about a quarter of financial institutions report confidence in their AI compliance readiness, and a majority name unclear guidance as their biggest barrier.</p><p>So there is a governance vacuum with budget attached, and the frameworks that fill it are the ones this phase and Phase 6 are built on: <strong>NIST AI RMF and ISO/IEC 42001</strong>. Your positioning is not &ldquo;I know model risk management.&rdquo; It is: <em>supervisory model-risk guidance governs traditional models and basic AI applications and stops at the generative and agentic boundary; here is a portfolio of assessments built on the frameworks that cover what it leaves out, from someone who can also read a validation report.</em> Being able to draw that boundary is worth more than reciting the pillars.</p></div>

<div class="box tmpl"><div class="bt">▤ Two names, two documents, one evidence base</div><p>Your Phase 4 deliverable is a NIST-structured assessment. A bank's second line produces a <strong>model validation report</strong>. Same evidence, different argument order — so build once and emit either. When precision matters, say &ldquo;AI model risk assessment, NIST AI RMF-structured,&rdquo; not just &ldquo;model risk assessment.&rdquo;</p>
<table class="vocab">
<tr><th>Your assessment section</th><th>Validation report section</th></tr>
<tr><td>§1 Executive summary (risk tier, findings, recommendation)</td><td>Executive summary + <strong>validation opinion</strong>: fit for use / fit with limitations / not fit</td></tr>
<tr><td>§2 System description &amp; scope</td><td>Model description, purpose, and <strong>use test</strong> — is it used as intended?</td></tr>
<tr><td>§3 Methodology</td><td><strong>Conceptual soundness</strong> — theory, methodology fit, variable rationale, assumptions</td></tr>
<tr><td>§4 Risk identification (MAP)</td><td>Model limitations and risk profile</td></tr>
<tr><td>§5 Measurement results (MEASURE)</td><td><strong>Outcomes analysis</strong> — backtesting (23), benchmarking (21), sensitivity analysis (20)</td></tr>
<tr><td>§6 Controls assessment (GOVERN)</td><td>Governance, <strong>effective challenge</strong>, data quality, implementation verification</td></tr>
<tr><td>§7 Risk treatment (MANAGE)</td><td>Findings with severity ratings, remediation owners and dates, compensating controls</td></tr>
<tr><td>§8 Appendices</td><td>Evidence, replication results, monitoring plan</td></tr>
</table>
<p>Two rows have no home in your current evidence base — conceptual soundness and implementation verification. Days 34 and 24 close them.</p></div>

<h2>What a model risk assessment is — and isn't</h2>
<p>It is <em>not</em> a metrics dump, a compliance checkbox, or a vibes-based memo. It is a structured argument answering five questions: <strong>What is this system and what decisions does it touch? What could go wrong, for whom, how badly? What did we measure, and what did we find? What controls exist, and where are the gaps? What must happen — by whom, by when — for the risk to be acceptable?</strong> Its authority comes from evidence (your notebooks) and its usefulness from judgment (your severity calls and recommendations).</p>

<div class="box tmpl"><div class="bt">▤ The document skeleton (from Day 0, now specialized)</div><p><strong>1. Executive summary</strong> — verdict first: risk tier, top 3 findings, recommendation. <strong>2. System description &amp; scope</strong> — the model, its decisions, its population, its data lineage; what's out of scope and why. <strong>3. Methodology</strong> — frameworks applied, tests run (pre-specified!), tools/versions, limitations. <strong>4. Risk identification (MAP)</strong> — the failure-mode catalogue with stakeholders. <strong>5. Measurement results (MEASURE)</strong> — the technical battery, per group, with CIs. <strong>6. Controls assessment (GOVERN)</strong> — what exists vs. what the risks demand. <strong>7. Risk treatment (MANAGE)</strong> — matrix placement, treatments, residual risk, owners, dates. <strong>8. Appendices</strong> — evidence tables, register, monitor config, notebook links.</p></div>

<h2>The NIST AI RMF as your spine</h2>
<p>The RMF's four functions map directly onto that skeleton — <strong>GOVERN</strong> (the cross-cutting organizational layer: policies, accountability, culture) frames sections 2 and 6; <strong>MAP</strong> (establish context, identify risks) is section 4; <strong>MEASURE</strong> (test against trustworthiness characteristics) is section 5; <strong>MANAGE</strong> (prioritize, treat, monitor) is section 7. The RMF's companion Playbook adds, for each subcategory, suggested actions and — most useful to you — <em>example evidence outputs</em>. Your assessment is, in essence, a curated evidence library organized as an argument.</p>

<div class="box an"><div class="bt">◆ Analogy</div><p>A home inspection report. The inspector doesn't just list measurements ("moisture reading: 23%") — they identify what the house is and how it's used (MAP), take readings where risks live (MEASURE), evaluate whether existing protections are adequate (GOVERN: "the sump pump is undersized for this water table"), and issue prioritized, owned recommendations ("replace within 90 days; until then, do not finish the basement" — MANAGE). Nobody buys a house on the raw readings. They buy on the <em>argued judgment</em>. That's your product now.</p></div>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>Why this order — risk assessment first, bias assessment second, RAI assessment third? Because the risk assessment is the <em>container</em>: bias is one risk family within it (Phase 5 deep-dives it to legal standard), and responsible-AI impact analysis extends it to societal scope (Phase 6). Master the container and the other two become specializations, not new worlds. Interviewers probe exactly this architecture: "how do these assessments relate?" You now have the answer.</p></div>

<h2>Today's takeaway</h2>
<p>An assessment is a structured, evidence-backed argument across five questions, with NIST's GOVERN/MAP/MEASURE/MANAGE as the spine and your notebooks as the evidence base. In banking the same evidence reorders into a validation report under SR 26-2's three pillars — and the generative/agentic carve-out is where your NIST-based work is the only thing on the table. <em>(Supervisory content current to August 2026; the interagency GenAI RFI was announced but not issued — re-check before relying on the scope boundary.)</em> Tomorrow: the deceptively hard first step — scoping, and the model inventory that decides what gets assessed at all.</p>
`,
quiz:{q:"What gives a model risk assessment its authority, beyond the framework citations?",options:["The comprehensiveness of its appendices, which demonstrate the breadth of testing the assessor performed","Reproducible evidence organized as an argument, plus judgment on severity and priority","Formal sign-off from the model's developers, confirming the technical findings are accepted as accurate","Coverage of all seventy-two NIST subcategories, which demonstrates the framework was applied completely"],answer:1,explain:"Frameworks provide the spine, but the document persuades through verifiable evidence and earns its keep through judgment: what matters most, how bad it is, what must change, who owns it. Metrics without argued judgment is a dump; judgment without evidence is vibes."}},

{n:34,title:"Scoping and the Model Inventory",read:"Build Step · 15 min read · ~1 hr build",body:`
<p>Every real assessment failure I've witnessed traces to one of two scoping sins: assessing the wrong thing, or not knowing the thing existed. Today: the <strong>model inventory</strong> (the organizational map of what exists) and the <strong>scope statement</strong> (the contract for what this assessment covers).</p>

<h2>The inventory: you can't govern what you can't list</h2>
<p>A model inventory is a living register of every model-driven decision system: name, owner, purpose, decision affected, population, data sources, model family, deployment status, last validation date, risk tier. GOVERN-function work in NIST terms — and the single highest-leverage artifact in any governance program, because <em>unlisted models get zero of everything else</em>. Day 22's lesson generalizes: things escape inventories by definitional dodges ("it's just a spreadsheet," "it's just flagging," "it's a vendor tool"). The inventory's inclusion rule must be consequence-based: <em>if its output influences a decision about a person or resource, it's in.</em></p>

<div class="box tmpl"><div class="bt">▤ Build: your scope statement (assessment §2)</div><p>Write these seven fields for your Phase 2 model — this becomes Section 2 of your Deliverable #4: <strong>System:</strong> name + one-sentence function. <strong>Decision:</strong> what it decides/influences, and whether output is advisory or determinative. <strong>Population:</strong> who is subject to it; expected volumes. <strong>Data lineage:</strong> sources, collection era, known gaps (your BTM Day 10 profiling reflex, formalized). <strong>Model:</strong> family, version, training date. <strong>In scope:</strong> the specific model version + decision context assessed. <strong>Out of scope, with reasons:</strong> e.g., "upstream data pipeline controls assessed separately; adjacent marketing model not covered." Honest exclusions stated up front are professional; discovered exclusions later look like concealment.</p></div>

<h2>The front door — use-case intake and triage</h2>
<p>The inventory is a list. <strong>Intake</strong> is how things get onto it, and if you take an AI governance job this is where most of your first year goes. A governance function without a front door discovers systems at incident time; one with a front door meets them before they ship, which is the only point at which advice is cheap.</p>
<p>Three components, deliberately lightweight — a heavy front door gets routed around:</p>
<ul>
<li><strong>The intake form.</strong> Eight or nine questions a product manager can answer in ten minutes: what decision does this touch, who is affected and how many, is the output advisory or determinative, what data does it use, is it built or bought, does it process personal or special-category data, which jurisdictions do the affected people sit in, and when does it ship.</li>
<li><strong>The triage rubric.</strong> Score the answers and route: <em>full assessment</em> for high-impact systems making or heavily influencing decisions about people, <em>focused review</em> for medium, <em>register and monitor</em> for low. Day 53's scored questionnaire is exactly this move, applied at the door rather than mid-assessment.</li>
<li><strong>The service-level commitment.</strong> Publish how long each route takes. Governance functions lose the organisation's cooperation by being slow far more often than by being strict.</li>
</ul>

<div class="box gov"><div class="bt">✦ Governance connection — one workflow, three rubrics</div><p>Look at what the three tracks in this curriculum do at intake and notice it is the same machine. A <strong>model risk analyst</strong> tiers by materiality — exposure, complexity, criticality (Day 33). A <strong>bias auditor</strong> scopes with the AEDT three-part test and asks whether any affected candidate sits in the jurisdiction (Day 43). An <strong>AI governance practitioner</strong> classifies against Annex III and establishes provider-versus-deployer role (Day 51). Different questions, identical structure: a consequence-based inclusion rule, a scored rubric, a routing decision, and a written record of the negative determinations. Build the machine once; swap the rubric.</p></div>

<div class="box wa"><div class="bt">■ Shadow AI — what the front door will never catch</div><p>Every intake process has the same blind spot: systems nobody submitted. A departmental subscription to a tool with an AI feature, a spreadsheet calling an API, a vendor that added a model to a product you already bought, a team using a chat assistant for decisions nobody wrote down. Discovery is a real workstream, not a footnote — expense and procurement records, SSO and network logs, the vendor register, periodic manager attestations. Budget for the fact that your inventory is always incomplete, and say so in your assessment's limitations section rather than implying a completeness you cannot evidence.</p></div>

<h2>Conceptual soundness — the pillar you cannot automate</h2>
<p>Before any statistic, a validator asks a question no test answers: <strong>should this model exist in this form for this decision?</strong> That is conceptual soundness, the first pillar of validation, and it is the most reliably asked topic in a model-risk interview. It is Day 36's scepticism about risk scoring, turned on the model's own design rationale.</p>
<p>Five questions, each answerable in a paragraph and each capable of producing a finding on its own:</p>
<ul>
<li><strong>Methodology fit.</strong> Is this technique appropriate to the decision, the data volume, and the required explainability? A gradient-boosted ensemble on 900 rows is a conceptual-soundness finding before you measure anything (BTM Day 20's transparency cost, now a written objection).</li>
<li><strong>Variable selection rationale.</strong> Were features chosen on statistical grounds, business grounds, or availability? &ldquo;It was in the table&rdquo; is the most common real answer and the one that produces proxy problems downstream (BTM Day 8).</li>
<li><strong>Assumptions — documented, and tested.</strong> Independence, stationarity, the representativeness of the development sample, the stability of the relationship being modelled. An assumption nobody wrote down cannot be monitored when it breaks.</li>
<li><strong>The use test.</strong> Is the model being used for the purpose it was developed for, on the population it was developed on? Models drift by <em>repurposing</em> far more often than by data drift — a collections model quietly used for origination is a severe finding with a clean test set.</li>
<li><strong>Developmental evidence.</strong> What did the model owner produce — data lineage, alternatives considered and rejected, tuning records, sign-offs? Absent development documentation is itself the finding, and a common one.</li>
</ul>
<p>Write these five for your own Phase 2 model, honestly, including where the answer is &ldquo;I chose it because the course said to.&rdquo; That paragraph is worth more in an interview than a perfect ROC curve, because it demonstrates the thing employers cannot test for on a take-home: the willingness to interrogate a choice you made yourself.</p>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>Conceptual soundness is where the two career tracks feel most different and are most similar. A bias auditor asks &ldquo;was the target variable a fair proxy for the thing you actually care about?&rdquo; — which is Day 46's label-history mechanism. A model validator asks &ldquo;was the target variable an appropriate operationalisation of the business outcome?&rdquo; Same question, different vocabulary, different document. Learn to ask it in both registers and you can sit on either side of the table.</p></div>

<h2>Risk tiering: proportionality from the start</h2>
<p>Not every model deserves the full battery — a spam filter and a lending model shouldn't cost the same to assess. Mature programs tier at intake: impact on people's rights/opportunities/safety × decision autonomy × scale. High tier → full assessment (what you're building); medium → focused review; low → registered and monitored. Write one sentence tiering your model and defending it. (Canada's AIA does exactly this with a scored questionnaire mapping to four impact levels — you'll meet it properly in Phase 6.)</p>

<div class="box an"><div class="bt">◆ Analogy</div><p>A hospital doesn't MRI every patient at the door — triage assigns intensity of scrutiny by presenting risk. But triage only works because <em>every patient is registered at intake</em>. The inventory is registration; tiering is triage; your assessment is the full workup ordered for the high-acuity case. A hospital that let patients wander in unregistered would occasionally lose one in a hallway — which is precisely what happens to organizations' models.</p></div>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>Scoping is also where assessment <em>independence</em> gets established (a preview of Phase 5, where it becomes law under LL144): who requested this assessment, who is performing it, what's their relationship to the model team, and who can overrule the findings? One paragraph in §2 stating this — even for your solo portfolio work ("self-assessment; independence limitations acknowledged") — signals you understand that <em>who assesses</em> shapes <em>what gets found</em>.</p></div>

<h2>Today's takeaway</h2>
<p>Inventory: consequence-based inclusion, or models escape governance by rebranding — note that SR 26-2's narrower <em>model</em> definition now excludes spreadsheets and deterministic rules, so a bank's model inventory and an AI-governance inventory are deliberately different lists, and you should say which one you are building. Scope statement: seven fields, honest exclusions, a tier with a defense, an independence note. Conceptual soundness: five questions asked of the model's design before any statistic runs. And the front door — a light intake form, a scored triage rubric, a published turnaround, and an honest shadow-AI discovery workstream — because an inventory without an intake process is a snapshot, not a register. Tomorrow: MAP — systematically cataloguing what can go wrong, for whom.</p>
`,
quiz:{q:"Why must a model inventory's inclusion rule be consequence-based ('influences decisions about people or resources') rather than technology-based ('uses ML')?",options:["Because machine learning lacks a settled legal definition, making technology-based rules unenforceable","Because consequence-based rules yield a shorter inventory that governance teams can realistically maintain","Because regulatory attention has centred on spreadsheet-based tools rather than on production ML systems","Because technology definitions invite escape-by-rebranding; consequence framing captures what decides"],answer:3,explain:"Day 22's dodge generalizes: systems exit tech-defined inventories through definitional argument while their impacts continue. Anchoring inclusion to decision influence closes the loophole — the register tracks consequences, not implementation details."}},

{n:35,title:"MAP — Context, Stakeholders, and Failure Modes",read:"Build Step · 17 min read · ~1 hr build",body:`
<p>NIST's MAP function establishes context and surfaces risks <em>before</em> measurement begins — because you can't measure what you haven't imagined. Today you build your assessment's Section 4: the stakeholder map and the failure-mode catalogue.</p>

<h2>Stakeholder mapping: who touches, who is touched</h2>
<p>List every party with a stake in the system's behavior, in two rings: <strong>direct</strong> — decision subjects (applicants), decision users (loan officers), operators (the ML team), the accountable owner; <strong>indirect</strong> — subjects' families, communities statistically affected, the organization's other functions (legal, brand), regulators, and future applicants whose data today's decisions will shape — the feedback loop is itself a stakeholder-generating machine. For each: what they need from the system, and what harm reaches them when it fails. Ten minutes of this discipline routinely surfaces risks no metric would have prompted — that's why MAP precedes MEASURE.</p>

<h2>The failure-mode catalogue</h2>
<p>Walk the lifecycle (BTM Day 2) and ask, at each stage, "how does this fail, and who from the stakeholder map absorbs it?" Prompt yourself with the categories your two courses have armed you for:</p>
<ul>
<li><strong>Data risks:</strong> unrepresentative sampling, label bias, proxies, leakage, drift-in-waiting (BTM P1; Day 7).</li>
<li><strong>Model risks:</strong> overfitting, miscalibration, instability/cliffs, opacity outpacing its controls (Days 11–16, 20).</li>
<li><strong>Fairness risks:</strong> the full battery's failure families — rate gaps, error-rate gaps, calibration gaps, intersectional cells, stability disparities (Phase 3).</li>
<li><strong>Operational risks:</strong> automation bias in the human loop, threshold ownership vacuum, monitoring absence, label lag blinding the slow loop (Days 16, 31).</li>
<li><strong>Security/adversarial risks:</strong> gameable features, perturbation attacks, injection for LLM components (Day 20).</li>
<li><strong>Systemic risks:</strong> feedback loops entrenching disparities; fleet-level selection drift (Day 21's gate rationale).</li>
</ul>
<p>Each entry gets one disciplined sentence: <em>failure → mechanism → affected stakeholder(s) → worst plausible consequence.</em> Aim for 12–20 entries for a system like yours. This catalogue <em>is</em> the input to tomorrow's risk matrix.</p>

<div class="box an"><div class="bt">◆ Analogy</div><p>Aviation engineers run FMEA — failure mode and effects analysis — before a single test flight: every component, every way it can fail, every downstream effect, on paper first. Test flights (MEASURE) then <em>target</em> the catalogued concerns instead of flying around hoping problems announce themselves. An assessment that starts with metrics has skipped the FMEA and is flying around hoping.</p></div>

<div class="box wa"><div class="bt">■ The imagination discipline</div><p>The catalogue's quality depends on resisting two pulls: listing only failures your tools happen to measure (the streetlight effect — you now have many streetlights, which makes this <em>more</em> tempting), and listing only failures that have already happened somewhere. Force at least three entries that are specific to <em>this</em> system's context and would embarrass a generic checklist. Those are usually the ones that matter.</p></div>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>MAP's output also decides MEASURE's budget: each catalogued risk either maps to a planned test (and appears in your pre-specified analysis plan, Day 30) or gets an explicit "not measurable with available data — treated as an assumption/limitation." That traceability — every risk either measured or acknowledged — is what reviewers scan for first, and its absence is how assessments get dismissed as theater.</p></div>

<h2>Today's takeaway</h2>
<p>Two-ring stakeholder map, then a lifecycle-walked failure catalogue (12–20 entries, one disciplined sentence each, at least three context-specific) with every entry traceable to a test or a stated limitation. Tomorrow: turning the catalogue into a prioritized risk register with a likelihood × severity matrix.</p>
`,
quiz:{q:"Why does MAP (failure-mode cataloguing) have to precede MEASURE (running tests) rather than the reverse?",options:["Because the framework's functions are applied in the alphabetical order in which NIST chose to name them","Because cataloguing failure modes consumes fewer analyst hours than running the equivalent test battery","Because measurement only confirms risks someone imagined; metrics-first produces the streetlight effect","Because risk identification is non-technical and can proceed while the evaluation environment is prepared"],answer:2,explain:"The catalogue defines what measurement must target; metrics-first assessment silently narrows 'risk' to 'what my tools output.' MAP's stakeholder-and-failure imagination step is what makes the subsequent measurement an investigation rather than a tour of dashboards."}},

{n:36,title:"The Risk Matrix and Risk Register",read:"Build Step · 16 min read · ~1 hr build",body:`
<p>Twenty catalogued failure modes can't all be first priority. Today: the classic instrument for ordering them — the <strong>likelihood × severity matrix</strong> — and the <strong>risk register</strong> that turns your catalogue into a managed, owned, living list. This is where ISO 23894's risk-management discipline enters your document.</p>

<h2>Scoring likelihood and severity — with honesty about the scoring</h2>
<p>For each failure mode, score <strong>likelihood</strong> (how probable over the assessment horizon, given current controls) and <strong>severity</strong> (worst plausible consequence for the most affected stakeholder) on simple 1–4 scales with <em>written anchors</em> — e.g., Severity 4: "irreversible harm to individuals' rights/livelihood or legal exposure"; Severity 2: "recoverable inconvenience with appeal available." Anchors are what make two assessors score alike; matrices without anchors are opinion polls in a grid costume.</p>
<p>Where can evidence replace opinion? Everywhere you have it: your PSI trends inform drift likelihood; your flip rates inform instability likelihood; base rates (BTM Day 30) inform how many people a given error rate actually touches. Scores backed by a cited number outrank scores backed by adjectives — write the citation into the register row.</p>

<div class="box tmpl"><div class="bt">▤ Build: the register (assessment §7's backbone + appendix)</div><p>One row per catalogued risk: <strong>ID · Risk (the Day 35 sentence) · Likelihood (1–4, anchor cited) · Severity (1–4, anchor cited) · Evidence link · Existing controls · Rating (L×S zone: Low/Moderate/High/Critical) · Treatment (Day 39 fills this) · Owner · Review date.</strong> Sort by rating. Your top-right cells — high likelihood, high severity — are your executive summary's "top findings" in embryo.</p></div>

<div class="box wa"><div class="bt">■ Matrix pathologies to preempt</div><p>Three failure patterns to guard against, and to name in your methodology: <strong>severity laundering</strong> — averaging harms across everyone ("affects only 2% of users") when severity should track the <em>most affected</em> stakeholder (that 2% may be one demographic's 15%, per Phase 3); <strong>likelihood optimism</strong> — scoring against intended use while ignoring foreseeable misuse (score both if they diverge); and <strong>the diagonal illusion</strong> — treating a 4×1 (frequent-but-mild) and a 1×4 (rare-but-catastrophic) as equivalent because both multiply to 4. Rare-catastrophic risks deserve asymmetric respect; say so explicitly rather than letting the arithmetic flatten them.</p></div>

<div class="box an"><div class="bt">◆ Analogy</div><p>An ER triage board. Every patient (risk) is listed, scored on urgency anchors every nurse shares, and assigned an owner and a recheck time. The board's power isn't mathematical precision — urgency scores are judgment — it's <em>shared, anchored, visible</em> judgment that determines who gets the next bed. And no ER averages a patient's condition across the waiting room to decide they're fine.</p></div>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>The register is the assessment's <em>living</em> part: the document snapshot ages, but the register — owners, treatments, review dates — is what management actually works from quarter to quarter. In NIST terms you're crossing from MAP into MANAGE; in organizational terms you're producing the artifact that turns findings into follow-through. An assessment whose register has no owners or dates has recommendations; one with them has commitments.</p></div>

<h2>Today's takeaway</h2>
<p>Anchored 1–4 scales, evidence-cited scores, one register row per risk, sorted into the matrix — while guarding against severity laundering, likelihood optimism, and the diagonal illusion. Tomorrow: MEASURE — mapping the register's top risks to the technical battery you already know how to run.</p>
`,
quiz:{q:"A risk 'affects only 2% of all users, mild average impact' gets scored Severity 1. What matrix pathology might this be, and what's the check?",options:["The diagonal illusion: the two scores should be multiplied rather than assessed as an averaged impact","Severity laundering: population averaging hides concentration, so score the most-affected stakeholder","Likelihood optimism: the severity rating is defensible, but likelihood was scored against intended use only","No pathology at all — a small affected percentage with mild average impact is definitionally low severity"],answer:1,explain:"Population-averaged severity erases concentration: 2% overall can be a specific group's substantial share bearing serious harm (Phase 3's entire lesson). Anchoring severity to the most-affected stakeholder — with the per-group evidence cited — is the guard."}},

{n:37,title:"MEASURE — From Register to Test Battery",read:"Build Step · 17 min read · ~1 hr build",body:`
<p>Now the function you're most prepared for: <strong>MEASURE</strong>. The discipline today isn't learning new tests — you own a formidable battery — it's <em>traceability</em>: every top register risk maps to specific tests, every test result flows back to a register row, and the whole plan is pre-specified before results are seen.</p>

<h2>The risk → test map</h2>
<p>Build a two-column table (it becomes your §3 methodology core). Left: register ID. Right: the tests that interrogate it, with tools and thresholds. For your model, the map largely writes itself from your last 37 days:</p>
<ul>
<li><strong>R-01 unrepresentative data</strong> → representation table vs. reference population; per-group n's (BTM Day 10).</li>
<li><strong>R-04 proxy reliance</strong> → SHAP + permutation + PDP triangulation on candidate proxies (Days 14–15).</li>
<li><strong>R-07 miscalibration</strong> → reliability curves + Brier, overall and per group (Days 8, 13).</li>
<li><strong>R-09 fairness gaps</strong> → the pre-specified Phase 3 battery: MetricFrame + intersectional cells + CIs + BH correction.</li>
<li><strong>R-12 instability</strong> → perturbation flip rates per group (Day 20).</li>
<li><strong>R-14 drift exposure</strong> → PSI per feature per group on the freshest available slice; OOT gap if time-split possible (Days 7, 23).</li>
<li><strong>R-16 uncertainty handling</strong> → abstain-band analysis; disagreement by group (Day 16).</li>
</ul>
<p>And for register risks with no feasible test — "label bias in historical decisions," often — the row says so: <em>assessed qualitatively; treated as standing assumption; flagged in limitations.</em> That row is as important as any result: it's the difference between "we didn't look" and "we looked, couldn't measure, and are telling you."</p>

<div class="box tmpl"><div class="bt">▤ Build: the findings format (assessment §5)</div><p>Report each result as a numbered finding in a fixed shape: <strong>Finding F-3 (maps to R-09):</strong> statement in the Day 6 sentence pattern ("FNR for group B is 2.1× group A's; gap 11 points, 95% CI [6, 16], BH-adj. p = 0.01") · <strong>evidence:</strong> notebook section link · <strong>severity confirmation or revision:</strong> does the measured magnitude confirm the register's severity score, or move it? · <strong>one-line implication</strong> in plain language a director understands. Findings that revise register scores are the assessment <em>working</em> — measurement correcting imagination is the point of the loop.</p></div>

<div class="box an"><div class="bt">◆ Analogy</div><p>A physician's diagnostic workup: the differential (register) determines which labs to order (test map); results come back attached to the hypotheses they test, each one confirming, revising, or retiring a concern; and "we couldn't test for X with available equipment" goes in the chart, not in the trash. Labs ordered without a differential is expensive fishing; a differential never tested is speculation. The loop is the medicine.</p></div>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>This traceability discipline is what NIST's Playbook means by evidence outputs per subcategory, and it's your armor in review: when a stakeholder disputes a finding, you walk them from register risk → pre-specified test → result → severity implication, and the argument becomes about evidence, not opinion. It's also your honest-broker credential — the limitations rows prove you report what you <em>couldn't</em> establish with the same clarity as what you could.</p></div>

<h2>Today's takeaway</h2>
<p>Two-column risk→test map, pre-specified; findings in fixed format tracing back to register rows; untestable risks documented as limitations, not omissions. Tomorrow: GOVERN — auditing the controls around the model, where the gaps are usually organizational, not mathematical.</p>
`,
quiz:{q:"A register risk ('historical label bias') has no feasible quantitative test with available data. What does the professional MEASURE section do with it?",options:["State it plainly: assessed qualitatively, held as a standing assumption, and disclosed in the limitations","Remove the row from the register, so retained risks each carry a corresponding measured result","Score it at the lowest severity available, on the basis that an unmeasurable risk cannot be evidenced","Substitute a proxy metric so the register can present a quantitative row for the entry"],answer:0,explain:"Untestable risks don't vanish; they become documented assumptions that shape how confident conclusions can be. The limitations row is integrity infrastructure — silently dropping unmeasurable risks is how assessments become theater."}},
{n:38,title:"GOVERN — Auditing the Controls, Not Just the Model",read:"Build Step · 16 min read · ~1 hr build",body:`
<p>A perfectly-measured model inside a control vacuum is still a high-risk system. Today you build Section 6: the <strong>controls assessment</strong> — comparing what the risks demand against what organizationally exists. This is NIST's GOVERN function meeting your register, and it's where most real findings live, because most AI failures are organizational before they're mathematical.</p>

<h2>The control families to audit</h2>
<p>For each high-rated register risk, ask: what control <em>should</em> exist, and what's actually there? Sweep these families:</p>
<ul>
<li><strong>Accountability:</strong> Is there a named model owner? A named threshold owner (BTM Day 14's question — you'd be startled how often the answer is silence)? Who can halt the system, and has that authority ever been exercised or tested?</li>
<li><strong>Documentation:</strong> Model card? Data datasheet (BTM Day 58)? Decision log for approvals? If it isn't written, for governance purposes it doesn't exist.</li>
