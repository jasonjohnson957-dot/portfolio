<li><strong>Human oversight:</strong> Is "human in the loop" operationally defined — routing trigger (Day 16), reviewer training, override logging — or is it a phrase? Are overrides monitored per group (automation bias makes rubber-stamping the default)?</li>
<li><strong>Change management:</strong> What re-triggers validation — retraining, threshold moves, data-source changes? Who approves? (Day 21's gates belong here.)</li>
<li><strong>Monitoring:</strong> Does anything resembling your Day 31 monitor exist — frozen baseline, owned thresholds, mapped responses? With which metrics in which loop?</li>
<li><strong>Third-party:</strong> For vendor components (your Day 17 fine-tune counts): what claims arrived with them, what verification was performed, what does the contract compel on incident notice and evidence access?</li>
<li><strong>Incident response:</strong> If tomorrow's headline is this model, who does what in the first 48 hours? Is there an appeal path for affected individuals, and does anyone read its outputs as a signal?</li>
</ul>

<h2>Effective challenge and the three lines of defence</h2>
<p>One control family deserves separate treatment, because it is the one that makes all the others real. <strong>Effective challenge</strong> is critical analysis by objective, informed parties who can identify limitations and cause something to change. It is the banking sibling of the independence argument you will meet as law in Phase 5, and it fails when any one of three conditions is missing:</p>
<ul>
<li><strong>Incentive.</strong> Are the challengers rewarded for finding problems, or measured on throughput? A validation team with a closure-rate target will close things.</li>
<li><strong>Competence.</strong> Can they actually evaluate the work? Challenge by someone who cannot read the model is theatre — and this is precisely the gap that AI/ML models have opened inside second-line functions staffed by econometricians.</li>
<li><strong>Influence.</strong> Can they stop or change the thing? A finding the business can decline without record is not challenge; it is correspondence.</li>
</ul>
<p>Structurally this lives in the <strong>three lines of defence</strong>. The <strong>first line</strong> owns the model: developers and the business that uses it. The <strong>second line</strong> is independent risk management — validation, model risk, compliance — which challenges the first. The <strong>third line</strong> is internal audit, which checks that the second line is doing its job, and whose report on <em>your</em> validation work is the reason your evidence trail has to survive a stranger reading it cold (Day 40).</p>
<p>Audit it the way you audit any control family: for each high-rated risk, who challenged it, were they competent to, were they able to change anything, and is there a record of what they raised and what happened next? &ldquo;Reviewed by the model owner&rdquo; is Absent, not Partial.</p>

<div class="box wa"><div class="bt">■ Independence has two grammars — learn both</div><p>Under LL144 (Phase 5) independence is <em>prescribed</em>: the auditor must not have developed or used the tool and must hold no financial stake. Under SR 26-2 it is <em>outcome-framed</em> — the 2026 revision states that the quality of validation depends on the rigour of the process, softening the older reading of SR 11-7 that required separate reporting lines. The underlying logic is identical and worth being able to state in one sentence: <strong>independence is an engineering control on motivated reasoning, not a statement about anyone's character.</strong> One regime writes it as a rule, the other as an expected outcome. Say that in either interview and you sound like you understand why the requirement exists rather than that you memorised it.</p></div>

<div class="box tmpl"><div class="bt">▤ Build: the control gap table (assessment §6)</div><p>One row per high-rated risk: <strong>Risk ID · Control expected (name the family + specific mechanism) · Control found (cite the evidence: document, config, interview note — or "none identified") · Gap rating (Adequate / Partial / Absent) · Consequence of gap</strong> (one line: what the absence converts from possible into likely). Partial is the honest middle you'll use most: "monitoring exists; thresholds undocumented and unowned."</p></div>

<div class="box an"><div class="bt">◆ Analogy</div><p>A bank vault review that only tested the steel would miss that three ex-employees still know the combination, nobody logs who enters, and the alarm company's number is five years stale. The steel is your model metrics; the combination hygiene, the logs, the response tree — that's GOVERN. Most vaults are breached through procedures, not walls, and most model incidents arrive through the control gaps, not the loss curve.</p></div>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>Control findings are also your most <em>actionable</em> findings — "assign a threshold owner" costs a meeting; "eliminate proxy reliance" costs a rebuild. In the recommendation economics of Day 40, cheap-and-high-leverage control fixes are what make an assessment feel immediately useful to leadership rather than purely critical. ISO 42001's Annex A is essentially a reference catalogue of these control families for AI management systems — Phase 6 will have you map to it formally; today you've derived its logic from the risks themselves.</p></div>

<h2>Today's takeaway</h2>
<p>Audit controls per high-rated risk across seven families; rate Adequate/Partial/Absent with cited evidence; state each gap's consequence. Effective challenge needs incentive, competence and influence together, and sits in the second of three lines — independence is an engineering control on motivated reasoning whichever regime you are writing under. Organizational gaps are where assessments earn their keep. Tomorrow: MANAGE — treatments, residual risk, and the sign-off that makes risk acceptance an owned act.</p>
`,
quiz:{q:"Why does the controls section demand cited evidence ('document, config, or interview note') for each control rather than accepting 'yes, we have monitoring'?",options:["Because citation practice lends the finished assessment the formal appearance auditors expect to see","Because interview evidence is inadmissible in formal assessments and must be replaced by configuration","Because evidentiary standards apply to third-party components rather than to internally built systems","Because verbal assurance is not a control: undocumented practice evaporates under turnover"],answer:3,explain:"Controls exist to operate when people are stressed, absent, or replaced — which is exactly when undocumented practice evaporates. Evidence-cited control assessment converts comfortable assurances into verifiable states, and the Partial rating captures the commonest real condition."}},

{n:39,title:"MANAGE — Treatments, Residual Risk, and Sign-Off",read:"Build Step · 16 min read · ~1 hr build",body:`
<p>Findings without disposition are gossip. Today, the MANAGE function completes your register: every risk gets a <strong>treatment</strong>, the treatment leaves a <strong>residual risk</strong>, and someone with authority <strong>signs</strong> for accepting it. This section is where the assessment stops describing the world and starts changing it.</p>

<h2>The four treatments</h2>
<p>Classical risk management gives you exactly four moves per risk — make the choice explicit for every high-rated row:</p>
<ul>
<li><strong>Mitigate:</strong> reduce likelihood or severity — a Day 26–27 intervention, a control from Day 38's gap table, a threshold change with a named owner. Most rows land here; each mitigation cites its evidence of expected effect (your Phase 3 before/after tables are the gold standard of "expected effect").</li>
<li><strong>Avoid:</strong> don't do the risky thing — narrow the deployment population, remove a feature, keep the model advisory rather than determinative. The option teams forget exists.</li>
<li><strong>Transfer:</strong> shift risk via contract or insurance — vendor indemnities, SLAs with evidence-access rights. Transfers move money, <em>not accountability</em>: reputational and human harm are largely untransferable, and your document should say so where teams pretend otherwise.</li>
<li><strong>Accept:</strong> proceed with eyes open — legitimate for low-rated risks or where mitigation costs exceed benefits, <em>if and only if</em> the acceptance is informed, documented, and signed by someone with authority over the consequences.</li>
</ul>

<h2>Residual risk: the honest remainder</h2>
<p>After treatment, re-score: R-09's fairness gap, post-reweighing, drops from High to Moderate — <em>Moderate remains</em>. The residual column prevents the commonest self-deception in risk work: treating "we did something" as "the risk is gone." Your impossibility-theorem fluency (BTM Day 34) makes you unusually credible here — you can state <em>why</em> certain fairness residuals are mathematically irreducible, which converts "we couldn't fix it" into "no one can fully fix this; here is the minimized form and who accepts it."</p>

<div class="box tmpl"><div class="bt">▤ Build: the sign-off block (assessment §7 close)</div><p>End the section with the acceptance table: <strong>Residual risk (rating) · Accepted by (name, role — must have authority over the consequence) · Date · Conditions of acceptance (monitoring thresholds from Day 31, review date, revocation triggers).</strong> The conditions row matters most: acceptance isn't forever, it's <em>until a tripwire fires or the review date arrives</em>. For your portfolio deliverable you'll sign it yourself as "assessment author (simulated authority)" — the point is demonstrating you know the block belongs there and what makes it real.</p></div>

<div class="box an"><div class="bt">◆ Analogy</div><p>Surgery consent. The surgeon doesn't say "risks were addressed"; they enumerate the residual risks after all mitigations, and the <em>patient</em> — the party bearing the consequence — signs, with the option to decline. A hospital where surgeons quietly signed consent on patients' behalf would be committing the exact sin of an ML team that "accepts" risks borne by applicants and executives who've never seen the register. Sign-off routes acceptance to authority; conditions keep it revocable.</p></div>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>The signed acceptance table is what regulators, auditors, and litigators look for after an incident: <em>who knew what, when, and who accepted proceeding?</em> Organizations without it improvise answers under subpoena; organizations with it have a defensible record of governed decision-making — even when the decision proves wrong. You are building the paper trail that separates "negligent" from "wrong despite diligence," which is often the entire legal ballgame.</p></div>

<h2>Today's takeaway</h2>
<p>Four treatments, explicitly chosen per risk; residual risk re-scored honestly (with impossibility-theorem candor where it applies); acceptance signed by consequence-authority, with conditions and revocation triggers. Tomorrow: writing the report — the executive summary and findings language that carry all of this to people who will never read the appendix.</p>
`,
quiz:{q:"A team's register shows every risk marked 'Mitigated' with no residual column and no acceptance signatures. What has actually happened, in risk-management terms?",options:["The risks have been fully resolved, and the register accurately reflects a system with no remaining exposure","Nothing is missing — a residual column is optional once a treatment has been selected and implemented","Doing something has been equated with eliminating risk: residuals are unscored and nobody has accepted them","The register is complete, since documenting the chosen treatment is the final step risk management requires"],answer:2,explain:"Mitigation reduces, never erases; the residual column forces the honest remainder into view, and the signature routes its acceptance to someone with authority over the consequences. Without both, the organization has treatments but no accountable risk decisions."}},

{n:40,title:"Writing the Report — Executive Summaries and Findings Language",read:"Build Step · 17 min read · ~1 hr build",body:`
<p>Your evidence is assembled; your register is complete. Today: the craft that determines whether any of it matters — <strong>writing for the reader who decides</strong>. Executives will read one page. Their one page must be worthy of the ninety beneath it.</p>

<h2>The executive summary: verdict-first architecture</h2>
<p>Write it last, structure it ruthlessly, one page:</p>
<ol>
<li><strong>Verdict sentence.</strong> System, tier, and recommendation in one breath: "The [model] presents <strong>High</strong> inherent risk, reducible to <strong>Moderate</strong> under the conditions below; we recommend conditional approval."</li>
<li><strong>Three findings that drive the verdict.</strong> Not your ten favorites — the three that, if the reader remembers nothing else, justify the recommendation. Each: one plain-language sentence + the one number that proves it.</li>
<li><strong>The conditions.</strong> The must-happen list with owners and dates, drawn from Day 39's acceptance conditions.</li>
<li><strong>What was not assessed.</strong> Two lines of scope honesty — the pre-answered "why didn't you catch X" insurance.</li>
</ol>

<h2>Findings language: the register of a professional</h2>
<p>Rules earned from years of watching findings land or die:</p>
<ul>
<li><strong>Findings state evidence, not accusation.</strong> "FNR for group B is 2.1× group A's (CI [1.5, 2.8])" — not "the model discriminates." The first is defensible in any room; the second starts a legal argument you don't control and lets the substance escape.</li>
<li><strong>Plain language carries the point; the number carries the proof.</strong> "The model is far more likely to wrongly reject qualified applicants from group B" — then the statistics in parentheses. Never make a director parse a table to learn the headline.</li>
<li><strong>Severity words are budgeted currency.</strong> If everything is "critical," nothing is; tie the words to your matrix anchors and spend "Critical" only where the register earned it.</li>
<li><strong>Recommendations are verbs with owners and dates.</strong> "Assign threshold ownership to [role] by [date]" — not "ownership should be considered." Passive voice in a recommendation is a pre-negotiated surrender.</li>
<li><strong>Steelman the model too.</strong> State what it does well and what the alternative (often: the human status quo, with its own measured biases) costs. Assessments that read as prosecution get discounted; assessments that read as adjudication get adopted.</li>
</ul>

<div class="box an"><div class="bt">◆ Analogy</div><p>A newspaper's inverted pyramid: headline, lede, nut graf — the story survives being cut from the bottom. Your reader <em>will</em> cut from the bottom; the summary is the version that must survive. And like a good journalist, your credibility rests on the reader's certainty that the dramatic headline is backed, sentence for sentence, by the reporting underneath.</p></div>

<div class="box field"><div class="bt">✱ From the field</div><p>The best single edit I ever received on an assessment: my draft said a finding was "concerning." My reviewer crossed it out and wrote — "concerning to whom, costing what, unless what?" Adjectives are where findings go to die. Every judgment word in your report should be replaceable by a stakeholder, a magnitude, and a condition. That edit is now yours.</p></div>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>Report craft is governance capability, not decoration: identical evidence, written twice, produces action in one version and shelf-ware in the other. NIST's GOVERN function speaks of risk communication culture — this is what it means at the document level. Tomorrow you assemble everything into Deliverable #4, and the writing is what your portfolio reviewer will actually judge, because it's the part they can evaluate without rerunning your notebooks.</p></div>

<h2>Write for the discovery request you hope never arrives</h2>
<p>One more reader belongs on your list, and after the enforcement inversion (Day 42) they belong near the top of it: <strong>opposing counsel</strong>. In algorithmic-discrimination litigation — <em>Mobley v. Workday</em> being the case to know — plaintiffs seek a predictable set of materials: model inputs and features, training and validation documentation, adverse-impact analyses, human-override practices, and vendor communications. Your assessment sits squarely in the middle of that list, and it will be read alongside every draft, email, and ticket that produced it.</p>
<p>Three habits follow, none of which cost anything at writing time:</p>
<ul>
<li><strong>Never write a conclusion your evidence appendix cannot reach.</strong> The gap between a confident sentence and a thin appendix is the first thing an opposing expert will find.</li>
<li><strong>Date and own every recommendation.</strong> &ldquo;Recommended 12 March; accepted by [owner] 19 March; implemented 2 April&rdquo; demonstrates reasonable care. An undated, unowned recommendation demonstrates that someone knew and nobody acted — which is worse than not having looked.</li>
<li><strong>State limitations affirmatively, in your own voice.</strong> A limitation you disclosed is diligence; the identical limitation surfaced by the other side is concealment. This is the highest-leverage sentence-level habit in the craft.</li>
</ul>
<p>None of this is a reason to soften findings. It is the reason to write them precisely: the report that best protects an employer who acted well is the same report that most accurately describes what you found.</p>

<h2>Today's takeaway</h2>
<p>Verdict-first one-page summary (verdict, three findings, conditions, scope honesty); findings as evidence-statements in plain language with budgeted severity words; recommendations as owned, dated verbs; adjudication tone over prosecution; and every sentence written to survive discovery, not merely review. Tomorrow: assembly and sign-off — Deliverable #4.</p>
`,
quiz:{q:"Why should a finding read 'FNR for group B is 2.1× group A's (CI [1.5, 2.8])' rather than 'the model discriminates against group B'?",options:["Because quantified statements lend the report a more rigorous appearance to a technically literate reader","Because the measured statement is defensible and actionable, while a legal conclusion invites a liability fight","Because a legal characterisation requires more supporting sentences than a report of this length allows","Because senior readers process ratios more readily than they process qualitative descriptions of harm"],answer:1,explain:"'Discriminates' is a legal conclusion requiring elements your metrics alone can't establish, and it converts a technical review into a courtroom. The measured statement, in plain language plus proof, forces engagement with the fact pattern — which is what actually drives remediation."}},

{n:41,title:"Assembly — Your Model Risk Assessment (Deliverable #4)",read:"Capstone Build · 20 min read · ~6 hr build · Flagship deliverable",body:`
<p>Assembly day. Everything from Days 33–40 becomes one professional document — the first of your three flagships. By tonight your portfolio contains a complete, NIST-aligned AI Model Risk Assessment on a model you built, evaluated, and now formally assess.</p>

<div class="box hl"><div class="bt">▲ Phase 4 in one breath</div><p>An assessment is an evidence-backed argument on the GOVERN/MAP/MEASURE/MANAGE spine (33). Scoping and the consequence-based inventory decide what's assessed, with tiering and an independence note (34). MAP: two-ring stakeholders and a lifecycle failure catalogue, every entry traceable onward (35). The anchored risk matrix and owned register order the catalogue while dodging severity laundering and the diagonal illusion (36). MEASURE: the risk→test map, pre-specified, with fixed-format findings and disclosed limitations (37). GOVERN: control gaps across seven families, evidence-cited (38). MANAGE: four treatments, honest residuals, signed acceptance with revocation conditions (39). And writing that carries the verdict to the person who decides (40).</p></div>

<h2>Assembly checklist</h2>
<ol>
<li>Create <code>model-risk-assessment.md</code> with the eight-section skeleton from Day 33.</li>
<li>Drop in your built pieces: scope statement (34), stakeholder map + failure catalogue (35), matrix + register (36), risk→test map + findings (37), control gap table (38), treatments + residuals + sign-off block (39).</li>
<li>Write the methodology section around your pre-specified plan; pin tool versions; state limitations honestly (free-tier constraints included — Day 17's discipline).</li>
<li>Write the executive summary <em>last</em>, per Day 40's architecture.</li>
<li>Cross-check traceability: every summary finding → §5 finding → register row → test → evidence link. One broken chain is what a hostile reviewer will find first.</li>
<li>Appendices: the register (full), the monitor config (Day 31), links to the Day 24 and Day 32 notebooks as your evidence base.</li>
</ol>

<div class="box wa"><div class="bt">■ The self-review pass</div><p>Before committing, read the document once as each of three people: the <strong>executive</strong> (does page one alone justify a decision?), the <strong>engineer</strong> (can every number be reproduced from the linked evidence?), and the <strong>hostile expert</strong> (are limitations disclosed before they can be discovered? adjectives backed? multiplicity corrected? residuals signed?). Fix what any of the three would catch. This triple-read is the cheapest quality control in the profession and almost nobody does it.</p></div>

<div class="box tmpl"><div class="bt">▤ Optional second exit: the validation-report variant</div><p>If financial services is on your list, spend one extra hour and emit the same evidence a second way. No new analysis — a reordering, plus one section you now have from Day 34 and one from Day 24. Add <code>VALIDATION-REPORT.md</code> beside the assessment:</p>
<ol>
<li><strong>Executive summary and validation opinion.</strong> The verdict vocabulary differs from a NIST risk tier — say <em>fit for use</em>, <em>fit for use with limitations</em> (list them), or <em>not fit for use</em>. State the opinion in the first paragraph.</li>
<li><strong>Model description, purpose, and use test.</strong> Your §2 scope block, plus one paragraph: is the model used for the purpose and population it was developed for?</li>
<li><strong>Conceptual soundness.</strong> Your Day 34 five questions — methodology fit, variable rationale, assumptions, use test, developmental evidence.</li>
<li><strong>Data quality and lineage.</strong> From §2 and your BTM Day 10 profile.</li>
<li><strong>Implementation verification.</strong> Your Day 24 replication result — spec, max absolute difference, decision flips, stated tolerance, conclusion.</li>
<li><strong>Outcomes analysis.</strong> Backtesting (23), benchmarking against the challenger (21), sensitivity analysis (20).</li>
<li><strong>Ongoing monitoring.</strong> Your Day 31 monitor: thresholds, triggers, owners, cadence, and the recalibration-versus-redevelopment line (23).</li>
<li><strong>Findings and limitations.</strong> Your register rows, rated, owned and dated, with compensating controls where a gap is accepted.</li>
</ol>
<p>Two documents from one evidence base doubles what the portfolio speaks to at almost no marginal cost — and the discipline of writing both is itself the point Day 33 was making about knowing which regime you are in.</p></div>

<h2>File Deliverable #4</h2>
<p>Commit to <code>taming-the-machine/d41-model-risk-assessment/</code>: the assessment, the register as a separate living file, the optional <code>VALIDATION-REPORT.md</code> variant, and <code>WHAT-I-LEARNED.md</code>. Reflection: <em>which section required the most judgment beyond what any framework specified — and what does that tell you about where assessors earn their pay?</em></p>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>You now hold what most applicants only claim: a complete risk assessment with real evidence underneath it. Phases 5 and 6 are specializations of this container — the bias assessment takes register family R-09 to legal-audit depth under LL144's rules; the responsible-AI assessment widens the stakeholder ring to societal scope under ISO 42005's structure. The spine you built this phase carries both.</p></div>
`,
vocab:[
{term:"Model inventory",def:"Consequence-based register of all decision-influencing systems; unlisted = ungoverned."},
{term:"Scope statement",def:"Seven fields + honest exclusions + tier + independence note; the assessment's contract."},
{term:"Failure-mode catalogue",def:"Lifecycle-walked risk list: failure → mechanism → stakeholder → consequence."},
{term:"Anchored matrix",def:"Likelihood × severity with written anchors; scores cite evidence where it exists."},
{term:"Severity laundering",def:"Population-averaging that hides concentrated harm; score the most-affected stakeholder."},
{term:"Risk register",def:"The living row-per-risk artifact: rating, evidence, treatment, owner, review date."},
{term:"Risk→test map",def:"Traceability from register rows to pre-specified tests and back to findings."},
{term:"Control gap table",def:"Expected vs. found controls across seven families; Adequate/Partial/Absent, evidence-cited."},
{term:"Four treatments",def:"Mitigate, avoid, transfer (money, not accountability), accept (signed, conditional)."},
{term:"Residual risk",def:"The honest remainder after treatment; re-scored, never assumed away."},
{term:"Sign-off block",def:"Acceptance by consequence-authority with conditions and revocation triggers."},
{term:"Verdict-first summary",def:"One page: verdict, three findings, conditions, scope honesty — written last."}
],
quiz:{q:"The final traceability check requires every executive-summary finding to chain back through §5, the register, a pre-specified test, and an evidence link. What does one broken chain cost?",options:["A presentational deduction, since the document's structure is expected to be internally consistent","Nothing material, provided the remaining findings in the summary trace correctly to their evidence","The document's credibility: an unchained claim reads as opinion, and one discredits the chained ones too","Only appendix completeness, since the evidence base rather than the argument carries the broken link"],answer:2,explain:"The assessment's authority is the audit trail itself: verdict → finding → risk → test → evidence. A single orphaned claim demonstrates the trail can't be trusted wholesale — which is why the triple-read hunts broken chains before any external reviewer can."}},
{n:42,title:"Anatomy of a Bias Audit — Independence and the Legal Landscape",read:"Lesson · 16 min read · Phase 5 begins",body:`
<p>Phase 5 builds your second flagship: a <strong>Model Bias Assessment</strong> constructed to the most demanding public standard available — New York City's Local Law 144, the first US law to mandate independent bias audits of AI hiring tools — extended with the fuller statistical battery a serious audit adds on top. Eight days, one assessment built to the standard the statute sets.</p>

<div class="box tmpl"><div class="bt">▤ You have written a bias audit before — here is what changes</div><p>Your BTM Day 36 deliverable was a real audit with a real structure. Phase 5 rebuilds it to the standard an independent auditor publishes under statute. Same core sections, every one of them load-bearing differently — plus two the earlier audit had no way to attempt.</p></div>

<table class="vocab">
<tr><th>Section</th><th>BTM Day 36 → Phase 5 standard</th></tr>
<tr><td>Attestation</td><td><em>None — you audited your own model.</em> → Independence statement first: who audited, relationships, who could and could not alter findings.</td></tr>
<tr><td>Scope</td><td><em>Protected attributes you chose.</em> → Mandated categories (sex, EEO-1 race/ethnicity, intersections), defined window, unknown-bucket size, 2% exclusions disclosed with their sizes.</td></tr>
<tr><td>Data</td><td><em>Your test split.</em> → Real historical usage over a stated window, with the population assembled from source tables in SQL, de-duplicated by a documented rule, reconciled row-by-row, and the query committed as evidence.</td></tr>
<tr><td>Findings</td><td><em>Per-group and per-intersection rates.</em> → The same table plus cell n's, bootstrap CIs, BH-adjusted p, error and stability batteries, a stage-by-stage funnel audit of the whole decision system, and every row labeled <strong>core</strong> (legally mandated) or <strong>extended</strong> (your added rigor).</td></tr>
<tr><td>Definitions</td><td><em>Which you checked, which passed.</em> → The primary definition pre-specified in writing, with a defense, before any result was computed.</td></tr>
<tr><td>Why</td><td><em>—</em> → Root-cause section: six mechanism families worked in order, because remedy inherits diagnosis.</td></tr>
<tr><td>Validity</td><td><em>Not examined — the score was taken at face value.</em> → The business-necessity defense interrogated: which Uniform Guidelines strategy is claimed, what criterion, what reliability, how representative the validation sample — and differential prediction tested where a performance measure exists.</td></tr>
<tr><td>Alternatives</td><td><em>Recommended that someone run an LDA test.</em> → You run it: candidate variants compared on one table with paired-bootstrap CIs on every delta.</td></tr>
<tr><td>Output</td><td><em>One internal write-up.</em> → Two documents — public summary and full report — reconciled digit-for-digit, on an annual and triggered cadence.</td></tr>
</table>

<p>Read that last row twice. Your BTM audit was written for you. This one is written for a candidate, a journalist, and an opposing expert reading the same page. And note the <strong>Validity</strong> and <strong>Alternatives</strong> rows especially — your Day 36 recommendations already said a less-discriminatory-alternative test should be required before deployment. That was the right call and you couldn't yet perform it. Day 47 is where you settle that IOU.</p>

<h2>Why LL144 is the teaching standard</h2>
<p>Most bias-audit guidance is aspirational; LL144 is <em>operative law</em> with specified mathematics. Since July 2023, NYC employers using automated employment decision tools (AEDTs) must commission an annual bias audit by an <strong>independent auditor</strong>, publish a public summary of results, and notify candidates. The law defines what must be computed (selection/scoring rates and impact ratios), across which categories (sex, race/ethnicity, <em>and their intersections</em>), on what data (the employer's real historical data), with what disclosure rules. Learn to execute this and every softer bias-review request becomes a subset.</p>

<h2>Independence: the structural requirement</h2>
<p>LL144's auditor must be genuinely independent — not involved in using or developing the tool, no financial interest in its success. The logic generalizes far beyond NYC: <strong>bias findings threaten the people who built and bought the system</strong>, so audits conducted under their authority face structural pressure toward comfortable conclusions. Independence isn't a virtue signal; it's an engineering control on motivated reasoning. In your document, the independence statement (who audited, relationships, payment structure, who could — and could not — modify findings) sits in Section 1, before any mathematics.</p>

<div class="box an"><div class="bt">◆ Analogy</div><p>Financial audit learned this a century ago: companies don't grade their own books; licensed external auditors do, with liability for false comfort. Nobody calls that an insult to accountants' integrity — it's an acknowledgment that incentive structure beats individual virtue at scale. LL144 imports that architecture to algorithms. When someone bristles at the independence requirement, they're arguing against double-entry bookkeeping's whole descendant tradition.</p></div>

<h2>The enforcement inversion — the 2026 fact that reframes the job</h2>
<p>Between 2025 and 2026 the centre of gravity moved, and an auditor who does not know this will sound two years out of date in an interview. <strong>Federal agency enforcement contracted; private litigation and state law expanded.</strong> In January 2025 the EEOC removed its AI technical-assistance documents from its website, including the guidance on assessing adverse impact in algorithmic selection procedures. Executive Order 14281 (April 2025) directed agencies to eliminate reliance on disparate-impact liability &ldquo;to the maximum degree possible&rdquo;; the EEOC closed pending disparate-impact-only charges through autumn 2025; and in June 2026 a DOJ Office of Legal Counsel opinion concluded the EEOC&rsquo;s disparate-impact guidelines are unconstitutional.</p>
<p>Now the part most people get wrong. <strong>The underlying law did not change.</strong> Title VII&rsquo;s disparate-impact provision is codified by statute (Civil Rights Act of 1991) and private plaintiffs can still sue on it. The <strong>Uniform Guidelines on Employee Selection Procedures</strong> (29 C.F.R. Part 1607) &mdash; the actual legal source of the four-fifths rule you met in BTM Day 35 &mdash; remain in force. State disparate-impact liability in New York, California, Illinois, Colorado and Minnesota is untouched. And LL144 is city law, unaffected by any of it.</p>
<p>So the consequence for your work is a change of <em>audience</em>, not of method. Your report used to be framed as something a regulator might read. It is now, first and foremost, <strong>evidence of reasonable care in a private action</strong>. Everything this phase teaches gets more important under that framing, not less &mdash; because the reader you are writing to withstand is an opposing expert with discovery rights.</p>

<div class="box wa"><div class="bt">■ The enforcement paradox — say this out loud in an interview</div><p>The same eighteen months that saw federal retreat saw NYC&rsquo;s enforcement <em>sharpen</em>. On 2 December 2025 the New York State Comptroller published an audit of DCWP&rsquo;s LL144 enforcement covering July 2023 to June 2025 and concluded it was <strong>&ldquo;ineffective&rdquo;</strong>: 75% of test calls to 311 about AEDT issues were misrouted and never reached DCWP; of 32 bias-audit disclosures DCWP reviewed it identified one likely non-compliance, while the Comptroller&rsquo;s reviewers found at least seventeen potential issues in the same 32; and DCWP had never used its own Enforcement Workbook. DCWP has committed to most of the recommendations &mdash; proactive rather than complaint-driven review, cross-trained staff, use of the city&rsquo;s Office of Technology and Innovation. A regulator publicly graded ineffective has every institutional incentive to demonstrate otherwise. The question in 2026 is no longer &ldquo;does an audit exist&rdquo; but &ldquo;would this audit survive a review that is finally reading it.&rdquo; That is the argument for every row of the extended battery.</p></div>

<div class="box hl"><div class="bt">▲ Mobley v. Workday — where liability is actually moving</div><p>Learn this case name. In <em>Mobley v. Workday</em> (N.D. Cal.), a plaintiff alleges that Workday&rsquo;s applicant-screening algorithms disproportionately exclude applicants over 40, and the court conditionally certified a collective action. It is the landmark test of whether liability attaches to the <strong>vendor</strong> that builds the tool, not only the employer that deploys it. Two things follow for you. First, if vendors are exposed, vendors start commissioning real audits defensively &mdash; and that is where a meaningful share of the demand for your skills now comes from. Second, note the protected class: <strong>age</strong>. LL144 mandates sex and race/ethnicity; the litigation generating the most exposure right now is an ADEA case. The mandated categories are a floor, not the risk surface.</p></div>

<div class="box wa"><div class="bt">■ The wider legal map (orientation, not legal advice — current to August 2026)</div><p>LL144 remains <strong>the only US law that mandates a bias audit by name</strong>. The rest of the map creates <em>liability</em> instead — and an independent audit is the strongest available evidence of reasonable care against it. <strong>Illinois</strong> HB 3773 amended the Human Rights Act effective January 2026: AI-use disclosure, adverse-impact liability, and an explicit statutory bar on using zip code as a proxy for protected classes (BTM Day 8&rsquo;s proxy hunt, now written into law). <strong>California&rsquo;s</strong> Civil Rights Council FEHA regulations pull automated-decision systems into the state anti-discrimination framework. <strong>Colorado</strong> replaced SB 24-205 with SB 26-189 in May 2026, effective January 2027 — a disclosure-and-human-review model rather than an audit mandate. <strong>Connecticut&rsquo;s</strong> CART Act (Public Act 26-15) adds disclosure and pre-decision notice duties on a staged timeline. The <strong>EU AI Act&rsquo;s</strong> high-risk regime imposes broader impact-assessment duties. And a December 2025 executive order seeking to preempt state AI regulation is in litigation, the outcome of which will reshape all of the above. Your audit should name which regimes it is built to satisfy and which it merely gestures toward — overclaiming legal coverage is its own liability. <strong>One development in your favour:</strong> the EU's Digital Omnibus on AI (Regulation (EU) 2026/1744, in force 27 July 2026 — Day 50) also amended the GDPR to provide a lawful basis for processing special-category data specifically for <strong>bias detection and correction</strong>. That resolves the most common practical blocker in European fairness work — the catch-22 where you cannot lawfully collect the demographic data you need in order to test whether you are discriminating on it. It is not a blank cheque; the processing must be governed, minimised and purpose-bound. But &ldquo;we couldn't test because of GDPR&rdquo; is no longer an answer, and knowing that puts you ahead of everyone who stopped reading at the delay headline. <strong>Date-stamp every legal map you write and re-read it annually; this one is current to August 2026.</strong> The durable skill is the <em>method</em>; the citations rotate.</p></div>

<div class="box hl"><div class="bt">▲ The same method has a second name, a second statute, and a second employer</div><p>Everything this phase teaches — disparate-impact testing across protected classes, then a search for a less discriminatory alternative — is also the core of <strong>fair-lending model validation</strong>. Swap employment for credit and Title VII for the <strong>Equal Credit Opportunity Act</strong> and Regulation B, and the method is the same: measure outcome disparities across protected classes, establish whether the disparity is attributable to the model, and search for a variant that performs comparably with less disparate effect. The LDA table you build on Day 47 is, without a line changed, a fair-lending validation exhibit.</p><p>This matters commercially. Banks employ far more people doing fair-lending model validation than New York City employs LL144 auditors, the work sits inside a mature second-line function with SR 26-2 behind it (Day 33), and the ECOA adverse-action duty you met on Day 14 is part of the same job. If the LL144 path is slow to open, this is the adjacent door — and it needs no new skills, only a change of vocabulary.</p></div>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>Phase 4 built the container; this phase deep-dives register family R-09 to the depth a regulator, plaintiff, or journalist would apply. Structurally your bias assessment reuses the Day 33 skeleton — scope, methodology, findings, recommendations — with two additions unique to this genre: the independence statement, and (Day 48) the split between a <em>public summary</em> and the <em>full technical report</em>. Everything else you already own.</p></div>

<h2>Today's takeaway</h2>
<p>LL144 supplies the operative standard: independent auditor, specified metrics, intersectional categories, real historical data, public disclosure. Independence is an incentive-structure control, stated before the math. The enforcement inversion is the 2026 context: federal agency enforcement contracted, private litigation and city enforcement sharpened, and your report is now evidence of reasonable care rather than a regulatory filing. Keep the eight-row table above open as you work — it is the running spec for this phase, and by Day 49 you will have moved every row from the left column to the right. Tomorrow: scoping the audit — categories, data requirements, and the decisions that shape every number downstream.</p>
`,
quiz:{q:"Why does LL144 require the bias auditor to be independent (uninvolved in developing or using the tool, no financial stake)?",options:["Because analysts employed internally typically lack the statistical training a formal bias audit requires","Because commissioning an external auditor is materially cheaper than staffing the capability internally","Because the statute presumes that vendors of automated employment tools will misrepresent their systems","Because independence controls incentives: findings threaten builders and buyers, who would otherwise pressure"],answer:3,explain:"The requirement targets motivated reasoning at the institutional level, not individual competence or honesty. Findings that cost the client money need an author the client cannot quietly overrule — which is why the independence statement leads the document."}},

{n:43,title:"Scoping the Audit — Categories, Data, and Building the Population",read:"Build Step · 16 min read · ~3 hr lab",body:`
<p>A bias audit's conclusions are largely determined before any statistic runs — by which categories are compared, on what data, over what window, with what handling of the unknowns. Today: the scoping decisions, made explicitly, the LL144 way.</p>

<h2>Step zero — is it even an AEDT?</h2>
<p>Before categories, before data, before any statistic: <strong>does the tool fall in scope at all?</strong> This is the first task on every real engagement and the one candidates fumble in interviews. LL144&rsquo;s definition is a three-part conjunction — a tool qualifies only if <em>all three</em> hold:</p>
<ul>
<li><strong>Technique</strong> — it uses machine learning, statistical modelling, data analytics, or AI; that is, it generates a prediction or classification <em>and</em> the technique identifies the inputs, their relative importance, and other parameters to improve accuracy.</li>
<li><strong>Use</strong> — it helps an employer or employment agency make an employment decision (hiring, or promotion of employees).</li>
<li><strong>Weight</strong> — it <strong>substantially assists or replaces</strong> discretionary decision-making.</li>
</ul>
<p>That third prong does the work, and it is read broadly: if a hiring manager is shown an AI-generated score or ranking and routinely acts on it, the tool is substantially assisting even though a human formally decides. Conversely, a keyword filter executing a recruiter&rsquo;s own stated criterion (&ldquo;show me candidates whose CV contains Python&rdquo;) is a rule, not an automated decision. Scheduling automation, document management, and basic database search sit outside.</p>

<div class="box wa"><div class="bt">■ Two scoping facts that catch organisations out</div><p><strong>Jurisdiction follows the candidate, not the employer.</strong> If a candidate or employee resides in any of the five boroughs, LL144 applies to that individual&rsquo;s evaluation — regardless of where the company is headquartered or where the role is performed. A remote posting with one Brooklyn applicant pulls a Boise company into scope. <strong>And the audit has a shelf life:</strong> the tool may not be used unless a bias audit was conducted <em>no more than one year</em> prior to use, which is what makes the cadence annual rather than one-off. Your model inventory (Day 34) is where both facts get operationalised: every tool, every decision point, every jurisdiction of the candidate pool, every audit date.</p></div>

<h2>The category structure</h2>
<p>LL144 mandates three analysis dimensions: <strong>sex categories</strong>, <strong>race/ethnicity categories</strong> (drawn from the EEO-1 federal reporting framework), and <strong>intersectional categories</strong> crossing the two (e.g., Hispanic female, Black male). Your Day 28 lab is now the legally required shape. Two data realities dominate: <strong>self-identification and the unknown bucket</strong> — demographic data is typically self-reported and incomplete, and the audit must report how many candidates fall in "unknown" (a large unknown bucket is itself a finding about data governance); and <strong>the small-category rule</strong> — categories under 2% of the data may be excluded from impact-ratio calculations, but the exclusion must be disclosed with the category's size. Note the design wisdom: the law doesn't pretend thin cells yield reliable ratios (your Day 28 statistics said the same), but it forbids <em>silent</em> dropping.</p>

<div class="box hl"><div class="bt">▲ The mandated categories are a floor, not the risk surface</div><p>LL144 names sex and race/ethnicity. Your scope block should say so — and then say what it <em>excluded</em>. Age carries separate statutory exposure under the ADEA and is the protected class at issue in <em>Mobley v. Workday</em>, the case currently doing most to move vendor liability. Disability carries ADA exposure, though pre-offer data collection constraints usually make a statistical audit impossible and an <em>accessibility</em> assessment the right substitute. Writing &ldquo;age and disability were outside the mandated scope of this audit and were not tested&rdquo; costs one sentence and is the difference between a limitation you disclosed and a gap opposing counsel discovers.</p></div>

<h2>The data requirements</h2>
<p><strong>Historical data from actual use</strong> is the default — the audit examines what the tool did to real candidates, not what it does to synthetic test cases (test-data audits are permitted essentially only for tools without sufficient history, and must say so). Define the window (12 months is the standard rhythm — audits must be annual), the decision point audited (which stage's screen-out?), and the outcome definition: for tools that <em>select</em>, the selection rate; for tools that <em>score</em> continuously, LL144's scoring-rate construction (the share of each group scoring above the median score — a clever standardization that makes "scored favorably" comparable across tools).</p>

<div class="box tmpl"><div class="bt">▤ Build: the audit scope block (assessment §2)</div><p>Write it for your model now (adult-income data standing in as the decision system, <code>sex</code> and <code>race</code> as the mandated dimensions): <strong>Tool + decision point audited · Data window and volume · Category structure (sex / race-ethnicity / intersections) with per-category n's · Unknown-bucket size and handling · Categories excluded under the small-category rule, with sizes · Outcome definition (selection vs. scoring construction) · Data lineage and known collection caveats.</strong> Every downstream number inherits these choices; making them visible is what makes the numbers interpretable.</p></div>

<div class="box an"><div class="bt">◆ Analogy</div><p>A drug trial's registration: population, endpoints, and exclusion criteria are fixed and published before results, because trial conclusions can be manufactured by quiet cohort choices. Your scope block is the audit's registration — the same pre-specification shield from Day 30, now with a statute behind it.</p></div>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>The scope block is also where audit-shopping gets caught: an employer who audits only the final interview stage (where earlier algorithmic screens already filtered the pool) can launder disparity into invisibility. Which decision point, whose data, which window — these choices are the audit's real battlefield, and your document fights it in the open.</p></div>

<h2>Where the data actually comes from — the extraction nobody audits</h2>
<p>Every lab in both courses has handed you a clean DataFrame. No real audit begins that way. It begins with a database, three or four tables that do not quite line up, and an extraction step where the population you are about to audit is silently defined by whoever wrote the query. That step is unexamined in most audits, and it is where the most consequential errors enter — not errors of statistics, but errors of <em>who got counted</em>.</p>
<p>So before Day 44 computes a single impact ratio, you build the population and prove it is right. SQL is the language this happens in, and it is a standing requirement in model risk and audit job postings alongside Python — but the reason it belongs here is not employability. It is that <strong>an impact ratio computed on a wrongly-assembled population is wrong in a way no amount of downstream rigour can repair.</strong></p>

<h3>Step 0 — Generate the data</h3>
<p>Real audit data is confidential, and practising on real applicant records would be exactly the privacy problem this course teaches you to spot. So you will generate it. This is not a compromise: the EU AI Act points to synthetic data as a first option for bias detection and mitigation work precisely so that sensitive personal data need not be processed, and when the UK's Centre for Data Ethics built its bias-mitigation resource it generated recruiting data for the same reason — the open datasets either had quality problems or lacked the demographic fields you need to assess fairness at all.</p>
<p>Run this once. It writes three CSVs with defects deliberately seeded in — the same defects that turn up in real extractions:</p>
<pre><code><span class="kw">import</span> numpy <span class="kw">as</span> np, pandas <span class="kw">as</span> pd

rng = np.random.default_rng(42)          <span class="cm"># fixed seed: everyone gets the same data</span>
N = 4000

<span class="cm"># ---- applicants ------------------------------------------------------</span>
sex  = rng.choice([<span class="st">"Female"</span>, <span class="st">"Male"</span>], N, p=[.46, .54])
race = rng.choice([<span class="st">"White"</span>, <span class="st">"Black"</span>, <span class="st">"Hispanic"</span>, <span class="st">"Asian"</span>, <span class="st">"Two or More"</span>],
                  N, p=[.55, .16, .15, .12, .02])
applicants = pd.DataFrame({
    <span class="st">"applicant_id"</span>: np.arange(10001, 10001 + N),
    <span class="st">"applied_at"</span>: pd.to_datetime(<span class="st">"2025-01-01"</span>) + pd.to_timedelta(rng.integers(0, 400, N), <span class="st">"D"</span>),
    <span class="st">"sex"</span>: sex, <span class="st">"race"</span>: race,
    <span class="st">"years_experience"</span>: np.clip(rng.normal(7, 4, N), 0, <span class="kw">None</span>).round(1),
    <span class="st">"education_level"</span>: rng.choice([<span class="st">"HS"</span>, <span class="st">"Associate"</span>, <span class="st">"Bachelor"</span>, <span class="st">"Master"</span>], N, p=[.18,.17,.45,.20]),
})

<span class="cm"># SEEDED: demographics are self-reported and missing unevenly.</span>
<span class="cm"># ~5% overall, but roughly double that for one group.</span>
miss = rng.random(N) &lt; np.where(race == <span class="st">"Black"</span>, 0.11, 0.045)
applicants.loc[miss, [<span class="st">"sex"</span>, <span class="st">"race"</span>]] = np.nan

<span class="cm"># ---- screens (one row per scoring event) ------------------------------</span>
base = 0.55 + 0.03*(applicants[<span class="st">"years_experience"</span>] - 7)/4
<span class="cm"># SEEDED: the tool advances one group less often at equal experience</span>
base = base - np.where(applicants[<span class="st">"sex"</span>].fillna(<span class="st">"Male"</span>) == <span class="st">"Female"</span>, 0.06, 0.0)
score = np.clip(rng.normal(base, 0.15), 0, 1).round(3)

screens = pd.DataFrame({
    <span class="st">"screen_id"</span>: np.arange(1, N + 1),
    <span class="st">"applicant_id"</span>: applicants[<span class="st">"applicant_id"</span>],
    <span class="st">"screened_at"</span>: applicants[<span class="st">"applied_at"</span>] + pd.to_timedelta(rng.integers(1, 14, N), <span class="st">"D"</span>),
    <span class="st">"score"</span>: score,
})
screens[<span class="st">"advanced"</span>] = (screens[<span class="st">"score"</span>] &gt;= 0.60).astype(int)   <span class="cm"># the model's decision</span>

<span class="cm"># SEEDED: ~7% of candidates were re-scored after a CV update -> duplicate keys</span>
redo = screens.sample(frac=0.07, random_state=1).copy()
redo[<span class="st">"screen_id"</span>] = np.arange(N + 1, N + 1 + len(redo))
redo[<span class="st">"screened_at"</span>] = redo[<span class="st">"screened_at"</span>] + pd.to_timedelta(rng.integers(10, 60, len(redo)), <span class="st">"D"</span>)
redo[<span class="st">"score"</span>] = np.clip(redo[<span class="st">"score"</span>] + rng.normal(0.05, 0.08, len(redo)), 0, 1).round(3)
redo[<span class="st">"advanced"</span>] = (redo[<span class="st">"score"</span>] &gt;= 0.60).astype(int)
screens = pd.concat([screens, redo], ignore_index=<span class="kw">True</span>)

<span class="cm"># ---- outcomes (arrive later than screens; some still pending) ---------</span>
adv = screens.sort_values(<span class="st">"screened_at"</span>).drop_duplicates(<span class="st">"applicant_id"</span>)
adv = adv[adv[<span class="st">"advanced"</span>] == 1]
<span class="cm"># SEEDED: ~18% of advanced candidates have no decision yet</span>
decided = adv.sample(frac=0.82, random_state=2)
outcomes = pd.DataFrame({
    <span class="st">"applicant_id"</span>: decided[<span class="st">"applicant_id"</span>].values,
    <span class="st">"decided_at"</span>: decided[<span class="st">"screened_at"</span>].values + pd.to_timedelta(
        rng.integers(5, 90, len(decided)), <span class="st">"D"</span>),
    <span class="st">"outcome"</span>: rng.choice([<span class="st">"hired"</span>, <span class="st">"rejected"</span>], len(decided), p=[.28, .72]),
})

<span class="kw">for</span> name, df <span class="kw">in</span> [(<span class="st">"applicants"</span>, applicants), (<span class="st">"screens"</span>, screens), (<span class="st">"outcomes"</span>, outcomes)]:
    df.to_csv(f<span class="st">"{name}.csv"</span>, index=<span class="kw">False</span>)
    <span class="kw">print</span>(name, df.shape)</code></pre>
<p>Three tables, and note their shapes differ on purpose. <code>applicants</code> has one row per person. <code>screens</code> has one row per <em>scoring event</em>, so it has more rows than there are people. <code>outcomes</code> has fewer rows than there are advanced candidates, because decisions arrive later than screens. Those three facts are the entire difficulty of the next five steps.</p>
<p>The column that matters most downstream is <code>screens.advanced</code> — the tool's decision, 1 if the candidate was passed forward. That is the outcome your selection rates will be computed on, and it lives in <code>screens</code> rather than <code>outcomes</code> because you are auditing the <em>tool</em>, not the hiring manager.</p>

<h3>Load into SQLite</h3>
<p>SQLite ships with Python, so this needs no install and runs anywhere:</p>
<pre><code><span class="kw">import</span> sqlite3
con = sqlite3.connect(<span class="st">"audit.db"</span>)
<span class="kw">for</span> name <span class="kw">in</span> [<span class="st">"applicants"</span>, <span class="st">"screens"</span>, <span class="st">"outcomes"</span>]:
    pd.read_csv(f<span class="st">"{name}.csv"</span>).to_sql(name, con, if_exists=<span class="st">"replace"</span>, index=<span class="kw">False</span>)

q = <span class="kw">lambda</span> sql: pd.read_sql_query(sql, con)      <span class="cm"># shorthand used throughout</span></code></pre>

<h3>Step 1 — Count before you join</h3>
<pre><code>q(<span class="st">"""</span>
<span class="st">SELECT 'applicants' AS tbl, COUNT(*) AS rows, COUNT(DISTINCT applicant_id) AS ids FROM applicants</span>
<span class="st">UNION ALL SELECT 'screens',    COUNT(*), COUNT(DISTINCT applicant_id) FROM screens</span>
<span class="st">UNION ALL SELECT 'outcomes',   COUNT(*), COUNT(DISTINCT applicant_id) FROM outcomes</span>
<span class="st">"""</span>)</code></pre>
<p>Where <code>rows &gt; ids</code>, the key is not unique — candidates re-scored after a CV update, duplicate submissions, test records never cleaned out. Join on a non-unique key and rows multiply silently: a candidate scored three times contributes three rows to your selection rate. If re-scoring correlates with anything demographic, you have just manufactured a disparity.</p>

<h3>Step 2 — Find the duplicates before they find you</h3>
<pre><code>q(<span class="st">"""</span>
<span class="st">SELECT applicant_id, COUNT(*) AS n</span>
<span class="st">FROM screens GROUP BY applicant_id HAVING n &gt; 1</span>
<span class="st">ORDER BY n DESC LIMIT 20</span>
<span class="st">"""</span>)</code></pre>
<p>Then make the <em>rule</em> explicit and write it into your scope block: first screen, last screen, or highest score? Each defines a different population and a different audit. There is no default — only a documented choice.</p>

<h3>Step 3 — Join, and watch the population change</h3>
<pre><code>q(<span class="st">"""</span>
<span class="st">WITH first_screen AS (</span>
<span class="st">  SELECT applicant_id, MIN(screened_at) AS screened_at</span>
<span class="st">  FROM screens GROUP BY applicant_id)</span>
<span class="st">SELECT COUNT(*) AS joined_rows</span>
<span class="st">FROM applicants a</span>
<span class="st">JOIN first_screen f ON f.applicant_id = a.applicant_id</span>
<span class="st">LEFT JOIN outcomes o ON o.applicant_id = a.applicant_id</span>
<span class="st">"""</span>)</code></pre>
<p>Note the two join types doing different work. <code>JOIN</code> to screens restricts the audit to people the tool actually scored — correct, since you are auditing the tool. <code>LEFT JOIN</code> to outcomes keeps candidates with no decision yet, because dropping them would quietly exclude everyone still in process, and pipeline position is rarely demographically neutral. Swap those two and the population changes without any error appearing.</p>

<h3>Step 4 — Reconcile, and account for every lost row</h3>
<p>The discipline that makes this an audit rather than a data pull: <strong>every row that disappears between the source table and the analysis population must be explained.</strong> Build the ladder — source count, after de-duplication, after the screens join, after date-window filtering, final — and give each drop a reason and a count. Then check the drops for demographic skew: if the "no demographic data" bucket is 4% overall but 11% for one group, your unknown bucket is itself a finding (Day 43's earlier point, now measured).</p>

<h3>Step 5 — Materialize the population</h3>
<p>Everything so far has been diagnosis. Now build the artifact: one query that turns three raw tables into the single de-duplicated, joined, date-filtered population every later step will use. Save it as a view so the definition lives in the database rather than in someone's notebook.</p>
<pre><code>con.executescript(<span class="st">"""</span>
<span class="st">DROP VIEW IF EXISTS audit_population;</span>
<span class="st">CREATE VIEW audit_population AS</span>
<span class="st">WITH first_screen AS (            -- the de-duplication rule, stated once</span>
<span class="st">  SELECT applicant_id, MIN(screened_at) AS screened_at</span>
<span class="st">  FROM screens GROUP BY applicant_id),</span>
<span class="st">scored AS (                       -- recover the score row for that first screen</span>
<span class="st">  SELECT s.applicant_id, s.screened_at, s.score, s.advanced</span>
<span class="st">  FROM screens s</span>
<span class="st">  JOIN first_screen f</span>
<span class="st">    ON f.applicant_id = s.applicant_id AND f.screened_at = s.screened_at)</span>
<span class="st">SELECT a.applicant_id, a.sex, a.race, a.years_experience, a.education_level,</span>
<span class="st">       sc.screened_at, sc.score, sc.advanced,          -- the audited decision</span>
<span class="st">       o.outcome                                        -- NULL where still pending</span>
<span class="st">FROM applicants a</span>
<span class="st">JOIN scored sc   ON sc.applicant_id = a.applicant_id   -- only people the tool scored</span>
<span class="st">LEFT JOIN outcomes o ON o.applicant_id = a.applicant_id -- keep pending candidates</span>
<span class="st">WHERE sc.screened_at &gt;= '2025-01-01'                    -- the stated audit window</span>
<span class="st">  AND sc.screened_at &lt;  '2026-01-01';</span>
<span class="st">"""</span>)

<span class="cm"># one row per applicant now — prove it rather than assuming it</span>
<span class="kw">print</span>(q(<span class="st">"SELECT COUNT(*) AS rows, COUNT(DISTINCT applicant_id) AS ids FROM audit_population"</span>))

<span class="cm"># and pull it into pandas for the cross-check</span>
audit_df = q(<span class="st">"SELECT * FROM audit_population"</span>)
<span class="kw">print</span>(audit_df.shape)
audit_df.head()</code></pre>
<p>Read the four choices encoded in that view, because each one is a line in your scope section: the de-duplication rule (first screen), the restriction to scored candidates (inner join), the retention of pending candidates (left join), and the audit window (the WHERE clause). Change any one and you audit a different population. That is why the view is committed rather than retyped.</p>

<h3>Step 6 — Aggregate in SQL, then cross-check against pandas</h3>
<pre><code>sql_rates = q(<span class="st">"""</span>
<span class="st">SELECT sex, race, COUNT(*) AS n,</span>
<span class="st">       AVG(CASE WHEN advanced = 1 THEN 1.0 ELSE 0.0 END) AS selection_rate</span>
<span class="st">FROM audit_population</span>
<span class="st">WHERE sex IS NOT NULL AND race IS NOT NULL</span>
<span class="st">GROUP BY sex, race</span>
<span class="st">"""</span>)

pd_rates = (audit_df.dropna(subset=[<span class="st">"sex"</span>, <span class="st">"race"</span>])
            .groupby([<span class="st">"sex"</span>, <span class="st">"race"</span>])[<span class="st">"advanced"</span>]
            .agg(n=<span class="st">"size"</span>, selection_rate=<span class="st">"mean"</span>).reset_index())

pd.testing.assert_frame_equal(
    sql_rates.sort_values([<span class="st">"sex"</span>,<span class="st">"race"</span>]).reset_index(drop=<span class="kw">True</span>).round(6),
    pd_rates.sort_values([<span class="st">"sex"</span>,<span class="st">"race"</span>]).reset_index(drop=<span class="kw">True</span>).round(6))</code></pre>
<p>This is the step worth understanding properly. Two independent implementations of the same number, reconciled, is <strong>evidence integrity</strong> — the Day 1–2 testing logic applied to the data layer rather than the code layer. When they disagree, the cause is almost always one of three things, and each is an audit finding in its own right: NULL handling differs (SQL's <code>AVG</code> skips NULLs, pandas' <code>mean</code> skips NaN, but a NULL in the <em>outcome</em> column means something different from a zero), the join duplicated rows in one path, or the two used different filters. Find out which. Then save the query.</p>

<div class="box tmpl"><div class="bt">▤ The query is audit evidence — treat it that way</div><p>Commit the extraction SQL alongside the notebook, with a header comment recording what population it defines, the de-duplication rule, the date window, and the reconciliation counts. In your methodology section, state that the population was independently reconstructed in SQL and pandas and reconciled to the row.</p><p>Two reasons this matters beyond tidiness. An assessment can be re-run a year later against the same definition rather than a colleague's best reconstruction of it — which is what "reproducible" means once the analyst has moved on. And when someone disputes a number, the argument is about the <em>rule</em> ("you took the first screen, we take the last") rather than about arithmetic. That is a far better argument to be having, and you can only have it if the rule was written down.</p></div>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>Look at what the five steps actually produced. A defined population with a documented inclusion rule. A de-duplication decision with an owner. A row-count ladder where every exclusion is explained. A measured unknown-bucket skew. And a cross-checked aggregate. Those are the first five lines of a defensible scope section — and they are the questions an opposing expert asks first, because attacking the population is cheaper and more effective than attacking the statistics.</p><p>This is also the honest answer to a common interview question: <em>"Walk me through how you would start a bias audit."</em> Most candidates begin with impact ratios. Beginning with population construction and reconciliation says you have done this on real data, where the tables never line up.</p></div>

<div class="box tmpl"><div class="bt">▤ What was seeded — check your findings against ground truth</div><p>Because you generated this data, you can grade your own detection. Four defects were planted, each mapping to a step:</p>
<ul>
<li><strong>Duplicate keys</strong> — about 7% of candidates were re-scored after a CV update, so <code>screens</code> holds ~4,280 rows for 4,000 people. Step 1 should have shown <code>rows &gt; ids</code>; Step 2 should have listed roughly 280 candidates.</li>
<li><strong>Uneven missing demographics</strong> — around 5&ndash;6% of applicants self-reported no sex or race, but at roughly double the rate for one racial group. Your Step 4 skew check should have caught that the unknown bucket is not demographically neutral. This is the finding most audits miss, because 6% overall looks unremarkable.</li>
<li><strong>Pending outcomes</strong> — about 18% of advanced candidates have no decision yet, so <code>outcomes</code> is far smaller than the advanced population. Had your Step 3 join been an inner join, those candidates would have vanished from the audit entirely.</li>
<li><strong>A real disparity</strong> — the generator subtracts a fixed offset from one group's score. Your Step 6 impact ratio should come out at <strong>0.56</strong> — the seed is fixed, so everyone gets the same figure — well below the four-fifths screen.</li>
</ul>
<p>That last one repays a closer look, and it is why the number is worth computing rather than assuming. The seeded offset is <strong>0.06 on a 0&ndash;1 score</strong>. It produces selection rates of about <strong>21.9%</strong> and <strong>38.8%</strong> — a seventeen-point gap in outcomes, and an impact ratio of 0.56, from a six-point gap in scores. The amplification happens because the 0.60 cut-off sits in the dense middle of both distributions, where a modest shift moves a great many people across the line. That is Day 46's threshold-placement mechanism, seen in data whose ground truth you happen to know — and it is exactly why a disparity finding must be traced to a mechanism before anyone recommends a fix.</p></div>

<h2>Today's takeaway</h2>
<p>Scope first: the three-part AEDT test, jurisdiction following the candidate, and the one-year audit shelf life. Then categories: sex, race/ethnicity, intersections — with unknown-bucket disclosure and the 2% rule applied loudly, never silently — and an explicit note on what was left out. Data: real historical use, defined window, explicit outcome construction — and a population you assembled yourself in SQL, de-duplicated by a stated rule, reconciled row-by-row against pandas, with the query committed as evidence. Tomorrow: the computational core — selection rates and impact ratios, done to the letter.</p>
`,
quiz:{q:"A category comprises 1.4% of the audit data. What does LL144-style scoping do with it?",options:["It should be retained in the impact ratios, since excluding it would tend to understate disparity","It should usually be dropped from the published tables so unreliable estimates do not mislead readers","It may be excluded from the ratio calculations — but the exclusion and its size must both be disclosed","It should be merged into the largest adjacent category to produce a cell with a usable sample size"],answer:2,explain:"The rule acknowledges what Day 28 taught — thin cells yield unreliable ratios — while prohibiting the silent dropping that hides who wasn't assessed. Disclosure keeps the limitation visible and often generates a data-collection recommendation."}},

{n:44,title:"The Computational Core — Selection Rates and Impact Ratios",read:"Build Lab · 15 min read · ~2.5 hr lab",body:`
<p>Today you compute the numbers the law names. The mechanics are deliberately simple — that's what makes them enforceable — and your job is executing them <em>exactly</em>, then layering your statistical honesty on top.</p>

<h2>The three-step core</h2>
<pre><code><span class="cm"># 1. Selection rate per category</span>
rates = df.groupby(<span class="st">"category"</span>)[<span class="st">"selected"</span>].mean()

<span class="cm"># 2. Impact ratio: each category vs the MOST-selected category</span>
ratios = rates / rates.max()

<span class="cm"># 3. For scoring tools: scoring rate = share above the overall median score</span>
med = df[<span class="st">"score"</span>].median()
scoring_rates = df.assign(fav=df[<span class="st">"score"</span>] &gt; med).groupby(<span class="st">"category"</span>)[<span class="st">"fav"</span>].mean()
scoring_ratios = scoring_rates / scoring_rates.max()</code></pre>
<p>Run all three category structures from your scope block: sex, race/ethnicity, and the full intersection. Report, per category: <strong>n, selection (or scoring) rate, impact ratio</strong> — the exact table format the public summary requires. Note the denominator discipline: the comparator is the <em>most-selected category in this data</em>, not the majority group by assumption; sometimes they differ, and the law's construction handles it automatically.</p>


<h2>From three lines to the publishable table</h2>
<p>The three-step core gives you the numbers. The <em>table</em> the public summary requires carries n's alongside them, and your Day 4 upgrade attaches an interval to every ratio. Build it once as a function and reuse it across all three category structures:</p>
<pre><code><span class="kw">import</span> numpy <span class="kw">as</span> np, pandas <span class="kw">as</span> pd

<span class="cm"># --- the legally named core, for one category structure ---</span>
<span class="kw">def</span> <span class="fn">ll144_table</span>(df, cat_col, outcome_col=<span class="st">"selected"</span>, score_col=<span class="kw">None</span>):
    g = df.groupby(cat_col)
    <span class="kw">if</span> score_col <span class="kw">is</span> <span class="kw">None</span>:                       <span class="cm"># selection tool</span>
        rate = g[outcome_col].mean()
    <span class="kw">else</span>:                                        <span class="cm"># scoring tool: share above the OVERALL median</span>
        med  = df[score_col].median()
        rate = df.assign(fav=df[score_col] &gt; med).groupby(cat_col)[<span class="st">"fav"</span>].mean()
    out = pd.DataFrame({<span class="st">"n"</span>: g.size(), <span class="st">"rate"</span>: rate})
    out[<span class="st">"impact_ratio"</span>] = out[<span class="st">"rate"</span>] / out[<span class="st">"rate"</span>].max()
    <span class="kw">return</span> out.sort_values(<span class="st">"impact_ratio"</span>)

<span class="cm"># --- the 2% rule: excluded from the RATIOS, never from the report ---</span>
<span class="kw">def</span> <span class="fn">apply_two_percent_rule</span>(tbl, total_n):
    small = tbl[<span class="st">"n"</span>] / total_n &lt; 0.02
    kept  = tbl[~small].copy()
    kept[<span class="st">"impact_ratio"</span>] = kept[<span class="st">"rate"</span>] / kept[<span class="st">"rate"</span>].max()  <span class="cm"># recompute without thin cells</span>
    <span class="kw">return</span> kept, tbl[small]                      <span class="cm"># 2nd frame = your disclosure list</span>

<span class="cm"># --- bootstrap CI on each impact ratio (Days 3-4, now on the legal number) ---</span>
<span class="kw">def</span> <span class="fn">ratio_ci</span>(df, cat_col, outcome_col=<span class="st">"selected"</span>, B=2000, seed=0):
    rng, draws = np.random.default_rng(seed), []
    <span class="kw">for</span> _ <span class="kw">in</span> range(B):
        bs = df.sample(len(df), replace=<span class="kw">True</span>, random_state=rng.integers(1e9))
        r  = bs.groupby(cat_col)[outcome_col].mean()
        draws.append(r / r.max())
    D = pd.DataFrame(draws)
    <span class="kw">return</span> pd.DataFrame({<span class="st">"lo"</span>: D.quantile(.025), <span class="st">"hi"</span>: D.quantile(.975)})

<span class="cm"># --- run all three mandated structures ---</span>
df[<span class="st">"sex_race"</span>] = df[<span class="st">"sex"</span>].astype(str) + <span class="st">" / "</span> + df[<span class="st">"race"</span>].astype(str)
<span class="kw">for</span> dim <span class="kw">in</span> [<span class="st">"sex"</span>, <span class="st">"race"</span>, <span class="st">"sex_race"</span>]:
    tbl, excluded = apply_two_percent_rule(ll144_table(df, dim), len(df))
    tbl = tbl.join(ratio_ci(df, dim))
    tbl[<span class="st">"read"</span>] = np.where(tbl[<span class="st">"hi"</span>] &lt; .80, <span class="st">"below 0.80 (clear signal)"</span>,
                   np.where(tbl[<span class="st">"lo"</span>] &gt; .80, <span class="st">"clear of 0.80"</span>, <span class="st">"straddling (inconclusive)"</span>))
    print(dim, <span class="st">"| excluded under 2% rule:"</span>, list(excluded.index), list(excluded[<span class="st">"n"</span>]))
    print(tbl.round(3))</code></pre>
<p>Three details are load-bearing. The comparator is <strong>recomputed after exclusions</strong>, because dropping a thin category can change which category is most-selected. The excluded frame is <strong>returned rather than discarded</strong> — that frame <em>is</em> your disclosure. And the read column encodes the three-state judgment rather than a bare pass/fail, which lets a finding say &ldquo;inconclusive, and here is the sample size that made it so&rdquo; instead of manufacturing false comfort in either direction.</p>
<h2>Reading against the four-fifths signal</h2>
<div class="box wa"><div class="bt">■ This is not the ratio shape you learned in BTM</div><p>BTM Day 35 taught the fairness-literature convention: one scalar, <code>rates.min() / rates.max()</code> — worst-off group against best-off. That is still a serviceable screening number for a slide. <strong>LL144 wants a different shape.</strong> The statute requires an impact ratio <em>for every category</em>, each measured against the most-selected category: a row per group, not a single figure. Publish the scalar where the law wants the table and you have under-reported. From here on, &ldquo;impact ratio&rdquo; means a column; the scalar is at most a summary you compute <em>from</em> that column.</p></div>

<p>An impact ratio below <strong>0.80</strong> is the classic four-fifths screening signal for potential adverse impact. Note the source precisely, because it matters after 2025: the four-fifths convention comes from the <strong>Uniform Guidelines on Employee Selection Procedures</strong> (29 C.F.R. Part 1607), which remain in force irrespective of any agency's current enforcement posture (Day 42; BTM Day 35). Precision matters here, and it's a place your legal-technical fluency shows: LL144 itself mandates <em>computing and publishing</em> the ratios — it does not codify 0.80 as a pass/fail line, and DCWP's guidance sets no required action threshold. The four-fifths rule remains the interpretive convention everyone reads the table through. Your audit therefore reports the ratios, flags sub-0.80 values as adverse-impact signals under the conventional screen, and — your Day 4 upgrade — attaches bootstrap CIs so each flag reads as one of three defensible states: <em>entire interval below 0.80</em> (clear signal), <em>straddling</em> (inconclusive — investigate, often a sample-size finding), <em>clear of it</em> (no signal on this metric).</p>

<div class="box an"><div class="bt">◆ Analogy</div><p>A breathalyzer at a checkpoint: a simple, standardized number everyone computes the same way, with a conventional threshold that triggers investigation — not conviction. The reading isn't the whole case (calibration, circumstances, follow-up testing all matter), but its standardization is what makes enforcement possible at scale. Impact ratios are the breathalyzer of employment algorithms: deliberately simple, procedurally powerful, never the entire verdict.</p></div>

<div class="box wa"><div class="bt">■ What the core deliberately doesn't capture</div><p>Be able to say this in an interview: the impact-ratio table measures <em>outcome disparity at one decision point</em>. It does not measure error-rate fairness (a tool can pass ratios while wrongly rejecting one group's qualified candidates far more often — tomorrow's battery), calibration, stability, or anything about <em>why</em> disparity exists (Day 46). LL144's core is a floor, not a ceiling; your audit adds the ceiling.</p></div>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>This table is what gets <em>published</em> — on the employer's careers page, publicly, annually. Numbers you compute here face journalists, plaintiffs' attorneys, and competitors. That's the accountability design: sunlight on standardized figures. It's also why exactness matters — a miscomputed public table is a legal and reputational self-inflicted wound.</p></div>

<h2>Today's takeaway</h2>
<p>Rates → ratios vs. the most-selected category → median-based scoring rates for continuous tools; across all three category structures with n's; sub-0.80 flagged as the conventional screen with CIs deciding clear/straddling/inconclusive. Tomorrow: the error-rate battery the legal core omits.</p>
`,
