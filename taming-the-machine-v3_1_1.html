<p>Fraud is 1% of transactions; serious disease is rare; defaults are the minority. BTM Day 29 showed why accuracy lies on this data. Today: what modelers actually <em>do</em> about imbalance — and the governance questions each fix drags in behind it.</p>

<h2>The three families of fixes</h2>
<h3>1. Class weights — make rare errors cost more</h3>
<pre><code>model = XGBClassifier(scale_pos_weight=(n_negative / n_positive))
<span class="cm"># or in sklearn: class_weight='balanced'</span></code></pre>
<p>This edits the <strong>loss function</strong> (BTM Day 15) so missing a rare positive hurts the model more than a false alarm. Clean, simple, and — recognize it — an explicit encoding of "which error is worse," which is a <em>values</em> decision now living in a hyperparameter.</p>
<h3>2. Resampling — change what the model sees</h3>
<p><strong>Undersampling</strong> throws away majority rows; <strong>oversampling</strong> duplicates minority rows; <strong>SMOTE</strong> manufactures <em>synthetic</em> minority examples by interpolating between real ones. All rebalance the training diet. All must happen <strong>inside the training fold only</strong> — resample before splitting and you've built leakage (BTM Day 12: synthetic copies of a row land in both train and test, and your evaluation is fiction).</p>
<h3>3. Threshold moving — don't touch training at all</h3>
<p>Train on the real distribution, then lower the decision threshold to catch more positives (BTM Day 14). Often the most honest fix: the model's probabilities stay grounded in reality, and the tradeoff choice sits visibly in the threshold where it can be governed.</p>

<div class="box an"><div class="bt">◆ Analogy</div><p>A guard trained on a town where burglars are 1-in-100 learns to wave everyone through. Weights: pay them 100× for each burglar caught. Resampling: train them in a simulator where every second person is a burglar — effective, but their sense of how common burglars are is now fictional. Threshold moving: keep their judgment honest, just tell them to stop people at a lower level of suspicion. Each works; each changes something different — the incentives, the perceived world, or the policy.</p></div>

<div class="box wa"><div class="bt">■ SMOTE's quiet risks</div><p>Synthetic minority examples are interpolations — plausible-looking people who don't exist. Two audit angles: first, models trained on resampled data output <strong>distorted probabilities</strong> (the base rate they learned is fake), so calibration repair (tomorrow) becomes mandatory before any threshold means what it says. Second, SMOTE interpolates within the minority class as sampled — if the sampled minority is itself unrepresentative, SMOTE manufactures more of the same skew, with synthetic confidence. Always ask: <em>resampled how, inside or outside the folds, and was calibration re-checked after?</em></p></div>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>Imbalance handling is a values decision wearing a preprocessing costume: weights encode error costs; resampling encodes them implicitly while distorting probabilities; thresholds encode them transparently. Your assessment question is not "did you handle imbalance?" but "<em>which mechanism, chosen by whom, with what effect on calibration and on each group's error mix?</em>" — because rare-event models are precisely where base-rate math (BTM Day 30) makes error distribution a human-impact question.</p></div>

<h2>Today's takeaway</h2>
<p>Weights re-price errors, resampling re-diets the model (folds only! calibration damaged!), threshold moving keeps probabilities honest and puts the tradeoff where governance can see it. Tomorrow: repairing calibration — because after today's techniques, the probabilities usually need it.</p>
`,
quiz:{q:"A team applies SMOTE to the full dataset, then splits into train/test, and reports excellent recall. What two problems do you flag?",options:["SMOTE is prohibited in regulated industries, and recall is the wrong headline metric for an imbalanced problem","Only that undersampling would have been the better choice for a dataset with this degree of class imbalance","Leakage — synthetic near-copies sit in both partitions — plus distorted probabilities from a fake base rate","Nothing: resampling before the split is standard practice, since both partitions then share one distribution"],answer:2,explain:"Resampling before the split contaminates the test set with interpolations of training rows (evaluation fiction), and any resampling teaches the model a false prevalence, so its output probabilities — and every threshold set on them — are distorted until recalibrated."}},

{n:13,title:"Calibration Repair — Platt and Isotonic",read:"Lesson · 14 min read",body:`
<p>Two days running you've heard "and then calibration breaks." Today, the repair shop. When a model's probabilities are dishonest — from boosting's quirks, from resampling, from the model family itself — you can <strong>recalibrate</strong> them without retraining the model.</p>

<h2>The move: learn a correction curve</h2>
<p>Recalibration fits a small second model that maps <em>raw score → honest probability</em>, learned on held-out data (never the training set — the corrector must see the model's real-world behavior, not its memorized one). Two standard flavors:</p>
<ul>
<li><strong>Platt scaling</strong> — fits a sigmoid to the mapping. Smooth, needs little data, assumes the distortion has a simple S-shape.</li>
<li><strong>Isotonic regression</strong> — fits a flexible, order-preserving staircase. Fixes weirder distortions, needs more data, can overfit small samples.</li>
</ul>
<pre><code><span class="kw">from</span> sklearn.calibration <span class="kw">import</span> CalibratedClassifierCV
cal = CalibratedClassifierCV(model, method=<span class="st">"isotonic"</span>, cv=5)
cal.fit(X_train, y_train)          <span class="cm"># internal folds keep it honest</span>
probs = cal.predict_proba(X_test)[:, 1]
<span class="cm"># now re-draw the Day 8 reliability curve: points should hug the diagonal</span></code></pre>
<div class="box wa"><div class="bt">■ Read that call carefully — <code>cal</code> is not <code>model</code></div><p>Passing an already-fitted <code>model</code> with <code>cv=5</code> does <strong>not</strong> calibrate that fitted object. Scikit-learn <em>clones</em> the estimator and refits five fresh copies on internal folds; your original <code>model</code> comes back untouched, coefficients and all. The artifact that goes to production, into the model card, and into the audit evidence is <code>cal</code> — the wrapper. (If you must calibrate a frozen estimator you genuinely cannot refit — a vendor model, an expensive training run — that is the <code>FrozenEstimator</code> pattern in current scikit-learn; the old <code>cv="prefit"</code> argument is deprecated.) Either way, <strong>name in your methodology which object was evaluated</strong>, because &ldquo;we calibrated the model&rdquo; is ambiguous in exactly the way an opposing expert enjoys.</p></div>

<p>The before/after reliability-curve pair (Day 8) is the proof artifact: sagging curve → repaired diagonal. Note what recalibration changes and what it doesn't: probabilities become honest, but the <em>ranking</em> of individuals is preserved (isotonic is order-preserving) — it fixes what the numbers mean, not who scores above whom.</p>

<div class="box an"><div class="bt">◆ Analogy</div><p>A bathroom scale that consistently reads 4 kg heavy doesn't need to be rebuilt — it needs a correction curve taped to the wall. Platt tapes up a smooth formula; isotonic tapes up a lookup table. Either way, you calibrated the instrument against known weights (held-out data) rather than trusting the factory dial. Decisions made on the corrected reading are now decisions about reality.</p></div>

<div class="box wa"><div class="bt">■ Calibrate per group — or verify after</div><p>Day 8's fairness lens applies to the repair: a single global recalibration can fix the majority's curve while leaving a subgroup's probabilities still skewed (their distortion had a different shape). After any recalibration, re-run the <strong>reliability curve by group</strong> from your audit module (Brier alone will not settle it — Day 8&rsquo;s confound). If honesty was restored for some groups and not others, the same threshold still applies different real standards — the repair itself needs a fairness check. Almost nobody does this; you will.</p></div>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>In your Phase 4 assessment, "were output probabilities recalibrated after resampling, and verified per group?" is a MEASURE-function checklist line that instantly separates rigorous teams from cargo-cult ones. And the before/after reliability pair is exactly the kind of visual evidence an executive summary can carry — a finding, its fix, and its proof in one image.</p></div>

<h2>Today's takeaway</h2>
<p>Platt (sigmoid) and isotonic (staircase) recalibrate probabilities on held-out data, preserving rankings while restoring honesty — then verify per group. Tomorrow: SHAP in anger — global and local explanation of your boosted model.</p>
`,
quiz:{q:"After isotonic recalibration, aggregate Brier improves from 0.19 to 0.13, but Brier-by-group shows one subgroup unchanged at 0.22. What happened?",options:["Recalibration failed and must be rerun with Platt scaling, which handles subgroup distortions more reliably","Brier scores are aggregate measures and cannot be validly decomposed to the level of individual subgroups","The global curve fixed the majority-shaped distortion; that subgroup's had a different shape and stays dishonest","Nothing of concern: aggregate improvement is the objective, and subgroup variation around it is expected"],answer:2,explain:"One global corrector learns one mapping, dominated by the majority's distortion pattern. A subgroup whose miscalibration differs stays skewed — which is why the repair itself gets the per-group verification, exactly the audit habit this course exists to build."}},

{n:14,title:"SHAP in Anger — Global and Local Explanation",read:"Lab · 12 min read · ~1.5 hr lab",body:`
<p>Day 9 gave you the Shapley math. Today you point the library at your Day 11 XGBoost model and extract the two artifacts every model review now expects: the <strong>global</strong> picture (what drives this model overall) and the <strong>local</strong> one (why this person got this decision).</p>

<h2>Running it</h2>
<pre><code>!pip -q install shap
<span class="kw">import</span> shap
explainer = shap.TreeExplainer(model)          <span class="cm"># exact for tree ensembles</span>
sv = explainer.shap_values(X_test)

shap.summary_plot(sv, X_test)                  <span class="cm"># GLOBAL: the beeswarm</span>
shap.plots.waterfall(explainer(X_test)[7])     <span class="cm"># LOCAL: one person's decision</span></code></pre>

<h2>Reading the beeswarm like an auditor</h2>
<p>The summary plot ranks features by total impact; each dot is one person, position = push on the score, color = feature value. Three trained reads:</p>
<ul>
<li><strong>Top-of-chart proxies.</strong> If <code>zip_code</code> or an engineered proxy (BTM Day 21) ranks high, the model's decisions are <em>organized around</em> it — the BTM Day 19 top-split finding, generalized to ensembles.</li>
<li><strong>Direction sanity.</strong> Color-vs-position shows the learned relationship. Higher income pushing toward denial? Either a data problem, an interaction artifact, or a genuine discovery — all three demand explanation before deployment.</li>
<li><strong>Spread.</strong> A feature with wide two-sided spread affects people heterogeneously (interactions at work); tight one-sided spread acts like a consistent rule.</li>
</ul>

<h2>The waterfall: adverse action, visualized</h2>
<p>The local waterfall starts at the average prediction and stacks each feature's push for <em>this individual</em>, landing exactly on their score (Day 9's sum-to-total property). This is the technical substrate of an <strong>adverse-action explanation</strong>: "the largest contributors to this denial were X, Y, Z." It's also where you check <em>consistency of reasons</em> — do denials in different groups ride on different features? Systematically different explanation profiles across groups is a subtle bias finding most audits never look for.</p>

<div class="box an"><div class="bt">◆ Analogy</div><p>The beeswarm is the restaurant's ingredient-usage report — what the kitchen leans on across all dishes. The waterfall is one plate's recipe card. A health inspector needs both: the pantry tells you the kitchen's habits; the plate tells you what this customer was actually served. And if plates going to one table consistently carry a different ingredient profile, you've found something the aggregate report hid.</p></div>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>Both artifacts go in your Phase 4 assessment's explainability section — with Day 9's caveats attached in the methodology: attribution not causation, TreeExplainer exact for trees, background-data choice stated. And BTM Day 46's discipline gets operational: pick two or three top SHAP features and <em>perturb them</em> — if the prediction barely moves, the explanation is a story, and that goes in the findings, not the appendix.</p></div>

<div class="box wa"><div class="bt">■ &ldquo;Adverse action&rdquo; is not a metaphor — it is a statutory duty</div><p>The waterfall has a legal counterpart worth naming, because it turns an explainability nicety into a deliverable somebody is <em>required</em> to produce. Under the <strong>Equal Credit Opportunity Act</strong> and <strong>Regulation B</strong>, a creditor who denies credit or worsens its terms must give the applicant the <strong>specific principal reasons</strong> — not a generic notice, not &ldquo;you did not meet our criteria.&rdquo; The CFPB's position is that this holds even when the underlying model is complex: an institution that cannot explain a decision may not use the model to make it. A per-applicant attribution exactly like this waterfall is how the duty gets satisfied in practice.</p><p>Two consequences. For anyone heading toward <strong>fair-lending model validation</strong>, generating and sanity-checking reason codes is core work. For a bias auditor, this is the cleanest available case that explainability carries legal teeth somewhere — and a good answer to &ldquo;why should we invest in SHAP?&rdquo; One warning: reason codes must be <em>accurate</em>, not merely plausible. A code produced by a different mechanism than the one that actually drove the decision is a compliance failure with an impressive plot attached.</p></div>

<h2>Today's takeaway</h2>
<p>Beeswarm = global reliance map (hunt proxies, check directions); waterfall = individual decision accounting (adverse-action substrate; compare explanation profiles across groups); verify explanations by perturbation. Tomorrow: the model-agnostic cross-checks — permutation importance and partial dependence.</p>
`,
quiz:{q:"Comparing SHAP waterfalls, denials for one demographic group consistently ride on different top features than denials for another. Why is this a finding?",options:["Waterfalls should be identical across individuals, so any variation indicates the explainer is misconfigured","It means SHAP's background dataset was drawn from one group, invalidating the attributions for the other","It matters only when the driving features are numeric, since categorical attributions are not comparable","It is evidence the model reasons differently about each group — a disparity in mechanism that rate metrics miss"],answer:3,explain:"Systematically different explanation profiles mean the model's internal pathway to 'deny' differs by group — possibly proxy-driven — even when headline rates look similar. Comparing local-explanation distributions across groups is an advanced audit move that finds what rate metrics hide."}},

{n:15,title:"Permutation Importance & Partial Dependence",read:"Lesson · 15 min read",body:`
<p>SHAP is powerful but it's one lens, with assumptions. Professional practice triangulates. Today: two model-agnostic instruments that cross-check the SHAP story — <strong>permutation importance</strong> (what the model needs) and <strong>partial dependence</strong> (how a feature shapes the prediction).</p>

<h2>Permutation importance: break it and see</h2>
<p>Shuffle one feature's column in the test set — destroying its information while keeping its distribution — and measure how much performance drops. Big drop: the model was leaning on it. No drop: decorative.</p>
<pre><code><span class="kw">from</span> sklearn.inspection <span class="kw">import</span> permutation_importance
r = permutation_importance(model, X_test, y_test, n_repeats=20, random_state=0)
<span class="kw">for</span> i <span class="kw">in</span> r.importances_mean.argsort()[::-1][:10]:
    <span class="kw">print</span>(X_test.columns[i], round(r.importances_mean[i], 4))</code></pre>
<p>Its blunt honesty is the appeal: no attribution theory, just "remove the signal, watch the damage." One caveat to carry: with strongly <em>correlated</em> features, shuffling one lets its twin cover for it, understating both — so read correlated clusters together.</p>

<h2>Partial dependence: the shape of the relationship</h2>
<p>A <strong>partial dependence plot</strong> (PDP) sweeps one feature across its range, holding the dataset otherwise fixed, and plots the average prediction — revealing the learned curve:</p>
<pre><code><span class="kw">from</span> sklearn.inspection <span class="kw">import</span> PartialDependenceDisplay
PartialDependenceDisplay.from_estimator(model, X_test, [<span class="st">"age"</span>, <span class="st">"income"</span>])</code></pre>
<p>Auditor's reads: <strong>cliffs</strong> (a sudden jump at age 40 — a learned de-facto cutoff no one approved), <strong>non-monotonicity</strong> (risk falling then rising with income — interrogate it), and <strong>flat lines</strong> (the model ignores what the business swears is decisive — someone's mental model is wrong, and it matters which).</p>

<div class="box an"><div class="bt">◆ Analogy</div><p>Three witnesses to the same model: SHAP is the accountant allocating credit; permutation importance is the stress-tester unplugging components to see what fails; PDP is the cartographer drawing the terrain one axis at a time. When all three agree, you can write the finding in ink. When they disagree — SHAP says a feature matters, permutation says it doesn't — that's usually correlation cover or an interaction, and the <em>disagreement itself</em> is the lead worth chasing.</p></div>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>Triangulation is what turns "the model relies on X" from a tool's opinion into a defended finding: <em>"X ranks top-3 by SHAP and permutation importance, and its PDP shows a 15-point cliff at the group boundary."</em> That sentence survives cross-examination. Single-tool findings often don't — and your assessments should say, in methodology, that explanation claims were triangulated. It's a one-line sentence that signals a different league of rigor.</p></div>

<h2>Today's takeaway</h2>
<p>Permutation importance measures need-by-destruction (mind correlated twins); PDPs reveal learned shapes (cliffs, reversals, flat lines); triangulate with SHAP and chase disagreements. Tomorrow: putting error bars on individual predictions — uncertainty quantification.</p>
`,
quiz:{q:"SHAP ranks feature X highly, but permutation importance shows almost no performance drop when X is shuffled. What's the most likely explanation and the right move?",options:["SHAP is simply wrong about X, and permutation importance should be treated as the authoritative ranking","X is correlated with a feature that covers for it when shuffled, or an interaction is at play — check the cluster","Permutation importance is invalid on tree ensembles, which is why the two methods disagree so sharply here","The test set is too large for shuffling to register, so the permutation result reflects a sample-size artifact"],answer:1,explain:"Correlated features are each other's understudies: destroy one and the twin carries the signal, deflating permutation scores. Triangulation's value is exactly here — tool disagreement flags redundancy or interaction structure that a single lens would have misreported."}},

{n:16,title:"Uncertainty Quantification — Knowing What the Model Doesn't Know",read:"Lesson · 15 min read",body:`
<p>A prediction without an uncertainty estimate is a number wearing a costume of confidence. You've put error bars on <em>audit metrics</em> (Days 3–4). Today: error bars on the <em>predictions themselves</em> — and why the people with the widest bars are a governance population of their own.</p>

<h2>Three practical routes</h2>
<ul>
<li><strong>Calibrated probabilities as uncertainty.</strong> After Day 13's repair, a 0.51 <em>is</em> a confession of near-total uncertainty. Simplest move: define an "abstain band" (say 0.4–0.6) where the model's answer is officially "I don't know."</li>
<li><strong>Ensemble disagreement.</strong> Train several models (different seeds/samples); where they disagree on a case, the case is genuinely hard. Disagreement rate is a per-person uncertainty score you can compute with tools you already have.</li>
<li><strong>Conformal prediction (the idea).</strong> A modern method with a remarkable guarantee: using a held-out calibration set, it produces prediction <em>sets</em> ("this case: {approve} " vs "this case: {approve, deny}") that provably contain the truth at your chosen rate (e.g., 90%) — with almost no assumptions about the model. Multi-option sets are the model formally flagging its own unsure cases.</li>
</ul>
<pre><code><span class="cm"># ensemble disagreement in six lines</span>
preds = np.stack([XGBClassifier(random_state=s).fit(X_train, y_train)
                    .predict(X_test) <span class="kw">for</span> s <span class="kw">in</span> range(7)])
disagreement = preds.std(axis=0)          <span class="cm"># 0 = unanimous, high = contested</span>
hard_cases = X_test[disagreement > 0.3]</code></pre>

<div class="box an"><div class="bt">◆ Analogy</div><p>Ask seven doctors for a diagnosis. When all seven agree, act. When they split 4–3, the correct clinical response is not "majority rules, case closed" — it's more tests, senior review, human judgment. Ensemble disagreement finds the 4–3 patients. A deployment that treats unanimous and contested cases identically is discarding the most decision-relevant information the system produces.</p></div>

<div class="box wa"><div class="bt">■ Where the uncertainty pools</div><p>Run the by-now-reflexive move: uncertainty <em>per group</em>. Data-thin populations (BTM Day 17) get wider intervals, more disagreement, more multi-option conformal sets — the model is systematically less sure about exactly the people it saw least. If confident and uncertain cases receive identical treatment, that unequal reliability is silently converted into unequal error. If instead uncertain cases route to humans — is the human review equally careful for everyone? Uncertainty handling has its own fairness surface.</p></div>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>"What does the system do when it isn't sure?" is one of the highest-yield questions in any model review — and human-oversight mandates (EU AI Act; ISO 42001's oversight controls) are hollow unless <em>unsure</em> is operationally defined. An abstain band, a disagreement threshold, or conformal set size gives the mandate teeth: a measurable trigger, a routing rule, a logged outcome. Your Phase 4 assessment will require exactly that specification.</p></div>

<h2>Today's takeaway</h2>
<p>Calibrated abstain bands, ensemble disagreement, and conformal sets each operationally define "the model isn't sure"; uncertainty pools in data-thin groups; human-oversight requirements only bite when tied to such a trigger. Tomorrow: you fine-tune a transformer — on free Colab.</p>
`,
quiz:{q:"Why is 'what does the system do when it isn't sure?' a governance question rather than just an engineering one?",options:["Because oversight mandates are hollow without a trigger, and uncertainty pools in data-thin groups","Because predictions made under high uncertainty are wrong often enough to be excluded from deployment entirely","Because uncertainty is a property of neural networks specifically, and governance covers deep learning systems","Because regulators require that cases the model is unsure about be deleted from the record before review"],answer:0,explain:"Oversight requirements need a measurable trigger to be real, and unequal certainty across groups means the routing rule decides who gets careful human judgment versus silent machine error. Defining and auditing that trigger is governance work with math inside."}},

{n:17,title:"Fine-Tuning a Transformer on Free Colab",read:"Lab · 14 min read · ~2.5 hr lab (Colab runtime included)",body:`
<p>Today the claim "I've worked with transformers" becomes literally true. You'll fine-tune <strong>DistilBERT</strong> — a compact BERT-family language model — on a text-classification task, on a free Colab GPU, in about fifteen minutes of training. This is BTM Day 47's transfer learning, done with your own hands.</p>

<h2>The setup</h2>
<p>In Colab: <em>Runtime → Change runtime type → T4 GPU</em> (free tier includes limited GPU time). Then:</p>
<pre><code>!pip -q install transformers datasets accelerate
<span class="kw">from</span> datasets <span class="kw">import</span> load_dataset
<span class="kw">from</span> transformers <span class="kw">import</span> (AutoTokenizer, AutoModelForSequenceClassification,
                          TrainingArguments, Trainer)

ds = load_dataset(<span class="st">"imdb"</span>)                       <span class="cm"># movie-review sentiment</span>
tok = AutoTokenizer.from_pretrained(<span class="st">"distilbert-base-uncased"</span>)
<span class="kw">def</span> <span class="fn">enc</span>(b): <span class="kw">return</span> tok(b[<span class="st">"text"</span>], truncation=<span class="kw">True</span>, padding=<span class="st">"max_length"</span>, max_length=256)
ds = ds.map(enc, batched=<span class="kw">True</span>)
train = ds[<span class="st">"train"</span>].shuffle(seed=42).select(range(3000))   <span class="cm"># sampled for free tier</span>
test  = ds[<span class="st">"test"</span>].shuffle(seed=42).select(range(1000))

model = AutoModelForSequenceClassification.from_pretrained(
            <span class="st">"distilbert-base-uncased"</span>, num_labels=2)
args = TrainingArguments(<span class="st">"out"</span>, num_train_epochs=1, per_device_train_batch_size=16,
                         eval_strategy=<span class="st">"epoch"</span>, report_to=<span class="st">"none"</span>)
Trainer(model=model, args=args, train_dataset=train, eval_dataset=test).train()</code></pre>
<p>Read what happened through BTM's concepts: a model <strong>pretrained</strong> on massive text (BTM Day 51's stage 1) had a small classification head attached, and your 3,000 examples nudged its millions of weights — via the same gradient descent and backprop as ever — toward your task. You inherited its language ability. You also inherited everything else in it.</p>

<div class="box an"><div class="bt">◆ Analogy</div><p>You didn't teach anyone to read. You hired a fluent reader with years of unknown education and gave them one afternoon of instructions for <em>your</em> filing task. They'll file brilliantly — using every habit, assumption, and prejudice their prior education instilled, none of which appeared in your afternoon of training data. Fine-tuning is hiring, not raising (BTM Day 47) — and today you felt how little of the final system your own data actually is.</p></div>

<div class="box wa"><div class="bt">■ Free-tier realism</div><p>The constraints you just navigated — sampled data, one epoch, truncated sequences, a distilled model — are real methodology limitations, and the professional move is to <em>state them</em>, not hide them: "evaluated on a 1,000-example sample; sequences truncated at 256 tokens; single epoch." Every real assessment has resource constraints. Credibility comes from disclosing their impact, and truncation itself has one: whose text gets cut at 256 tokens more often? (Recall BTM Day 50 — tokenization is not neutral across language styles.)</p></div>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>You now hold a fine-tuned language model that <em>you</em> shaped but mostly did not build — the exact artifact your future employers deploy by the dozen. Tomorrow you audit it: performance, and then the bias it imported from a pretraining corpus you never saw. That two-day arc — build it, then find what it smuggled in — is the whole supply-chain governance problem in miniature, performed rather than described.</p></div>

<h2>Today's takeaway</h2>
<p>You fine-tuned a real transformer on free hardware: pretrained weights + small head + your data + honest disclosure of the constraints. Tomorrow: auditing it — including counterfactual bias probes against the model you just made.</p>
`,
quiz:{q:"After fine-tuning DistilBERT on 3,000 of your own labeled examples, what fraction of the deployed system's behavior did your data actually determine?",options:["All of it: fine-tuning updates every weight, so the resulting behavior is determined by your labeled examples","A last-mile adjustment: the bulk of its language behavior and biases came from a corpus you never inspected","Roughly half, since the pretrained encoder and your task head contribute comparably to the final prediction","None of it: fine-tuning adapts the tokenizer and output head while leaving the model's behavior unchanged"],answer:1,explain:"Fine-tuning nudges pretrained weights toward a task; the model's linguistic world — and its imported stereotypes — remain products of pretraining. Your data is the afternoon of instructions, not the education, which is why tomorrow's bias probe of your own model matters."}},
{n:18,title:"Auditing Your Transformer — Performance and Imported Bias",read:"Lab · 12 min read · ~1.5 hr lab",body:`
<p>Yesterday you built it. Today you put your own model on the examination table — the full battery from your audit module, plus the counterfactual probing that text models demand (BTM Days 55–56, now aimed at a model with your name on it).</p>

<h2>Step 1 — The standard battery still applies</h2>
<p>A fine-tuned transformer is still a classifier. Confusion matrix, precision/recall, calibration curve — all of it runs on its predictions exactly as before. Text models don't get a pass on tabular-era rigor; run <code>ModelAuditor</code> the moment you have predictions and labels.</p>

<h2>Step 2 — Counterfactual probes on your own model</h2>
<p>The text-specific move: feed <strong>minimal pairs</strong> — identical sentences differing only in a demographic signal — and measure the score shift:</p>
<pre><code><span class="kw">import</span> torch
<span class="kw">def</span> <span class="fn">score</span>(text):
    x = tok(text, return_tensors=<span class="st">"pt"</span>, truncation=<span class="kw">True</span>).to(model.device)
    <span class="kw">with</span> torch.no_grad():
        <span class="kw">return</span> torch.softmax(model(**x).logits, -1)[0, 1].item()

pairs = [(<span class="st">"My brother said this film was fantastic."</span>,
          <span class="st">"My sister said this film was fantastic."</span>),
         (<span class="st">"Jamal's review: a stunning achievement."</span>,
          <span class="st">"Connor's review: a stunning achievement."</span>)]
<span class="kw">for</span> a, b <span class="kw">in</span> pairs:
    <span class="kw">print</span>(round(score(a) - score(b), 4), <span class="st">"|"</span>, a[:34])</code></pre>
<p>Build 30–50 template pairs across gendered terms and name sets, and analyze the <em>distribution</em> of shifts with Phase 1 statistics: mean shift, bootstrap CI, and the honest power note when templates are few. A mean shift whose CI excludes zero is imported bias, measured — in a model whose fine-tuning data (movie reviews!) contained nothing about names at all. The prejudice came with the pretraining (Day 17's point, now demonstrated on your own artifact).</p>

<div class="box an"><div class="bt">◆ Analogy</div><p>You hired the fluent reader yesterday; today you hand them two identical résumés with different names at the top and time their reactions. Any consistent difference cannot have come from your afternoon of filing instructions — it walked in the door with them. That's what makes this probe so clean as evidence: your fine-tuning data is the control, and it's innocent.</p></div>

<div class="box wa"><div class="bt">■ Interpret like a professional</div><p>Everything from Day 5 applies: small template sets are underpowered; single runs vary; a shift of 0.002 with a CI spanning zero is not a finding. Report the magnitude, the interval, the template count, and the limitation ("probes cover binary gendered terms and two name sets; broader coverage needed"). A modest, precisely-stated finding beats a dramatic, indefensible one in every venue you'll ever present to.</p></div>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>You've now personally performed the core evidence-gathering act behind LLM bias sections in real assessments: minimal-pair counterfactual evaluation with uncertainty quantification. When Phase 5's bias assessment reaches text systems, this lab is the methodology you'll cite — and in interviews, "I fine-tuned a transformer and then demonstrated its imported name bias with bootstrapped counterfactual probes" is a sentence very few candidates can truthfully say.</p></div>

<h2>Today's takeaway</h2>
<p>Standard battery first (it's still a classifier), then minimal-pair probes with full Phase 1 statistics — the imported bias reveals itself against your innocent fine-tuning data. Tomorrow: running small open LLMs on the free tier, and what governance can measure there.</p>
`,
quiz:{q:"Your name-swap probes show a consistent score shift (CI excluding zero), yet your fine-tuning data was movie reviews with no name-outcome pattern. What does this establish?",options:["The probe is invalid, because movie reviews contain names and therefore confound the manipulated variable","The bias was imported from pretraining — the innocent fine-tuning data acts as a control isolating the source","Fine-tuning corrupted the tokenizer, causing different name tokens to be encoded at inconsistent lengths","The labels are unreliable and the dataset must be re-annotated before any counterfactual claim can be made"],answer:1,explain:"With no name signal in your task data, a systematic counterfactual shift can only have come from the pretrained weights — a clean demonstration of BTM Day 47's inheritance risk, measured with Day 3–5 statistics on a model you built yourself."}},

{n:19,title:"Small Open LLMs on Free Colab",read:"Lab · 12 min read · ~2 hr lab (Colab runtime included)",body:`
<p>Classification transformers are half the modern landscape; <em>generative</em> LLMs are the other half. You can run genuinely capable small open models — 1–4B parameters — on a free Colab GPU, which means you can <strong>evaluate</strong> them yourself instead of taking any vendor's word. Today: standing one up and making it produce evidence.</p>

<h2>Running a small instruct model</h2>
<pre><code>!pip -q install transformers accelerate
<span class="kw">from</span> transformers <span class="kw">import</span> pipeline
<span class="kw">import</span> torch

gen = pipeline(<span class="st">"text-generation"</span>,
               model=<span class="st">"Qwen/Qwen2.5-1.5B-Instruct"</span>,   <span class="cm"># ~1.5B params, T4-friendly</span>
               torch_dtype=torch.float16, device_map=<span class="st">"auto"</span>)

out = gen([{<span class="st">"role"</span>:<span class="st">"user"</span>,
            <span class="st">"content"</span>:<span class="st">"Write a one-sentence professional summary of a candidate named Aisha for a leadership role."</span>}],
          max_new_tokens=60, do_sample=<span class="kw">False</span>)
<span class="kw">print</span>(out[0][<span class="st">"generated_text"</span>][-1][<span class="st">"content"</span>])</code></pre>
<p>Two settings carry governance weight. <code>do_sample=False</code> makes generation <strong>deterministic</strong> (greedy decoding) — essential for reproducible probes; sampling (with a <code>temperature</code>) makes outputs vary run-to-run, so sampled evaluations need <em>many</em> runs and distributional analysis. And <code>float16</code> halves memory: your first taste of the quantization family — compressing weights to fit models on small hardware, at some quality cost that itself deserves evaluation.</p>

<h2>Turning generation into measurements</h2>
<p>Generative output is open-ended (BTM Day 54's core difficulty), so evaluation means <em>designing measurable probes</em>: run the BTM Day 56 name-template harness against this model, scoring generated summaries for length, sentiment, and hedging language per name group; test refusal consistency across framings; test factual questions where the truth is checkable. Small models hallucinate and drift readily — which makes them ideal training partners, because the failure modes you'll assess professionally appear on demand.</p>

<div class="box an"><div class="bt">◆ Analogy</div><p>Flight schools don't train pilots in calm weather only — simulators exist to make the engine fail on purpose. A 1.5B model on a free GPU is your simulator: every LLM failure mode — hallucination, name bias, inconsistent refusals, prompt-injection compliance — reproduces readily, cheaply, and under your full control. The frontier models fail more subtly; the <em>evaluation craft</em> transfers directly.</p></div>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>Independent verification is the theme: an assessor who can only read vendor eval reports is reviewing homework they can't check. You can now stand up an open model, run reproducible probes (deterministic decoding, seeded harnesses, stated sample sizes), and produce first-hand evidence. That capability is precisely what "technical AI governance" job postings mean by hands-on evaluation experience — and it cost you nothing but a Colab session.</p></div>

<h2>Today's takeaway</h2>
<p>Small instruct models run on free GPUs; deterministic decoding makes probes reproducible; evaluation means designing measurable probes against open-ended output. Tomorrow: adversarial stress-testing — attacking models on purpose to find the failure before the world does.</p>
`,
quiz:{q:"Why does do_sample=False (deterministic decoding) matter when running bias probes against a generative model?",options:["It makes generations more varied, which widens probe coverage across the model's plausible output space","It lowers GPU memory below what float16 requires, which is what makes probing viable on free-tier hardware","Reproducibility: identical prompts give identical outputs, so differences trace to the manipulation","Sampled generation is disallowed in formal audits, so deterministic decoding is the only compliant setting"],answer:2,explain:"Deterministic generation removes run-to-run randomness, isolating your manipulated variable (e.g., the name) as the cause of output differences. Sampled generation isn't wrong — but it demands repeated runs and statistics over the output distribution, a heavier design."}},

{n:20,title:"Adversarial Stress-Testing — Attack Before the World Does",read:"Lesson · 16 min read",body:`
<p>Every evaluation so far asked "how does the model do on ordinary cases?" Adversaries don't send ordinary cases. Today: <strong>stress-testing</strong> — deliberately probing the model's breaking points, because the gap between average-case and worst-case behavior is where deployed systems get burned.</p>

<h2>The stress-test menu</h2>
<ul>
<li><strong>Perturbation robustness (tabular).</strong> Nudge inputs by realistic amounts — income ±2%, one month's age — and watch decisions. A model that flips approve→deny on a $40 income change has a cliff (Day 15's PDP finding, now weaponized): unstable, gameable, and indefensible to the applicant standing on it.</li>
<li><strong>Strategic gaming.</strong> Ask: which features can an applicant <em>cheaply manipulate</em>? If SHAP says a self-reported field drives approvals, you've found the fraud vector. Feature importance doubles as an attack map.</li>
<li><strong>Edge-case sweeps.</strong> Boundary values, rare combinations, out-of-range inputs, missing-everything rows. The model will produce an answer for all of them — confidence included. It shouldn't always.</li>
<li><strong>LLM red-team probes.</strong> Injection strings in documents (BTM Day 52), jailbreak framings, adversarial suffixes, encoding tricks. Yesterday's small model will fail several within the hour — catalogue how.</li>
</ul>
<pre><code><span class="cm"># decision-flip scan: who sits on a cliff?</span>
X_pert = X_test.copy()
X_pert[<span class="st">"income"</span>] *= 1.02                       <span class="cm"># a 2% nudge</span>
flips = model.predict(X_test) != model.predict(X_pert)
<span class="kw">print</span>(f<span class="st">"decision flips on a 2% income change: {flips.mean():.1%}"</span>)
<span class="cm"># then, reflexively: flips.groupby(groups).mean() — whose decisions are fragile?</span></code></pre>

<div class="box an"><div class="bt">◆ Analogy</div><p>Crash-testing. No manufacturer certifies a car because it drives well on smooth roads in daylight — they ram it into walls, roll it, freeze it, and publish which speeds break which parts. Average-case evaluation is the test drive; stress-testing is the crash lab. A model review without one has certified the smooth-road behavior of a system that will meet walls.</p></div>

<h2>Sensitivity analysis — the other half of the pair</h2>
<p>Stress-testing and sensitivity analysis get conflated constantly, and validators are paid to keep them apart. <strong>Adversarial stress-testing perturbs inputs to find failures.</strong> <strong>Sensitivity analysis perturbs assumptions and parameters to map how stable the output is.</strong> The first hunts for a breaking point; the second draws the terrain around where you are standing. A validation report wants both, and running only the first is a finding against your own work.</p>
<pre><code><span class="cm"># --- SENSITIVITY: how far does the output move when an assumption moves? ---</span>
<span class="kw">import</span> numpy <span class="kw">as</span> np, pandas <span class="kw">as</span> pd

<span class="kw">def</span> <span class="fn">threshold_sensitivity</span>(proba, grp, lo=.30, hi=.70, step=.05):
    rows = []
    <span class="kw">for</span> t <span class="kw">in</span> np.arange(lo, hi + 1e-9, step):
        sel = proba &gt; t
        r   = pd.Series(sel).groupby(pd.Series(grp).values).mean()
        rows.append({<span class="st">"threshold"</span>: round(float(t), 2),
                     <span class="st">"approval_rate"</span>: round(sel.mean(), 3),
                     <span class="st">"worst_impact_ratio"</span>: round(r.min() / r.max(), 3)})
    <span class="kw">return</span> pd.DataFrame(rows)

<span class="kw">def</span> <span class="fn">feature_elasticity</span>(model, X, shift=0.10):
    <span class="cm"># nudge ONE feature by 10% of its SD; how far does mean predicted risk move?</span>
    base, out = model.predict_proba(X)[:, 1].mean(), {}
    <span class="kw">for</span> c <span class="kw">in</span> X.columns:
        Xp = X.copy(); Xp[c] = Xp[c] + shift * X[c].std()
        out[c] = round(model.predict_proba(Xp)[:, 1].mean() - base, 5)
    <span class="kw">return</span> pd.Series(out).sort_values(key=abs, ascending=<span class="kw">False</span>)

print(threshold_sensitivity(proba, grp_test))
print(feature_elasticity(model, X_test))</code></pre>
<p>Read the two together. A <strong>flat</strong> elasticity profile with one dominant feature means the model is effectively a univariate rule wearing a costume — that is a conceptual-soundness finding (Day 34), not a performance one. A <strong>steep</strong> threshold curve means the operating point is doing more work than the model is, so the governance question becomes who owns that threshold and whether the choice was ever documented. Neither finding falls out of an accuracy number, and both belong in §5 of your assessment.</p>

<div class="box wa"><div class="bt">■ Fragility is unevenly distributed</div><p>The per-group reflex, again with teeth: decision-flip rates near the threshold concentrate on whoever the model scores near the boundary — often the data-thin groups whose scores are least certain (Day 16). "8% of group B's decisions flip on a 2% income perturbation vs 2% of group A's" is a fairness finding about <em>stability</em>, invisible to every rate-based metric you've learned. Add <code>flip_rate_by_group</code> to your audit module today.</p></div>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>Robustness is a named trustworthiness characteristic in the NIST AI RMF ("valid and reliable," "secure and resilient") and a control theme in ISO 42001 — but frameworks name it; stress-tests <em>evidence</em> it. Your Phase 4 assessment's MEASURE section will include a robustness battery with these exact probes, and its findings will speak the Day 6 sentence pattern: magnitude, group breakdown, interval, severity.</p></div>

<h2>Today's takeaway</h2>
<p>Stress-testing probes worst-case behavior: perturbation flips, gameable features, edge sweeps, LLM red-teaming — with flip rates computed per group, because fragility pools near the boundary. Tomorrow: comparing models properly — champion/challenger and the discipline of fair model selection.</p>
`,
quiz:{q:"A 2% income perturbation flips 8% of group B's decisions but only 2% of group A's. Why is this a fairness finding no rate metric would catch?",options:["It reveals unequal decision stability — group B sits on the model's cliffs, so their outcomes are fragile","Flip rates under small perturbations are sampling noise and should not be reported as substantive findings","It shows group B is selected at a lower overall rate, which the standard impact-ratio table already captures","It proves the model was trained predominantly on group A, leaving group B underrepresented in the data"],answer:0,explain:"Rate metrics summarize outcomes; flip rates measure how precarious those outcomes are. A group concentrated near the decision boundary experiences arbitrary-feeling, perturbation-sensitive decisions — a stability disparity that standard fairness batteries never compute."}},

{n:21,title:"Champion / Challenger — Comparing Models Honestly",read:"Lesson · 15 min read",body:`
<p>Real governance rarely reviews one model in a vacuum; it adjudicates a <em>choice</em> — the incumbent (<strong>champion</strong>) versus a proposed replacement (<strong>challenger</strong>). Today: the discipline of fair comparison, and the multi-axis scorecard that keeps "better" from quietly meaning "better for the majority."</p>

<h2>The rules of a fair fight</h2>
<ul>
<li><strong>Identical evaluation data.</strong> Same held-out set, same time window, same preprocessing lineage. Any asymmetry and the comparison is theater.</li>
<li><strong>Uncertainty on the difference.</strong> Champion AUC 0.86, challenger 0.87 — is that real? Bootstrap the <em>difference</em> (Day 3, paired resamples): if the CI on ΔAUC straddles zero, you have a tie being marketed as a win.</li>
<li><strong>The full scorecard, not one number.</strong> Accuracy-family metrics, per-group error rates, calibration (Brier by group), stability (flip rates), explainability cost, and — from Phase 1 — drift sensitivity. A challenger that gains 1 point of AUC while widening the FPR gap and losing calibration is not an upgrade; it's a trade, and trades need owners.</li>
</ul>
<pre><code><span class="cm"># paired bootstrap on the AUC difference</span>
<span class="kw">def</span> <span class="fn">delta_auc</span>(idx):
    <span class="kw">return</span> (roc_auc_score(y.iloc[idx], p_chal[idx])
          - roc_auc_score(y.iloc[idx], p_champ[idx]))
deltas = [delta_auc(rng.choice(n, n)) <span class="kw">for</span> _ <span class="kw">in</span> range(2000)]
<span class="kw">print</span>(np.percentile(deltas, [2.5, 97.5]))   <span class="cm"># does the CI exclude zero?</span></code></pre>

<div class="box an"><div class="bt">◆ Analogy</div><p>Promoting a new manager over an incumbent based on one quarter's revenue alone would be malpractice — you'd look at team retention, client complaints, risk incidents, and whether the revenue bump survives scrutiny. Model selection is a promotion decision: one headline metric, uncorrected for luck and silent costs, is exactly how organizations promote their way into disasters they measured as wins.</p></div>

<div class="box wa"><div class="bt">■ The selection process itself can discriminate</div><p>Here's the subtle one: if every model iteration is selected on overall AUC, the <em>search process</em> systematically drifts toward models that serve the majority (whose data dominates the metric) — fairness erosion by a thousand reasonable-looking selections, no individual decision to point at. The control is structural: fairness metrics as <strong>selection gates</strong> ("no challenger ships if any group's FPR gap exceeds X"), not as post-hoc reporting. Where the gate sits in the process is a governance design question you can now articulate.</p></div>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>Champion/challenger is also the honest frame for the <em>less-discriminatory-alternative</em> question (BTM Day 35): if a challenger exists with comparable performance and smaller disparities, continuing to run the champion becomes a documented choice with legal weight. Your Phase 5 assessment will formalize this search; today you learned to run the comparison it depends on.</p></div>

<h2>Today's takeaway</h2>
<p>Fair comparison: identical data, bootstrapped deltas, full multi-axis scorecard, and fairness as a selection gate rather than a postscript — because metric-chasing selection quietly optimizes for the majority. Tomorrow: models that watch for what doesn't belong — anomaly detection and its governance edge cases.</p>
`,
quiz:{q:"Why should fairness metrics act as selection GATES in a champion/challenger process rather than post-decision reporting?",options:["Reporting after the fact takes more analyst time than checking the same thresholds during model selection","Iterated selection on an aggregate metric drifts toward majority-serving models; only a gate stops it","Common ML libraries implement fairness constraints as gates, so the tooling dictates where the check occurs","Because a challenger model will almost always widen disparities relative to the incumbent it aims to replace"],answer:1,explain:"Each 'pick the higher AUC' step is individually reasonable while the sequence compounds into majority optimization. A structural control — disparity thresholds that block promotion — interrupts the drift at the point of selection, which reporting after the fact cannot."}},

{n:22,title:"Anomaly Detection — Governing the Watchers",read:"Lesson · 15 min read",body:`
<p>Not every model predicts a labeled outcome. A huge class of deployed systems instead asks "does this look <em>normal</em>?" — fraud screens, security monitors, quality control. Unsupervised anomaly detection has a distinctive governance profile, because <strong>"unusual" is not the same as "wrong," and the confusion between them lands on people</strong>.</p>

<h2>The workhorse: Isolation Forest</h2>
<pre><code><span class="kw">from</span> sklearn.ensemble <span class="kw">import</span> IsolationForest
iso = IsolationForest(contamination=0.02, random_state=0)  <span class="cm"># expect ~2% anomalies</span>
iso.fit(X_train)
flags = iso.predict(X_new)          <span class="cm"># -1 = anomaly, 1 = normal</span>
scores = iso.score_samples(X_new)   <span class="cm"># continuous strangeness score</span></code></pre>
<p>The elegant idea: build random trees that split the data with random cuts; <em>anomalies isolate quickly</em> (few cuts suffice to fence off a lonely point) while normal points, buried in the crowd, take many. Average isolation depth becomes a strangeness score. Note the knob doing quiet policy work: <code>contamination</code> — the analyst's <em>declaration</em> of how much anomaly exists, which directly sets how many people get flagged. That's a threshold decision (BTM Day 14) wearing a statistical costume.</p>

<div class="box an"><div class="bt">◆ Analogy</div><p>A neighborhood watch trained only on what this street usually looks like will reliably flag the genuinely suspicious — and also the first wheelchair user, the night-shift nurse leaving at 4am, and anyone whose ordinary life is rare <em>on this street</em>. The watcher detects deviation from the familiar, not wrongdoing. Whether that's a security system or a discrimination engine depends entirely on what happens after the flag.</p></div>

<div class="box wa"><div class="bt">■ The core audit question: unusual ≠ illegitimate</div><p>Minority patterns of life are, by definition, statistically rarer in the training data — cash-preferring communities in fraud models, atypical career paths in HR analytics, non-standard names in identity systems. An anomaly detector <em>faithfully</em> flags rarity, and rarity correlates with minority status. So the battery: flag rates per group; <em>consequences</em> of a flag (silent review vs. frozen account vs. police referral — the severity ladder is where harm scales); false-flag resolution rates per group; and who bears the friction of proving they're merely uncommon, not fraudulent.</p></div>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>Unsupervised systems often escape model governance entirely — "it's not making decisions, just flagging" is the classic dodge. Your response: a flag that triggers consequences <em>is</em> a decision system (BTM Day 11's unsupervised trap, escalated), and it enters the model inventory, gets the per-group battery, and gets its contamination threshold owned by an accountable human. Anomaly detectors are also your monitoring allies — Day 7's drift detection is anomaly detection on distributions — so you'll govern them and deploy them.</p></div>

<h2>Today's takeaway</h2>
<p>Isolation Forests score strangeness via isolation depth; contamination is a threshold policy in disguise; and the central audit axis is unusual-vs-illegitimate — flag rates, consequences, and resolution friction, per group. Tomorrow: evaluating models the way time actually flows — temporal validation and backtesting.</p>
`,
quiz:{q:"A fraud team says their anomaly detector 'doesn't make decisions, just flags transactions for review,' so it's outside model governance. What's the correct pushback?",options:["Unsupervised systems learn no target variable, so they cannot encode the outcome bias governance looks for","Concur for now: governance frameworks scope to supervised models that produce an explicit predicted label","Require replacement with a supervised classifier, which can be audited against labelled fraud outcomes","Flags with consequences are decisions: they carry friction and freezes, so the system enters the inventory"],answer:3,explain:"The 'just flagging' framing hides a decision system whose costs (friction, freezes, suspicion) fall on whoever is statistically unusual — which correlates with minority status. Governance follows consequences, not the presence of labels."}},

{n:23,title:"Temporal Validation — Evaluating the Way Time Flows",read:"Lesson · 15 min read",body:`
<p>One last evaluation upgrade before the phase capstone. Random train/test splits (BTM Day 12) quietly assume the world is static: they let models train on <em>Tuesday</em> to predict <em>Monday</em>. For any system deployed into flowing time — which is all of them — the honest evaluation is <strong>temporal</strong>: train on the past, test on the future, always.</p>

<h2>The out-of-time split and rolling backtest</h2>
<pre><code><span class="cm"># out-of-time (OOT) split: the deployment rehearsal</span>
train = df[df.date &lt;  <span class="st">"2025-07-01"</span>]
test  = df[df.date &gt;= <span class="st">"2025-07-01"</span>]      <span class="cm"># strictly later — no time travel</span>

<span class="cm"># rolling backtest: repeat the rehearsal across history</span>
<span class="kw">from</span> sklearn.model_selection <span class="kw">import</span> TimeSeriesSplit
<span class="kw">for</span> tr, te <span class="kw">in</span> TimeSeriesSplit(n_splits=5).split(X):
    ...   <span class="cm"># each fold trains on earlier data, tests on the next window</span></code></pre>
<p>Two readings matter. First, the <strong>random-vs-OOT gap</strong>: if random-split AUC is 0.87 but out-of-time AUC is 0.79, that 8-point drop is the model's true deployment performance revealing itself — the random split was leaking the future's patterns backward (temporal leakage, BTM Day 12's third form, now measured). Second, the <strong>trend across backtest windows</strong>: performance decaying window-over-window is drift caught in the act (Day 7's PSI will usually be rising in parallel), and the decay <em>rate</em> tells you the honest revalidation cadence.</p>

<div class="box an"><div class="bt">◆ Analogy</div><p>A weather forecaster who "validates" by predicting last Tuesday using data from last Wednesday will post spectacular accuracy and be useless by the weekend. Out-of-time evaluation is the only rehearsal that resembles the show: stand at a moment in history, see only what was knowable then, predict forward. Anything else grades the model on an exam where the answers leaked.</p></div>

<div class="box wa"><div class="bt">■ The per-group read, one more time</div><p>Backtest per group and the Day 7 warning becomes measurable: whose performance decays fastest across windows? A model whose accuracy holds for the majority while sliding 2 points per quarter for one group is scheduling its own fairness failure — and the aggregate trend line will average it into invisibility. Group-wise backtest curves belong in your Phase 4 monitoring section as the evidence behind the revalidation schedule.</p></div>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>In credit-model validation — the oldest mature model-governance discipline, the SR 11-7 lineage now carried forward into SR 26-2 (Day 33) — out-of-time testing is simply mandatory, and its absence is a written finding. In that world this has a name you should use: <strong>outcomes analysis</strong>, one of the three pillars of model validation. Carry that standard everywhere: your assessment checklist asks "was performance validated out-of-time, what was the random-vs-OOT gap, and what does the backtest trend imply for monitoring cadence?" Teams that only show random-split metrics haven't evaluated deployment; they've evaluated nostalgia.</p></div>

<h2>From backtest trend to change management</h2>
<p>A decaying backtest trend answers &ldquo;when should we look again?&rdquo; The follow-on question is the one governance actually turns on: <strong>when does a fix become a new model?</strong> Write the thresholds down before you need them, because the incentive at the moment of decision always favours the cheaper answer.</p>
<ul>
<li><strong>Recalibration</strong> — same features, same functional form, refreshed coefficients or a moved threshold. Cheap, and usually treated as a change to an existing model.</li>
<li><strong>Redevelopment</strong> — new features, new algorithm, new population, or a changed target definition. That is a new model: new documentation, new validation, new inventory entry.</li>
<li><strong>Triggered revalidation</strong> — fired by a monitoring breach (Day 31), a population shift, a use change, or an incident, rather than by the calendar.</li>
<li><strong>Scheduled review</strong> — the annual or tiered cadence your backtest trend justified.</li>
</ul>
<p>The failure mode to name in an assessment is <em>recalibration creep</em>: a sequence of individually minor refreshes that cumulatively produce a model nobody validated. Your finding writes itself — &ldquo;model has been recalibrated four times since the last full validation; cumulative change to feature weights exceeds the redevelopment threshold in policy.&rdquo;</p>

<h2>Today's takeaway</h2>
<p>Train past → test future, always; the random-vs-OOT gap exposes temporal leakage; backtest trends set revalidation cadence and the recalibration-versus-redevelopment line; run it per group to catch scheduled fairness decay. Tomorrow: the Phase 2 capstone — one model through the entire gauntlet.</p>
`,
quiz:{q:"A model shows random-split AUC 0.87 but out-of-time AUC 0.79. What does the 8-point gap represent?",options:["Evidence the ensemble is undersized, since additional trees would close the gap between the two estimates","A defect in the time-series splitter, which allocates fewer training rows to each successive fold it builds","Temporal leakage: random splits let future patterns inform past predictions, so 0.79 is the honest estimate","Ordinary variance between two resampling schemes, which averages out once the model reaches production"],answer:2,explain:"Random splits scatter time, letting the model train on information that wouldn't exist at prediction time. The OOT number is the deployment rehearsal; the gap measures how much of the headline metric was borrowed from the future."}},

{n:24,title:"Phase 2 Capstone — The Full Gauntlet (Deliverable #2)",read:"Capstone Lab · 15 min read · ~4 hr lab · Portfolio deliverable",body:`
<p>Fourteen days of technique converge: today you take one model through the <em>entire</em> intermediate evaluation gauntlet and produce the technical evidence package that your Phase 4 risk assessment will be written on top of. This is the deliverable that proves you evaluate models the way mature validation teams do.</p>

<div class="box hl"><div class="bt">▲ Phase 2 in one breath</div><p>Boosted trees mastered with early stopping (11); imbalance handled with eyes open — weights, SMOTE-in-folds, threshold moving — and calibration re-checked after (12–13); explanations triangulated across SHAP, permutation importance, and PDPs (14–15); uncertainty operationalized via abstain bands, disagreement, and conformal sets (16); a transformer fine-tuned and its imported bias measured with counterfactual statistics (17–18); small LLMs stood up for first-hand probing (19); robustness stress-tested with per-group flip rates (20); champions and challengers compared with bootstrapped deltas and fairness gates (21); anomaly systems recognized as decision systems (22); and everything validated out-of-time (23).</p></div>

<h2>The gauntlet</h2>
<p>On the adult-income data (or a richer dataset if you're ambitious — a lending or credit dataset works beautifully), build and evaluate an XGBoost champion versus your BTM logistic-regression challenger, producing:</p>
<ol>
<li><strong>Honest training:</strong> early stopping, imbalance strategy stated and justified, resampling inside folds only.</li>
<li><strong>Calibration:</strong> before/after reliability curves; Brier by group post-repair.</li>
<li><strong>Explanation, triangulated:</strong> SHAP beeswarm + permutation importance + PDPs on the top features; proxies named; one perturbation check on a top SHAP feature.</li>
<li><strong>Uncertainty:</strong> an abstain band or ensemble-disagreement analysis; uncertainty by group.</li>
<li><strong>Robustness:</strong> the 2% perturbation flip scan, per group.</li>
<li><strong>Comparison:</strong> the full scorecard, bootstrapped ΔAUC, and a fairness-gate verdict on whether the challenger may ship.</li>
<li><strong>Temporal honesty:</strong> if your data has any time field, an OOT split; if not, state that limitation explicitly (professional disclosure, Day 17).</li>
<li><strong>Everything per group,</strong> reported in the Day 6 sentence pattern, computed through your Day 10 audit module (extend it as needed — that's the point of owning it).</li>
</ol>

<div class="box gov"><div class="bt">✦ Governance connection — what your worked example stands in for</div><p>Worth saying explicitly, because it changes how you talk about this portfolio. The income-classification problem you have been working is structurally a <strong>consumer credit approval model</strong>: a binary decision about an individual, driven by financial and demographic features, where the protected characteristics are the ones ECOA names and the outcome materially affects the person. Read across and the whole gauntlet acquires industry vocabulary — your out-of-time split is what a loss-forecasting reviewer runs every quarter, your per-group selection rates are fair-lending testing, your SHAP waterfall is an adverse-action reason code (Day 14), and your champion-challenger comparison is benchmarking.</p><p>You have not validated a PD scorecard or a CECL model and should never imply otherwise. But you can accurately say: <em>&ldquo;the worked example is a consumer-credit-shaped binary decision and the validation techniques transfer directly; the model families I have not worked with are X and Y.&rdquo;</em> Naming the boundary is what makes the transfer claim credible rather than overreaching.</p></div>

<h2>Optional track: the replication test</h2>
<p>If the model-validation path interests you, add one exercise to the gauntlet — the task that most distinguishes a validator from a tester. A validator does not merely <em>test</em> the developer's model; they <strong>re-implement it from the documentation</strong> and check that the outputs match. Any discrepancy is a finding, and unreproducible results are among the most common real ones.</p>
<p>Do it against yourself. Write a one-page spec of your champion — algorithm, hyperparameters, feature list and encodings, train/test split rule, random seed, preprocessing order — then rebuild from the spec alone, without looking at the original notebook, and reconcile:</p>
<pre><code><span class="cm"># --- independent replication: rebuild from the SPEC, then reconcile ---</span>
<span class="kw">import</span> numpy <span class="kw">as</span> np

orig = champion.predict_proba(X_test)[:, 1]
repl = replica.predict_proba(X_test)[:, 1]        <span class="cm"># built from the written spec only</span>

max_abs = np.max(np.abs(orig - repl))
decision_flips = int(((orig &gt; .5) != (repl &gt; .5)).sum())
print(<span class="st">"max |Δprob|"</span>, round(float(max_abs), 6))
print(<span class="st">"decision flips"</span>, decision_flips, <span class="st">"of"</span>, len(orig))

<span class="cm"># tolerance is a JUDGMENT you must state and defend in the report:</span>
<span class="cm">#   < 1e-9   exact  -> spec is complete</span>
<span class="cm">#   < 0.01   close  -> immaterial; name the likely source (library version, seed)</span>
<span class="cm">#   any flip        -> MATERIAL: the spec is missing something a user would need</span></code></pre>
<p>Whatever you find, write it up in the Day 40 findings format. If replication is exact, the finding is &ldquo;model is reproducible from documentation; spec adequate.&rdquo; If it is not — and on a first attempt it usually is not — the finding names the missing element, and you have discovered why development documentation standards exist by walking into the gap yourself.</p>

<div class="box hl"><div class="bt">▲ Why this is the portfolio artifact that reads as validation</div><p>Every data scientist can show a model. Very few can show a <em>reconciliation</em>. A short <code>REPLICATION.md</code> containing a spec, a max-absolute-difference, a decision-flip count, a stated tolerance and a defended conclusion is unmistakably second-line work, and it is the single fastest way to signal that you understand the difference between building and validating. It also transfers directly to bias auditing: an audit whose numbers cannot be reproduced from its own methodology section is the finding an opposing expert most wants to make (Day 40).</p></div>

<div class="box wa"><div class="bt">■ The deliverable's real product is judgment</div><p>End the notebook with a one-page <strong>technical verdict</strong> in Markdown: which model would you allow into production, under what conditions, with what monitoring? Write it in the assessment voice — findings numbered, severities assigned, tradeoffs surfaced, recommendation owned. You are drafting, without ceremony, the MEASURE section of the risk assessment you'll formalize in Phase 4.</p></div>

<h2>File Deliverable #2</h2>
<p>Commit to <code>taming-the-machine/d24-advanced-model/</code> via Git: the notebook, the updated <code>audit_tools.py</code>, and <code>WHAT-I-LEARNED.md</code>. In the reflection: <em>which single gauntlet stage changed your verdict most, and what would you have wrongly concluded without it?</em></p>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>This package is what "technical validation evidence" means in every framework you'll cite: NIST MEASURE made concrete, the <strong>effective-challenge</strong> standard of supervisory model-risk guidance performed (SR 11-7, since April 2026 SR 26-2 — Day 33), ISO 42001's testing controls evidenced. From here the course pivots: Phase 3 sharpens the fairness toolkit with Fairlearn, AIF360, and mitigation — and then Phases 4–6 teach you to wrap work like today's inside the professional documents that organizations actually run on.</p></div>
`,
vocab:[
{term:"Early stopping",def:"Halting boosting when validation stops improving — the built-in overfit brake; demand its evidence."},
{term:"scale_pos_weight / class weights",def:"Loss-level re-pricing of rare-class errors; a values choice in a hyperparameter."},
{term:"SMOTE",def:"Synthetic minority oversampling; folds-only, distorts probabilities, inherits sample skew."},
{term:"Platt / isotonic",def:"Recalibration via sigmoid or monotonic staircase; verify per group after."},
{term:"Beeswarm / waterfall",def:"SHAP's global reliance map and per-decision accounting."},
{term:"Permutation importance",def:"Need-by-destruction; correlated twins cover for each other."},
{term:"Partial dependence plot",def:"The learned feature→prediction curve; hunt cliffs and reversals."},
{term:"Abstain band / conformal set",def:"Operational definitions of 'the model isn't sure' that give oversight teeth."},
{term:"Decision-flip rate",def:"Share of decisions reversed by a small perturbation; stability, per group."},
{term:"Champion / challenger",def:"Incumbent-vs-candidate comparison: same data, bootstrapped deltas, fairness gates."},
{term:"Isolation Forest / contamination",def:"Strangeness by isolation depth; the contamination rate is threshold policy."},
{term:"Out-of-time validation",def:"Train past, test future; the random-vs-OOT gap prices temporal leakage."}
],
quiz:{q:"Why does the capstone demand a written 'technical verdict' page rather than ending with the metrics tables?",options:["Because notebook outputs cannot render tables reliably once they are exported for external distribution","Because metrics without judgment are not governance: the verdict is the MEASURE-to-MANAGE translation","Because a written page renders faster than plots and keeps the deliverable accessible on any reviewer's device","Because a clearly written verdict substitutes for the underlying evidence when the reader is non-technical"],answer:1,explain:"Evidence answers 'what is true'; assessments answer 'what should we do, who owns it, and how will we know it's still true.' Practicing that translation on your own gauntlet output is the bridge from analyst to assessor — the course's entire trajectory."}},
{n:25,title:"Fairlearn Past the Tutorial — What MetricFrame Won't Tell You",read:"Lab · 12 min read · ~1.5 hr lab",body:`
<p>You already ran <strong>Fairlearn</strong>. In BTM Day 36 you pointed <code>MetricFrame</code> at your classifier, passed two columns to get intersectional cells, and mitigated with <code>ThresholdOptimizer</code>. That lab produced a real bias audit. Phase 3's job is to take you from <em>running the tool</em> to <em>knowing where it stops</em> — because everything that library reports is a point estimate with no uncertainty, no multiplicity discipline, and no opinion about which number should govern.</p>

<h2>Refresher, then the gap</h2>
<pre><code>!pip -q install fairlearn
<span class="kw">from</span> fairlearn.metrics <span class="kw">import</span> MetricFrame, selection_rate
<span class="kw">from</span> sklearn.metrics <span class="kw">import</span> recall_score, precision_score

mf = MetricFrame(
    metrics={<span class="st">"selection"</span>: selection_rate,
             <span class="st">"recall"</span>: recall_score,
             <span class="st">"precision"</span>: precision_score},
    y_true=y_test, y_pred=preds,
    sensitive_features=df_test[<span class="st">"sex"</span>])

<span class="kw">print</span>(mf.by_group)          <span class="cm"># the audit table, per group</span>
<span class="kw">print</span>(mf.difference())      <span class="cm"># max gap per metric</span>
<span class="kw">print</span>(mf.ratio())           <span class="cm"># min ratio per metric (four-fifths style)</span></code></pre>
<p>Now look hard at that output and name what is missing. <code>mf.difference()</code> returns <em>0.11</em>. Not "0.11, 95% CI [0.04, 0.18]." Not "0.11, and we ran 34 comparisons to find it." Not "0.11, and the cell driving it has n=38." The library computes correctly and reports nakedly — which is appropriate library design and dangerous audit practice.</p>
<p>So the Phase 3 pattern is: <strong>Fairlearn computes, your Day 10 module qualifies.</strong> Wrap every gap the library returns in a bootstrap (Day 3), attach the interval (Day 4), correct for the number of comparisons (Day 30), and flag thin cells rather than reporting them flat. That wrapper is the difference between the audit you built in BTM Day 36 and the audit a regulator can't dismiss.</p>
<pre><code><span class="cm"># the wrapper pattern you'll use for the rest of the course</span>
gap  = mf.difference()[<span class="st">"selection"</span>]
boot = bootstrap_metric(test_df, <span class="kw">lambda</span> d: selection_gap(d))   <span class="cm"># your Day 10 module</span>
lo, hi = np.percentile(boot, [2.5, 97.5])
<span class="kw">print</span>(f<span class="st">"gap {gap:.3f}, 95% CI [{lo:.3f}, {hi:.3f}], n_min={min_cell_n}"</span>)</code></pre>

<div class="box an"><div class="bt">◆ Analogy</div><p>BTM taught you to drive the power tool; this phase teaches you where the tool's guard rails aren't. A saw doesn't tell you the board is the wrong board. Fairlearn will compute a beautifully precise disparity across a cell of nineteen people and print it in the same font as one computed across nineteen thousand — the instrument has no concept of how much you should believe it. That judgment was always yours, and now you have the statistics to supply it.</p></div>

<div class="box wa"><div class="bt">■ Toolkit ≠ verdict</div><p>MetricFrame will happily print demographic-parity and equalized-odds gaps side by side. It will not tell you which definition should govern this use case, whether the label is trustworthy enough to equalize against (BTM Day 32), or who bears the residual cost (BTM Day 34's impossibility theorem — which you watched appear in your own before-and-after table in Day 36). Vendors increasingly say "we ran Fairlearn" the way they once said "we removed the protected column." Running the toolkit is evidence generation; the judgment layer is still — permanently — human, and it's yours.</p></div>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>Standardized toolkits matter for a governance reason beyond convenience: <em>comparability</em>. When fifty models are all measured through the same library versions with pinned configs, gaps are comparable across models and quarters — the fleet-level view your interview answer from Day 2 promised. Note "library versions pinned" in your methodology sections; reproducibility includes the toolchain.</p></div>

<h2>Today's takeaway</h2>
<p>You already know how to run MetricFrame; what's new is the discipline of never reporting its output raw. Library computes, your module qualifies: interval, multiplicity, minimum cell size. Tomorrow: the full mitigation taxonomy behind the one method BTM had you run.</p>
`,
quiz:{q:"MetricFrame prints demographic-parity and equalized-odds gaps for your model. What has it NOT done?",options:["Computed each metric correctly within every group present in the sensitive-features column you supplied","Handled more than one sensitive feature at a time to produce the crossed intersectional cells you needed","The judgment layer — which definition governs, whether the label is sound, who bears the tradeoff","Expressed the disparities as ratios in the four-fifths form that a regulatory screen would be read against"],answer:2,explain:"The library measures; it cannot decide. Which definition applies, whether the label deserves trust, and how the unavoidable tradeoff is distributed remain human, documented judgments — the exact layer your assessments exist to supply."}},

{n:26,title:"AIF360 and the Mitigation Taxonomy",read:"Lesson · 16 min read",body:`
<p>Measuring bias is Phase 3's first half; <strong>reducing</strong> it is the second. You've already done one mitigation — BTM Day 36 had you wrap your classifier in <code>ThresholdOptimizer</code> and produce a before-and-after table. What you did <em>not</em> get was the map: that method is one cell in a taxonomy of three, and choosing between them is a governance decision with legal consequences. IBM's <strong>AIF360</strong> catalogues the full set, and they organize by <em>when</em> you intervene: before, during, or after training.</p>

<h2>The three intervention points</h2>
<h3>Pre-processing — fix the data's influence</h3>
<p><strong>Reweighing</strong> is the flagship: assign instance weights so that group and outcome are statistically independent in the training signal — underrepresented favorable cases count more, overrepresented ones less. The data itself is untouched (nothing fabricated, unlike SMOTE); only its influence is rebalanced. Model-agnostic, transparent, easily documented.</p>
<h3>In-processing — change what training optimizes</h3>
<p>Add the fairness objective to the loss itself (BTM Day 15's lesson weaponized for good): <strong>constrained optimization</strong> (Fairlearn's <code>ExponentiatedGradient</code> trains toward accuracy <em>subject to</em> a demographic-parity or equalized-odds constraint) or <strong>adversarial debiasing</strong> (a second network tries to predict the group from the model's outputs; the model learns to starve it). Most powerful, most invasive, hardest to explain to a regulator.</p>
<h3>Post-processing — adjust the decisions</h3>
