<style>
:root{
  --bg:#151110; --panel:#1E1815; --panel2:#261F1B; --edge:#3A2F28;
  --ink:#E8E0D8; --muted:#A3968A; --faint:#8A7E74;
  --ember:#D08544; --ember-dim:#8F5A2E; --ember-glow:rgba(208,133,68,.15);
  --green:#7FB069; --green-bg:rgba(127,176,105,.10);
  --gold:#D9B44A; --gold-bg:rgba(217,180,74,.10);
  --red:#D96C5B; --red-bg:rgba(217,108,91,.10);
  --violet:#A08BD0; --violet-bg:rgba(160,139,208,.10);
  --steel:#7FA8B8; --steel-bg:rgba(127,168,184,.10);
  --code-bg:#100C0A; --code-edge:#2B221D;
  /* DESIGN SYSTEM — deliberate decision, not drift.
     Building the Machine and Taming the Machine are two volumes of ONE course.
     They therefore SHARE the type system (below) and differ only in palette:
     BTM runs cool graphite + teal signal; TTM runs warm graphite + ember.
     Palette carries the volume identity; typography carries the product identity.
     To restore TTM's original faces, put back:
       --disp:'Sora',...  --body:'Lora',...  --mono:'Fira Code',...
     and swap the Google Fonts <link> in <head> (comment there explains how). */
  --disp:'Space Grotesk',ui-sans-serif,system-ui,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --body:'Newsreader',ui-serif,Georgia,Cambria,'Times New Roman',serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
  --rail:300px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.72;-webkit-font-smoothing:antialiased}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

.wrap{display:flex;min-height:100vh}
.rail{width:var(--rail);flex:0 0 var(--rail);background:linear-gradient(180deg,#191412,#120E0C);border-right:1px solid var(--edge);position:sticky;top:0;height:100vh;overflow-y:auto;padding:22px 18px 40px}
.main{flex:1;min-width:0;display:flex;justify-content:center;padding:38px 30px 120px}

.brand{font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:-.01em;color:var(--ink);line-height:1.2}
.brand .b2{display:block;font-size:11px;font-weight:500;letter-spacing:.13em;text-transform:uppercase;color:var(--ember);margin-top:8px}
.reins{height:30px;margin:14px 0 6px}
.edition{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.08em;margin-bottom:16px}
.progwrap{margin:14px 0 20px}
.progmeta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.06em;margin-bottom:6px}
.progbar{height:6px;background:#0E0A08;border-radius:6px;overflow:hidden;border:1px solid var(--edge)}
.progfill{height:100%;width:0;background:linear-gradient(90deg,var(--ember-dim),var(--ember));border-radius:6px;transition:width .4s ease}
.phase-label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:16px 0 3px;padding-left:2px}

.pips{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.pip{aspect-ratio:1;border:1px solid var(--edge);background:var(--panel);border-radius:7px;color:var(--muted);font-family:var(--mono);font-size:12px;font-weight:500;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .12s,border-color .15s,background .15s;user-select:none}

.pip.on{border-color:var(--ember);color:var(--bg);background:var(--ember);box-shadow:0 0 0 3px var(--ember-glow)}
.pip.done{border-color:var(--green);color:var(--green)}
.pip.done.on{background:var(--ember);color:var(--bg);border-color:var(--ember)}
.pip.zero{color:var(--violet);border-color:#332b45}
.pip.cs{grid-column:span 3;aspect-ratio:auto;padding:9px 0;border-color:var(--gold);color:var(--gold);border-radius:7px;font-size:10px;letter-spacing:.08em}
.pip.cs.on{background:var(--gold);color:var(--bg)}
.pip.iv{grid-column:span 3;aspect-ratio:auto;padding:9px 0;border-color:var(--steel);color:var(--steel);border-radius:7px;font-size:10px;letter-spacing:.08em}
.pip.iv.on{background:var(--steel);color:var(--bg)}

.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ember);margin-bottom:12px}

code{font-family:var(--mono);font-size:.8em;background:#181210;border:1px solid var(--code-edge);border-radius:4px;padding:1px 6px;color:#EFB98A}

.box.an .bt{color:var(--green)}
.box.wa{border-left:3px solid var(--gold);background:var(--gold-bg)}
.box.wa .bt{color:var(--gold)}
.box.gov{border-left:3px solid var(--violet);background:var(--violet-bg)}
.box.gov .bt{color:var(--violet)}

.quiz{border:1px solid var(--edge);border-radius:11px;background:var(--panel2);padding:20px 20px 8px;margin:30px 0 8px}

.quiz .qq{font-family:var(--disp);font-weight:500;font-size:17px;color:#F2EAE2;margin-bottom:14px;line-height:1.4}
.opt{display:block;width:100%;text-align:left;font-family:var(--body);font-size:16px;color:var(--ink);background:var(--panel);border:1px solid var(--edge);border-radius:8px;padding:11px 14px;margin-bottom:9px;cursor:pointer;transition:border-color .14s,background .14s}
.opt:hover{border-color:var(--ember-dim)}

.nav{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:40px;padding-top:24px;border-top:1px solid var(--edge)}

  .mobbar button{background:var(--panel2);border:1px solid var(--edge);color:var(--ink);border-radius:8px;padding:7px 12px;font-family:var(--mono);font-size:12px;cursor:pointer}
  .mobbar .mt{font-family:var(--disp);font-weight:600;font-size:13px;color:var(--ember)}
  .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:35}

}

/* ── Answer key (generated from DAYS) ───────────────────────────── */
.pip.ak{grid-column:span 3;aspect-ratio:auto;padding:9px 0;border-color:var(--violet);color:var(--violet);border-radius:7px;font-size:10px;letter-spacing:.08em}
.pip.ak.on{background:var(--violet);color:var(--bg)}
.akph{font-family:var(--disp);font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--violet);margin:30px 0 12px;padding-bottom:7px;border-bottom:1px solid var(--edge)}
.ak{border:1px solid var(--edge);border-left:3px solid var(--violet);border-radius:0 9px 9px 0;background:var(--panel);padding:14px 17px;margin:0 0 13px}

/* ── Keyboard focus (pips and answer-key links are role=button divs) ─ */

<script>
/* ============================================================
   TAMING THE MACHINE — render engine
   ============================================================ */
const PHASES=[
  {label:"Start Here",range:[0,0],load:"1 day · ~1 hr"},
  {label:"P1 · The Analyst's Toolkit",range:[1,10],load:"10 days · ~8 hr · one 4 hr lab (d10)"},
  {label:"P2 · Bigger Models, Deeper Evaluation",range:[11,24],load:"14 days · ~15 hr · one 4 hr lab (d24)"},
  {label:"P3 · Advanced Fairness & Monitoring",range:[25,32],load:"8 days · ~12 hr · one 4 hr lab (d32)"},
  {label:"P4 · Build: Model Risk Assessment",range:[33,41],load:"9 days · ~16 hr · one 6 hr build (d41)"},
  {label:"P5 · Build: Model Bias Assessment",range:[42,49],load:"8 days · ~20 hr · 3 hr lab (d43) + 6 hr build (d49)"},
  {label:"P6 · Build: Responsible AI + Job-Ready",range:[50,60],load:"11 days · ~22 hr · 5 hr + 8 hr builds (d56, d60)"},
];
const DAYS=[
{n:0,title:"Portfolio Level-Up",read:"Setup · 15 min read · ~1 hr hands-on · assumes Building the Machine complete",body:`
<p>Welcome back. If you finished <em>Building the Machine</em>, you can train models, measure fairness rigorously, and file evidence in a GitHub portfolio. This course takes you from competent to <strong>hireable</strong>: bigger models, sharper statistics, and — the centerpiece — building the three professional assessments that AI governance teams actually produce: a <strong>Model Risk Assessment</strong>, a <strong>Model Bias Assessment</strong>, and a <strong>Responsible AI Assessment</strong>, aligned to NIST AI RMF and ISO/IEC 42001. Before Day 1, we upgrade your workspace to intermediate standard.</p>

<div class="box tmpl"><div class="bt">▤ What this actually costs — read before Day 1</div><p>This is a 60-day course in structure and roughly <strong>94 hours of work</strong> in substance. Budget <strong>10–11 hours a week over nine weeks</strong>, and expect the load to be uneven by design: most days are a 15-minute lesson plus a 45–60 minute build, but eight days run to three hours or more.</p><p><strong>Plan around these:</strong> Day 10 (~4 hr), Day 24 (~4 hr), Day 32 (~4 hr), Day 41 (~6 hr), Day 43 (~3 hr), Day 49 (~6 hr), Day 56 (~5 hr) and Day 60 (~8 hr). Seven produce a portfolio artifact and are the reason the phase before them was worth doing; Day 43 is the SQL population-build lab that Days 44&ndash;45 depend on. Put them on a weekend or split them across two evenings — but do not start one with an hour to spare, because a rushed flagship is worth less than a late one.</p><p>Every day's header carries its own estimate, and each phase in the sidebar shows its total and where its heavy days fall. If you are running behind, fall behind on the reading days and protect the builds: the artifacts are what a hiring manager opens.</p></div>

<h2>Step 1 — Git from the command line</h2>
<p>In the first course you uploaded files through GitHub's website. Professionals use <strong>Git commands</strong>, and you can run them straight from Colab with the <code>!</code> prefix (which runs shell commands from a notebook cell):</p>
<pre><code><span class="cm"># One-time identity setup (use your GitHub email)</span>
!git config --global user.email <span class="st">"you@example.com"</span>
!git config --global user.name <span class="st">"Your Name"</span>

<span class="cm"># Clone your existing portfolio into Colab</span>
!git clone https://github.com/YOUR-USERNAME/building-the-machine-portfolio.git
%cd building-the-machine-portfolio

<span class="cm"># The daily rhythm: stage -> commit -> push</span>
!git add .
!git commit -m <span class="st">"Add day 10 fairness module"</span>
!git push</code></pre>
<p>For <code>push</code> you'll need a <strong>Personal Access Token</strong> (GitHub → Settings → Developer settings → Fine-grained tokens → generate one with repo access; paste it when Git asks for a password). That's the whole ceremony. <code>add</code> stages changes, <code>commit</code> snapshots them with a message, <code>push</code> publishes. Commit messages are professional writing — "Add bias audit for XGBoost model," never "stuff."</p>

<h2>Step 2 — Restructure the portfolio for two tiers</h2>
<p>Your repo becomes a two-course portfolio. Create a <code>taming-the-machine/</code> folder and, inside it, the deliverable folders as you reach them:</p>
<pre><code>building-the-machine-portfolio/
├── README.md                      <span class="cm">← update: two-tier portfolio front page</span>
├── day-10-foundations-lab/ ...    <span class="cm">← course 1 deliverables stay put</span>
└── taming-the-machine/
    ├── d10-audit-module/          <span class="cm">← your reusable Python library</span>
    ├── d24-advanced-model/
    ├── d32-mitigation-lab/
    ├── d41-model-risk-assessment/   <span class="cm">← flagship</span>
    ├── d49-bias-assessment/         <span class="cm">← flagship</span>
    ├── d56-responsible-ai-assessment/ <span class="cm">← flagship</span>
    └── d60-governance-package/      <span class="cm">← capstone</span></code></pre>

<h2>Step 3 — The assessment document pattern</h2>
<p>The three flagship deliverables are <em>documents</em>, not notebooks — Markdown reports with a supporting notebook of evidence. Every assessment you write in this course follows one professional skeleton, which you'll internalize until it's reflex:</p>
<div class="box tmpl"><div class="bt">▤ Assessment skeleton (memorize this)</div><p><strong>1. Executive summary</strong> (one page: what, verdict, top findings, recommendation) → <strong>2. Scope &amp; methodology</strong> (system, data, standards applied, limitations) → <strong>3. Findings</strong> (numbered, evidence-linked, severity-rated) → <strong>4. Analysis</strong> (what the findings mean, tradeoffs surfaced) → <strong>5. Recommendations</strong> (specific, owned, time-bound) → <strong>6. Appendices</strong> (evidence tables, methodology detail, the notebook). Every real assessment framework — NIST-aligned risk reports, LL144 bias audits, ISO 42005 impact assessments — is a variation of this spine.</p></div>

<h2>Step 4 — Update your README</h2>
<p>Reframe the front page: "A two-course AI governance portfolio: foundations (Building the Machine) and professional assessment practice (Taming the Machine), including complete Model Risk, Model Bias, and Responsible AI assessments aligned to NIST AI RMF and ISO/IEC 42001." That sentence, with the artifacts to back it, is what gets a recruiter to stop scrolling.</p>

<div class="box tmpl"><div class="bt">▤ Three destinations — read this before Day 1</div><p>This course teaches one craft and opens three doors. Every day is worth doing, and the three flagship assessments are the spine regardless of where you land. But once you know which door you are walking toward, some days stop being general education and start being interview preparation. Here is the map, so you are never reading a section without knowing whose it is.</p>
<table class="vocab">
<tr><th>If you are aiming at…</th><th>The days that are <em>yours</em></th><th>Lead with</th></tr>

{n:1,title:"From Notebooks to Tools — Functions, Modules & First Tests",read:"Lesson · 15 min read · ~45 min hands-on",body:`
<p>In the first course you wrote code top-to-bottom in cells. That's fine for exploration and terrible for auditing, because audit code gets <em>reused</em> — same metrics, next model, next quarter. Professionals package repeated logic into <strong>functions</strong> and <strong>modules</strong>. This week you build a personal audit library you'll use for the rest of the course.</p>

<h2>Functions: name the motion</h2>
<p>Remember the core audit motion (BTM Day 4): compute per group, compare. You've typed it a dozen times. Wrap it once:</p>
<pre><code><span class="kw">def</span> <span class="fn">selection_rates</span>(df, group_col, outcome_col):
    <span class="st">"""Selection rate per group, plus impact ratios vs the top group."""</span>
    rates = df.groupby(group_col)[outcome_col].mean()
    ratios = rates / rates.max()
    <span class="kw">return</span> rates, ratios

rates, ratios = selection_rates(df, <span class="st">'sex'</span>, <span class="st">'approved'</span>)</code></pre>
<p>The triple-quoted string is a <strong>docstring</strong> — documentation living inside the function. In audit work docstrings aren't optional politeness: your code is evidence, and evidence must be legible to a reviewer who isn't you.</p>

<h2>Modules: a file of functions you import</h2>
<p>Put related functions in a <code>.py</code> file and it becomes a <strong>module</strong>. In Colab:</p>
<pre><code>%%writefile audit_tools.py
<span class="kw">def</span> <span class="fn">selection_rates</span>(df, group_col, outcome_col):
    ...

<span class="cm"># then, in any cell or any future notebook:</span>
<span class="kw">import</span> audit_tools
rates, ratios = audit_tools.selection_rates(df, <span class="st">'race'</span>, <span class="st">'approved'</span>)</code></pre>
<p>One tested implementation, used everywhere. When you fix a bug or tighten a definition, every analysis that imports the module inherits the fix. That's how a team keeps forty audits consistent.</p>

<div class="box an"><div class="bt">◆ Analogy</div><p>Notebook-only code is cooking every meal from scratch with no written recipes — fine at home, chaos in a restaurant. Functions are recipes; a module is the recipe binder the whole kitchen cooks from. When the health inspector (auditor) asks "how exactly do you compute an impact ratio?", you hand them one binder page, not forty slightly different improvisations.</p></div>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>Reproducibility is an audit requirement, not a style preference. If two analysts compute "the impact ratio" with subtly different code, your organization has two answers to a legal question. A shared, versioned audit module is a <em>control</em> — it standardizes measurement the way a calibrated instrument does. You're not just learning Python hygiene; you're building the measurement instrument your Phase 4–6 assessments will cite.</p></div>

<h2>Proving the function does what you say — your first test</h2>
<p>A module is a claim: <em>this code computes impact ratios correctly.</em> Right now nothing checks that claim, and a claim nobody checks is exactly what your assessments will spend sixty days refusing to accept from other people. So we hold our own tooling to the standard: write a test.</p>
<p>A test is an ordinary function that sets up a case where you know the right answer, calls your code, and asserts the result. <strong>pytest</strong> finds and runs them:</p>
<pre><code>%%writefile test_audit_tools.py
<span class="kw">import</span> pandas <span class="kw">as</span> pd
<span class="kw">from</span> audit_tools <span class="kw">import</span> selection_rates

<span class="kw">def</span> <span class="fn">test_known_rates</span>():
    <span class="cm"># hand-built case: group A 2/4 = 0.50, group B 1/4 = 0.25</span>
    df = pd.DataFrame({<span class="st">"g"</span>: list(<span class="st">"AAAABBBB"</span>),
                       <span class="st">"y"</span>: [1,1,0,0, 1,0,0,0]})
    rates, ratios = selection_rates(df, <span class="st">"g"</span>, <span class="st">"y"</span>)
    <span class="kw">assert</span> rates[<span class="st">"A"</span>] == 0.50
    <span class="kw">assert</span> rates[<span class="st">"B"</span>] == 0.25
    <span class="kw">assert</span> ratios.min() == 0.50        <span class="cm"># 0.25 / 0.50 — least over most</span>

<span class="kw">def</span> <span class="fn">test_ratio_never_exceeds_one</span>():
    <span class="cm"># the Day 6 convention, encoded so it cannot silently regress</span>
    df = pd.DataFrame({<span class="st">"g"</span>: list(<span class="st">"AABB"</span>), <span class="st">"y"</span>: [0,0,1,1]})
    _, ratios = selection_rates(df, <span class="st">"g"</span>, <span class="st">"y"</span>)
    <span class="kw">assert</span> ratios.max() &lt;= 1.0</code></pre>
<pre><code>!pytest -q test_audit_tools.py</code></pre>
<p>Read the second test closely, because it is the interesting one. It doesn't check a number — it encodes a <em>rule</em>: an impact ratio must never exceed 1.0, because the denominator is always the most-selected group. If someone later "simplifies" the function to divide group B by group A, that test fails immediately. The rule you reasoned your way to is now enforced by machine, permanently, without depending on anyone remembering it.</p>

<div class="box wa"><div class="bt">■ Tests you can write before you know any testing</div><p>Three patterns cover most audit code, and none require test-engineering expertise. <strong>Known-answer</strong>: build a tiny dataframe where you can compute the result by hand, and assert it. <strong>Invariant</strong>: assert a property that must hold for <em>any</em> input — ratios ≤ 1.0, rates between 0 and 1, per-group counts summing to the total. <strong>Edge case</strong>: what happens with an empty group, a group of one, a group where nobody is selected? That last family finds real bugs, because division by a zero selection rate is exactly the situation a thin subgroup produces — the subgroup you most need the number for.</p></div>

<h2>Today's takeaway</h2>
<p>Functions name and freeze the audit motions; modules make them importable and consistent; docstrings make the code legible as evidence; and tests make its claims checkable — known-answer, invariant, edge case. Tomorrow: classes — bundling data and functions into a single Auditor object, and the fixtures that keep testing it cheap.</p>

`,
quiz:{q:"Why is a shared, versioned audit module a governance control rather than just good coding style?",options:["It standardizes measurement, so two analysts cannot produce two different impact ratios for one legal question","It makes notebooks execute faster by avoiding repeated interpretation of the same per-group code","Python's packaging rules require code used in regulated contexts to be distributed as modules","It conceals implementation detail from auditors, presenting only the computed results they must review"],answer:0,explain:"A single tested implementation, imported everywhere, is a calibrated instrument: everyone measures the same way, and fixes propagate to every analysis. Inconsistent ad-hoc code means inconsistent evidence — a real audit failure mode."}},

{n:2,title:"Classes — Building Your Auditor Object",read:"Lesson · 16 min read · ~45 min hands-on",body:`
<p>Functions are verbs. Sometimes you need a noun: a thing that <em>holds</em> a model, its data, and its protected attributes together, and knows how to audit itself. That's a <strong>class</strong> — the last major Python concept between you and professional tooling.</p>

<h2>A class bundles state and behavior</h2>
<pre><code><span class="kw">class</span> <span class="fn">ModelAuditor</span>:
    <span class="st">"""Holds a fitted model + test data; produces per-group audit metrics."""</span>

    <span class="kw">def</span> <span class="fn">__init__</span>(self, model, X_test, y_test, groups):
        self.model = model
        self.X, self.y = X_test, y_test
        self.groups = groups              <span class="cm"># a Series of group labels</span>
        self.preds = model.predict(X_test)

    <span class="kw">def</span> <span class="fn">rates_by_group</span>(self):
        <span class="kw">import</span> pandas <span class="kw">as</span> pd
        <span class="kw">return</span> pd.Series(self.preds).groupby(self.groups.values).mean()

    <span class="kw">def</span> <span class="fn">fpr_by_group</span>(self):
        <span class="cm"># negatives wrongly flagged, per group (BTM Day 27)</span>
        ...

auditor = ModelAuditor(rf_model, X_test, y_test, df_test[<span class="st">'sex'</span>])
<span class="kw">print</span>(auditor.rates_by_group())</code></pre>
<p>Read the anatomy: <code>__init__</code> runs when you create the object and stores everything on <code>self</code> (the object's memory). Every method then has access to the same model and data without you re-passing them. Create one auditor per model; call its methods all day.</p>

<div class="box an"><div class="bt">◆ Analogy</div><p>A function is a single power tool. A class is the fully-loaded toolbox with the job's blueprints taped inside the lid — it carries the context (which model, which data, which groups) so every tool inside works on the right job without being told again. Hand a colleague the toolbox and they can continue your audit exactly where you left it.</p></div>

<h2>Why this matters now</h2>
<p>Every serious library you'll touch this course is built from classes: <code>XGBClassifier</code>, Fairlearn's <code>MetricFrame</code>, SHAP's <code>Explainer</code>. Until today you used objects without quite knowing what they were — <code>model.fit()</code>, <code>model.predict()</code> were method calls on a class instance. Now you can <em>read</em> library documentation fluently and <em>write</em> your own tooling in the same shape.</p>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>Your Day 10 deliverable — a reusable fairness-audit module with an auditor class — is precisely the kind of internal tooling mature governance teams maintain. When you interview and someone asks "how would you scale bias testing across fifty models?", the answer isn't "work harder." It's "standardized tooling: an auditor class every model team runs, producing comparable metrics." You'll have built one.</p></div>

<h2>Testing a class — fixtures stop you repeating the setup</h2>
<p>Yesterday's tests each built their own little dataframe. Do that for an auditor object and every test starts with six lines of scaffolding before it can assert anything. A <strong>fixture</strong> builds the shared setup once and hands it to any test that asks for it by name:</p>
<pre><code>%%writefile test_auditor.py
<span class="kw">import</span> pytest, pandas <span class="kw">as</span> pd, numpy <span class="kw">as</span> np
<span class="kw">from</span> audit_tools <span class="kw">import</span> ModelAuditor

<span class="kw">class</span> <span class="fn">FakeModel</span>:
    <span class="cm"># a stub: predicts 1 when the first feature is positive. No training, no randomness.</span>
    <span class="kw">def</span> <span class="fn">predict</span>(self, X): <span class="kw">return</span> (X.iloc[:, 0] &gt; 0).astype(int).values

<span class="cm">@pytest.fixture</span>
<span class="kw">def</span> <span class="fn">auditor</span>():
    X = pd.DataFrame({<span class="st">"f"</span>: [1, 1, -1, -1, 1, -1, -1, -1]})
    y = pd.Series([1, 1, 0, 0, 1, 1, 0, 0])
    g = pd.Series(list(<span class="st">"AAAABBBB"</span>))
    <span class="kw">return</span> ModelAuditor(FakeModel(), X, y, g)

<span class="kw">def</span> <span class="fn">test_rates_by_group</span>(auditor):          <span class="cm"># ask for the fixture by name</span>
    r = auditor.rates_by_group()
    <span class="kw">assert</span> r[<span class="st">"A"</span>] == 0.75 <span class="kw">and</span> r[<span class="st">"B"</span>] == 0.25

<span class="kw">def</span> <span class="fn">test_thin_group_is_flagged</span>(auditor):
    <span class="cm"># the Day 10 honesty rule, enforced: tiny n must not return a bare p-value</span>
    out = auditor.significance(<span class="st">"selection"</span>)
    <span class="kw">assert</span> <span class="st">"power"</span> <span class="kw">in</span> str(out).lower()

<span class="kw">def</span> <span class="fn">test_bootstrap_is_reproducible</span>(auditor):
    a = auditor.bootstrap_gap(<span class="st">"selection"</span>, n=200, seed=7)
    b = auditor.bootstrap_gap(<span class="st">"selection"</span>, n=200, seed=7)
    <span class="kw">assert</span> np.allclose(a, b)          <span class="cm"># same seed -&gt; same interval, always</span></code></pre>
<p>Note the <code>FakeModel</code>. Tests should not depend on training a real model — that is slow, and worse, it is <em>random</em>, so a test that fails once in twenty teaches people to ignore failures. A stub with hand-computable behaviour makes the test deterministic and fast, which is what makes anyone actually run it.</p>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>Look at what those last two tests actually encode. One asserts that thin subgroups trigger a power warning rather than a bare p-value — that is Day 5's most important lesson, written down as an executable rule. The other asserts that the same seed produces the same interval — reproducibility, which is an evidence-integrity requirement in every assessment you will write.</p><p>This is the difference between a policy and a control. &ldquo;Analysts should disclose low power&rdquo; is a policy: it depends on memory, attention and deadline pressure. A test that fails the build when the tool stops disclosing low power is a control. When Phase 4 has you rating controls Adequate / Partial / Absent, remember that you built an Adequate one here — and that most teams claiming &ldquo;reusable audit tooling&rdquo; cannot show you a single test.</p></div>

<h2>Today's takeaway</h2>
<p>Classes bundle state (<code>self</code>) with behavior (methods); <code>__init__</code> loads the toolbox. Fixtures supply shared test setup; stub models keep tests deterministic; and the tests worth writing encode your <em>judgement rules</em>, not just your arithmetic. Tomorrow the math track opens: sampling, and the single most useful trick in applied statistics — the bootstrap.</p>
`,
quiz:{q:"In the ModelAuditor class, what role does __init__ and self play?",options:["__init__ validates the model against the test set, and self exposes the libraries the methods rely on","They are conventional scaffolding Python requires syntactically but that carries no functional consequence","self refers to the training data specifically, which is why the methods can compute metrics without arguments","__init__ runs at creation and stores model, data and groups on self — the object's memory — so methods need no re-passing"],answer:3,explain:"__init__ is the constructor: it receives the model, data, and group labels and attaches them to self, the instance's persistent state. Methods then share that context — which is exactly why one auditor object can run a whole battery of checks coherently."}},

{n:3,title:"Sampling and the Bootstrap",read:"Lesson · 16 min read",body:`
<p>Here's a question your first course couldn't answer: your audit finds a 9-point selection-rate gap between groups — <strong>but the test set is only 400 people. Is that gap real, or is it noise?</strong> Answering "is this number stable?" is the entire job of statistical inference, and the most practical tool for it is beautifully simple: the <strong>bootstrap</strong>.</p>

<h2>The problem: every number you compute is a sample estimate</h2>
<p>Your test set is one sample from a larger population. Draw a different sample and every metric — accuracy, FPR, the fairness gap — comes out slightly different. A single computed number hides how much it would wobble across samples. Small samples wobble a lot; a dramatic-looking gap can be pure luck of the draw.</p>

<h2>The bootstrap: resample your own data</h2>
<p>Ideally you'd collect a thousand fresh test sets and watch the metric's distribution. You can't — so the bootstrap fakes it: <strong>resample your existing data <em>with replacement</em>, many times, recomputing the metric each time.</strong></p>
<pre><code><span class="kw">import</span> numpy <span class="kw">as</span> np

<span class="kw">def</span> <span class="fn">bootstrap_metric</span>(df, metric_fn, n_boot=2000, seed=0):
    rng = np.random.default_rng(seed)
    vals = []
    <span class="kw">for</span> _ <span class="kw">in</span> range(n_boot):
        sample = df.sample(len(df), replace=<span class="kw">True</span>, random_state=rng.integers(1e9))
        vals.append(metric_fn(sample))
    <span class="kw">return</span> np.array(vals)

<span class="cm"># e.g. metric_fn computes the selection-rate gap between two groups</span>
gaps = bootstrap_metric(test_df, gap_fn)
<span class="kw">print</span>(gaps.mean(), gaps.std())   <span class="cm"># center and wobble of the gap</span></code></pre>
<p>"With replacement" means the same row can be drawn twice — that's what makes each resample a plausible alternate version of your dataset. The spread of the 2,000 recomputed values <em>is</em> your uncertainty estimate.</p>

<div class="box an"><div class="bt">◆ Analogy</div><p>You have one photo of a spinning coin and want to know if it's biased. The bootstrap is like generating a thousand slightly-shuffled versions of the evidence you already have and seeing how often the conclusion holds. If the gap shows up in nearly every reshuffle, it's a feature of the data. If it appears and vanishes depending on the shuffle, you were about to accuse a coin based on one lucky frame.</p></div>

<div class="box wa"><div class="bt">■ The intermediate analyst's edge</div><p>Junior analysts report "the FPR gap is 9 points." You will report "the FPR gap is 9 points, and across 2,000 bootstrap resamples it stays positive 98% of the time — this is not noise." The first sentence starts an argument. The second one ends it. Uncertainty quantification is what makes a finding <em>defensible</em>, and defensibility is the currency of assessments.</p></div>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>Small-group metrics are exactly where this bites: minority subgroups have few rows (BTM Day 17), so their metrics wobble most — meaning both false alarms (a "gap" that's noise) and false comfort (a real gap dismissed as noise) concentrate on the groups you most need to get right. Bootstrapping per-group metrics is how your Phase 5 bias assessment will state findings with honest precision.</p></div>

<h2>Today's takeaway</h2>
<p>Every metric is a wobbling sample estimate; the bootstrap resamples your data with replacement to measure the wobble. Tomorrow we turn that wobble into the professional reporting standard: the confidence interval.</p>
`,
quiz:{q:"Your bias audit finds a 9-point gap on a 400-person test set. What does bootstrapping add before you report it?",options:["An estimate of the gap's stability — resampling shows whether it is robust or merely sampling noise","A correction that removes the observed gap whenever the underlying model is demonstrably fair on the population","Evidence that the model caused the gap, by isolating the model's contribution from that of the training data","Additional effective sample size, since resampling with replacement enlarges the data the metric runs on"],answer:0,explain:"The bootstrap measures how much the metric wobbles across plausible alternate samples. A gap that persists across ~all resamples is defensible; one that flickers may be noise — a distinction that matters most for small (often minority) subgroups."}},

{n:4,title:"Confidence Intervals on Fairness Metrics",read:"Lesson · 15 min read",body:`
<p>Yesterday you measured wobble. Today you package it the way every serious report does: the <strong>confidence interval</strong> (CI) — a range that communicates both your estimate and your honesty about its precision.</p>

<h2>From bootstrap distribution to interval</h2>
<p>Take yesterday's 2,000 bootstrapped gap values, sort them, and read off the middle 95%:</p>
<pre><code>lo, hi = np.percentile(gaps, [2.5, 97.5])
<span class="kw">print</span>(f<span class="st">"gap = {gaps.mean():.3f}, 95% CI [{lo:.3f}, {hi:.3f}]"</span>)
<span class="cm"># e.g.  gap = 0.090, 95% CI [0.031, 0.148]</span></code></pre>
<p>Read it as: given the data, the gap is estimated at 9 points, and values from about 3 to 15 points are all consistent with what we observed. Two immediate power-reads:</p>
<ul>
<li><strong>Does the CI exclude zero?</strong> [0.031, 0.148] does — a "no gap" explanation doesn't fit the data. If the CI were [−0.02, 0.20], zero is inside, and you cannot yet claim a disparity with confidence.</li>
<li><strong>How wide is it?</strong> A CI of [0.08, 0.10] is precise knowledge. [0.01, 0.30] says "there's probably something here but the data is too thin to say how big" — itself a finding, usually spelled "collect more data before certifying anything."</li>
</ul>

<div class="box an"><div class="bt">◆ Analogy</div><p>A point estimate is saying "the fish was 30 cm." A confidence interval is showing your hands: "between about 25 and 35." The width of your hands tells the listener how much to trust you. An analyst who only ever reports point estimates is a fisherman who never shows their hands — precise-sounding and unfalsifiable, which is the worst combination in an audit.</p></div>

<div class="box wa"><div class="bt">■ What a 95% CI does <em>not</em> mean</div><p>It does not mean "there's a 95% chance the true gap is in this range" in the strict frequentist sense, and it absolutely does not mean the model is 95% fair or unfair. The safe professional phrasing — accurate and plain — is: <em>"values in this range are consistent with our data; values outside it are not."</em> Precision about what your statistics claim is part of the credibility you're building; overclaiming a CI's meaning is a favorite gotcha for technically-literate reviewers.</p></div>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>Look ahead to your Phase 5 bias assessment: LL144-style audits report impact ratios, and the four-fifths rule flags ratios under 0.80 (BTM Day 35). With CIs you can now say something far stronger than "the ratio is 0.74": you can say whether the <em>entire interval</em> sits below 0.80 (clear adverse-impact signal), straddles it (inconclusive — investigate), or clears it. That three-way read is the difference between a checkbox audit and a professional one.</p></div>

<h2>Today's takeaway</h2>
<p>Percentiles of the bootstrap distribution give you a CI; check whether it excludes the critical value (zero, or 0.80) and how wide it is. Report intervals, not just points. Tomorrow: the formal machinery of hypothesis tests and p-values — and the ways they get abused.</p>
`,
quiz:{q:"Your impact ratio is 0.74 with a 95% CI of [0.62, 0.79]. What's the professional read against the four-fifths threshold?",options:["Inconclusive: an interval computed from a single sample is too unstable to test against a regulatory threshold","The entire interval sits below 0.80 — every value consistent with the data indicates adverse impact, a defensible flag","The model effectively passes, since the interval's upper bound of 0.79 rounds to the 0.80 screening threshold","Confidence intervals do not apply to impact ratios, which are population parameters rather than estimates"],answer:1,explain:"When the whole interval lies below the 0.80 threshold, every value consistent with your data signals adverse impact — far stronger than a bare point estimate. Straddling the threshold would instead mean 'inconclusive, investigate'; clearing it would ease concern."}},

{n:5,title:"Hypothesis Tests, p-values, and Their Abuse",read:"Lesson · 17 min read",body:`
<p>Confidence intervals answer "how big, and how sure?" The older, more famous machinery — <strong>hypothesis tests and p-values</strong> — answers a narrower question, gets quoted constantly in audits and courtrooms, and is misused so routinely that knowing its failure modes is itself a professional skill.</p>

<h2>The logic in one paragraph</h2>
<p>Assume, for argument's sake, that there is <em>no real difference</em> between groups — the <strong>null hypothesis</strong>. Then ask: if that were true, how surprising is the gap we actually observed? The <strong>p-value</strong> is that surprise, as a probability: <em>the chance of seeing a gap this large (or larger) purely by sampling luck if no true difference exists.</em> A small p-value (convention: below 0.05) means "this would be a big coincidence under the null," and the null gets rejected — the difference is called <strong>statistically significant</strong>.</p>
<pre><code><span class="kw">from</span> scipy <span class="kw">import</span> stats
<span class="cm"># two-proportion z-test: do selection rates differ between groups?</span>
count = np.array([sel_a, sel_b])        <span class="cm"># selected per group</span>
nobs  = np.array([n_a, n_b])            <span class="cm"># totals per group</span>
<span class="kw">from</span> statsmodels.stats.proportion <span class="kw">import</span> proportions_ztest
stat, p = proportions_ztest(count, nobs)
<span class="kw">print</span>(f<span class="st">"p = {p:.4f}"</span>)</code></pre>

<div class="box an"><div class="bt">◆ Analogy</div><p>A p-value is a courtroom's "how implausible is the innocent explanation?" A p of 0.003 says: if the model treated groups identically, a gap like this would arise by chance only 3 times in 1,000 — the innocent explanation strains belief. A p of 0.40 says a gap like this happens routinely by chance — you can't convict on this evidence. Note what it never says: how <em>large</em> or <em>harmful</em> the difference is. Guilt, not damages.</p></div>

<h2>The abuse catalogue — learn these cold</h2>
<ul>
<li><strong>Significant ≠ important.</strong> With a huge sample, a trivial 0.4-point gap can be "significant" (p tiny) while mattering to no one. Tomorrow's topic — effect size — is the antidote.</li>
<li><strong>Not significant ≠ no difference.</strong> With a tiny sample (hello, minority subgroups), a large real gap can fail to reach significance. "p &gt; 0.05" often means "underpowered," not "fair." Reporting it as "no bias found" is the single most common statistical sin in bias auditing.</li>
<li><strong>p-hacking.</strong> Test twenty subgroup comparisons and one will hit p &lt; 0.05 by luck alone (that's what 1-in-20 means). Honest work pre-specifies its comparisons and corrects for multiple tests; motivated work runs tests until something "finds" the desired answer — in either direction.</li>
<li><strong>The threshold is a convention.</strong> 0.05 is a habit, not physics. p = 0.049 and p = 0.051 are the same evidence.</li>
</ul>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>You will review vendor fairness claims that lean on these abuses — most often "no statistically significant disparity was detected" delivered over a subgroup of 60 people. Your trained response: "What was the statistical power? Show me the confidence interval." An underpowered test is silence, not exoneration, and being the person in the room who can say that precisely — and prove it with a bootstrap — is exactly the intermediate skill this phase exists to build.</p></div>

<h2>Today's takeaway</h2>
<p>A p-value measures surprise under the no-difference assumption — nothing about size or importance. Significant ≠ important; not-significant ≠ fair (often just underpowered); multiple testing manufactures false hits. Tomorrow: effect sizes, the number that says how much it actually matters.</p>
`,
quiz:{q:"A vendor reports 'no statistically significant disparity (p = 0.22)' for a subgroup with 58 members. What's the correct professional response?",options:["Accept it: a p-value above 0.05 means the null of no disparity holds, so the model is fair for that subgroup","Ask for the power and the confidence interval — at n=58 the test is likely underpowered, so p > 0.05 may mean cannot detect","Reject it outright, since p-values may not be relied on when assessing algorithmic fairness","Ask them to re-run the test at a 0.10 threshold, which is more appropriate for a smaller subgroup sample"],answer:1,explain:"Non-significance on a tiny sample usually reflects low power: a large real gap can produce p > 0.05 simply because the data is thin. The CI will likely be very wide, revealing that 'no disparity found' really means 'no conclusion possible' — a critical distinction in audit review."}},
{n:6,title:"Effect Sizes — How Much Does It Actually Matter?",read:"Lesson · 14 min read",body:`
<p>Yesterday ended on the field's dirty secret: with enough data, everything is "significant"; with too little, nothing is. The number that cuts through both problems is the <strong>effect size</strong> — the magnitude of a difference in units a human can judge.</p>

<h2>The effect sizes an auditor actually uses</h2>
<ul>
<li><strong>Raw difference in rates.</strong> Selection rate A minus selection rate B. "Group B is selected 9 percentage points less often." Immediately meaningful — lead with it.</li>
<li><strong>The impact ratio.</strong> Rate B ÷ Rate A (BTM Day 35). Effect size with a legal threshold attached (0.80).</li>
<li><strong>Risk ratio / odds ratio.</strong> "Group B is 1.6× as likely to be falsely flagged." Multiplicative framing; powerful for error-rate disparities.</li>
<li><strong>Cohen's h / d.</strong> Standardized effect sizes for proportions/means; useful when comparing effects across different metrics or studies (rules of thumb: ~0.2 small, ~0.5 medium, ~0.8 large — context always overrides).</li>
</ul>
<pre><code>rates = df.groupby(<span class="st">"group"</span>)[<span class="st">"approved"</span>].mean()   <span class="cm"># e.g. A: 0.42, B: 0.33</span>
<span class="kw">print</span>(<span class="st">"difference:"</span>, rates.max() - rates.min())   <span class="cm"># 0.09 -> 9 points</span>

<span class="cm"># impact ratio: LEAST-selected group over MOST-selected group,</span>
<span class="cm"># so the ratio can never exceed 1.0 and quietly hide a disparity</span>
<span class="kw">print</span>(<span class="st">"impact ratio:"</span>, rates.min() / rates.max())  <span class="cm"># 0.786 -> below 0.80</span>
<span class="kw">print</span>(<span class="st">"risk ratio:"</span>, fpr_b / fpr_a)                <span class="cm"># e.g. 1.6x the false-positive risk</span></code></pre>
<p>Note the denominator discipline you learned in BTM Day 35: always divide the <em>least</em>-selected group's rate by the <em>most</em>-selected group's rate. Pairing two groups arbitrarily can produce a ratio above 1.0, which reads as "no problem" while a disparity sits in the other direction. In Phase 5 this becomes the legally-published number, so the habit matters.</p>

<div class="box an"><div class="bt">◆ Analogy</div><p>A p-value answers "is the smoke real?" An effect size answers "how big is the fire?" A fire department that dispatched trucks based only on whether smoke was statistically confirmed — never on how large the blaze was — would be absurd. So is a bias report that stops at p &lt; 0.05. Confirm the smoke, then <em>measure the fire</em>.</p></div>

<div class="box hl"><div class="bt">▲ The professional reporting sentence</div><p>Fuse the last three days into one sentence pattern you'll use for the rest of your career: <em>"Group B's selection rate is 9 points lower (impact ratio 0.79, 95% CI [0.71, 0.86], p = 0.004)."</em> Magnitude, legal framing, uncertainty, and significance — one line, fully defensible. Every finding in your Phase 4–6 assessments gets stated in this shape.</p></div>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>Practical significance is also where remediation priorities come from. Two findings can both be "statistically significant" while one is a 0.5-point curiosity and the other a 12-point harm. Risk-ranking findings by effect size (weighted by who bears them) is how a real assessment decides what gets fixed first — statistics informs, magnitude prioritizes.</p></div>

<h2>Today's takeaway</h2>
<p>Effect sizes state magnitude in human units — differences, ratios, standardized measures — and drive prioritization. The reporting sentence: effect + ratio + CI + p. Tomorrow: measuring how much a <em>distribution</em> has shifted — PSI and KL divergence, the mathematics of drift.</p>
`,
quiz:{q:"Why must an audit finding report effect size and not just a p-value?",options:["Effect sizes are computationally cheaper to obtain, which matters when a battery spans many groups and metrics","P-values carry no legal standing in a bias audit, so a finding that reports one will be disregarded by regulators","A p-value says only that a difference is unlikely to be chance; the effect size states how large it is — driving severity","Regulators assess disparities qualitatively, so statistical framing of any kind adds little to the finding itself"],answer:2,explain:"Significance and importance are different axes: huge samples make trivial gaps 'significant,' and magnitude is what determines harm and priority. The professional sentence carries both: effect size + ratio + CI + p."}},

{n:7,title:"PSI and KL Divergence — The Mathematics of Drift",read:"Lesson · 16 min read",body:`
<p>BTM Day 57 warned you that models rot as the world shifts under them. Today you get the instrument that <em>detects</em> the shift: distribution-distance metrics, chiefly the industry workhorse <strong>PSI</strong> (Population Stability Index) and its theoretical parent <strong>KL divergence</strong>.</p>

<h2>The question: has the incoming data changed?</h2>
<p>At training time, applicant incomes had some distribution. Six months into production, incomes arriving at the model have another. How different are the two? Not "did the mean move" — the whole <em>shape</em> can shift while the mean sits still. You need a number that compares distributions.</p>

<h2>PSI: the banker's drift gauge</h2>
<p>PSI bins the feature (say, 10 income bands), computes the share of data in each bin then vs now, and sums a weighted log-difference across bins:</p>
<pre><code><span class="kw">def</span> <span class="fn">psi</span>(expected, actual, bins=10):
    cuts = np.percentile(expected, np.linspace(0, 100, bins+1))
    cuts[0], cuts[-1] = -np.inf, np.inf
    e = np.histogram(expected, cuts)[0] / len(expected)
    a = np.histogram(actual,   cuts)[0] / len(actual)
    e, a = np.clip(e, 1e-6, <span class="kw">None</span>), np.clip(a, 1e-6, <span class="kw">None</span>)
    <span class="kw">return</span> np.sum((a - e) * np.log(a / e))</code></pre>
<p>Rules of thumb the industry runs on: <strong>PSI &lt; 0.10</strong> — stable; <strong>0.10–0.25</strong> — moderate shift, investigate; <strong>&gt; 0.25</strong> — major shift, revalidation warranted. Compute it per feature <em>and</em> on the model's output scores.</p>
<p>Now the part that separates an analyst from a dashboard: treat these as <em>starting heuristics, not thresholds of model validity</em>. They have no theoretical derivation. The number moves with your binning strategy, bin count, sample size and choice of baseline window — the same shift cut into ten bins instead of twenty can land on the other side of a line. So in an assessment you calibrate them per model and per feature against observed performance decay and the business consequence of being wrong, then <strong>fix them in writing before deployment</strong> so nobody renegotiates the tripwire at the moment it fires. What makes a threshold defensible is that it was pre-committed and reasoned, not that it equals 0.25.</p>

<h2>KL divergence: the idea underneath</h2>
<p><strong>KL divergence</strong> measures how surprised you'd be seeing data from distribution B if you expected distribution A — the information lost by assuming the world hasn't changed. PSI is essentially a symmetrized, binned cousin of KL built for tabular monitoring. You'll meet KL again in ML papers constantly; when you do, hear "distribution mismatch, measured in surprise."</p>

<div class="box an"><div class="bt">◆ Analogy</div><p>PSI is a river gauge for data. You marked the water levels across the riverbed on the day you built the bridge (training). The gauge keeps comparing today's levels to the marks. Small deviation — weather. Sustained PSI above 0.25 — the river has rerouted, and a bridge engineered for the old channel needs re-inspection <em>now</em>, not at the annual review.</p></div>

<div class="box wa"><div class="bt">■ Drift is a fairness instrument too</div><p>Run PSI <em>per demographic group</em>. The world often shifts unevenly (BTM Day 57): a gig-economy boom reshapes income distributions for younger applicants first; a policy change hits one region's data. Aggregate PSI can read "stable" while one group's inputs have transformed — meaning the model is silently degrading for exactly them. Group-wise PSI is a monitoring control you can propose in any assessment, and almost no one does it. Differentiator.</p></div>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>Your Phase 4 model risk assessment's monitoring section will specify: which features are monitored, with what metric (PSI), at what thresholds (0.10/0.25), at what cadence, per group, with what escalation when breached. That's a complete, auditable monitoring control — NIST MANAGE and ISO 42001's ongoing-operation clauses made concrete. You now own the math inside it.</p></div>

<h2>Today's takeaway</h2>
<p>PSI compares binned distributions then-vs-now (0.10/0.25 as starting heuristics, calibrated per model and pre-committed); KL is the underlying surprise measure; run both per group, on inputs and scores. Tomorrow: calibration mathematics — testing whether the model's probabilities still mean what they say.</p>
`,
quiz:{q:"Aggregate PSI on all features reads 0.06 ('stable'), but you compute PSI per group and find 0.31 for applicants under 30. What does this mean?",options:["The per-group figure must be an artifact, since a stable aggregate mathematically bounds every subgroup's PSI","PSI is defined only over a full population and cannot be validly computed within demographic subgroups","Nothing actionable: aggregate stability is the monitoring signal, and subgroup variation around it is expected","That group's inputs have shifted sharply while blending into a calm aggregate — the model is likely degrading for them"],answer:3,explain:"Drift is often uneven; a big shift in one group can dilute into a calm aggregate. Group-wise PSI above 0.25 signals the model's assumptions may no longer hold for that population — a silent fairness decay that aggregate monitoring misses entirely."}},

{n:8,title:"Calibration Math — Brier Scores & Reliability Curves",read:"Lesson · 15 min read",body:`
<p>BTM Day 33 taught calibration as a fairness concept: a "70%" should mean 70% for everyone. Today you get the instruments to <em>measure</em> it: the <strong>reliability curve</strong> you can show an executive, and the <strong>Brier score</strong> you can put in a table — plus the decomposition that stops you misreading it.</p>

<h2>The reliability curve: predicted vs actual</h2>
<p>Bin predictions by their stated probability (all the ~10% predictions, all the ~20% predictions, ...) and, in each bin, compute how often the outcome actually happened. Plot predicted (x) against actual (y):</p>
<pre><code><span class="kw">from</span> sklearn.calibration <span class="kw">import</span> calibration_curve
prob_true, prob_pred = calibration_curve(y_test, probs, n_bins=10)
plt.plot(prob_pred, prob_true, marker=<span class="st">'o'</span>)
plt.plot([0,1], [0,1], <span class="st">'--'</span>)   <span class="cm"># the perfect-calibration diagonal</span></code></pre>
<p>Points on the diagonal: honest probabilities. Curve sagging below: <strong>overconfidence</strong> (its "80%" events happen 60% of the time). Bowing above: underconfidence. This one plot is among the most persuasive artifacts you can put in an assessment, because a non-technical reader instantly sees "the model's stated confidence is inflated."</p>

<h2>The Brier score: overall probability quality — <em>not</em> calibration alone</h2>
<p>The <strong>Brier score</strong> is the mean squared error between predicted probabilities and actual 0/1 outcomes — lower is better, 0 is perfect:</p>
<pre><code><span class="kw">from</span> sklearn.metrics <span class="kw">import</span> brier_score_loss
<span class="kw">print</span>(brier_score_loss(y_test, probs))   <span class="cm"># e.g. 0.142</span></code></pre>
<p>Here is the part most courses get wrong, and it matters for how you use the number. Brier is a <strong>proper scoring rule</strong> measuring overall probabilistic accuracy, not a clean calibration measure. Murphy's decomposition splits it into three parts:</p>
<p style="text-align:center"><strong>Brier = reliability − resolution + uncertainty</strong></p>
<ul>
<li><strong>Reliability</strong> — the calibration component: how far predicted probabilities sit from observed frequencies. Lower is better.</li>
<li><strong>Resolution</strong> — how much the predictions actually separate high-risk from low-risk cases. Higher is better, and it <em>subtracts</em>.</li>
<li><strong>Uncertainty</strong> — the base rate's own variance, <code>p(1−p)</code>. Nothing about the model. It depends only on how common the outcome is.</li>
</ul>

<div class="box wa"><div class="bt">■ The per-group trap — the reason this section exists</div><p>Your reflex says "compute it per group." Do — but do not read a Brier gap as a calibration gap. <strong>Groups with different base rates have different Brier scores even when both are perfectly calibrated</strong>, because the uncertainty term <code>p(1−p)</code> is maximal near a 50% base rate and shrinks toward 0% or 100%. A group with a 10% positive rate can post a flattering Brier of 0.09 while being badly miscalibrated; a group at 50% can post 0.21 while being calibrated beautifully. Reporting "Brier 0.13 vs 0.21, therefore group B gets less trustworthy probabilities" is a confounded finding — and exactly the kind an opposing expert takes apart.</p><p>So: use the <strong>reliability curve per group</strong>, or a decomposed reliability term, or Expected Calibration Error, as your calibration-fairness evidence. Use per-group Brier as a summary of overall probability quality, always reported <em>beside each group's base rate</em> so the reader can see the confound you have already accounted for.</p></div>

<div class="box an"><div class="bt">◆ Analogy</div><p>Forecasters are graded this way, and the same trap applies: predicting rain in Phoenix is easier than in London, so a Phoenix forecaster's Brier score looks better regardless of skill. You cannot rank two forecasters by Brier across different climates — the climate (the base rate) is inside the number. Compare within a climate, or decompose. The reliability curve is the report card that isolates honesty; the Brier score is a GPA that mixes honesty, sharpness, and how hard the exam was.</p></div>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>Miscalibration is a governance issue whenever a <em>threshold on the probability</em> gates a decision (BTM Day 14 — which is nearly always). If the model's "0.50" really behaves like a 0.35, the policy everyone approved is not the policy running in production. And per-group miscalibration means the same threshold silently applies different real standards to different groups. Your Phase 4 assessment will test calibration overall and per group as a standard MEASURE-function item; today you learned its two instruments.</p></div>

<h2>Today's takeaway</h2>
<p>Reliability curves visualize honesty of probabilities (diagonal = truthful); Brier summarises overall probability quality but decomposes into reliability &minus; resolution + uncertainty, so a per-group Brier gap is base-rate confounded — use per-group reliability curves or ECE for calibration-fairness claims, and report Brier beside each group&rsquo;s base rate. Tomorrow: the math inside the explainability tool you'll use most — Shapley values.</p>
`,
quiz:{q:"A model's reliability curve sags well below the diagonal in the high-probability bins. What is it telling you, and why does it matter for governance?",options:["The model is overconfident — its 80% events occur far less often — so thresholds enforce an unapproved policy","The model is underconfident, and its stated probabilities should be scaled upward before a threshold is applied","The plot is misconfigured, since a correctly computed reliability curve usually tracks the diagonal","It affects regression outputs only, so a classifier's decision threshold is unaffected by the curve's shape"],answer:0,explain:"Below-diagonal means predicted probabilities exceed observed frequencies: inflated confidence. Since thresholds gate decisions on those stated probabilities, miscalibration quietly changes the operating policy — and per-group miscalibration applies different real standards to different people."}},

{n:9,title:"Shapley Values — The Math Inside SHAP",read:"Lesson · 16 min read",body:`
<p>In Phase 2 you'll run SHAP on every serious model you build. Today, before touching the library, you learn the elegant game-theory idea inside it — because an analyst who can <em>explain the explainer</em> can also spot when it's being misread.</p>

<h2>The problem: fair credit for a team result</h2>
<p>A model's prediction for one person is produced by features acting together, interacting (BTM Day 39 — nonlinearity tangles contributions). How do you fairly split the prediction among the features? Lloyd Shapley solved the general version in 1953 for people: how to fairly divide a team's payout among players of unequal contribution.</p>

<h2>The Shapley recipe</h2>
<p>A feature's <strong>Shapley value</strong> is its <em>average marginal contribution across all possible orderings</em> of features joining the prediction:</p>
<ol>
<li>Imagine features entering the model one at a time, in some order.</li>
<li>Each time a feature enters, record how much the prediction moved — its marginal contribution <em>given who's already in</em>.</li>
<li>Average that contribution over <em>every possible order of entry</em>.</li>
</ol>
<p>Averaging over all orderings is the fairness trick: it neutralizes the advantage of "arriving first" or riding another feature's coattails. The result has a property auditors love: <strong>the Shapley values of all features sum exactly to the gap between this prediction and the average prediction.</strong> Full accounting, no leftovers — every point of the score is attributed somewhere.</p>

<div class="box an"><div class="bt">◆ Analogy</div><p>Four colleagues finish a project worth a bonus. Some did more; some only shine in combination. The Shapley answer: consider every order the team could have been assembled, ask what each person added <em>at the moment they joined</em>, and average. The person who adds value in every configuration earns a big share; the one who only echoes others earns little. SHAP does precisely this for features — for one individual prediction at a time.</p></div>

<div class="box wa"><div class="bt">■ What Shapley values are not</div><p>Carry BTM Day 46's discipline forward: Shapley values are a <em>faithful accounting of the model's arithmetic</em>, not the world's causality. A large SHAP value on <code>zip_code</code> means the model leans on zip — it doesn't mean zip causes the outcome, and it doesn't reveal what zip proxies for. And exact Shapley computation is exponential in features, so SHAP uses clever approximations (exact for trees, sampled otherwise) — approximation caveats belong in your methodology section, not swept under the rug.</p></div>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>Knowing the mechanism arms your review questions: "These SHAP values — computed against which background dataset? Exact (tree) or approximated? And you're presenting model-attribution as if it were causal — walk that back." Explainability evidence appears in every modern model risk assessment; you're now equipped to evaluate it rather than admire it, which is the entire posture of this course.</p></div>

<h2>Today's takeaway</h2>
<p>Shapley values fairly split a prediction among features by averaging marginal contributions over all join-orders, summing exactly to the deviation from average — model accounting, not causality. Tomorrow: Phase 1's capstone — you assemble everything into your reusable audit module.</p>
`,
quiz:{q:"What makes the Shapley attribution 'fair,' and what does it still NOT tell you?",options:["It averages each feature's marginal contribution over all join-orders — but explains the model's arithmetic, not causation","It weights each feature by its correlation with the outcome, though it cannot speak to the model's accuracy","It applies only to linear models, and therefore cannot account for interactions between features in an ensemble","It queries the model directly about which features mattered, but provides no way to rank them against each other"],answer:0,explain:"Averaging over all orderings removes arrival-order advantages and yields a complete, exact accounting of the prediction. But it remains attribution within the model: a heavy weight on a proxy feature reveals reliance, not causation — the BTM Day 46 discipline still applies."}},

{n:10,title:"Phase 1 Lab — Your Audit Module (Deliverable #1)",read:"Review + Lab · 15 min read · ~4 hr lab · Portfolio deliverable",body:`
<p>Everything from this phase converges into a single professional artifact: <code>audit_tools.py</code> — your reusable, documented, statistically honest fairness-audit library. You'll import it in every remaining lab of this course, and it goes in your portfolio as evidence you build tooling, not just notebooks.</p>

<div class="box hl"><div class="bt">▲ Phase 1 in one breath</div><p>Functions and modules freeze the audit motions into shared instruments, and tests turn the module's claims into checkable properties (Days 1–2, with classes bundling model + data + methods and fixtures keeping the tests cheap). The bootstrap measures every metric's wobble (3); confidence intervals report it and get read against thresholds (4); p-values quantify surprise but not size, and their abuses — especially underpowered "no bias found" — must be caught (5); effect sizes state magnitude and drive priority (6). PSI/KL detect drift, per group (7); reliability curves measure calibration honesty while Brier summarises overall probability quality with a base-rate confound to disclose (8); Shapley values fairly attribute predictions without claiming causality (9).</p></div>

<h2>Build the module</h2>
<p>In Colab, write <code>audit_tools.py</code> containing a <code>ModelAuditor</code> class with, at minimum, these documented methods — every one of them is something you built by hand this phase:</p>
<pre><code><span class="kw">class</span> <span class="fn">ModelAuditor</span>:
    <span class="st">"""Per-group fairness auditing with uncertainty quantification."""</span>
    <span class="kw">def</span> <span class="fn">__init__</span>(self, model, X_test, y_test, groups): ...
    <span class="kw">def</span> <span class="fn">rates_by_group</span>(self): ...          <span class="cm"># selection rates + impact ratios</span>
    <span class="kw">def</span> <span class="fn">error_rates_by_group</span>(self): ...    <span class="cm"># FPR / FNR per group (BTM 27)</span>
    <span class="kw">def</span> <span class="fn">bootstrap_gap</span>(self, metric, n=2000): ...   <span class="cm"># CI on any group gap</span>
    <span class="kw">def</span> <span class="fn">significance</span>(self, metric): ...    <span class="cm"># proportion test + honest power note</span>
    <span class="kw">def</span> <span class="fn">brier_by_group</span>(self): ...          <span class="cm"># calibration per group</span>
    <span class="kw">def</span> <span class="fn">psi_report</span>(self, X_new): ...       <span class="cm"># drift per feature AND per group</span>
    <span class="kw">def</span> <span class="fn">summary</span>(self): ...                 <span class="cm"># one DataFrame: the audit table</span></code></pre>
<p>Then, in a demo notebook, retrain your BTM Day 24 classifier, point the auditor at it, and produce the <code>summary()</code> table — each gap reported in the full professional sentence pattern: <em>effect, ratio, CI, p</em>.</p>

<div class="box wa"><div class="bt">■ The bar for this deliverable</div><p>Docstrings on every method. A seed parameter anywhere randomness appears (reproducibility is evidence integrity). And your <code>significance()</code> method must refuse to overclaim: when a subgroup is small, its output should <em>say so</em> — e.g., flag "n=58: low power, wide CI, non-significance is not exoneration." Building your own tooling to resist the Day 5 abuses is the mark of an analyst who has internalized them.</p></div>

<h2>Make it provable — the test suite, pinning, and CI</h2>
<p>You called this "reusable audit tooling" on Day 1. Reusable means someone changes it next quarter and the answers stay right. Three artifacts turn that from a hope into a property, and together they take about an hour.</p>

<h3>1. The regression suite</h3>
<p>Extend Days 1–2 into <code>test_audit_tools.py</code> covering every public method: a known-answer test per metric, the invariants (ratios ≤ 1.0, rates in [0,1], PSI ≥ 0), the edge cases (empty group, single-member group, zero selections, a group absent from the new data in <code>psi_report</code>), and the judgement rules (thin n triggers a power warning; a fixed seed reproduces the interval). Then the one that earns the name <em>regression</em> suite:</p>
<pre><code><span class="kw">def</span> <span class="fn">test_golden_summary_unchanged</span>():
    <span class="cm"># Freeze today's known-good output. If a refactor changes any number,</span>
    <span class="cm"># this fails and you must decide: intended improvement, or silent break?</span>
    got = ModelAuditor(FakeModel(), X_fix, y_fix, g_fix).summary().round(4)
    expected = pd.read_csv(<span class="st">"tests/golden_summary.csv"</span>, index_col=0).round(4)
    pd.testing.assert_frame_equal(got, expected)</code></pre>
<p>A <strong>golden file</strong> is the whole idea in one test: the current output, committed, as the thing future changes are diffed against. It cannot tell you the numbers are <em>right</em> — only you can do that, once, carefully. It guarantees they never change without someone noticing, which is the property an audit tool actually needs.</p>

<h3>2. Pin the environment</h3>
<pre><code>!pip freeze &gt; requirements.txt        <span class="cm"># exact versions, committed alongside the code</span>
!python --version                     <span class="cm"># record this in your README too</span></code></pre>
<p>Your Phase 4–6 assessments will all contain a methodology line reading "tools and versions pinned." This file is that line's evidence. Without it, "we recomputed and got a different answer" has no diagnosis — a library minor version changed a default and nobody can prove which.</p>

<h3>3. Run the tests automatically</h3>
<p>GitHub Actions runs your suite on every push. One file, <code>.github/workflows/tests.yml</code>:</p>
<pre><code>name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: <span class="st">"3.11"</span>}
      - run: pip install -r requirements.txt
      - run: pytest -q</code></pre>
<p>Push it and GitHub puts a green check or a red cross on every commit. Add the status badge to your README. A recruiter who opens your repository sees, before reading a line of code, that the tooling is tested and the tests pass — which is a signal almost no portfolio in this field sends.</p>

<div class="box gov"><div class="bt">✦ Why this belongs in a governance course, not just a coding one</div><p>Every framework you will cite asks some version of "how do you know your evidence is reliable?" NIST MEASURE wants documented, repeatable measurement. ISO 42001 wants change control. Supervisory model-risk guidance — SR 11-7 from 2011, replaced in April 2026 by SR 26-2 (Day 33) — expects effective challenge of the tools used in validation, not only of the model. A tested, pinned, continuously-verified audit module is the concrete answer, and it is one you can demonstrate in thirty seconds by opening the repository.</p><p>There is also a self-interested reason. In Phase 5 you will produce numbers that an opposing expert may attack. The question "how do you know your own tooling computes the impact ratio correctly?" is entirely fair, and the answer you want is not "I checked it carefully at the time." It is: "here is the test that asserts it, here is the golden file it is diffed against, and here is the run history showing it has passed on every commit since March."</p></div>

<h2>File Deliverable #1</h2>
<p>Commit <code>audit_tools.py</code>, <code>test_audit_tools.py</code>, <code>test_auditor.py</code>, <code>tests/golden_summary.csv</code>, <code>requirements.txt</code>, <code>.github/workflows/tests.yml</code>, the demo notebook and a <code>WHAT-I-LEARNED.md</code> to <code>taming-the-machine/d10-audit-module/</code> — using the Day 0 Git commands, not the upload button. Confirm the Actions run goes green before you call it done. In the reflection, answer: <em>what does this module standardize, and what judgment does it deliberately leave to the human?</em></p>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>You just built what vendors sell as "responsible AI platforms" in miniature — and you understand every line, which most platform buyers cannot say. In Phases 4–6, when your assessments cite metrics, the methodology section will reference <em>your own instrument</em>. Evidence produced by tooling you built and can defend line-by-line: that's a credibility position very few candidates occupy.</p></div>

<h2>Phase 1 complete</h2>
<p>You have the statistics to make findings defensible and the tooling to make them consistent. Phase 2 turns to the models themselves: gradient boosting mastered properly, calibration repaired, SHAP in anger, transformers fine-tuned on free Colab, and models stress-tested until they confess. See you Day 11.</p>
`,
vocab:[
{term:"Module / class",def:"A .py file of importable functions; a class bundles state (self) with methods — your ModelAuditor."},
{term:"Docstring",def:"In-code documentation; makes audit code legible as evidence."},
{term:"Bootstrap",def:"Resampling your data with replacement to estimate a metric's sampling wobble."},
{term:"Confidence interval",def:"The range of values consistent with your data; read against 0 or 0.80, and check its width."},
{term:"p-value",def:"Probability of a gap this large under the no-difference assumption; says nothing about size."},
{term:"Statistical power",def:"A test's ability to detect a real effect; low power makes 'not significant' meaningless."},
{term:"Effect size",def:"Magnitude in human units — rate differences, impact/risk ratios, Cohen's h/d."},
{term:"PSI",def:"Population Stability Index; binned distribution drift. ~0.10 / 0.25 are heuristics sensitive to binning and sample size — calibrate and pre-commit, run per group."},
{term:"KL divergence",def:"Information-theoretic distribution mismatch; the theory under PSI."},
{term:"Brier score",def:"Mean squared error of probabilities vs outcomes. Proper scoring rule = reliability &minus; resolution + uncertainty, so per-group gaps are base-rate confounded."},
{term:"Reliability curve",def:"Predicted vs actual frequency plot; sagging below the diagonal = overconfidence."},
{term:"Shapley value",def:"A feature's average marginal contribution over all join-orders; model accounting, not causality."}
],
quiz:{q:"Your significance() method flags 'n=58: low power, wide CI' instead of just printing p=0.22. Why is that design choice itself a governance control?",options:["It blocks the commonest audit abuse — reporting an underpowered non-result as no bias found — by refusing to overclaim","It produces a fuller printed output, which reads as more rigorous to reviewers unfamiliar with the test","Small samples are known to contain more bias, so the flag serves as direct evidence of disparity in that subgroup","Python's style conventions require diagnostic context to accompany any statistical value a function returns"],answer:0,explain:"Encoding the Day 5 lesson into the instrument means every future analysis inherits the honesty: thin data yields 'inconclusive — insufficient power,' never false exoneration. Controls built into tooling are stronger than analyst memory."}},
{n:11,title:"Gradient Boosting Mastered — XGBoost & LightGBM",read:"Lesson · 16 min read",body:`
<p>BTM Day 20 introduced ensembles from a distance. Now you drive one properly, because gradient-boosted trees remain the dominant model class for the tabular, high-stakes decisions you'll govern — credit, fraud, claims, hiring. If you audit models for a living, you will audit these weekly.</p>

<h2>How boosting actually works, one level deeper</h2>
<p>Boosting builds trees <em>in sequence</em>, each one trained on the <strong>errors</strong> of the ensemble so far — a gradient-descent step (BTM Day 16) taken in "tree space." Three knobs dominate its behavior:</p>
<ul>
<li><strong>n_estimators</strong> — how many trees. More trees = more correction capacity = more overfitting risk.</li>
<li><strong>learning_rate</strong> — how much each tree's correction counts. Small rate + many trees is the classic stable recipe.</li>
<li><strong>max_depth</strong> — how complex each tree is. Depth 3–6 covers most tabular reality; deep trees memorize.</li>
</ul>
<pre><code>!pip -q install xgboost
<span class="kw">from</span> xgboost <span class="kw">import</span> XGBClassifier
model = XGBClassifier(n_estimators=400, learning_rate=0.05, max_depth=4,
                      early_stopping_rounds=30, eval_metric=<span class="st">"logloss"</span>)
model.fit(X_train, y_train, eval_set=[(X_val, y_val)], verbose=<span class="kw">False</span>)
<span class="kw">print</span>(model.best_iteration)   <span class="cm"># where validation stopped improving</span></code></pre>
<p><strong>Early stopping</strong> is the line to notice: training halts when the <em>validation</em> score stops improving — overfitting control built into the loop, the automated version of reading the curves from BTM Day 41. LightGBM is the same paradigm tuned for speed; the governance profile is identical.</p>

<div class="box an"><div class="bt">◆ Analogy</div><p>Boosting is an editing chain: draft one is rough, editor two fixes its worst errors, editor three fixes what two missed, four hundred editors deep. The learning rate is how much red ink each editor may use. Unsupervised, the chain will eventually "fix" the manuscript into memorizing the reviewer's quirks — early stopping is the publisher saying "it stopped getting better for fresh readers; put the pens down."</p></div>

<div class="box wa"><div class="bt">■ Audit profile of a boosted model</div><p>Everything from BTM Day 20 sharpens here: hundreds of sequential trees are unreadable, so explainability leans entirely on SHAP (Day 14 ahead); the relentless error-correction will exploit proxies and leakage <em>harder</em> than simpler models (it is an optimization bloodhound); and its raw scores are often miscalibrated — a fact so common we give it Day 13. When a team says "it's just XGBoost, standard stuff," your checklist is: early stopping evidence, SHAP on proxies, calibration curve, per-group battery.</p></div>

<div class="box gov"><div class="bt">✦ Governance connection</div><p>Regulated lenders have used boosted models under explainability mandates for years — proof that "black-box family" doesn't end the conversation; it changes the required <em>controls</em> (post-hoc explanation, adverse-action reason codes, per-group testing). Your job is rarely to ban a model class; it's to name the compensating controls its opacity demands and verify they exist. That framing — model class → control requirements — runs through your entire Phase 4 assessment.</p></div>

<h2>Today's takeaway</h2>
<p>Boosting = sequential error-correcting trees; the knobs are count, rate, depth; early stopping is the built-in overfit brake. Its audit profile: SHAP-dependent explainability, proxy-hungry optimization, and miscalibrated scores. Tomorrow: the imbalanced-data problem that most high-stakes deployments actually face.</p>
`,
quiz:{q:"A team hands you an XGBoost model with n_estimators=2000, no early stopping, and no validation curve. What's the immediate concern?",options:["XGBoost degrades numerically beyond a few hundred trees, so the ensemble size alone invalidates these results","Two thousand sequential error-correctors with no validation brake is an overfitting machine — demand the curves first","Nothing of concern: boosting is self-regularizing, so additional trees reliably improve generalization","The learning rate must be fixed at 0.1 for that many estimators, or the sequential corrections compound wrongly"],answer:1,explain:"Boosting keeps 'fixing' errors until it memorizes noise unless validation-based stopping intervenes. No early stopping and no curves means no evidence the model generalizes — the BTM Day 41 gap check, now applied to the model class you'll see most often."}},

{n:12,title:"Imbalanced Learning — Weights, SMOTE, and Honest Choices",read:"Lesson · 16 min read",body:`
