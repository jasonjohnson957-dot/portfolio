quiz:{q:"The capstone is graded on coherence rather than comprehensiveness. What does that standard actually require?",options:["Every test traced to a risk, finding to evidence, recommendation to mechanism, residual to a signature","Producing the largest possible set of documents, so no reviewer can identify an unexamined dimension","Running every test from both courses against the new system, demonstrating the full technical range","Reproducing the structure of the earlier deliverables exactly, so the package reads as internally uniform"],answer:0,explain:"Sprawl with orphaned analysis is the amateur signature; a tight, fully-chained engagement with justified omissions is what senior practice looks like. Coherence is auditability — the property that makes an assessment survive hostile review, which is the whole point of the craft."}}];
const CHEAT={title:"Cheat Sheet",sub:"Taming the Machine · every formula, threshold, and skeleton in one place",body:`
<div class="box hl"><div class="bt">▲ The professional finding sentence</div><p>Every finding you write, in both courses, collapses to this shape: <strong>effect + ratio + interval + significance.</strong> <em>"Group B's selection rate is 9 points lower (impact ratio 0.79, 95% CI [0.71, 0.86], BH-adj. p = 0.004; n=412)."</em> Magnitude, legal framing, uncertainty, evidence strength, denominator. Anything less is an opinion; anything more belongs in the appendix.</p></div>

<h2>Statistics you'll use weekly</h2>
<table class="vocab">
<tr><th>Instrument</th><th>Use it for / read it as</th></tr>
<tr><td>Bootstrap (n≈2000)</td><td>Resample with replacement, recompute metric; the spread is your uncertainty. Works on any metric, including fairness gaps.</td></tr>
<tr><td>95% CI = percentile [2.5, 97.5]</td><td>Values consistent with the data. Check: does it exclude 0 (or 0.80)? How wide is it?</td></tr>
<tr><td>p-value</td><td>Surprise under "no difference." Says nothing about magnitude. Significant ≠ important; not-significant ≠ fair (usually underpowered).</td></tr>
<tr><td>Effect sizes</td><td>Rate difference (lead with it), impact ratio (legal), risk ratio (multiplicative), Cohen's h/d (standardized).</td></tr>
<tr><td>Benjamini–Hochberg</td><td>Multiple-testing correction of choice; controls false-discovery rate. Print the ticket count.</td></tr>
<tr><td>Statistical power</td><td>Ability to detect a real effect. Thin subgroups → low power → "no bias found" is meaningless.</td></tr>
</table>

<h2>Thresholds and constants worth memorizing</h2>
<table class="vocab">
<tr><th>Number</th><th>Meaning</th></tr>
<tr><td>PSI &lt; 0.10 / 0.10–0.25 / &gt; 0.25</td><td>Stable / investigate / major shift — <em>starting heuristics, not validity thresholds</em>. Sensitive to binning, bin count and sample size; calibrate per model and pre-commit in writing. Run per feature AND per group, on inputs and scores.</td></tr>
<tr><td>Impact ratio 0.80</td><td>Four-fifths screening signal for adverse impact (convention, not a codified verdict). Read the whole CI against it.</td></tr>
<tr><td>&lt; 2% category</td><td>LL144 small-category rule: may be excluded from ratios — disclosure of the exclusion and its size is mandatory.</td></tr>
<tr><td>Brier score</td><td>Mean squared error of probabilities vs outcomes; 0 = perfect. Decomposes to reliability &minus; resolution + uncertainty — per-group gaps are base-rate confounded, so use reliability curves / ECE for calibration-fairness claims.</td></tr>
<tr><td>α = 0.05 × 34 tests ≈ 1.7</td><td>Expected false "findings" from an uncorrected 34-comparison battery. Correct, or report the noise floor.</td></tr>
</table>

<h2>Evaluation battery — the standing checklist</h2>
<ul>
<li><strong>Performance:</strong> confusion matrix, precision/recall, ROC-AUC — and out-of-time, not just random split. Report the random-vs-OOT gap.</li>
<li><strong>Calibration:</strong> reliability curve + Brier, overall and per group; recalibrate (Platt/isotonic) after any resampling, then re-verify per group.</li>
<li><strong>Fairness:</strong> selection rates, impact ratios, FPR/FNR, precision, calibration — per group and per intersectional cell, with CIs and BH correction.</li>
<li><strong>Explanation:</strong> SHAP beeswarm (global) + waterfall (local), triangulated with permutation importance and PDPs; perturb top features to verify.</li>
<li><strong>Uncertainty:</strong> abstain band / ensemble disagreement / conformal sets — and where uncertainty pools by group.</li>
<li><strong>Robustness:</strong> perturbation decision-flip rates, per group; gameable-feature scan; edge sweeps; injection probes for LLM components.</li>
<li><strong>Comparison (champion/challenger):</strong> identical data, paired bootstrap on the delta, full scorecard, fairness as a selection gate — not a postscript.</li>
<li><strong>Training hygiene:</strong> early stopping evidence and the train-vs-validation curves; imbalance mechanism named (weights / SMOTE inside folds only / threshold moving) with calibration re-verified after.</li>
<li><strong>Unsupervised systems:</strong> Isolation Forest and friends — flag rates, consequence ladder and resolution friction per group; the contamination rate is threshold policy and needs an owner.</li>
<li><strong>Monitoring:</strong> frozen launch baseline (never rolling), owned thresholds, every alert mapped to a response, fast loop label-free / slow loop backfilled.</li>
<li><strong>Decision-system funnel:</strong> conditional and cumulative impact ratios at every stage (model → reviewer → override → escalation → appeal → decision); override rates by group <em>and direction</em>; appeal filing rates. The tool is one link; disparity compounds along the chain.</li>
</ul>

<h2>Mitigation taxonomy</h2>
<table class="vocab">
<tr><th>Point</th><th>Methods · tradeoffs</th></tr>
<tr><td>Pre-processing</td><td>Reweighing (group ⟂ outcome in training signal). Derivable, model-agnostic, defensible everywhere; modest effect.</td></tr>
<tr><td>In-processing</td><td>Constrained optimization (ExponentiatedGradient), adversarial debiasing. Most powerful; bakes one definition into uninspectable weights.</td></tr>
<tr><td>Post-processing</td><td>ThresholdOptimizer / per-group thresholds. Surgical and auditable; requires group at decision time; legally sensitive in US employment/credit.</td></tr>
<tr><td>Non-model fixes</td><td>Threshold redesign, feature governance, data collection, target redesign, scope restriction, don't-deploy.</td></tr>
</table>
<p><strong>Always:</strong> every mitigation targets one fairness definition and moves others (impossibility theorem). Report the target achieved, the definitions traded, the accuracy price, and who signs.</p>

<h2>Beyond group fairness — know these by name</h2>
<table class="vocab">
<tr><th>Framework</th><th>What it claims · how far you can take it</th></tr>
<tr><td>Individual fairness<br>(Dwork et al., 2012)</td><td>Similar individuals should receive similar predictions. Operationalize with matched-pair exhibits; the similarity metric is itself a value judgment and must be written down and defended.</td></tr>
<tr><td>Counterfactual fairness<br>(Kusner et al., 2017)</td><td>The decision should be unchanged in a world where only the protected attribute differed. Rigorous form needs a causal model; naive column-flipping tests direct use only — state that limit.</td></tr>
<tr><td>⚠ Terminology trap</td><td>Counterfactual <em>fairness</em> = causal framework for classifiers. Counterfactual <em>testing / minimal-pair probing</em> = empirical technique for text models. Never use them interchangeably.</td></tr>
</table>

<h2>Proving your own tooling — the evidence-integrity kit</h2>
<table class="vocab">
<tr><th>Artifact</th><th>What it buys you</th></tr>
<tr><td>Known-answer test</td><td>Hand-computable case asserted against the function. Catches arithmetic errors once, forever.</td></tr>
<tr><td>Invariant test</td><td>Properties that hold for any input — impact ratio &le; 1.0, rates in [0,1], PSI &ge; 0. Encodes the <em>rule</em>, not one result.</td></tr>
<tr><td>Edge-case test</td><td>Empty group, group of one, zero selections, group absent from new data. Where thin-subgroup bugs live.</td></tr>
<tr><td>Judgement-rule test</td><td>Asserts the tool refuses to overclaim — thin n triggers a power warning; a fixed seed reproduces the interval. A policy becomes a control.</td></tr>
<tr><td>Golden file</td><td>Committed known-good output; any change to a number fails the diff. Cannot prove correctness, guarantees nothing changes unnoticed.</td></tr>
<tr><td>requirements.txt</td><td>Pinned versions — the evidence behind the &ldquo;tools and versions pinned&rdquo; methodology line in every assessment.</td></tr>
<tr><td>Population-build SQL</td><td>Committed extraction query with de-duplication rule, date window and row-count ladder. Cross-checked against pandas: two independent computations reconciled is evidence integrity at the data layer.</td></tr>
<tr><td>CI workflow</td><td>Tests run on every push, with a run history. The answer to &ldquo;how do you know your own tooling computes this correctly?&rdquo;</td></tr>
</table>

<h2>Validity evidence — the employer's defense, and your best questions</h2>
<table class="vocab">
<tr><th>Concept</th><th>What it means &middot; how you test or challenge it</th></tr>
<tr><td>Uniform Guidelines<br>29 CFR 1607</td><td>Source of the four-fifths rule (&sect;4D) <em>and</em> the validity requirement (&sect;5, &sect;14, &sect;15): where a selection process shows adverse impact, the user must hold validity evidence.</td></tr>
<tr><td>Criterion-related validity</td><td>Scores predict/correlate with important elements of job performance. Ask: what criterion, produced by whom, checked for group differences, what effect size?</td></tr>
<tr><td>Content validity</td><td>The procedure's content represents important aspects of the job — a work sample. Ask: what job analysis supports the mapping?</td></tr>
<tr><td>Construct validity</td><td>The procedure measures a characteristic shown important to performance. The Guidelines call it the most complex strategy and set the highest bar.</td></tr>
<tr><td>Reliability</td><td>Consistency of measurement (test&ndash;retest, internal consistency). A ceiling on validity: an unreliable measure cannot be valid. Ask for it <em>first</em>, and ask whether it differs by group.</td></tr>
<tr><td>The criterion problem</td><td>Criterion is usually supervisor ratings, which carry their own bias &mdash; BTM Day 32's label-trust problem in a lab coat. High criterion validity against a biased criterion is a warning, not a defence.</td></tr>
<tr><td>Differential prediction<br>(Cleary model)</td><td><code>perf ~ score * C(grp)</code>. Intercept difference = systematic over/under-prediction at equal scores. Slope difference = the score means different things per group (construct problem; no threshold fix).</td></tr>
<tr><td>Measurement invariance</td><td>Does the instrument measure the same construct on the same scale across groups? The psychometric ancestor of Phase 3's fairness metrics, by ~50 years.</td></tr>
</table>

<h2>Root-cause mechanism checklist</h2>
<p>Representation thinness → collect data. Proxy pathways → feature governance + mitigation. Label history → target redesign (deepest, most dodged). Measurement gaps → feature engineering per context. Threshold placement → threshold redesign with an owner (cheapest, most available). Pipeline artifacts → engineering correction + revalidation. <em>Remedy inherits diagnosis.</em></p>

<h2>Assessment skeletons</h2>
<div class="box tmpl"><div class="bt">▤ Model Risk Assessment (NIST AI RMF spine)</div><p>1 Exec summary (verdict-first, written last) · 2 System description &amp; scope (7 fields, exclusions, tier, independence) · 3 Methodology (pre-specified plan, tools/versions, limitations) · 4 Risk identification — MAP (stakeholders, failure catalogue) · 5 Measurement — MEASURE (risk→test map, fixed-format findings) · 6 Controls — GOVERN (7 families; a control-gap table rating each Adequate/Partial/Absent, evidence-cited) · 7 Treatment — MANAGE (the four treatments — mitigate, avoid, transfer, accept — residual risk re-scored, signed acceptance with conditions) · 8 Appendices (register, monitor config, notebooks).</p></div>
<div class="box tmpl"><div class="bt">▤ Model Bias Assessment (LL144 standard)</div><p>1 Independence statement · 2 Scope (categories: sex / race-ethnicity per EEO-1 / intersections; window; unknown bucket; 2% exclusions disclosed; outcome definition) · 3 Methodology (pre-specified, ticket count, corrections) · 4 Legal core (selection or median-based scoring rates → impact ratios vs most-selected category, with n's) · 5 Extended battery (FPR/FNR, precision, calibration, stability, matched pairs — labeled core vs extended) · 6 Root cause (7 mechanism families incl. construct invalidity) · 7 Validity-evidence review + LDA search + sequenced remediation · 8 Limitations + appendices. <strong>Plus</strong> the public summary — reconciled digit-for-digit.</p></div>
<div class="box tmpl"><div class="bt">▤ Responsible AI Assessment (ISO 42005 / MS-RAI / Canada AIA)</div><p>1 Exec summary (impact level + recommendation) · 2 System profile (+ declared supply-chain inheritances) · 3 Intended uses, one pass each (+ boundaries) and foreseeable-use register (capability/automation/adversarial creep) · 4 Stakeholders, harms (5 families, pathway column), benefits at equal rigor · 5 Impact level rubric → obligations ladder · 6 AIMS linkage / mini-SoA · 7 Mitigations (technical, procedural, communicative, structural) with verification methods · 8 Reassessment triggers &amp; cadence · 9 Limitations + appendices.</p></div>

<h2>Keeping this current — the maintenance calendar</h2>

const INTERVIEW={title:"Interview Prep",sub:"65 questions with in-depth answers · every answer ties back to specific days in both courses",body:`
<div class="box hl"><div class="bt">▲ How to use this</div><p>These are the questions that actually get asked for AI governance, model risk, and AI assurance roles — in four categories: <strong>Technical</strong> (can you do the math?), <strong>Governance &amp; Frameworks</strong> (do you know the machinery?), <strong>Scenario</strong> (what would you do?), and <strong>Behavioral</strong> (how do you operate?). Don't memorize the wording — memorize the <em>structure</em> of each answer, then say it in your own voice with your own portfolio as the evidence. Every answer names the days that trained it, so you can go re-read the source when an answer feels thin.</p></div>
<div class="box wa"><div class="bt">■ The universal answer pattern</div><p>For technical: <em>definition → why it matters for governance → the failure mode → what you'd check.</em> For scenario: <em>clarify → what I'd measure → what I'd escalate → how I'd document.</em> For behavioral: situation, action, result — and for a portfolio candidate, your deliverables are legitimate situations. Say "in my portfolio work" rather than implying employment; the honesty lands better than the inflation (Day 59).</p></div>
`,items:[

{cat:"Technical",q:"Explain the difference between a p-value and an effect size to a non-technical stakeholder.",a:"<p>A p-value answers 'could this difference be a coincidence?' An effect size answers 'how big is it, and does it matter?' I'd use the smoke-and-fire framing: the p-value tells you the smoke is probably real; the effect size tells you whether it's a candle or a house fire.</p><p>The governance consequence is that they fail in opposite directions. With a very large sample, a trivial half-point gap becomes 'statistically significant' — technically true, practically meaningless. With a small subgroup, a large real gap can miss significance entirely, and reporting that as 'no bias found' is the single most common statistical abuse in bias auditing. That's why every finding I write carries both, plus a confidence interval: 'nine points lower, impact ratio 0.79, CI [0.71, 0.86], adjusted p = 0.004.'</p>",tie:"BTM Day 35 · TTM Days 5–6"},

{cat:"Technical",q:"What is the bootstrap, and why would you use it in a fairness audit?",a:"<p>The bootstrap estimates how much a metric would wobble if you'd drawn a different sample. You resample your own data with replacement a couple thousand times, recompute the metric each time, and the spread of those values is your uncertainty. Percentiles of that distribution give you a confidence interval.</p><p>In fairness work it's essential because the metrics that matter most are computed on the smallest groups. A nine-point gap on a 400-person test set might be robust or might be noise, and you cannot tell from the point estimate. Bootstrapping tells you whether the gap persists across resamples. It also upgrades threshold comparisons: instead of 'the impact ratio is 0.74,' I can say whether the entire interval sits below 0.80 — a clear signal — or straddles it, which is an inconclusive finding and usually a data-volume recommendation.</p>",tie:"TTM Days 3–4 · applied Days 25, 27, 44"},

{cat:"Technical",q:"Walk me through how SHAP works and what it does not tell you.",a:"<p>SHAP applies Shapley values from cooperative game theory. A feature's contribution to a single prediction is its average marginal effect across every possible order in which features could join — averaging over orderings is what makes the attribution fair, since it removes any advantage from arriving first. The values sum exactly to the difference between that prediction and the average prediction, so it's a complete accounting with no residual.</p><p>What it does not tell you is causation. A large SHAP value on zip code means the model leans on zip code; it says nothing about whether zip code causes the outcome or what it proxies for. It's also approximate for non-tree models, and the values depend on the background dataset you compute against — both belong in a methodology section. In practice I triangulate: if SHAP ranks a feature highly but permutation importance shows no performance drop, that usually means a correlated feature covers for it, and the disagreement is the lead worth chasing.</p>",tie:"BTM Day 46 · TTM Days 9, 14–15"},

{cat:"Technical",q:"What is calibration, how do you measure it, and how do you fix it?",a:"<p>A model is calibrated when its stated probabilities match reality — across all the cases it scored 70%, the event happens about 70% of the time. I measure it two ways: a reliability curve, which bins predictions and plots predicted against actual frequency (points on the diagonal mean honest probabilities; sagging below means overconfidence), and the Brier score, the mean squared error between probabilities and outcomes. I would add the caveat most people skip: Brier is a proper scoring rule, not a pure calibration measure — it decomposes into reliability minus resolution plus uncertainty, so two groups with different base rates get different Brier scores even when both are perfectly calibrated. For a calibration-fairness claim I use per-group reliability curves or ECE, and report Brier beside each group&rsquo;s base rate.</p><p>Fixing it doesn't require retraining. Platt scaling fits a sigmoid correction, isotonic regression fits a flexible monotonic staircase — both learned on held-out data, both preserving the ranking of individuals while correcting what the numbers mean. The governance point is that thresholds gate decisions on those stated probabilities, so if the model's 0.50 behaves like a 0.35, the policy running in production isn't the policy that was approved. And I always verify per group afterward, because one global correction can fix the majority's distortion while leaving a subgroup's probabilities skewed — meaning the same threshold enforces different real standards.</p>",tie:"BTM Day 33 · TTM Days 8, 13"},

{cat:"Technical",q:"How would you detect model drift in production, and what thresholds would you use?",a:"<p>Population Stability Index is the workhorse. You bin a feature using the training distribution, compare the share of data in each bin then versus now, and sum a weighted log-difference. Industry convention reads under 0.10 as stable, 0.10 to 0.25 as a moderate shift worth investigating, and above 0.25 as a major shift requiring revalidation — but I would flag those as starting heuristics rather than thresholds of model validity. They have no theoretical derivation and they move with binning strategy, bin count, sample size and baseline window, so I calibrate them per model against observed performance decay and fix them in writing before deployment. A threshold is defensible because it was pre-committed and reasoned, not because it equals 0.25. KL divergence is the information-theoretic parent of the same idea. I compute PSI on input features and on the model's output score distribution.</p><p>Two design points I'd insist on. First, run PSI per demographic group — the world shifts unevenly, so aggregate PSI can read 'stable' while one group's inputs have transformed and the model is silently degrading for exactly them. Second, compare against a frozen launch-time baseline, not a rolling recent window; rolling baselines absorb each increment of drift into the new normal and can watch a model decay to failure without alerting.</p>",tie:"BTM Day 57 · TTM Days 7, 31"},

{cat:"Technical",q:"A team hands you an XGBoost model with excellent accuracy. What's your evaluation plan?",a:"<p>Accuracy first gets set aside — with class imbalance it's often uninformative, so I want the confusion matrix, precision, recall, and per-group error rates. Then a standing battery: check for early stopping evidence and the train-versus-validation curves, since boosting without a validation brake is an overfitting machine; validate out-of-time rather than on a random split and report the gap, because random splits let future patterns leak backward; run the calibration curve, since boosted scores are frequently miscalibrated and any threshold policy depends on them.</p><p>Then explanation and robustness: SHAP triangulated with permutation importance and partial dependence to find proxy reliance and learned cliffs; a perturbation scan measuring what fraction of decisions flip on a realistic 2% input nudge, computed per group because fragility pools near the boundary; and uncertainty handling — what does the system do when it isn't sure? Everything per group, every gap with a confidence interval. That's the gauntlet I built as a portfolio deliverable, so I can show the output rather than describe it.</p>",tie:"TTM Days 11, 14–16, 20, 23–24"},

{cat:"Technical",q:"Explain the fairness impossibility theorem and its practical consequence.",a:"<p>When base rates differ between groups, you cannot simultaneously satisfy demographic parity, equalized odds, and calibration except in degenerate cases. It's arithmetic, not a limitation of current technique — no future algorithm resolves it.</p><p>The practical consequence is that 'make the model fair' is not a specifiable requirement. Someone must decide which definition governs this use case and therefore who absorbs the residual unfairness, and that decision is normative, contextual, and belongs to accountable humans rather than to the modeling team by default. So in my assessments I state which definition was targeted, show what happened to the others, price the accuracy cost, and route the choice to a named signer. Being able to say 'no one can fully fix this; here is the minimized form and here's who accepted it' is far more credible than promising a fairness that's mathematically unavailable.</p>",tie:"BTM Day 34 · TTM Days 26–27, 39"},

{cat:"Technical",q:"What is intersectional fairness analysis and why can't you skip it?",a:"<p>Single-axis analysis compares one attribute at a time. A model can pass on sex and pass on race while a specific intersection — say Black women — is selected at half the rate of the top group, because each marginal is an average across cells and compensating surpluses hide the localized deficit. The gender shades audits of face analysis found exactly this pattern: error rates for darker-skinned women far exceeding what either single-axis gap predicted.</p><p>You can't skip it partly because it's where the worst harms concentrate and partly because it's now legally required — NYC Local Law 144 mandates impact ratios for intersectional sex and race/ethnicity categories. The statistical catch is that crossing attributes collapses cell sizes, so intersectional estimates are simultaneously the most important and least certain numbers in the report. My practice is to compute the full crossing, bootstrap every cell, and report thin cells explicitly as findings — 'n=38, interval too wide for a determination' is a legitimate result and usually a data-collection recommendation, whereas silently dropping the cell is not.</p>",tie:"BTM Day 36 · TTM Days 28, 43–44"},

{cat:"Technical",q:"How do you handle class imbalance, and what governance issues does each approach create?",a:"<p>Three families. Class weights re-price errors in the loss function so missing a rare positive costs more. Resampling changes the training diet — undersampling, oversampling, or SMOTE synthesizing interpolated minority examples. Threshold moving leaves training alone and lowers the decision cut.</p><p>Each drags in a governance issue. Class weights encode 'which error is worse' as a hyperparameter — a values decision hidden in configuration, so I want to know who chose the ratio. Resampling teaches the model a fictional base rate, which distorts output probabilities and mandates recalibration before any threshold means what it says; SMOTE additionally manufactures synthetic people and amplifies whatever skew the sampled minority already had, and it must happen inside training folds only or you've built leakage. Threshold moving is often the most honest because probabilities stay grounded and the tradeoff sits visibly where governance can own it. My audit question isn't 'did you handle imbalance' but 'which mechanism, chosen by whom, with what effect on calibration and each group's error mix.'</p>",tie:"BTM Day 29 · TTM Days 12–13"},

{cat:"Technical",q:"What is the difference between validating training data and validating a deployed model?",a:"<p>Training data validation asks whether the inputs are representative, correctly labeled, free of leakage, and appropriate for the population. Deployment validation asks whether the model behaves acceptably in its actual environment, on its actual population, under its actual thresholds and workflows.</p><p>The gap between them is where most incidents live. A vendor can truthfully say the training data was benchmarked and audited while their model still behaves badly in your context — different population mix, different feature distributions, different threshold, different human workflow around the output. That's why my evaluation always runs on deployment-representative data with out-of-time validation, per-group error analysis, and a robustness scan, rather than accepting upstream data provenance as sufficient. It's also the argument I'd make to a team claiming 'the training data is clean, so the model is safe' — clean inputs don't guarantee clean behavior in an untested environment.</p>",tie:"BTM Days 12, 45 · TTM Days 17, 23"},

{cat:"Technical",q:"How would you test a large language model for bias?",a:"<p>Counterfactual minimal pairs are the core method: construct templates identical except for a demographic signal — swapped gendered terms, name sets associated with different groups — run them through the model with deterministic decoding so results are reproducible, and measure the distribution of output differences. For a classifier that's the score shift; for a generative model it's scored properties of the output like sentiment, length, hedging, or refusal behavior.</p><p>The rigor is in the statistics and the caveats: bootstrap the mean shift, report the interval, state the template count, and acknowledge coverage limits — most probe sets cover binary gendered terms and a couple of name sets, which is far from the space of identities. I did this on a DistilBERT model I fine-tuned myself on movie reviews, where the task data contained no name-outcome pattern at all, which isolates pretraining as the source of any measured shift. That's the supply-chain inheritance problem demonstrated rather than asserted. I'd also test refusal consistency across framings and run injection probes if the model consumes untrusted text.</p>",tie:"BTM Days 52, 55–56 · TTM Days 17–19"},

{cat:"Technical",q:"What is a less discriminatory alternative and how would you search for one?",a:"<p>It's a variant that serves the same business need with materially lower disparity. It matters because US disparate-impact doctrine runs three steps — disparity shown, business necessity defended, and then the practice can still fail if a less discriminatory alternative was available and refused. For algorithms, unlike interviews, that third step is empirically checkable.</p><p>My search constructs a candidate set: a reweighed variant, a threshold-optimized variant, a threshold-redesigned variant if root-cause analysis showed placement effects, a reduced-feature variant with candidate proxies removed, and a simpler-model challenger. Then one table comparing performance and disparity, with paired bootstrap confidence intervals on every delta, evaluated on identical data. The sentence I'm looking for is something like 'this variant is statistically indistinguishable on performance while improving worst-case impact ratio from 0.74 to 0.88.' If it exists, continuing with the baseline becomes a documented, owned choice; if nothing dominates, the search itself evidences the defense. Either way the organization ends up with a position instead of a hope.</p>",tie:"BTM Day 35 · TTM Days 21, 27, 47"},

{cat:"Technical",q:"Your audit runs forty comparisons. How do you avoid manufacturing findings?",a:"<p>At the conventional 0.05 level, each test has a one-in-twenty false-positive rate by construction, so forty comparisons on a perfectly fair model produce about two 'significant' results by luck alone. An audit reporting two uncorrected hits out of forty has reported the noise floor.</p><p>Two controls. Statistically, I apply Benjamini-Hochberg to control the false discovery rate — better suited to audit work than Bonferroni, which is so conservative on thin cells that it can suppress everything, which is its own distortion — and I print the comparison count in the methodology. Procedurally, and this matters more, I pre-specify the analysis plan before touching results: which metrics, which groups, which cells, which correction, which thresholds, committed in writing with a timestamp. Pre-specification is what makes positive findings credible as not-fished and null findings meaningful as not-selectively-framed. It's also the standard I apply when reviewing others' claims, in both directions — a vendor's 'no significant disparities' across forty uncorrected tests and an advocacy report's single dramatic p-value from an exploratory sweep get the same question.</p>",tie:"TTM Days 5, 30, 45"},
{cat:"Governance & Frameworks",q:"How do the NIST AI RMF and ISO/IEC 42001 relate, and where do assessments fit?",a:"<p>They're complements, not competitors. The NIST AI RMF is a voluntary risk framework — it gives you the vocabulary and the functions: GOVERN as the cross-cutting organizational layer, MAP for context and risk identification, MEASURE for testing against trustworthiness characteristics, MANAGE for treatment and monitoring, with roughly seventy-two subcategories and a Playbook offering suggested actions and example evidence outputs. ISO 42001 is a certifiable management-system standard, structured like ISO 27001, that turns governance into an auditable operating system with an Annex A catalogue of AI-specific controls and a Statement of Applicability declaring which apply and why.</p><p>Assessments are the evidence organs connecting them. A model risk assessment structured on the RMF's four functions produces exactly what Annex A's risk and impact-assessment controls require evidence of; ISO 42005's impact-assessment process feeds the management system's planning; the Statement of Applicability indexes where all of it lives. In my portfolio the risk assessment is the container, the bias audit is a deep dive on one risk family to legal standard, and the responsible AI assessment is the context layer that sets proportionate obligations — with a mini-SoA mapping them to control themes.</p>",tie:"TTM Days 33, 50, 54, 57"},

{cat:"Governance & Frameworks",q:"Walk me through the four NIST AI RMF functions with a concrete example of each.",a:"<p>GOVERN is the organizational layer: an AI policy, a named model owner, a named threshold owner, an inventory with consequence-based inclusion, and defined escalation paths. Concretely, in a control assessment I check whether anyone actually owns the decision threshold — surprisingly often nobody does.</p><p>MAP establishes context before measurement: stakeholder mapping in two rings, direct and indirect, and a lifecycle-walked failure catalogue where each entry reads failure, mechanism, affected stakeholder, worst plausible consequence. It has to precede measurement or you get the streetlight effect, assessing whatever your tools happen to output.</p><p>MEASURE runs the tests the map demands, traceably: a risk-to-test map, pre-specified, with findings in a fixed format that trace back to register rows. Concretely, register risk 'proxy reliance' maps to SHAP plus permutation plus PDP triangulation.</p><p>MANAGE prioritizes and treats: four treatment options — mitigate, avoid, transfer, accept — residual risk re-scored honestly after treatment, signed acceptance by someone with authority over the consequences, and continuous monitoring with owned thresholds and mapped responses.</p>",tie:"TTM Days 33, 35–39"},

{cat:"Governance & Frameworks",q:"What does NYC Local Law 144 actually require?",a:"<p>Since July 2023, employers using automated employment decision tools on NYC candidates must commission an annual bias audit by an independent auditor — someone not involved in developing or using the tool and without a financial stake in its success — publish a summary of results, and notify candidates that the tool is being used.</p><p>The audit computes selection rates and impact ratios relative to the most-selected category, across sex categories, race/ethnicity categories from the EEO-1 framework, and their intersections. For tools producing continuous scores there's a scoring-rate construction based on the share of each group scoring above the median. It runs on the employer's real historical usage data where available. Categories under 2% of the data may be excluded from ratio calculations, but the exclusion and the category's size must be disclosed. The published summary must include the audit date, the tool's distribution date, the results, and the data source.</p><p>I'd separate the audit from the compliance object around it, because an audit alone satisfies none of the three duties. The audit must be no more than a year old at the time of use. The summary must be posted clearly and conspicuously. And candidates must receive notice at least ten business days before the tool is used, identifying what the tool assesses and their right to request an alternative selection process. Penalties run $500 to $1,500 per violation, with each day of continued use a separate violation — so the exposure scales with duration, which is why the first task on any engagement is a tool inventory with audit dates, not a computation. Worth adding that jurisdiction follows the candidate: a remote role with one Brooklyn applicant pulls an out-of-state employer into scope.</p><p>One precision point I'd flag: the law mandates computing and publishing the ratios; it doesn't codify 0.80 as a pass/fail line — and the four-fifths convention comes from UGESP, not from LL144. A good audit reports the ratios, flags sub-0.80 as a screening signal, and attaches intervals so readers can distinguish clear signals from inconclusive ones. And I'd note the 2026 context: the December 2025 Comptroller audit found DCWP's enforcement ineffective, DCWP has committed to proactive review, so the operative question has moved from whether an audit exists to whether it survives one.</p>",tie:"BTM Day 35 · TTM Days 42–44, 48"},

{cat:"Governance & Frameworks",q:"Walk me through how you'd determine whether a given tool is an AEDT under LL144.",a:"<p>It's a three-part conjunction and all three have to hold, so I work them in order. First, technique: does it use machine learning, statistical modelling, data analytics or AI — meaning it generates a prediction or classification, and the technique itself identifies the inputs and their relative importance to improve accuracy? Second, use: does it help make an employment decision, hiring or promotion? Third, and this is the one that decides most cases: does it substantially assist or replace discretionary decision-making?</p><p>That third prong is read broadly. If a recruiter is shown an AI-generated score or ranking and routinely acts on it, the tool is substantially assisting even though a human formally decides — the human's technical authority doesn't remove the classification if the decision is driven by the output. What falls outside is a filter executing the recruiter's own stated criterion, plus scheduling automation, document management, and basic search.</p><p>Practically, I'd run this test across a mapped applicant flow rather than a software list, because the exposure is usually not the flagship ATS — it's a screening assessment, a ranking widget, or a sourcing tool nobody thought of as a decision system. And I'd document the negative determinations with their reasoning, because 'we decided it wasn't in scope' is a defensible position only if someone wrote down why.</p>",tie:"TTM Days 34, 43"},

{cat:"Scenario",q:"Given that the EEOC has stepped back from disparate-impact enforcement, why does bias auditing still matter?",a:"<p>Because the enforcement changed and the liability didn't. The EEOC removed its AI technical-assistance guidance in January 2025, Executive Order 14281 directed agencies to deprioritise disparate impact, and by mid-2026 there's a DOJ opinion calling the Commission's disparate-impact guidelines unconstitutional. But Title VII's disparate-impact provision is codified by statute and private plaintiffs can still bring it. UGESP is still on the books — that's where the four-fifths rule actually lives. State disparate-impact liability in New York, California, Illinois, Colorado and Minnesota is untouched. And LL144 is city law that none of it reaches.</p><p>So what actually happened is an inversion of the channel, not a reduction in exposure. Agency enforcement contracted; private litigation and state law expanded. Mobley v. Workday is the case I'd point to — a conditionally certified collective action testing whether liability reaches the vendor, not just the deploying employer.</p><p>The consequence for my work is a change of audience. The report used to be framed as something a regulator might read. Now it's primarily evidence of reasonable care in a private action, read by an opposing expert with discovery rights. That makes the extended battery more important, not less — and it makes documentation discipline, dated recommendations and affirmatively stated limitations the difference between a report that defends a client and one that indicts them.</p>",tie:"TTM Days 40, 42, 48"},

{cat:"Scenario",q:"Your client's audit shows an impact ratio of 0.78 for one intersectional cell with n=34. What do you tell them?",a:"<p>I tell them the honest thing, which is that this cell cannot carry a conclusion in either direction yet — and then I make sure that statement is precise rather than evasive.</p><p>Concretely: 0.78 is below the four-fifths screening convention, so it gets reported and flagged, not dropped. But at n=34 I'd expect the bootstrap interval on that ratio to be wide enough to straddle 0.80, and if it does, the correct finding is 'inconclusive — interval [x, y] spans the screening threshold; sample size insufficient for a determination,' with the n printed right next to it. That's a three-state read, not a pass/fail: entirely below is a clear signal, entirely above is no signal on this metric, straddling is a data-volume finding.</p><p>Two things I would not do. I wouldn't invoke the 2% rule unless the cell genuinely falls under it — 34 of, say, 900 is 3.8% and stays in the ratio calculation. And I wouldn't quietly omit the row, which is the most common abuse in this field and the one that converts an audit into a liability. What I'd recommend instead is concrete: accumulate a longer window before the next annual audit, check whether the same direction of effect appears in the sex and race marginals where n is larger, and treat convergent weak signals across structures as more informative than any single thin cell.</p>",tie:"TTM Days 4, 30, 43–45"},

{cat:"Governance & Frameworks",q:"Walk me through the three pillars of model validation.",a:"<p>Under supervisory model-risk guidance — SR 11-7 from 2011, replaced in April 2026 by SR 26-2 and the parallel OCC and FDIC issuances — model risk management rests on robust development and use, validation and monitoring, and governance with policies and controls. Inside validation itself there are three elements, and those are the ones I work to.</p><p>First, conceptual soundness: is the methodology appropriate for this decision, was variable selection justified on more than availability, are the assumptions documented and tested, and is the model being used for the purpose and population it was built for? That last one is the use test, and repurposing is a more common failure than drift.</p><p>Second, ongoing monitoring: process verification that the thing in production is the thing that was approved, plus performance and stability tracking against a frozen baseline with pre-committed thresholds and a named owner. In my portfolio that is a monitor class with PSI on inputs and per-group fairness metrics, thresholds set before the numbers were seen.</p><p>Third, outcomes analysis: backtesting against realised outcomes, benchmarking against a challenger, and sensitivity analysis. Mine is an out-of-time split with a rolling backtest, a champion-challenger comparison with bootstrapped deltas, and a threshold-and-elasticity sensitivity sweep.</p><p>The distinction I would stress is that the first pillar is the one you cannot automate. The other two produce numbers; conceptual soundness produces a judgment about whether the model should exist in this form, and that is where a validator earns the seat.</p>",tie:"TTM Days 20, 21, 23, 31, 33, 34"},

{cat:"Technical",q:"What is conceptual soundness and how would you actually assess it?",a:"<p>It is the evaluation of whether a model is theoretically and practically appropriate for its intended use, judged on design rather than performance. A model can post an excellent AUC and still fail conceptual soundness, which is why it comes first.</p><p>I work five questions. Methodology fit — is this technique right for the decision, the data volume, and the explainability the use requires? A gradient-boosted ensemble on a few hundred rows for a decision that needs a reason code is a finding before I measure anything. Variable selection — were features chosen on statistical grounds, business grounds, or because they happened to be in the table? That third answer is the honest one surprisingly often, and it is where proxy problems originate. Assumptions — independence, stationarity, sample representativeness — documented and tested, because an assumption nobody wrote down cannot be monitored when it breaks. The use test — is the model applied to the population and purpose it was developed for? A collections model quietly reused for origination is a severe finding with a clean test set. And developmental evidence — what did the owner produce: lineage, alternatives considered and rejected, tuning records, sign-offs? Absent development documentation is itself a finding.</p><p>I did this on my own model and wrote down where the honest answer was that I picked the approach because a curriculum told me to. Interrogating a choice you made yourself is the actual skill.</p>",tie:"TTM Days 33, 34 · BTM Days 8, 20"},

{cat:"Scenario",q:"SR 26-2 excludes generative AI from scope. How would you govern the bank's customer-service LLM?",a:"<p>I would start by being precise about the gap, because it is the whole answer. The April 2026 revised guidance covers traditional models and basic AI applications, and Governor Bowman confirmed in May that generative and agentic systems are out of scope, with an interagency RFI signalled. So there is no supervisory model-risk framework to apply — but there is no exemption from consequences either. Existing obligations do not disappear because the guidance is silent: consumer protection, fair lending, recordkeeping, third-party risk and the bank's own risk appetite all still bind.</p><p>Practically I would govern it under NIST AI RMF and ISO 42001 while borrowing the model-risk discipline that transfers. From the RMF: MAP the failure modes with stakeholders, MEASURE with an evaluation harness rather than anecdotes, GOVERN the controls, MANAGE with owned treatments. From model risk: an inventory entry with a tier, a named owner, pre-committed monitoring thresholds, change control on prompts and model versions, and vendor oversight on the foundation model the bank did not train.</p><p>Then I would document the boundary explicitly — this system is governed under these frameworks because supervisory model-risk guidance does not reach it, here is the mapping, here is what we will revisit when the RFI produces something. Writing that paragraph is itself the deliverable, and it is what stops the answer being either 'it is a model, validate it' or 'it is out of scope, ignore it.' Both of those are wrong.</p>",tie:"TTM Days 33, 34, 50–57"},

{cat:"Behavioral",q:"What is effective challenge, and what makes it fail in practice?",a:"<p>Effective challenge is critical analysis by objective, informed parties who can identify limitations and cause something to change. I think of it as needing three things simultaneously, and it fails whenever any one is missing.</p><p>Incentive: are the challengers rewarded for finding problems, or measured on throughput? A validation team with a closure-rate target will close things. Competence: can they actually evaluate the work? This is the live gap right now, because machine-learning models are roughly half of large-bank inventories and many second-line teams were built to validate regressions — challenge by someone who cannot read the model is theatre. Influence: can they stop or change anything? A finding the business can decline without a record is not challenge, it is correspondence.</p><p>Structurally it lives in the second line of defence, with internal audit in the third line checking that the second is doing its job. What I would add is that the underlying logic is the same one I use in bias auditing, where independence is prescribed by statute rather than expected as an outcome: independence is an engineering control on motivated reasoning, not a claim about anyone's character. People asked to grade their own work grade it generously, reliably, without any intent to deceive. The control exists because the incentive is structural.</p>",tie:"TTM Days 24, 38, 42"},

{cat:"Governance & Frameworks",q:"What changed in the EU AI Act this year, and what didn't?",a:"<p>The headline was that the EU delayed the AI Act, and that's wrong twice. Regulation (EU) 2026/1744, the Digital Omnibus on AI, was published on 24 July 2026 and entered into force on the 27th, six days before the deadline it moved. It deferred the high-risk tier: stand-alone Annex III systems from 2 August 2026 to 2 December 2027, and Annex I systems embedded in regulated products from 2027 to 2 August 2028. National regulatory sandboxes moved to August 2027.</p><p>What did not move is the part people miss. Article 50 transparency obligations applied on 2 August 2026 exactly as scheduled — disclosing AI interaction, labelling AI-generated content. The Article 5 prohibitions and the Article 4 AI literacy duty have applied since February 2025. GPAI provider obligations have applied since August 2025, and the AI Office's enforcement powers over GPAI took effect this August. And the Omnibus added rather than only subtracting: a new Article 5 prohibition on AI generating non-consensual intimate imagery and CSAM, applying 2 December 2026, alongside a grace period to the same date for machine-readable marking on systems already on the market.</p><p>The reason it was deferred matters too — harmonised standards from CEN-CENELEC were behind, Commission guidance was still draft, and Member States hadn't resourced market surveillance. So it's a sequencing delay, not a policy retreat. No substantive obligation was weakened. My practical read is that the inventory and classification work shouldn't pause, because that's the part that takes eighteen months and doesn't depend on standards being final.</p>",tie:"TTM Days 42, 50, 51"},

{cat:"Technical",q:"Provider or deployer — how would you tell, and why does it matter so much?",a:"<p>It matters because the AI Act assigns obligations by role and the sets are very different. A provider develops a system, or has one developed, and places it on the market under its own name — that carries the heavy set: risk management system, data governance, technical documentation, logging, transparency, human oversight design, accuracy and robustness, a quality management system, conformity assessment, registration, post-market monitoring. A deployer uses a system under its own authority and carries a lighter but real set: use per instructions, assign competent human oversight, ensure input data is relevant, monitor, retain logs, inform affected workers, and in defined cases run an Article 27 fundamental rights impact assessment.</p><p>To tell them apart I'd ask: whose name is on it, who decided it should exist, and has anyone modified it? Most organisations are deployers who think they're outside the Act entirely. The interesting cases are the transitions — a deployer becomes a provider by putting its trademark on a high-risk system, making a substantial modification, or changing the intended purpose in a way that makes it high-risk. Fine-tuning a vendor model on internal data, white-labelling a tool for customers, repurposing a screening system for a decision it wasn't sold for: each can silently move you into the heavy set including conformity assessment.</p><p>That's the highest-value thing I can watch for as a junior person, because nobody else in the room is watching for it. It's also the same instinct as the model-risk use test and LL144's substantial-assistance prong — three regimes asking whether what you're doing has quietly changed what you are.</p>",tie:"TTM Days 34, 43, 51"},

{cat:"Scenario",q:"Walk me through classifying a system under Annex III.",a:"<p>I'd work it in four steps. First, is it prohibited? Article 5 rules out social scoring, manipulative techniques, untargeted facial scraping, emotion recognition at work and in education, and from December 2026 the generation of non-consensual intimate imagery and CSAM. If it's prohibited the conversation ends there.</p><p>Second, does it fall in an Annex III area? There are eight: biometrics, critical infrastructure, education and vocational training, employment and worker management, access to essential private and public services including creditworthiness, law enforcement, migration and border control, and administration of justice and democratic processes.</p><p>Third, do the filters apply? A system in an Annex III area isn't high-risk if it performs a narrow procedural task, improves the result of a previously completed human activity, detects decision patterns without replacing human assessment, or does preparatory work — but that exemption is void if the system profiles natural persons, in which case it's always high-risk. A provider claiming the exemption still has to document the assessment and register the system.</p><p>Fourth, what's my role, and therefore what actually follows? I'd write it as a one-page memo: area and reasoning, filter analysis, role, resulting obligations, and what would change the answer — because the classification I'd most expect to be challenged on is the one where a filter is doing the work. I've done exactly this for the model in my portfolio, and I'd rather show you the writeup than describe it.</p>",tie:"TTM Days 50, 51, 53"},

{cat:"Scenario",q:"How would you govern an agentic AI workflow?",a:"<p>I'd start by saying why the usual frameworks don't reach it. Supervisory model-risk guidance explicitly carved generative and agentic systems out of scope in April 2026 with an RFI pending, and the AI Act was drafted around systems that produce outputs rather than systems that take actions. So there's a real gap, and pretending an existing checklist covers it is the wrong answer.</p><p>The reframe that helps: with an agent, the useful question isn't whether the model was accurate, it's which step shouldn't have been permitted and who authorised the permission. That moves the control surface from the model to the action boundary. Concretely I'd want scope binding, so the declared purpose is enforced at the boundary rather than documented and hoped for; tool permissioning at least privilege, because read isn't write and draft isn't send; human checkpoints placed at irreversibility rather than at uniform intervals — where money moves, a message leaves the building, a record changes; action logging that captures the plan and not just the API calls, because a call log tells you what happened and only a plan log tells you why; a kill switch with a named owner and a tested path that works at 2am; and spend and rate limits, which are crude and frequently the control that saves you.</p><p>Then I'd govern it under NIST AI RMF and ISO 42001 since those do reach it, and document the boundary explicitly — this system is governed here because model-risk guidance doesn't reach it, here's the mapping, here's what we revisit when guidance arrives. Writing that paragraph is itself the deliverable.</p>",tie:"TTM Days 33, 50, 57"},

{cat:"Behavioral",q:"You have more intake requests than capacity. How do you triage?",a:"<p>First I'd make sure the queue is a queue — a published intake form, a published turnaround per route, and a visible backlog. Most governance functions lose the organisation's cooperation by being slow and opaque rather than by being strict, and an invisible queue gets routed around, which is worse than a slow one.</p><p>Then I'd triage on consequence rather than on who asked loudest. My rubric is roughly: does the output make or heavily influence a decision about a person, how many people, is it advisory or determinative, does it touch personal or special-category data, and which jurisdictions do the affected people sit in. High goes to full assessment, medium to focused review, low to register-and-monitor. The critical discipline is that low still gets registered — the systems that hurt organisations are the ones nobody wrote down.</p><p>Two things I'd do beyond sorting. I'd look for the pattern: if six teams submit variations of the same use case, the right answer isn't six assessments, it's one pre-approved pattern with guardrails that the seventh team can self-serve. That's how a small function scales. And I'd escalate honestly rather than quietly slipping — if capacity genuinely doesn't meet demand, that's a resourcing decision for someone above me, and the worst outcome is a governance function that silently rubber-stamps to keep up. I'd rather show a backlog than manufacture false assurance.</p>",tie:"TTM Days 34, 53, 58"},

{cat:"Governance & Frameworks",q:"What is a Statement of Applicability and why do auditors open it first?",a:"<p>It's the document listing every Annex A control with four things: whether it applies, the written justification either way, its implementation status, and a pointer to evidence. It's the keystone because it converts a generic control catalogue into this organization's specific, auditable commitments — and because defended exclusions are as visible as implementations, an auditor can walk from claimed governance to demonstrated governance in one artifact.</p><p>Structurally it's the mature form of the control-gap analysis I run inside a risk assessment: expected control versus found control, rated adequate, partial, or absent, with cited evidence. 'Partial' is the honest middle you use constantly — monitoring exists but thresholds are undocumented and unowned. In my portfolio I built a ten-row mini-SoA covering the themes my work evidences: AI policy, roles and accountability, impact assessment process, risk assessment and treatment, bias evaluation, data quality and provenance, transparency to interested parties, human oversight, monitoring, and third-party supply chain.</p>",tie:"TTM Days 38, 54"},

{cat:"Governance & Frameworks",q:"How would you build a model inventory, and what's the inclusion rule?",a:"<p>The inventory is a living register: name, owner, purpose, decision affected, population, data sources, model family, deployment status, last validation date, risk tier. It's the highest-leverage artifact in a governance program because unlisted models get zero of everything else — no assessment, no monitoring, no oversight.</p><p>The inclusion rule has to be consequence-based, not technology-based: if a system's output influences a decision about a person or a resource, it's in. Technology definitions invite escape by rebranding — 'it's just a spreadsheet,' 'it's just flagging for review,' 'it's a vendor tool, not our model.' The flagging dodge is especially common with anomaly detection, where a flag that triggers account freezes or investigations is obviously a decision system regardless of the absence of labels. Then I'd tier at intake — impact on rights and opportunities, decision autonomy, scale — so the depth of assessment is proportionate. Full assessment for high tier, focused review for medium, registered and monitored for low. Proportionality is what makes governance affordable enough to be real.</p>",tie:"TTM Days 22, 34, 53"},

{cat:"Governance & Frameworks",q:"What goes in a model card, and what's its governance purpose?",a:"<p>A model card documents intended use and out-of-scope uses, training data and its provenance, evaluation data, performance disaggregated by relevant groups, ethical considerations, limitations, and version and contact information. The disaggregated performance section is the heart — a single aggregate number is precisely what the card exists to prevent.</p><p>Its governance purpose is transferring knowledge across the boundary between the people who built the system and the people who deploy or are affected by it. Without one, a deploying team makes assumptions about population fit, threshold appropriateness, and failure modes with nothing to check them against. It also creates accountability: writing 'not validated for this population' in advance means later use in that population is a documented deviation rather than an innocent assumption. The corresponding artifact for data is a datasheet — collection motivation, procedure, composition, preprocessing, and known limitations.</p>",tie:"BTM Day 58 · TTM Days 38, 51"},

{cat:"Governance & Frameworks",q:"How does an impact-level scoring system like Canada's AIA work, and why use one?",a:"<p>You score the system on risk dimensions — what it decides, about whom, how autonomously, how reversibly, on what data — and on the mitigations actually in place, then roll the result into one of four impact levels. Each level triggers escalating mandatory obligations: more human oversight up to a human making the final decision, external peer review, notice to affected individuals, explanation and recourse rights, monitoring intensity. Completed assessments are published.</p><p>You use one because prose conclusions invite negotiation and scored levels produce commitments. 'This warrants significant care' can be softened in a meeting; 'this scored Level III on these cited dimensions, and Level III mandates this ladder' can only be changed by visibly mis-scoring a specific dimension. In my own rubric I score eight to ten anchored dimensions — stakes, reversibility, autonomy, breadth, vulnerability, data sensitivity, opacity, harm concentration — and I guard the two gaming vectors: scoring the comfortable intended use instead of the foreseeable real one, and claiming mitigation credit for controls that exist only on paper. Only evidenced controls score.</p>",tie:"TTM Days 34, 53, 55"},

{cat:"Governance & Frameworks",q:"What's the difference between compliance and assurance?",a:"<p>Compliance asks whether the mandated boxes are ticked. Assurance asks whether the thing is actually working as claimed. They diverge constantly, and the gap is where most of my professional value sits.</p><p>The cleanest example is a bias audit. The legally mandated computation — selection rates and impact ratios at one decision point — is a floor. A tool can pass every impact ratio above 0.80 while wrongly rejecting qualified members of one group at double the rate of another, because outcome parity and error parity are different axes. So the honest conclusion from a passing legal core is 'no adverse-impact signal on the mandated screen,' never 'the tool is fair.' My assessments label findings as core versus extended precisely so a reader can see what the law compelled versus what the audit chose to examine. Same logic applies to a Statement of Applicability with implemented controls that no one has verified operate — compliant on paper, unassured in practice.</p>",tie:"TTM Days 45, 48–49, 54"},

{cat:"Governance & Frameworks",q:"When is post-processing bias mitigation legally risky, and what would you recommend instead?",a:"<p>Post-processing methods like per-group threshold optimization require the protected attribute at decision time and make group-based differential treatment explicit. In some contexts that's celebrated as transparent; in US employment and credit contexts it can raise disparate-treatment concerns, so it's the intervention most likely to need legal review before deployment.</p><p>What I'd recommend depends on the diagnosed mechanism, which is why root-cause analysis precedes remediation. If representation thinness drives the disparity, the answer is data collection, not model surgery. If proxy pathways carry group signal, it's feature governance and possibly a reduced-feature variant. If the disparity concentrates at the decision boundary because the threshold sits on one group's density peak, threshold redesign — a single global threshold moved or restructured with an accountable owner — is often the cheapest, most legally comfortable, and most effective fix. If the label itself encodes historical human bias, the deep fix is target redesign, which is the most avoided and often the most important. Reweighing is the pre-processing option that's defensible almost everywhere. I'd present the taxonomy with legal posture noted and route the choice to counsel and an accountable signer rather than making it unilaterally.</p>",tie:"BTM Day 36 · TTM Days 26–27, 46–47"},

{cat:"Governance & Frameworks",q:"What does meaningful human oversight require, beyond having a human in the loop?",a:"<p>'Human in the loop' is a phrase until it's operationally defined. Meaningful oversight needs at least five things: a trigger defining when a case routes to a human — an abstain band on calibrated probabilities, an ensemble-disagreement threshold, a conformal set with more than one option; a reviewer with the information, training, time, and authority to actually overturn; explanation delivered with the case so the reviewer isn't rubber-stamping a score; override logging; and monitoring of override rates, per group.</p><p>That last one is where oversight quietly dies. Automation bias means reviewers converge on agreeing with the system, so an override rate collapsing toward zero is a tripwire that oversight has become ceremonial. And unequal review quality across groups converts unequal model certainty into unequal human error — the model is least sure about data-thin populations, so if their cases route to humans who are equally rushed, the oversight isn't compensating for anything. In my assessments the oversight control is rated adequate, partial, or absent with evidence, and 'partial: routing exists, override rates unmonitored' is the most common honest rating.</p>",tie:"BTM Day 59 · TTM Days 16, 38, 52"},

{cat:"Governance & Frameworks",q:"How would you govern a third-party or vendor AI system you can't inspect?",a:"<p>You shift from inspecting the model to inspecting the evidence and the contract, and you make up the difference with your own black-box testing. Three layers.</p><p>First, evidence demands: what evaluations did they run, on what populations, with what disaggregation, using what definitions? A vendor fairness claim without per-group breakdowns, sample sizes, and confidence intervals is unfalsifiable — 'no statistically significant disparity' over a subgroup of sixty people is silence, not exoneration. Second, contract terms: audit and evidence-access rights, incident notification, model-change notification (a silent retrain invalidates your validation), and data-use limits. Third, your own testing: you can always evaluate outputs on your population — per-group performance, calibration, counterfactual probes, stress tests — even without weights. That's why I made a point of standing up open models and probing them; the skill transfers directly to black-box vendor evaluation.</p><p>Then in the assessment, the vendor component appears as a declared supply-chain inheritance in the system profile with its verification status stated honestly.</p>",tie:"BTM Day 45 · TTM Days 17–19, 38, 51"},

{cat:"Governance & Frameworks",q:"What's the purpose of publishing bias audit results, and what's the risk?",a:"<p>The purpose is accountability through standardization and sunlight: everyone computes the same metrics the same way, results go on a public page annually, and candidates, journalists, regulators, and competitors can all read them. It's the same architecture as restaurant health grades — a standardized placard that must reconcile with the full inspection report behind it.</p><p>The risk is Goodhart's law operating on the audit itself. Once impact ratios are the published number, organizations have an incentive to manage that number while unpublished dimensions — error-rate fairness, calibration, stability — drift unwatched. My counterweights are to run the extended battery and make it findable, to wire the unpublished dimensions into monitoring with owned thresholds, and to include a plain-language paragraph in the public summary stating explicitly that impact ratios are a screening indicator rather than a complete fairness determination. An auditor who anticipates the gaming of their own instrument is doing the full job.</p>",tie:"BTM Day 13 · TTM Days 42, 45, 48"},

{cat:"Scenario",q:"A product team wants to deploy a hiring screener next month. What do you do first?",a:"<p>I'd start by scoping rather than testing, because measurement without context produces the streetlight effect. First conversation establishes: what decision does this make or influence, is it advisory or determinative in practice, what population and volume, what's the data lineage, and what happens to someone the tool screens out — is there a human review, an appeal, a notice?</p><p>That gives me a tier. A hiring screener touching livelihood at scale is high tier, which means a full assessment and, if NYC candidates are in scope, a legally required independent bias audit with published results — so the very first practical thing I'd surface is whether the timeline accommodates that, because it's non-negotiable and it has a lead time.</p><p>Then MAP before MEASURE: stakeholder map, failure catalogue, and a pre-specified analysis plan. Then the battery — per-group selection rates and impact ratios including intersections, error rates with the moral asymmetry noted since a false negative here is a qualified person wrongly rejected, calibration, stability, proxy triangulation. In parallel I'd audit controls, because the gaps are usually organizational: who owns the threshold, who can halt it, is there an appeal path, is anyone monitoring override rates. My deliverable would be a conditional recommendation with owned, dated conditions rather than a yes or no.</p>",tie:"TTM Days 34–37, 42–45, 58"},

{cat:"Scenario",q:"You find a significant fairness gap two days before a launch the CEO has announced. What now?",a:"<p>I'd separate three things fast: what I actually know, what it implies, and what the options are — then present rather than decide, because the deployment decision isn't mine.</p><p>What I know: the magnitude with its confidence interval, whether it survives multiplicity correction, and which mechanism the evidence points to. Mechanism matters enormously here because it determines whether a two-day fix exists. If root cause is threshold placement, that's potentially fixable before launch with a threshold change and a revalidation. If it's proxy reliance or label history, it isn't.</p><p>Then I'd frame options honestly: launch as-is with the residual risk documented and signed; launch with a scope restriction — narrower population, advisory-only, or a human review gate on the affected segment; delay; or launch with the fix if one is genuinely available and testable in time. Each option gets its exposure and cost stated. The thing I would not do is soften the finding to fit the timeline, and the thing I'd insist on is that whichever option is chosen gets an accountable signature with conditions and a review date. My job is that the decision is made with the evidence in front of the person authorized to make it.</p>",tie:"TTM Days 39–40, 46, 58"},

{cat:"Scenario",q:"A vendor claims their model is 'unbiased and fully audited.' How do you evaluate that claim?",a:"<p>I'd treat it as a hypothesis and ask for the artifacts. Six questions: which fairness definition did you test, since a model can be balanced on one and badly skewed on another; which groups and which intersections; what sample sizes per group; what confidence intervals; how many comparisons and were they corrected; and who performed the audit and what was their relationship to you?</p><p>The most common failure I'd expect is an underpowered non-result presented as exoneration — 'no statistically significant disparity' computed over subgroups of a few dozen people, where the confidence interval is wide enough to include serious harm. That's silence, not evidence of fairness. The second most common is testing only demographic parity while error-rate disparities go unexamined.</p><p>Then, regardless of their evidence, I'd run my own evaluation on our population, because their audit — even a good one — was performed on their data in their context. I don't need model internals to do that: per-group performance, calibration, counterfactual probes, and stress tests all work black-box. And I'd want contract terms giving us evidence access, incident notification, and notice of model changes, since a silent retrain invalidates everything we validated.</p>",tie:"BTM Day 45 · TTM Days 5, 19, 38, 45"},

{cat:"Scenario",q:"Six months after deployment, monitoring shows performance is stable but fairness metrics are drifting. What's your investigation?",a:"<p>Stable aggregate performance with drifting fairness is a classic pattern, and it usually means the world is shifting unevenly across groups while the majority — who dominate the aggregate — remain well-served.</p><p>My first check is PSI per feature per group against the frozen launch baseline. Aggregate PSI can read calm while one group's input distribution has transformed. If I find group-specific input drift, that's the explanation and the remedy is revalidation and likely retraining with attention to that population. If inputs are stable, I'd look at outcome drift — has the base rate changed for one group, which would move calibration and error rates even with a fixed model — and at threshold effects, since a shifting score distribution moves people across a fixed cut asymmetrically.</p><p>I'd also check the operational layer, which monitoring often misses: has the human override rate changed, has case mix changed upstream, has a feature's collection process quietly changed meaning? Then, whatever the finding, this is a triggered reassessment under the assessment's own terms — a fairness-delta tripwire firing mandates a documented re-run and refreshed sign-off, not just a dashboard note.</p>",tie:"TTM Days 7, 23, 31, 55"},

{cat:"Scenario",q:"An executive says the fairness controls will cost too much and the competitor doesn't do this. How do you respond?",a:"<p>I wouldn't moralize; I'd price it. The response has three parts.</p><p>First, reframe from cost to exposure asymmetry: what does the control cost versus what does the incident cost — regulatory penalties, remediation, litigation, the cost of retrofitting under duress, and the reputational cost of a published audit or a journalist's analysis. Bias audit results are public in some jurisdictions now, which means the comparison isn't 'we do this and they don't,' it's 'their numbers will be visible too.'</p><p>Second, sequence and proportionality: not all controls cost the same. Threshold ownership is a meeting. Activating monitoring on metrics we already compute is small. Those are immediate and cheap. Structural work — data collection, feature governance — is quarterly. Foundational work like target redesign is a year. Presenting a sequenced ladder rather than a monolithic ask usually converts the conversation from whether to when.</p><p>Third, the honest steelman: I'd acknowledge what the system does well and what the status-quo alternative costs, because an assessment that reads as prosecution gets discounted. Then I'd make the ask concrete — a decision, an owner, a date — and if the answer is to proceed without the controls, that becomes signed acceptance of residual risk rather than an unrecorded default.</p>",tie:"TTM Days 39, 47, 53, 58"},

{cat:"Scenario",q:"You're asked to audit a model your close colleague built. How do you handle it?",a:"<p>I'd raise the independence question explicitly and in writing before starting, because independence is a structural control on motivated reasoning, not a comment on anyone's integrity. Financial auditing settled this a century ago: you don't grade work you're entangled with, regardless of how honest you are.</p><p>Practically, I'd propose one of three arrangements depending on what's available: a genuinely independent reviewer performs the audit; I perform it with a defined independent reviewer signing off on findings; or if neither is possible, I perform it and the assessment's independence statement discloses the relationship, who could modify findings, and who could not. Disclosure isn't as good as separation, but it's far better than silent entanglement, and it lets readers weight the document appropriately.</p><p>I'd also do the pre-brief — walk findings to my colleague privately before any room — not to soften them but because a finding that lands publicly on someone who hasn't seen it triggers defense of face rather than engagement with evidence. That habit improves outcomes and costs nothing. And if the engagement is one where independence is legally required, like an LL144 bias audit, then the answer is simply that I'm not eligible and we need an external auditor.</p>",tie:"TTM Days 42, 58"},

{cat:"Scenario",q:"A model flags 8% of one demographic group as anomalous versus 2% overall. Is that discrimination?",a:"<p>Not established, and I'd be careful with the word — my job is to state what's measured and its implications, not to make a legal determination. But it's a serious finding requiring investigation on three axes.</p><p>First, mechanism: anomaly detectors flag statistical rarity, and minority patterns of life are by definition rarer in training data. So the disparity may be the detector faithfully doing what it does, which makes it a design problem rather than a bug — 'unusual' is not 'illegitimate,' and a system that conflates them converts unfamiliarity into suspicion.</p><p>Second, consequences: a flag's harm depends entirely on what follows. Silent secondary review is very different from a frozen account or a referral. I'd map the severity ladder and compute not just flag rates by group but false-flag rates and resolution friction — who bears the burden of proving they're merely uncommon.</p><p>Third, the contamination parameter: someone declared how much anomaly to expect, and that's a threshold policy decision wearing a statistical costume. It has an owner, or it should.</p><p>Then I'd challenge the framing that this system is outside model governance because it 'just flags.' A flag with consequences is a decision system.</p>",tie:"TTM Days 22, 45–46"},

{cat:"Scenario",q:"Leadership wants a single fairness number for the board dashboard. What do you do?",a:"<p>I'd push back on the single number and offer something better, because a scalar fairness metric is a Goodhart trap — whatever gets published gets optimized, and the dimensions left out drift unwatched.</p><p>What I'd offer instead is a small, stable panel: worst-case impact ratio across required categories including intersections, the largest error-rate gap with its direction stated, a calibration indicator, and a monitoring-status light. Four numbers, consistent quarter to quarter, each with a plain-language sentence. That's still glanceable but it can't be gamed by improving one axis.</p><p>If leadership insists on a single headline, I'd propose the worst-case impact ratio, because it's the legally salient one and it's conservative by construction — but I'd attach the standing caveat in the dashboard itself that it measures outcome disparity at one decision point and says nothing about who bears the errors. I'd rather ship an honest four-number panel with caveats than a clean single number that quietly redefines fairness as whatever we chose to display.</p>",tie:"BTM Day 13 · TTM Days 45, 48"},
