    <p style="font-size:13.5px;color:#6b6b68">OWASP Top 10 for LLM Applications &#8212; open-source community security vulnerability catalog from the Open Worldwide Application Security Project (OWASP). Current version: 2025 (v1.1). Available free at owasp.org. Not a certification standard&#8212;a security awareness and guidance resource. Identifies the ten most critical security risks specific to applications built on large language models. Complements (does not replace) OWASP Top 10 Web Application Security Risks&#8212;both lists apply simultaneously to LLM applications. Key insight: LLMs introduce new attack surfaces&#8212;natural language as attack vector, training data risks, non-deterministic behavior, agentic autonomy&#8212;that require a dedicated vulnerability catalog beyond traditional web security.</p>
  </div>

  <div class="cheat-section">
    <h3>The Ten Vulnerabilities&#8212;Quick Reference</h3>
    <div class="control-row">
      <div class="ctrl-card"><b>LLM01&#8212;Prompt Injection (#1)</b><br>Crafted text inputs override instructions, bypass restrictions, or cause unintended actions. Direct (user &#8594; LLM) and Indirect (via retrieved content &#8594; LLM). Root cause: system instructions and user inputs share the same context window. Enables most other attacks.</div>
      <div class="ctrl-card"><b>LLM02&#8212;Sensitive Information Disclosure</b><br>LLMs reveal confidential data from training memorization, system prompts, or context window content. Includes PII/PHI, system prompt contents, cross-user session data, RAG retrieved confidential documents.</div>
      <div class="ctrl-card"><b>LLM03&#8212;Supply Chain</b><br>Third-party model weights, datasets, plugins, and frameworks may be compromised, contain backdoors, or have their own vulnerabilities. Hugging Face model files can execute malicious code. Fine-tuning datasets can introduce backdoors.</div>
      <div class="ctrl-card"><b>LLM04&#8212;Data and Model Poisoning</b><br>Training data or fine-tuning datasets corrupted to introduce backdoors, biases, or malicious behaviors. Poisoning occurs at training time&#8212;baked into model weights, persists across all deployments. Extremely difficult to detect via normal benchmarking.</div>
      <div class="ctrl-card"><b>LLM05&#8212;Improper Output Handling</b><br>LLM outputs used in downstream systems without validation or sanitization. LLM &#8594; SQL without parameterization enables SQL injection. LLM &#8594; HTML without encoding enables XSS. LLM &#8594; shell without sanitization enables command injection. Treat LLM output as untrusted.</div>
      <div class="ctrl-card"><b>LLM06&#8212;Excessive Agency</b><br>LLMs granted more permissions, capabilities, or autonomy than needed. Amplifies every other vulnerability by expanding what an attacker can achieve through manipulation. Critical for agentic AI systems with tool access and autonomous action capability.</div>
      <div class="ctrl-card"><b>LLM07&#8212;System Prompt Leakage</b><br>Confidential system prompt content extracted by users. Reveals business logic, security restrictions, and operational details. Credentials embedded in system prompts (common mistake) are immediately compromised if prompt is extracted. Security must not rely on prompt secrecy.</div>
      <div class="ctrl-card"><b>LLM08&#8212;Vector and Embedding Weaknesses</b><br>Security gaps in RAG architectures: knowledge base poisoning, access control not enforced at retrieval time (users retrieve documents they shouldn&#8217;t access), prompt injection via retrieved documents, embedding model integrity failures.</div>
      <div class="ctrl-card"><b>LLM09&#8212;Misinformation</b><br>LLMs generate plausible but false information (hallucination) that users rely upon for important decisions. High-stakes contexts (medical, legal, financial, government benefits) amplify severity. Misinformation is a security and governance risk, not just a quality issue.</div>
      <div class="ctrl-card"><b>LLM10&#8212;Unbounded Consumption</b><br>Uncontrolled LLM resource usage causing financial harm (Denial-of-Wallet), availability issues, and performance degradation. Attackers craft expensive queries or flood rate limits. Requires rate limiting, cost monitoring, and circuit breakers.</div>
    </div>
  </div>

  <div class="cheat-section">
    <h3>Key Security Principles (Most Critical)</h3>
    <div class="control-row">
      <div class="ctrl-card"><b>Least Privilege</b> &#8212; LLMs access only what they strictly need. Most broadly protective principle across Top 10. Directly addresses LLM06; reduces impact of LLM01, LLM02, LLM05, LLM08.</div>
      <div class="ctrl-card"><b>Human-in-the-Loop</b> &#8212; High-impact and irreversible actions require human approval. The key defense when prompt injection cannot be prevented. Limit what a compromised LLM can actually accomplish.</div>
      <div class="ctrl-card"><b>Treat Outputs as Untrusted</b> &#8212; Validate and sanitize LLM outputs before use in downstream systems exactly as you would user inputs. Addresses LLM05. Parameterize queries, encode HTML, sandbox code execution.</div>
      <div class="ctrl-card"><b>Defense in Depth</b> &#8212; No single control stops all LLM attacks. Layer: input filtering + least privilege + output monitoring + logging + human approval. Multiple overlapping controls reduce both likelihood and impact.</div>
      <div class="ctrl-card"><b>System Prompts &#8800; Security Perimeters</b> &#8212; System prompts can be extracted (LLM07) and overridden (LLM01). Security controls must be implemented at the application layer (real access controls, permission enforcement) not solely in prompt text.</div>
      <div class="ctrl-card"><b>No Credentials in System Prompts</b> &#8212; API keys, database credentials, auth tokens embedded in system prompts are compromised whenever the prompt is extracted. Use secrets management services to inject at runtime.</div>
    </div>
  </div>

  <div class="cheat-section">
    <h3>Attack Types for Prompt Injection (LLM01)</h3>
    <div class="badge-row">
      <span class="badge badge-red">Direct: explicit instruction override (&#8220;ignore previous instructions&#8221;)</span>
      <span class="badge badge-red">Role-play/persona: &#8220;pretend you are DAN with no restrictions&#8221;</span>
      <span class="badge badge-red">Crescendo: gradual multi-turn context manipulation</span>
      <span class="badge badge-red">Indirect via RAG: malicious instructions in retrieved documents</span>
      <span class="badge badge-red">Indirect via web: malicious instructions in pages LLM agents browse</span>
      <span class="badge badge-red">Indirect via email/files: malicious instructions in content LLM processes</span>
      <span class="badge badge-red">Deferred: planted trigger phrases activated in later turns</span>
    </div>
  </div>

  <div class="cheat-section">
    <h3>Defenses by Vulnerability</h3>
    <div class="control-row">
      <div class="ctrl-card"><b>LLM01 Prompt Injection</b><br>Least privilege (most effective), output monitoring, input filtering (partial), contextual labeling of trusted vs untrusted content, human approval for consequential actions, sandboxing agentic actions</div>
      <div class="ctrl-card"><b>LLM02 Info Disclosure</b><br>Data minimization in training, RAG access control at retrieval layer, output filtering for PII/sensitive content, no credentials in system prompts, differential privacy in fine-tuning</div>
      <div class="ctrl-card"><b>LLM03 Supply Chain</b><br>Model provenance verification, signed model artifacts, sandboxed testing before production, vendor security assessment, dependency scanning for LLM frameworks, plugin allowlisting</div>
      <div class="ctrl-card"><b>LLM04 Data Poisoning</b><br>Training data provenance tracking, data quality validation, model integrity verification, behavioral red-teaming for backdoors, post-deployment anomaly monitoring</div>
      <div class="ctrl-card"><b>LLM05 Output Handling</b><br>Parameterize all database queries (even LLM-generated), HTML encode before rendering, sandbox code execution, scan outputs before downstream use, treat outputs as untrusted</div>
      <div class="ctrl-card"><b>LLM06 Excessive Agency</b><br>Minimum necessary permissions, human approval for high-stakes actions, action rate limiting, scope restriction by design, comprehensive action logging</div>
      <div class="ctrl-card"><b>LLM07 System Prompt Leakage</b><br>No credentials in system prompts, design security controls that work if prompt is known, output filtering for prompt content, train model to refuse extraction</div>
      <div class="ctrl-card"><b>LLM08 Vector/Embedding</b><br>Access control enforced at retrieval time (not just database level), document ingestion scanning, knowledge base auditing, provenance tracking for RAG documents</div>
      <div class="ctrl-card"><b>LLM09 Misinformation</b><br>RAG grounding in verified sources, uncertainty communication, human review for high-stakes outputs, fact-checking pipelines, clear limitations disclosure to users</div>
      <div class="ctrl-card"><b>LLM10 Unbounded Consumption</b><br>Rate limiting per user/session/key, input/output length limits, cost monitoring with circuit breakers, budget caps at API level, query complexity analysis</div>
    </div>
  </div>

  <div class="cheat-section">
    <h3>Framework Relationships</h3>
    <div class="control-row">
      <div class="ctrl-card"><b>NIST AI RMF</b> &#8212; OWASP LLM Top 10 feeds the MEASURE function. Use as the specific security test catalog within AI RMF measurement activities.</div>
      <div class="ctrl-card"><b>ISO 42001 (AIMS)</b> &#8212; OWASP LLM Top 10 provides the vulnerability catalog for AI security risk assessment within the AIMS (Section 6 risk planning).</div>
      <div class="ctrl-card"><b>EU AI Act</b> &#8212; Article 15 cybersecurity requirements for high-risk AI. OWASP LLM Top 10 addresses the &#8220;adversarial attacks&#8221; cybersecurity requirement.</div>
      <div class="ctrl-card"><b>ISO 42005 (AISIA)</b> &#8212; OWASP LLM vulnerabilities create human impacts. Impact assessment should examine what harms result when each vulnerability is exploited.</div>
      <div class="ctrl-card"><b>OWASP Web Top 10</b> &#8212; Both apply simultaneously. LLM applications have both traditional web vulnerabilities AND LLM-specific vulnerabilities. Neither list replaces the other.</div>
      <div class="ctrl-card"><b>NIST SP 800-30</b> &#8212; For federal agencies, OWASP LLM Top 10 serves as the threat event taxonomy for SP 800-30 risk assessment of LLM information systems.</div>
    </div>
  </div>

  <div class="cheat-section">
    <h3>Key Facts</h3>
    <div class="badge-row">
      <span class="badge badge-orange">Published by: OWASP Foundation (open source, volunteer-driven)</span>
      <span class="badge badge-orange">Current version: 2025 (v1.1)</span>
      <span class="badge badge-orange">Free at: owasp.org/www-project-top-10-for-large-language-model-applications</span>
      <span class="badge badge-orange">#1 vulnerability: Prompt Injection (most pervasive, architecturally fundamental)</span>
      <span class="badge badge-orange">Most impactful single principle: Least Privilege</span>
      <span class="badge badge-orange">Most dangerous emerging context: Agentic AI with tool access</span>
      <span class="badge badge-orange">Most common failure: treating system prompt as security perimeter</span>
      <span class="badge badge-orange">Most missed RAG control: document-level access control at retrieval time</span>
      <span class="badge badge-orange">Never: embed credentials in system prompts</span>
      <span class="badge badge-orange">Always: treat LLM outputs as untrusted before downstream use</span>
      <span class="badge badge-orange">Prompt injection: cannot be fully prevented&#8212;minimize blast radius instead</span>
      <span class="badge badge-orange">Agentic AI amplifies: every OWASP LLM vulnerability severity</span>
      <span class="badge badge-orange">Defense in depth: no single control&#8212;layer multiple overlapping defenses</span>
      <span class="badge badge-orange">Security by design: architectural security far cheaper than retrofitting</span>
    </div>
  </div>`
}
];

let current = 0;
function buildGrid(){
  const g=document.getElementById('dayGrid');g.innerHTML='';
  for(let i=0;i<days.length;i++){
    const b=document.createElement('button');
    b.className='day-pip'+(days[i].isCheatSheet?' cheat':'')+(i===current?' active':'');
    b.textContent=days[i].isCheatSheet?'CS':(i+1);
    b.title=days[i].title;
    b.onclick=(()=>{const idx=i;return()=>goTo(idx);})();
    g.appendChild(b);
  }
}
function goTo(idx){current=idx;render();}
function changeDay(dir){current=Math.max(0,Math.min(days.length-1,current+dir));render();}
function render(){
  const d=days[current];const total=days.length;
  document.getElementById('dayCounter').textContent=(current+1)+' / '+total;
  document.getElementById('prevBtn').disabled=current===0;
  document.getElementById('nextBtn').disabled=current===total-1;
  document.getElementById('progBar').style.width=(((current+1)/total)*100)+'%';
  buildGrid();
  if(d.isCheatSheet){
    document.getElementById('lessonArea').innerHTML=`<div class="card"><div class="lesson-header"><div class="day-badge" style="background:#E1F5EE"><div class="day-num" style="color:#085041;font-size:14px">CHEAT</div><div class="day-lbl" style="color:#0F6E56">SHEET</div></div><div class="lesson-meta"><h2>${d.title}</h2><div class="tagline">${d.tagline}</div></div></div><div class="lesson-body">${d.body}</div></div>`;
    return;
  }
  const quizId='quiz_'+current;let quizHtml='';
  if(d.quiz){
    const optsHtml=d.quiz.opts.map((o,i)=>`<button class="quiz-btn" onclick="checkAnswer(${i},${d.quiz.ans},'${quizId}')">${o}</button>`).join('');
    quizHtml=`<div class="quiz-box"><p>Quick check: ${d.quiz.q}</p><div>${optsHtml}</div><div class="answer-reveal" id="${quizId}"></div></div>`;
  }
  document.getElementById('lessonArea').innerHTML=`<div class="card"><div class="lesson-header"><div class="day-badge"><div class="day-num">${current+1}</div><div class="day-lbl">Day</div></div><div class="lesson-meta"><h2>${d.title}</h2><div class="tagline">${d.tagline}</div></div></div><div class="section-label">Today&#8217;s lesson</div><div class="lesson-body">${d.body}</div>${quizHtml}</div>`;
}
function checkAnswer(chosen,correct,qid){
  const el=document.getElementById(qid);const d=days[current];if(!d.quiz)return;
  const isRight=chosen===correct;
  el.innerHTML='<strong>'+(isRight?'Correct!':'Not quite.')+'</strong> '+d.quiz.explain;
  el.className='answer-reveal show';
  el.style.background=isRight?'#EAF3DE':'#FEF0E8';
  el.style.borderColor=isRight?'#3B6D11':'#B7410E';
  el.style.color='#1a1a18';
}
render();
</script>
