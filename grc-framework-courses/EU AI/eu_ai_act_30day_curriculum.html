<body>
<div class="wrap">
  <h2 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">30-day EU AI Act curriculum for high school students with daily lessons and a final cheat sheet</h2>

  <div class="top-bar">
    <div class="title-block">
      <h1>EU AI Act — 30-Day Classroom Guide</h1>
      <p>Taught for high school freshmen by a 20-year GRC veteran</p>
    </div>
    <div class="nav-row">
      <button id="prevBtn" onclick="changeDay(-1)">&#8592; Prev</button>
      <span id="dayCounter" style="font-size:13px;color:#6b6b68;min-width:60px;text-align:center"></span>
      <button id="nextBtn" onclick="changeDay(1)">Next &#8594;</button>
    </div>
  </div>

  <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progBar"></div></div>
  <div class="day-grid" id="dayGrid"></div>
  <div id="lessonArea"></div>
</div>

<script>
const days = [
  // DAY 1
  {
    title: "What Is the EU AI Act?",
    tagline: "The world's first comprehensive law governing artificial intelligence",
    body: `<p>Imagine an AI system that decides whether you get a job interview, whether you qualify for a bank loan, or whether a self-driving car makes a split-second decision that affects your life. Who's responsible if something goes wrong? Who makes sure the AI is fair? That's exactly what the <span class="key-term">EU AI Act</span> was created to address.</p>
    <p>The EU AI Act is the world's first comprehensive legal framework for artificial intelligence. It was officially adopted by the European Union on <strong>March 13, 2024</strong>, and entered into force on <strong>August 1, 2024</strong>. Like GDPR, it is a <strong>regulation</strong> — meaning it applies directly as law across all EU member states without needing to be converted into national laws.</p>
    <div class="analogy-box"><strong>Real-world analogy:</strong> Think of the EU AI Act like building codes for houses. Builders are free to design all kinds of buildings, but they have to follow safety rules — especially for tall skyscrapers or buildings where lots of people gather. The EU AI Act applies the same idea to AI: more powerful or riskier AI systems face stricter rules.</div>
    <p>The Act uses a <strong>risk-based approach</strong> — meaning the rules get stricter the higher the potential harm of an AI system. Low-risk AI? Almost no rules. AI that could harm your fundamental rights? Heavy regulation or outright prohibition.</p>
    <div class="highlight-box">Just like GDPR changed how the world handles personal data, the EU AI Act is designed to change how AI is built, deployed, and governed — globally. Non-EU companies serving EU users must comply.</div>`,
    quiz: { q: "When did the EU AI Act officially enter into force?", opts: ["January 1, 2023", "May 25, 2018", "August 1, 2024", "March 13, 2025"], ans: 2, explain: "The EU AI Act entered into force on August 1, 2024. It was adopted by the European Parliament on March 13, 2024, after years of drafting and negotiation." }
  },
  // DAY 2
  {
    title: "Why Was the EU AI Act Created?",
    tagline: "The problems AI was creating — and why laws were needed",
    body: `<p>Artificial intelligence was already transforming society before any government had a comprehensive plan for governing it. Several high-profile problems pushed the EU to act.</p>
    <div class="highlight-box"><strong>AI bias scandals:</strong> Facial recognition systems were found to misidentify Black women at dramatically higher error rates than white men. Hiring algorithms trained on historical data were shown to discriminate against women. Credit-scoring AIs produced racially biased outcomes — all without a single human making an intentionally biased decision.</div>
    <p>There were also concerns about <strong>mass surveillance</strong>. Governments and private companies were deploying AI-powered cameras and facial recognition in public spaces to track people's movements without their knowledge or consent.</p>
    <div class="analogy-box"><strong>Think of it this way:</strong> If a human judge made a decision about your parole based on racially biased criteria, there's a legal process to challenge it. But if an algorithm makes that decision, who do you complain to? Before the AI Act, often nobody — because there were no rules. The EU decided that couldn't continue.</div>
    <p>The EU also saw an economic opportunity. By setting clear, trustworthy AI rules, Europe could position itself as a global leader in <em>safe and trustworthy AI</em> — attracting businesses and talent who want to develop AI responsibly.</p>
    <p>The result was years of work that produced the EU AI Act: a law designed to protect fundamental rights, ensure safety, and create a level playing field for AI innovation.</p>`,
    quiz: { q: "Which of these problems helped motivate the creation of the EU AI Act?", opts: ["AI was making computers run too fast", "AI systems were producing biased and discriminatory outcomes", "Too many people were using social media", "AI was replacing teachers in schools"], ans: 1, explain: "Documented cases of AI bias — in hiring, facial recognition, credit scoring, and criminal justice — were a major driver behind the EU AI Act. The law aims to protect fundamental rights from AI-driven harm." }
  },
  // DAY 3
  {
    title: "What Is 'AI' Under the Act?",
    tagline: "The legal definition — broader than you might think",
    body: `<p>Before we can understand what the EU AI Act regulates, we need to understand how it defines <span class="key-term">AI system</span>. The legal definition matters because it determines what's in scope.</p>
    <div class="highlight-box">The EU AI Act defines an AI system as: <em>"a machine-based system designed to operate with varying levels of autonomy and that may exhibit adaptiveness after deployment, and that, for explicit or implicit objectives, infers, from the input it receives, how to generate outputs such as predictions, recommendations, decisions, or content that can influence real or virtual environments."</em></div>
    <p>That's a mouthful. Let's break it down simply:</p>
    <div class="badge-row">
      <span class="badge badge-purple">It runs on a machine (computer, server, device)</span>
      <span class="badge badge-purple">It can act on its own to some degree</span>
      <span class="badge badge-purple">It learns or adapts from data</span>
      <span class="badge badge-purple">It produces outputs: predictions, decisions, content, recommendations</span>
      <span class="badge badge-purple">Those outputs affect the real world</span>
    </div>
    <div class="analogy-box"><strong>Examples of what counts:</strong> A chatbot that answers customer service questions. A system that screens job resumes. A credit-scoring algorithm. A medical imaging tool that detects cancer. A self-driving car's decision-making system. A content recommendation algorithm on a social media platform.</div>
    <p>The Act also specifically <strong>excludes</strong> some things — like simple rule-based systems (if X, do Y), traditional software that just executes instructions, or human intelligence research tools used purely for scientific purposes.</p>
    <p>The key idea: if it genuinely infers and decides — rather than just following pre-written rules — it's probably an AI system under the Act.</p>`,
    quiz: { q: "Which of these would most likely qualify as an AI system under the EU AI Act?", opts: ["A calculator that adds numbers", "A spreadsheet formula", "A system that analyzes resumes and ranks candidates automatically", "A light switch that turns on when you flip it"], ans: 2, explain: "A resume-screening system that learns from data to rank candidates qualifies as an AI system — it infers and makes decisions with autonomy. Calculators, spreadsheets, and light switches follow fixed rules and don't qualify." }
  },
  // DAY 4
  {
    title: "The Risk-Based Approach",
    tagline: "Not all AI is treated the same — risk level determines the rules",
    body: `<p>The most important architectural concept in the EU AI Act is its <span class="key-term">risk-based approach</span>. Instead of applying one set of rules to every AI system, the Act divides AI into tiers based on how much risk they pose to people. The higher the risk, the stricter the rules.</p>
    <div class="risk-grid">
      <div class="risk-unacceptable"><strong style="color:#501313">Unacceptable Risk</strong><br><span style="font-size:12px;color:#1a1a18">BANNED. These AI systems are prohibited entirely.</span></div>
      <div class="risk-high"><strong style="color:#633806">High Risk</strong><br><span style="font-size:12px;color:#1a1a18">HEAVILY REGULATED. Strict requirements before deployment.</span></div>
      <div class="risk-limited"><strong style="color:#0C447C">Limited Risk</strong><br><span style="font-size:12px;color:#1a1a18">TRANSPARENCY RULES. Must tell users they're interacting with AI.</span></div>
      <div class="risk-minimal"><strong style="color:#27500A">Minimal Risk</strong><br><span style="font-size:12px;color:#1a1a18">MOSTLY FREE. Encouraged to follow voluntary codes of conduct.</span></div>
    </div>
    <p>There is also a separate category for <span class="key-term">General Purpose AI (GPAI)</span> models — like ChatGPT or Gemini — that don't fit neatly into one application but power many things. They have their own rules.</p>
    <div class="analogy-box"><strong>Analogy — pharmaceutical regulation:</strong> A headache tablet sold over the counter has minimal regulation. A prescription antibiotic has stricter rules. A chemotherapy drug for cancer requires extensive clinical trials and monitoring. The EU AI Act applies the same graduated logic: the more a product can harm you, the stricter the oversight.</div>
    <div class="highlight-box">This tiered approach was intentional. The EU wanted to avoid stifling beneficial AI innovation while still protecting people from genuinely dangerous AI systems. Low-risk AI gets a light touch; dangerous AI gets stopped or heavily controlled.</div>`,
    quiz: { q: "What does the EU AI Act's risk-based approach mean?", opts: ["All AI systems follow the same rules regardless of danger", "The rules get stricter as the potential harm of an AI system increases", "Only government AI systems are regulated", "Risk is determined by the size of the company building the AI"], ans: 1, explain: "The risk-based approach means the EU AI Act applies proportionate rules — minimal requirements for low-risk AI, and strict requirements (or outright bans) for AI that poses high risks to people's safety and rights." }
  },
  // DAY 5
  {
    title: "Who Does the EU AI Act Apply To?",
    tagline: "Providers, deployers, importers — and the global reach",
    body: `<p>Like GDPR, the EU AI Act has a <span class="key-term">wide territorial scope</span>. It applies not just to EU-based companies, but to any company anywhere in the world whose AI systems affect people in the EU.</p>
    <div class="highlight-box">The Act applies if: (1) the AI provider or deployer is located in the EU, OR (2) the output of the AI system is used in the EU — regardless of where the provider is based.</div>
    <p>The Act defines several key roles:</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Provider</strong><span>Develops or places an AI system on the EU market. Carries the most obligations — they built it.</span></div>
      <div class="cheat-pill"><strong>Deployer</strong><span>Uses an AI system in their business. Has their own set of obligations depending on risk level.</span></div>
      <div class="cheat-pill"><strong>Importer</strong><span>Brings an AI system from outside the EU into the EU market.</span></div>
      <div class="cheat-pill"><strong>Distributor</strong><span>Makes an AI system available in the EU supply chain without modifying it.</span></div>
    </div>
    <div class="analogy-box"><strong>Analogy:</strong> Think of the Act like food safety regulations. The food manufacturer (Provider) is most responsible — they made it. The restaurant (Deployer) that serves it has responsibilities too. The importer bringing foreign food into the EU also carries obligations. Everyone in the chain has a role.</div>
    <p>The Act also contains important <strong>exemptions</strong>: AI used exclusively for military, national security, or defense purposes is excluded. So is AI used purely for scientific research (with some conditions). Personal non-professional use is also generally excluded.</p>`,
    quiz: { q: "A US tech company builds an AI hiring tool used by EU companies to screen job applicants. Does the EU AI Act apply?", opts: ["No — the company is based in the US", "Yes — the AI output affects people in the EU", "Only if the company has an EU office", "Only if the AI system costs more than €1 million"], ans: 1, explain: "The EU AI Act applies when the output of an AI system is used in the EU, regardless of where the provider is based. A US company whose AI affects EU job applicants must comply." }
  },
  // DAY 6
  {
    title: "Unacceptable Risk — Prohibited AI",
    tagline: "Some AI systems are so dangerous they are banned entirely",
    body: `<p>The top tier of the EU AI Act's risk pyramid is <span class="key-term">unacceptable risk</span>. These are AI applications considered so threatening to fundamental rights and human dignity that they are <strong>completely prohibited</strong>. No exceptions. No workarounds. Just banned.</p>
    <p>Let's go through the prohibited categories one by one:</p>
    <div class="tag-header">Prohibited AI Systems</div>
    <div class="badge-row">
      <span class="badge badge-red">Social scoring by governments</span>
      <span class="badge badge-red">Subliminal manipulation</span>
      <span class="badge badge-red">Exploitation of vulnerabilities</span>
      <span class="badge badge-red">Real-time remote biometric ID in public spaces (mostly)</span>
      <span class="badge badge-red">Emotion recognition in workplaces & schools</span>
      <span class="badge badge-red">Biometric categorization by sensitive attributes</span>
      <span class="badge badge-red">Predictive policing of individuals</span>
      <span class="badge badge-red">Facial recognition databases scraped from the internet</span>
    </div>
    <div class="analogy-box"><strong>What is social scoring?</strong> Imagine if the government tracked everything you did — your purchases, social media posts, traffic violations, who you spend time with — and gave you a "citizen score" that determined whether you could get a loan, travel, or even send your kids to a good school. China's social credit system works roughly this way. The EU AI Act says: not in Europe.</div>
    <div class="highlight-box"><strong>Subliminal manipulation</strong> means AI that influences your behavior below the level of your conscious awareness — like flashing imperceptible messages or using psychological weaknesses to change your decisions without you knowing. This is banned regardless of who does it.</div>
    <p>Violations of the prohibited AI rules carry the heaviest fines in the entire Act. We'll cover enforcement in detail on Day 27.</p>`,
    quiz: { q: "A government wants to deploy an AI that scores citizens on their social behavior and restricts their access to services based on that score. Under the EU AI Act, this is:", opts: ["Allowed with strict oversight", "A limited-risk application requiring transparency notices", "Prohibited — this is an unacceptable risk AI system", "Only allowed for national security purposes"], ans: 2, explain: "Government social scoring systems are explicitly listed as prohibited AI under the EU AI Act. They represent an unacceptable risk to fundamental rights, dignity, and democratic values — and are banned entirely." }
  },
  // DAY 7
  {
    title: "Real-Time Biometric Surveillance",
    tagline: "A deeper look at one of the most contested prohibitions",
    body: `<p>One of the most debated provisions in the entire EU AI Act is the treatment of <span class="key-term">real-time remote biometric identification</span> in publicly accessible spaces. This basically means: using AI-powered cameras to identify people by their face, gait, or other body features as they move through public areas.</p>
    <div class="highlight-box">The default rule: real-time remote biometric ID in public spaces is <strong>prohibited</strong>. Law enforcement cannot simply set up AI cameras in a city center to identify everyone walking by.</div>
    <p>However — and this is where it gets controversial — the Act allows <strong>narrow exceptions</strong> for law enforcement:</p>
    <div class="badge-row">
      <span class="badge badge-amber">Searching for a specific missing child</span>
      <span class="badge badge-amber">Preventing a specific, imminent terrorist attack</span>
      <span class="badge badge-amber">Locating a specific person suspected of a serious crime (e.g. murder, trafficking)</span>
    </div>
    <div class="analogy-box"><strong>The debate:</strong> Privacy advocates argue even these exceptions are too broad and create a slippery slope toward mass surveillance. Law enforcement argues they need these tools for genuine public safety emergencies. The EU tried to strike a balance — but many believe the exceptions swallow the rule. This is an ongoing debate even now that the Act is in force.</div>
    <p>Crucially, these exceptions require:</p>
    <div class="badge-row">
      <span class="badge badge-purple">Prior judicial or administrative authorization</span>
      <span class="badge badge-purple">Limited in time and geographic scope</span>
      <span class="badge badge-purple">Subject to independent oversight</span>
    </div>
    <p>Post-hoc (after-the-fact) biometric identification — reviewing existing footage rather than live identification — is treated as high-risk rather than prohibited, and faces strict requirements.</p>`,
    quiz: { q: "Under the EU AI Act, can law enforcement use real-time AI facial recognition in public spaces?", opts: ["Yes, freely — it's a law enforcement tool", "No — it is absolutely prohibited with no exceptions", "Only in very narrow cases with prior authorization — like an imminent terrorist attack", "Yes, but only in train stations and airports"], ans: 2, explain: "Real-time biometric ID in public spaces is prohibited by default, but narrow exceptions exist for specific law enforcement cases (imminent terrorism, finding a missing child, etc.), subject to prior authorization and strict oversight." }
  },
  // DAY 8
  {
    title: "High-Risk AI — Overview",
    tagline: "AI that can seriously affect your life must meet strict standards",
    body: `<p>The second tier of the risk pyramid is <span class="key-term">high-risk AI</span>. These systems are not banned, but they face substantial legal requirements that must be met <em>before</em> they can be deployed. Getting this wrong has serious consequences.</p>
    <p>An AI system is high-risk if it falls into one of two categories:</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Category A — Safety components</strong><span>AI used as a safety component in products already regulated by EU law (medical devices, vehicles, aviation, machinery)</span></div>
      <div class="cheat-pill"><strong>Category B — Listed sectors</strong><span>AI deployed in specific high-stakes sectors listed in Annex III of the Act (education, employment, credit, law enforcement, migration, etc.)</span></div>
    </div>
    <div class="analogy-box"><strong>Why these?</strong> Think about what these AI systems have in common: they all make decisions that can significantly affect your life. Being denied a job, a loan, or university admission. Being flagged by law enforcement. Having a medical device make a treatment recommendation. These aren't trivial — they can change the course of someone's life.</div>
    <div class="highlight-box">Not everything in these sectors is automatically high-risk. The Act includes a "safety filter" — if an AI system merely performs a narrow preparatory task (like formatting a document) and a human makes all the decisions, it may not qualify as high-risk even if it operates in a high-risk sector.</div>
    <p>High-risk AI requirements include: robust data governance, technical documentation, human oversight mechanisms, accuracy standards, cybersecurity, and registration in an EU database before deployment. We'll cover each of these over the next several days.</p>`,
    quiz: { q: "What makes an AI system 'high-risk' under the EU AI Act?", opts: ["It was built by a large company", "It is used in sensitive sectors or as a safety component in regulated products, AND poses significant risk to health, safety, or fundamental rights", "It costs more than €1 million to develop", "Any AI that uses deep learning"], ans: 1, explain: "High-risk AI is defined by both its application area (specific sectors in Annex III or safety components in regulated products) AND the significance of the risk it poses to health, safety, or fundamental rights — not by cost or technical method." }
  },
  // DAY 9
  {
    title: "High-Risk AI — Sectors Part 1",
    tagline: "The specific areas where AI is considered high-stakes",

    <div class="cheat-grid">
      <div class="cheat-pill"><strong>1. Biometric Identification & Categorization</strong><span>AI used to identify or categorize people by physical characteristics. Includes facial recognition in post-hoc law enforcement contexts.</span></div>
      <div class="cheat-pill"><strong>2. Critical Infrastructure</strong><span>AI managing or controlling power grids, water systems, traffic networks, digital infrastructure. Failures here affect millions of people.</span></div>
      <div class="cheat-pill"><strong>3. Education & Vocational Training</strong><span>AI that determines access to education, evaluates students, monitors exam behavior, or significantly influences educational pathways.</span></div>
      <div class="cheat-pill"><strong>4. Employment & Worker Management</strong><span>AI used in hiring, promotion, task allocation, performance monitoring, and termination decisions — the systems that affect your job.</span></div>

    <div class="warning-box"><strong>Employment example:</strong> Amazon famously scrapped an AI hiring tool in 2018 after discovering it was systematically downgrading resumes from women. That kind of AI — one that makes or heavily influences hiring decisions — is exactly what the high-risk category targets. It must now meet strict requirements before deployment in the EU.</div>
    <p>The employment category is particularly significant because most large employers use some form of AI screening. This provision has significant implications for HR technology companies worldwide.</p>`,

    title: "Requirements for High-Risk AI — Part 1",
    tagline: "What companies must do before deploying high-risk AI",
    body: `<p>Now that we know which AI systems are high-risk, let's look at what the Act actually requires of them. These requirements apply <em>before and during</em> deployment. There are eight core requirements — we'll cover four today.</p>

      <div class="cheat-pill"><strong>1. Risk Management System</strong><span>A continuous process to identify, analyze, estimate, and mitigate risks — maintained throughout the AI system's entire lifecycle.</span></div>

      <div class="cheat-pill"><strong>3. Technical Documentation</strong><span>Detailed documentation of how the system works, what it was trained on, its intended purpose, performance metrics, and limitations.</span></div>

    title: "Minimal Risk AI",
    tagline: "The vast majority of AI — light-touch rules",
    body: `<p>The largest category by far is <span class="key-term">minimal risk AI</span>. The EU AI Act places almost no mandatory requirements on these systems. The EU estimated that roughly 85% of all AI applications in use today fall into this category.</p>

    tagline: "ChatGPT, Gemini, and the AI that does almost everything",
    body: `<p>One of the most novel parts of the EU AI Act is its treatment of <span class="key-term">General Purpose AI (GPAI) models</span>. These are AI models — like GPT-4, Claude, Gemini, or Llama — that are trained on vast amounts of data to perform a wide range of tasks, rather than being built for one specific purpose.</p>

    title: "Providers vs. Deployers — Responsibilities",
    tagline: "Who built it vs. who uses it — and who's on the hook",
    body: `<p>One of the most practically important distinctions in the EU AI Act is between <span class="key-term">providers</span> (the companies that build AI systems) and <span class="key-term">deployers</span> (the organizations that use those AI systems in their operations). They have overlapping but distinct obligations.</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Provider Obligations</strong><span>Design the AI to meet requirements. Create technical documentation. Run conformity assessment. Register in EU database. Affix CE marking. Post-market monitoring.</span></div>
      <div class="cheat-pill"><strong>Deployer Obligations</strong><span>Use AI as intended. Ensure human oversight. Don't modify high-risk AI. Conduct fundamental rights impact assessment (for public bodies). Monitor and report serious incidents.</span></div>
    </div>
    <div class="analogy-box"><strong>Car manufacturer vs. driver:</strong> A car manufacturer (Provider) is responsible for building the car safely — airbags, crash ratings, seatbelts. A driver (Deployer) is responsible for driving safely — following speed limits, not driving drunk, not using their phone. Both have obligations. The car being safe doesn't excuse reckless driving; and reckless driving doesn't excuse a car with no brakes.</div>
    <div class="highlight-box">Important: A deployer who modifies a high-risk AI system substantially — changing its intended purpose or altering its core functionality — may become legally reclassified as a <em>provider</em> and inherit all provider obligations. Using an AI in a way it wasn't designed for can make you the responsible party.</div>
    <p>This allocation of responsibility was carefully designed to prevent the "not my problem" dynamic — where providers blame deployers and deployers blame providers when something goes wrong. The Act makes clear: both parties have skin in the game.</p>`,

  // DAY 19
  {
    title: "The Conformity Assessment",
    tagline: "Proving your high-risk AI actually meets the rules",
    body: `<p>Before a high-risk AI system can be placed on the EU market, it must undergo a <span class="key-term">conformity assessment</span> — a formal process to verify that the system actually meets all the requirements for high-risk AI. Think of it as an inspection before the product is allowed to be sold.</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Self-Assessment</strong><span>For many high-risk AI systems, the provider can conduct the conformity assessment themselves — but they must do it rigorously and document everything.</span></div>
      <div class="cheat-pill"><strong>Third-Party Assessment</strong><span>For some high-risk AI — particularly biometric systems and AI in regulated safety-critical products — an independent third-party assessor (a Notified Body) must conduct the review.</span></div>
    </div>
    <div class="analogy-box"><strong>Analogy — car crash testing:</strong> Before a new car model can be sold in the EU, it must pass crash safety tests. Some tests are conducted by the manufacturer (self-assessment) and some by independent testing organizations like Euro NCAP. Conformity assessments for AI work similarly — proving the system is safe before it goes on the market.</div>
    <div class="highlight-box">After a successful conformity assessment, the AI system gets a <span class="key-term">CE marking</span> — the same "CE" mark you see on electrical appliances and medical devices. It signals that the product complies with EU law. Importantly, CE marking on an AI product means it can be sold freely throughout the entire EU single market.</div>
    <p>If a high-risk AI system is significantly updated after assessment, a <strong>new conformity assessment</strong> may be required. You can't pass inspection once and then make major changes without re-assessing.</p>`,
    quiz: { q: "What does a CE marking on an AI product signify?", opts: ["The AI was built in China", "The AI has completed a conformity assessment and complies with EU law", "The AI costs under €10,000", "The AI was approved by consumers in surveys"], ans: 1, explain: "A CE marking on an AI product signifies that a conformity assessment has been completed successfully and the product complies with EU law — allowing it to be sold freely throughout the EU single market." }

  {
    title: "Fundamental Rights Impact Assessment",
    tagline: "Before deploying AI, ask: who could this hurt?",
    body: `<p>Before a public body or a private entity operating public services deploys a high-risk AI system, the EU AI Act requires them to conduct a <span class="key-term">Fundamental Rights Impact Assessment (FRIA)</span>. This is a structured evaluation of how the AI system might affect people's fundamental rights.</p>
    <div class="analogy-box"><strong>What are fundamental rights?</strong> Under EU law, fundamental rights include: the right to dignity, freedom from discrimination, right to privacy, freedom of expression, right to a fair trial, rights of children, right to equal treatment, and more. These are enshrined in the EU Charter of Fundamental Rights — think of it as the EU's Bill of Rights.</div>
    <p>A FRIA must examine:</p>
    <div class="badge-row">
      <span class="badge badge-purple">What categories of people the system will affect</span>
      <span class="badge badge-purple">Whether any groups could be disproportionately harmed</span>
      <span class="badge badge-purple">Whether the system could discriminate directly or indirectly</span>
      <span class="badge badge-purple">Whether individuals have meaningful ways to contest AI decisions</span>
      <span class="badge badge-purple">Data protection impact (often overlapping with GDPR's DPIA)</span>
    </div>
    <div class="highlight-box">The FRIA must be <strong>completed before deployment</strong> — not after a problem emerges. And it must be submitted to the national market surveillance authority. It's not a private internal document; there's external accountability built in.</div>
    <p>The FRIA borrows from GDPR's Data Protection Impact Assessment (DPIA) concept — but goes broader. Where DPIAs focus on privacy risks, FRIAs cover the full spectrum of fundamental rights, including non-discrimination, due process, and democratic participation.</p>`,
    quiz: { q: "Who is required to conduct a Fundamental Rights Impact Assessment before deploying high-risk AI?", opts: ["Only technology companies worth over €1 billion", "Public bodies and entities providing public services", "Any company using any form of AI", "Only companies that previously violated GDPR"], ans: 1, explain: "FRIAs are required for public bodies and entities operating public services deploying high-risk AI. The assessment must be completed before deployment and submitted to the relevant national authority." }

    tagline: "A safe space to innovate — with guardrails",
    body: `<p>The EU AI Act contains a creative provision aimed at supporting innovation: <span class="key-term">AI regulatory sandboxes</span>. These are controlled environments where companies — especially startups and small businesses — can develop and test innovative AI systems under regulatory supervision, before full compliance requirements apply.</p>
    <div class="analogy-box"><strong>Think of a sandbox like a playground:</strong> Kids can experiment, try things, make mistakes, and learn — but in a safe environment with boundaries. An AI regulatory sandbox gives companies the same opportunity: test your AI idea in real-world conditions, with regulators watching, before you're held to the full weight of the law.</div>
    <div class="highlight-box">Member states must establish at least one national AI regulatory sandbox. Companies accepted into a sandbox get direct access to regulators — so they can ask questions, test approaches, and understand what compliance will look like for their specific system. This is particularly valuable for novel AI use cases where the rules aren't yet clear.</div>
    <p>Sandboxes are specifically designed to be accessible to:</p>
    <div class="badge-row">
      <span class="badge badge-green">Startups and small businesses (SMEs)</span>
      <span class="badge badge-green">Academic research institutions</span>
      <span class="badge badge-green">Public-sector innovators</span>
    </div>
    <p>Data processed within a sandbox under real-world conditions — including personal data — is subject to special rules to prevent unauthorized use. The sandbox is for testing compliance, not for exploiting data access.</p>
    <div class="warning-box">Being in a sandbox doesn't give a free pass to break the law. Core prohibitions (like banned AI systems) still apply. The sandbox merely gives flexibility on procedural compliance requirements while the system is in development.</div>`,
    quiz: { q: "What is the main purpose of an AI regulatory sandbox under the EU AI Act?", opts: ["To allow companies to permanently avoid regulation", "To give companies a controlled environment to test innovative AI with regulatory supervision before full compliance applies", "To store banned AI systems for government study", "To compete with US AI companies"], ans: 1, explain: "AI regulatory sandboxes provide a controlled environment for companies (especially startups) to develop and test innovative AI under regulatory supervision, giving them flexibility before the full compliance requirements apply." }
  },
  // DAY 23
  {
    title: "AI Literacy",
    tagline: "Everyone who uses AI needs to understand it",
    body: `<p>One of the most forward-looking provisions in the EU AI Act is the <span class="key-term">AI literacy</span> requirement. Article 4 of the Act requires providers and deployers of AI systems to ensure that their staff and anyone involved in operating AI systems has sufficient AI literacy.</p>
    <div class="highlight-box">AI literacy means: understanding AI systems' capabilities and limitations, knowing how to use them appropriately, recognizing when AI outputs should be questioned, and understanding the ethical implications of AI use.</div>
    <div class="analogy-box"><strong>Analogy:</strong> You wouldn't put someone behind the wheel of a 40-ton truck without driver training. You wouldn't let someone operate industrial machinery without safety training. The EU AI Act says: if your job involves deploying or overseeing AI — especially high-risk AI — you need to understand what you're working with. Clicking "approve" on an AI recommendation without understanding it isn't acceptable oversight.</div>
    <p>AI literacy requirements extend across organizations:</p>
    <div class="badge-row">
      <span class="badge badge-purple">Technical staff who build and train AI</span>
      <span class="badge badge-purple">Business users who deploy AI in processes</span>
      <span class="badge badge-purple">HR staff using AI screening tools</span>
      <span class="badge badge-purple">Customer service staff using AI chatbots</span>
      <span class="badge badge-purple">Managers overseeing AI decision-making</span>
    </div>
    <p>This is one of the most practically impactful provisions for employers. It means that deploying AI is not just a technology decision — it comes with a <strong>training obligation</strong>. Companies need to invest in educating their workforce about the AI they use.</p>
    <div class="warning-box">The EU Commission has also launched broader public AI literacy initiatives — recognizing that all citizens need baseline understanding of AI to participate meaningfully in an AI-shaped society. This connects to the Act's broader goal of trustworthy, human-centered AI.</div>`,
    quiz: { q: "Under Article 4 of the EU AI Act, who must have adequate AI literacy?", opts: ["Only AI engineers and data scientists", "Only the CEO and board of directors", "Staff and anyone involved in operating or deploying AI systems", "Only EU government employees"], ans: 2, explain: "Article 4 requires providers and deployers of AI to ensure that their staff and all personnel involved in operating AI systems have sufficient AI literacy — including understanding the AI's capabilities, limitations, and ethical implications." }

  // DAY 24
  {
    title: "Post-Market Monitoring & Incident Reporting",
    tagline: "Compliance doesn't end at deployment — it continues forever",
    body: `<p>One of the strongest features of the EU AI Act's approach is that compliance is not a one-time checkbox. Providers of high-risk AI must maintain active <span class="key-term">post-market monitoring</span> systems that continuously track how their AI is performing once deployed in the real world.</p>
    <div class="highlight-box">Post-market monitoring means: collecting feedback from deployers, monitoring real-world performance metrics, identifying unexpected behaviors, updating risk assessments, and taking corrective action when problems emerge. This continues for the entire lifespan of the AI system.</div>
    <p>When serious problems are discovered, the Act requires <strong>incident reporting</strong>:</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Serious incidents</strong><span>Providers must report to national authorities within 15 days. Serious = risk to health, safety, or fundamental rights; significant property damage; interruption to essential services.</span></div>
      <div class="cheat-pill"><strong>Near-misses</strong><span>Events that didn't cause harm but revealed significant risks must also be reported. Catching problems before they cause harm is part of the system.</span></div>
    </div>
    <div class="analogy-box"><strong>Aviation analogy:</strong> Every time an airplane has an incident — even a near-miss — it's reported to aviation authorities. These reports feed into a global safety database that improves AI design over time. The EU AI Act applies the same aviation-inspired safety culture to AI. Incident reporting isn't about blame — it's about learning and preventing future harm.</div>
    <p>Deployers who discover problems with an AI system they use must inform the provider. If the deployer is a public body, they may have additional obligations to notify their national oversight authority directly.</p>`,
    quiz: { q: "How long does a high-risk AI provider have to report a serious incident to national authorities?", opts: ["24 hours", "15 days", "30 days", "3 months"], ans: 1, explain: "Providers of high-risk AI systems must report serious incidents — events posing risk to health, safety, or fundamental rights — to national market surveillance authorities within 15 days of becoming aware of the incident." }
  },
  // DAY 25
  {
    title: "Prohibited Practices — A Deeper Look",
    tagline: "Understanding why specific AI uses are banned",
    body: `<p>We covered the list of prohibited AI on Day 6. Today, let's go deeper into two of the most important prohibitions: <span class="key-term">subliminal manipulation</span> and <span class="key-term">exploitation of vulnerabilities</span>.</p>
    <div class="highlight-box"><strong>Subliminal manipulation:</strong> AI techniques that influence a person's behavior in ways they are not consciously aware of — operating below the threshold of conscious perception or rational decision-making. Banned regardless of purpose or who deploys it.</div>
    <div class="analogy-box"><strong>Subliminal manipulation example:</strong> An e-commerce platform uses AI to analyze when you're feeling sad or insecure (based on your browsing patterns, time of day, and typing speed) and then shows you products specifically designed to exploit those emotional states. You're making a purchase decision — but the AI has rigged the emotional environment to push you toward it without your awareness. This is banned.</div>
    <div class="highlight-box"><strong>Exploitation of vulnerabilities:</strong> AI that deliberately targets people in vulnerable situations — children who cannot fully understand what's happening, elderly people with cognitive decline, people in financial distress, people with mental health conditions — to influence their behavior in harmful ways.</div>
    <p>Both prohibitions reflect a core value in the EU AI Act: <strong>AI must not undermine human autonomy and dignity</strong>. People must remain genuinely in control of their own decisions. AI that hijacks human psychology — whether through subliminal means or by exploiting weakness — is treated as incompatible with a rights-respecting society.</p>
    <div class="warning-box">These prohibitions are difficult to enforce precisely because the manipulation, by definition, happens below the level of awareness. Regulators are developing technical methods and auditing tools to detect these practices — but this remains one of the most challenging enforcement areas.</div>`,
    quiz: { q: "An AI system detects that a user is stressed and automatically shows them high-pressure sales content to exploit their emotional state without their knowledge. This is an example of:", opts: ["Legitimate marketing", "High-risk AI requiring a conformity assessment", "Prohibited AI — subliminal manipulation exploiting psychological vulnerabilities", "Limited-risk AI requiring a transparency notice"], ans: 2, explain: "Using AI to exploit a user's emotional state to influence behavior below the level of conscious awareness is a form of subliminal manipulation — one of the explicitly prohibited AI practices under the EU AI Act." }
  },
  // DAY 26
  {
    title: "Relationship with GDPR",
    tagline: "The EU AI Act and GDPR — two laws, one person, lots of overlap",
    body: `<p>If you've already studied GDPR, you'll notice significant overlap with the EU AI Act — because almost all AI systems that process personal data are subject to <em>both</em> laws simultaneously. Understanding how they interact is essential for anyone working in AI governance.</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>GDPR focus</strong><span>Protecting personal data — how it's collected, used, stored, and shared. Your rights over your information.</span></div>
      <div class="cheat-pill"><strong>EU AI Act focus</strong><span>Protecting people from AI risks — safety, bias, manipulation, rights violations. How AI systems are built, tested, and used.</span></div>
    </div>
    <div class="highlight-box">The Acts overlap most visibly in three areas: <strong>(1) Data governance</strong> — the AI Act's requirement for high-quality training data aligns with GDPR's accuracy and purpose limitation principles. <strong>(2) Automated decision-making</strong> — GDPR's Article 22 rights against solely automated decisions dovetail with the AI Act's requirements for human oversight. <strong>(3) DPIAs and FRIAs</strong> — both require impact assessments before processing, and regulators encourage combining them where possible.</div>
    <div class="analogy-box"><strong>Analogy:</strong> GDPR is the food safety law that says ingredients must be safe and labeled. The EU AI Act is the restaurant health code that says the kitchen must be clean, the staff trained, and the cooking process safe. Both laws apply to the same meal. Compliance requires satisfying both — not just one.</div>
    <p>The EU explicitly designed the AI Act to <strong>complement, not replace</strong>, GDPR. Companies building AI systems that process personal data must maintain compliance with both. The good news: many compliance measures serve both laws. A robust data governance program, for example, addresses GDPR accuracy requirements <em>and</em> the AI Act's data quality requirements simultaneously.</p>`,
    quiz: { q: "Does the EU AI Act replace GDPR for AI systems that process personal data?", opts: ["Yes — the AI Act supersedes GDPR for all AI systems", "No — both laws apply simultaneously and complement each other", "Only GDPR applies if the AI was built before 2024", "Only the AI Act applies if the data is anonymized"], ans: 1, explain: "The EU AI Act does not replace GDPR. Both laws apply simultaneously to AI systems that process personal data. They complement each other — GDPR focuses on data rights, while the AI Act focuses on AI safety and risk management." }
  },

      <div class="risk-high"><strong style="color:#633806">Tier 2 — High-risk AI violations</strong><br><span style="font-size:12px">Up to <strong>€15 million</strong> or <strong>3% of global annual turnover</strong> — whichever is higher</span></div>

    quiz: { q: "What is the maximum fine for deploying a prohibited AI system under the EU AI Act?", opts: ["€10 million or 2% of global turnover", "€20 million or 4% of global turnover", "€35 million or 7% of global turnover", "€50 million flat"], ans: 2, explain: "Violations of the prohibited AI provisions carry the highest fines in the EU AI Act: up to €35 million or 7% of total worldwide annual turnover — whichever is higher. This exceeds even GDPR's maximum fine." }

    <div class="highlight-box">The EU AI Office's core responsibilities: enforcing the rules for GPAI models (including systemic risk models), developing technical standards and guidelines, coordinating between national authorities, maintaining the EU AI database, and conducting research and monitoring of AI developments.</div>

    <p>The EU AI Office also maintains the <strong>Scientific Panel</strong> — a group of independent AI experts who advise the office on technical questions, assess GPAI models, and support enforcement investigations. This expert input is crucial in a field that evolves faster than most regulators can track.</p>`,

  // CHEAT SHEET
  {
    title: "EU AI Act Cheat Sheet",
    tagline: "Your complete quick-reference guide",
    isCheatSheet: true,
    body: `
    <div class="cheat-section">
      <h3>What Is the EU AI Act?</h3>
      <p style="font-size:13.5px;color:#6b6b68">The world's first comprehensive AI regulation, adopted March 13, 2024, entered into force August 1, 2024. Uses a risk-based approach. Applies worldwide to any provider or deployer whose AI affects people in the EU. Does not replace GDPR — both apply to AI systems that process personal data.</p>
    </div>

    <div class="cheat-section">
      <h3>Definition of AI System</h3>
      <p style="font-size:13.5px;color:#6b6b68">A machine-based system that operates with varying levels of autonomy, infers from inputs to generate outputs (predictions, decisions, content, recommendations) that can influence real or virtual environments. Excludes simple rule-based systems.</p>
    </div>

    <div class="cheat-section">
      <h3>The 4 Risk Tiers</h3>
      <div class="risk-grid">
        <div class="risk-unacceptable"><strong style="color:#501313">Unacceptable Risk — PROHIBITED</strong><br><span style="font-size:12px;color:#1a1a18">Social scoring by governments. Subliminal manipulation. Exploitation of vulnerabilities. Real-time public biometric ID (with narrow law enforcement exceptions). Emotion recognition in workplaces/schools. Predictive policing of individuals. Biometric categorization by sensitive attributes. Scraped facial recognition databases.</span></div>
        <div class="risk-high"><strong style="color:#633806">High Risk — HEAVILY REGULATED</strong><br><span style="font-size:12px;color:#1a1a18">Safety components in regulated products (medical devices, vehicles, aviation). Annex III sectors: biometrics, critical infrastructure, education, employment, essential services, law enforcement, migration/asylum, justice/democracy. Must meet 8 requirements before deployment.</span></div>
        <div class="risk-limited"><strong style="color:#0C447C">Limited Risk — TRANSPARENCY RULES</strong><br><span style="font-size:12px;color:#1a1a18">Chatbots must disclose they are AI. AI-generated content must be labeled. Emotion recognition must be disclosed. Deepfakes must be labeled — including political content.</span></div>
        <div class="risk-minimal"><strong style="color:#27500A">Minimal Risk — MOSTLY FREE</strong><br><span style="font-size:12px;color:#1a1a18">~85% of current AI. Spam filters, recommendation engines, grammar tools, game AI. No mandatory requirements — voluntary codes of conduct encouraged.</span></div>
      </div>
    </div>

    <div class="cheat-section">
      <h3>8 Requirements for High-Risk AI</h3>
      <div class="control-row">
        <div class="ctrl-card"><b>1. Risk Management System</b> — Continuous process to identify, assess, and mitigate risks across the AI system's entire lifecycle.</div>
        <div class="ctrl-card"><b>2. Data Governance</b> — Training data must be relevant, representative, and bias-assessed. Data practices documented.</div>
        <div class="ctrl-card"><b>3. Technical Documentation</b> — Detailed records of how the system works, training data, performance, limitations, and intended purpose.</div>
        <div class="ctrl-card"><b>4. Record-Keeping & Logging</b> — Automatic logging of events and decisions to create an audit trail.</div>
        <div class="ctrl-card"><b>5. Transparency to Deployers</b> — Clear instructions on the system's capabilities, limitations, and how to interpret outputs.</div>
        <div class="ctrl-card"><b>6. Human Oversight</b> — Systems must be designed for human monitoring, understanding, and ability to override or stop the AI.</div>
        <div class="ctrl-card"><b>7. Accuracy, Robustness & Security</b> — Appropriate performance standards; resilience to errors, adversarial attacks, and tampering.</div>
        <div class="ctrl-card"><b>8. Conformity Assessment + CE Marking</b> — Pre-market assessment (self or third-party) proving compliance. CE marking issued. Registration in EU AI database required.</div>
      </div>
    </div>

    <div class="cheat-section">
      <h3>Key Roles</h3>
      <div class="control-row">
        <div class="ctrl-card"><b>Provider</b> — Develops or places AI on EU market. Most obligations. Responsible for conformity assessment, CE marking, documentation, and post-market monitoring.</div>
        <div class="ctrl-card"><b>Deployer</b> — Uses AI in operations. Must use AI as intended, ensure human oversight, report serious incidents. Public body deployers must conduct FRIAs.</div>
        <div class="ctrl-card"><b>Importer</b> — Brings AI from outside EU into EU market. Must verify compliance before market placement.</div>
        <div class="ctrl-card"><b>Distributor</b> — Makes AI available in EU supply chain without modification. Checks that CE marking and documentation are present.</div>
      </div>
    </div>

    <div class="cheat-section">
      <h3>General Purpose AI (GPAI)</h3>
      <div class="control-row">
        <div class="ctrl-card"><b>All GPAI providers must:</b> Prepare technical documentation. Comply with EU copyright law. Publish training data summary.</div>
        <div class="ctrl-card"><b>Systemic Risk GPAI (10²⁵ FLOPs threshold):</b> Model evaluations (red-teaming). Systemic risk mitigation. Incident reporting to EU AI Office. Cybersecurity protections. Energy consumption reporting.</div>

    </div>

    <div class="cheat-section">
      <h3>Core Controls at a Glance</h3>
      <div class="control-row">
        <div class="ctrl-card"><b>Conformity Assessment (Art. 43)</b> — Pre-market verification that high-risk AI meets all requirements. Self-assessment or third-party (Notified Body) depending on AI type.</div>
        <div class="ctrl-card"><b>CE Marking</b> — Affixed after successful conformity assessment. Allows free movement across the EU single market. Must be re-assessed after significant updates.</div>
        <div class="ctrl-card"><b>EU AI Database (Art. 71)</b> — Public registry of high-risk AI systems. Providers must register before EU market placement. Accessible to all.</div>
        <div class="ctrl-card"><b>Fundamental Rights Impact Assessment (Art. 27)</b> — Required before public bodies/public service providers deploy high-risk AI. Must identify affected groups and potential rights violations.</div>
        <div class="ctrl-card"><b>Post-Market Monitoring</b> — Continuous performance tracking after deployment. Serious incidents must be reported to national authorities within 15 days.</div>
        <div class="ctrl-card"><b>AI Literacy (Art. 4)</b> — Providers and deployers must ensure staff working with AI have adequate AI literacy. Training obligation on all organizations deploying AI.</div>
        <div class="ctrl-card"><b>AI Regulatory Sandboxes</b> — Controlled test environments for innovative AI development under regulatory supervision. At least one per member state. Particularly accessible to SMEs and startups.</div>
        <div class="ctrl-card"><b>Human Oversight Design</b> — High-risk AI must be designed with mechanisms allowing human operators to understand, monitor, pause, override, or stop the system at all times.</div>
      </div>
    </div>

    <div class="cheat-section">
      <h3>Enforcement & Fines</h3>
      <div class="control-row">
        <div class="ctrl-card"><b>Tier 1 — Prohibited AI violations</b> — Up to €35 million or 7% of global annual turnover (whichever is higher). The highest fines in the Act.</div>
        <div class="ctrl-card"><b>Tier 2 — High-risk AI violations</b> — Up to €15 million or 3% of global annual turnover (whichever is higher).</div>
        <div class="ctrl-card"><b>Tier 3 — False information to authorities</b> — Up to €7.5 million or 1.5% of global annual turnover (whichever is higher).</div>
        <div class="ctrl-card"><b>SME Relief</b> — Lower fine caps for small and medium-sized enterprises and startups — recognized as needing protection from disproportionate penalties.</div>
      </div>
      <p style="font-size:12.5px;color:#6b6b68;margin-top:.5rem">Enforcement: EU AI Office (GPAI/systemic risk) + national competent authorities (most high-risk AI). Regulators can also order market withdrawal, deployment suspension, and public disclosure of violations.</p>
    </div>

    <div class="cheat-section">
      <h3>Implementation Timeline</h3>
      <div class="badge-row">
        <span class="badge badge-purple">Aug 1, 2024 — Entry into force</span>
        <span class="badge badge-red">Feb 2, 2025 — Prohibited AI banned; AI literacy & governance apply</span>
        <span class="badge badge-amber">Aug 2, 2025 — GPAI obligations apply</span>
        <span class="badge badge-blue">Aug 2, 2026 — Most high-risk AI obligations apply</span>
        <span class="badge badge-green">Aug 2, 2027 — Safety-component high-risk AI in existing products</span>
      </div>
    </div>

    <div class="cheat-section">
      <h3>Key Numbers to Remember</h3>
      <div class="badge-row">
        <span class="badge badge-purple">Entry into force: August 1, 2024</span>
        <span class="badge badge-purple">7% / €35M — max fine (prohibited AI)</span>
        <span class="badge badge-purple">3% / €15M — max fine (high-risk violations)</span>
        <span class="badge badge-purple">15 days — serious incident reporting deadline</span>
        <span class="badge badge-purple">10²⁵ FLOPs — systemic risk GPAI threshold</span>
        <span class="badge badge-purple">4 risk tiers</span>
        <span class="badge badge-purple">8 requirements for high-risk AI</span>
        <span class="badge badge-purple">8 high-risk sectors in Annex III</span>
        <span class="badge badge-purple">~85% of AI = minimal risk</span>
      </div>
    </div>
    `
  }
];

let current = 0;

function buildGrid(){
  const g = document.getElementById('dayGrid');
  g.innerHTML = '';
  for(let i = 0; i < days.length; i++){
    const b = document.createElement('button');
    b.className = 'day-pip' + (days[i].isCheatSheet ? ' cheat' : '') + (i === current ? ' active' : '');
    b.textContent = days[i].isCheatSheet ? 'CS' : (i + 1);
    b.title = days[i].title;
    b.onclick = (()=>{ const idx = i; return () => goTo(idx); })();
    g.appendChild(b);
  }
}

function goTo(idx){ current = idx; render(); }
function changeDay(dir){ current = Math.max(0, Math.min(days.length - 1, current + dir)); render(); }

function render(){
  const d = days[current];
  const total = days.length;
  document.getElementById('dayCounter').textContent = (current + 1) + ' / ' + total;
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === total - 1;
  document.getElementById('progBar').style.width = (((current + 1) / total) * 100) + '%';
  buildGrid();

  if(d.isCheatSheet){
    document.getElementById('lessonArea').innerHTML = `
      <div class="card">
        <div class="lesson-header">
          <div class="day-badge" style="background:#E1F5EE">
            <div class="day-num" style="color:#085041;font-size:14px">CHEAT</div>
            <div class="day-lbl" style="color:#0F6E56">SHEET</div>
          </div>
          <div class="lesson-meta">
            <h2>${d.title}</h2>
            <div class="tagline">${d.tagline}</div>
          </div>
        </div>
        <div class="lesson-body">${d.body}</div>
      </div>`;
    return;
  }

  const quizId = 'quiz_' + current;
  let quizHtml = '';
  if(d.quiz){
    const optsHtml = d.quiz.opts.map((o, i) =>
      `<button class="quiz-btn" onclick="checkAnswer(${i}, ${d.quiz.ans}, '${quizId}')">${o}</button>`
    ).join('');
    quizHtml = `<div class="quiz-box">
      <p>Quick check: ${d.quiz.q}</p>
      <div>${optsHtml}</div>
      <div class="answer-reveal" id="${quizId}"></div>
    </div>`;
  }

  document.getElementById('lessonArea').innerHTML = `
    <div class="card">
      <div class="lesson-header">
        <div class="day-badge">
          <div class="day-num">${current + 1}</div>
          <div class="day-lbl">Day</div>
        </div>
        <div class="lesson-meta">
          <h2>${d.title}</h2>
          <div class="tagline">${d.tagline}</div>
        </div>
      </div>
      <div class="section-label">Today's lesson</div>
      <div class="lesson-body">${d.body}</div>
      ${quizHtml}
    </div>`;
}

function checkAnswer(chosen, correct, qid){
  const el = document.getElementById(qid);
  const d = days[current];
  if(!d.quiz) return;
  const isRight = chosen === correct;
  el.innerHTML = `<strong>${isRight ? 'Correct!' : 'Not quite.'}</strong> ${d.quiz.explain}`;
  el.className = 'answer-reveal show';
  el.style.background = isRight ? '#EAF3DE' : '#FCEBEB';
  el.style.borderColor = isRight ? '#3B6D11' : '#A32D2D';
  el.style.color = '#1a1a18';
}

render();
</script>
</body>
</html>
