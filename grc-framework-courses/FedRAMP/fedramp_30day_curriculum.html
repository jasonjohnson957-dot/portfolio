      <div class="cheat-pill"><strong>Monthly Deliverable Due Date</strong><span>FedRAMP monthly ConMon packages are due by the last business day of each month for the preceding month's activity. Missing this deadline is a ConMon compliance failure — the FedRAMP PMO tracks submission timeliness as a basic indicator of program management quality.</span></div>
      <div class="cheat-pill"><strong>Vulnerability Reporting Urgency</strong><span>Beyond monthly reporting, CSPs must report critical vulnerabilities outside the normal cycle: High-risk vulnerabilities discovered between monthly scans must be reported within 30 days of discovery (which may be faster than the monthly cycle). CISA Known Exploited Vulnerabilities require immediate action regardless of scan cycle timing.</span></div>
      <div class="cheat-pill"><strong>Annual Assessment Scope</strong><span>The annual 3PAO assessment doesn't retest every control every year. FedRAMP uses a risk-based sampling approach where: all High-risk controls are assessed every year, medium-risk controls on a 2-year cycle, low-risk controls on a 3-year cycle. This makes annual assessments feasible while ensuring higher-risk areas receive regular independent validation.</span></div>
      <div class="cheat-pill"><strong>Penetration Testing Annual</strong><span>Full penetration testing is required annually — not just vulnerability scanning, but active penetration attempts against the authorization boundary. New attack techniques, new system components, and changes to the cloud environment may create new attack paths that annual pen testing identifies before threat actors do.</span></div>
      <div class="cheat-pill"><strong>CSP ConMon Team Requirements</strong><span>Effective FedRAMP ConMon requires dedicated staff: a FedRAMP compliance manager coordinating the program, security engineers running vulnerability scanners and analyzing results, documentation staff maintaining SSP currency, and executive sponsorship ensuring remediation resources. Under-resourced ConMon programs quickly fall behind — generating findings faster than they're remediated.</span></div>
      <div class="cheat-pill"><strong>Leveraging Agency Review</strong><span>Agencies leveraging a FedRAMP authorization receive the monthly ConMon package and are expected to review it for issues relevant to their use case. An agency that never reviews ConMon reports is failing its own FISMA obligations — the CSP's monthly package gives agencies ongoing visibility into the security posture they're depending on.</span></div>
    </div>
    <div class="analogy-box"><strong>ConMon as aviation maintenance:</strong> Aircraft don't just get certified as airworthy once and fly indefinitely without maintenance. Aviation requires continuous monitoring: daily pre-flight checks, scheduled 100-hour inspections, annual certifications, immediate grounding for identified defects. FedRAMP ConMon works the same way — initial authorization is the first certification, monthly ConMon is the ongoing maintenance program, annual assessments are the scheduled inspections, and significant change requests are the maintenance log entries for major modifications. Federal data can't fly on an unmaintained cloud service any more than passengers should fly on an unmaintained aircraft.</div>`,
    quiz: { q: "A CSP's annual FedRAMP assessment is due in September. In July, the CSP implements a major infrastructure change — migrating their database layer to a new architecture. They submit a Significant Change Request in July and it's approved in August. How does this affect the September annual assessment?", opts: ["The annual assessment should be delayed until the change is fully tested", "The July infrastructure change should be included in the September annual assessment scope — the 3PAO should specifically test the new database architecture to verify the migration maintained the security posture. The approved SCR documents the change, but only the annual assessment verifies that it was implemented securely.", "The annual assessment can exclude the new database layer since it was just recently approved via SCR", "The SCR approval eliminates the need for the annual assessment for that year"], ans: 1, explain: "Annual assessments following significant changes should specifically include those changes in their scope. An SCR approval says the proposed change is acceptable from an authorization perspective — it doesn't verify that the change was implemented securely. The 3PAO's annual assessment testing the new database architecture verifies that the migration maintained the required security controls. Including recent significant changes in the annual assessment scope is a best practice that prevents security gaps from opening up in the period between change implementation and the next assessment." }
  },
  {
    title: "Significant Change Requests (SCR)",
    tagline: "How FedRAMP manages the security impact of cloud service evolution",
    body: `<p>Cloud services are never static — they continuously evolve with new features, architecture changes, new components, and operational improvements. FedRAMP's <span class="key-term">Significant Change Request (SCR)</span> process manages these changes to ensure that evolution doesn't inadvertently undermine the security posture that the authorization is based on. The SCR process is one of FedRAMP's most operationally important requirements — and one that CSPs most frequently struggle to implement correctly.</p>
    <div class="highlight-box"><strong>What constitutes a "significant change":</strong> Not every cloud update requires an SCR — minor patches, routine maintenance, and incremental configuration changes within documented parameters don't require formal SCR submission. Significant changes are those that materially affect the security posture, authorization boundary, or control implementation of the authorized service. FedRAMP guidance provides examples, but judgment is required. When in doubt, CSPs should consult with the FedRAMP PMO rather than deciding independently that a change is non-significant.</highlight-box>
    <p>Examples of changes that typically require an SCR:</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>New Components or Services</strong><span>Adding a major new service component to the authorization boundary — new databases, new processing systems, new sub-services. Also adding new external sub-services that interact with federal data (even if outside the boundary — they must be documented as interconnections).</span></div>
      <div class="cheat-pill"><strong>Architecture Changes</strong><span>Changes to the fundamental architecture of the cloud service — moving from single-region to multi-region, changing the network topology, implementing new load balancing or CDN architecture, changing the underlying virtualization or containerization platform.</span></div>
      <div class="cheat-pill"><strong>Cryptographic Changes</strong><span>Changing encryption algorithms, key management systems, or certificate authorities. Upgrading from one TLS version to another, implementing new encryption for previously unencrypted data, or changing the key hierarchy all require SCR documentation to verify the new approach meets FedRAMP requirements.</span></div>
      <div class="cheat-pill"><strong>Authentication Changes</strong><span>Implementing new identity providers, changing authentication mechanisms, adding new authentication factors, or modifying privileged access management architecture. Authentication changes have direct security implications that require assessment to verify they maintain or improve the control posture.</span></div>
      <div class="cheat-pill"><strong>Data Center Changes</strong><span>Adding new data center locations (especially in new countries or regions), changing physical security vendors, or modifying the physical infrastructure in ways that affect inherited physical controls. Geographic expansion has significant data sovereignty and compliance implications.</span></div>
      <div class="cheat-pill"><strong>New Product Features Affecting Security</strong><span>New customer-facing features that change how federal data is stored, processed, or transmitted — new data export capabilities, new API endpoints that access federal data, new mobile applications connecting to the authorized service. Any new interface where federal data flows requires SCR evaluation.</span></div>
    </div>
    <div class="warning-box"><strong>The stealth change problem:</strong> A significant and recurring FedRAMP compliance issue is "stealth changes" — material changes to cloud services deployed without SCR submission. The discovery of stealth changes during annual assessments is one of the most serious findings the PMO encounters, because it means the current SSP doesn't accurately describe the system and the annual assessment didn't test the actual deployed environment. CSPs with poor internal change management processes that don't route significant IT changes through the FedRAMP compliance team before deployment are most vulnerable to this finding.</div>`,
    quiz: { q: "A CSP's development team wants to add a new feature allowing agencies to export their data to Amazon S3 buckets. This creates a new data flow where federal data leaves the CSP's authorized environment. Does this require an SCR?", opts: ["No — data export features are standard and don't affect the authorization", "Yes — creating a new data flow where federal data exits the authorization boundary to external storage is a significant architectural change that must be reviewed through the SCR process to evaluate boundary implications, encryption requirements for data in transit and at rest in S3, and security controls over the export mechanism", "Only if the S3 buckets are in a different cloud provider", "It's the agency's responsibility — CSP data export features don't affect FedRAMP"], ans: 1, explain: "Adding a data export feature that sends federal data to external S3 buckets creates a new data flow exiting the authorization boundary — a material architectural change requiring SCR evaluation. The SCR review must address: whether the S3 export destination should be within the authorization boundary, encryption requirements for data in transit and at rest in S3, access controls for the export mechanism, logging and auditing of export events, and potential implications for agency data governance. The FedRAMP PMO must evaluate these implications before the feature is deployed in the federal production environment." }
  },
  {
    title: "FedRAMP and FISMA — The Legal Relationship",
    tagline: "How the program and the law fit together — and what each requires",
    body: `<p>FedRAMP and FISMA are deeply intertwined — FedRAMP is the mechanism through which agencies fulfill their FISMA obligations for cloud services. But they are distinct, and understanding how they relate prevents the common confusion between them. FISMA creates the legal obligation; FedRAMP creates the standardized process for fulfilling it in the cloud context.</p>
    <div class="highlight-box"><strong>The fundamental relationship:</strong> FISMA requires federal agencies to obtain security authorization (ATO) for all information systems before they operate. FedRAMP provides a standardized, reusable authorization process specifically designed for cloud services. When an agency uses a FedRAMP-authorized cloud service and issues an agency ATO based on the FedRAMP package, they are fulfilling their FISMA obligation for that cloud system through FedRAMP's mechanism. Without FedRAMP, every agency would need to conduct a full FISMA RMF assessment independently for every cloud service — returning to the pre-FedRAMP chaos the program was designed to eliminate.</highlight-box>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>FISMA Requires ATO; FedRAMP Provides the Process</strong><span>FISMA says agencies must have ATOs for all information systems. For cloud systems, agencies satisfy this by: leveraging an existing FedRAMP authorization (CSP already has P-ATO or Agency ATO), issuing their own agency ATO based on the FedRAMP documentation, and maintaining the authorization through ConMon. The FedRAMP authorization doesn't replace the agency ATO — it provides the evidence base for it.</span></div>
      <div class="cheat-pill"><strong>Mandatory Use of FedRAMP</strong><span>OMB policy (now reinforced by the FedRAMP Authorization Act 2022) requires agencies to use FedRAMP-authorized cloud services when cloud solutions are procured for federal use. Agencies cannot legally use unapproved cloud services for federal data — they must either use FedRAMP-authorized services or conduct their own equivalent full assessment (a rarely used alternative that requires PMO consultation).</span></div>
      <div class="cheat-pill"><strong>IG Evaluation of FedRAMP Compliance</strong><span>Agency Inspector Generals evaluate FedRAMP compliance as part of annual FISMA evaluations — checking that cloud services in use have FedRAMP authorizations, that agency ATOs have been issued based on FedRAMP packages, and that ConMon reviews are being conducted. Using an unauthorized cloud service for federal data is a FISMA finding in IG evaluations.</span></div>
      <div class="cheat-pill"><strong>NIST Standards Apply to Both</strong><span>Both FISMA and FedRAMP use the same NIST SP 800-53 control catalog, FIPS 199 impact levels, and NIST SP 800-37 RMF process. The underlying security standards are identical — FedRAMP adapts their application to the cloud context with cloud-specific implementation guidance, but the fundamental security requirements come from the same NIST publications.</span></div>
    </div>
    <div class="analogy-box"><strong>FISMA as the building code; FedRAMP as the preapproved design service:</strong> FISMA is like a building code — every building must meet it. Building code compliance can be demonstrated by: hiring an architect who designs a fully custom building with inspector sign-off at every step, or by using a preapproved design service that has already gotten the key structural elements approved. FedRAMP is the preapproved design service — when you use a FedRAMP-authorized cloud service, the key security "structural elements" (the CSP's controls) have already been approved. You still need the final inspection (agency ATO), but the bulk of the compliance work has been done once and shared.</div>`,
    quiz: { q: "A federal agency's IG evaluation finds they are using three cloud SaaS services without FedRAMP authorizations — tools they adopted for convenience without going through proper authorization. What FISMA violations does this represent?", opts: ["No FISMA violation — cloud tools don't require formal authorization", "Multiple FISMA violations: operating information systems without ATOs (a core FISMA requirement), failure to use FedRAMP-authorized services as required by OMB policy and the FedRAMP Authorization Act, and potentially FISMA's requirement to inventory all systems. Each unauthorized service represents an independent finding.", "Only a violation if the services process PII", "A minor finding that requires documentation but no immediate action"], ans: 1, explain: "Using cloud services for federal data without FedRAMP authorization represents multiple, serious FISMA violations. FISMA requires ATOs for all information systems before they operate. OMB policy and the FedRAMP Authorization Act require FedRAMP-authorized cloud services for federal use. Each unauthorized cloud service is a separate system operating without ATO authorization — a direct FISMA compliance failure. The IG will document each as a finding, the services must either be authorized immediately (through sponsoring FedRAMP authorization) or discontinued, and the agency must explain corrective actions." }
  },
  {
    title: "FedRAMP for IaaS, PaaS, and SaaS",
    tagline: "How the cloud service model affects FedRAMP scope, responsibilities, and complexity",
    body: `<p>FedRAMP applies across all three cloud service models — Infrastructure as a Service (IaaS), Platform as a Service (PaaS), and Software as a Service (SaaS) — but the authorization scope, customer responsibilities, control complexity, and number of leveraging relationships differ significantly by model. Understanding these differences is essential for both CSPs pursuing authorization and agencies making cloud procurement decisions.</p>
    <div class="auth-card"><b>IaaS — Infrastructure as a Service (e.g., AWS GovCloud, Azure Government, Google Cloud)</b><br>The foundational cloud model providing compute, storage, and networking. FedRAMP IaaS authorizations cover the infrastructure layer — physical data centers, virtualization platforms, core network infrastructure, and managed infrastructure services. Customer agencies (and PaaS/SaaS providers building on IaaS) inherit the IaaS controls for infrastructure components but are responsible for everything they build on top: the operating systems they configure, the applications they deploy, the data they store, and the access controls they implement. IaaS authorizations are the most complex — they cover the most components and the most controls — and provide the inheritance foundation for the entire FedRAMP ecosystem.</div>
    <div class="auth-card"><b>PaaS — Platform as a Service (e.g., Salesforce Platform, application hosting environments)</b><br>The middle layer providing development platforms, databases, middleware, and managed application services on top of IaaS. FedRAMP PaaS authorizations cover the platform layer — the managed application environment, databases, development tools, and the IaaS infrastructure it runs on (either through direct inheritance or explicit dependency). PaaS customers (typically agency application developers) inherit the platform controls and are responsible for the applications they deploy on the platform and the data they process. PaaS authorizations often explicitly inherit from the underlying IaaS authorization.</div>
    <div class="auth-card"><b>SaaS — Software as a Service (e.g., Microsoft 365 Government, Slack GovSlack, DocuSign Government)</b><br>The highest layer — complete applications delivered to end users. FedRAMP SaaS authorizations cover the full application stack: the application itself, the platform it runs on, and the infrastructure beneath. Customer agencies' responsibilities are smallest in SaaS — primarily user account management, access configuration, and data governance within the SaaS application. Most agencies' cloud service experience is SaaS, making this the most common authorization type in the FedRAMP Marketplace.</div>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>The Inheritance Stack</strong><span>FedRAMP's most powerful efficiency mechanism: a SaaS running on FedRAMP-authorized PaaS running on FedRAMP-authorized IaaS creates an inheritance stack. Each layer can inherit controls from the layer below. An agency using the SaaS benefits from three layers of FedRAMP authorization — the IaaS infrastructure, the PaaS platform, and the SaaS application — without separately assessing each layer.</span></div>
      <div class="cheat-pill"><strong>Customer Responsibility Scale</strong><span>Customer security responsibility scales inversely with service model: IaaS customers have the most responsibility (everything from OS to application), PaaS customers have moderate responsibility (applications and data), SaaS customers have the least responsibility (primarily user management and data governance). The CRM for each service type reflects this scale.</span></div>
    </div>`,
    quiz: { q: "Agency A is using a FedRAMP-authorized SaaS application built on a FedRAMP-authorized PaaS which runs on a FedRAMP-authorized IaaS. Agency B uses the same IaaS directly for their custom application. Which agency has more security responsibility in their use of the IaaS?", opts: ["Agency A — they have more services to manage", "Agency B — using IaaS directly places maximum security responsibility on the customer. Agency B must implement OS hardening, application security, and everything above the IaaS infrastructure layer. Agency A's SaaS vendor inherited those responsibilities, leaving Agency A primarily responsible for user management and application configuration.", "Both have identical responsibilities — the IaaS authorization is the same", "Neither — the IaaS provider handles all security"], ans: 1, explain: "The IaaS service model maximizes customer responsibility. Agency B using IaaS directly is responsible for: configuring operating systems securely, hardening applications they deploy, managing application-level access controls, ensuring their application encrypts data correctly, and all security activities above the IaaS infrastructure layer. Agency A's SaaS vendor inherited those responsibilities through the PaaS/IaaS inheritance stack, leaving Agency A with primarily user management and SaaS configuration responsibilities. This is why most agencies prefer SaaS — less security responsibility even if less flexibility." }
  },
  {
    title: "FedRAMP High — When Moderate Isn't Enough",
    tagline: "The demanding standard for systems where security failures could cause catastrophic harm",
    body: `<p><span class="key-term">FedRAMP High</span> is the most demanding FedRAMP authorization level, required when the compromise of a federal system's confidentiality, integrity, or availability would have a severe or catastrophic adverse effect on agency operations, assets, or individuals. Understanding when High is required, what it demands of CSPs, and how the market for FedRAMP High differs from Moderate is increasingly important as more federal use cases move to cloud.</p>
    <div class="highlight-box">FedRAMP High uses the NIST SP 800-53 High baseline — approximately 420 controls compared to ~325 for Moderate. This isn't just more controls — many controls have more demanding implementation requirements at High than at Moderate. For example, at Moderate, encryption key rotation may be required annually; at High, it may be required quarterly. FedRAMP High also requires more rigorous continuous monitoring and more frequent penetration testing.</highlight-box>
    <p>Use cases that typically require FedRAMP High:</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Law Enforcement Systems</strong><span>Criminal justice information systems, FBI criminal records, DHS immigration data, and other law enforcement data stores where unauthorized disclosure could endanger law enforcement operations, compromise ongoing investigations, or put individuals at physical risk.</span></div>
      <div class="cheat-pill"><strong>Healthcare and Health Data</strong><span>VA electronic health records, HHS health data systems, public health emergency response systems where patient safety depends on system availability and data integrity. The VA's clinical systems exemplify High-impact healthcare use cases where system compromise could directly harm patients.</span></div>
      <div class="cheat-pill"><strong>Financial Systems</strong><span>Federal financial management systems, Social Security payment systems, IRS processing systems where compromise could cause significant financial harm to millions of citizens or destabilize government financial operations.</span></div>
      <div class="cheat-pill"><strong>Emergency Response</strong><span>Emergency management systems, disaster response coordination platforms, and systems supporting life-safety functions where system unavailability during critical periods could prevent effective emergency response and contribute to loss of life.</span></div>
      <div class="cheat-pill"><strong>National Security-Adjacent</strong><span>Unclassified systems that support national security operations, intelligence community-adjacent systems, and defense systems handling unclassified-but-sensitive information where compromise could provide adversaries with operationally significant information.</span></div>
      <div class="cheat-pill"><strong>Critical Infrastructure Control</strong><span>Systems supporting critical infrastructure operations — not the classified SCADA systems themselves, but the business and administrative systems that support critical infrastructure management where compromise could indirectly affect infrastructure operations.</span></div>
    </div>
    <div class="warning-box"><strong>The FedRAMP High market reality:</strong> Significantly fewer cloud services have FedRAMP High authorization than Moderate — the FedRAMP Marketplace has hundreds of Moderate offerings but far fewer High. This smaller market creates real challenges for agencies needing High: fewer vendors to choose from, higher costs (implementing 420+ controls is expensive), and longer authorization timelines. Many High use cases end up relying on on-premise or private government cloud solutions rather than commercial FedRAMP High services specifically because the High commercial cloud market remains limited.</div>`,
    quiz: { q: "The VA wants to move a clinical decision support system that stores veterans' mental health records and psychiatric diagnoses to a commercial cloud service. This system directly supports clinical treatment decisions. What FedRAMP level is required?", opts: ["FedRAMP Low — clinical support tools are typically simple", "FedRAMP High — veterans' mental health records carry High confidentiality sensitivity, clinical decision support has High integrity requirements (wrong data could cause wrong treatment), and the system likely has High availability requirements for clinical operations. The high watermark gives this system a High overall impact level.", "FedRAMP Moderate — veterans' records are similar to standard PII", "FedRAMP LI-SaaS — because the clinical data is only shared with authorized clinicians"], ans: 1, explain: "A clinical decision support system handling veterans' mental health records requires FedRAMP High. Confidentiality: mental health and psychiatric records are among the most sensitive health information — unauthorized disclosure could devastate veterans' careers, relationships, and lives (High). Integrity: wrong clinical decision support data could lead to incorrect treatment decisions, potentially harming or killing patients (High). Availability: clinical systems that go down during patient care delivery directly impair the delivery of medical care (High). The high watermark principle gives this system a High overall categorization — it needs FedRAMP High cloud services." }
  },
  {
    title: "FedRAMP LI-SaaS — The Tailored Baseline",
    tagline: "FedRAMP's streamlined path for genuinely low-risk software services",
    body: `<p><span class="key-term">FedRAMP Tailored for Low Impact Software as a Service (LI-SaaS)</span> is a specialized FedRAMP baseline that dramatically reduces the authorization burden for cloud services that process only publicly available, non-sensitive information. Introduced in 2017, LI-SaaS was NIST's and FedRAMP's response to the criticism that the standard FedRAMP process was too burdensome for simple, low-risk productivity tools that agencies wanted to use for routine, non-sensitive work.</p>
    <div class="highlight-box"><strong>LI-SaaS eligibility requirements — all must be met:</strong><br>• The system is a SaaS delivery model (not IaaS or PaaS)<br>• The data stored in the system is publicly releasable — no PII beyond login credentials (name and government email only), no sensitive business information<br>• The system is designed primarily for individual use rather than enterprise data management<br>• The government customer, not the CSP, owns all data stored in the system<br>• The system does not host any government infrastructure<br>These requirements are strict — many tools agencies want to use as "low risk" actually fail LI-SaaS eligibility because they store more than just publicly releasable information.</highlight-box>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Drastically Reduced Control Count</strong><span>LI-SaaS requires only ~37 controls compared to ~325 for Moderate. These 37 controls represent the absolute minimum baseline — primarily covering access management, incident response fundamentals, and basic operational security. The dramatic reduction reflects that the data risk is genuinely minimal when no sensitive federal information is stored.</span></div>
      <div class="cheat-pill"><strong>Faster Authorization Timeline</strong><span>With only 37 controls to assess, LI-SaaS authorizations can be completed in months rather than the 12-18 month timeline for Moderate. The simplified process makes it feasible for more CSPs to pursue federal market access — democratizing FedRAMP for smaller vendors with genuinely low-risk tools.</span></div>
      <div class="cheat-pill"><strong>Self-Attestation Component</strong><span>LI-SaaS includes a self-attestation component where the CSP certifies certain security practices rather than having every element independently assessed by a 3PAO. The self-attestation reflects the lower risk profile — while 3PAO involvement is still required for key controls, the full independent assessment rigor of Moderate/High is reduced proportionately.</span></div>
      <div class="cheat-pill"><strong>LI-SaaS Eligible Examples</strong><span>Simple project tracking tools where teams share publicly available planning information, public webinar or video conferencing platforms used for meetings on non-sensitive topics, document collaboration tools handling only draft documents of publicly releasable information. The common thread: no sensitive federal data, only publicly releasable content.</span></div>
      <div class="cheat-pill"><strong>LI-SaaS Ineligible Examples</strong><span>Email systems (store more than publicly releasable information), CRM tools (store customer PII), any system where employees discuss sensitive policy matters (making the content non-publicly-releasable), financial management tools, HR systems, or any tool storing government-internal working documents not intended for public release.</span></div>
      <div class="cheat-pill"><strong>Agency Responsibility Under LI-SaaS</strong><span>Agencies using LI-SaaS services must ensure they only use them for publicly releasable information. If agency users start storing sensitive information in a LI-SaaS tool — even inadvertently — the actual impact level of the tool's use has exceeded what the authorization covers. Agencies must monitor and enforce appropriate use.</span></div>
    </div>`,
    quiz: { q: "A federal agency wants to use a cloud meeting scheduling tool where employees book conference rooms and meeting times. No meeting content is stored — just calendar slots and meeting titles like 'Team Standup' or 'Project Review.' Does this qualify for LI-SaaS?", opts: ["No — all federal systems require at least Moderate authorization", "Potentially yes — a meeting scheduling tool storing only calendar slots and meeting titles (no sensitive content, no PII beyond government email addresses for invitees) could meet LI-SaaS eligibility if the data is publicly releasable and meets all other LI-SaaS criteria", "Yes — but only if meetings are about public topics", "LI-SaaS only applies to document management tools"], ans: 1, explain: "A simple meeting scheduling tool storing calendar slots and meeting titles (without content) could meet LI-SaaS eligibility — the data (schedule availability, generic meeting titles) is arguably publicly releasable and contains no sensitive information beyond government email addresses (permissible under LI-SaaS). However, the agency must confirm: meetings with sensitive titles wouldn't be scheduled here (creating non-publicly-releasable data), attendee information is limited to government email addresses, and no sensitive information could flow through the tool's features. If these conditions are met, LI-SaaS could be the appropriate authorization level." }
  },
  {
    title: "How Agencies Leverage FedRAMP — The Reuse Model in Practice",
    tagline: "What agencies actually do when they want to use a FedRAMP-authorized cloud service",
    body: `<p>Understanding FedRAMP from the agency side — how agencies actually use existing FedRAMP authorizations rather than creating new ones — is as important as understanding the CSP authorization process. The reuse model is FedRAMP's core value delivery mechanism, and agencies that understand it can adopt cloud services much faster and at much lower cost than pre-FedRAMP procurement.</p>
    <div class="auth-card"><b>Step 1 — Identify the Need and Find FedRAMP Options</b><br>The agency identifies a cloud service need (collaboration, document management, CRM, etc.) and searches the FedRAMP Marketplace for authorized options at the appropriate impact level. The Marketplace shows all authorized services, their impact levels, authorization types, and which agencies are already using them. An agency that wants to use a service already adopted by peer agencies can leverage their experience and potentially their documentation.</div>
    <div class="auth-card"><b>Step 2 — Review the Existing Authorization Package</b><br>The agency's security team reviews the CSP's authorization documentation — the SSP, SAR, POA&M, and ConMon reports. This review focuses on: whether the service's security posture is adequate for the agency's specific use case, what customer responsibilities the CRM identifies (what the agency must implement), what open POA&M items exist and whether they're acceptable, and whether any agency-specific risk factors warrant additional controls or restrictions.</div>
    <div class="auth-card"><b>Step 3 — Assess Agency-Specific Risks</b><br>The leveraging agency identifies any risks specific to their use case that may not be fully addressed in the existing authorization. This might include: the specific sensitivity of the data they'll process (is it within the authorized impact level?), additional compliance requirements the agency has (HIPAA, Privacy Act, etc.), agency-specific network architecture considerations, or special access patterns. For most standard use cases within the authorized scope, this assessment is straightforward and quick — hours to days rather than months.</div>
    <div class="auth-card"><b>Step 4 — Issue the Agency ATO</b><br>The agency's Authorizing Official (AO) reviews the existing FedRAMP package plus the agency-specific risk analysis and issues an agency ATO. This ATO formally authorizes the agency's specific use of the cloud service, accepting the residual risks documented in the FedRAMP package and any additional agency-specific risks. The agency ATO is the legal FISMA authorization that completes the agency's compliance obligation.</div>
    <div class="auth-card"><b>Step 5 — Implement Customer-Provided Controls</b><br>The agency implements all controls identified as "Customer-Provided" in the CRM — configuring user access management, setting up audit logging for agency-specific events, implementing data handling procedures, training agency users on appropriate use. These customer-provided controls are not optional — they're part of the security posture that the ATO is based on.</div>
    <div class="auth-card"><b>Step 6 — Ongoing Monitoring</b><br>The agency monitors the CSP's ongoing ConMon deliverables (received monthly), reviews their POA&M for emerging issues, ensures their own customer-provided controls remain implemented, and stays alert to changes in the service or in the agency's use case that might affect the authorization's validity.</div>`,
    quiz: { q: "An agency finds a FedRAMP Moderate authorized collaboration tool in the Marketplace. Before issuing their agency ATO, they review the SAR and find 5 open Moderate-risk POA&M items. Should they issue the ATO?", opts: ["No — any open POA&M items disqualify a service from agency use", "The AO must make a risk-based decision — Moderate-risk items with reasonable remediation timelines are typically acceptable for authorization, especially if the items are being actively managed. The AO reviews the nature of the findings, the CSP's remediation plan and timeline, and whether the residual risk is acceptable for the agency's specific use case.", "Yes — agencies always accept FedRAMP-authorized services without review", "Only if all 5 items are scheduled for remediation within 30 days"], ans: 1, explain: "Open POA&M items are normal and expected in any actively managed security program — they represent known, tracked weaknesses, not disqualifying failures. The AO's role is to make a risk-based decision: are these specific weaknesses acceptable for this agency's use case given the nature of the findings, the CSP's remediation commitment, and the agency's risk tolerance? Five Moderate-risk items with credible remediation plans and reasonable timelines are typically acceptable. Five High-risk items with no remediation timeline or a CSP history of POA&M non-compliance would be more concerning." }
  },
  {
    title: "FedRAMP and Zero Trust — The Next Evolution",
    tagline: "How the government's Zero Trust mandate is reshaping FedRAMP requirements",
    body: `<p>Executive Order 14028 and OMB M-22-09 established an aggressive federal Zero Trust mandate — requiring agencies to achieve specific Zero Trust architecture goals for fiscal year 2024. These requirements are reshaping how FedRAMP operates, what controls are emphasized in FedRAMP assessments, and what cloud services agencies can and should adopt. Understanding the FedRAMP-Zero Trust intersection is essential for anyone working in federal cloud security today.</p>
    <div class="highlight-box"><strong>The Zero Trust principle applied to cloud:</strong> FedRAMP has always required strong access controls, encryption, and continuous monitoring — all consistent with Zero Trust principles. But traditional FedRAMP assessments focused on the cloud service's own security posture without explicitly evaluating how the service supports agency Zero Trust implementation. The EO 14028/M-22-09 requirements are driving FedRAMP to more explicitly evaluate how cloud services enable agencies to achieve Zero Trust outcomes — particularly around identity, device trust, and network micro-segmentation.</highlight-box>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Identity as the New Perimeter</strong><span>Zero Trust replaces network perimeter trust with identity-based trust. FedRAMP services must support phishing-resistant MFA for all access — specifically FIDO2/WebAuthn or PIV/CAC credentials rather than traditional password+SMS MFA. FedRAMP assessments are increasingly verifying that services support phishing-resistant authentication, not just "some form of MFA."</span></div>
      <div class="cheat-pill"><strong>Continuous Authorization</strong><span>Zero Trust requires continuous evaluation of access requests rather than one-time authentication. FedRAMP services should support contextual access policies — evaluating device health, network location, and behavioral signals at each access request, not just at login. This goes beyond traditional access control to real-time access evaluation.</span></div>
      <div class="cheat-pill"><strong>Encryption Everywhere</strong><span>OMB M-22-09 requires federal agencies to encrypt all traffic — both external and internal network traffic. FedRAMP services must support TLS 1.2+ for all data in transit (already required) and must encrypt internal service-to-service communication as well. "HTTPS on the outside, unencrypted internally" is no longer acceptable.</span></div>
      <div class="cheat-pill"><strong>Logging for Zero Trust Analytics</strong><span>EO 14028 and M-21-31 require comprehensive logging to support detection and response. FedRAMP services must produce comprehensive, machine-readable logs in standard formats that feed agency SIEM/security operations. The logging requirements under M-21-31's tiered approach are increasingly embedded in FedRAMP assessments.</span></div>
      <div class="cheat-pill"><strong>Supply Chain Security (SBOM)</strong><span>EO 14028 requires software vendors to provide Software Bills of Materials (SBOMs) to federal customers — inventories of all software components in their products. FedRAMP services are increasingly expected to maintain and share SBOMs so agencies can quickly identify vulnerable components when new CVEs are disclosed.</span></div>
      <div class="cheat-pill"><strong>FedRAMP Rev 5 Alignment</strong><span>FedRAMP's ongoing update to align with NIST SP 800-53 Rev 5 incorporates many Zero Trust-aligned controls — particularly in the Identity and Authentication (IA), Access Control (AC), and System and Communications Protection (SC) families. CSPs updating to Rev 5 baselines are simultaneously advancing their Zero Trust alignment.</span></div>
    </div>`,
    quiz: { q: "An agency is evaluating two FedRAMP Moderate authorized cloud services. Service A supports only username/password and SMS-based MFA. Service B supports FIDO2/WebAuthn hardware keys and PIV/CAC smart card authentication. Under OMB M-22-09's phishing-resistant MFA requirements, which service better aligns with the agency's Zero Trust mandate?", opts: ["Service A — SMS MFA is easier for users to adopt", "Service B — FIDO2/WebAuthn and PIV/CAC authentication are phishing-resistant, meeting OMB M-22-09's specific requirement for phishing-resistant MFA. SMS-based MFA is explicitly not considered phishing-resistant and does not satisfy M-22-09 for privileged users and high-impact systems.", "Both are equivalent — any MFA satisfies Zero Trust requirements", "Service A — PIV/CAC is only required for classified systems"], ans: 1, explain: "OMB M-22-09 specifically requires 'phishing-resistant MFA' — a technical category that explicitly excludes SMS and other easily phishable MFA factors. Phishing-resistant MFA is defined as methods resistant to credential phishing: FIDO2/WebAuthn hardware security keys, PIV/CAC smart cards, and similar cryptographic authenticators. An attacker who sends a fake login page to a user with SMS MFA can capture both the password and the SMS code in real time. With FIDO2/WebAuthn, the cryptographic challenge-response is bound to the legitimate domain and can't be intercepted this way. Service B's support for truly phishing-resistant authentication directly satisfies M-22-09's requirement." }
  },
  {
    title: "FedRAMP Rev 5 — The NIST SP 800-53 Rev 5 Update",
    tagline: "How FedRAMP is evolving to align with the latest NIST security controls",
    body: `<p>NIST SP 800-53 was updated to Revision 5 in September 2020, adding the PT (PII Processing and Transparency) and SR (Supply Chain Risk Management) control families and significantly updating controls across all families. FedRAMP has been working to update its baselines and templates to align with Rev 5 — a transition that affects every CSP with an existing authorization and every CSP pursuing new authorization. Understanding the Rev 5 update is essential for anyone managing or pursuing FedRAMP authorization.</p>
    <div class="highlight-box"><strong>The FedRAMP Rev 5 transition timeline:</strong> FedRAMP officially released Rev 5 baselines in 2023, giving existing authorized CSPs a defined transition period to update their documentation and control implementations. New authorizations are being conducted against Rev 5 baselines. Existing authorizations operating against Rev 4 baselines must transition to Rev 5 within the established timeframe — the transition is not optional for continuing authorizations.</highlight-box>
    <p>What Rev 5 adds to FedRAMP requirements:</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>PT Family — PII Processing and Transparency</strong><span>New controls specifically addressing how cloud services handle Personally Identifiable Information. For FedRAMP, PT controls require CSPs to: document what PII their service processes, establish policies for PII minimization, implement technical controls to limit PII exposure, and provide agencies with transparency about PII handling. Particularly important for SaaS services that inherently handle user/employee PII.</span></div>
      <div class="cheat-pill"><strong>SR Family — Supply Chain Risk Management</strong><span>New controls addressing the security of the CSP's own supply chain — the hardware manufacturers, software vendors, and sub-service providers they depend on. Post-SolarWinds, these controls address: component authenticity, supplier vetting, software bill of materials documentation, and plans for supply chain compromise response. Directly responsive to the nation-state supply chain threat that SolarWinds exemplified.</span></div>
      <div class="cheat-pill"><strong>Enhanced Privacy Integration</strong><span>Rev 5 weaves privacy controls throughout the entire catalog — not just the PT family. Many existing control families have enhanced privacy considerations: AC controls address privacy-aware access management, AU controls address privacy-preserving audit logging, and SA controls address privacy considerations in system acquisition. CSPs must address these integrated privacy requirements across all control families.</span></div>
      <div class="cheat-pill"><strong>Outcomes-Oriented Language</strong><span>Rev 5 reframed many controls in outcomes-oriented language — describing what the control must achieve rather than just what must be done. This allows more flexibility in implementation approaches while maintaining clarity about the required security outcomes. For FedRAMP, this means CSPs have more implementation flexibility while 3PAOs assess against clear outcome criteria.</span></div>
      <div class="cheat-pill"><strong>Consolidated and Clarified Controls</strong><span>Rev 5 merged some redundant controls and clarified ambiguous ones, reducing the total number of base controls while maintaining comprehensive coverage. For CSPs transitioning from Rev 4 to Rev 5, some previously separate controls are combined (potentially simplifying implementation) while new controls require implementation work.</span></div>
      <div class="cheat-pill"><strong>OSCAL — Machine-Readable Documentation</strong><span>Alongside Rev 5, NIST published the Open Security Controls Assessment Language (OSCAL) — a machine-readable format for security documentation. FedRAMP is increasingly requiring documentation in OSCAL format, enabling automated processing of security documentation, reducing manual review burden, and enabling more efficient FedRAMP package validation.</span></div>
    </div>`,
    quiz: { q: "A CSP's FedRAMP authorized service stores government employee directories including names, work email addresses, and phone numbers. Under FedRAMP Rev 5, which new control family specifically addresses how this PII should be handled?", opts: ["SR — Supply Chain Risk Management", "PT — Personally Identifiable Information Processing and Transparency. The PT family provides controls specifically designed to address the processing of PII — including documentation of what PII is collected, minimization requirements, transparency to data subjects, and technical controls to limit PII exposure.", "AC — Access Control", "All of the above equally apply"], ans: 1, explain: "The PT (PII Processing and Transparency) family added in SP 800-53 Rev 5 specifically addresses how systems handle PII. For a government employee directory containing names, email addresses, and phone numbers, PT controls require the CSP to: document this PII processing in the SSP, implement PII minimization (collecting only necessary PII), provide appropriate transparency, and implement technical controls to protect PII. While AC controls also apply (restricting who can access the directory), PT controls specifically address the privacy aspects of PII processing that weren't explicitly addressed in Rev 4." }
  },
  {
    title: "Common FedRAMP Failures and How to Avoid Them",
    tagline: "The patterns that delay authorization and undermine ongoing compliance",
    body: `<p>After more than a decade of FedRAMP implementations, clear failure patterns have emerged — the same problems appear repeatedly across CSPs at different stages of the authorization process. Understanding these patterns is the practical knowledge that separates experienced federal cloud security practitioners from those who encounter these problems unnecessarily.</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Inaccurate Authorization Boundary</strong><span>The most foundational failure: a boundary diagram and SSP that don't accurately represent the actual cloud environment. Stealth services outside the boundary, undocumented data flows, and missing component descriptions all stem from inadequate boundary analysis. Discovered during assessment, an inaccurate boundary can require significant SSP rework that delays authorization by months.</span></div>
      <div class="cheat-pill"><strong>Generic Control Implementation Statements</strong><span>SSP control implementation statements that copy NIST control language rather than describing specifically how the CSP implements the control. "We implement access controls in accordance with AC-2 requirements" tells a 3PAO nothing they can verify. "Access management is implemented through our IAM module configured with role-based groups reviewed quarterly by the ISSO" gives assessors specific, testable claims.</span></div>
      <div class="cheat-pill"><strong>Inadequate ConMon Operations</strong><span>CSPs that treat ConMon as a report submission exercise rather than an active security management program. Monthly vulnerability scan reports submitted without systematic review and remediation. POA&M items accumulating without closure. The FedRAMP PMO will eventually take action — the question is whether the CSP gets ahead of the problem or is forced to respond to a PMO enforcement action.</span></div>
      <div class="cheat-pill"><strong>Stealth Changes</strong><span>Material changes to the cloud service deployed without SCR submission. Discovered during annual assessments when the SSP describes a system that no longer matches reality. The consequences range from requiring emergency SCR documentation to temporary suspension while the change impact is assessed. CSPs without robust internal change management processes that route IT changes through FedRAMP compliance review are most vulnerable.</span></div>
      <div class="cheat-pill"><strong>Underprepared 3PAO Engagement</strong><span>CSPs that engage a 3PAO before completing the SSP, without completing the boundary analysis, or without implementing the security controls being assessed. Assessments that begin before the CSP is ready consistently produce long OTS finding lists that require months of remediation — effectively delaying the assessment until the SSP accurately describes an implemented security program.</span></div>
      <div class="cheat-pill"><strong>Underestimating Resource Requirements</strong><span>FedRAMP authorization requires sustained investment: security engineers to implement controls, documentation staff to produce and maintain SSP documentation, a compliance manager to coordinate the process, executive attention to unblock resources, and 3PAO fees ($250K-$500K+ for Moderate). CSPs that budget for only the 3PAO fees discover that the internal preparation work is far more expensive than the third-party assessment.</span></div>
      <div class="cheat-pill"><strong>Neglecting Customer Documentation</strong><span>CSPs that produce minimal Customer Responsibility Matrix documentation, assuming agencies will figure out their responsibilities. Agencies that don't understand their responsibilities create insecure deployments — generating incidents that reflect poorly on the CSP's FedRAMP program even when the CSP's own controls are fine. Robust, clear CRM documentation is both a compliance requirement and good customer service.</span></div>
      <div class="cheat-pill"><strong>Scope Creep Without SCR</strong><span>The cloud service grows to serve new customer needs — new data types, new integrations, new geographic regions — without formally expanding the authorization scope through SCRs. The authorization covers the original service; the agency believes they're protected; but the actual deployed service has grown beyond what was assessed. This mismatch creates security gaps that IG evaluations and annual assessments eventually surface.</span></div>
    </div>`,

    tagline: "How FedRAMP connects to FISMA, CMMC, ISO 27001, and the broader compliance ecosystem",
    body: `<p>FedRAMP doesn't exist in isolation — it operates within and alongside a rich ecosystem of security and compliance frameworks. Understanding how FedRAMP relates to these other frameworks enables GRC professionals to build integrated compliance programs rather than redundant parallel efforts. This is particularly important for organizations serving both government and commercial markets, and for federal agencies managing multiple compliance obligations simultaneously.</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>FedRAMP and FISMA</strong><span>FedRAMP is the FISMA implementation mechanism for cloud services. FISMA requires ATOs for all federal information systems; FedRAMP provides the standardized process for achieving them in cloud environments. FedRAMP authorization enables agencies to issue FISMA-compliant ATOs faster and more efficiently than independent agency assessments. FISMA is the law; FedRAMP is the cloud-specific process that satisfies it.</span></div>
      <div class="cheat-pill"><strong>FedRAMP and NIST RMF</strong><span>FedRAMP follows the NIST RMF process — Prepare, Categorize, Select, Implement, Assess, Authorize, Monitor — adapted for cloud environments. FedRAMP's authorization process is essentially the NIST RMF applied by a 3PAO rather than agency assessors, producing a reusable package rather than an agency-specific one. The underlying methodology is identical.</span></div>
      <div class="cheat-pill"><strong>FedRAMP and CMMC</strong><span>Significant control overlap exists between FedRAMP Moderate and CMMC Level 2 — both are based on NIST SP 800-53 and SP 800-171, which share extensive control sets. CSPs pursuing both FedRAMP and CMMC (to serve both civilian and defense agency markets) can leverage overlapping documentation and control implementations. DoD's cloud services often require both FedRAMP authorization AND CMMC compliance.</span></div>
      <div class="cheat-pill"><strong>FedRAMP and ISO 27001</strong><span>ISO 27001 and FedRAMP address the same domain (information security management) with significant control overlap (~70-80%). CSPs with ISO 27001 certifications have mature security programs that align well with FedRAMP requirements — but ISO 27001 cannot substitute for FedRAMP authorization. Agencies need FedRAMP; ISO 27001 certification is supplementary evidence of security maturity but doesn't satisfy the FedRAMP mandate.</span></div>
      <div class="cheat-pill"><strong>FedRAMP and StateRAMP</strong><span>StateRAMP is a state/local government equivalent to FedRAMP — a standardized cloud security authorization program for state and local government cloud adoption. StateRAMP uses the same NIST SP 800-53 foundation and similar authorization processes. Some cloud providers pursue both FedRAMP (federal) and StateRAMP (state/local) to serve government at all levels with a unified security program.</span></div>
      <div class="cheat-pill"><strong>FedRAMP and SOC 2</strong><span>SOC 2 is a commercial audit framework (AICPA) for service organizations. Many FedRAMP-authorized CSPs also maintain SOC 2 Type II reports for their commercial customers — using overlapping security controls. Some SOC 2 evidence supports FedRAMP documentation, but they're fundamentally different: FedRAMP assesses against NIST 800-53 controls with government-specific requirements; SOC 2 assesses against Trust Services Criteria with broader commercial applicability.</span></div>

    <div class="highlight-box"><strong>The integrated compliance opportunity:</strong> Organizations serving multiple government and commercial markets — federal agencies, state governments, DoD contractors, and commercial customers — increasingly design unified compliance programs that satisfy FedRAMP, CMMC, ISO 27001, and SOC 2 simultaneously through a single set of controls and documentation. The common NIST SP 800-53 foundation across FedRAMP, CMMC, and FISMA makes this integration technically feasible. The key is mapping requirements across frameworks early in program design rather than retrofitting compliance after the fact. This multi-framework integration expertise is precisely the kind of GRC leadership value that Jason's credential stack is targeting.</div>`,

    body: `<p>For cloud service providers pursuing FedRAMP authorization, the journey from "we want to serve the government" to "we are FedRAMP authorized" is substantial — typically 12-24 months for a new Moderate authorization, $1-3M+ in total investment, and ongoing operational costs for ConMon that continue indefinitely. Understanding what's actually required helps both CSPs planning FedRAMP programs and GRC professionals advising them.</p>
    <div class="cheat-grid">

      <div class="cheat-pill"><strong>Phase 2: Program Infrastructure</strong><span>Build the internal compliance program: hire or designate a FedRAMP compliance manager, establish the security team with FISMA/NIST expertise, implement automated scanning and ConMon infrastructure, select SSP documentation tools, and establish internal change management processes that route IT changes through FedRAMP compliance review. This infrastructure takes months to establish properly.</span></div>

    body: `
    <div class="cheat-section">
      <h3>What Is FedRAMP?</h3>
      <p style="font-size:13.5px;color:#6b6b68">Federal Risk and Authorization Management Program. Government-wide program providing standardized cloud security assessment, authorization, and continuous monitoring for cloud products and services used by federal agencies. Managed by FedRAMP PMO within GSA (General Services Administration). Established 2011 by OMB policy; formalized by FedRAMP Authorization Act (December 2022). Mandatory for federal agencies using cloud services to process federal information (per OMB policy and the Authorization Act). Core value: "Do once, use many times" — one rigorous assessment used by all agencies. Free Marketplace: marketplace.fedramp.gov. Based on NIST SP 800-53 controls and FIPS 199 impact levels. FISMA is the law requiring ATOs; FedRAMP is the cloud-specific process for achieving them.</p>
    </div>

    <div class="cheat-section">
      <h3>FedRAMP Baselines</h3>
      <div class="baseline-grid">

        <div class="bl-mod"><strong style="color:#633806">FedRAMP Moderate (Most Common ~80%)</strong><br><span style="font-size:12px">~325 controls. Serious adverse effect if compromised. Most general federal business: email, collaboration, productivity, non-sensitive PII. Most agencies' cloud needs.</span></div>
        <div class="bl-high"><strong style="color:#4A1B0C">FedRAMP High</strong><br><span style="font-size:12px">~420 controls. Severe/catastrophic adverse effect. Law enforcement, health records, emergency response, national security-adjacent. Smaller market of authorized offerings.</span></div>
        <div class="bl-lisaas"><strong style="color:#0D3A4D">FedRAMP LI-SaaS (Tailored)</strong><br><span style="font-size:12px">~37 controls. Publicly releasable data only. No PII beyond login credentials. SaaS only. Data publicly available. Individual productivity tools. Fastest path.</span></div>
      </div>
    </div>

    <div class="cheat-section">
      <h3>The FedRAMP Ecosystem</h3>
      <div class="control-row">
        <div class="ctrl-card"><b>FedRAMP PMO (within GSA)</b> — Owns and operates FedRAMP. Maintains Marketplace. Reviews authorization packages. Accredits 3PAOs. Issues templates. Manages JAB. Central administrative authority for all FedRAMP authorizations.</div>
        <div class="ctrl-card"><b>JAB — Joint Authorization Board</b> — CIOs of DoD, DHS, and GSA. Issues JAB Provisional ATOs (P-ATOs) — most prestigious FedRAMP authorization. Selects CSPs through FedRAMP Connect competitive process based on government-wide demand.</div>
        <div class="ctrl-card"><b>CSPs — Cloud Service Providers</b> — Companies pursuing FedRAMP authorization to sell to government. Fund the assessment. Implement controls. Produce documentation. Maintain authorization through ConMon. Both start of the process and ongoing obligation.</div>

    <div class="cheat-section">
      <h3>Authorization Paths</h3>
      <div class="control-row">

        <div class="ctrl-card"><b>Agency Path → Agency ATO</b><br>Find sponsoring agency → Joint planning → 3PAO assessment → Agency AO reviews and issues ATO → Contribute to Marketplace → ConMon begins.<br>Timeline: Can be faster if agency drives it. Requires committed sponsor. Equally valid — any agency can leverage. Best for CSPs with specific agency relationships.</div>

        <div class="ctrl-card"><b>Marketplace Statuses</b><br>• Authorized — full FedRAMP authorization, ready for agency use<br>• In Process — pursuing authorization (JAB or Agency)<br>• FedRAMP Ready — passed Readiness Assessment, not yet authorized</div>

        <div class="ctrl-card"><b>CRM — Customer Responsibility Matrix</b> — Defines which controls are CSP-provided, Customer-provided, Hybrid, or Inherited. Tells agencies exactly what security responsibilities they must implement to maintain the security posture the authorization is based on. Most important document agencies fail to read carefully.</div>

        <div class="ctrl-card"><b>POA&M Remediation Timelines</b><br>• High-risk findings: 30 days<br>• Moderate-risk findings: 90 days<br>• Low-risk findings: 180 days<br>Overdue = PMO escalation → possible authorization action</div>
        <div class="ctrl-card"><b>Incident Reporting</b><br>Major incidents involving potential federal data: immediate notification to PMO and all leveraging agencies. Category-based timelines for less severe incidents. US-CERT/CISA reporting required for applicable incidents. All within FISMA incident reporting framework.</div>
      </div>
    </div>

    <div class="cheat-section">
      <h3>Shared Responsibility by Service Model</h3>
      <div class="control-row">
        <div class="ctrl-card"><b>IaaS</b> — CSP: physical infrastructure, hypervisor, core network. Agency: OS hardening, applications, data security, all application-layer controls. Maximum agency responsibility.</div>

        <div class="ctrl-card"><b>SaaS</b> — CSP: full application stack + platform + infrastructure. Agency: user account management, application configuration, data governance. Minimum agency responsibility.</div>
        <div class="ctrl-card"><b>Inheritance Stack</b> — SaaS → PaaS → IaaS inheritance enables stacked FedRAMP authorizations. Agencies benefit from all layers of authorization without separately assessing each layer.</div>

    <div class="cheat-section">
      <h3>Framework Relationships</h3>
      <div class="control-row">
        <div class="ctrl-card"><b>FISMA</b> — FISMA requires ATOs for all federal systems; FedRAMP is the mechanism for achieving them for cloud. FedRAMP authorization enables FISMA-compliant agency ATOs. Using unauthorized cloud = FISMA violation.</div>
        <div class="ctrl-card"><b>NIST RMF (SP 800-37)</b> — FedRAMP follows the RMF process (Prepare, Categorize, Select, Implement, Assess, Authorize, Monitor) adapted for cloud. 3PAO conducts the ASSESS step; PMO/JAB conducts AUTHORIZE. Same methodology, cloud-adapted.</div>

        <span class="badge badge-steel">3PAO assessment cost alone: $250K-$500K+ for Moderate</span>
        <span class="badge badge-steel">SSP length: 300-500+ pages for Moderate</span>
        <span class="badge badge-steel">Rev 5 transition: adds PT (privacy) and SR (supply chain) families</span>
        <span class="badge badge-steel">Phishing-resistant MFA: required per OMB M-22-09 (FIDO2/PIV, not SMS)</span>
        <span class="badge badge-steel">OSCAL: machine-readable documentation format (increasingly required)</span>
      </div>
    </div>
    `
  }
];

let current = 0;

function buildGrid(){
  const g = document.getElementById('dayGrid');
  g.innerHTML = '';
  for(let i = 0; i < days.length; i++){
    const b = document.createElement('button');
    b.className = 'day-pip' + (days[i].isCheatSheet ? ' cheat' : '') + (i === current ? ' active' : '');
    b.textContent = days[i].isCheatSheet ? 'CS' : (i + 1);
    b.title = days[i].title;
    b.onclick = (()=>{ const idx = i; return () => goTo(idx); })();
    g.appendChild(b);
  }
}

function goTo(idx){ current = idx; render(); }
function changeDay(dir){ current = Math.max(0, Math.min(days.length - 1, current + dir)); render(); }

function render(){
  const d = days[current];
  const total = days.length;
  document.getElementById('dayCounter').textContent = (current + 1) + ' / ' + total;
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === total - 1;
  document.getElementById('progBar').style.width = (((current + 1) / total) * 100) + '%';
  buildGrid();

  if(d.isCheatSheet){
    document.getElementById('lessonArea').innerHTML = `
      <div class="card">
        <div class="lesson-header">
          <div class="day-badge" style="background:#E1F5EE">
            <div class="day-num" style="color:#085041;font-size:14px">CHEAT</div>
            <div class="day-lbl" style="color:#0F6E56">SHEET</div>
          </div>
          <div class="lesson-meta">
            <h2>${d.title}</h2>
            <div class="tagline">${d.tagline}</div>
          </div>
        </div>
        <div class="lesson-body">${d.body}</div>
      </div>`;
    return;
  }

  const quizId = 'quiz_' + current;
  let quizHtml = '';
  if(d.quiz){
    const optsHtml = d.quiz.opts.map((o, i) =>
      `<button class="quiz-btn" onclick="checkAnswer(${i}, ${d.quiz.ans}, '${quizId}')">${o}</button>`
    ).join('');
    quizHtml = `<div class="quiz-box">
      <p>Quick check: ${d.quiz.q}</p>
      <div>${optsHtml}</div>
      <div class="answer-reveal" id="${quizId}"></div>
    </div>`;
  }

  document.getElementById('lessonArea').innerHTML = `
    <div class="card">
      <div class="lesson-header">
        <div class="day-badge">
          <div class="day-num">${current + 1}</div>
          <div class="day-lbl">Day</div>
        </div>
        <div class="lesson-meta">
          <h2>${d.title}</h2>
          <div class="tagline">${d.tagline}</div>
        </div>
      </div>
      <div class="section-label">Today's lesson</div>
      <div class="lesson-body">${d.body}</div>
      ${quizHtml}
    </div>`;
}

function checkAnswer(chosen, correct, qid){
  const el = document.getElementById(qid);
  const d = days[current];
  if(!d.quiz) return;
  const isRight = chosen === correct;
  el.innerHTML = `<strong>${isRight ? 'Correct!' : 'Not quite.'}</strong> ${d.quiz.explain}`;
  el.className = 'answer-reveal show';
  el.style.background = isRight ? '#EAF3DE' : '#FCEBEB';
  el.style.borderColor = isRight ? '#3B6D11' : '#A32D2D';
  el.style.color = '#1a1a18';
}

render();
</script>
</body>
</html>
