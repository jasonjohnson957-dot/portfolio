  quiz:{q:"An organization&#8217;s internal audit identifies that their Area 2 human oversight review process for AI credit decisions technically meets the requirement (a human reviews each AI recommendation before implementation) but in practice involves reviewers approving over 98% of AI recommendations in under 30 seconds each. What does this indicate?",opts:["98% approval rate indicates the AI is highly accurate and human review is confirming good performance","The high approval rate and very short review time indicate nominal rather than meaningful oversight&#8212;a critical MAIGF Area 2 failure. Meaningful oversight requires: sufficient information for genuine judgment, adequate time for case-by-case evaluation, and demonstrated capability to identify and act on AI errors. A 30-second review approving 98% of recommendations suggests reviewers are rubber-stamping AI outputs rather than exercising independent judgment. This provides false assurance about human oversight while leaving the AI&#8217;s errors effectively unchecked. The audit finding warrants redesigning the review process to enable genuine human judgment.","98% approval rate is expected and acceptable for well-performing AI credit scoring systems","The issue is only the time spent on review, not the oversight quality itself"],ans:1,explain:"This scenario captures one of the most important MAIGF Area 2 distinctions: the difference between nominal oversight (a human is technically involved) and meaningful oversight (human involvement genuinely adds value and provides error correction). A review process where 98% of recommendations are approved in under 30 seconds is almost certainly not enabling genuine case-by-case judgment&#8212;the reviewer is likely confirming the AI recommendation without independent evaluation. Meaningful credit decision oversight requires: adequate time to review case information, access to the key factors driving the AI recommendation, cognitive tools to identify cases where the AI pattern may be inappropriate for the specific individual, and genuine authority and willingness to override. An audit finding this pattern should trigger redesign of the review interface and process rather than simply noting it as evidence that human oversight exists."}
},
{
  title:"MAIGF and the Global AI Governance Landscape",
  tagline:"Singapore&#8217;s place in the international AI governance conversation",
  body:`<p>The Singapore MAIGF exists in an increasingly crowded global AI governance landscape, with dozens of national AI strategies and governance frameworks published since 2017. Understanding how the MAIGF relates to this landscape&#8212;what it shares with other frameworks and where it is distinctive&#8212;provides essential context for organizations operating internationally and for understanding Singapore&#8217;s contribution to global AI governance discourse.</p>
  <div class="highlight-box"><strong>The global AI governance landscape in context:</strong> By 2024, over 70 countries had published national AI strategies, and more than 40 had published AI ethics guidelines or governance frameworks. Major frameworks: EU AI Act (2024, mandatory regulation), NIST AI RMF (2023, US voluntary framework), UK AI Governance Framework (pro-innovation voluntary approach), China National AI Governance Principles (2019, revised 2021), OECD AI Principles (2019, international voluntary principles adopted by 46+ countries), and Singapore&#8217;s MAIGF (2019-2020, voluntary practical guidance). These frameworks reflect both shared global values (human-centricity, fairness, transparency) and meaningful differences in approach, scope, and legal status.</highlight-box>
  <div class="cheat-grid">
    <div class="cheat-pill"><strong>Singapore vs. EU AI Act</strong><span>The most significant structural difference in global AI governance: Singapore&#8217;s voluntary, principle-based approach vs. EU AI Act&#8217;s mandatory, risk-tiered regulation. EU AI Act prohibits certain AI uses entirely (unacceptable risk), requires conformity assessment for high-risk AI, and imposes significant compliance obligations for AI in the EU market. Singapore&#8217;s MAIGF does not prohibit any AI use and imposes no mandatory requirements. Singapore views the voluntary approach as more appropriate for the current technology development stage; EU views mandatory regulation as necessary to ensure adequate protection.</span></div>
    <div class="cheat-pill"><strong>Singapore vs. OECD AI Principles</strong><span>The OECD AI Principles (adopted 2019 by 46+ countries including Singapore) establish international consensus values for responsible AI: inclusive growth and sustainable development, human-centred values and fairness, transparency and explainability, robustness and safety, and accountability. Singapore&#8217;s MAIGF is explicitly aligned with OECD AI Principles&#8212;implementing the same values through Singapore&#8217;s practical governance framework. Organizations implementing MAIGF are simultaneously implementing OECD AI Principles in practice.</span></div>
    <div class="cheat-pill"><strong>Singapore&#8217;s Distinctive Contributions</strong><span>The Singapore MAIGF has made specific distinctive contributions to global AI governance discourse: the Area 2 human oversight calibration methodology (risk-proportionate human oversight determination) is more detailed and practical than most other frameworks&#8217; treatment of human oversight; the MAIGF&#8217;s practical case study approach has been widely emulated; and Singapore&#8217;s AI Verify testing toolkit is among the most advanced national AI testing frameworks globally.</span></div>
    <div class="cheat-pill"><strong>The Global Governance Fragmentation Problem</strong><span>The proliferation of national AI governance frameworks creates compliance complexity for multinational organizations&#8212;the same AI system may face different requirements in the EU, US, Singapore, Japan, UK, and Brazil simultaneously. Singapore has actively engaged in international AI governance harmonization efforts: bilateral AI governance discussions with the EU and US, AI Verify interoperability with NIST AI RMF, and ASEAN Guide harmonization. Reducing this fragmentation is an ongoing global governance priority.</span></div>
    <div class="cheat-pill"><strong>Singapore&#8217;s Practical Governance Leadership</strong><span>Among global AI governance frameworks, Singapore&#8217;s MAIGF is consistently recognized for its practical, implementable approach. While some frameworks establish principles without implementation guidance, MAIGF provides: detailed guidance on how to implement each governance area, concrete case studies from industry, the AI Verify testing toolkit, and sector-specific implementation guidance. This practical orientation has made MAIGF particularly influential with practitioners, even in jurisdictions outside Singapore.</span></div>
    <div class="cheat-pill"><strong>Singapore&#8217;s Influence on the Global Agenda</strong><span>Singapore has leveraged its MAIGF and AI governance leadership for international influence: in multilateral AI governance forums (UN, G20, APEC), Singapore consistently advocates for interoperable, voluntary, risk-proportionate AI governance approaches reflecting MAIGF&#8217;s philosophy. Singapore&#8217;s experience implementing a voluntary framework has informed international debates about whether mandatory regulation or voluntary guidance is more effective for responsible AI governance at the current stage of technology development.</span></div>
  </div>`,
  quiz:{q:"A practitioner asks: &#8216;Given that the EU AI Act is mandatory law with significant penalties for non-compliance, isn&#8217;t Singapore&#8217;s voluntary MAIGF simply less effective than the EU approach at ensuring responsible AI?&#8217; How should a knowledgeable Singapore MAIGF practitioner respond?",opts:["The practitioner is correct&#8212;mandatory regulation is always more effective than voluntary guidance","The effectiveness comparison is more complex than it appears. The EU AI Act&#8217;s mandatory approach ensures minimum compliance across a specific AI risk category but may create compliance-focused governance (satisfying legal requirements) rather than substantively responsible AI governance. Singapore&#8217;s voluntary approach may drive deeper, more contextualized governance in organizations that genuinely adopt MAIGF principles, but cannot guarantee minimum standards across all organizations. Both approaches have trade-offs: mandatory regulation ensures minimum baseline but risks creating gaming; voluntary guidance enables genuine governance innovation but cannot compel adoption. The most effective approach may vary by context, organizational capacity, and what &#8220;effectiveness&#8221; means for AI governance.","The EU AI Act is only effective in Europe and Singapore&#8217;s approach is more globally effective","Voluntary and mandatory approaches are equivalent in practice since both establish the same standards"],ans:1,explain:"This question addresses a genuine governance design debate that doesn&#8217;t have a simple answer. The EU AI Act&#8217;s mandatory approach guarantees minimum compliance behavior from organizations in scope&#8212;a significant advantage when baseline protection is the priority. But mandatory compliance frameworks can also produce: minimum-compliance governance rather than best-practice governance, standardized approaches that may not be optimal for specific contexts, and compliance documentation that satisfies regulators without reflecting genuine governance. Singapore&#8217;s voluntary approach enables genuine governance innovation and contextual adaptation, but cannot compel adoption. Both approaches have real advantages and real limitations. The most honest answer acknowledges this genuine complexity rather than asserting simple superiority for either model."}
},
{
  title:"Building a MAIGF-Aligned AI Governance Program",
  tagline:"Creating sustainable organizational capability for responsible AI in Singapore&#8217;s context",
  body:`<p>Building a MAIGF-aligned AI governance program requires creating sustainable organizational capability&#8212;not just completing individual governance activities for specific AI systems. Organizations that treat MAIGF as a series of one-time checklists for individual deployments miss the institutional benefits of systematic AI governance capability: consistent standards across all AI deployments, organizational learning from AI governance experience, efficient governance processes that don&#8217;t reinvent methodology for each deployment, and governance integration that makes responsible AI a genuine organizational priority rather than a periodic compliance exercise.</p>
  <div class="cheat-grid">
    <div class="cheat-pill"><strong>Phase 1&#8212;Foundation</strong><span>Establish the organizational foundation: complete AI system inventory across the organization; assign AI governance accountability at senior level; develop an AI governance policy document aligned with MAIGF&#8217;s two principles and four areas; establish a cross-functional AI governance oversight mechanism appropriate to organizational size; and conduct initial staff training on AI governance roles and responsibilities. This foundation enables systematic implementation in subsequent phases.</span></div>
    <div class="cheat-pill"><strong>Phase 2&#8212;Risk Classification and Prioritization</strong><span>Apply MAIGF&#8217;s proportionality principle: classify all AI systems by risk level using Area 2&#8217;s harm assessment criteria (probability and severity of harm). Develop tier-specific governance requirements: what oversight, documentation, testing, and monitoring requirements apply at each risk tier. Prioritize implementing full governance for highest-risk systems first while developing proportionate governance standards for lower-risk systems. This avoids both over-governing low-risk AI and under-governing high-risk AI.</span></div>
    <div class="cheat-pill"><strong>Phase 3&#8212;Process Development</strong><span>Develop the governance processes for each Area: (1) Area 1 ethics review process for new AI deployments; (2) Area 2 oversight level determination procedure with documentation requirements; (3) Area 3 data governance, model validation, and monitoring procedures; (4) Area 4 stakeholder communication templates and complaint handling procedure. Integrate these processes into existing organizational workflows (procurement, IT development, risk management) rather than creating parallel AI-only processes.</span></div>
    <div class="cheat-pill"><strong>Phase 4&#8212;Testing Capability</strong><span>Build AI governance testing capability: train internal staff in bias assessment and model validation techniques, implement AI Verify testing for significant AI systems, develop testing templates covering MAIGF&#8217;s key governance dimensions, and create processes for regular re-testing to detect model drift and emerging fairness issues. Testing capability enables evidence-based governance rather than assertion-based governance.</span></div>
    <div class="cheat-pill"><strong>Phase 5&#8212;Monitoring and Learning</strong><span>Implement ongoing monitoring across the AI portfolio: performance monitoring for all significant AI systems against defined baselines and thresholds, fairness monitoring comparing outcomes across demographic groups, stakeholder feedback and complaint tracking, incident monitoring and root cause analysis. Create processes for organizational learning from monitoring findings&#8212;updating governance standards and practices based on operational experience. Governance should improve with each cycle.</span></div>
    <div class="cheat-pill"><strong>Phase 6&#8212;Maturity Development</strong><span>Progress from initial MAIGF compliance to mature governance capability: from reactive (addressing governance gaps when identified) to proactive (designing governance considerations into AI from the start); from siloed (each AI team manages its own governance) to enterprise (consistent organizational governance across all AI); and from compliance-focused (satisfying MAIGF requirements) to excellence-focused (using governance as a source of competitive advantage in Singapore&#8217;s trusted AI ecosystem).</span></div>
  </div>`,
  quiz:{q:"A large Singapore financial institution has operated a MAIGF-aligned AI governance program for two years. Their latest internal audit shows: comprehensive documentation for all AI systems, AI governance reviews conducted for all new deployments, AI Verify testing completed for high-risk systems, and stakeholder communication processes in place. However, none of their AI governance reviews have ever resulted in delayed or rejected AI deployments. What does this pattern suggest and what should the audit recommend?",opts:["The pattern demonstrates excellent AI development practices&#8212;all AI systems are well-designed before governance review","The pattern raises a concern about governance in form vs. substance: a governance process that never results in delayed or rejected deployments over two years may be functioning as a documentation exercise rather than a genuine check on AI deployment quality. Real-world AI governance programs that are functioning substantively typically do find significant issues requiring remediation in some proportion of deployments. The audit should recommend: examining whether governance reviews have genuine authority to delay or reject deployments, reviewing whether risk assessments are genuinely adversarial (seeking to identify problems) or confirmatory (seeking to confirm the deployment is acceptable), and examining specific governance reviews to assess whether risk findings were fully documented and acted upon.","Organizations should aim for 100% approval rates through good pre-governance design&#8212;this is a success indicator","The audit should recommend reducing governance review frequency since the process is clearly working efficiently"],ans:1,explain:"This scenario captures one of the most important audit indicators of governance effectiveness: the absence of governance-driven decisions to slow or reject AI deployments over an extended period suggests either that the organization is deploying AI of remarkably consistent quality (possible but statistically unlikely) or that the governance review process is functioning as a documentation exercise rather than a genuine checkpoint. Genuine governance sometimes produces inconvenient findings that require additional work or delayed deployment. A governance program that consistently produces only approvals, regardless of AI system complexity or risk level, may be structured to confirm decisions already made rather than to independently evaluate AI deployment risk. Auditors should examine specific governance review documentation to assess whether adverse findings were genuinely identified, documented, and resolved&#8212;or whether reviews are designed to produce approvals regardless of actual AI system quality."}
},
{
  title:"Cross-Cutting Themes in MAIGF Implementation",
  tagline:"The recurring themes that appear across all four governance areas",
  body:`<p>Effective MAIGF implementation requires recognizing several themes that appear across all four governance areas and that shape how the framework should be understood and applied. These cross-cutting themes are not requirements in any specific area&#8212;they are principles that inform how all requirements should be interpreted and implemented.</p>
  <div class="highlight-box"><strong>The MAIGF&#8217;s most fundamental cross-cutting theme:</strong> Throughout all four governance areas, the MAIGF consistently emphasizes the difference between governance in form (documented policies, completed assessments, established processes) and governance in substance (genuine accountability, real risk reduction, meaningful protection for affected people). The framework was written by practitioners who recognized that governance that looks good on paper while providing no genuine protection is worse than minimal governance, because it provides false assurance while leaving real risks unaddressed.</highlight-box>
  <div class="cheat-grid">
    <div class="cheat-pill"><strong>Proportionality</strong><span>The single most important cross-cutting MAIGF principle: governance requirements should be proportionate to the risk and impact of the specific AI system. Applying identical governance depth to all AI systems produces either under-governed high-risk AI or over-governed low-risk AI. Proportionality enables resource-efficient governance that concentrates effort where it provides the most protection. Every MAIGF governance area includes proportionality guidance for this reason.</span></div>
    <div class="cheat-pill"><strong>Accountability</strong><span>Governance without clear accountability is aspirational, not operational. MAIGF consistently emphasizes that governance requirements must be owned by specific individuals with actual authority and genuine accountability for AI governance outcomes. Accountability without authority is a trap: assigning responsibility for AI governance to individuals who lack the organizational power to enforce governance requirements creates the appearance of accountability without the substance.</span></div>
    <div class="cheat-pill"><strong>Human Welfare as the North Star</strong><span>All four governance areas ultimately serve the same purpose: ensuring that AI systems genuinely benefit the people they affect and do not cause unacceptable harm. When governance decisions are difficult or ambiguous, the question &#8220;does this implementation genuinely protect affected people&#8217;s welfare?&#8221; provides the clearest guidance. Governance choices that satisfy technical requirements while undermining genuine human welfare protection fail MAIGF&#8217;s fundamental purpose.</span></div>
    <div class="cheat-pill"><strong>Continuous Improvement</strong><span>The MAIGF is not a fixed destination but a direction of travel. Organizations implementing MAIGF should expect their governance programs to improve over time: understanding deepens, processes become more efficient, monitoring provides better insights, and governance capacity grows. Initial implementation need not be perfect; the commitment to continuous improvement&#8212;learning from experience, incorporating feedback, updating practices as understanding evolves&#8212;is itself a core MAIGF requirement.</span></div>
    <div class="cheat-pill"><strong>Integration, Not Addition</strong><span>Effective MAIGF implementation integrates AI governance into existing organizational processes rather than creating parallel AI-only governance structures. AI risk assessment should integrate with enterprise risk management. AI data governance should integrate with enterprise data governance. AI incident management should integrate with enterprise incident management. Standalone AI governance structures are typically less effective and less sustainable than integrated governance that treats AI as one domain within broader organizational governance.</span></div>
    <div class="cheat-pill"><strong>Stakeholder-Centeredness</strong><span>The MAIGF consistently directs governance attention toward the perspective of the people AI affects, not just the organization deploying AI. This stakeholder-centered orientation requires asking governance questions from the affected party&#8217;s perspective: Would the people this AI affects consider our governance adequate? Do they have genuinely effective means to understand and challenge AI decisions affecting them? Is our AI governance designed to protect their interests, or to protect the organization from reputational and regulatory risk?</span></div>
  </div>`,
  quiz:{q:"An organization presents their MAIGF governance program in a board presentation showing: 47 documented AI policies, 23 governance reviews completed, AI Verify testing for 8 systems, and 0 reported AI incidents. The board member responsible for AI governance asks: &#8216;What does this tell us about whether our AI governance is actually working?&#8217; How should the presenter respond?",opts:["These metrics demonstrate comprehensive and effective MAIGF governance","These input metrics show governance activity but do not demonstrate governance effectiveness in protecting people affected by our AI. Better outcome metrics would include: bias incidents detected and corrected before causing harm to customers, explainability queries from affected individuals that were successfully resolved, AI decisions that were challenged and changed based on human review, customer satisfaction with AI decision explanations, and AI performance monitoring alerts that triggered timely remediation. Input metrics prove governance processes exist; outcome metrics demonstrate governance is working to achieve MAIGF&#8217;s fundamental purpose of protecting people&#8217;s welfare.","Documenting 47 policies and completing 23 reviews clearly exceeds MAIGF requirements for this organization&#8217;s size","0 reported incidents is the most important metric&#8212;it demonstrates governance is successfully preventing harm"],ans:1,explain:"This answer embodies MAIGF&#8217;s fundamental cross-cutting theme: the difference between governance in form and governance in substance. Input metrics (policies documented, reviews completed, testing performed) demonstrate governance activity&#8212;they do not demonstrate governance effectiveness in achieving MAIGF&#8217;s purpose. An organization could have 100 policies, 50 governance reviews, and 20 AI Verify tests while still having AI systems that discriminate against customers, provide inadequate explanations to affected individuals, and lack meaningful appeal processes. The board member&#8217;s question is exactly right: what does our governance activity tell us about whether affected people are actually being protected? The answer requires outcome-oriented metrics that connect governance activity to real-world impact on the people MAIGF is designed to protect."}
},
{
  title:"30-Day Review",
  tagline:"Everything we covered&#8212;in one final look",
  body:`<p>You have completed all 30 days of the Singapore Model AI Governance Framework! Let&#8217;s take a final inventory of what you now know about Singapore&#8217;s pioneering approach to practical, principle-based AI governance.</p>
  <div class="tag-header">The Big Picture</div>
  <p>The Singapore Model AI Governance Framework (MAIGF) is a voluntary, principle-based AI governance framework published by IMDA and PDPC in January 2020 (Second Edition). It provides detailed, practically implementable guidance for private sector organizations deploying AI, built around two high-level principles and four governance areas. It is connected to Singapore&#8217;s broader AI governance ecosystem (NAIS, PDPA, AI Verify) and forms the foundation for the ASEAN Guide on AI Governance (2021). Singapore&#8217;s MAIGF is distinguished globally by its practical orientation, its distinctive Area 2 human oversight calibration methodology, and its voluntary &#8216;light-touch regulation, heavy-touch guidance&#8217; philosophy.</p>
  <div class="tag-header">Two High-Level Principles</div>
  <div class="badge-row">
    <span class="badge badge-sg">Principle 1: AI decisions should be Explainable, Transparent, and Fair</span>

{
  title:"Singapore MAIGF Cheat Sheet",
  tagline:"Your complete quick-reference guide",
  isCheatSheet:true,
  body:`
  <div class="cheat-section">
    <h3>What Is the Singapore MAIGF?</h3>
    <p style="font-size:13.5px;color:#6b6b68">Singapore Model AI Governance Framework &#8212; voluntary, principle-based AI governance guidance published by IMDA (Infocomm Media Development Authority) and PDPC (Personal Data Protection Commission). Second Edition published January 2020. Provides detailed, practically implementable guidance for private sector organizations deploying AI. Built around two high-level principles and four governance areas. Connected to Singapore&#8217;s PDPA (legal floor), AI Verify (testing toolkit), and ASEAN Guide on AI Governance. Not a certification standard&#8212;voluntary guidance. Free at pdpc.gov.sg. Extended by Generative AI MAIGF (2024). Most globally distinctive contribution: Area 2&#8217;s structured human oversight calibration methodology.</p>
  </div>

  <div class="cheat-section">
    <h3>The Two High-Level Principles</h3>
    <div class="control-row">
      <div class="ctrl-card"><b>Principle 1&#8212;Explainable, Transparent, and Fair</b><br>Organizations using AI in decision-making should ensure the decision-making process is: <b>Explainable</b> (understandable to the people it affects, proportionate to decision stakes), <b>Transparent</b> (affected parties know AI is used and understand its role), <b>Fair</b> (no inappropriate discrimination based on protected characteristics; active bias assessment and mitigation required)</div>
      <div class="ctrl-card"><b>Principle 2&#8212;Human-Centric</b><br>AI solutions should be human-centric: <b>Used for benefit of individuals and society</b> (not just organizational metrics), <b>Protecting human interests</b> (dignity, autonomy, genuine welfare), <b>Allowing human oversight and intervention where necessary</b> (maintaining meaningful human control over consequential AI decisions). Most directly connects to Area 2&#8217;s oversight requirements.</div>
    </div>
  </div>

  <div class="cheat-section">
    <h3>The Four Governance Areas</h3>
    <div class="control-row">
      <div class="ctrl-card"><b>Area 1&#8212;Internal Governance</b><br>&#8226; Senior leadership accountability for AI governance<br>&#8226; AI governance committee or oversight body (cross-functional)<br>&#8226; Written AI governance policies<br>&#8226; Pre-deployment ethics review process<br>&#8226; Staff competency and training by role<br>&#8226; Vendor governance extending to third-party AI<br>&#8226; AI incident management procedures<br>&#8226; Continuous improvement processes<br>Key principle: governance in substance, not just form</div>
      <div class="ctrl-card"><b>Area 2&#8212;Human Oversight</b><br>Calibrate human oversight to risk using two factors:<br>&#8226; Probability of harm (model error rate, data quality, context match)<br>&#8226; Severity of harm (fundamental interests affected, reversibility, recourse)<br><br>Four scenarios:<br>S1: Human decides, AI advises (highest risk)<br>S2: Human decides, AI processes info<br>S3: AI decides, human monitors<br>S4: AI decides autonomously (lowest risk only)<br><br>Key principle: meaningful vs. nominal oversight<br>High-stakes domains: credit, employment, healthcare, housing, legal rights</div>
      <div class="ctrl-card"><b>Area 3&#8212;Operations Management</b><br>Risk Assessment: AI-specific risks (bias, drift, adversarial), ongoing monitoring, defined risk appetite thresholds<br><br>Data Governance: quality (completeness, representativeness, accuracy), provenance tracking, PDPA compliance, bias in training data, purpose limitation<br><br>Model Governance: pre-deployment validation (fairness testing, adversarial testing), model documentation/model cards, drift monitoring, version management, explainability implementation<br><br>Key principle: AI-specific failure modes require purpose-built governance</div>
      <div class="ctrl-card"><b>Area 4&#8212;Stakeholder Interaction</b><br>&#8226; Inform affected parties when AI is used in significant decisions<br>&#8226; Provide meaningful explanations of AI decisions (proportionate to stakes)<br>&#8226; Establish accessible feedback and complaint mechanisms<br>&#8226; Offer genuine review process that can actually change outcomes<br>&#8226; Communicate AI limitations honestly<br>&#8226; Transparency reporting for significant deployments<br>&#8226; Proactive regulator communication<br><br>Key principle: genuine accountability to affected people, not PR exercise</div>
    </div>
  </div>

  <div class="cheat-section">
    <h3>Area 2 Calibration&#8212;Key Factors</h3>
    <div class="control-row">
      <div class="ctrl-card"><b>Harm Probability Factors</b><br>&#8226; Model error rate and confidence calibration<br>&#8226; Training data quality and representativeness<br>&#8226; Whether deployment context matches training conditions<br>&#8226; Presence of compensating controls<br>&#8226; Edge case handling</div>
      <div class="ctrl-card"><b>Harm Severity Factors</b><br>&#8226; Fundamental interests affected (financial, health, liberty, housing, employment)<br>&#8226; Reversibility or permanence of harm<br>&#8226; Affected person&#8217;s recourse options<br>&#8226; Vulnerability of affected population<br>&#8226; Breadth of impact (how many people affected)</div>
    </div>
  </div>

  <div class="cheat-section">
    <h3>Singapore AI Governance Ecosystem</h3>
    <div class="control-row">
      <div class="ctrl-card"><b>IMDA</b> &#8212; Infocomm Media Development Authority. Publishes MAIGF and AI Verify. Industry-facing mandate ensures practical implementation focus.</div>
      <div class="ctrl-card"><b>PDPC</b> &#8212; Personal Data Protection Commission. Co-published MAIGF. Enforces PDPA. Provides data protection guidance complementing MAIGF.</div>
      <div class="ctrl-card"><b>PDPA (2012, amended 2020)</b> &#8212; Singapore&#8217;s mandatory data protection law. Legal floor that MAIGF builds upon. PDPA violations carry financial penalties; MAIGF violations do not (voluntary).</div>
      <div class="ctrl-card"><b>AI Verify (2022)</b> &#8212; AI governance testing toolkit. Tests AI against 11 governance principles. Generates transparency reports. Interoperable with NIST AI RMF. Run by AI Verify Foundation (2023).</div>
      <div class="ctrl-card"><b>NAIS 2.0 (2023)</b> &#8212; National AI Strategy 2.0. Sets national AI direction. MAIGF provides governance for responsible implementation of national AI strategy goals.</div>
      <div class="ctrl-card"><b>GenAI MAIGF (2024)</b> &#8212; Extension addressing generative AI&#8217;s unique challenges: hallucination, content provenance, foundation model governance, system-level transparency.</div>
    </div>
  </div>

  <div class="cheat-section">
    <h3>Framework Relationships</h3>
    <div class="control-row">
      <div class="ctrl-card"><b>ASEAN Guide on AI (2021)</b> &#8212; Built on MAIGF as foundation. Extends to all 10 ASEAN member states. MAIGF alignment = substantial ASEAN Guide compliance across region.</div>
      <div class="ctrl-card"><b>ISO 42001</b> &#8212; Certifiable AI Management System standard. ISO 42001 provides governance structure; MAIGF provides substantive guidance to fill it. Use both for certified + Singapore-contextual governance.</div>
      <div class="ctrl-card"><b>NIST AI RMF</b> &#8212; US voluntary framework with documented mapping to MAIGF. Compatible coverage with different national contexts. MAIGF Area 2 provides more detailed human oversight methodology.</div>
      <div class="ctrl-card"><b>OECD AI Principles</b> &#8212; International values MAIGF explicitly implements. MAIGF provides practical implementation methodology for OECD Principles in Singapore context.</div>
      <div class="ctrl-card"><b>MAS FEAT Principles</b> &#8212; Financial services operationalization of MAIGF (Fairness, Ethics, Accountability, Transparency). Veritas framework provides bias testing methodology for financial AI.</div>
      <div class="ctrl-card"><b>EU AI Act</b> &#8212; Mandatory regulation vs. MAIGF&#8217;s voluntary guidance. Different philosophy: EU mandates compliance tiers; Singapore provides principle-based guidance. Not directly equivalent or interchangeable.</div>
    </div>
  </div>

  <div class="cheat-section">
    <h3>Key Facts and Critical Distinctions</h3>
    <div class="badge-row">
      <span class="badge badge-sg">Published: January 2020 (Second Edition) by IMDA and PDPC</span>
      <span class="badge badge-sg">Status: Voluntary (not mandatory law)</span>
      <span class="badge badge-sg">Most distinctive contribution: Area 2 human oversight calibration methodology</span>
      <span class="badge badge-sg">Most critical cross-cutting principle: Proportionality</span>
      <span class="badge badge-sg">Most common failure: Governance in form without substance</span>
      <span class="badge badge-sg">PDPA = mandatory legal floor; MAIGF = voluntary governance above it</span>
      <span class="badge badge-sg">AI Verify = testing toolkit implementing MAIGF principles in practice</span>
      <span class="badge badge-sg">Area 2 calibration factors: Harm Probability &#215; Harm Severity</span>
      <span class="badge badge-sg">High-stakes domains requiring elevated oversight: credit, employment, healthcare, housing, legal rights</span>
      <span class="badge badge-sg">Meaningful oversight &#8800; nominal oversight (humans genuinely adding judgment vs. rubber-stamping)</span>
      <span class="badge badge-sg">Governance cannot be outsourced: third-party AI must meet same MAIGF standards</span>
      <span class="badge badge-sg">ASEAN Guide built on MAIGF: one governance program addresses both Singapore and regional requirements</span>
      <span class="badge badge-sg">Explainability level should be proportionate to decision stakes and audience</span>
      <span class="badge badge-sg">Fairness requires examining proxy discrimination, not just direct protected characteristic use</span>
      <span class="badge badge-sg">Human-centricity asks: does this AI genuinely benefit affected people? (not just satisfy procedural requirements)</span>
    </div>
  </div>`
}

let current=0;
function buildGrid(){
  const g=document.getElementById('dayGrid');g.innerHTML='';
  for(let i=0;i<days.length;i++){
    const b=document.createElement('button');
    b.className='day-pip'+(days[i].isCheatSheet?' cheat':'')+(i===current?' active':'');
    b.textContent=days[i].isCheatSheet?'CS':(i+1);
    b.title=days[i].title;
    b.onclick=(()=>{const idx=i;return()=>goTo(idx);})();
    g.appendChild(b);
  }
}
function goTo(idx){current=idx;render();}
function changeDay(dir){current=Math.max(0,Math.min(days.length-1,current+dir));render();}
function render(){
  const d=days[current];const total=days.length;
  document.getElementById('dayCounter').textContent=(current+1)+' / '+total;
  document.getElementById('prevBtn').disabled=current===0;
  document.getElementById('nextBtn').disabled=current===total-1;
  document.getElementById('progBar').style.width=(((current+1)/total)*100)+'%';
  buildGrid();
  if(d.isCheatSheet){
    document.getElementById('lessonArea').innerHTML=`<div class="card"><div class="lesson-header"><div class="day-badge" style="background:#E1F5EE"><div class="day-num" style="color:#085041;font-size:14px">CHEAT</div><div class="day-lbl" style="color:#0F6E56">SHEET</div></div><div class="lesson-meta"><h2>${d.title}</h2><div class="tagline">${d.tagline}</div></div></div><div class="lesson-body">${d.body}</div></div>`;
    return;
  }
  const quizId='quiz_'+current;let quizHtml='';
  if(d.quiz){
    const optsHtml=d.quiz.opts.map((o,i)=>`<button class="quiz-btn" onclick="checkAnswer(${i},${d.quiz.ans},'${quizId}')">${o}</button>`).join('');
    quizHtml=`<div class="quiz-box"><p>Quick check: ${d.quiz.q}</p><div>${optsHtml}</div><div class="answer-reveal" id="${quizId}"></div></div>`;
  }
  document.getElementById('lessonArea').innerHTML=`<div class="card"><div class="lesson-header"><div class="day-badge"><div class="day-num">${current+1}</div><div class="day-lbl">Day</div></div><div class="lesson-meta"><h2>${d.title}</h2><div class="tagline">${d.tagline}</div></div></div><div class="section-label">Today&#8217;s lesson</div><div class="lesson-body">${d.body}</div>${quizHtml}</div>`;
}
function checkAnswer(chosen,correct,qid){
  const el=document.getElementById(qid);const d=days[current];if(!d.quiz)return;
  const isRight=chosen===correct;
  el.innerHTML='<strong>'+(isRight?'Correct!':'Not quite.')+'</strong> '+d.quiz.explain;
  el.className='answer-reveal show';
  el.style.background=isRight?'#EAF3DE':'#E0F4F4';
  el.style.borderColor=isRight?'#3B6D11':'#036564';
  el.style.color='#1a1a18';
}
render();
</script>
