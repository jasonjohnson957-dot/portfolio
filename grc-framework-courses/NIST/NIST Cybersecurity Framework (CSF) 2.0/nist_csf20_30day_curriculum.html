  {
    title: "Organizational Profiles — Your Customized Security Roadmap",
    tagline: "How organizations translate the universal CSF Core into their specific security plan",
    body: `<p>The <span class="key-term">CSF Profile</span> is how organizations translate the framework's universal outcomes into their specific situation. The CSF Core applies identically to all organizations — but a Profile is customized to each organization's unique context, risks, regulatory requirements, and available resources. Profiles are where the framework becomes actionable.</p>
    <div class="highlight-box">CSF 2.0 defines two Profile types:<br><br><strong>Current Profile:</strong> An honest description of the cybersecurity outcomes the organization currently achieves — what's working well, what's partially implemented, and what's not yet addressed. This requires candid self-assessment, not a marketing exercise.<br><br><strong>Target Profile:</strong> The cybersecurity outcomes the organization aims to achieve, defined by risk appetite, regulatory requirements, and business objectives.<br><br>The gap between Current and Target Profiles becomes the prioritized security roadmap — translating strategic intent into specific improvement actions with clear priorities.</div>
    <div class="analogy-box"><strong>The navigation analogy:</strong> The CSF Core is a comprehensive map. Your Current Profile is your current position on that map. Your Target Profile is your destination. The gap analysis is the route between them — identifying which roads to take, which obstacles to address first, and what resources the journey requires. Without both profiles and the gap analysis, you have a detailed map but no navigation — you know what exists but not how to get where you need to be.</div>
    <p>What a CSF Profile includes:</p>
    <div class="badge-row">
      <span class="badge badge-red">Organization's specific mission and business context</span>
      <span class="badge badge-red">Applicable legal, regulatory, and contractual requirements</span>
      <span class="badge badge-red">Risk appetite and tolerance from GOVERN</span>
      <span class="badge badge-red">Priority ranking of CSF outcomes by business criticality</span>
      <span class="badge badge-red">Current achievement level for each prioritized outcome</span>
      <span class="badge badge-red">Target achievement level for each prioritized outcome</span>
      <span class="badge badge-red">Resource constraints shaping what's achievable in the planning period</span>
    </div>
    <div class="info-box"><strong>Community Profiles — the new sector baseline concept in CSF 2.0:</strong> CSF 2.0 introduced Community Profiles — sector-specific or use-case-specific profile baselines developed by industry groups, government agencies, or sector ISACs that serve as starting points for individual organizations. Rather than each hospital building a CSF Profile entirely from scratch, the healthcare sector can develop a Healthcare Community Profile reflecting common HIPAA requirements, typical ransomware threats against clinical systems, and standard clinical IT asset types. Individual organizations then customize this community baseline for their specific context — dramatically reducing the effort of starting a CSF program.</div>`,
    quiz: { q: "A healthcare organization's Current Profile shows strong PROTECT outcomes but weak DETECT and RESPOND capabilities. How should this shape their security roadmap?", opts: ["Continue strengthening PROTECT since it's already a demonstrated strength", "Prioritize building DETECT and RESPOND capabilities — an organization that protects well but can't detect breaches or respond effectively when they occur has a critical capability gap that directly threatens patient safety and regulatory compliance", "Address RECOVER next, since it follows DETECT and RESPOND in the function sequence", "The strong PROTECT score means overall security is adequate — minimal investment needed"], ans: 1, explain: "Strong PROTECT with weak DETECT and RESPOND is a dangerous imbalance, particularly in healthcare. Even excellent defenses are eventually breached by sophisticated adversaries. If the organization can't detect breaches when they happen or respond effectively, the breach causes maximum damage before containment. For a hospital, this could mean weeks of clinical system downtime and massive HIPAA breach notification obligations. The Profile gap analysis clearly makes DETECT and RESPOND the highest-priority investment areas." }
  },
  {
    title: "The CSF Reference Tool — Your Digital Framework Navigator",
    tagline: "How NIST's free online tool makes the framework practical to use",
    body: `<p>CSF 2.0 launched with a major practical improvement: the <span class="key-term">NIST CSF Reference Tool</span> — a free, searchable online tool that transforms the framework from a dense document into an interactive, navigable resource. Understanding this tool is essential for anyone working with NIST CSF professionally.</p>
    <div class="highlight-box">The NIST CSF Reference Tool (available at csrc.nist.gov/projects/cybersecurity-framework) allows users to: browse all 6 Functions, 22 Categories, and 106 Subcategories in a searchable interface; view informative references showing which NIST SP 800-53 controls, ISO 27001 Annex A controls, CIS Controls v8 Safeguards, and other framework elements map to each CSF outcome; export custom views to Excel, JSON, or other formats for building assessment workbooks; filter by Function, Category, or specific subcategories relevant to a particular context; and access sector-specific Community Profiles and supplementary resources.</div>
    <p>Why the framework mapping capability is particularly valuable:</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>CSF ↔ NIST SP 800-53</strong><span>Federal agencies and contractors can see exactly which SP 800-53 controls achieve each CSF outcome — connecting the high-level governance framework to the detailed federal control catalog used in FISMA compliance and security authorization.</span></div>
      <div class="cheat-pill"><strong>CSF ↔ ISO 27001</strong><span>Organizations pursuing ISO 27001 certification can map CSF outcomes to ISO 27001 Annex A controls — building an integrated program that satisfies both frameworks and enables efficient cross-framework reporting.</span></div>
      <div class="cheat-pill"><strong>CSF ↔ CIS Controls v8</strong><span>Organizations using CIS Controls for implementation can demonstrate CSF alignment to boards and regulators — using the mapping to show how specific CIS Safeguards achieve specific CSF outcomes.</span></div>
      <div class="cheat-pill"><strong>CSF ↔ CMMC</strong><span>Defense contractors can use the NIST SP 800-171 → 800-53 → CSF crosswalk to position their CMMC compliance program within the CSF governance framework, creating coherent enterprise-level reporting about defense supply chain security.</span></div>
    </div>
    <div class="analogy-box"><strong>The Reference Tool as a Rosetta Stone:</strong> Before the Reference Tool, connecting CSF to other frameworks required manual mapping work taking days. The tool acts as a translation layer — a Rosetta Stone between security frameworks. A CISO can report to the board using CSF language; the security team implements controls using CIS Controls or ISO 27001; federal contractors reference SP 800-53; defense suppliers work with CMMC. Everyone pursues the same CSF outcomes through different implementation paths, and the Reference Tool makes these connections explicit and instantly accessible.</div>`,
    quiz: { q: "How does the CSF Reference Tool's framework mapping capability benefit organizations subject to multiple compliance requirements?", opts: ["It automatically generates compliance certification reports", "It shows how CSF outcomes map to controls in frameworks like ISO 27001, CIS Controls, and NIST SP 800-53 — allowing organizations to build one integrated program satisfying multiple frameworks simultaneously rather than maintaining parallel compliance efforts", "It only maps to NIST frameworks, not commercial ones like CIS Controls", "Framework mappings are only useful for federal agencies"], ans: 1, explain: "The Reference Tool's mapping capability enables integrated multi-framework compliance programs. An organization using CSF as its governance language can see exactly which ISO 27001 controls, CIS Controls Safeguards, or SP 800-53 controls implement each CSF outcome — building one security program that satisfies all applicable frameworks simultaneously. This 'build once, satisfy many' approach dramatically reduces the cost and complexity of managing multiple compliance obligations." }
  },
  {
    title: "GOVERN Deep Dive — Organizational Context (GV.OC)",
    tagline: "Why does your organization exist, and what does that mean for security?",
    body: `<p>Drilling deeper into GOVERN — <span class="key-term">GV.OC (Organizational Context)</span> addresses what sounds like a philosophical question but turns out to be one of the most practically consequential security activities: deeply understanding the organization's mission, environment, and stakeholder expectations so that cybersecurity decisions reflect actual organizational needs rather than generic best practice.</p>
    <div class="fn-govern"><b>GV.OC — Organizational Context</b><br><span style="font-size:12px;color:#1a1a18">The circumstances — mission, stakeholder expectations, dependencies, and legal/regulatory requirements — surrounding the organization's cybersecurity risk decisions are understood.</span></div>
    <p>Key outcomes within GV.OC:</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Mission and Objectives</strong><span>The organizational mission is understood and articulated. Cybersecurity objectives align with and support that mission — security exists as a business enabler, not a separate technical discipline. Security trade-offs are evaluated in terms of business impact.</span></div>
      <div class="cheat-pill"><strong>Stakeholder Expectations</strong><span>Internal and external stakeholders and their cybersecurity expectations are identified and documented. Customers, regulators, board members, employees, investors, and business partners all have security expectations that shape organizational security commitments.</span></div>
      <div class="cheat-pill"><strong>Legal and Regulatory Requirements</strong><span>All applicable legal, regulatory, and contractual cybersecurity requirements are identified, documented, and actively tracked for changes. HIPAA, GDPR, CMMC, PCI-DSS, SOC 2, and sector-specific requirements are all explicitly mapped and managed.</span></div>
      <div class="cheat-pill"><strong>Critical Dependencies</strong><span>The critical assets, services, capabilities, and external partners the organization depends on are understood — including supply chain dependencies whose compromise could cascade into organizational security failures.</span></div>
    </div>
    <div class="analogy-box"><strong>Why context changes everything:</strong> A hospital and a law firm both handle highly sensitive information — but their GV.OC contexts are radically different. The hospital's mission (patient care, life safety) means system availability has life-and-death implications — a ransomware-induced EHR outage could directly harm patients waiting for care. The law firm's primary concern is confidentiality of client communications. GV.OC ensures each organization builds security around its actual mission consequences, not around what a generic "sensitive data organization" should do.</div>
    <div class="highlight-box"><strong>The regulatory requirements inventory:</strong> One of the most practically valuable GV.OC outcomes is maintaining a comprehensive, current inventory of all applicable legal, regulatory, and contractual security requirements. Organizations subject to HIPAA, GDPR, PCI-DSS, CMMC, SOC 2, and multiple state privacy laws simultaneously need a unified map of requirements to avoid gaps. GV.OC requires this map to exist and be actively maintained — making compliance management systematic rather than reactive (discovering requirements only when violations are alleged).</div>`,
    quiz: { q: "A software company discovers they process employee health data through their benefits platform, making them subject to HIPAA, but never knew this obligation existed. Which GV.OC outcome was not achieved?", opts: ["Stakeholder expectations were not identified", "Legal, regulatory, and contractual requirements were not fully understood and documented — maintaining a comprehensive inventory of all applicable security requirements is an explicit GV.OC outcome", "The organizational mission was unclear", "Critical dependencies were not mapped"], ans: 1, explain: "GV.OC requires that all legal, regulatory, and contractual cybersecurity requirements are identified and documented. Failing to identify an applicable regulatory requirement — HIPAA in this case — means this GV.OC outcome was not achieved. A comprehensive requirements inventory, updated when business activities change, should have flagged HIPAA applicability when the company began handling employee health data through their benefits platform." }
  },
  {
    title: "GOVERN Deep Dive — Risk Strategy and Supply Chain (GV.RM and GV.SC)",
    tagline: "Setting risk appetite and managing the most dangerous modern attack vector",
    body: `<p>Two of GOVERN's most critical categories address the strategic foundation of risk management and one of the most significant modern cyber threats respectively: <span class="key-term">Risk Management Strategy (GV.RM)</span> and <span class="key-term">Cybersecurity Supply Chain Risk Management (GV.SC)</span>.</p>
    <div class="fn-govern"><b>GV.RM — Risk Management Strategy</b><br><span style="font-size:12px;color:#1a1a18">The organization's priorities, constraints, risk tolerance, and assumptions are established and used to support operational risk decisions.</span></div>
    <p>GV.RM outcomes include:</p>
    <div class="badge-row">
      <span class="badge badge-purple">Risk appetite and tolerance explicitly defined and communicated by senior leadership</span>
      <span class="badge badge-purple">Risk management objectives aligned to organizational mission and strategy</span>
      <span class="badge badge-purple">Operational risk decisions consistently reference defined risk tolerance and strategic priorities</span>
      <span class="badge badge-purple">Strategic opportunities are evaluated alongside risks — security enables business, not just constrains it</span>
    </div>
    <div class="analogy-box"><strong>Risk appetite in practice:</strong> "We will accept that our public-facing blog may occasionally be defaced by unsophisticated attackers, but we will not accept any compromise of our customer payment data or personally identifiable information." That's a risk appetite statement. It tells the security team exactly where to concentrate resources, how to evaluate competing security investments, and what trade-offs are acceptable when budget is constrained. Without explicit risk appetite, every security decision requires relitigating organizational priorities — producing inconsistent, politically-influenced security investment patterns.</div>
    <div class="fn-govern"><b>GV.SC — Cybersecurity Supply Chain Risk Management</b><br><span style="font-size:12px;color:#1a1a18">Cyber supply chain risk management processes are identified, established, managed, monitored, and improved by organizational stakeholders.</span></div>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>The SolarWinds Lesson</strong><span>In 2020, attackers inserted malicious code into a software update from SolarWinds — a trusted IT management vendor. 18,000 organizations downloaded and installed this update, giving attackers persistent access to networks including US government agencies. GV.SC specifically addresses this class of attack.</span></div>
      <div class="cheat-pill"><strong>Supplier Requirements</strong><span>GV.SC requires establishing cybersecurity requirements for suppliers and partners — flowing security expectations down the supply chain rather than assuming that because a supplier is trusted for business purposes, they are also trustworthy for security purposes.</span></div>
      <div class="cheat-pill"><strong>Monitoring and Response</strong><span>Supply chain risk is ongoing — a supplier that was secure last year may be compromised today. GV.SC requires continuous monitoring of supplier security posture and documented plans to respond when supplier failures affect the organization.</span></div>
      <div class="cheat-pill"><strong>Interconnection with CMMC</strong><span>GV.SC's supply chain outcomes directly address why CMMC exists — the DoD's recognition that prime contractor security is insufficient if subcontractors handling CUI are unvetted. CMMC flow-down requirements are exactly what GV.SC mandates as a governance practice.</span></div>
    </div>`,
    quiz: { q: "Why was Cybersecurity Supply Chain Risk Management (GV.SC) elevated to its own dedicated GOVERN category in CSF 2.0?", opts: ["Because supply chain purchases are expensive and need budget governance", "Because the SolarWinds attack and similar incidents demonstrated that supply chain compromises represent a fundamental, board-level risk category requiring dedicated strategic governance — not just technical vendor questionnaires", "Because CMMC requires CSF to address supply chain", "Because ISO 27001 added supply chain controls in 2022"], ans: 1, explain: "Supply chain risk was elevated to a dedicated GOVERN category because SolarWinds proved that organizations with excellent internal security could be catastrophically compromised through trusted suppliers. This moved supply chain risk from a technical vendor management topic to a board-level strategic governance concern — requiring the same systematic treatment as any other major organizational risk. GV.SC ensures this elevated treatment is formalized in the framework structure." }
  },
  {
    title: "CSF Metrics — Measuring What Actually Matters",
    tagline: "How to connect framework outcomes to security performance your board can understand",
    body: `<p>One of NIST CSF's most powerful applications is providing a structure for meaningful cybersecurity metrics. Organizations using CSF as their governance framework can align security metrics directly to CSF Functions and Categories — making it possible to report on cybersecurity performance in language that senior leaders understand and can act on.</p>
    <div class="highlight-box"><strong>The metrics problem CSF solves:</strong> Traditional cybersecurity metrics — number of alerts blocked, patch compliance percentage, firewall rules updated — are technically real but strategically meaningless to boards. "We blocked 12 million attacks last month" tells the board nothing about whether the organization is more or less secure. CSF-aligned metrics answer the question that actually matters: are we achieving the security outcomes that reduce risk to our mission?</div>
    <p>CSF-aligned metrics by Function:</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>GOVERN Metrics</strong><span>% of critical suppliers with current security assessments. % of business processes with documented risk acceptance decisions. Days since last formal management review. % of roles with documented cybersecurity accountability.</span></div>
      <div class="cheat-pill"><strong>IDENTIFY Metrics</strong><span>% of assets in current, verified inventory. % of critical systems with completed risk assessments in last 12 months. Mean time between risk assessment updates for high-risk systems. Untracked assets discovered each quarter.</span></div>
      <div class="cheat-pill"><strong>PROTECT Metrics</strong><span>% of privileged accounts with MFA enabled. % of systems patched within defined SLA. % of employees completing annual security training. % of sensitive data encrypted at rest.</span></div>
      <div class="cheat-pill"><strong>DETECT Metrics</strong><span>Mean time to detect security events (MTTD). % of log sources centralized in SIEM. % of critical systems with active endpoint detection. Alert-to-investigation ratio (false positive rate).</span></div>
      <div class="cheat-pill"><strong>RESPOND Metrics</strong><span>Mean time to respond to confirmed incidents (MTTR). % of incidents with documented post-incident reviews. % of incidents closed within defined SLAs. Incidents requiring executive escalation per quarter.</span></div>
      <div class="cheat-pill"><strong>RECOVER Metrics</strong><span>Mean time to recover critical systems. % of recovery procedures tested in last 12 months. Recovery Time Objective (RTO) achievement rate. Lessons learned implemented from post-incident reviews this quarter.</span></div>
    </div>
    <div class="analogy-box"><strong>Metrics connected to Target Profile:</strong> CSF metrics are most powerful when connected to specific Target Profile outcomes. If the Target Profile says "MFA enabled for all privileged accounts by Q3," the metric "% of privileged accounts with MFA" directly measures progress toward that specific strategic target. This connects measurement to strategic intent — making metrics meaningful to business leadership and security teams simultaneously instead of serving two different audiences with different information.</div>`,
    quiz: { q: "Why is 'Mean Time to Detect security events (MTTD)' a more valuable board metric than 'number of alerts handled this month'?", opts: ["MTTD is easier to calculate from existing security tools", "MTTD directly measures progress toward the DETECT outcome of finding cybersecurity events quickly — it tells leadership whether detection capability is improving or deteriorating, which directly relates to the business risk of undetected breach damage. Alert counts measure activity volume, not security outcomes.", "Alert counts are proprietary data that cannot be shared with boards", "Boards prefer simpler metrics with smaller numbers"], ans: 1, explain: "MTTD measures whether the organization is achieving the CSF DETECT outcome — finding cybersecurity events quickly. A declining MTTD (detecting events faster) directly reduces the business risk of extended undetected breaches. Counting alerts measures activity volume but says nothing about detection quality — an organization can handle thousands of low-quality alerts and still miss a sophisticated attacker operating for months. MTTD answers the strategic question: are we getting better at finding threats?" }
  },
  {
    title: "NIST CSF for Small and Medium Organizations",
    tagline: "Making the framework practical for organizations without dedicated security teams",
    body: `<p>A common concern about NIST CSF is whether it's only accessible to large organizations with dedicated security teams. CSF 2.0 directly addressed this with explicit small business guidance, simplified resources, and Community Profiles. The answer is a clear no — but using CSF effectively in a small organization requires a different approach than deploying it at an enterprise.</p>
    <div class="highlight-box">NIST published a companion resource alongside CSF 2.0: the <strong>NIST CSF 2.0 Small Business Quick Start Guide</strong>. This free resource translates CSF outcomes into plain language appropriate for small businesses, identifies the highest-priority outcomes for resource-constrained organizations, and provides concrete first steps that don't require large security budgets, dedicated security staff, or specialized consulting firms.</div>
    <p>Practical approaches for small organizations:</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Start with GOVERN — Not Tools</strong><span>Even with minimal resources, establish: who owns security decisions, what the risk appetite is, what regulations apply, and who is accountable for each security area. Governance costs decisions and time, not money.</span></div>
      <div class="cheat-pill"><strong>Focus on Highest-Impact Outcomes</strong><span>Small organizations cannot achieve all 106 subcategories simultaneously. Use the CSF to identify the 20-30 outcomes most critical to their specific risk context. A payroll company's priorities differ dramatically from a manufacturing firm's.</span></div>
      <div class="cheat-pill"><strong>Use Community Profiles as Starting Points</strong><span>Many small businesses operate in sectors with available Community Profiles — healthcare, financial services, manufacturing, education. These sector baselines provide a calibrated starting point without requiring expertise to build from scratch.</span></div>
      <div class="cheat-pill"><strong>Leverage Managed Security Services</strong><span>Small organizations can achieve DETECT and RESPOND outcomes through managed security service providers (MSSPs) — accessing enterprise-grade capabilities at a subscription price rather than building internal teams for capabilities that don't justify full-time dedicated staff.</span></div>
      <div class="cheat-pill"><strong>Connect CSF to Cyber Insurance</strong><span>Cyber insurance underwriters increasingly use CSF-aligned questions in their applications. Organizations that document their CSF implementation often qualify for better coverage terms and lower premiums — making CSF investment commercially justified beyond security outcomes alone.</span></div>
      <div class="cheat-pill"><strong>Progress Over Perfection</strong><span>A small business moving from Tier 1 (ad hoc) to Tier 2 (management-approved practices) achieves real, meaningful security improvement — even if Tier 4 remains years away. The framework supports incremental progress, not only comprehensive transformation.</span></div>
    </div>
    <div class="analogy-box"><strong>The coffee shop vs. hospital contrast:</strong> A coffee shop and a hospital both benefit from NIST CSF — but appropriate profiles look completely different. The hospital needs comprehensive, Tier 3-4 capabilities because patient safety depends on system availability and data confidentiality. The coffee shop needs to protect customer payment data and their point-of-sale system — a narrower, simpler profile at a lower tier. CSF accommodates both because it's outcome-based and context-driven, not prescriptive and uniform.</div>`,
    quiz: { q: "A 20-person legal firm wants to start using NIST CSF but has no dedicated IT security staff. What is the most practical starting approach?", opts: ["Implement all 106 subcategories simultaneously using an outside consultant", "Start with GOVERN (document who owns security, risk appetite, applicable regulations), identify the 15-20 outcomes most critical to their specific risk context (client confidentiality, malpractice risk), use any available legal sector Community Profile, and implement incrementally with managed services for capabilities beyond internal capacity", "Wait until they can hire a dedicated CISO before using any framework", "Only implement PROTECT outcomes — the other functions require security specialists"], ans: 1, explain: "The most effective approach for a resource-constrained small firm: establish governance foundations first (accountability, risk appetite, applicable legal requirements — which for a law firm include attorney-client privilege and various state bar requirements), focus on the outcomes most critical to their context, leverage any available Community Profile to avoid starting from scratch, and use managed services for capabilities like DETECT and RESPOND that would require specialist staff they can't justify full-time. Start with GOVERN; build incrementally." }
  },
  {
    title: "NIST CSF and Enterprise Risk Management",
    tagline: "Connecting cybersecurity risk to every other organizational risk the board manages",
    body: `<p>NIST CSF 2.0 doesn't position cybersecurity as a separate technical discipline — it explicitly integrates cybersecurity risk into broader <span class="key-term">Enterprise Risk Management (ERM)</span>. This integration is strategically important: until cybersecurity risk appears in the board's portfolio of organizational risks alongside financial risk, operational risk, and legal risk, security investment remains perpetually underfunded and disconnected from business strategy.</p>
    <div class="highlight-box">CSF 2.0's GOVERN function explicitly connects to ERM through GV.RM (Risk Management Strategy) and GV.OV (Oversight). The outcomes require that cybersecurity risk receives the same systematic, board-visible treatment as other organizational risks — evaluated in business-impact terms (financial loss, operational disruption, regulatory penalties, reputational damage) rather than technical terms (vulnerability counts, patch status) that business leaders cannot evaluate or act on.</div>
    <p>How CSF connects to NIST's broader risk management ecosystem:</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>NIST Risk Management Framework (RMF — SP 800-37)</strong><span>The federal system authorization process. CSF GOVERN aligns with RMF Prepare; IDENTIFY with Categorize; PROTECT with Select and Implement; DETECT and RESPOND with Assess; RECOVER with Monitor. Federal agencies use both simultaneously — CSF for enterprise governance, RMF for individual system authorization.</span></div>
      <div class="cheat-pill"><strong>NIST Risk Assessment (SP 800-30)</strong><span>The detailed risk assessment methodology that produces the assessments required by CSF's IDENTIFY function (ID.RA). Organizations using CSF for governance and SP 800-30 for assessment methodology have a complete, standards-based risk management program.</span></div>
      <div class="cheat-pill"><strong>NIST Privacy Framework</strong><span>Parallel structure to CSF (Identify-Govern-Control-Communicate-Protect). CSF 2.0 references Privacy Framework outcomes in several subcategories, acknowledging that cybersecurity and privacy risk require integrated management particularly under GDPR, CCPA, and other privacy regulations.</span></div>
      <div class="cheat-pill"><strong>NIST AI Risk Management Framework</strong><span>Released January 2023. Addresses risks specific to AI systems — performance reliability, bias, explainability, privacy, security. CSF addresses cybersecurity of AI infrastructure; AI RMF extends to AI-specific risks. Critical for organizations Jason is targeting in AI Governance Program Management roles.</span></div>
    </div>
    <div class="analogy-box"><strong>The board risk portfolio analogy:</strong> A Chief Risk Officer manages a portfolio — credit risk, market risk, operational risk, legal risk, reputational risk. Cybersecurity risk must appear in that portfolio expressed in comparable terms: "A successful ransomware attack against our patient records system has an estimated financial impact of $15-50 million including remediation, notification, regulatory fines, and reputational damage, with a 35% probability in the next 36 months based on industry data." That's the language GOVERN enables — and it's what transforms cybersecurity from an IT expense into a board-level risk management discussion.</div>`,
    quiz: { q: "How does the NIST AI Risk Management Framework (AI RMF) relate to NIST CSF for organizations deploying AI systems?", opts: ["The AI RMF replaces CSF for all AI-related security concerns", "They are complementary frameworks: CSF addresses cybersecurity risks affecting AI systems (unauthorized access, infrastructure failures, training data breaches); the AI RMF addresses AI-specific risks (model bias, unexplainable decisions, misuse). Together they provide complete risk coverage for AI deployments.", "The AI RMF only applies to federal agencies deploying AI", "AI systems are exempt from CSF requirements because they're technology, not business systems"], ans: 1, explain: "CSF and the AI RMF are complementary, not competing. CSF addresses whether the infrastructure running an AI system is secure — protecting against unauthorized access, data breaches, and availability failures that would affect the AI system as any other system. The AI RMF addresses risks unique to AI — that the model produces systematically biased outputs, fails in unexpected ways, can't explain its decisions, or is deliberately misused. Organizations deploying AI in important contexts should use both frameworks concurrently." }
  },
  {
    title: "NIST CSF in Regulated Industries",
    tagline: "How healthcare, finance, energy, and government sectors apply the framework",
    body: `<p>While NIST CSF 2.0 is explicitly designed for all organizations, regulated industries have specific relationships with the framework that reflect both its original critical infrastructure focus and decade-long evolution. Understanding these sector-specific applications is essential for compliance professionals who will work across multiple regulatory environments.</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Healthcare (HIPAA + CSF)</strong><span>HHS has explicitly endorsed using NIST CSF as a guide for HIPAA Security Rule implementation. The HIPAA Security Rule's administrative, physical, and technical safeguard categories map directly to CSF Functions. HITRUST CSF aligns HIPAA, NIST CSF, and ISO 27001 into one healthcare-specific framework. HHS published a specific CSF-to-HIPAA crosswalk that organizations can use directly.</span></div>
      <div class="cheat-pill"><strong>Financial Services (FFIEC + CSF)</strong><span>The FFIEC (Federal Financial Institutions Examination Council) integrated CSF into its IT Examination Handbook and published a Cybersecurity Assessment Tool (CAT) mapped to CSF outcomes. Banks, credit unions, and other regulated financial institutions use CSF alongside FFIEC examination guidance and often SOC 2 for vendor assurance.</span></div>
      <div class="cheat-pill"><strong>Energy and Critical Infrastructure</strong><span>CSF was born from energy sector needs (EO 13636). NERC CIP (North American Electric Reliability Corporation Critical Infrastructure Protection) standards for the electrical grid have official CSF mappings. Energy organizations often use CSF for enterprise-level cybersecurity governance while meeting NERC CIP mandatory standards for grid-specific operational technology.</span></div>
      <div class="cheat-pill"><strong>Federal Government (FISMA + CSF)</strong><span>Federal agencies must follow NIST standards under FISMA. Executive Order 14028 (2021) directed federal agencies to adopt CSF. The relationship: CSF provides enterprise governance (the "what to achieve") while NIST SP 800-53 provides the detailed federal control catalog (the "how to achieve it") for individual system authorization through the RMF.</span></div>
    </div>
    <div class="highlight-box"><strong>CISA and CSF implementation support:</strong> The Cybersecurity and Infrastructure Security Agency (CISA) works alongside NIST to support CSF adoption in the 16 critical infrastructure sectors. CISA provides free technical assistance, sector-specific resources, and Community Profile development support. Organizations in critical infrastructure sectors can access CISA's cybersecurity advisory services, which increasingly use CSF as the common reference framework for identifying and addressing organizational security gaps.</div>
    <div class="analogy-box"><strong>CSF as the governance layer, sector requirements as the compliance layer:</strong> In virtually every regulated industry, CSF serves as the enterprise governance framework (the strategic management layer) while sector-specific regulations serve as specific compliance requirements (the tactical obligation layer). CSF ensures security decisions align with organizational strategy and risk context. HIPAA, PCI-DSS, NERC CIP, and FISMA ensure specific regulatory obligations are met. The two layers reinforce each other — CSF gives coherence and strategic direction; sector requirements give specific regulatory precision.</div>`,
    quiz: { q: "A hospital uses NIST CSF for enterprise cybersecurity governance alongside HIPAA Security Rule compliance for PHI protection. Why is this a sound integrated approach rather than unnecessary duplication?", opts: ["Using both creates regulatory risk from conflicting requirements", "CSF provides the strategic governance structure ensuring security aligns with organizational mission and risk appetite; HIPAA provides the specific regulatory requirements for PHI protection. They operate at different levels and reinforce each other — CSF is the management framework, HIPAA is the specific compliance obligation within it.", "HIPAA supersedes NIST CSF in healthcare, making CSF irrelevant for hospitals", "CSF comprehensively satisfies all HIPAA requirements, making separate HIPAA compliance work unnecessary"], ans: 1, explain: "Using CSF for governance alongside HIPAA for PHI-specific compliance is the approach HHS endorses. CSF ensures the organization has a coherent, strategic approach to cybersecurity risk management aligned with its patient care mission and business strategy. HIPAA provides specific requirements for PHI that must be met regardless of the governance framework used. The two frameworks address different questions: CSF asks 'how should we govern cybersecurity risk across the enterprise?'; HIPAA asks 'what specifically must we do to protect patient health information?'" }
  },
  {
    title: "Executive Order 14028 and Its Impact on CSF 2.0",
    tagline: "How the Biden Administration's cybersecurity executive order reshaped the framework",
    body: `<p><span class="key-term">Executive Order 14028</span> — "Improving the Nation's Cybersecurity" — signed by President Biden in May 2021, directly shaped the development of CSF 2.0. It responded to a wave of high-profile incidents that exposed fundamental gaps in national cybersecurity posture, and its requirements flowed directly into the framework update process.</p>

    <p>Key EO 14028 directives that shaped CSF 2.0:</p>

let current = 0;

function buildGrid(){
  const g = document.getElementById('dayGrid');
  g.innerHTML = '';
  for(let i = 0; i < days.length; i++){
    const b = document.createElement('button');
    b.className = 'day-pip' + (days[i].isCheatSheet ? ' cheat' : '') + (i === current ? ' active' : '');
    b.textContent = days[i].isCheatSheet ? 'CS' : (i + 1);
    b.title = days[i].title;
    b.onclick = (()=>{ const idx = i; return () => goTo(idx); })();
    g.appendChild(b);
  }
}

function goTo(idx){ current = idx; render(); }
function changeDay(dir){ current = Math.max(0, Math.min(days.length - 1, current + dir)); render(); }

      <div class="answer-reveal" id="${quizId}"></div>
    </div>`;
  }

  document.getElementById('lessonArea').innerHTML = `
    <div class="card">
      <div class="lesson-header">
        <div class="day-badge">
          <div class="day-num">${current + 1}</div>
          <div class="day-lbl">Day</div>
        </div>
        <div class="lesson-meta">
          <h2>${d.title}</h2>
          <div class="tagline">${d.tagline}</div>
        </div>
      </div>
      <div class="section-label">Today's lesson</div>
      <div class="lesson-body">${d.body}</div>
      ${quizHtml}
    </div>`;
}

function checkAnswer(chosen, correct, qid){
  const el = document.getElementById(qid);
  const d = days[current];
  if(!d.quiz) return;
  const isRight = chosen === correct;
  el.innerHTML = `<strong>${isRight ? 'Correct!' : 'Not quite.'}</strong> ${d.quiz.explain}`;
  el.className = 'answer-reveal show';
  el.style.background = isRight ? '#EAF3DE' : '#FCEBEB';
  el.style.borderColor = isRight ? '#3B6D11' : '#A32D2D';
  el.style.color = '#1a1a18';
}

render();
</script>
</body>
</html>
