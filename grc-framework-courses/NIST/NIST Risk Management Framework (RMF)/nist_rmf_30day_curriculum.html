  {
    title: "NIST RMF Cheat Sheet",
    tagline: "Your complete quick-reference guide",
    isCheatSheet: true,
    body: `
    <div class="cheat-section">
      <h3>What Is NIST RMF?</h3>
      <p style="font-size:13.5px;color:#6b6b68">NIST Risk Management Framework. Federal government's structured 7-step process for managing security and privacy risk in information systems. Documented in NIST SP 800-37 Revision 2 (December 2018). Mandatory for federal agencies under FISMA (Federal Information Security Modernization Act). Produces an Authorization to Operate (ATO) — the formal government approval for a system to process federal information. Free, publicly available from NIST. Widely adopted by federal contractors, state/local agencies, and regulated industries. Works alongside NIST CSF 2.0 (enterprise governance) and NIST SP 800-53 (control catalog).</p>
    </div>

    <div class="cheat-section">
      <h3>The 7 Steps</h3>
      <div class="step-card"><b>Step 1 — PREPARE (NEW in Rev 2)</b><br><span style="font-size:12px;color:#1a1a18">Organization level: designate roles, establish risk management strategy, organizational risk assessment, prioritize systems, establish monitoring strategy, identify common controls. System level: define system purpose, establish authorization boundary, identify security requirements, identify stakeholders. Purpose: ensure organizational and system readiness before RMF begins.</span></div>
      <div class="step-card"><b>Step 2 — CATEGORIZE</b><br><span style="font-size:12px;color:#1a1a18">Classify the system and information it handles using FIPS 199. Identify all information types using SP 800-60. Evaluate confidentiality, integrity, and availability impact for each. Apply high watermark principle. Document security category: SC System = {(C, impact), (I, impact), (A, impact)}. Review and approval by System Owner and AO. Output: Completed System Categorization (Low, Moderate, or High).</span></div>
      <div class="step-card"><b>Step 3 — SELECT</b><br><span style="font-size:12px;color:#1a1a18">Identify applicable SP 800-53 baseline (Low/Moderate/High) from SP 800-53B. Tailor: scope (remove N/A controls), supplement (add controls for unique risks), adjust parameters. Identify inherited controls from common control providers. Document compensating controls where baseline controls cannot be implemented. Output: Selected, tailored control set documented in SSP.</span></div>
      <div class="step-card"><b>Step 4 — IMPLEMENT</b><br><span style="font-size:12px;color:#1a1a18">Deploy all selected security controls. Document implementation in System Security Plan — specific, verifiable implementation statements for each control. Includes technical controls, policies, procedures, and training. Classify controls as system-specific, hybrid, or inherited. Document is concurrent with implementation — not retrospective. Output: Implemented controls + completed SSP draft.</span></div>
      <div class="step-card"><b>Step 5 — ASSESS</b><br><span style="font-size:12px;color:#1a1a18">Independent Security Control Assessor (SCA) evaluates controls using SP 800-53A procedures. Three methods: Examine (documentation review), Interview (personnel discussions), Test (technical control verification). Findings: Satisfied or Other Than Satisfied. Produces Security Assessment Plan (SAP) before assessment and Security Assessment Report (SAR) after. Assessment depth proportionate to system impact level.</span></div>
      <div class="step-card"><b>Step 6 — AUTHORIZE</b><br><span style="font-size:12px;color:#1a1a18">AO reviews complete authorization package: SSP + SAR + POA&M. AO makes formal risk-based decision: Authorization to Operate (ATO) — risk acceptable, system may operate; ATO with Conditions — authorization with specific requirements; Denial of Authorization to Operate (DATO) — risk unacceptable. ATO documents residual risk acceptance with AO name, date, and typically 1-3 year validity. Operating without a current ATO is a FISMA violation.</span></div>
      <div class="step-card"><b>Step 7 — MONITOR</b><br><span style="font-size:12px;color:#1a1a18">Ongoing: continuous control monitoring per ISCM strategy (SP 800-137), POA&M management and closure tracking, change management (assess security impact of system/environment changes), security status reporting to AO and CISO, ongoing risk assessments, maintaining current SSP. Supports ongoing authorization concept. Feeds into annual FISMA reporting. Includes secure decommissioning when system reaches end of life.</span></div>
    </div>

    <div class="cheat-section">
      <h3>Impact Levels (FIPS 199)</h3>
      <div class="impact-grid">
        <div class="impact-low"><strong style="color:#27500A">LOW</strong><br><span style="font-size:12px">Limited adverse effect on operations, assets, or individuals. Basic cyber hygiene. Smallest SP 800-53 baseline. Less common — most systems are Moderate.</span></div>
        <div class="impact-mod"><strong style="color:#633806">MODERATE (Most Common ~80%)</strong><br><span style="font-size:12px">Serious adverse effect. General-purpose federal systems, PII, financial processing. Moderate SP 800-53 baseline. Most federal general-purpose systems.</span></div>
        <div class="impact-high"><strong style="color:#4A1B0C">HIGH</strong><br><span style="font-size:12px">Severe or catastrophic adverse effect. Health/safety critical systems, critical infrastructure, severe mission impact. Comprehensive High baseline. Strictest monitoring.</span></div>
      </div>
      <p style="font-size:12.5px;color:#6b6b68;margin-top:.5rem"><strong>High Watermark Principle:</strong> System impact level = highest individual rating across Confidentiality, Integrity, and Availability. SC = {(C, H), (I, M), (A, L)} → System = HIGH.</p>
    </div>

    <div class="cheat-section">
      <h3>Key Documents</h3>
      <div class="control-row">
        <div class="ctrl-card"><b>SSP — System Security Plan</b> — Complete system description: purpose, boundary, information types, categorization, ALL control implementation statements, roles, interconnections. Primary input to assessment and authorization. Must be kept current throughout operations.</div>
        <div class="ctrl-card"><b>SAR — Security Assessment Report</b> — Independent assessor's findings for all controls: Satisfied or Other Than Satisfied. Assessment methods, evidence reviewed, findings rationale. One of three authorization package documents reviewed by AO.</div>
        <div class="ctrl-card"><b>POA&M — Plan of Action and Milestones</b> — Tracked remediation plan for every control deficiency. Contains: weakness description, affected control, remediation steps, resources required, milestone dates, responsible party, status. Required by FISMA. AOs accept risk based on POA&M quality.</div>
        <div class="ctrl-card"><b>ATO — Authorization to Operate</b> — Signed decision document from AO formally accepting residual risk and authorizing system operation. Includes AO name, date, validity period. Not a security certification — a formal risk acceptance. DATO = Denial of ATO.</div>
        <div class="ctrl-card"><b>SAP — Security Assessment Plan</b> — Documents assessment scope, methods, schedule, and evidence requirements before assessment begins. Reviewed and approved before assessment starts. Defines what will be examined, interviewed, and tested.</div>
        <div class="ctrl-card"><b>System Categorization</b> — Completed FIPS 199 form showing all information types, CIA ratings per SP 800-60, adjustments, and final impact level. Required SSP component. Approved by System Owner and AO.</div>
      </div>
    </div>

    <div class="cheat-section">
      <h3>Key Roles</h3>
      <div class="control-row">
        <div class="ctrl-card"><b>Authorizing Official (AO)</b> — Senior official who formally accepts risk and issues ATO. Cannot be delegated below certain seniority. Personally accountable for authorization decision. Reviews SSP + SAR + POA&M.</div>
        <div class="ctrl-card"><b>System Owner (SO)</b> — Responsible for overall system procurement, operation, maintenance. Primary accountability for system's security posture. Works closely with ISSO. Often the program manager or IT project lead.</div>
        <div class="ctrl-card"><b>ISSO — Information System Security Officer</b> — Day-to-day security manager for the system. Maintains SSP, tracks POA&Ms, monitors controls, coordinates assessments, reports to ISSM. Primary technical security contact.</div>
        <div class="ctrl-card"><b>ISSM — Information System Security Manager</b> — Oversees security of multiple systems/programs. Management layer above ISSO. Liaison between system teams and CISO/AO. Ensures policy consistency across systems.</div>
        <div class="ctrl-card"><b>Security Control Assessor (SCA)</b> — Independently tests controls during ASSESS. Must be independent of system development/operations. Produces SAR. Independence is non-negotiable for assessment credibility.</div>
        <div class="ctrl-card"><b>Common Control Provider</b> — Provides inherited controls used by multiple systems (physical security, network infrastructure, enterprise identity management). Must document, assess, and maintain these controls for inheriting systems.</div>
      </div>
    </div>

    <div class="cheat-section">
      <h3>SP 800-53 Rev 5 — 20 Control Families</h3>
      <div class="badge-row">
        <span class="badge badge-forest">AC — Access Control</span>
        <span class="badge badge-forest">AT — Awareness and Training</span>
        <span class="badge badge-forest">AU — Audit and Accountability</span>
        <span class="badge badge-forest">CA — Assessment, Authorization, and Monitoring</span>
        <span class="badge badge-forest">CM — Configuration Management</span>
        <span class="badge badge-forest">CP — Contingency Planning</span>
        <span class="badge badge-forest">IA — Identification and Authentication</span>
        <span class="badge badge-forest">IR — Incident Response</span>
        <span class="badge badge-forest">MA — Maintenance</span>
        <span class="badge badge-forest">MP — Media Protection</span>
        <span class="badge badge-forest">PE — Physical and Environmental Protection</span>
        <span class="badge badge-forest">PL — Planning</span>
        <span class="badge badge-forest">PM — Program Management</span>
        <span class="badge badge-forest">PS — Personnel Security</span>
        <span class="badge badge-forest">PT — PII Processing and Transparency (new in Rev 5)</span>
        <span class="badge badge-forest">RA — Risk Assessment</span>
        <span class="badge badge-forest">SA — System and Services Acquisition</span>
        <span class="badge badge-forest">SC — System and Communications Protection</span>
        <span class="badge badge-forest">SI — System and Information Integrity</span>
        <span class="badge badge-forest">SR — Supply Chain Risk Management (new in Rev 5)</span>
      </div>
    </div>

    <div class="cheat-section">
      <h3>Framework Relationships</h3>
      <div class="control-row">
        <div class="ctrl-card"><b>NIST CSF 2.0</b> — Enterprise governance (what to achieve); RMF is operational process (how to authorize individual systems). CSF GOVERN → RMF Prepare; CSF IDENTIFY → Categorize+Select; CSF PROTECT → Implement; CSF DETECT/RESPOND/RECOVER → Monitor. Both operate simultaneously at different levels.</div>
        <div class="ctrl-card"><b>NIST SP 800-53</b> — The security control catalog used in SELECT and IMPLEMENT. SP 800-53A provides assessment procedures for ASSESS. SP 800-53B provides the baselines. Together these form the core technical implementation standard for RMF.</div>
        <div class="ctrl-card"><b>CMMC</b> — CMMC is organizational certification for DoD CUI; RMF is system authorization for federal systems. SP 800-171 (CMMC Level 2) derived from SP 800-53. Significant control overlap enables integrated compliance programs for contractors working with both DoD and civilian agencies.</div>
        <div class="ctrl-card"><b>FedRAMP</b> — RMF for cloud services. "Do once, use many" authorization for cloud providers. FedRAMP Low/Moderate/High baselines correspond to FIPS 199 levels. 3PAOs conduct FedRAMP assessments. Mandatory for federal agencies using cloud services for federal data. JAB P-ATOs highest recognition.</div>
        <div class="ctrl-card"><b>FISMA</b> — The law that mandates RMF for federal agencies. Agency heads personally responsible. Annual OMB reporting. IG evaluations assess program quality. ATO coverage, monitoring effectiveness, and POA&M management are primary FISMA metrics. Non-compliance has congressional visibility.</div>
        <div class="ctrl-card"><b>ISO 27001</b> — ISO 27001's PDCA-based ISMS and SP 800-37's RMF address similar problems (systematic risk management) for different audiences (international enterprise vs. US federal). ISO 27001 Annex A maps to SP 800-53 control families. Organizations can use both: ISO 27001 for market credibility, RMF for FISMA compliance.</div>
      </div>
    </div>

    <div class="cheat-section">
      <h3>Key Numbers and Facts</h3>
      <div class="badge-row">
        <span class="badge badge-forest">SP 800-37 Rev 2: December 2018 (current)</span>
        <span class="badge badge-forest">7 steps: Prepare, Categorize, Select, Implement, Assess, Authorize, Monitor</span>
        <span class="badge badge-forest">3 impact levels: Low, Moderate (most common ~80%), High</span>
        <span class="badge badge-forest">3 authorization package documents: SSP + SAR + POA&M</span>
        <span class="badge badge-forest">3 assessment methods: Examine, Interview, Test (SP 800-53A)</span>
        <span class="badge badge-forest">FIPS 199: security categorization standard</span>
        <span class="badge badge-forest">FIPS 200: 17 minimum security requirement areas</span>
        <span class="badge badge-forest">SP 800-53 Rev 5: 20 control families, 1,000+ controls</span>
        <span class="badge badge-forest">SP 800-53B: Low, Moderate, High control baselines</span>
        <span class="badge badge-forest">SP 800-60 Vol I&II: information type catalog for Categorize</span>
        <span class="badge badge-forest">SP 800-137: continuous monitoring (ISCM) framework</span>
        <span class="badge badge-forest">SP 800-53A: assessment procedures companion to 800-53</span>
        <span class="badge badge-forest">ATO = risk acceptance (not security certification)</span>
        <span class="badge badge-forest">DATO = Denial of Authorization to Operate</span>
        <span class="badge badge-forest">ATO without current date = FISMA compliance failure</span>
        <span class="badge badge-forest">FedRAMP = cloud authorization (JAB P-ATO = highest)</span>
        <span class="badge badge-forest">ISCM = Information Security Continuous Monitoring</span>
        <span class="badge badge-forest">CDM = CISA's Continuous Diagnostics and Mitigation Program</span>
      </div>
    </div>
    `
  }
];

let current = 0;

function buildGrid(){
  const g = document.getElementById('dayGrid');
  g.innerHTML = '';
  for(let i = 0; i < days.length; i++){
    const b = document.createElement('button');
    b.className = 'day-pip' + (days[i].isCheatSheet ? ' cheat' : '') + (i === current ? ' active' : '');
    b.textContent = days[i].isCheatSheet ? 'CS' : (i + 1);
    b.title = days[i].title;
    b.onclick = (()=>{ const idx = i; return () => goTo(idx); })();
    g.appendChild(b);
  }
}

function goTo(idx){ current = idx; render(); }
function changeDay(dir){ current = Math.max(0, Math.min(days.length - 1, current + dir)); render(); }

function render(){
  const d = days[current];
  const total = days.length;
  document.getElementById('dayCounter').textContent = (current + 1) + ' / ' + total;
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === total - 1;
  document.getElementById('progBar').style.width = (((current + 1) / total) * 100) + '%';
  buildGrid();

  if(d.isCheatSheet){
    document.getElementById('lessonArea').innerHTML = `
      <div class="card">
        <div class="lesson-header">
          <div class="day-badge" style="background:#E1F5EE">
            <div class="day-num" style="color:#085041;font-size:14px">CHEAT</div>
            <div class="day-lbl" style="color:#0F6E56">SHEET</div>
          </div>
          <div class="lesson-meta">
            <h2>${d.title}</h2>
            <div class="tagline">${d.tagline}</div>
          </div>
        </div>
        <div class="lesson-body">${d.body}</div>
      </div>`;
    return;
  }

  const quizId = 'quiz_' + current;
  let quizHtml = '';
  if(d.quiz){
    const optsHtml = d.quiz.opts.map((o, i) =>
      `<button class="quiz-btn" onclick="checkAnswer(${i}, ${d.quiz.ans}, '${quizId}')">${o}</button>`
    ).join('');
    quizHtml = `<div class="quiz-box">
      <p>Quick check: ${d.quiz.q}</p>
      <div>${optsHtml}</div>
      <div class="answer-reveal" id="${quizId}"></div>
    </div>`;
  }

  document.getElementById('lessonArea').innerHTML = `
    <div class="card">
      <div class="lesson-header">
        <div class="day-badge">
          <div class="day-num">${current + 1}</div>
          <div class="day-lbl">Day</div>
        </div>
        <div class="lesson-meta">
          <h2>${d.title}</h2>
          <div class="tagline">${d.tagline}</div>
        </div>
      </div>
      <div class="section-label">Today's lesson</div>
      <div class="lesson-body">${d.body}</div>
      ${quizHtml}
    </div>`;
}

function checkAnswer(chosen, correct, qid){
  const el = document.getElementById(qid);
  const d = days[current];
  if(!d.quiz) return;
  const isRight = chosen === correct;
  el.innerHTML = `<strong>${isRight ? 'Correct!' : 'Not quite.'}</strong> ${d.quiz.explain}`;
  el.className = 'answer-reveal show';
  el.style.background = isRight ? '#EAF3DE' : '#FCEBEB';
  el.style.borderColor = isRight ? '#3B6D11' : '#A32D2D';
  el.style.color = '#1a1a18';
}

render();
</script>
