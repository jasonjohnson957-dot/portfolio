  {
    title: "The AI RMF Playbook",
    tagline: "Translating framework principles into concrete, actionable implementation steps",
    body: `<p>Alongside the AI RMF framework document, NIST published the <span class="key-term">AI RMF Playbook</span> — a companion resource that provides specific suggested actions for implementing each category and subcategory of the framework. If the AI RMF is the map, the Playbook is the turn-by-turn directions.</p>
    <div class="highlight-box">The AI RMF Playbook is available online at airc.nist.gov. It maps each framework category to: suggested actions organizations can take to implement that category, resources and references that support implementation, and connections to other relevant frameworks and standards. The Playbook is regularly updated as AI risk management practices evolve — it's a living resource, not a static document.</div>
    <p>How the Playbook works in practice:</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Suggested Actions</strong><span>For each framework category, the Playbook provides specific, concrete actions — not vague principles. For GOVERN's "organizational culture" category, suggested actions include: establish anonymous reporting channels for AI risk concerns, ensure incentive structures don't prioritize deployment speed over risk management, conduct regular leadership briefings on AI incidents across the industry.</span></div>
      <div class="cheat-pill"><strong>Framework Crosswalks</strong><span>The Playbook shows how AI RMF categories connect to other relevant standards and frameworks — ISO/IEC 42001, the EU AI Act, NIST CSF 2.0, NIST RMF. Organizations managing multiple compliance obligations can see where AI RMF activities satisfy requirements across multiple frameworks simultaneously.</span></div>
      <div class="cheat-pill"><strong>Profiles and Use Cases</strong><span>The Playbook includes example Profiles for specific use cases — generative AI, AI in healthcare, AI in hiring, AI in credit decisions. These profiles provide starting points for organizations in those contexts rather than requiring them to build from scratch.</span></div>
      <div class="cheat-pill"><strong>Notations on Challenges</strong><span>The Playbook is honest about implementation challenges — noting where suggested actions are difficult to operationalize, where the science is still developing, and where trade-offs between trustworthiness characteristics make perfect compliance impossible. This candor is more useful than false precision.</span></div>
    </div>
    <div class="info-box"><strong>The AI RMF's relationship to the NIST CSF Playbook:</strong> NIST maintains both an AI RMF Playbook and a CSF Reference Tool (for NIST CSF 2.0). The two are connected — the AI RMF Playbook includes mappings to CSF categories for shared topics like security, privacy, and organizational governance. Organizations using both frameworks can use these mappings to build integrated programs that satisfy both AI-specific and general cybersecurity requirements through unified processes.</div>
    <div class="analogy-box"><strong>The Playbook as a practical guide:</strong> The AI RMF document tells you that GOVERN requires "organizational culture" that supports AI risk awareness. The Playbook tells you specific things to do: conduct quarterly leadership briefings on AI incidents from across the industry; establish a psychological safety assessment mechanism so employees can honestly report AI risk concerns; ensure no employee's performance evaluation includes AI deployment speed as a standalone metric without corresponding risk management quality measures. The Playbook makes abstract governance requirements concrete enough to actually implement.</div>`,
    quiz: { q: "Why is the AI RMF Playbook published as a separate, regularly updated online resource rather than incorporated into the main AI RMF document?", opts: ["Because NIST had a word count limit for the main document", "Because specific implementation guidance evolves faster than the framework's core principles — as AI risk management practices mature, as new AI systems emerge, and as research advances, specific suggested actions need to be updated without requiring a full revision of the foundational framework", "Because the Playbook is classified as government sensitive information", "Because small organizations aren't allowed to use the main AI RMF document"], ans: 1, explain: "The Playbook's separate, dynamic format reflects an important design principle: core framework concepts (GOVERN, MAP, MEASURE, MANAGE and the trustworthy AI characteristics) should be stable enough to build programs around, while specific implementation guidance should evolve with the rapidly changing AI landscape. Publishing specific actions separately allows NIST to update guidance as new AI risk management methods develop, as new AI systems create new risks, and as regulations change — without requiring organizations to rebuild their entire AI governance program every time best practices are updated." }

  {
    title: "AI RMF Profiles — Customizing for Context",
    tagline: "How organizations translate the universal framework into their specific AI governance needs",
    body: `<p>Like NIST CSF 2.0, the NIST AI RMF uses <span class="key-term">Profiles</span> to bridge the gap between the universal framework and specific organizational contexts. A Profile documents how an organization applies the AI RMF's functions to a particular AI system or AI use case — capturing current state, target state, and the gaps that represent the risk management improvement roadmap.</p>
    <div class="highlight-box">The AI RMF defines two types of Profiles:<br><br><strong>Current Profile:</strong> Describes the AI risk management outcomes the organization is currently achieving for a specific AI system or context. An honest assessment of where the organization actually is — not where it aspires to be.<br><br><strong>Target Profile:</strong> Describes the AI risk management outcomes the organization aims to achieve, given its risk tolerance, resource constraints, and regulatory requirements. The gap between Current and Target drives the AI risk management improvement plan.</div>
    <p>Community Profiles for specific AI use cases:</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>What Community Profiles Are</strong><span>Sector-specific or use-case-specific profiles developed by industry groups, government agencies, or standards bodies that provide starting points for organizations in those contexts. Similar to the Community Profiles concept in NIST CSF 2.0 — reducing the burden of starting from scratch for every new AI system.</span></div>
      <div class="cheat-pill"><strong>Healthcare AI Profile</strong><span>A healthcare AI profile would incorporate: FDA regulatory requirements for AI/ML-based Software as a Medical Device (SaMD), HIPAA privacy requirements, clinical validation standards, patient safety considerations specific to medical AI, and the unique stakeholder relationships in healthcare (patients, clinicians, institutions).</span></div>
      <div class="cheat-pill"><strong>Hiring AI Profile</strong><span>A hiring AI profile would incorporate: EEOC guidance on AI in employment, adverse impact analysis requirements, documentation requirements for disparate impact analysis, human oversight requirements for AI-assisted hiring decisions, and candidate notification requirements where required by law.</span></div>
      <div class="cheat-pill"><strong>Generative AI Profile</strong><span>NIST published a specific Generative AI Profile (AI 600-1, 2024) addressing the unique risks of generative AI systems — including hallucination, synthetic content detection, CBRN information generation risk, and intellectual property concerns. We'll cover generative AI in depth on Day 25.</span></div>
    </div>
    <div class="analogy-box"><strong>Profiles as organizational navigation tools:</strong> If the AI RMF is a comprehensive map of AI risk management territory, a Profile is your personalized navigation for a specific journey. A healthcare organization's Profile for a medical imaging AI looks completely different from a retail company's Profile for a product recommendation AI — different risks, different regulatory requirements, different affected stakeholders, different appropriate risk tolerance levels. The Profile captures this context-specific customization while still using the framework's common language.</div>`,
    quiz: { q: "A bank is implementing an AI system for loan underwriting. Why would creating a Profile specifically for this AI system produce better risk management than applying the AI RMF generically?", opts: ["Profiles are required by banking regulations", "A loan underwriting Profile captures context-specific elements generic application misses: ECOA adverse action notice requirements, fair lending law constraints, specific fairness metrics required for lending decisions, the particular communities affected, regulatory examination expectations, and the specific types of bias most prevalent in historical lending data — all of which require different MAP, MEASURE, and MANAGE approaches than other AI contexts", "Profiles make the assessment process faster", "Generic AI RMF application is sufficient for all financial services AI"], ans: 1, explain: "A loan underwriting Profile captures the unique risk landscape of this specific context: legal requirements (ECOA adverse action notices, fair lending law, CRA), applicable fairness standards (the 80% rule from employment law applied to lending outcomes), the specific historical bias patterns in credit data (racial redlining's legacy effects), regulatory examination criteria from the OCC and CFPB, and the specific affected communities who face the highest risk from AI lending bias. Generic AI RMF application would miss these context-specific elements — a Profile ensures they're systematically addressed." }

  {
    title: "AI Bias and Fairness — A Deeper Look",
    tagline: "Understanding the complexity of algorithmic bias and the challenges of managing it",
    body: `<p>AI bias and fairness deserve their own deep-dive lesson because they are simultaneously the most discussed AI risk in public discourse and the most misunderstood in technical practice. Many organizations claim to manage AI bias without understanding what it is, how it arises, or why managing it is genuinely difficult. The AI RMF's MAP and MEASURE functions both require substantive engagement with these complexities.</p>
    <div class="highlight-box"><strong>What bias actually means in AI context:</strong> The AI RMF carefully distinguishes between types of bias. <strong>Statistical bias</strong> (systematic error in model predictions) is a technical property. <strong>Cognitive bias</strong> (systematic errors in human judgment) affects how AI is designed, evaluated, and used. <strong>Societal bias</strong> (systematic disadvantage to certain social groups) is what causes harm — and it can emerge from statistical bias, cognitive bias, or the interaction of both with social structures. Managing AI fairness requires understanding and addressing all three.</div>
    <p>The practical complexity of AI fairness:</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Fairness Can't Be Maximized Simultaneously</strong><span>Mathematical proofs show that many common fairness criteria are mutually incompatible. Calibration (confidence scores reflect actual probabilities), demographic parity (equal outcome rates), and equalized odds (equal error rates) cannot all be fully achieved simultaneously when base rates differ across groups. Choosing a fairness criterion is a values choice, not just a technical choice.</span></div>
      <div class="cheat-pill"><strong>Context Determines What "Fair" Means</strong><span>A hiring algorithm that produces equal acceptance rates regardless of qualifications isn't fair — it's quota-based. A hiring algorithm that accurately ranks candidates but has a disparate impact on protected groups may reflect real historical inequities in educational access that aren't the AI's fault to fix. What constitutes "fair" in context requires judgment, not just calculation.</span></div>
      <div class="cheat-pill"><strong>Debiasing Can Create New Bias</strong><span>Techniques that reduce one form of bias can create or amplify another. Removing a sensitive attribute from training data doesn't remove the attribute's influence if it's correlated with remaining features. Aggressive debiasing can reduce accuracy for majority groups while also reducing accuracy for minority groups in different ways.</span></div>
      <div class="cheat-pill"><strong>Feedback Loops Amplify Bias</strong><span>AI deployed in sequential decision-making creates feedback loops: biased AI decisions generate biased outcomes, which become biased data, which trains biased AI. Predictive policing AI that sends more police to minority neighborhoods generates more arrests in those neighborhoods, which "validates" the AI's predictions — not because crime is higher but because policing is more intense.</span></div>
    </div>
    <div class="analogy-box"><strong>Why fairness requires ongoing management:</strong> AI bias management is not a one-time intervention — it requires continuous monitoring and adjustment. Social structures, demographics, and the world change over time. An AI validated as fair in 2020 may produce unfair outcomes in 2024 as demographic patterns shift, as the economy changes, or as the communities served by the AI evolve. The AI RMF's MANAGE function's emphasis on continuous improvement directly addresses this dynamic nature of AI fairness.</div>`,
    quiz: { q: "An organization 'removes all sensitive attributes like race, gender, and age' from their AI training data and claims this makes the AI unbiased. Why is this claim problematic?", opts: ["Because sensitive attributes must be included in training data by law", "Because sensitive attributes are often correlated with seemingly neutral features — zip codes correlate with race due to historical segregation, names correlate with gender and ethnicity. Removing explicit sensitive attributes doesn't prevent the model from encoding their influence through correlated proxy variables, creating discrimination that is harder to detect and address.", "Because removing any features from training data always reduces accuracy", "Because bias only comes from including sensitive attributes, so removing them eliminates all bias"], ans: 1, explain: "This is one of the most important and commonly misunderstood points in AI fairness. Removing sensitive attributes doesn't remove their influence — it just makes the influence harder to detect. Zip codes encode race due to historical segregation patterns; first names encode gender and ethnicity; job titles encode gender; even driving record data can encode race (due to differential policing). These proxy variables let the model learn to discriminate without ever seeing the sensitive attribute directly. Fairness requires measuring outcomes by group, not just excluding sensitive features from input." }
  },
  {
    title: "AI Transparency and Explainability in Practice",
    tagline: "From theoretical principle to operational implementation",
    body: `<p>The AI RMF's explainability and transparency requirements are among the most practically challenging to implement — because the most accurate AI models are often the least explainable, and the most explainable models are often less accurate. Understanding this trade-off and how to navigate it is essential for anyone implementing the AI RMF's trustworthy AI standards.</p>
    <div class="highlight-box"><strong>The accuracy-explainability trade-off:</strong> Deep learning models (neural networks with many layers) are often the most accurate approach for complex AI tasks like image recognition, natural language processing, and medical diagnosis. But they are "black boxes" — their internal workings cannot be described in human-understandable terms. Simpler models (logistic regression, decision trees) are highly explainable but often less accurate. This creates a genuine tension: organizations frequently must choose between the most accurate model and the most explainable one.</div>
    <p>Practical approaches to explainability:</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Post-hoc Explanation Methods</strong><span>Techniques applied after model training to explain individual predictions without changing the model. LIME generates locally accurate explanations by fitting simpler models around individual predictions. SHAP assigns importance scores to each feature's contribution to a prediction. These allow black-box models to provide explanations without sacrificing accuracy.</span></div>
      <div class="cheat-pill"><strong>Inherently Interpretable Models</strong><span>Use model architectures that are explainable by design. Decision trees expose their logic through the tree structure. Linear models show feature weights directly. Rules-based systems produce explicit if-then logic. For some domains, these models are accurate enough — and the explainability benefit justifies modest accuracy trade-offs.</span></div>
      <div class="cheat-pill"><strong>Model Cards and Documentation</strong><span>Document model behavior, performance characteristics, and limitations in standardized formats (Model Cards). Model Cards describe: intended use, training data characteristics, performance metrics disaggregated by subgroup, limitations, and known failure modes. Documentation doesn't make the model interpretable but makes its overall behavior transparent.</span></div>
      <div class="cheat-pill"><strong>Explanation at the Right Level</strong><span>Match explanation depth to the stakeholder. Technical documentation for ML engineers assessing the model. Feature importance reports for data scientists auditing fairness. Human-readable explanations for affected individuals ("your application was affected primarily by credit utilization history and recent account openings"). One-size-fits-all explanations serve nobody well.</span></div>
    </div>
    <div class="analogy-box"><strong>Medical imaging AI and explainability:</strong> A radiologist reviewing an AI system that flags potential tumors needs an explanation to exercise clinical judgment: which features in the image drove the AI's assessment? Is it highlighting a suspicious mass or an artifact? Was it the density, shape, or margins that triggered the flag? NIST and the FDA both recognize that for clinical AI, explainability is not optional — it's a prerequisite for meaningful physician oversight and patient safety. Without it, the physician is rubber-stamping an AI they cannot evaluate.</div>`,
    quiz: { q: "A court system wants to use a highly accurate AI model for bail decisions but the model is a deep learning black box that can't explain individual decisions. Under the AI RMF's explainability requirements, what should they do?", opts: ["Use the model because accuracy is the most important property in justice contexts", "Evaluate options: (1) apply post-hoc explanation methods that provide defendant-appropriate explanations, (2) consider whether an inherently interpretable model provides acceptable accuracy, or (3) delay deployment until explainability can be achieved — given that criminal justice decisions must be explainable by due process principles, accuracy alone is not sufficient justification for deploying an unexplainable system", "Apply the model and provide statistical accuracy figures as the explanation", "Use the model only for minor offenses where accuracy matters less"], ans: 1, explain: "Criminal justice decisions are among the highest-stakes AI use cases precisely because they affect individual liberty. Due process principles — the constitutional right to understand and challenge adverse legal decisions — make explainability not just an AI governance best practice but a constitutional requirement. The AI RMF's explainability requirements align with these legal principles. The court should not deploy an unexplainable model for bail decisions regardless of accuracy, and should explore post-hoc explanation methods, inherently interpretable alternatives, or delay deployment until adequate explainability can be achieved." }
  },
  {
    title: "AI RMF and ISO/IEC 42001",
    tagline: "How the world's two leading AI governance frameworks complement each other",
    body: `<p>The NIST AI RMF and <span class="key-term">ISO/IEC 42001</span> (the international AI Management System standard, published December 2023) are the two most important AI governance frameworks globally. Understanding their relationship enables GRC professionals to build integrated AI governance programs that satisfy both simultaneously — and positions Jason's combined AI governance credentials (IAPP AIGP, ISACA AAIR, ISO 42001 Lead Auditor) as genuinely complementary.</p>
    <div class="highlight-box"><strong>Side-by-side comparison:</strong><br><br><strong>NIST AI RMF:</strong> US government voluntary framework. Risk management focus. Four functions (GOVERN, MAP, MEASURE, MANAGE). Not certifiable. Outcome-focused. Strong on trustworthy AI characteristics. Pairs naturally with NIST CSF 2.0 and other NIST publications.<br><br><strong>ISO/IEC 42001:</strong> International certifiable standard. Management system focus (PDCA cycle). Ten clauses + Annex A controls. Certifiable through accredited certification bodies. Process-focused. Pairs naturally with ISO 27001 and other ISO standards.</div>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Complementary Strengths</strong><span>AI RMF provides stronger guidance on specific AI risks (bias measurement methods, explainability approaches, fairness metrics). ISO 42001 provides a certifiable management system framework with Annex A controls that can satisfy regulatory "demonstrate compliance" requirements. Together they provide both practical guidance and certifiable assurance.</span></div>
      <div class="cheat-pill"><strong>Structural Alignment</strong><span>NIST AI RMF's GOVERN function maps to ISO 42001's leadership and organizational context clauses. MAP aligns with ISO 42001's risk assessment requirements. MEASURE aligns with ISO 42001's performance evaluation. MANAGE aligns with ISO 42001's improvement and operation clauses. Organizations familiar with one can navigate the other efficiently.</span></div>
      <div class="cheat-pill"><strong>ISO 42001 Annex A</strong><span>ISO 42001's Annex A provides 38 controls across 9 domains covering: AI policies, AI risk management, AI system lifecycle controls, data management, human oversight, transparency, and responsible AI principles. Many Annex A controls directly implement AI RMF categories — a mapping document is available from ISO/IEC.</span></div>
      <div class="cheat-pill"><strong>Integrated Program Design</strong><span>Organizations building an integrated AI governance program can use AI RMF as the risk identification and analysis methodology (MAP + MEASURE) and ISO 42001 as the management system framework (GOVERN + MANAGE + the certification pathway). The two frameworks address the same domain from different angles — risk-first (NIST) vs. management-system-first (ISO).</span></div>

    <div class="analogy-box"><strong>Why both matter for Jason's target roles:</strong> An AI Governance Program Manager role will need to: demonstrate AI risk competence (AI RMF), implement certifiable management systems (ISO 42001), satisfy regulatory requirements (EU AI Act), and communicate with global enterprise customers (ISO 42001 certification is the international recognition). Having deep knowledge of both frameworks — and how they integrate — is the professional differentiator between AI governance practitioners who can advise and those who can lead enterprise-scale AI governance programs.</div>`,
    quiz: { q: "An organization has ISO/IEC 42001 certification for their AI management system. Does this satisfy NIST AI RMF requirements, or vice versa?", opts: ["Yes — ISO 42001 certification automatically satisfies all AI RMF requirements", "No — they are separate frameworks serving different purposes. ISO 42001 certifies a management system exists; AI RMF provides risk management methodology. An organization using both has the strongest posture: AI RMF's practical risk guidance implemented within ISO 42001's certifiable management system structure.", "AI RMF replaces ISO 42001 for US organizations", "Only one framework is needed — using both is redundant"], ans: 1, explain: "ISO 42001 and the AI RMF are complementary, not equivalent. ISO 42001 certifies that an organization has a documented, systematically operated AI management system meeting the standard's requirements — this is valuable for demonstrating governance to regulators and customers. The AI RMF provides specific risk identification, measurement, and management methodology that may be more detailed than ISO 42001's principles-based controls. Using both creates the strongest posture: certifiable management system (ISO 42001) implementing AI-specific risk management methodology (AI RMF)." }

  {
    title: "AI RMF and NIST CSF 2.0 — Cybersecurity Meets AI Governance",
    tagline: "How the AI RMF extends cybersecurity into AI-specific territory",
    body: `<p>NIST designed the AI RMF to be explicitly complementary to NIST CSF 2.0 — not competing with it, not replacing it, but extending the cybersecurity risk management framework into the AI-specific territory that CSF was never designed to address. Understanding this relationship is essential for organizations using both frameworks simultaneously — which most sophisticated organizations in regulated industries will need to do.</p>
    <div class="highlight-box"><strong>The explicit design intent:</strong> NIST states in the AI RMF document that the framework is intended to be used alongside, not instead of, existing risk management frameworks. For organizations already implementing NIST CSF 2.0, the AI RMF adds AI-specific risk management capabilities to an existing enterprise risk management program rather than creating a parallel program.</div>
    <p>How the frameworks relate function by function:</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Both GOVERN Functions</strong><span>CSF 2.0's GOVERN and AI RMF's GOVERN address overlapping governance domains — risk strategy, roles, policies, supply chain. For organizations using both, a unified governance structure can address both cybersecurity and AI governance requirements, with AI-specific policies extending general cybersecurity governance policies.</span></div>
      <div class="cheat-pill"><strong>CSF IDENTIFY + AI RMF MAP</strong><span>CSF's IDENTIFY (asset inventory, risk assessment) and AI RMF's MAP (AI context, risk identification) are analogous functions. Organizations can maintain a unified asset inventory that includes AI systems as assets requiring both cybersecurity and AI-specific risk assessment.</span></div>
      <div class="cheat-pill"><strong>CSF PROTECT + AI RMF MAP/MEASURE</strong><span>CSF's PROTECT (security controls) addresses the security dimension of AI — protecting AI systems from unauthorized access, data breaches, and adversarial attacks. AI RMF's MAP and MEASURE address risks CSF doesn't cover — bias, explainability, fairness. Both are needed for AI systems.</span></div>
      <div class="cheat-pill"><strong>CSF DETECT/RESPOND + AI RMF MANAGE</strong><span>CSF's DETECT and RESPOND address security incident detection and response. AI RMF's MANAGE extends incident management to AI-specific incidents — model drift, fairness failures, unexpected AI behavior. A unified incident response capability can address both security events and AI governance events.</span></div>
    </div>
    <div class="analogy-box"><strong>The expansion analogy:</strong> Think of NIST CSF 2.0 as a comprehensive house security system — it covers locks, alarms, cameras, and monitoring. The NIST AI RMF is like adding smart home AI — new capabilities that require the same basic security protections the house security system provides, plus new risks (data privacy, algorithmic behavior) that the security system was never designed to address. The two systems work together: the security system protects the smart home devices; the smart home management system addresses the new risks that the security system doesn't cover.</div>`,
    quiz: { q: "An organization implements NIST CSF 2.0 comprehensively for their enterprise security program. Their security team argues they don't need the AI RMF because CSF already covers AI systems. Why is this argument flawed?", opts: ["Because NIST requires both frameworks to be used simultaneously", "Because NIST CSF 2.0 addresses cybersecurity risks for AI systems (unauthorized access, data breaches, availability) but does not address AI-specific risks that CSF was never designed for — bias in AI outputs, performance disparities across demographic groups, explainability failures, and AI lifecycle risks unique to how AI systems learn and change over time", "Because the AI RMF is newer and therefore more important than CSF", "Because CSF 2.0 explicitly excludes AI systems from its scope"], ans: 1, explain: "CSF 2.0's PROTECT function would help ensure an AI system's training data is protected from unauthorized access and that the AI model can't be stolen or tampered with. It would not detect that the AI model produces systematically higher false positive rates for elderly applicants (bias), cannot explain its decisions to affected individuals (explainability failure), or has performance that's degrading as the population it's serving shifts (model drift). These AI-specific risks require the AI RMF's MAP, MEASURE, and MANAGE functions — they're not addressed anywhere in CSF 2.0." }

  {
    title: "Generative AI and the NIST AI RMF",
    tagline: "Adapting the framework for the most transformative and risky AI development in decades",
    body: `<p><span class="key-term">Generative AI</span> — AI systems that can generate text, images, code, audio, and video — represents both the most significant AI capability advance and the most significant AI risk expansion in decades. NIST recognized that generative AI presents risks distinct enough to require dedicated guidance, publishing <span class="key-term">NIST AI 600-1</span> (the Generative AI Profile) in 2024 to supplement the main AI RMF.</p>
    <div class="gen-card"><b>What makes Generative AI risk different:</b><br><span style="font-size:12px;color:#1a1a18">Traditional AI classifies or predicts — it assigns inputs to categories. Generative AI creates — it produces novel outputs that didn't exist before. This generative capability introduces risks that classification AI doesn't have: it can generate false information that appears credible (hallucination), create non-consensual synthetic content, produce harmful instructions for dangerous activities, and generate content at scales and speeds impossible for humans to produce or monitor.</span></div>
    <p>NIST AI 600-1 identifies 12 key risks unique to or amplified in generative AI:</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Hallucination</strong><span>Generative AI produces confidently stated false information — fabricated citations, invented facts, incorrect code. Unlike classification AI that can be wrong, generative AI can be wrong in ways that appear authoritative and are difficult to detect without domain expertise.</span></div>
      <div class="cheat-pill"><strong>CBRN Information</strong><span>Generative AI can provide detailed information about chemical, biological, radiological, and nuclear weapons — information that would be blocked in other information sources. Managing CBRN risk requires specific content filtering that goes beyond general content moderation.</span></div>
      <div class="cheat-pill"><strong>Data Privacy</strong><span>Generative AI trained on vast data corpora may memorize and reproduce personal information from training data, generate realistic-seeming personal information about real individuals, or enable reconstruction of private information through targeted prompting.</span></div>
      <div class="cheat-pill"><strong>Harmful Bias Amplification</strong><span>Generative AI trained on internet text inherits human biases at scale. These biases can manifest in generated content — producing systematically biased descriptions, perpetuating stereotypes, or generating discriminatory content at massive scale and speed.</span></div>
      <div class="cheat-pill"><strong>Synthetic Content (Deepfakes)</strong><span>Generative AI enables creation of hyper-realistic synthetic images, audio, and video — enabling non-consensual intimate images, fraud through voice cloning, political manipulation through synthetic speech, and evidence fabrication. Detecting synthetic content is an arms race with generation capability.</span></div>
      <div class="cheat-pill"><strong>Intellectual Property</strong><span>Generative AI trained on copyrighted content may reproduce that content or create derivative works that raise intellectual property questions. The legal framework for AI-generated content and training data use is still evolving — creating significant compliance uncertainty.</span></div>
    </div>
    <div class="analogy-box"><strong>Why generative AI is categorically different:</strong> Traditional AI risk is primarily about wrong answers at scale. Generative AI risk is about creative harm at scale — fabricating reality, impersonating people, providing dangerous instructions, and producing content that undermines epistemics (the ability to distinguish truth from falsehood). The AI RMF's MAP function applied to generative AI must identify risks that don't exist for classification AI — including risks to democratic processes, epistemic integrity, and social trust that go beyond individual harm to collective harm.</div>`,
    quiz: { q: "A company deploys a generative AI chatbot for customer service. A customer asks the chatbot about drug interactions and the chatbot provides confidently worded but incorrect medical information that the customer follows, resulting in harm. Which generative AI risk category does this primarily represent?", opts: ["Intellectual property — the medical information belongs to someone", "Hallucination — the generative AI produced confidently stated false information in a high-stakes context where the false information caused harm. This also relates to CBRN-adjacent health safety risk and the broader risk of AI overconfidence in domains where accuracy is critical.", "Synthetic content — the chatbot created fake medical information", "Data privacy — the customer's health information was exposed"], ans: 1, explain: "This is a hallucination risk — generative AI stating false information confidently and convincingly in a context where false information causes direct harm. The risk is amplified in high-stakes domains (medical, legal, financial) where users may not have the expertise to detect AI errors and where the consequences of errors are severe. The AI RMF would have organizations MAP this risk (customers asking for medical advice), MEASURE it (evaluate how frequently the AI hallucinates in medical contexts), and MANAGE it (restrict medical advice, add disclaimers, require human review for medical queries, or not deploy the AI for this use case)." }
  },
  {
    title: "AI RMF in Regulated Industries",
    tagline: "How healthcare, financial services, and government apply the framework",
    body: `<p>The NIST AI RMF's voluntary nature means organizations apply it with varying urgency. But in regulated industries, AI governance frameworks connect directly to regulatory requirements — making AI RMF adoption not just good practice but increasingly a compliance expectation. Understanding these sector-specific connections positions the AI RMF within the broader regulatory landscape Jason navigates professionally.</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Healthcare — FDA and AI/ML SaMD</strong><span>The FDA regulates AI/ML-based Software as a Medical Device (SaMD) under its existing medical device authority. FDA's framework for AI/ML-based SaMD adopts concepts aligned with NIST AI RMF — particularly the focus on predetermined change control plans and post-market monitoring. Healthcare organizations using AI for clinical decision support must address AI RMF-aligned concerns for regulatory approval.</span></div>
      <div class="cheat-pill"><strong>Healthcare — VA Context</strong><span>The VA's adoption of AI in clinical decision support, benefits processing, and administrative automation creates AI governance obligations that map directly to AI RMF categories. AI systems affecting veterans' healthcare decisions or benefits must be assessed for bias (are outcomes equitable across demographics?), explainability (can VA staff explain AI recommendations to veterans?), and safety (do AI failures harm veterans?).</span></div>
      <div class="cheat-pill"><strong>Financial Services — OCC and CFPB</strong><span>The Office of the Comptroller of the Currency and Consumer Financial Protection Bureau have both issued guidance on AI in banking and consumer finance. Fair lending requirements, adverse action notice obligations, and model risk management guidance (SR 11-7) all create AI governance requirements that AI RMF's fairness and explainability characteristics directly address.</span></div>
      <div class="cheat-pill"><strong>Financial Services — Model Risk Management</strong><span>Federal Reserve SR 11-7 guidance on model risk management applies explicitly to AI/ML models in financial institutions. SR 11-7 requires model validation (comparable to AI RMF MEASURE), ongoing monitoring (comparable to AI RMF MANAGE monitoring), and governance (comparable to AI RMF GOVERN). Banks with mature SR 11-7 programs have a strong foundation for AI RMF implementation.</span></div>
      <div class="cheat-pill"><strong>Federal Government — EO 13960 and EO 14110</strong><span>Executive Order 13960 (2020) required federal agencies to promote trustworthy AI — directly spawning the AI RMF development. Executive Order 14110 (2023, Safe, Secure, and Trustworthy AI) directed agencies to adopt AI safety and security standards aligned with NIST guidance. Federal agencies are the most directly obligated AI RMF adopters in the US.</span></div>
      <div class="cheat-pill"><strong>EU AI Act Connection</strong><span>The EU AI Act (effective 2024-2026 phased) requires risk-based AI governance for AI systems deployed in the EU. While the EU AI Act and NIST AI RMF use different frameworks, their risk-based approaches are conceptually aligned. Organizations satisfying EU AI Act requirements for high-risk AI systems will find substantial overlap with AI RMF GOVERN, MAP, MEASURE, and MANAGE requirements.</span></div>
    </div>
    <div class="highlight-box"><strong>The regulatory convergence trend:</strong> Globally, AI regulation is converging around the same core concepts that the NIST AI RMF addresses: risk-based governance proportionate to AI system impact, transparency and explainability for consequential decisions, fairness monitoring, human oversight requirements, and incident response. Organizations implementing the AI RMF now are building the governance foundation that will satisfy multiple regulatory frameworks as they come into force.</div>`,
    quiz: { q: "The VA develops an AI system that predicts which veterans are at highest risk for suicide and flags them for outreach. Under AI RMF, why would this system require particularly rigorous GOVERN, MAP, MEASURE, and MANAGE processes?", opts: ["Because VA systems always require maximum rigor regardless of function", "Because this system involves the highest-stakes possible AI application — decisions potentially affecting life and death require the most rigorous risk management across all four functions: governance ensuring human oversight, MAP identifying risks to veteran dignity and privacy, MEASURE validating fairness across demographic subgroups (veteran demographics vary significantly), and MANAGE establishing robust monitoring and incident response", "Because the system involves personal data", "Because AI is not appropriate for mental health applications"], ans: 1, explain: "A veteran suicide risk prediction AI is among the highest-stakes possible AI applications — false negatives (missing high-risk veterans) could contribute to preventable deaths, while false positives (incorrectly flagging low-risk veterans) could stigmatize and harm veterans who don't need intervention. The AI RMF's risk-proportionate approach would require maximum rigor: GOVERN establishing clear human oversight (AI identifies; humans decide and intervene), MAP identifying risks to veteran dignity, privacy, and demographic equity (are prediction rates equitable across race, gender, age?), MEASURE validating performance across all relevant subgroups, and MANAGE establishing monitoring, incident response, and continuous improvement protocols." }

  {
    title: "AI RMF and the EU AI Act",
    tagline: "How the US voluntary framework and European mandatory law address the same risks",
    body: `<p>The <span class="key-term">EU AI Act</span> (which we studied earlier in this series) and the <span class="key-term">NIST AI RMF</span> are the two most significant AI governance frameworks globally. Both emerged from the same recognition — AI presents novel risks requiring systematic governance — but they reflect different regulatory philosophies: the EU's mandatory, rights-based approach versus the US's voluntary, risk-management approach. Understanding their alignment and differences is essential for organizations operating in both markets.</p>
    <div class="highlight-box"><strong>Conceptual alignment:</strong> Both frameworks use risk-based approaches — governance proportionate to the risk level of the AI application. Both require transparency, explainability, fairness, and human oversight for high-risk AI. Both address the AI lifecycle rather than just deployment. Both require documentation of AI system characteristics and risk management measures. The conceptual alignment means organizations implementing one framework are well-positioned to satisfy the other.</div>
    <p>Key differences between the frameworks:</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Mandatory vs. Voluntary</strong><span>EU AI Act is mandatory for covered AI systems deployed in the EU — non-compliance carries fines up to €35 million or 7% of global turnover. NIST AI RMF is voluntary — no direct penalties for non-adoption, though regulatory expectations increasingly reference it. The AI Act creates legal obligations; the AI RMF creates governance best practices.</span></div>
      <div class="cheat-pill"><strong>Prescriptive vs. Outcome-Based</strong><span>EU AI Act specifies specific requirements for high-risk AI systems (conformity assessment, CE marking, technical documentation). NIST AI RMF describes outcomes to achieve without specifying how. Organizations that must meet EU AI Act requirements will need to translate AI RMF's outcome-based guidance into the EU Act's specific prescriptive requirements.</span></div>
      <div class="cheat-pill"><strong>Prohibited Uses</strong><span>EU AI Act explicitly prohibits certain AI applications (social scoring, biometric mass surveillance, subliminal manipulation). NIST AI RMF does not identify prohibited applications — it's a risk management framework, not a regulatory prohibition regime. For organizations subject to EU AI Act, prohibited use categories must be respected regardless of NIST guidance.</span></div>
      <div class="cheat-pill"><strong>Third-Party Conformity Assessment</strong><span>EU AI Act requires independent conformity assessment for high-risk AI systems — similar to ISO 27001's certification model. NIST AI RMF has no equivalent certification or conformity assessment requirement. The EU Act's conformity assessment requirement provides external assurance that the AI RMF's internal risk management processes cannot provide.</span></div>
    </div>
    <div class="analogy-box"><strong>Practical integration for global organizations:</strong> A US tech company deploying AI in both US and EU markets needs: AI RMF implementation for US regulatory expectations and governance best practices, EU AI Act compliance for EU market access (mandatory). The good news: EU AI Act high-risk AI requirements map substantially onto AI RMF GOVERN, MAP, MEASURE, and MANAGE outcomes. Organizations can design AI governance programs that satisfy both simultaneously — using AI RMF as the internal methodology and EU AI Act requirements as the external conformity standard.</div>`,
    quiz: { q: "A US company deploys a recruitment AI in both the US and EU. In the US, they use NIST AI RMF. In the EU, they must comply with the EU AI Act. Which statement best describes their compliance posture?", opts: ["They must build completely separate AI governance programs for each jurisdiction", "AI RMF implementation provides a strong governance foundation that addresses many EU AI Act high-risk AI requirements, but EU AI Act compliance additionally requires: prohibited use screening, formal conformity assessment, CE marking, mandatory registration, and specific technical documentation not required by the voluntary AI RMF", "EU AI Act compliance automatically satisfies all AI RMF requirements", "The AI RMF is sufficient for EU AI Act compliance because both are risk-based frameworks"], ans: 1, explain: "AI RMF and EU AI Act are complementary but not equivalent. The AI RMF's GOVERN, MAP, MEASURE, and MANAGE activities address many of the same substantive concerns as the EU AI Act (bias, explainability, fairness, human oversight) — so AI RMF-implementing organizations have strong EU Act compliance foundations. But the EU Act additionally requires: checking whether the AI system is in the prohibited category, conducting formal conformity assessment, affixing CE marking, registering in the EU AI database, and producing specific technical documentation in the format the EU Act prescribes. These procedural requirements go beyond what AI RMF's outcome-based guidance requires." }

  {
    title: "Building an AI Risk Management Program",
    tagline: "A practical roadmap for implementing AI RMF from the ground up",
    body: `<p>Understanding AI RMF concepts is the starting point. Building an actual AI risk management program — one that genuinely manages AI risk rather than creating governance theater — is the goal. Here's what a practical, phased AI RMF implementation looks like for an organization serious about managing AI risk effectively.</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Phase 1: Establish GOVERN Foundations</strong><span>Before assessing any AI system: designate AI governance roles (AI Risk Officer, AI Ethics Committee), establish organizational risk tolerance for AI explicitly in policy, document the process for AI deployment decisions, create feedback channels for AI risk concerns, and conduct leadership briefings on AI risk. GOVERN without these foundations is aspirational.</span></div>
      <div class="cheat-pill"><strong>Phase 2: Build AI System Inventory</strong><span>Identify every AI system the organization uses — whether built internally or procured from vendors. This inventory surprises most organizations: AI is embedded in HR tools, marketing platforms, customer service systems, and procurement tools that were acquired without explicit AI governance review. You can't manage what you haven't inventoried.</span></div>
      <div class="cheat-pill"><strong>Phase 3: Risk-Tier the Portfolio</strong><span>Not all AI systems require equal governance rigor. Classify the AI inventory by impact level — high-stakes AI affecting consequential decisions (hiring, lending, healthcare, benefits) vs. lower-stakes AI (product recommendations, content curation). Apply AI RMF rigor proportionate to impact level — the most intensive MAP, MEASURE, and MANAGE work for the highest-stakes AI.</span></div>
      <div class="cheat-pill"><strong>Phase 4: MAP High-Priority Systems</strong><span>For the highest-risk AI systems, conduct thorough MAP assessments: establish context (who uses it, what decisions does it inform, who is affected?), identify all AI risk categories present, catalog affected stakeholder groups, and document third-party AI components and their associated risks.</span></div>
      <div class="cheat-pill"><strong>Phase 5: MEASURE Identified Risks</strong><span>Apply appropriate measurement methods to identified risks: disaggregated performance evaluation across relevant subgroups, fairness metric assessment, robustness testing, explainability evaluation, and privacy impact assessment. Document all findings in the format stakeholders need to make informed decisions.</span></div>
      <div class="cheat-pill"><strong>Phase 6: MANAGE Prioritized Risks</strong><span>Develop and implement risk treatment plans for findings that exceed risk tolerance. Establish ongoing monitoring with specific thresholds that trigger review. Create AI incident response capability. Document residual risks and the governance decision to accept them. Build continuous improvement into the program from the start.</span></div>
      <div class="cheat-pill"><strong>Phase 7: Integrate with Existing Programs</strong><span>Connect the AI risk management program to existing NIST CSF 2.0, NIST RMF, ISO 27001, or other security/risk management programs. AI systems are also information systems — they need cybersecurity governance in addition to AI-specific governance. Integrated programs reduce duplication and create coherent risk management across all organizational technology risk.</span></div>
      <div class="cheat-pill"><strong>Phase 8: Measure and Improve Continuously</strong><span>Track program effectiveness metrics: percentage of AI systems inventoried, percentage of high-risk AI with completed MAP assessments, number of fairness issues identified and remediated, time from monitoring alert to risk response. AI risk management should improve with each AI deployment — learning from each experience to do the next one better.</span></div>
    </div>
    <div class="highlight-box"><strong>The most common AI RMF implementation failure:</strong> Focusing AI governance exclusively on AI systems the organization built itself while ignoring procured AI tools. Most organizations use far more AI they bought than AI they built. A recruiter using AI-powered resume screening from a vendor, a marketer using AI-generated content tools, a finance team using AI-driven forecasting software — all present AI governance risks that most "AI governance programs" never address because they focus only on internally developed AI. The AI RMF's third-party AI (GV-6) and MAP categories require extending AI governance to procured AI.</div>`,
    quiz: { q: "An organization builds a comprehensive AI governance program for its internally developed AI systems but doesn't apply AI RMF to the 15 AI-powered SaaS tools its employees use daily. What AI risk does this create?", opts: ["No significant risk — vendor AI is the vendor's responsibility", "Significant risk — AI risks from procured tools (bias in vendor hiring AI, hallucinations in vendor content AI, privacy risks from vendor AI training data) affect the organization and its stakeholders regardless of whether the AI was built internally or procured. AI RMF explicitly addresses third-party AI in GV-6 and MAP's third-party risk categories.", "Only security risk — not AI governance risk", "This is acceptable because smaller organizations can't assess vendor AI"], ans: 1, explain: "Organizations bear responsibility for the AI they deploy regardless of who built it. A biased hiring AI tool procured from a vendor creates the same legal exposure, the same harm to affected candidates, and the same governance failure as a biased internally-built hiring tool. AI RMF's GV-6 (policies for third-party AI) and MAP's third-party risk categories require organizations to extend AI governance to procured AI — evaluating vendor AI systems' documentation, assessing risks, and establishing appropriate use policies and monitoring." }

let current = 0;

function buildGrid(){
  const g = document.getElementById('dayGrid');
  g.innerHTML = '';
  for(let i = 0; i < days.length; i++){
    const b = document.createElement('button');
    b.className = 'day-pip' + (days[i].isCheatSheet ? ' cheat' : '') + (i === current ? ' active' : '');
    b.textContent = days[i].isCheatSheet ? 'CS' : (i + 1);
    b.title = days[i].title;
    b.onclick = (()=>{ const idx = i; return () => goTo(idx); })();
    g.appendChild(b);
  }
}

function goTo(idx){ current = idx; render(); }
function changeDay(dir){ current = Math.max(0, Math.min(days.length - 1, current + dir)); render(); }

function render(){
  const d = days[current];
  const total = days.length;
  document.getElementById('dayCounter').textContent = (current + 1) + ' / ' + total;
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === total - 1;
  document.getElementById('progBar').style.width = (((current + 1) / total) * 100) + '%';
  buildGrid();

  if(d.isCheatSheet){
    document.getElementById('lessonArea').innerHTML = `
      <div class="card">
        <div class="lesson-header">
          <div class="day-badge" style="background:#E1F5EE">
            <div class="day-num" style="color:#085041;font-size:14px">CHEAT</div>
            <div class="day-lbl" style="color:#0F6E56">SHEET</div>
          </div>
          <div class="lesson-meta">
            <h2>${d.title}</h2>
            <div class="tagline">${d.tagline}</div>
          </div>
        </div>
        <div class="lesson-body">${d.body}</div>
      </div>`;
    return;
  }

  const quizId = 'quiz_' + current;
  let quizHtml = '';
  if(d.quiz){
    const optsHtml = d.quiz.opts.map((o, i) =>
      `<button class="quiz-btn" onclick="checkAnswer(${i}, ${d.quiz.ans}, '${quizId}')">${o}</button>`
    ).join('');
    quizHtml = `<div class="quiz-box">
      <p>Quick check: ${d.quiz.q}</p>
      <div>${optsHtml}</div>
      <div class="answer-reveal" id="${quizId}"></div>
    </div>`;
  }

  document.getElementById('lessonArea').innerHTML = `
    <div class="card">
      <div class="lesson-header">
        <div class="day-badge">
          <div class="day-num">${current + 1}</div>
          <div class="day-lbl">Day</div>
        </div>
        <div class="lesson-meta">
          <h2>${d.title}</h2>
          <div class="tagline">${d.tagline}</div>
        </div>
      </div>
      <div class="section-label">Today's lesson</div>
      <div class="lesson-body">${d.body}</div>
      ${quizHtml}
    </div>`;
}

function checkAnswer(chosen, correct, qid){
  const el = document.getElementById(qid);
  const d = days[current];
  if(!d.quiz) return;
  const isRight = chosen === correct;
  el.innerHTML = `<strong>${isRight ? 'Correct!' : 'Not quite.'}</strong> ${d.quiz.explain}`;
  el.className = 'answer-reveal show';
  el.style.background = isRight ? '#EAF3DE' : '#FCEBEB';
  el.style.borderColor = isRight ? '#3B6D11' : '#A32D2D';
  el.style.color = '#1a1a18';
}

render();
</script>
