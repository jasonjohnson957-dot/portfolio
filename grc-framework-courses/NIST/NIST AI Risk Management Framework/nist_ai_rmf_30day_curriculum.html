<div class="wrap">
  <h2 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">30-day NIST AI RMF curriculum for high school students with daily lessons and a final cheat sheet</h2>
  <div class="top-bar">
    <div class="title-block">
      <h1>NIST AI RMF — 30-Day Classroom Guide</h1>
      <p>Taught for high school freshmen by a 20-year GRC veteran</p>
    </div>
    <div class="nav-row">
      <button id="prevBtn" onclick="changeDay(-1)">&#8592; Prev</button>
      <span id="dayCounter" style="font-size:13px;color:#6b6b68;min-width:60px;text-align:center"></span>

    </div>
  </div>

  <div class="day-grid" id="dayGrid"></div>

<script>
const days = [
  {
    title: "What Is the NIST AI Risk Management Framework?",
    tagline: "A voluntary blueprint for building, deploying, and governing trustworthy AI",
    body: `<p>Imagine a hospital deploys an AI system that reviews medical images and flags potential cancers for radiologist review. The AI is accurate 94% of the time — but it performs significantly worse on images from older X-ray machines, which are common in rural hospitals. Patients in those communities get worse AI-assisted diagnoses without anyone knowing the system has a hidden performance gap. Who is responsible? Who knew about the risk? What should have been done differently? These are precisely the questions the <span class="key-term">NIST AI Risk Management Framework</span> was built to answer.</p>
    <p>The NIST AI RMF is a voluntary framework published by the <strong>National Institute of Standards and Technology</strong> in <strong>January 2023</strong> (NIST AI 100-1). It provides organizations with a structured approach for identifying, assessing, and managing the risks that arise from AI systems — throughout the entire AI lifecycle, from design through deployment and retirement. Unlike cybersecurity risk frameworks, the AI RMF addresses a broader category of AI-specific risks: not just security breaches, but also performance failures, bias and unfairness, lack of explainability, privacy violations, and harmful societal impacts.</p>
    <div class="analogy-box"><strong>Real-world analogy:</strong> Think of the NIST AI RMF like the FDA's process for approving medical devices. Before a new surgical robot can be used on patients, it must demonstrate safety, efficacy, and performance across diverse patient populations. The manufacturer must document risks, test extensively, and establish monitoring for post-deployment problems. The AI RMF applies similar rigor to AI systems — requiring organizations to systematically think through risks before deployment and maintain vigilance afterward, not just celebrate accuracy rates in optimal conditions.</div>
    <div class="highlight-box">Key facts about NIST AI RMF: Published January 2023 (NIST AI 100-1). Voluntary — not legally required, though increasingly referenced in regulations. Four core functions: GOVERN, MAP, MEASURE, MANAGE. Seven characteristics of trustworthy AI: Valid, Reliable, Safe, Secure, Explainable, Privacy-Enhanced, Fair. Complementary to NIST CSF 2.0 and NIST RMF. Free — publicly available at nist.gov. Foundational reference for US AI governance policy and international standards development.</div>`,
    quiz: { q: "What distinguishes the NIST AI RMF from the NIST Cybersecurity Framework (CSF 2.0)?", opts: ["The AI RMF is legally mandatory; CSF 2.0 is voluntary", "The AI RMF addresses risks specific to AI systems — including performance failures, bias, lack of explainability, and societal impacts — while CSF 2.0 focuses on cybersecurity risk. Both are voluntary; the AI RMF extends risk management into AI-specific territory that CSF doesn't cover.", "The AI RMF replaces CSF 2.0 for organizations using AI", "There is no meaningful distinction — they cover the same risks"], ans: 1, explain: "The AI RMF addresses risks that are unique to AI systems and not covered by cybersecurity frameworks. While CSF 2.0 addresses unauthorized access, data breaches, and system availability, the AI RMF additionally addresses: AI performing poorly for specific demographic groups (bias/fairness), AI making decisions that can't be explained (explainability), AI systems failing in unexpected ways (reliability), and unintended societal harms from AI deployment. Both frameworks are voluntary and complementary." }
  },
  {
    title: "Why Was the AI RMF Created?",
    tagline: "The AI harms and governance vacuum that demanded a structured response",
    body: `<p>By the early 2020s, AI systems were being deployed at massive scale across healthcare, hiring, criminal justice, financial services, and government — with dramatic real-world consequences for people's lives. And the governance frameworks that existed for managing technology risk were simply not designed to handle AI's distinctive characteristics. The NIST AI RMF emerged from this governance gap.</p>
    <div class="highlight-box"><strong>The documented AI harm problem:</strong> Research and reporting documented systematic AI failures with serious consequences: facial recognition systems with dramatically higher error rates for darker-skinned faces (affecting law enforcement decisions), hiring algorithms that penalized resumes containing words like "women's" (gender bias from training data), medical AI systems trained on data from wealthy urban hospitals that performed poorly in rural or underserved settings, and credit scoring algorithms with disparate impacts on minority communities. These weren't theoretical risks — they were affecting real people across documented, real deployments.</div>
    <p>Several converging forces created the need for a structured AI risk framework:</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>AI-Specific Risks</strong><span>Traditional risk frameworks address well-understood risks. AI introduces novel risks — models can be biased, unexplainable, brittle in new contexts, or capable of harm at scales impossible with human decision-making. Existing frameworks didn't have vocabulary or methods for these risks.</span></div>
      <div class="cheat-pill"><strong>Executive Order 13960 (2020)</strong><span>Required federal agencies to promote trustworthy AI in their use and procurement of AI applications. Directed NIST to develop AI standards and frameworks. This EO directly initiated the AI RMF development process that produced the 2023 publication.</span></div>
      <div class="cheat-pill"><strong>Industry Need</strong><span>Organizations deploying AI wanted a credible, government-backed framework for demonstrating responsible AI practices to regulators, the public, and customers. A voluntary framework from a trusted source provided the basis for industry governance without waiting for regulation.</span></div>
      <div class="cheat-pill"><strong>International Context</strong><span>The EU AI Act was developing in parallel, establishing mandatory AI risk requirements for EU markets. The US needed a comparable voluntary framework to inform domestic policy and coordinate with international approaches — preventing regulatory fragmentation in global AI markets.</span></div>
    </div>
    <div class="analogy-box"><strong>The hiring algorithm case:</strong> Amazon developed an AI recruitment tool trained on 10 years of resumes. Because the historical resumes came from a predominantly male workforce, the algorithm learned to penalize resumes that contained the word "women's" (as in "women's chess club captain"). The tool was systematically disadvantaging female applicants without human reviewers knowing — until researchers discovered the pattern. Amazon scrapped the tool. This case exemplifies why AI-specific governance is necessary: risks that traditional security or compliance frameworks would never flag can emerge from how AI learns from historical data.</div>`,
    quiz: { q: "Why couldn't traditional cybersecurity frameworks like NIST CSF adequately address the risks of AI systems?", opts: ["Traditional frameworks are too expensive for AI companies", "Traditional frameworks were designed for well-understood technology risks and lacked vocabulary and methods for AI-specific risks like bias from training data, performance disparities across demographic groups, and opaque decision-making", "Traditional frameworks don't apply to software systems", "AI systems have no cybersecurity risks that require framework guidance"], ans: 1, explain: "Traditional cybersecurity frameworks focus on preventing unauthorized access, data breaches, and system unavailability. They have no provisions for evaluating whether an AI model produces systematically biased outputs for certain demographic groups, whether an AI decision-making process can be explained to affected individuals, or whether an AI system's training data reflects historical inequities. These AI-specific risks require new vocabulary, methods, and governance structures — which is why NIST developed a dedicated AI RMF." }
  },
  {
    title: "What Makes AI Risk Different?",
    tagline: "Why AI requires its own risk framework — not just an extension of existing ones",
    body: `<p>Before diving into the framework's structure, it's essential to understand <span class="key-term">what makes AI risk genuinely different</span> from conventional software risk. This isn't just about AI being more sophisticated software — it's about fundamental characteristics of how AI systems are built and behave that create risks that don't exist in traditional software development.</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>AI Learns from Data</strong><span>Traditional software follows explicit rules written by humans. AI models learn patterns from training data. If that data reflects historical inequities, the AI learns those inequities. A loan approval AI trained on historical decisions that discriminated against minorities will learn to discriminate — not because anyone programmed discrimination, but because the data embodied it.</span></div>
      <div class="cheat-pill"><strong>AI Is Opaque</strong><span>Traditional software is deterministic — you can trace exactly why it produced a given output. Many AI systems, especially deep learning models, are "black boxes" — they produce outputs through processes that even their creators cannot fully explain. This opacity creates accountability challenges: "the AI decided" is not an adequate explanation for a loan denial or parole decision.</span></div>
      <div class="cheat-pill"><strong>AI Performance Varies Across Contexts</strong><span>A traditional program either works or it doesn't. AI systems can work well on average while performing poorly for specific subgroups. A medical AI with 95% overall accuracy might have 70% accuracy for elderly patients if they were underrepresented in training data. Average metrics hide critical distribution failures.</span></div>
      <div class="cheat-pill"><strong>AI Can Fail in Novel Ways</strong><span>Traditional software fails when encountering bugs. AI can fail when encountering inputs slightly outside its training distribution — even when those inputs look normal to humans. Autonomous vehicle AI trained in sunny California may fail in Midwest winter conditions without any "bug" in the traditional sense.</span></div>
      <div class="cheat-pill"><strong>AI Risk Scales with Deployment</strong><span>A biased human decision-maker affects a limited number of cases. A biased AI deployed at scale can affect millions of decisions per day with identical bias. The same flaw that would be a minor issue in human decision-making becomes a systemic problem when AI makes thousands of decisions per second.</span></div>
      <div class="cheat-pill"><strong>AI Risk Evolves After Deployment</strong><span>Traditional software risk is largely fixed at deployment. AI risk can change as the world changes — if the environment the AI operates in shifts away from its training conditions, performance can degrade without any code changes. Monitoring deployed AI is qualitatively different from monitoring traditional software.</span></div>
    </div>
    <div class="highlight-box">These distinctive characteristics mean AI risk requires its own framework — not just an AI chapter in an existing one. The NIST AI RMF was designed specifically around these properties: its four functions (GOVERN, MAP, MEASURE, MANAGE) create a structured process for addressing risks that emerge from how AI learns, decides, and changes over time in ways that traditional software simply doesn't.</div>`,
    quiz: { q: "An AI hiring system shows 92% overall accuracy but only 71% accuracy for applicants over age 55. Why is overall accuracy an inadequate risk measure for this AI?", opts: ["Because 92% accuracy is too low for any professional application", "Because aggregate metrics hide subgroup performance disparities — the 71% accuracy for older applicants reveals systematic discrimination that could harm a protected class and expose the organization to legal liability, even though the overall metric looks acceptable", "Because accuracy is not the right metric for hiring decisions", "Because the AI should not be used for hiring at all"], ans: 1, explain: "Overall accuracy metrics can mask critical performance disparities across demographic subgroups — a core AI risk insight embedded in the NIST AI RMF. An AI that performs well on average but poorly for specific groups (older workers, women, racial minorities) embeds systematic discrimination that aggregate statistics obscure. The AI RMF's emphasis on measuring performance disaggregated by relevant subgroups directly addresses this risk, which traditional software risk frameworks never considered." }
  },
  {
    title: "The AI RMF Core Structure",
    tagline: "Four functions, subcategories, and how the framework is organized",
    body: `<p>The <span class="key-term">NIST AI RMF</span> is organized around four core functions that together constitute a comprehensive approach to AI risk management. Understanding the framework's structure before exploring each function individually makes navigating it much more intuitive.</p>
    <div class="highlight-box">The AI RMF has two main components:<br><br><strong>Part 1 — Framing Risk:</strong> Discusses the nature of AI risk, how AI characteristics create distinctive risks, and the foundational concepts of trustworthy AI. This is the conceptual foundation — the "why" and "what" of AI risk.<br><br><strong>Part 2 — Core and Profiles:</strong> Contains the four functions (GOVERN, MAP, MEASURE, MANAGE), their categories and subcategories, and guidance on using Profiles to customize the framework for specific contexts. This is the operational heart — the "how to" of AI risk management.</div>
    <div class="fn-govern"><b>GOVERN — The foundational function</b><br><span style="font-size:12px;color:#1a1a18">Establishes the organizational culture, policies, processes, and accountability structures that make all other AI risk management activities coherent. Placed first because governance precedes and enables everything else.</span></div>
    <div class="fn-map"><b>MAP — Context and risk identification</b><br><span style="font-size:12px;color:#1a1a18">Identifies the context in which an AI system operates, categorizes AI risks based on that context, and understands the potential impacts on stakeholders. Analogous to risk identification in traditional frameworks.</span></div>
    <div class="fn-measure"><b>MEASURE — Risk analysis and evaluation</b><br><span style="font-size:12px;color:#1a1a18">Analyzes and assesses identified AI risks through systematic methods, evaluation tools, and metrics. Determines the severity and likelihood of risks and evaluates the trustworthiness characteristics of the AI system.</span></div>
    <div class="fn-manage"><b>MANAGE — Risk response and treatment</b><br><span style="font-size:12px;color:#1a1a18">Allocates resources for risk treatment, develops response plans, and implements risk mitigation strategies. Includes both proactive risk reduction and reactive incident response for AI-related harms.</span></div>
    <div class="analogy-box"><strong>The GOVERN-MAP-MEASURE-MANAGE cycle:</strong> GOVERN sets the strategy and accountability structures. MAP identifies the specific AI system's context and risks. MEASURE evaluates how severe and likely those risks are. MANAGE decides what to do about them. Then the cycle repeats — as the AI is deployed, monitored, and the environment changes, MAP identifies new risks, MEASURE evaluates them, and MANAGE responds. GOVERN continuously shapes all of this. It's a continuous improvement cycle, not a one-time process.</div>`,
    quiz: { q: "In what order do the four AI RMF functions operate in practice?", opts: ["MAP → MEASURE → MANAGE → GOVERN (governance comes last as a summary)", "GOVERN establishes the organizational foundation; then MAP, MEASURE, and MANAGE form a continuous cycle applied to specific AI systems throughout their lifecycle", "All four functions operate independently and in parallel with no specified order", "MANAGE → GOVERN → MAP → MEASURE (manage first, then govern)"], ans: 1, explain: "GOVERN is established first as the organizational foundation — it creates the policies, roles, culture, and risk strategy that shape how the other functions operate. MAP, MEASURE, and MANAGE then form a continuous cycle: MAP identifies risks in the AI system's context, MEASURE analyzes and evaluates those risks, and MANAGE responds to them. This cycle repeats throughout the AI lifecycle, with GOVERN continuously guiding all activities." }
  },
  {
    title: "GOVERN — Building the AI Risk Management Foundation",
    tagline: "Culture, policies, accountability, and the organizational capacity to manage AI risk",
    body: `<p><span class="key-term">GOVERN</span> is the function that determines whether an organization is actually capable of managing AI risk — or just going through the motions. It addresses the organizational culture, leadership commitment, accountability structures, policies, and processes that must exist before meaningful AI risk management is possible. Without GOVERN, MAP, MEASURE, and MANAGE produce paperwork rather than genuine risk reduction.</p>
    <div class="fn-govern"><b>GV — GOVERN: Policies, processes, procedures, and practices across the organization related to the mapping, measuring, and managing of AI risks are in place, transparent, and implemented effectively.</b></div>
    <p>GOVERN's key categories address:</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>GV-1: AI Risk Management Policy</strong><span>Organizational policies exist for managing AI risks across the AI lifecycle. Policies specify accountability, decision-making authority, and processes for identifying and managing AI risks. Not generic security policy extended to AI — AI-specific governance policy.</span></div>
      <div class="cheat-pill"><strong>GV-2: AI Risk Accountability</strong><span>Organizational roles and responsibilities for AI risk management are documented and in place. Clear accountability for AI risk decisions — who decides what, who is responsible when AI harms occur, who escalates risks that exceed defined tolerances.</span></div>
      <div class="cheat-pill"><strong>GV-3: Organizational Culture</strong><span>Organizational culture promotes an AI risk-aware workforce. Leaders model risk-aware behavior. Employees can raise AI risk concerns without fear. Incentives don't reward AI deployment speed at the expense of risk management quality.</span></div>
      <div class="cheat-pill"><strong>GV-4: Organizational Teams and Expertise</strong><span>Policies and processes exist for encouraging teams with diverse expertise and perspectives to be engaged throughout the AI lifecycle. Diverse teams (technical, domain, ethics, legal) produce more comprehensive risk identification than homogeneous teams.</span></div>
      <div class="cheat-pill"><strong>GV-5: AI Risk Policies for Deployment</strong><span>Policies and procedures are in place for deploying AI in a manner that is consistent with the organization's values and risk tolerance. Includes criteria for AI deployment decisions, monitoring requirements, and incident response for AI-related harms.</span></div>
      <div class="cheat-pill"><strong>GV-6: Policies for Third-Party AI</strong><span>Policies and procedures address AI risk from third-party components and external AI systems. Organizations that procure or integrate external AI systems inherit their risks — governance must address AI supply chain risk management.</span></div>
    </div>
    <div class="highlight-box"><strong>Why culture is in GOVERN:</strong> The AI RMF's explicit inclusion of organizational culture in GOVERN reflects hard-won lessons from AI failures. Most documented AI harms happened not because organizations lacked technical capability to assess risk — but because cultures that rewarded speed-to-deployment over risk management created environments where risk concerns were dismissed, deprioritized, or never raised. GOVERN's culture requirements address this root cause directly: even perfect MAP and MEASURE processes fail if the culture punishes the people who raise concerns.</div>`,
    quiz: { q: "Why does the AI RMF include 'organizational culture' (GV-3) as an explicit GOVERN category alongside policies and accountability structures?", opts: ["Because culture is easier to demonstrate than technical risk assessments", "Because documented AI harms often resulted from cultures that rewarded deployment speed over risk management — even excellent technical risk assessment processes fail when organizational culture discourages raising concerns, dismisses risk findings, or creates incentives that override safety", "Because NIST is required by law to address organizational culture", "Because culture is a substitute for formal AI risk policies"], ans: 1, explain: "Culture is in GOVERN because the most sophisticated risk frameworks fail when the organizational culture undermines them. If engineers who raise AI safety concerns are seen as obstacles rather than contributors, if risk findings are overridden by deployment pressure, or if leadership implicitly communicates that 'getting AI launched' matters more than 'getting AI right' — then MAP, MEASURE, and MANAGE processes become theater. The AI RMF's culture requirement ensures governance addresses the human and organizational context that determines whether formal processes are genuine or performative." }
  },
  {
    title: "GOVERN Deep Dive — Risk Tolerance and AI Strategy",
    tagline: "Setting the boundaries for acceptable AI risk across the organization",
    body: `<p>Two of GOVERN's most strategically important concepts are <span class="key-term">risk tolerance</span> and the organization's overall <span class="key-term">AI risk management strategy</span>. Without these foundational decisions, every subsequent MAP, MEASURE, and MANAGE activity lacks the context needed to make them meaningful.</p>
    <div class="highlight-box"><strong>AI risk tolerance — what it means in practice:</strong> Risk tolerance is the organization's stated acceptance of how much AI risk is acceptable before action is required. For AI systems, risk tolerance must be specified across multiple dimensions simultaneously — not just "we accept low risk" but "we accept a maximum false-positive rate of X% for this use case, a maximum performance gap of Y% between demographic subgroups, and no deployment in high-stakes contexts without human review."</div>
    <p>Why risk tolerance must be explicit for AI:</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Deployment Decisions</strong><span>Risk tolerance determines when an AI system is "good enough" to deploy. Without explicit criteria, deployment decisions default to the loudest voice in the room — often the business case advocate. Explicit risk tolerance gives risk managers the authority to say "not yet" based on documented standards rather than opinion.</span></div>
      <div class="cheat-pill"><strong>Monitoring Thresholds</strong><span>Risk tolerance establishes the thresholds that trigger action during post-deployment monitoring. If model accuracy drops 3%, does that require investigation? Action? System suspension? Without pre-defined thresholds, every monitoring anomaly requires a new ad hoc decision — leading to inconsistency and delayed response.</span></div>
      <div class="cheat-pill"><strong>High-Stakes vs. Low-Stakes Contexts</strong><span>Risk tolerance should vary by context. An AI system recommending music playlists has much higher acceptable error tolerance than one recommending parole decisions. GOVERN must establish how the organization differentiates risk tolerance for different AI applications based on the consequences of failures.</span></div>
      <div class="cheat-pill"><strong>Subgroup Performance Standards</strong><span>Explicit AI risk tolerance should include standards for acceptable performance disparities across demographic subgroups. "We accept no more than a 5% performance gap between any two demographic groups" is a governable statement. "We will be fair" is not — it defers the hard question rather than answering it.</span></div>
    </div>
    <div class="analogy-box"><strong>The speed limit analogy:</strong> Risk tolerance works like a speed limit. A speed limit doesn't say "drive safely" — it says "no faster than 65 mph." You can choose to go slower based on conditions, but the limit is an explicit, enforceable standard. AI risk tolerance works the same way: it converts abstract principles like "AI must be fair" into concrete, measurable standards like "the false positive rate for any demographic subgroup must be within 5 percentage points of the overall rate." The specificity is what makes it governable rather than aspirational.</div>
    <div class="warning-box"><strong>The governance theater trap:</strong> Organizations frequently create AI governance committees, publish AI ethics principles, and establish AI review processes — but never define explicit risk tolerance. Without specific thresholds and standards, AI governance becomes advisory rather than decisional. The governance function looks active but cannot actually block or modify AI deployments that present unacceptable risk, because "unacceptable" was never defined.</div>`,
    quiz: { q: "An AI governance committee approves all AI deployments with the general standard 'AI must be fair and accurate.' Why is this an inadequate risk tolerance statement?", opts: ["Because fairness and accuracy are not legitimate AI risk criteria", "Because 'fair and accurate' is too vague to be enforceable — it cannot determine whether a specific AI system meets the standard, prevents deployment of harmful systems, or specify at what point an AI fails governance review", "Because risk tolerance statements should not mention fairness", "Because governance committees cannot set risk tolerance — only legal counsel can"], ans: 1, explain: "Vague standards like 'fair and accurate' cannot be operationalized into deployment decisions. When a medical AI shows 94% overall accuracy but 78% accuracy for elderly patients, does it pass 'accurate' review? When a hiring AI shows differential rejection rates by gender, does it pass 'fair' review? Without specific, measurable thresholds, the governance process cannot answer these questions — making it advisory rather than decisional. Effective AI risk tolerance specifies what measurement method will be used, what threshold must be met, and what happens when the threshold isn't met." }
  },
  {
    title: "MAP — Identifying AI Risk Context and Categories",
    tagline: "Understanding the environment, stakeholders, and risk landscape for each AI system",
    body: `<p><span class="key-term">MAP</span> is the function where abstract AI risk concepts become concrete for a specific AI system. MAP establishes the context in which an AI system operates, identifies who will be affected by the system and how, categorizes the types of risks the system presents, and builds the foundation for the MEASURE and MANAGE functions that follow. Without careful MAP work, risk measurement and management address the wrong things.</p>
    <div class="fn-map"><b>MP — MAP: AI risks and their impacts are identified and categorized based on the organization's context and the specific AI system's purpose, capabilities, and potential harms.</b></div>
    <p>MAP's key categories:</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>MP-1: Context Establishment</strong><span>The context in which the AI system will be deployed is established. Who will use the system? Under what conditions? What decisions will it inform or make? What is the deployment environment? Context shapes which risks are relevant and how severe they are.</span></div>
      <div class="cheat-pill"><strong>MP-2: Categorization of AI Risks and Impacts</strong><span>Potential negative impacts on individuals, communities, the organization, and broader society are identified. Impacts are categorized by type (fairness, safety, privacy, etc.) and by who is affected. The categorization guides which MEASURE methods are relevant.</span></div>
      <div class="cheat-pill"><strong>MP-3: AI System's Impact on Individuals</strong><span>Stakeholders who will be directly or indirectly affected by the AI system are identified. This includes not just users who interact with the system but people who are subject to its decisions — job applicants scored by a hiring AI, patients diagnosed by a medical AI, defendants assessed by a recidivism tool.</span></div>
      <div class="cheat-pill"><strong>MP-4: Risk Identification Methods</strong><span>Enumerated and identified risks include technical AI risks (model bias, performance degradation) and non-technical risks (misuse by operators, secondary uses of AI outputs, downstream harms from AI errors). Risk identification is comprehensive — not limited to the technical team's perspective.</span></div>
      <div class="cheat-pill"><strong>MP-5: Organizational Risk Tolerance</strong><span>Identified risks are prioritized based on the organization's risk tolerance and the potential severity and likelihood of impacts. Not all risks are equal — MAP creates a prioritized risk register that MEASURE and MANAGE can work through systematically.</span></div>
      <div class="cheat-pill"><strong>MP-6: Third-Party Risk Awareness</strong><span>AI risks associated with third-party data, models, and components are understood and considered. Organizations that build AI using external datasets, pre-trained models, or cloud AI services inherit risks from those providers — MAP must surface these dependencies.</span></div>
    </div>
    <div class="analogy-box"><strong>Why "who is affected" is a MAP core question:</strong> Many AI risk failures occurred because risk assessment focused on the organization's operational risk rather than the risk to individuals affected by AI decisions. A hiring AI might present low organizational risk (efficient screening) while presenting high risk to applicants (discriminatory outcomes). MAP requires thinking from the perspective of all affected stakeholders — not just from the organization's vantage point.</div>`,
    quiz: { q: "A company develops an AI system that recommends which students receive academic intervention resources. Why is it important that MAP identifies students as affected stakeholders — not just school administrators?", opts: ["Because students are customers of the school system", "Because students are subject to the AI's decisions without interacting with the system — a student who is incorrectly assessed as not needing intervention and therefore doesn't receive it experiences a direct, potentially life-affecting harm that only becomes visible when stakeholder analysis includes those affected by AI decisions, not just those using the system", "Because students might hack the AI system", "Because NIST requires all stakeholders to be identified regardless of relevance"], ans: 1, explain: "Students are affected stakeholders in the most fundamental sense — they experience the consequences of the AI's decisions without having any interaction with or visibility into the system. If the AI incorrectly determines a student doesn't need intervention (false negative), that student may fall further behind with no corrective resource. MAP's requirement to identify all affected stakeholders — including those subject to AI decisions, not just those using the system — ensures these downstream harms are visible to risk managers and measured in the MEASURE step." }
  },
  {
    title: "MAP Deep Dive — AI Risk Categories",
    tagline: "The types of risk that AI systems can create — and why each matters",
    body: `<p>One of MAP's most important contributions is establishing a vocabulary for AI risk categories. The NIST AI RMF identifies several distinct categories of AI risk that organizations must consider when mapping risk for specific AI systems. Understanding these categories enables comprehensive risk identification rather than focusing only on the risks that are most familiar or easiest to measure.</p>
    <div class="fn-map"><b>The AI RMF identifies risks at multiple levels simultaneously:</b></div>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Technical Risk</strong><span>Risks arising from the AI system's technical design and implementation. Model accuracy degradation over time, brittleness when encountering novel inputs, vulnerability to adversarial attacks (intentionally crafted inputs that fool the AI), data poisoning during training, and performance disparities across demographic groups.</span></div>
      <div class="cheat-pill"><strong>Operational Risk</strong><span>Risks arising from how the AI is deployed and operated. Human over-reliance on AI recommendations (automation bias), inappropriate use of the AI outside its intended context, inadequate monitoring of deployed AI, failure to update models as the world changes, and operational dependencies that create single points of failure.</span></div>
      <div class="cheat-pill"><strong>Contextual Risk</strong><span>Risks arising from the deployment context. The same AI system may present very different risks in different settings. An AI that performs adequately in a low-stakes recommendation context may present unacceptable risk when repurposed for high-stakes decision-making without re-evaluation.</span></div>
      <div class="cheat-pill"><strong>Societal Risk</strong><span>Risks to broader society beyond direct users and subjects. AI systems used in hiring, lending, housing, healthcare, and criminal justice can reinforce or amplify existing societal inequities at scale. Generative AI can enable disinformation, manipulate public opinion, or be weaponized for large-scale fraud.</span></div>
      <div class="cheat-pill"><strong>Privacy Risk</strong><span>Risks to individual privacy from AI data collection, processing, and inference. AI can infer sensitive attributes from seemingly innocuous data (political views from social media likes, health conditions from shopping patterns). Training data may include improperly obtained personal information.</span></div>
      <div class="cheat-pill"><strong>Security Risk</strong><span>Risks from intentional attacks on AI systems. Adversarial examples (inputs crafted to fool the AI), model inversion attacks (reconstructing training data from model outputs), membership inference attacks (determining if specific data was in training set), and supply chain attacks on AI components.</span></div>
    </div>
    <div class="highlight-box"><strong>The risk interaction problem:</strong> AI risks often interact in non-obvious ways. A privacy-protective design choice (using less training data to minimize personal data collection) may increase fairness risk (less data means poorer representation of minority groups). A transparency measure (publishing model architecture to enable accountability) may increase security risk (attackers can craft more effective adversarial attacks when they know the model). MAP must identify not just individual risks but how the organization's risk management choices in one area might affect risk in another.</div>`,
    quiz: { q: "A company that built a customer service chatbot discovers that users are asking it for medical advice and following its responses. The AI was never designed for medical advice and is not validated for that purpose. Which MAP risk category does this primarily represent?", opts: ["Technical risk — the AI model has a bug", "Operational risk — specifically the risk of inappropriate use of AI outside its intended context (scope creep or misuse), which the MAP function should have identified and the GOVERN function should have addressed with usage policies", "Security risk — the users are attacking the system", "Privacy risk — medical questions reveal personal health information"], ans: 1, explain: "This is primarily operational risk — specifically the risk of AI being used outside its intended scope. The chatbot was designed for customer service, not medical advice, and was never validated for that purpose. MAP should have identified this possible misuse scenario during context establishment (MP-1), and GOVERN should have established policies prohibiting or addressing this use case. The harm comes not from a technical failure but from deployment without adequate consideration of how the AI might be used beyond its intended purpose." }
  },
  {
    title: "MEASURE — Analyzing and Evaluating AI Risk",
    tagline: "Systematic methods for understanding how severe and likely identified AI risks are",
    body: `<p><span class="key-term">MEASURE</span> transforms the risk categories identified in MAP into quantitative and qualitative assessments of risk severity and likelihood. If MAP identifies "this AI system may produce biased outcomes for older job applicants," MEASURE determines how severe that bias is, how likely it is to cause harm, and how confident the organization is in its assessment. MEASURE provides the evidence base for the MANAGE function's risk treatment decisions.</p>
    <div class="fn-measure"><b>MS — MEASURE: Identified AI risks are analyzed, assessed, and tracked using metrics, evaluation methods, and testing tools. The trustworthiness of the AI system is evaluated against established criteria.</b></div>
    <p>MEASURE's key categories:</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>MS-1: Measurement Approaches</strong><span>Methods, tools, and metrics for assessing AI risk are established and applied consistently. Measurement approaches are appropriate for the AI risk type — statistical methods for bias measurement, red-teaming for robustness, interpretability tools for explainability. One-size-fits-all measurement is insufficient.</span></div>
      <div class="cheat-pill"><strong>MS-2: AI System Testing</strong><span>AI systems are tested for identified risks before deployment and during operation. Testing includes performance across demographic subgroups, robustness to distribution shift, resistance to adversarial inputs, and behavior in edge cases. Testing reflects the diversity of real-world deployment conditions.</span></div>
      <div class="cheat-pill"><strong>MS-3: AI System Performance Evaluation</strong><span>AI system performance is evaluated for technical accuracy, fairness metrics, explainability, and other trustworthiness characteristics. Performance is evaluated on data representative of the deployment population, not just the training/test split used in development.</span></div>
      <div class="cheat-pill"><strong>MS-4: Deployment Monitoring</strong><span>AI system performance and behavior are monitored continuously after deployment. Monitoring detects model drift (performance degradation as the world changes), emerging biases, unexpected behaviors, and changes in the deployment context that might invalidate the pre-deployment risk assessment.</span></div>
      <div class="cheat-pill"><strong>MS-5: Risk Measurement Documentation</strong><span>Risk measurement results are documented in formats accessible to relevant stakeholders. Technical metrics are translated into business-relevant risk information for non-technical decision-makers. Documentation supports both ongoing management and accountability for past decisions.</span></div>
      <div class="cheat-pill"><strong>MS-6: Feedback Mechanisms</strong><span>Mechanisms exist for impacted communities and individuals to provide input on AI risks and impacts. Affected communities often identify risks that internal teams miss — feedback channels create a pathway for this knowledge to improve AI risk assessment.</span></div>
    </div>
    <div class="analogy-box"><strong>Why pre-deployment testing isn't enough:</strong> Traditional software testing asks "does this work as designed?" AI risk measurement must also ask "does this work equitably for all affected groups?", "how does this behave on inputs outside the training distribution?", and "is this still working accurately six months into production as the world changes?" A medical AI validated in 2022 may perform differently in 2024 if treatment protocols, patient demographics, or diagnostic imaging equipment have changed. MEASURE is continuous — not a gate that once passed is never revisited.</div>`,
    quiz: { q: "Why does MEASURE require testing AI systems on data representative of the actual deployment population rather than just using the training/test split from development?", opts: ["Because training data is always proprietary and legally unavailable for testing", "Because training and test data often don't represent the full diversity of real deployment conditions — an AI trained and tested on hospital data from major academic medical centers may perform poorly when deployed in rural community hospitals with different patient demographics and imaging equipment", "Because deployment data is always more accurate than training data", "Because NIST requires a specific minimum dataset size for testing"], ans: 1, explain: "AI systems are typically developed and tested using available data that may not represent the full diversity of real deployment conditions. A hiring AI trained on resumes from tech-sector applicants may not have adequate test data representing older workers, people from non-traditional educational backgrounds, or candidates from underrepresented communities. If these groups are then subject to the system's decisions at deployment, risks that were invisible in testing emerge in practice. MEASURE requires evaluation on data reflecting actual deployment diversity — not just the data that was conveniently available during development." }
  },
  {
    title: "MEASURE Deep Dive — Metrics and Evaluation Tools",
    tagline: "How to actually quantify AI risks across trustworthiness dimensions",
    body: `<p>Understanding that AI risk must be measured is important. Understanding <em>how</em> to measure it — what metrics, methods, and tools apply to which AI risks — is the operational knowledge that makes MEASURE actionable. The AI RMF doesn't prescribe specific metrics, but it provides a structure for selecting appropriate measurement approaches based on the risk type.</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Fairness Metrics</strong><span>Demographic parity: equal acceptance/rejection rates across groups. Equalized odds: equal true positive AND false positive rates across groups. Disparate impact ratio: ratio of favorable outcome rates between groups (80% rule from employment law). Each metric captures a different aspect of fairness — no single metric captures all of them.</span></div>
      <div class="cheat-pill"><strong>Performance Metrics Disaggregated</strong><span>Standard accuracy, precision, recall, and F1 scores computed separately for each relevant demographic subgroup. Reveal performance disparities invisible in aggregate metrics. Essential for identifying whether an AI system that "works" overall works equitably across the affected population.</span></div>
      <div class="cheat-pill"><strong>Robustness Testing</strong><span>Adversarial testing: deliberately crafted inputs designed to fool the AI. Distribution shift testing: performance on data from different time periods, geographies, or demographics than training data. Stress testing: performance at the edges of the input space. Identifies brittleness before deployment.</span></div>
      <div class="cheat-pill"><strong>Explainability Methods</strong><span>LIME (Local Interpretable Model-Agnostic Explanations): explains individual predictions by approximating the model locally. SHAP (SHapley Additive exPlanations): attribute prediction credit to features. Counterfactual explanations: "what would need to change for a different outcome?" Different methods reveal different aspects of model behavior.</span></div>
      <div class="cheat-pill"><strong>Red-Teaming</strong><span>Deliberate adversarial testing by teams tasked with finding ways to harm, mislead, or misuse the AI system. Red teams simulate malicious users, identify manipulation strategies, test edge cases, and challenge system behavior in unexpected ways. Particularly critical for generative AI and high-stakes applications.</span></div>
      <div class="cheat-pill"><strong>Model Cards and Datasheets</strong><span>Model Cards (documentation of AI model performance characteristics, limitations, and intended use) and Datasheets for Datasets (documentation of training data composition, collection methods, and known limitations) provide standardized measurement documentation that enables external evaluation and accountability.</span></div>
    </div>
    <div class="highlight-box"><strong>The fairness metrics incompatibility problem:</strong> A fundamental challenge in AI fairness measurement is that many common fairness metrics are mathematically incompatible — satisfying one makes it mathematically impossible to satisfy another, except in special cases. For example, demographic parity (equal acceptance rates across groups) and equalized odds (equal error rates across groups) cannot both be fully satisfied when base rates differ across groups. Organizations must make explicit choices about which fairness criteria to prioritize for their specific context — there is no single "fair AI" metric that works everywhere.</div>`,
    quiz: { q: "A credit scoring AI shows similar overall accuracy for all demographic groups but significantly higher false negative rates (creditworthy applicants incorrectly denied) for minority applicants. Why is overall accuracy an insufficient measure in this context?", opts: ["Because overall accuracy is never a valid metric for credit scoring", "Because equal overall accuracy can mask dramatically different error type distributions — higher false negative rates for minority applicants means creditworthy minority applicants are systematically denied credit they deserve, which is discriminatory even if the overall accuracy rates appear equal", "Because credit scoring AI should not use demographic data", "Because false negative rates are only relevant for medical AI"], ans: 1, explain: "This illustrates why disaggregated error analysis is essential in AI risk MEASURE. Equal overall accuracy with unequal false negative rates means the AI is making systematically different errors for different groups — denying credit to creditworthy minority applicants at higher rates than creditworthy majority applicants. This is a form of discrimination regardless of whether overall accuracy looks equal. MEASURE requires examining error types separately by demographic group, not just overall accuracy, to detect these systematically disparate impacts." }
  },
  {
    title: "MANAGE — Responding to AI Risks",
    tagline: "Allocating resources, implementing treatments, and maintaining AI risk response capability",
    body: `<p><span class="key-term">MANAGE</span> is where risk assessment translates into action. After MAP identifies AI risks and MEASURE quantifies them, MANAGE decides what to do — allocate resources to address priority risks, implement mitigation strategies, develop incident response capability, and monitor whether risk treatments are working. MANAGE is the operational heart of AI risk management.</p>
    <div class="fn-manage"><b>MG — MANAGE: Risks identified in the MAP function and analyzed in the MEASURE function are addressed and tracked based on the organization's risk tolerance. Risks that exceed risk tolerance are prioritized for treatment.</b></div>
    <p>MANAGE's key categories:</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>MG-1: Risk Treatment Plans</strong><span>Responses to identified AI risks are documented in risk treatment plans. Plans specify the treatment strategy (mitigate, transfer, accept, avoid), resources allocated, timelines, and success criteria. Treatment plans connect identified risks to specific organizational commitments.</span></div>
      <div class="cheat-pill"><strong>MG-2: Risk Mitigation Strategies</strong><span>Specific risk mitigation strategies are selected and implemented based on the AI risk type. Technical mitigation (retraining the model, adding constraints), operational mitigation (human review requirements, usage restrictions), or process mitigation (better data governance, more diverse development teams) may be appropriate for different risks.</span></div>
      <div class="cheat-pill"><strong>MG-3: Residual Risk Management</strong><span>Residual risks — those remaining after treatment — are documented and monitored. AI systems virtually always have residual risks; the question is whether those residual risks are within the organization's tolerance and are being monitored. Residual risks are revisited as context changes.</span></div>
      <div class="cheat-pill"><strong>MG-4: Risk Response for Deployed AI</strong><span>Processes exist for responding to AI incidents, emerging risks, or monitoring alerts indicating risk threshold breaches. Response plans include: containment (limiting immediate harm), investigation (understanding the cause), remediation (fixing the underlying issue), and communication (notifying affected stakeholders).</span></div>
      <div class="cheat-pill"><strong>MG-5: Risk Transfer and Sharing</strong><span>Organizations consider risk transfer (insurance, contractual liability allocation) and risk sharing (transparency with users about AI limitations, involvement of affected communities in AI governance) as components of comprehensive AI risk management — not just mitigation.</span></div>
      <div class="cheat-pill"><strong>MG-6: Continuous Improvement</strong><span>Lessons learned from AI incidents, near-misses, and monitoring alerts feed back into MAP and GOVERN to improve organizational AI risk management over time. AI risk management should improve with each deployment — not repeat the same mistakes.</span></div>
    </div>
    <div class="analogy-box"><strong>The four AI risk treatment options:</strong> Just like traditional risk management, AI risk has four basic treatment options: Mitigate (implement controls to reduce risk — retrain the model, add human review, restrict deployment scope), Transfer (shift risk responsibility through contracts or insurance), Accept (acknowledge the risk is within tolerance and proceed with monitoring), or Avoid (don't deploy the AI or don't use it for this purpose). The right treatment depends on the risk's severity, the cost of mitigation, and the organization's risk tolerance established in GOVERN.</div>`,
    quiz: { q: "A deployed AI system for evaluating insurance claims begins showing increasing false positive rates (fraudulent claims incorrectly identified as legitimate) over six months. Which MANAGE activities should this trigger?", opts: ["Nothing — the system was properly validated before deployment", "MG-4 risk response: investigate the cause of the drift (is the fraud pattern changing? has the model degraded?), implement containment (consider human review of borderline cases), communicate with stakeholders, and feed lessons back through MAP and MEASURE to update the system's risk profile", "Immediately shut down the AI system permanently", "The problem should be escalated to NIST for guidance"], ans: 1, explain: "This scenario — gradual performance degradation post-deployment — is exactly what the AI RMF's MANAGE function is designed to address. The monitoring program (established in MEASURE) detected the drift. MG-4 (risk response for deployed AI) provides the framework: contain immediate harm (flag borderline cases for human review), investigate root cause (why is performance drifting?), remediate (retrain the model or adjust operating parameters), and communicate with affected stakeholders. Lessons feed back into MAP (updated risk profile) and GOVERN (updated monitoring thresholds and deployment policies)." }
  },
  {
    title: "The Seven Characteristics of Trustworthy AI",
    tagline: "The properties that make an AI system worthy of trust — and why each matters",
    body: `<p>At the heart of the NIST AI RMF is a foundational concept: <span class="key-term">trustworthy AI</span>. The framework defines trustworthy AI through seven core characteristics that, together, represent what it means for an AI system to be worthy of the trust placed in it by users, subjects, and society. Understanding these seven characteristics is essential — they are the target state that all four functions (GOVERN, MAP, MEASURE, MANAGE) are working toward.</p>
    <div class="trust-card"><b>1. Valid and Reliable</b><br>The AI system performs as intended across its operational range. Validation confirms the AI does what it was designed to do. Reliability means it does so consistently — not just on average, but across diverse inputs, contexts, and time. An AI that works brilliantly in testing but inconsistently in production is not reliably valid.</div>
    <div class="trust-card"><b>2. Safe</b><br>The AI system does not create unnecessary risk of harm to people or the environment. Safety requires anticipating failure modes and limiting their consequences. Safety is especially critical for AI deployed in physical systems (autonomous vehicles, medical devices) where failures can cause direct physical harm, but the concept applies to any AI where failures cause meaningful harm.</div>
    <div class="trust-card"><b>3. Secure and Resilient</b><br>The AI system can withstand intentional attacks (adversarial inputs, data poisoning, model inversion) and recover from unintentional disruptions. Resilience means the system degrades gracefully under stress rather than failing catastrophically — and can be restored to normal operation after disruption.</div>
    <div class="trust-card"><b>4. Explainable and Interpretable</b><br>The AI system's processes and decisions can be understood by those who need to understand them. Explainability means the system can provide reasons for its outputs. Interpretability means those explanations are meaningful to the intended audience — a technical explanation of gradient importance scores isn't meaningful to a loan applicant who was denied.</div>
    <div class="trust-card"><b>5. Privacy-Enhanced</b><br>The AI system respects individuals' privacy throughout its lifecycle — from training data collection through deployment and retirement. Privacy enhancement goes beyond compliance with data protection laws to actively minimize privacy risks, protect sensitive inferences, and give individuals appropriate control over how their data is used by AI.</div>
    <div class="trust-card"><b>6. Fair — with Harmful Bias Managed</b><br>The AI system does not produce outputs that are systematically unfair to individuals or groups based on protected characteristics. Fairness requires proactive identification and mitigation of bias — in training data, model architecture, and deployment context. "Fair" is an outcome to be measured and demonstrated, not an assumption to be made.</div>
    <div class="trust-card"><b>7. Accountable and Transparent</b><br>Appropriate human oversight mechanisms exist for the AI system. Those responsible for the AI's behavior can be identified and held responsible. The AI's capabilities, limitations, and risk management measures are disclosed appropriately to relevant stakeholders. Accountability requires that "the AI decided" is never a sufficient explanation — humans remain responsible for AI systems they deploy.</div>`,
    quiz: { q: "Why is 'Accountable and Transparent' listed as a trustworthiness characteristic alongside technical properties like 'Safe' and 'Secure'?", opts: ["Because transparency is a marketing requirement, not a technical one", "Because accountability and transparency are governance prerequisites for trustworthiness — without them, there is no mechanism for detecting failures in other characteristics, no way for affected individuals to seek redress, and no ability to learn from AI failures. Technical properties alone cannot be trusted without governance mechanisms to verify and maintain them.", "Because NIST is a government agency and prefers governance requirements", "Because accountability only matters for AI systems used by government agencies"], ans: 1, explain: "Accountability and transparency are foundational to all other trustworthiness characteristics because they provide the verification and correction mechanisms that make trust possible. Without accountability (named humans responsible for AI behavior), there's no way to address failures in safety, fairness, or explainability — they become theoretical properties with no enforcement mechanism. Without transparency, stakeholders cannot evaluate whether other trustworthiness characteristics are being achieved. Accountability and transparency transform trustworthiness from a claim into a verifiable commitment." }
  },
  {
    title: "Trustworthy AI — Validity, Reliability, and Safety",
    tagline: "The foundational properties that determine whether an AI system can be trusted to operate",
    body: `<p>The first three trustworthy AI characteristics — validity, reliability, and safety — address fundamental operational questions: Does the AI do what it claims? Does it do so consistently? Does it avoid causing harm? These are the properties that determine whether an AI system should be deployed at all — they are prerequisites, not aspirational goals.</p>
    <div class="highlight-box"><strong>Validity and Reliability — why they're paired:</strong> Validity (the AI does what it's designed to do) and reliability (it does so consistently) are inseparable in practice. A credit scoring model that correctly predicts default 90% of the time on average is valid. A credit scoring model that correctly predicts default 90% of the time consistently across all demographic groups, across time, and across different economic conditions is both valid and reliable. Reliability failures — where an AI is sometimes valid and sometimes not — are often the most dangerous, because they're unpredictable.</div>
    <p>Validity and reliability assessment approaches:</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Cross-validation</strong><span>Test performance across multiple data splits to assess whether the model's performance generalizes or is an artifact of a specific training/test split. Generalization is the hallmark of validity — an AI that only works on its training data is not valid for deployment.</span></div>
      <div class="cheat-pill"><strong>Temporal Testing</strong><span>Test performance on data from different time periods than the training data. AI systems are often trained on historical data and deployed in a changing present — temporal testing reveals how quickly the model's validity degrades as conditions change.</span></div>
      <div class="cheat-pill"><strong>Out-of-Distribution Testing</strong><span>Test performance on inputs from outside the training distribution — different demographics, geographies, or operational conditions than the training data represented. Reliability requires working across the full deployment population, not just the training population.</span></div>
      <div class="cheat-pill"><strong>Calibration Testing</strong><span>Verify that the AI's confidence scores match actual accuracy — an AI that says "90% confident" should be correct about 90% of the time when it says that. Miscalibrated confidence leads to over-reliance on AI outputs that aren't as reliable as they appear.</span></div>
    </div>
    <div class="highlight-box"><strong>AI Safety — broader than you think:</strong> "Safety" in AI context goes beyond preventing physical harm. A medical diagnosis AI that misdiagnoses and leads to wrong treatment is unsafe. A bail recommendation AI that systematically over-recommends detention for low-risk defendants is unsafe. A content moderation AI that suppresses legitimate political speech is unsafe. Safety encompasses preventing harms across physical, psychological, financial, social, and democratic dimensions — making it a comprehensive rather than narrow property.</div>
    <div class="analogy-box"><strong>The aircraft analogy for AI reliability:</strong> Aircraft systems use redundancy and extensive testing because failures are catastrophic. The same principle applies to high-stakes AI: an autonomous vehicle AI that fails 0.01% of the time is "99.99% reliable" — but at millions of decisions per day across millions of vehicles, that tiny failure rate produces thousands of accidents. The appropriate reliability standard depends entirely on the consequences of failure — another reason why GOVERN's context-specific risk tolerance is the foundation of meaningful trustworthy AI assessment.</analogy-box>`,
    quiz: { q: "A fraud detection AI has 98% overall accuracy on the test set during development but shows only 85% accuracy when deployed six months later. What trustworthiness characteristic has degraded, and what likely caused it?", opts: ["Fairness — the model has become biased over time", "Reliability — the model's valid performance has degraded, likely due to distribution shift (fraud patterns evolved after the training data was collected), demonstrating that validity at deployment time doesn't guarantee reliability over time", "Security — the model is being attacked by fraudsters", "Explainability — the model can no longer explain its decisions"], ans: 1, explain: "This is a reliability failure specifically caused by distribution shift. The model was valid at deployment (98% accuracy on test data from the same time period as training data) but not reliable over time (85% six months later as fraud patterns evolved). Fraudsters adapt their techniques faster than static models retrain — a known risk in fraud detection. This reliability failure should have been anticipated in MAP (distribution shift risk for fraud detection AI), measured in MEASURE (temporal robustness testing), managed in MANAGE (monitoring with drift detection and retraining triggers), and governed in GOVERN (policies specifying retraining thresholds)." }

  {
    title: "Trustworthy AI — Explainability and Privacy",
    tagline: "Enabling accountability through understandable AI — and protecting individuals' information",
    body: `<p>Two trustworthy AI characteristics with significant legal and governance implications: <span class="key-term">explainability</span> and <span class="key-term">privacy</span>. Both connect AI technical properties to individual rights — the right to understand decisions that affect you, and the right to control how your information is used. Both are increasingly codified in regulations around the world.</p>
    <div class="highlight-box"><strong>Explainability and Interpretability — the distinction:</strong> The AI RMF distinguishes between explainability (the AI can describe why it produced a specific output) and interpretability (that description is meaningful to the intended audience). A model that outputs "the decision was influenced by features 23, 47, and 12 in the training vector" is technically explainable but not interpretable for a loan applicant. Interpretable AI bridges the gap between technical explanation and human understanding — matching the explanation format to the audience's needs and knowledge.</div>
    <p>Why explainability matters across contexts:</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Legal Requirements</strong><span>GDPR's "right to explanation" for automated decisions. The Equal Credit Opportunity Act requires lenders to provide specific reasons for credit denials. These legal requirements make explainability not just a governance best practice but a legal obligation in many high-stakes AI contexts.</span></div>
      <div class="cheat-pill"><strong>Debugging and Improvement</strong><span>Explainability enables developers to identify why an AI makes mistakes — which features it's incorrectly relying on, what patterns in training data led to bad behavior. Without explainability, AI debugging requires trial-and-error rather than systematic diagnosis.</span></div>
      <div class="cheat-pill"><strong>Human Oversight</strong><span>Explainability enables meaningful human review of AI decisions. A human reviewer who sees only "AI approved/denied" cannot exercise meaningful oversight. A reviewer who sees "AI denied because: low credit utilization (40%), recent address change (30%), income-to-debt ratio (30%)" can evaluate whether the AI's reasoning makes sense.</span></div>
      <div class="cheat-pill"><strong>Trust-Building</strong><span>Users and affected individuals trust AI more when they can understand its reasoning — even imperfect reasoning they can evaluate is more trustworthy than opaque decisions they cannot. Explainability supports the legitimacy of AI decisions beyond just their accuracy.</span></div>
    </div>
    <div class="highlight-box"><strong>Privacy-Enhanced AI — beyond compliance:</strong> Privacy in AI context encompasses: using minimum necessary data for training, protecting sensitive attributes that can be inferred from non-sensitive data (health conditions from shopping patterns), preventing re-identification of individuals from model outputs, enabling individuals to request deletion of their data and its effects from AI models (the "right to be forgotten" applied to AI), and conducting Privacy Impact Assessments for AI systems before deployment.</div>`,
    quiz: { q: "A healthcare AI recommends treatment plans but cannot explain why it recommended a particular treatment for a particular patient. Why is this an explainability problem with concrete consequences beyond abstract principle?", opts: ["Because NIST requires all AI to be explainable", "Because without explainability, physicians cannot exercise meaningful clinical judgment about whether to follow the recommendation, patients cannot give informed consent to treatment based on AI input, and if the recommendation causes harm, accountability is impossible to assign — all of which are concrete, consequential failures", "Because unexplainable AI systems are always inaccurate", "Because explainability is only required for AI systems that are wrong"], ans: 1, explain: "Explainability in healthcare AI has direct clinical and legal consequences. A physician who follows an AI recommendation without being able to evaluate the reasoning cannot exercise their professional judgment — which is both an ethical failure and a patient safety risk. A patient cannot give informed consent to treatment if the basis for the recommendation is opaque. And if the treatment causes harm, the inability to explain the AI's reasoning makes accountability impossible — both for the AI developer and for the clinical team that followed the recommendation without understanding why." }

  {
    title: "Trustworthy AI — Fairness and Accountability",
    tagline: "Managing bias and maintaining human responsibility for AI decisions",
    body: `<p>The final two trustworthy AI characteristics — <span class="key-term">fairness</span> and <span class="key-term">accountability</span> — are perhaps the most politically and socially significant. Fairness addresses whether AI systems treat people equitably regardless of protected characteristics. Accountability addresses whether humans remain responsible for AI systems rather than hiding behind them.</p>
    <div class="highlight-box"><strong>Fairness in AI — three important dimensions:</strong><br><br><strong>Individual Fairness:</strong> Similar individuals are treated similarly by the AI — regardless of their demographic group membership. Two equally qualified job applicants should receive similar scores from a hiring AI.<br><br><strong>Group Fairness:</strong> Different demographic groups experience the AI's outcomes at comparable rates — no group is systematically advantaged or disadvantaged by AI decisions beyond what is justified by legitimate factors.<br><br><strong>Counterfactual Fairness:</strong> If a person's demographic characteristics were different but everything else remained the same, would the AI's output change? Counterfactual fairness tests whether protected characteristics are actually affecting outcomes even when the model doesn't explicitly use them (because they may be encoded in correlated features).</div>
    <p>Sources of AI bias that fairness work must address:</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Historical Bias</strong><span>Training data reflects historical human decisions that were discriminatory. A loan approval AI trained on historical approval decisions inherits whatever racial or gender biases informed those decisions. Historical bias exists before any modeling begins — it's in the data itself.</span></div>
      <div class="cheat-pill"><strong>Representation Bias</strong><span>Training data underrepresents some groups. A medical imaging AI trained mostly on images from young, healthy patients may not have enough examples of diseases presenting differently in elderly or immunocompromised patients — producing lower accuracy for underrepresented groups.</span></div>
      <div class="cheat-pill"><strong>Measurement Bias</strong><span>The labels or proxy variables used in training data are themselves biased proxies for the outcome of interest. Using "re-arrest" as a proxy for "recidivism" in criminal justice AI embeds policing bias — communities with more aggressive policing show higher re-arrest rates regardless of actual reoffending behavior.</span></div>
      <div class="cheat-pill"><strong>Deployment Bias</strong><span>AI is used in ways or populations not represented in training. A hiring AI trained on successful employees in one company culture may be biased against applicants from different backgrounds who would succeed in a different culture — not because the AI is technically wrong but because the training target doesn't generalize.</span></div>
    </div>
    <div class="warning-box"><strong>Accountability — the critical governance principle:</strong> Accountability requires that humans remain responsible for AI behavior regardless of the AI's autonomy level. "The algorithm decided" cannot be a sufficient response to AI-caused harm. Organizations must be able to identify: who made the deployment decision, who defined the risk tolerance, who reviewed the pre-deployment assessment, who was responsible for monitoring, and who should be accountable when harms occur. The AI RMF's GOVERN function creates the accountability structures that make this possible.</div>`,
    quiz: { q: "A criminal justice risk assessment tool was trained using re-arrest rates as a proxy for recidivism. Researchers later show the tool has significantly higher false positive rates (incorrectly flagging low-risk defendants as high-risk) for Black defendants than white defendants. Which bias type primarily caused this?", opts: ["Deployment bias — the tool is being used outside its training population", "Measurement bias — re-arrest rates are a biased proxy for recidivism because they reflect differential policing intensity by race rather than actual reoffending rates, causing the model to encode and amplify the disparity between policing intensity and actual criminal behavior", "Historical bias — past judges were biased in their decisions", "Representation bias — there were too few white defendants in training data"], ans: 1, explain: "This is a canonical example of measurement bias. Re-arrest rate is a systematically biased proxy for recidivism because communities with more intensive policing show higher re-arrest rates regardless of actual offense rates — the measurement (re-arrest) reflects policing behavior, not criminal behavior. When an AI is trained on this biased proxy, it learns to predict policing intensity rather than actual recidivism — producing higher false positive rates for communities that are more heavily policed, which in the US are disproportionately Black communities. The bias was built into the training target before a single modeling decision was made." }
  },
  {
    title: "AI Actors — Roles and Responsibilities in the AI Lifecycle",
    tagline: "Who is responsible for AI risk — and how responsibilities shift across the AI supply chain",
    body: `<p>The NIST AI RMF introduces the concept of <span class="key-term">AI actors</span> — the different individuals and organizations involved in designing, developing, deploying, and using AI systems. Understanding AI actors is essential because AI risk management responsibility is not confined to any single role: it is distributed across an entire supply chain, and different actors have different levels of responsibility for different AI risks.</p>
    <div class="highlight-box">The AI RMF identifies AI actors across the AI lifecycle — recognizing that a single AI system may involve dozens of different organizations playing different roles. Critically, the framework establishes that <em>all</em> actors in the AI supply chain bear some responsibility for AI risks — organizations cannot disclaim responsibility for risks created by AI tools they use, even when those tools were built by third parties.</div>
    <p>Key AI actor categories:</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>AI Designers</strong><span>Conceive and design the AI system — defining its purpose, capability requirements, and high-level architecture. Responsible for building fairness, safety, and other trustworthiness considerations into the system design from the beginning rather than retrofitting them later.</span></div>
      <div class="cheat-pill"><strong>AI Developers</strong><span>Build the AI system — writing code, training models, implementing features. Responsible for implementing security controls, following responsible ML practices, documenting model behavior, and generating technical documentation (Model Cards, etc.) that enables downstream actors to understand system risks.</span></div>
      <div class="cheat-pill"><strong>AI Trainers</strong><span>Provide or curate the data used to train AI models. Responsible for data quality, representativeness, and documentation (Datasheets for Datasets). Training data quality is a primary determinant of AI system fairness — trainers bear significant responsibility for bias that emerges from training data problems.</span></div>
      <div class="cheat-pill"><strong>AI Deployers</strong><span>Organizations that deploy AI systems for specific use cases, often built or provided by developers they didn't design themselves. Responsible for deploying AI within its intended scope, monitoring performance, implementing appropriate human oversight, and responding to deployment-context risks that weren't present at development time.</span></div>
      <div class="cheat-pill"><strong>AI Users</strong><span>Individuals who directly interact with AI systems. Even users bear some responsibility — specifically for using AI appropriately, not over-relying on AI recommendations without human judgment, and reporting problems through available feedback channels.</span></div>
      <div class="cheat-pill"><strong>Affected Individuals</strong><span>People who are subject to AI decisions without necessarily interacting with the system — job applicants scored by hiring AI, patients diagnosed by medical AI. Not actors in the operational sense, but central stakeholders whose interests all other actors must consider. The AI RMF's stakeholder inclusion requirements are specifically designed to give affected individuals voice in AI governance.</span></div>
    </div>
    <div class="analogy-box"><strong>The pharmaceutical supply chain analogy:</strong> Drug safety responsibility is distributed across: the researcher who discovers the compound, the manufacturer who produces it, the distributor who ships it, the pharmacist who dispenses it, and the physician who prescribes it. Each party bears responsibility for their role, and failures at any link can cause patient harm. AI works similarly — bias in training data (trainer responsibility), poor testing (developer responsibility), deployment outside intended scope (deployer responsibility), and failure to exercise professional judgment (user responsibility) can each cause harm regardless of the other actors' performance.</div>`,
    quiz: { q: "A hospital deploys a third-party AI diagnosis tool that was properly validated for adult patients. The hospital then uses the tool for pediatric patients without additional validation. When the tool performs poorly on pediatric cases and misses diagnoses, who bears primary responsibility?", opts: ["The AI developer — they should have anticipated pediatric use", "The hospital as deployer — they used the AI outside its validated scope without conducting appropriate additional validation, which is a deployer responsibility under the AI RMF's actor framework", "The patients' physicians — for relying on AI", "NIST — for not requiring pediatric validation in their framework"], ans: 1, explain: "Under the AI RMF's actor framework, deployers are responsible for deploying AI within its intended and validated scope. Using a tool validated for adults on pediatric patients without additional validation is a scope expansion that creates deployment-context risks the developer couldn't have anticipated or mitigated. The hospital (as deployer) bears primary responsibility for this deployment decision, including conducting validation before using the tool on populations outside its original validation scope, implementing appropriate monitoring, and establishing human review processes." }
