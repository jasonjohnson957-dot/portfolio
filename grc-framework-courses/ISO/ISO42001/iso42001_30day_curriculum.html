    <div class="annex-card"><b>A.4 — Resources for AI Systems</b><br>Controls covering: data resources (quality, provenance, representativeness of training data), computational resources (adequate infrastructure for AI development and operation), human resources (competent people throughout the AI life cycle), knowledge resources (documented best practices, lessons learned, AI-specific expertise).</div>
    <div class="analogy-box"><strong>A.4 data resources are critical:</strong> The AI world has a saying — "garbage in, garbage out." An AI trained on biased, incomplete, or low-quality data will produce biased, unreliable results — no matter how sophisticated the model architecture. A.4 controls over data resources recognize this: governance of training data is governance of AI outcomes. You cannot separate them.</div>
    <div class="highlight-box">A.4 also covers <strong>knowledge resources</strong> — the organizational knowledge about AI systems that must be captured, maintained, and made available. This includes documentation of AI design decisions, testing results, known limitations, and lessons learned from previous AI projects. Without knowledge management, organizations repeat the same mistakes with every new AI system.</div>`,
    quiz: { q: "An organization trains an AI on customer data collected 10 years ago, without assessing whether that data is representative of today's customer base or whether it contains historical biases. Which Annex A control domain most directly addresses this gap?", opts: ["A.2 — Policies related to AI", "A.3 — Internal organization", "A.4 — Resources for AI systems (specifically data resources)", "A.10 — Third-party and customer relationships"], ans: 2, explain: "A.4 covers resources for AI systems, including data resources. Data quality, representativeness, and bias assessment are core A.4 concerns. Using outdated or unrepresented training data without assessment is a gap in data resource governance — the foundational A.4 control domain." }
  },
  {
    title: "Annex A — Risks, Impacts, and Life Cycle",
    tagline: "The operational heart of responsible AI governance",
    body: `<p>The middle Annex A domains — A.5, A.6, and A.7 — cover the operational core of ISO 42001: assessing what AI systems might do wrong, governing them through their life cycle, and managing the data they use.</p>
    <div class="annex-card"><b>A.5 — Assessing Impacts of AI Systems</b><br>Controls for conducting systematic AI impact assessments. Evaluating social, ethical, and rights-based impacts of AI. Considering vulnerable populations. Documenting assessment methodology and results. Using assessment findings to inform design and deployment decisions. Re-assessing when systems or contexts change.</div>
    <div class="annex-card"><b>A.6 — AI System Life Cycle</b><br>Controls across each life cycle phase: design principles for responsible AI, training data governance, model validation and testing (including fairness testing), deployment authorization, operational monitoring for drift and degradation, incident response, and end-of-life management. This is the most extensive Annex A domain — reflecting that the life cycle is where most AI governance actually happens.</div>
    <div class="annex-card"><b>A.7 — Data for AI Systems</b><br>Controls for: data governance policies, data quality management, personal data protection in AI contexts, data documentation (data cards, model cards), data lifecycle management including retention and deletion. A.7 closely aligns with GDPR's data protection requirements, making it a natural integration point for organizations already managing GDPR compliance.</div>
    <div class="analogy-box"><strong>A.6 life cycle controls in practice:</strong> Many AI governance failures happen because organizations treat AI deployment as a one-time event rather than an ongoing responsibility. A.6 requires continuous governance — not just a pre-launch review. Monitoring deployed AI systems for fairness drift, performance degradation, and emerging safety issues is a permanent operational obligation, not a project.</div>
    <div class="highlight-box">A.7 includes a specific requirement for <strong>data documentation</strong> — maintaining records of what data was used to train AI systems, where it came from, how it was processed, and what its known limitations are. This "data provenance" documentation is essential for troubleshooting AI problems and for demonstrating compliance to auditors and regulators.</div>`,
    quiz: { q: "A company discovers that its deployed AI system has started making increasingly poor decisions over the past six months due to changes in customer behavior that weren't reflected in the training data. Which Annex A control domain most directly requires the monitoring that should have caught this?", opts: ["A.5 — Assessing impacts", "A.6 — AI system life cycle (specifically operational monitoring controls)", "A.3 — Internal organization", "A.10 — Third-party relationships"], ans: 1, explain: "A.6's AI system life cycle controls include operational monitoring requirements for deployed AI systems — specifically to detect performance degradation, drift, and emerging issues. Regular monitoring of model performance should have flagged the decline in decision quality long before it became a significant problem." }
  },
  {
    title: "Annex A — Transparency, Use, and Third Parties",
    tagline: "Communicating about AI and governing its use and supply chain",
    body: `<p>The final three Annex A domains — A.8, A.9, and A.10 — address transparency with stakeholders, governance of how AI is actually used, and management of the AI supply chain.</p>
    <div class="annex-card"><b>A.8 — Information for Interested Parties About AI Systems</b><br>Controls requiring organizations to provide appropriate information about their AI systems to affected parties. This includes: informing users when they are interacting with AI, explaining how AI decisions work (in accessible terms), disclosing AI capabilities and limitations, and documenting AI system characteristics in formats that enable oversight and accountability.</div>
    <div class="annex-card"><b>A.9 — Use of AI Systems</b><br>Controls governing how AI systems are actually operated — particularly relevant for AI Operators (deployers) using third-party AI. Covers: using AI systems only for their intended purpose, establishing processes for human oversight of AI decisions, managing incidents when AI behaves unexpectedly, and providing mechanisms for affected individuals to contest AI-based decisions.</div>
    <div class="annex-card"><b>A.10 — Third-Party and Customer Relationships</b><br>Controls for managing the AI supply chain and customer relationships. Covers: due diligence on AI providers and suppliers, contractual requirements for AI governance from vendors, monitoring supplier AI governance practices, and managing customer expectations about AI capabilities and limitations.</div>
    <div class="analogy-box"><strong>A.8 transparency in the real world:</strong> When you interact with a customer service chatbot, does it tell you it's an AI? When an AI reviews your job application, are you informed? When AI influences your insurance premium, do you know how it works? A.8 requires organizations to think through what information affected parties need about AI systems — and provide it. Transparency isn't just good ethics; it's an ISO 42001 control requirement.</div>
    <div class="highlight-box">A.9's human oversight requirement is one of ISO 42001's most important controls. It recognizes that fully automated AI decisions in high-stakes contexts are dangerous — not because AI is always wrong, but because errors without human catch mechanisms can scale catastrophically. A.9 requires processes where humans meaningfully oversee AI outputs in contexts where the stakes are high.</div>`,
    quiz: { q: "A company uses AI to make initial hiring decisions but never tells candidates they are being screened by AI. Which Annex A domain does this violate?", opts: ["A.6 — AI system life cycle", "A.7 — Data for AI systems", "A.8 — Information for interested parties about AI systems", "A.10 — Third-party relationships"], ans: 2, explain: "A.8 requires organizations to provide appropriate information about their AI systems to affected parties — including informing people when AI is being used in decisions that affect them. Screening job candidates without disclosing AI involvement violates A.8's transparency controls." }
  },
  {
    title: "ISO 42001 and the EU AI Act",
    tagline: "How the standard and the regulation work together",
    body: `<p>ISO 42001 and the EU AI Act are the two most important AI governance frameworks in the world today — and they're closely aligned. Understanding how they relate is essential for organizations operating in or serving the EU.</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>EU AI Act</strong><span>A regulation — legally mandatory for companies operating in the EU. Uses a risk-based approach with four tiers. Requires specific conformity assessments for high-risk AI. Enforced through national authorities with significant fines.</span></div>
      <div class="cheat-pill"><strong>ISO 42001</strong><span>A voluntary standard — not legally required, but practically expected by customers and markets. Provides a management system framework for responsible AI across all risk levels. Can be used as evidence of compliance with regulatory requirements.</span></div>
    </div>
    <div class="highlight-box"><strong>How they align:</strong> ISO 42001's requirements map closely to EU AI Act obligations for high-risk AI providers. An organization with a mature ISO 42001 AIMS will have most of the governance processes already in place that the EU AI Act requires — including risk management, technical documentation, human oversight, post-market monitoring, and transparency. ISO 42001 certification could serve as evidence of good-faith compliance efforts.</div>
    <div class="analogy-box"><strong>Law vs. standard analogy:</strong> The EU AI Act is like traffic law — you must follow it or face fines. ISO 42001 is like a comprehensive driver education curriculum — you don't legally have to take it, but organizations that do are demonstrably better at meeting the law's requirements. In fact, ISO and the European Commission have been coordinating to ensure ISO 42001 aligns with EU AI Act obligations — making them complementary by design.</div>
    <div class="badge-row">
      <span class="badge badge-teal">EU AI Act high-risk AI requirements → ISO 42001 Clauses 6, 8, 9</span>
      <span class="badge badge-teal">EU AI Act transparency requirements → ISO 42001 Annex A.8</span>
      <span class="badge badge-teal">EU AI Act human oversight → ISO 42001 Annex A.9</span>
      <span class="badge badge-teal">EU AI Act post-market monitoring → ISO 42001 Clause 9.1</span>
      <span class="badge badge-teal">EU AI Act FRIA → ISO 42001 AI Impact Assessment (Clause 6)</span>
    </div>`,
    quiz: { q: "A company has ISO 42001 certification and is now subject to the EU AI Act for its high-risk AI hiring tool. Does the ISO 42001 certification replace EU AI Act compliance?", opts: ["Yes — ISO 42001 certification automatically satisfies EU AI Act requirements", "No — they are separate obligations, but ISO 42001 provides governance infrastructure that helps meet EU AI Act requirements and may serve as evidence of good-faith compliance", "Yes — but only if the certification covers high-risk AI systems", "No — ISO 42001 and the EU AI Act have no relationship"], ans: 1, explain: "ISO 42001 and the EU AI Act are complementary but distinct. The EU AI Act is legally mandatory; ISO 42001 is voluntary. Having ISO 42001 doesn't replace EU AI Act compliance, but it provides governance infrastructure that aligns with many EU AI Act requirements — potentially streamlining compliance efforts and serving as evidence of good governance practices." }
  },

let current = 0;

function buildGrid(){
  const g = document.getElementById('dayGrid');
  g.innerHTML = '';
  for(let i = 0; i < days.length; i++){
    const b = document.createElement('button');
    b.className = 'day-pip' + (days[i].isCheatSheet ? ' cheat' : '') + (i === current ? ' active' : '');
    b.textContent = days[i].isCheatSheet ? 'CS' : (i + 1);
    b.title = days[i].title;
    b.onclick = (()=>{ const idx = i; return () => goTo(idx); })();
    g.appendChild(b);
  }
}

function goTo(idx){ current = idx; render(); }
function changeDay(dir){ current = Math.max(0, Math.min(days.length - 1, current + dir)); render(); }

function render(){
  const d = days[current];
  const total = days.length;
  document.getElementById('dayCounter').textContent = (current + 1) + ' / ' + total;
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === total - 1;
  document.getElementById('progBar').style.width = (((current + 1) / total) * 100) + '%';
  buildGrid();

  if(d.isCheatSheet){
    document.getElementById('lessonArea').innerHTML = `
      <div class="card">
        <div class="lesson-header">
          <div class="day-badge" style="background:#E6F1FB">
            <div class="day-num" style="color:#0C447C;font-size:14px">CHEAT</div>
            <div class="day-lbl" style="color:#185FA5">SHEET</div>
          </div>
          <div class="lesson-meta">
            <h2>${d.title}</h2>
            <div class="tagline">${d.tagline}</div>
          </div>
        </div>
        <div class="lesson-body">${d.body}</div>
      </div>`;
    return;
  }

  const quizId = 'quiz_' + current;
  let quizHtml = '';
  if(d.quiz){
    const optsHtml = d.quiz.opts.map((o, i) =>
      `<button class="quiz-btn" onclick="checkAnswer(${i}, ${d.quiz.ans}, '${quizId}')">${o}</button>`
    ).join('');
    quizHtml = `<div class="quiz-box">
      <p>Quick check: ${d.quiz.q}</p>
      <div>${optsHtml}</div>
      <div class="answer-reveal" id="${quizId}"></div>
    </div>`;
  }

  document.getElementById('lessonArea').innerHTML = `
    <div class="card">
      <div class="lesson-header">
        <div class="day-badge">
          <div class="day-num">${current + 1}</div>
          <div class="day-lbl">Day</div>
        </div>
        <div class="lesson-meta">
          <h2>${d.title}</h2>
          <div class="tagline">${d.tagline}</div>
        </div>
      </div>
      <div class="section-label">Today's lesson</div>
      <div class="lesson-body">${d.body}</div>
      ${quizHtml}
    </div>`;
}

function checkAnswer(chosen, correct, qid){
  const el = document.getElementById(qid);
  const d = days[current];
  if(!d.quiz) return;
  const isRight = chosen === correct;
  el.innerHTML = `<strong>${isRight ? 'Correct!' : 'Not quite.'}</strong> ${d.quiz.explain}`;
  el.className = 'answer-reveal show';
  el.style.background = isRight ? '#EAF3DE' : '#FCEBEB';
  el.style.borderColor = isRight ? '#3B6D11' : '#A32D2D';
  el.style.color = '#1a1a18';
}

render();
</script>
