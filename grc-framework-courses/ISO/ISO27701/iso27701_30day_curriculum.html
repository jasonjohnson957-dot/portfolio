  quiz:{q:"An organization&#8217;s security risk assessment identifies a risk of unauthorized disclosure of employee salary data from a poorly secured HR system. Under ISO 27701&#8217;s privacy risk extension, what additional analysis is required that a pure security risk assessment might not capture?",opts:["No additional analysis&#8212;security risk assessment and privacy risk assessment cover the same considerations","Privacy risk assessment must additionally analyze: the specific harms to individual employees from salary disclosure (financial harm from negotiating leverage loss, psychological harm from embarrassment, potential discrimination if salary disparities reveal protected characteristics), the vulnerability of the individuals affected (employees may have less power than the employer to protect themselves), and whether harm is to the individuals or only to the organization. Security risk focuses on organizational impact; privacy risk focuses on individual impact.","Privacy risk assessment is the same as security risk assessment with different terminology","Only GDPR-regulated organizations need to conduct privacy-specific risk assessments"],ans:1,explain:"This distinction illustrates ISO 27701&#8217;s fundamental contribution to risk management. A security risk assessment of the HR system scenario would identify: risk to the organization from regulatory sanction, reputational damage, and operational disruption. A privacy risk assessment additionally identifies: specific harms to individual employees from salary disclosure (financial consequences of others knowing their salary, psychological distress, potential for discrimination, negotiating leverage loss with the employer). ISO 27701 requires both perspectives because privacy law protects individuals, not just organizations, and risk treatment decisions must consider the impact on the people whose personal information is at stake."}
},
{
  title:"ISO 27701 Certification&#8212;The Audit Process",
  tagline:"How independent certification verifies PIMS implementation",
  body:`<p>ISO 27701 certification&#8212;the independently verified demonstration that an organization has implemented a functioning Privacy Information Management System&#8212;is achieved through a structured <span class="key-term">certification audit process</span> conducted by accredited certification bodies. Unlike self-assessment frameworks, ISO 27701 certification provides external verification that carries meaningful assurance to regulators, customers, and partners.</p>
  <div class="highlight-box"><strong>The ISO 27701 certification structure:</strong> ISO 27701 certification is typically issued as an extension to ISO 27001 certification, conducted by the same accredited certification body. The certification process consists of: Stage 1 audit (documentation review assessing whether the PIMS is designed appropriately), Stage 2 audit (implementation review assessing whether the PIMS is actually working as designed), surveillance audits (typically annual, verifying ongoing compliance), and recertification audits (every three years, comprehensive reassessment). The organization cannot pass Stage 2 or maintain surveillance audit compliance through documentation alone&#8212;auditors test actual implementation.</highlight-box>
  <div class="cheat-grid">
    <div class="cheat-pill"><strong>Stage 1&#8212;Documentation Review</strong><span>Auditors review documented information to assess whether the PIMS is properly designed: is the scope defined, is the privacy policy documented, are privacy risks assessed, are controls selected and documented, are Records of Processing Activities maintained, is the consent management process documented? Stage 1 identifies gaps in design that must be remediated before Stage 2 proceeds.</span></div>
    <div class="cheat-pill"><strong>Stage 2&#8212;Implementation Verification</strong><span>Auditors verify that the documented PIMS is actually implemented: interviews with staff at all levels test whether privacy controls are understood and practiced (not just documented), testing of systems verifies that technical controls function as described, review of records verifies that processes produce the evidence they should, and sampling of specific processing activities verifies compliance in practice.</span></div>
    <div class="cheat-pill"><strong>Scope and Its Implications</strong><span>The certification scope defines exactly what is and is not covered by the certificate. A certificate covering &#8220;HR data processing&#8221; does not cover customer data processing. Certification relying parties must understand the scope to know what assurance the certificate actually provides. Narrow scopes may be strategically chosen to achieve certification in lower-risk areas while building toward comprehensive coverage.</span></div>
    <div class="cheat-pill"><strong>Non-Conformities and Corrective Action</strong><span>Audit findings are categorized as major non-conformities (absence of a required control or systematic failure that prevents the PIMS from achieving its intended outcomes&#8212;must be remediated before certification is granted), minor non-conformities (isolated failures that don&#8217;t prevent overall effectiveness&#8212;must be remediated within defined timelines), and observations (opportunities for improvement without mandatory remediation timelines).</span></div>
    <div class="cheat-pill"><strong>Surveillance Audits</strong><span>Annual surveillance audits verify ongoing compliance between full recertification cycles. Surveillance audits typically cover: corrective action status from previous findings, changes to the PIMS scope or processing activities, management review effectiveness, internal audit program results, and sampling of specific controls. Surveillance audits can result in suspension of certification if significant non-conformities are found.</span></div>
    <div class="cheat-pill"><strong>Certification Body Accreditation</strong><span>ISO 27701 certifications are only meaningful if issued by accredited certification bodies&#8212;organizations that have themselves been assessed against ISO 17021 (requirements for certification bodies) by national accreditation bodies. Unaccredited certifications are commercially available but carry no meaningful assurance&#8212;organizations relying on certification for GDPR compliance evidence should verify the certification body&#8217;s accreditation status.</span></div>
  </div>`,
  quiz:{q:"An organization proudly displays their ISO 27701 certification to a GDPR supervisory authority as evidence of compliance. The certification was issued by a non-accredited certification body. What is the problem?",opts:["No problem&#8212;any ISO 27701 certification provides equivalent assurance","The certification may carry no meaningful assurance. ISO 27701 certification issued by a non-accredited body has not been subjected to the audit quality requirements that accreditation bodies enforce. Without accreditation, there is no independent verification that the auditor has the competence, independence, and methodology required for meaningful certification. GDPR&#8217;s Article 42 refers specifically to approved certification mechanisms&#8212;non-accredited certifications may not qualify.","Accreditation only matters for ISO 27001, not ISO 27701","The supervisory authority cannot question the validity of ISO certifications"],ans:1,explain:"ISO 27701 certification credibility depends entirely on the rigor of the certification body&#8217;s processes&#8212;and accreditation is the independent verification of that rigor. Accredited certification bodies are assessed against ISO 17021 requirements by national accreditation bodies, ensuring they have qualified auditors, documented methodologies, independence from client organizations, and quality management systems that produce reliable audit results. Non-accredited bodies have no independent verification of their quality or competence. For regulatory purposes&#8212;particularly GDPR Article 42 certification mechanisms&#8212;accreditation is essential for the certification to carry meaningful evidentiary weight."}
},
{
  title:"ISO 27701 and GDPR&#8212;The Compliance Connection",
  tagline:"How the standard maps to EU data protection requirements",
  body:`<p>ISO 27701 was developed with explicit attention to GDPR alignment&#8212;Annex D of the standard provides a normative mapping between ISO 27701 controls and specific GDPR articles and clauses. This alignment makes ISO 27701 one of the most powerful tools available for demonstrating systematic GDPR compliance. Understanding the connection&#8212;and its limits&#8212;is essential for organizations managing GDPR obligations.</p>
  <div class="highlight-box"><strong>GDPR Article 42&#8212;The Certification Gateway:</strong> GDPR explicitly anticipated the development of privacy certification mechanisms under Article 42, allowing organizations to use approved certification to demonstrate compliance with GDPR requirements. National supervisory authorities (the ICO in the UK, the CNIL in France, etc.) can approve certification mechanisms, and the European Data Protection Board (EDPB) can approve pan-European certification criteria. ISO 27701 certification&#8212;combined with the GDPR mapping in Annex D&#8212;is positioned to support this Article 42 pathway, though formal approval processes vary by member state.</highlight-box>
  <div class="gdpr-card"><b>GDPR Articles 13/14 (Transparency/Privacy Notices)</b> &#8594; ISO 27701 Annex B controls on providing privacy notices to PII principals. ISO 27701 requires the same information elements that GDPR Articles 13/14 specify, in accessible formats, at collection time. Implementing ISO 27701 privacy notice controls implements the specific notice requirements of Articles 13 and 14.</div>
  <div class="gdpr-card"><b>GDPR Article 17 (Right to Erasure)</b> &#8594; ISO 27701 controls on erasure/deletion of PII, including technical mechanisms for complete deletion across all systems including backups and downstream processors. ISO 27701&#8217;s erasure controls operationalize the right to erasure with specific technical and procedural requirements.</div>
  <div class="gdpr-card"><b>GDPR Article 25 (Privacy by Design and Default)</b> &#8594; ISO 27701 Section 7.4 and Annex B controls on Privacy by Design and privacy as the default setting. ISO 27701&#8217;s PbD controls directly implement Article 25&#8217;s requirements for data protection by design and by default at the product and system level.</div>
  <div class="gdpr-card"><b>GDPR Article 28 (Processor Requirements)</b> &#8594; ISO 27701 Annex C controls on PIP obligations. The Annex C controls implement the specific requirements for processors under Article 28, including processing only under controller instructions, security obligations, sub-processor management, and return/deletion of data.</div>
  <div class="gdpr-card"><b>GDPR Article 30 (Records of Processing Activities)</b> &#8594; ISO 27701 controls on maintaining Records of Processing Activities (RoPA). ISO 27701 requires the specific information elements that Article 30 specifies, providing a structured approach to maintaining the comprehensive processing records that GDPR requires.</div>
  <div class="gdpr-card"><b>GDPR Article 35 (Data Protection Impact Assessment)</b> &#8594; ISO 27701 controls on Privacy Impact Assessments (PIAs). ISO 27701&#8217;s PIA controls implement the DPIA requirements of Article 35&#8212;including when DPIAs are required, what they must contain, and how findings must be addressed.</div>
  <div class="warning-box"><strong>Important limitation:</strong> ISO 27701 certification does not equal GDPR compliance. GDPR has legal and procedural requirements that go beyond what a management system standard can address: lawful basis determination (a legal judgment, not a management system control), DPO appointment where required, supervisory authority notification requirements, and specific legal remedies for data subjects. ISO 27701 provides systematic evidence of compliance with GDPR&#8217;s technical and organizational requirements&#8212;it does not substitute for GDPR&#8217;s legal framework.</div>`,
  quiz:{q:"A GDPR supervisory authority is investigating a company for a potential GDPR violation related to inadequate security measures protecting customer personal data (Article 32). The company presents their ISO 27701 certification as their defense. How does this help their case?",opts:["It is irrelevant&#8212;the supervisory authority only accepts official GDPR compliance documentation","ISO 27701 certification provides evidence that the company has implemented a systematic Privacy Information Management System with controls specifically calibrated to protect personal information. Annex D maps ISO 27701 controls to GDPR obligations including Article 32 security requirements. The certification demonstrates documented, independently verified security measures&#8212;a meaningful evidentiary defense compared to self-attestation.","It provides complete immunity from GDPR enforcement","It only helps if the violation occurred in the first year after certification"],ans:1,explain:"ISO 27701 certification is valuable evidence in regulatory investigations precisely because it is independently verified. Unlike self-declared compliance, ISO 27701 certification documents that an accredited third party assessed the organization&#8217;s privacy management system&#8212;including the security controls required under GDPR Article 32&#8212;and found it conforming. While certification doesn&#8217;t guarantee a breach won&#8217;t occur (and doesn&#8217;t automatically satisfy GDPR), it demonstrates that the organization implemented systematic, appropriate technical and organizational measures&#8212;the standard GDPR Article 32 requires. Supervisory authorities consider documented evidence of systematic security measures as a significant mitigating factor in enforcement decisions."}
},
{
  title:"ISO 27701 and Other Privacy Frameworks",
  tagline:"How the standard fits within the global privacy compliance ecosystem",
  body:`<p>ISO 27701 does not exist in isolation&#8212;it operates alongside and in relationship with multiple other privacy frameworks, regulations, and standards. Understanding these connections enables GRC professionals to build integrated compliance programs where ISO 27701 implementation supports multiple privacy obligations simultaneously rather than requiring parallel programs for each framework.</p>
  <div class="cheat-grid">
    <div class="cheat-pill"><strong>ISO 27701 and ISO 27018</strong><span>ISO 27018 provides privacy controls specifically for public cloud PII processors. ISO 27701 is broader&#8212;applying to all organizations handling personal information regardless of cloud context. Organizations that are cloud processors can implement both: ISO 27701 for their overall PIMS and ISO 27018 for cloud-specific PII processor obligations. The standards are complementary, with ISO 27018 providing additional depth for cloud processing contexts within the ISO 27701 PIMS framework.</span></div>
    <div class="cheat-pill"><strong>ISO 27701 and NIST Privacy Framework</strong><span>NIST&#8217;s Privacy Framework (2020) provides a US-centric voluntary framework for managing privacy risk across five functions (Identify-P, Govern-P, Control-P, Communicate-P, Protect-P). ISO 27701 and the NIST Privacy Framework share common principles&#8212;organizations implementing both can map controls across frameworks, reducing the burden of parallel compliance programs. The key difference: ISO 27701 is certifiable; NIST PF is a voluntary self-assessment framework.</span></div>
    <div class="cheat-pill"><strong>ISO 27701 and CCPA/CPRA</strong><span>California&#8217;s Consumer Privacy Act (CCPA) and its 2023 update (CPRA) impose privacy obligations similar to but distinct from GDPR. ISO 27701 controls&#8212;particularly around consumer rights (access, deletion, portability, opt-out of sale), privacy notices, and vendor management&#8212;directly support CCPA/CPRA compliance. While ISO 27701 doesn&#8217;t include a CCPA mapping annex, the framework is sufficiently comprehensive to support CCPA compliance when implemented with California requirements in mind.</span></div>
    <div class="cheat-pill"><strong>ISO 27701 and LGPD</strong><span>Brazil&#8217;s Lei Geral de Prote&#231;&#227;o de Dados (LGPD) is closely modeled on GDPR and similarly addressed by ISO 27701&#8217;s control framework. Brazilian organizations processing personal data can use ISO 27701 implementation to demonstrate LGPD compliance, though LGPD-specific requirements (like the National Data Protection Authority&#8217;s specific guidance) may require additional attention beyond the ISO 27701 baseline.</span></div>
    <div class="cheat-pill"><strong>ISO 27701 and SOC 2 Privacy</strong><span>SOC 2&#8217;s Privacy Trust Services Criteria (TSC) and ISO 27701 have significant overlap in privacy governance, transparency, data subject rights support, and security measures. Organizations serving US markets (where SOC 2 is the dominant assurance framework) and international markets (where ISO 27701 is growing) can often design integrated programs where a single set of controls satisfies both frameworks&#8212;though SOC 2 audit reports and ISO 27701 certificates are distinct deliverables for their respective audiences.</span></div>
    <div class="cheat-pill"><strong>ISO 27701 and HIPAA</strong><span>HIPAA&#8217;s Privacy and Security Rules govern Protected Health Information in the US healthcare context. ISO 27701&#8217;s comprehensive privacy management framework is compatible with and supportive of HIPAA compliance, though HIPAA has specific technical and administrative safeguard requirements not directly addressed by ISO 27701. Healthcare organizations can use ISO 27701 as the overarching privacy management framework with HIPAA-specific controls layered on top.</span></div>
  </div>
  <div class="highlight-box"><strong>The multi-framework integration value:</strong> ISO 27701&#8217;s greatest practical value may be as an integration mechanism for organizations facing multiple privacy regulatory obligations simultaneously. The PIMS provides a systematic management structure within which compliance with GDPR, CCPA, LGPD, PIPEDA, and other regulations can be organized, monitored, and demonstrated. Rather than maintaining separate compliance programs for each regulation, the PIMS provides a single systematic approach with regulatory-specific controls layered on a common foundation. This integration is precisely the sophisticated GRC work that Jason&#8217;s credential stack is designed to enable.</div>`,
  quiz:{q:"A multinational organization faces privacy obligations under GDPR (EU), LGPD (Brazil), CCPA (California), and PDPA (Singapore). They are considering implementing ISO 27701. What is the most significant advantage for their specific situation?",opts:["ISO 27701 automatically satisfies all four regulations simultaneously through a single certification","ISO 27701 provides a unified management system framework within which compliance with all four regulations can be systematically organized, monitored, and demonstrated&#8212;replacing four parallel compliance programs with a single integrated PIMS that addresses shared requirements once and handles jurisdiction-specific requirements as documented extensions. This dramatically reduces compliance overhead and demonstrates systematic privacy management to regulators in all four jurisdictions.","ISO 27701 is only designed for GDPR&#8212;other regulations require separate frameworks","ISO 27701 requires separate PIMS implementations for each jurisdiction"],ans:1,explain:"This scenario illustrates ISO 27701&#8217;s most compelling value proposition for multinational organizations. Without a common framework, complying with four privacy regulations means four separate programs&#8212;four separate risk assessments, four separate control implementations, four separate audit programs, and four separate management review cycles. ISO 27701 provides a single systematic PIMS that addresses the common core of privacy management (purpose limitation, data subject rights, privacy by design, breach notification, vendor management) once, while documented extensions address jurisdiction-specific requirements. Regulators in all four jurisdictions can then rely on the same PIMS evidence, tailored with jurisdiction-specific documentation where required."}
},
{
  title:"ISO 27701 Implementation&#8212;A Practical Roadmap",
  tagline:"What it actually takes to build and certify a Privacy Information Management System",
  body:`<p>Implementing ISO 27701 is a significant organizational undertaking&#8212;typically 12-24 months from gap assessment to certification for organizations starting without ISO 27001. Organizations already holding ISO 27001 certification can move faster, but still face substantial work extending their ISMS to cover privacy. Understanding the realistic implementation journey is essential for planning, resourcing, and managing expectations.</p>
  <div class="cheat-grid">
    <div class="cheat-pill"><strong>Phase 1&#8212;Baseline and Gap Assessment</strong><span>Before implementing anything, assess where you are against ISO 27701 requirements: what personal information you process, on what legal bases, with what controls already in place, and where the gaps are relative to full ISO 27701 compliance. For ISO 27001 holders, the gap is primarily in privacy-specific controls. For organizations without ISO 27001, the gap includes the entire ISMS foundation. This assessment drives the implementation plan and timeline.</span></div>
    <div class="cheat-pill"><strong>Phase 2&#8212;Scope Definition</strong><span>Define the PIMS scope carefully: which processing activities, which business units, which personal information types, and which jurisdictions are within scope. Scope decisions have significant certification implications&#8212;narrower scopes enable faster initial certification but may limit the certificate&#8217;s value to certification relying parties. The scope should be strategically aligned with the business units and processing activities where privacy assurance is most commercially important.</span></div>
    <div class="cheat-pill"><strong>Phase 3&#8212;Records of Processing Activities</strong><span>Developing comprehensive RoPA documentation is typically the most labor-intensive early phase. Organizations must inventory every processing activity across all in-scope systems&#8212;often a multi-month discovery exercise involving interviews with business process owners across the organization. The RoPA forms the foundation for risk assessment, PIA scheduling, and control selection.</span></div>
    <div class="cheat-pill"><strong>Phase 4&#8212;Privacy Risk Assessment</strong><span>Conduct privacy risk assessments for all in-scope processing activities, identifying privacy risks to individuals from each processing activity. High-risk processing activities trigger PIA requirements. Risk assessment findings drive control selection and treatment decisions. Privacy risk assessment is iterative&#8212;new processing activities continuously trigger additional assessments.</span></div>
    <div class="cheat-pill"><strong>Phase 5&#8212;Control Implementation</strong><span>Implement the controls required by the PIMS: privacy notices updated to meet ISO 27701 requirements, consent management mechanisms implemented where consent is the lawful basis, data subject rights processes built and tested, Privacy by Design requirements integrated into SDLC, privacy training delivered to all staff, and vendor management processes established for sub-processors. Technical control implementation (encryption, access controls, audit logging) must also be validated.</span></div>
    <div class="cheat-pill"><strong>Phase 6&#8212;PIMS Operations and Maturation</strong><span>Before certification, the PIMS must be operational for a meaningful period (typically at least three to six months). The certification audit will examine records demonstrating that processes actually run&#8212;privacy training records, PIA documentation for high-risk processing, data subject rights request logs, vendor assessment records, and management review minutes. A PIMS that exists only in policy documents will fail Stage 2.</span></div>
    <div class="cheat-pill"><strong>Phase 7&#8212;Internal Audit and Management Review</strong><span>ISO 27701 requires internal audits of the PIMS and management review before certification. These internal reviews identify non-conformities for remediation before the certification audit&#8212;discovering problems internally is far better than having a certification auditor find them. Management review must demonstrate that leadership genuinely engages with privacy performance data, not just rubber-stamps a compliance report.</span></div>
    <div class="cheat-pill"><strong>Phase 8&#8212;Certification Audit</strong><span>The Stage 1 documentation review confirms the PIMS is designed appropriately. The Stage 2 implementation audit verifies it actually operates. Between the two stages, identified gaps must be remediated. After Stage 2, any non-conformities must be addressed within defined timelines. Certification is granted when the certification body is satisfied that the PIMS meets ISO 27701 requirements in both design and implementation.</span></div>
  </div>`,
  quiz:{q:"An organization achieves ISO 27701 certification in January. By March, they launch a new product that processes health data at scale&#8212;a new processing activity with significantly higher privacy risk than anything in their existing PIMS scope. Under ISO 27701&#8217;s continuous PIMS requirements, what must happen?",opts:["Nothing until the next surveillance audit in January of the following year","The new high-risk processing activity must be assessed against PIMS requirements immediately: a Privacy Impact Assessment is required before the processing begins, the RoPA must be updated to include the new activity, privacy risk assessment must be conducted, appropriate controls must be implemented, and the certification scope may need to be extended if the new activity is brought within the PIMS. Certification does not exempt organizations from ongoing PIMS management obligations.","The certification covers all organizational processing activities automatically&#8212;no action needed","A new ISO 27701 certification must be obtained from scratch for the new product"],ans:1,explain:"ISO 27701 certification is not a license to stop managing privacy&#8212;it certifies an ongoing management system. A new high-risk processing activity (health data at scale) requires immediate PIMS management: PIA before processing begins (Article 35 GDPR equivalent), RoPA update, privacy risk assessment, and control implementation. If the new activity is within the existing PIMS scope, these management activities are part of normal PIMS operations. If it expands the scope, the certification scope extension must be addressed with the certification body. Surveillance auditors will examine whether the new activity was properly integrated into the PIMS when they conduct the next annual audit."}
},
{
  title:"Common ISO 27701 Implementation Failures",
  tagline:"The gaps and pitfalls most frequently encountered in PIMS programs",
  body:`<p>After several years of ISO 27701 implementations, clear patterns of failure have emerged. These failures appear consistently across organizations at different stages of PIMS maturity&#8212;recognizing them enables GRC professionals to anticipate and address them before they become certification findings or regulatory problems.</p>
  <div class="cheat-grid">
    <div class="cheat-pill"><strong>Incomplete Records of Processing Activities</strong><span>The most common initial gap: organizations underestimate the scope of their personal information processing. Shadow IT systems, informal data sharing practices, embedded analytics tools, and third-party integrations are frequently missed in initial RoPA exercises. An incomplete RoPA means unmapped risks, unimplemented controls, and certification findings when auditors discover undocumented processing activities.</span></div>
    <div class="cheat-pill"><strong>Privacy Theater PIAs</strong><span>Conducting Privacy Impact Assessments as compliance checkbox exercises rather than genuine risk assessments. PIAs that always conclude &#8220;low risk&#8221; regardless of processing nature, that don&#8217;t examine harms to individuals, or that are completed after systems are already built and deployed are common findings. Certification auditors examine PIA quality&#8212;form-filling PIAs that never change processing decisions are red flags.</span></div>
    <div class="cheat-pill"><strong>Consent Management Failures</strong><span>Implementing consent mechanisms that don&#8217;t meet legal requirements: pre-ticked boxes (invalid under GDPR), bundled consent (agreeing to one thing means agreeing to everything), or consent withdrawal being harder than consent giving. Many organizations discover that their existing consent mechanisms require complete redesign when assessed against ISO 27701 requirements.</span></div>
    <div class="cheat-pill"><strong>Untested Data Subject Rights Processes</strong><span>Building data subject rights processes in policy without testing them operationally. Common discoveries during testing: the organization cannot identify all data locations containing a specific individual&#8217;s records, deletion is technically impossible from certain legacy systems, the export function produces unusable formats, and response times exceed regulatory requirements. These failures should be discovered through internal testing, not during a real rights request.</span></div>
    <div class="cheat-pill"><strong>Privacy Isolated from Business</strong><span>Implementing ISO 27701 as a compliance team project rather than a business integration initiative. Privacy by Design cannot function if developers build systems without privacy input. Data minimization cannot function if business users demand maximum data collection for analytics. Vendor management cannot function if procurement operates without privacy requirements. Privacy must be integrated into business processes&#8212;not added as a post-hoc compliance layer.</span></div>
    <div class="cheat-pill"><strong>Vendor Assessment Gaps</strong><span>Failing to identify and assess all vendors who process personal information on the organization&#8217;s behalf. Many organizations are surprised by the number of vendors that qualify as processors&#8212;including SaaS tools, analytics platforms, support ticketing systems, and IT infrastructure providers. Each processor relationship requires a Data Processing Agreement and an assessment of processor privacy practices.</span></div>
    <div class="cheat-pill"><strong>Scope Gaming</strong><span>Defining the PIMS scope so narrowly that the certification covers only low-risk processing activities while high-risk processing operates outside the PIMS. While limited scopes are legitimate for phased implementation, using scope exclusions to avoid certifying high-risk processing undermines the credibility and value of the certification. Relying parties may discover the scope doesn&#8217;t cover the processing they care about.</span></div>
    <div class="cheat-pill"><strong>Static Implementation</strong><span>Treating ISO 27701 as a one-time implementation project rather than a continuous management system. Privacy requirements change, processing activities evolve, new risks emerge, and regulations update. Organizations that achieve certification and then stop actively managing their PIMS will find it degrading toward non-compliance between surveillance audits&#8212;exactly what the PDCA cycle is designed to prevent.</span></div>
  </div>`,
  quiz:{q:"An organization&#8217;s ISO 27701 surveillance audit finds that they have not conducted any Privacy Impact Assessments in the 12 months since certification, despite launching three new products that process personal data. What is this likely to result in?",opts:["A minor observation&#8212;PIAs are recommended but not mandatory","At minimum a major non-conformity&#8212;ISO 27701 requires PIAs for high-risk processing activities before they begin. Not conducting PIAs for three new product launches that process personal data represents a systematic failure of the PIMS. Major non-conformities prevent surveillance audit from being passed and may trigger certification suspension if not remediated within the defined corrective action timeline.","A minor non-conformity requiring documentation updates only","A recommendation to conduct the missing PIAs at the next annual management review"],ans:1,explain:"Missing PIAs for new product launches is a systematic failure, not an isolated gap. ISO 27701 requires that privacy risk assessment (including PIAs for high-risk processing) be conducted before new processing activities begin&#8212;not after launch. Three consecutive launches without PIAs indicates that the PIMS&#8217; Privacy by Design and PIA processes are not functioning as designed. This is precisely what surveillance audits are designed to detect. Major non-conformities require remediation plans with defined timelines; systematic failures across multiple processing activities typically result in certification suspension until the PIMS is demonstrably back in compliance."}
},
{
  title:"ISO 27701 in Practice&#8212;Regulated Industries and Jason&#8217;s Context",
  tagline:"Applying the PIMS standard in healthcare, financial services, and government settings",
  body:`<p>ISO 27701&#8217;s principles apply across all industries, but their implementation varies significantly based on sector-specific regulatory requirements. Three regulated environments particularly relevant to Jason&#8217;s professional context at the VA illustrate how ISO 27701 integrates with sector-specific frameworks to create comprehensive privacy management.</p>
  <div class="highlight-box"><strong>The VA&#8217;s privacy landscape:</strong> The Department of Veterans Affairs processes some of the most sensitive personal information in the federal government: mental health records, substance abuse treatment records, military service records, disability determinations, and financial information for millions of veterans. The VA operates under a unique multi-framework privacy environment: FISMA (federal security requirements), HIPAA (health information privacy), the Privacy Act of 1974 (federal PII requirements), VA-specific privacy regulations, and increasingly relevant GDPR obligations for veterans located in Europe. ISO 27701&#8217;s PIMS framework provides a systematic structure for managing privacy obligations across all these frameworks simultaneously.</highlight-box>
  <div class="cheat-grid">
    <div class="cheat-pill"><strong>Healthcare&#8212;HIPAA and ISO 27701</strong><span>HIPAA&#8217;s Privacy Rule establishes specific requirements for Protected Health Information (PHI) that are directly addressed by ISO 27701 controls: notice of privacy practices (ISO 27701 privacy notices), patient rights (ISO 27701 data subject rights), uses and disclosures of PHI (ISO 27701 purpose limitation and disclosure controls), and Business Associate Agreements (ISO 27701 processor controls). Healthcare organizations implementing ISO 27701 often find it simultaneously advances HIPAA compliance.</span></div>
    <div class="cheat-pill"><strong>Healthcare&#8212;PHI and Special Categories</strong><span>ISO 27701&#8217;s special category data controls directly address health data handling&#8212;requiring enhanced protections, additional lawful basis requirements, and specific technical measures. Veterans&#8217; mental health records, substance abuse treatment records, and HIV status records fall under both HIPAA special protections and ISO 27701&#8217;s special category data requirements. The convergent requirements enable unified implementation.</span></div>
    <div class="cheat-pill"><strong>Financial Services&#8212;GLBA and ISO 27701</strong><span>The Gramm-Leach-Bliley Act (GLBA) Safeguards Rule requires financial institutions to implement comprehensive information security programs protecting customer financial information. ISO 27701&#8217;s PIMS framework addresses GLBA privacy requirements while its integration with ISO 27001 addresses Safeguards Rule security requirements. Combined ISO 27001/27701 certification supports both the privacy and security dimensions of GLBA compliance.</span></div>
    <div class="cheat-pill"><strong>Government&#8212;Privacy Act and ISO 27701</strong><span>The Privacy Act of 1974 imposes privacy obligations on federal agencies strikingly similar to GDPR&#8212;System of Records Notices (equivalent to privacy notices and RoPA), individual access rights, correction rights, and use limitation. ISO 27701&#8217;s PIC controls map closely to Privacy Act obligations. Federal agencies implementing ISO 27701 find it provides systematic structure for Privacy Act compliance that ad hoc approaches cannot match.</span></div>
    <div class="cheat-pill"><strong>Government&#8212;FISMA Privacy Integration</strong><span>FISMA 2014 integrated privacy requirements with information security management&#8212;requiring agencies to address privacy within their information security programs. ISO 27701 extends ISO 27001&#8217;s ISMS with privacy management in exactly the integrated manner FISMA requires. FedRAMP-authorized cloud services handling government personal data can use ISO 27701 as a framework for demonstrating privacy management beyond FedRAMP&#8217;s security focus.</span></div>
    <div class="cheat-pill"><strong>Multi-Framework Integration</strong><span>The key practical insight for regulated environments: ISO 27701&#8217;s PIMS provides the systematic management structure within which all applicable privacy frameworks can be organized. Rather than maintaining separate HIPAA compliance, Privacy Act compliance, GDPR compliance (for international data), and FISMA privacy compliance programs independently, the PIMS integrates all of these into a single documented, monitored, and auditable privacy management system. This integration is where ISO 27701 delivers its highest practical value in complex regulated environments.</span></div>
  </div>`,
  quiz:{q:"A VA data analyst wants to use veteran health data for a research project analyzing treatment outcomes. They need to understand the applicable privacy framework before proceeding. Which frameworks govern this use of veteran health data?",opts:["Only HIPAA&#8212;healthcare research is exclusively governed by HIPAA","Multiple frameworks apply: HIPAA (PHI in research requires IRB approval, authorization waiver, or de-identification), the Privacy Act of 1974 (federal records have specific use limitations and require compatible purpose analysis), FISMA privacy provisions (the information system handling the research data must comply with FISMA privacy requirements), and if the veteran is located in Europe, GDPR may also apply. An ISO 27701 PIMS provides the systematic structure for navigating all these frameworks consistently.","Only the Privacy Act&#8212;all VA data is federal records subject exclusively to Privacy Act","GDPR applies to all VA research data because veterans are protected persons"],ans:1,explain:"VA health data research exemplifies the multi-framework privacy challenge that complex government healthcare organizations face. HIPAA governs the PHI and requires specific authorizations or exceptions for research use. The Privacy Act governs federal records and requires compatible purpose analysis and potentially SORNs for the research database. FISMA requires the research system to meet federal information security and privacy requirements. If any research participants are located in EU member states (possible for veterans stationed in Europe), GDPR may also apply. ISO 27701&#8217;s PIMS provides the systematic framework for documenting compliance with all applicable requirements rather than managing them as disconnected obligations."}
},
{
  title:"30-Day Review",
  tagline:"Everything we covered&#8212;in one final look",
  body:`<p>You have completed all 30 days of ISO/IEC 27701! Let&#8217;s take a final inventory of what you now know about the world&#8217;s first certifiable Privacy Information Management System standard.</p>
  <div class="tag-header">The Big Picture</div>
  <p>ISO/IEC 27701 is an international standard (published August 2019 by ISO/IEC JTC 1, SC 27) that extends ISO 27001 and ISO 27002 to establish requirements and guidance for a Privacy Information Management System (PIMS). It is the world&#8217;s first international standard offering direct certification of a privacy management system. Organizations must have ISO 27001 as a prerequisite. Addresses both Privacy Information Controllers (PICs) and Privacy Information Processors (PIPs) through separate control annexes. Closely aligned with GDPR through Annex D mapping. Designed for global applicability across all privacy regulatory frameworks.</p>
  <div class="tag-header">Structural Components</div>
  <div class="badge-row">
    <span class="badge badge-indigo">Clauses 4-10: Extended ISO 27001 management system requirements</span>
    <span class="badge badge-indigo">Section 7: Universal privacy controls (all organizations)</span>
    <span class="badge badge-indigo">Annex A: Extended ISO 27002 security controls with privacy guidance</span>
    <span class="badge badge-indigo">Annex B: PIC-specific controls (controllers)</span>
    <span class="badge badge-indigo">Annex C: PIP-specific controls (processors)</span>
    <span class="badge badge-indigo">Annex D: GDPR mapping (normative)</span>
  </div>
  <div class="tag-header">PIC Key Controls (Annex B)</div>
  <div class="badge-row">
    <span class="badge badge-indigo">Lawful basis for all processing activities</span>
    <span class="badge badge-indigo">Consent management (freely given, specific, withdrawable)</span>
    <span class="badge badge-indigo">Records of Processing Activities (RoPA)</span>
    <span class="badge badge-indigo">Comprehensive privacy notices (plain language, at collection)</span>
    <span class="badge badge-indigo">Data subject rights (access, rectification, erasure, portability)</span>
    <span class="badge badge-indigo">Privacy by Design and Privacy as Default</span>
    <span class="badge badge-indigo">Privacy Impact Assessments (high-risk processing)</span>
  </div>
  <div class="tag-header">PIP Key Controls (Annex C)</div>
  <div class="badge-row">
    <span class="badge badge-blue">Process only under controller agreement and instructions</span>
    <span class="badge badge-blue">Assist controller in fulfilling data subject rights</span>
    <span class="badge badge-blue">Sub-processor management and notification</span>
    <span class="badge badge-blue">Breach notification to controller without undue delay</span>

    <span class="badge badge-teal">ISO 27002 &#8212; security controls extended with privacy guidance</span>
    <span class="badge badge-rose">ISO 27018 &#8212; cloud privacy companion (more specific for cloud processors)</span>
    <span class="badge badge-blue">GDPR &#8212; Annex D normative mapping, Article 42 certification pathway</span>
    <span class="badge badge-amber">NIST Privacy Framework &#8212; US voluntary framework with aligned principles</span>
    <span class="badge badge-slate">HIPAA / Privacy Act &#8212; sector-specific US healthcare/government frameworks</span>
    <span class="badge badge-cyan">SOC 2 Privacy &#8212; US-market complement with significant control overlap</span>
  </div>
  <div class="highlight-box">Hit the green CS button above to access your complete ISO 27701 cheat sheet with all structural components, PIC controls, PIP controls, Section 7 universal controls, GDPR mapping, and framework relationships in one comprehensive reference.</div>`,
  quiz:{q:"What is ISO 27701&#8217;s single most important contribution to the global privacy management landscape?",opts:["It defined personally identifiable information for the first time internationally","It created the world&#8217;s first certifiable Privacy Information Management System standard&#8212;enabling independent, accredited third-party certification of an organization&#8217;s privacy management practices. This transforms privacy from self-declared compliance into independently verified accountability, giving regulators, customers, and partners a reliable basis for trusting organizational privacy commitments.","It established the maximum fine amounts for privacy violations globally","It replaced GDPR as the EU&#8217;s primary privacy regulation"],ans:1,explain:"ISO 27701&#8217;s historic contribution is creating the first international pathway for certifiable privacy management. Before ISO 27701, organizations could implement privacy best practices, write comprehensive privacy policies, and declare themselves GDPR compliant&#8212;but none of these could be independently certified. ISO 27701&#8217;s extension of ISO 27001&#8217;s established certification model to privacy management creates verifiable privacy accountability that regulators can rely on (GDPR Article 42), customers can verify, and partners can use in supplier due diligence. This transformation from self-declared to independently certified privacy management is ISO 27701&#8217;s defining contribution."}
},
{
  title:"ISO 27701 Cheat Sheet",
  tagline:"Your complete quick-reference guide",
  isCheatSheet:true,
  body:`
  <div class="cheat-section">
    <h3>What Is ISO/IEC 27701?</h3>
    <p style="font-size:13.5px;color:#6b6b68">ISO/IEC 27701 &#8212; &#8220;Security Techniques &#8212; Extension to ISO/IEC 27001 and ISO/IEC 27002 for Privacy Information Management &#8212; Requirements and Guidelines.&#8221; Published August 2019 by ISO/IEC JTC 1, Subcommittee 27 (SC 27). Extends ISO 27001 (ISMS requirements) and ISO 27002 (security controls) to establish a Privacy Information Management System (PIMS). The world&#8217;s first international standard offering direct certification of a privacy management system. ISO 27001 is a mandatory prerequisite&#8212;organizations must have ISO 27001 before implementing ISO 27701. Addresses both Privacy Information Controllers (PICs) and Privacy Information Processors (PIPs). Closely aligned with GDPR through Annex D normative mapping. Designed for global applicability across all privacy regulatory frameworks. Certification is issued as an extension to ISO 27001 certification by accredited certification bodies.</p>
  </div>
  <div class="cheat-section">
    <h3>Key Roles</h3>
    <div class="control-row">
      <div class="ctrl-card"><b>PII Principal</b> &#8212; The individual whose personal information is processed. ISO 27701&#8217;s protections exist for PII principals. Equivalent to GDPR&#8217;s &#8220;data subject.&#8221;</div>
      <div class="ctrl-card"><b>Privacy Information Controller (PIC)</b> &#8212; Determines purposes and means of processing personal information. Bears primary legal accountability. Must implement Annex B controls. Equivalent to GDPR &#8220;controller.&#8221;</div>
      <div class="ctrl-card"><b>Privacy Information Processor (PIP)</b> &#8212; Processes personal information on behalf of and under instructions from a PIC. Must implement Annex C controls. Equivalent to GDPR &#8220;processor.&#8221;</div>
      <div class="ctrl-card"><b>Many organizations are BOTH</b> &#8212; PIC for their own employee/customer data; PIP for client data they process on instructions. Both Annex B and Annex C controls apply in dual-role situations.</div>
    </div>
  </div>
  <div class="cheat-section">
    <h3>ISO 27701 Structure</h3>
    <div class="control-row">
      <div class="ctrl-card"><b>Clauses 4-10 (Extended ISO 27001)</b> &#8212; Every ISO 27001 management system clause extended with privacy-specific requirements. Context, Leadership, Planning, Support, Operations, Performance Evaluation, and Improvement all gain privacy content.</div>
      <div class="ctrl-card"><b>Section 7.2-7.5 (Universal Privacy Controls)</b> &#8212; Controls applying to all organizations regardless of PIC/PIP role. Covers: conditions for PII collection, obligations to PII principals, Privacy by Design, PII de-identification, and privacy compliance monitoring.</div>
      <div class="ctrl-card"><b>Annex A (Extended ISO 27002)</b> &#8212; Privacy-specific implementation guidance for each relevant ISO 27002 security control, showing how security controls should be applied when protecting privacy.</div>
      <div class="ctrl-card"><b>Annex B (PIC Controls)</b> &#8212; Controls specifically for Privacy Information Controllers: lawful basis, consent management, RoPA, privacy notices, data subject rights, PIAs, purpose limitation, special category data.</div>
      <div class="ctrl-card"><b>Annex C (PIP Controls)</b> &#8212; Controls specifically for Privacy Information Processors: processing under controller agreement, PIP obligations to PIC, sub-processor management, breach notification to controller, data return and deletion.</div>
      <div class="ctrl-card"><b>Annex D (GDPR Mapping&#8212;Normative)</b> &#8212; Maps ISO 27701 controls to specific GDPR articles and clauses. Enables organizations to demonstrate which ISO 27701 controls implement which GDPR requirements. Most practically valuable annex for EU-regulated organizations.</div>
    </div>
  </div>
  <div class="cheat-section">
    <h3>PIC Key Controls (Annex B)</h3>
    <div class="control-row">
      <div class="ctrl-card"><b>Lawful Basis</b> &#8212; Document lawful basis for every processing activity before processing begins. Maintain in RoPA. Where consent is the basis, implement compliant consent management (freely given, specific, informed, unambiguous, withdrawable).</div>
      <div class="ctrl-card"><b>Records of Processing Activities (RoPA)</b> &#8212; Comprehensive inventory: purpose, categories of PII, categories of individuals, legal basis, retention period, recipients, international transfers. Foundation for risk assessment and control selection.</div>
      <div class="ctrl-card"><b>Privacy Notices</b> &#8212; Plain language, at time of collection, covering: who collects, what, why, legal basis, who it&#8217;s shared with, retention period, individual rights, international transfers, how to exercise rights. Layered approach recommended.</div>
      <div class="ctrl-card"><b>Data Subject Rights</b> &#8212; Implement operationally effective processes for: access (respond within regulatory timelines), rectification (propagate to all copies), erasure (actual deletion from all systems), portability (structured, machine-readable formats), restriction of processing.</div>
      <div class="ctrl-card"><b>Privacy by Design</b> &#8212; Privacy requirements identified at design stage. Data minimization is a design constraint. Privacy as default setting. PIAs for high-risk processing before deployment&#8212;not after. PbD integrated into SDLC.</div>
      <div class="ctrl-card"><b>Privacy Impact Assessments</b> &#8212; Required for high-risk processing: systematic profiling, large-scale special category data, systematic monitoring, new technologies. Must: describe processing, assess necessity/proportionality, assess risks to individuals, specify risk measures. Genuine risk assessment&#8212;not form-filling.</div>
    </div>
  </div>
  <div class="cheat-section">
    <h3>PIP Key Controls (Annex C)</h3>
    <div class="control-row">
      <div class="ctrl-card"><b>Controller Agreement Required</b> &#8212; Process personal information only under documented agreement with PIC and strictly according to PIC instructions. No unauthorized processing. Document which activities are authorized under each agreement.</div>
      <div class="ctrl-card"><b>Support Controller Obligations</b> &#8212; Notify controller of received data subject rights requests. Assist controller in fulfilling those rights. Notify controller of breaches without undue delay. Provide compliance evidence on request. Assist with PIAs where required.</div>
      <div class="ctrl-card"><b>Sub-Processor Management</b> &#8212; No sub-processors without prior controller authorization (specific or general). Notify controller of intended sub-processor changes with opportunity to object. Sub-processors bound by same obligations as main processor. Contractual flow-down required.</div>
      <div class="ctrl-card"><b>Breach Notification to Controller</b> &#8212; Notify controller &#8220;without undue delay&#8221; of any personal information breach. Sufficient detail for controller to assess and fulfill their own notification obligations (e.g., 72-hour GDPR notification chain). Do not wait for investigation completion before initial notification.</div>
      <div class="ctrl-card"><b>Data Return and Deletion</b> &#8212; At contract end: return all personal information to controller and/or delete all copies including backups. Provide deletion evidence/certificate. Cannot retain beyond agreement term without explicit controller authorization.</div>
      <div class="ctrl-card"><b>Processor Records of Processing</b> &#8212; Maintain records of all processing activities carried out on behalf of each controller: controller identity, categories of processing, international transfers, technical and organizational security measures. Complements controller&#8217;s own RoPA.</div>
    </div>
  </div>
  <div class="cheat-section">
    <h3>GDPR Key Mappings (Annex D)</h3>
    <div class="control-row">
      <div class="ctrl-card"><b>Articles 13/14 (Privacy Notices)</b> &#8592; ISO 27701 Annex B privacy notice controls</div>
      <div class="ctrl-card"><b>Article 17 (Right to Erasure)</b> &#8592; ISO 27701 erasure/deletion controls</div>
      <div class="ctrl-card"><b>Article 25 (Privacy by Design)</b> &#8592; ISO 27701 Section 7.4 and Annex B PbD controls</div>
      <div class="ctrl-card"><b>Article 28 (Processor Requirements)</b> &#8592; ISO 27701 Annex C PIP controls</div>
      <div class="ctrl-card"><b>Article 30 (Records of Processing)</b> &#8592; ISO 27701 RoPA controls</div>
      <div class="ctrl-card"><b>Article 35 (DPIA)</b> &#8592; ISO 27701 Privacy Impact Assessment controls</div>
    </div>
  </div>
  <div class="cheat-section">
    <h3>Framework Relationships</h3>
    <div class="control-row">
      <div class="ctrl-card"><b>ISO 27001</b> &#8212; Mandatory prerequisite ISMS. ISO 27701 is an extension; cannot be implemented without ISO 27001. Certification audit integrated with ISO 27001 surveillance/certification cycle. ISO 27701 extends every ISO 27001 clause.</div>
      <div class="ctrl-card"><b>ISO 27002</b> &#8212; Security control catalog extended by ISO 27701 Annex A with privacy-specific implementation guidance for each relevant security control.</div>
      <div class="ctrl-card"><b>ISO 27018</b> &#8212; Cloud PII processor privacy controls. More specific than ISO 27701 for cloud contexts. Organizations can implement both: ISO 27701 as the PIMS framework, ISO 27018 as additional cloud-specific depth.</div>
      <div class="ctrl-card"><b>GDPR</b> &#8212; Normative Annex D mapping. ISO 27701 certification supports GDPR Article 42 certification pathway. Strong alignment with Articles 5, 13-22, 25, 28, 30, 32, 35. Not a complete GDPR compliance solution&#8212;legal framework elements also required.</div>
      <div class="ctrl-card"><b>NIST Privacy Framework</b> &#8212; US voluntary framework with aligned privacy principles. Both can be implemented; ISO 27701 is certifiable (stronger regulatory evidence), NIST PF is self-assessment. Significant control mapping overlap.</div>
      <div class="ctrl-card"><b>HIPAA / Privacy Act</b> &#8212; US sector-specific healthcare and federal government privacy requirements. ISO 27701 PIMS provides systematic structure for managing compliance with both. Significant control overlap enables integrated implementation.</div>
    </div>
  </div>
  <div class="cheat-section">
    <h3>Key Facts and Numbers</h3>
    <div class="badge-row">
      <span class="badge badge-indigo">Published: August 2019</span>
      <span class="badge badge-indigo">Publisher: ISO/IEC JTC 1, Subcommittee 27 (SC 27)</span>
      <span class="badge badge-indigo">World&#8217;s first certifiable PIMS standard</span>
      <span class="badge badge-indigo">ISO 27001 is a mandatory prerequisite</span>
      <span class="badge badge-indigo">Extends every ISO 27001 clause with privacy requirements</span>
      <span class="badge badge-indigo">Annex B: PIC controls; Annex C: PIP controls; Annex D: GDPR mapping</span>
      <span class="badge badge-indigo">PDCA cycle: Plan-Do-Check-Act continuous improvement</span>
      <span class="badge badge-indigo">Certification: Stage 1 (documentation) + Stage 2 (implementation) + annual surveillance + 3-year recertification</span>
      <span class="badge badge-indigo">Certification bodies must be accredited (ISO 17021)</span>
      <span class="badge badge-indigo">GDPR Article 42: ISO 27701 certification supports privacy compliance demonstration</span>
      <span class="badge badge-indigo">Scope flexibility: can be scoped to specific processing activities or business units</span>
      <span class="badge badge-indigo">PIAs required: systematic profiling, large-scale special category data, systematic monitoring, new technologies</span>
      <span class="badge badge-indigo">Most common failure: incomplete Records of Processing Activities</span>
      <span class="badge badge-indigo">PbD principle: Privacy as default setting&#8212;most protective option without individual action</span>
      <span class="badge badge-indigo">ISO 27701 certification &#8800; GDPR compliance (legal framework also required)</span>
    </div>
  </div>`
}
];

let current = 0;

function buildGrid(){
  const g = document.getElementById('dayGrid');
  g.innerHTML = '';
  for(let i = 0; i < days.length; i++){
    const b = document.createElement('button');
    b.className = 'day-pip' + (days[i].isCheatSheet ? ' cheat' : '') + (i === current ? ' active' : '');
    b.textContent = days[i].isCheatSheet ? 'CS' : (i+1);
    b.title = days[i].title;
    b.onclick = (()=>{ const idx=i; return ()=>goTo(idx); })();
    g.appendChild(b);
  }
}

function goTo(idx){ current=idx; render(); }
function changeDay(dir){ current=Math.max(0,Math.min(days.length-1,current+dir)); render(); }

function render(){
  const d=days[current];
  const total=days.length;
  document.getElementById('dayCounter').textContent=(current+1)+' / '+total;
  document.getElementById('prevBtn').disabled=current===0;
  document.getElementById('nextBtn').disabled=current===total-1;
  document.getElementById('progBar').style.width=(((current+1)/total)*100)+'%';
  buildGrid();

  if(d.isCheatSheet){
    document.getElementById('lessonArea').innerHTML=`
      <div class="card">
        <div class="lesson-header">
          <div class="day-badge" style="background:#E1F5EE">
            <div class="day-num" style="color:#085041;font-size:14px">CHEAT</div>
            <div class="day-lbl" style="color:#0F6E56">SHEET</div>
          </div>
          <div class="lesson-meta">
            <h2>${d.title}</h2>
            <div class="tagline">${d.tagline}</div>
          </div>
        </div>
        <div class="lesson-body">${d.body}</div>
      </div>`;
    return;
  }

  const quizId='quiz_'+current;
  let quizHtml='';
  if(d.quiz){
    const optsHtml=d.quiz.opts.map((o,i)=>
      `<button class="quiz-btn" onclick="checkAnswer(${i},${d.quiz.ans},'${quizId}')">${o}</button>`
    ).join('');
    quizHtml=`<div class="quiz-box">
      <p>Quick check: ${d.quiz.q}</p>
      <div>${optsHtml}</div>
      <div class="answer-reveal" id="${quizId}"></div>
    </div>`;
  }

  document.getElementById('lessonArea').innerHTML=`
    <div class="card">
      <div class="lesson-header">
        <div class="day-badge">
          <div class="day-num">${current+1}</div>
          <div class="day-lbl">Day</div>
        </div>
        <div class="lesson-meta">
          <h2>${d.title}</h2>
          <div class="tagline">${d.tagline}</div>
        </div>
      </div>
      <div class="section-label">Today&#8217;s lesson</div>
      <div class="lesson-body">${d.body}</div>
      ${quizHtml}
    </div>`;
}

function checkAnswer(chosen,correct,qid){
  const el=document.getElementById(qid);
  const d=days[current];
  if(!d.quiz) return;
  const isRight=chosen===correct;
  el.innerHTML='<strong>'+(isRight?'Correct!':'Not quite.')+'</strong> '+d.quiz.explain;
  el.className='answer-reveal show';
  el.style.background=isRight?'#EAF3DE':'#EDE9FE';
  el.style.borderColor=isRight?'#3B6D11':'#5B21B6';
  el.style.color='#1a1a18';
}

render();
</script>
</body>
</html>
