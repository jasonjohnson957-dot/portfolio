    quiz: { q: "A company using cloud-hosted databases discovers that their CSP's standard service level doesn't include backup — backups must be separately configured and are the customer's responsibility. They have never configured backups. Under ISO 27017's operations security guidance, what principle was not followed when adopting the cloud service?", opts: ["The CSP is responsible for all backups regardless of what the service level says", "The company failed to understand and document the shared responsibility for backup — ISO 27017 emphasizes that customers must understand which operational security functions are their responsibility in cloud environments and must actively implement those functions. Assuming backup is included without verification is a common cloud operations security failure.", "Backup requirements only apply when using cloud storage services, not database services", "This is a business continuity issue, not a security issue covered by ISO 27017"], ans: 1, explain: "ISO 27017's operations security guidance explicitly addresses the need for customers to understand which operational functions — including backup and recovery — are their responsibility in cloud shared responsibility models. Many cloud services don't include backup as a default service feature; customers must configure and manage their own backups or purchase supplementary backup services. Discovering this gap after data loss is a critical failure that ISO 27017's shared responsibility documentation requirements are designed to prevent — customers should verify backup coverage before cloud adoption, not after an incident." }
  },
  {
    title: "Extended Controls — Communications Security and Incident Response",
    tagline: "Securing data in motion and responding to security events in cloud environments",
    body: `<p>Two more critical domains where ISO 27017 extends existing ISO 27002 controls: <span class="key-term">communications security</span> — protecting data as it moves through cloud environments and between the cloud and users — and <span class="key-term">incident response</span> — managing security events effectively in environments where the customer doesn't control the underlying infrastructure.</p>
    <div class="highlight-box"><strong>Communications security in cloud — why it's different:</strong> In traditional IT, an organization controls its own network and can implement whatever communications security measures it chooses. In cloud environments, data flows through networks the customer doesn't control — between the customer's on-premise systems and the cloud, between cloud services within the provider's infrastructure, and between the cloud and end users. ISO 27017 addresses communications security across all these dimensions, emphasizing that protection must extend throughout the entire data flow, not just at the boundaries the customer directly controls.</highlight-box>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Encryption of Data in Transit</strong><span>All data in transit between cloud services and users, between cloud environments and on-premise systems, and between different cloud services must be encrypted using current standards (TLS 1.2 minimum, TLS 1.3 preferred). ISO 27017 emphasizes that "default" TLS configurations in cloud services should be verified — CSP defaults may allow deprecated protocol versions or weak cipher suites that customer-controlled systems wouldn't permit.</span></div>
      <div class="cheat-pill"><strong>Network Separation</strong><span>Cloud service customers should implement virtual network separation to isolate different types of workloads and data — similar to network segmentation in on-premise environments. Virtual Private Clouds (VPCs), subnets, and network security groups enable customers to create isolated network zones within cloud environments, limiting the blast radius if one workload is compromised.</span></div>
      <div class="cheat-pill"><strong>API Security</strong><span>Cloud services are API-driven — security of the APIs used to manage and access cloud services is a critical communications security concern. ISO 27017 guidance addresses API authentication (strong authentication required, no API key sharing), API authorization (principle of least privilege for API permissions), and API activity monitoring (detecting anomalous API usage patterns).</span></div>
    </div>
    <div class="highlight-box"><strong>Incident response in cloud — the coordination challenge:</strong> When a security incident occurs in a cloud environment, the response requires coordination between the CSP and the CSC — each of whom may have visibility into different aspects of the incident. The CSP can see infrastructure-level events (network anomalies, hypervisor alerts, storage access patterns); the customer can see application-level events (user behavior, data access patterns, business context). Effective cloud incident response requires pre-established coordination procedures between both parties.</highlight-box>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Incident Reporting by CSPs</strong><span>CSPs must have defined procedures for notifying customers when security incidents occur that affect the customer's cloud environment or data. The notification must be timely (important for data breach notification law compliance), include enough detail for the customer to assess impact, and explain what the CSP is doing to respond. Silence from the CSP during an incident is not acceptable.</span></div>
      <div class="cheat-pill"><strong>Customer Incident Response Capability</strong><span>Cloud service customers must maintain incident response capability for incidents within their cloud environments — they cannot rely on the CSP to manage incidents in the customer's application layer. This includes: IR procedures specific to cloud services used, contacts at the CSP for incident escalation, procedures for evidence preservation in cloud environments (logs, snapshots), and communication procedures for cloud incidents.</span></div>
    </div>`,
    quiz: { q: "During a security incident, a company's incident response team needs forensic evidence from their cloud environment — specifically, access logs from the past 90 days and point-in-time snapshots of affected virtual machines. They discover the CSP retains logs for only 30 days by default and doesn't retain VM snapshots. What should have been established before this incident?", opts: ["Nothing — 30 days of logs is standard and sufficient for most investigations", "Contractual and technical arrangements for adequate log retention (typically 90+ days for security investigations) and snapshot capabilities should have been established before cloud adoption. ISO 27017's incident response guidance requires pre-incident planning including evidence preservation capabilities — discovering retention limitations during an active incident severely constrains the investigation.", "The customer can request that the CSP retroactively extend log retention for incident investigation", "Log retention beyond 30 days is only needed for regulated industries"], ans: 1, explain: "ISO 27017's incident response and operations security guidance emphasizes pre-incident planning including evidence preservation capabilities. Standard CSP log retention defaults are often insufficient for security investigations — 30 days may not capture the initial compromise phase of an attack that was only detected much later. Customers need to negotiate extended log retention in service agreements, configure enhanced retention where available, and potentially export logs to customer-controlled storage for extended retention. Discovering this limitation during an active incident, when retroactive evidence is already lost, represents a failure of pre-incident planning." }
  },
  {
    title: "Supplier Relationships and Cloud Service Agreements",
    tagline: "What security requirements must be in cloud contracts under ISO 27017",
    body: `<p>ISO 27017 places significant emphasis on what must be established in <span class="key-term">cloud service agreements</span> — the contracts and security schedules that govern the relationship between CSPs and CSCs. The standard recognizes that many cloud security controls depend on contractual commitments from the CSP and that customers who don't negotiate adequate contractual protections cannot achieve the security outcomes ISO 27017 requires.</p>
    <div class="highlight-box"><strong>Why cloud contracts are security documents:</strong> In cloud environments, the contract is often the customer's primary mechanism for ensuring the CSP implements required security controls. Unlike on-premise environments where the customer can directly observe and verify security implementations, cloud customers must rely on contractual commitments, audit rights, and third-party attestations to verify CSP security practices. A cloud service agreement that doesn't address security comprehensively is a security gap, not just a legal gap.</highlight-box>
    <p>Security elements that ISO 27017 indicates should be addressed in cloud service agreements:</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Shared Responsibility Documentation</strong><span>The service agreement should explicitly document which security responsibilities belong to the CSP and which to the CSC, ideally through a shared responsibility matrix. Ambiguity in the agreement creates security gaps when both parties assume the other is handling a security function.</span></div>
      <div class="cheat-pill"><strong>Security Incident Notification</strong><span>The agreement must specify: what types of security incidents trigger customer notification, how quickly notification must occur (important for regulatory breach notification compliance), what information must be included in notifications, and what escalation paths exist for critical incidents. Vague notification requirements lead to delayed or inadequate incident communication.</span></div>
      <div class="cheat-pill"><strong>Audit Rights</strong><span>Customers should have contractual rights to audit (directly or through third parties) the CSP's security controls. In practice, most large CSPs substitute third-party attestations (SOC 2 Type II, ISO 27001 certification, CSA STAR) for customer-specific audits. The agreement should specify what audit evidence the CSP will provide and at what frequency.</span></div>
      <div class="cheat-pill"><strong>Data Location and Sovereignty</strong><span>The agreement must specify where customer data will be stored and processed — which geographic regions and countries. This is essential for data protection law compliance (GDPR requires adequate protection for EU data, various national laws require data to remain in-country). Data replication, backup, and disaster recovery locations must also be specified.</span></div>
      <div class="cheat-pill"><strong>Data Return and Deletion</strong><span>The agreement must address what happens to customer data at contract termination: how the customer can retrieve their data (format, timing, cost), how the CSP will verify complete data deletion from all systems (including backups), and what certificate of deletion the CSP will provide. "Right to data portability and deletion" must be contractually established before it's needed.</span></div>
      <div class="cheat-pill"><strong>Sub-Processing and Third Parties</strong><span>CSPs often use sub-processors — third-party services that process customer data as part of service delivery. The agreement should identify known sub-processors, establish the CSP's responsibility for sub-processor security, and specify notification requirements when new sub-processors are introduced. Unknown sub-processors are a significant supply chain risk.</span></div>
    </div>`,
    quiz: { q: "A company realizes at contract expiration that their cloud service agreement doesn't specify how their data will be returned or deleted. The CSP's standard terms say they will 'make reasonable efforts to delete data within 90 days.' What risk does this create?", opts: ["No significant risk — 90 days is a standard and acceptable deletion timeframe", "Significant regulatory and security risk: without clear deletion procedures and a certificate of deletion, the company cannot demonstrate GDPR compliance (which requires data to be deleted upon legitimate request), cannot confirm sensitive data is removed from CSP systems, and has no recourse if deletion is incomplete. ISO 27017 requires these procedures be established in the service agreement.", "The risk only matters if the company handles personally identifiable information", "Only the return of data is important — how the CSP handles deletion after return is the CSP's business"], ans: 1, explain: "Vague data deletion terms create significant compliance and security risks. Under GDPR and similar regulations, organizations must be able to demonstrate that personal data is deleted in accordance with retention schedules and upon request. 'Reasonable efforts within 90 days' without specific procedures, verification, or certification doesn't satisfy this. ISO 27017's supplier relationship guidance requires that data return and deletion procedures be clearly specified in cloud service agreements — before contract termination, not after. Organizations discovering this gap at termination often find themselves in difficult positions: unable to verify deletion, unable to meet regulatory requirements, and with limited contractual leverage." }
  },
  {
    title: "Data Classification and Governance in Cloud Environments",
    tagline: "Knowing what you have, where it is, and how to protect it appropriately",
    body: `<p><span class="key-term">Data classification and governance</span> is foundational to effective cloud security — you cannot protect cloud data appropriately if you don't know what data you have, how sensitive it is, and where in your cloud environment it resides. ISO 27017 extends ISO 27002's information classification controls with cloud-specific considerations, recognizing that data governance challenges multiply in cloud environments where data can be stored, replicated, and processed in many locations simultaneously.</p>
    <div class="highlight-box"><strong>Why data classification is harder in cloud:</strong> In on-premise environments, data typically resides in defined systems that IT knows about and can catalog. In cloud environments, data can proliferate across storage services, databases, analytics platforms, backup systems, development environments, and more — often in ways that weren't planned and aren't tracked. A cloud storage bucket created by a developer for a temporary project might contain sensitive customer data months later. ISO 27017 emphasizes that organizations must actively govern data in cloud environments rather than assuming cloud configurations match original intentions.</highlight-box>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Cloud Data Inventory</strong><span>Organizations must maintain an inventory of data stored in cloud environments — what types of data, in which cloud services and locations, at what classification levels. This inventory must be actively maintained as cloud data environments grow and change. Automated data discovery tools that scan cloud storage and databases for sensitive data patterns are increasingly important for maintaining this inventory.</span></div>
      <div class="cheat-pill"><strong>Classification-Appropriate Cloud Services</strong><span>Not all cloud services are appropriate for all data classifications. An organization's classification policy should specify which cloud services are approved for which classification levels — and enforce this through procurement processes and technical controls (preventing upload of classified data to unapproved services). Using an appropriate cloud service for highly sensitive data that hasn't been assessed for that sensitivity level creates risk.</span></div>
      <div class="cheat-pill"><strong>Data Labeling in Cloud</strong><span>Cloud resources should carry tags or labels reflecting the classification of data they contain — making it easier to apply appropriate security controls, enforce access policies, and ensure that high-classification data receives enhanced protection. Cloud provider tagging features can be used to implement classification labeling at the resource level.</span></div>
      <div class="cheat-pill"><strong>Data Residency and Sovereignty</strong><span>Data classification should inform data residency decisions — highly regulated data (personal data subject to GDPR, health records, financial records) may have specific geographic residency requirements. Cloud environments must be configured to ensure high-classification data remains in approved geographic regions even when cloud providers automatically replicate data for availability and disaster recovery.</span></div>
      <div class="cheat-pill"><strong>Development and Test Data</strong><span>A common cloud security failure: using real production data (containing sensitive personal or business information) in development and test cloud environments that have weaker security controls than production. ISO 27017 guidance addresses the requirement to use appropriately anonymized or synthesized test data — not copies of production data — in development cloud environments.</span></div>
      <div class="cheat-pill"><strong>Data Lifecycle Management</strong><span>Cloud data must be managed throughout its lifecycle — including deletion when no longer needed. Cloud environments enable easy retention of vast quantities of data (storage costs are low), but excessive data retention increases risk. ISO 27017 guidance emphasizes that data retention policies must be actively enforced in cloud environments through automated lifecycle policies that delete or archive data based on age and classification.</span></div>
    </div>`,
    quiz: { q: "An organization's data classification policy defines three levels: Public, Internal, and Confidential. A developer uploads a CSV export of customer account data (Confidential) to an unrestricted cloud storage bucket for data analysis. What governance failure occurred?", opts: ["No failure — developers need access to real data for effective analysis", "Multiple governance failures: (1) no control prevented upload of Confidential data to an unapproved, unrestricted storage location; (2) the data classification policy didn't specify approved cloud services for each classification level; (3) data inventory controls didn't detect Confidential data appearing in an unapproved location. ISO 27017's data classification guidance requires both policy and technical controls preventing this.", "The developer should have anonymized the data first — but no governance failure occurred in upload", "Only a failure if the data is accessed by unauthorized parties"], ans: 1, explain: "Multiple ISO 27017 data classification and governance principles were violated. Classification policy should specify approved cloud services for each classification level (Confidential data → approved secure storage only). Technical controls should prevent upload of Confidential data to unapproved locations (data loss prevention tools, cloud storage access controls). Data inventory monitoring should detect Confidential data appearing in unexpected locations. The absence of all three controls allowed this governance failure. Using real customer data for analysis also typically violates data minimization principles — anonymized or synthesized data should be used in development and analytics contexts." }
  },
  {
    title: "CSP and CSC Perspectives — Implementing ISO 27017 from Both Sides",
    tagline: "How the standard applies differently depending on your role in the cloud relationship",
    body: `<p>One of ISO 27017's distinctive features is that it explicitly addresses <span class="key-term">both</span> Cloud Service Providers and Cloud Service Customers — recognizing that both parties have distinct implementation responsibilities and that cloud security depends on both fulfilling their roles. Understanding both perspectives is essential for GRC professionals who may work with or advise either side of the cloud relationship.</p>
    <div class="csp-card"><b>Cloud Service Provider (CSP) Implementation Priorities</b><br>As the entity managing the underlying cloud infrastructure, CSPs have primary responsibility for the foundational security controls that customers rely on but cannot directly implement. ISO 27017 implementation for CSPs focuses on infrastructure security, isolation between tenants, and transparency to customers about security practices.</div>
    <p>Key CSP implementation responsibilities under ISO 27017:</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Multi-Tenant Isolation</strong><span>Implement and continuously verify CLD.6.3.1 — ensuring logical isolation between all customer workloads. This requires: hypervisor security, network segregation, storage isolation, management plane access controls, and regular penetration testing specifically targeting cross-tenant isolation mechanisms.</span></div>
      <div class="cheat-pill"><strong>Shared Responsibility Communication</strong><span>Publish and maintain comprehensive shared responsibility documentation — making explicit what security the CSP provides and what the customer must implement. Update this documentation when service capabilities change. Provide onboarding guidance to new customers covering their security responsibilities.</span></div>
      <div class="cheat-pill"><strong>Audit Evidence Provision</strong><span>Maintain third-party attestations (ISO 27001 certification, SOC 2 Type II, CSA STAR) that allow customers to verify CSP security practices without requiring direct access to CSP facilities. Make audit reports available to customers under appropriate NDAs through a documented request process.</span></div>
      <div class="cheat-pill"><strong>Incident Notification</strong><span>Implement and test incident notification procedures that ensure affected customers are notified promptly when CSP infrastructure incidents affect customer data or service availability. Establish notification timelines that support customer compliance with data breach notification regulations.</span></div>
    </div>
    <div class="cust-card"><b>Cloud Service Customer (CSC) Implementation Priorities</b><br>As the entity responsible for its own data and for the applications and configurations it deploys in cloud environments, CSCs must implement the security controls within their sphere of responsibility — which depends heavily on the cloud service model they're using.</div>
    <p>Key CSC implementation responsibilities under ISO 27017:</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Understand Your Responsibilities</strong><span>Before deploying any sensitive workload to cloud services, document your security responsibilities in the shared responsibility model for that specific service. Don't assume — verify by reading the CSP's shared responsibility documentation and negotiating any unclear responsibilities explicitly in the service agreement.</span></div>
      <div class="cheat-pill"><strong>Implement Cloud Monitoring</strong><span>Activate and configure CLD.12.4.5 monitoring capabilities — enable cloud-native security monitoring services, integrate cloud logs with security operations tools, establish alerting for security-relevant events, and ensure monitoring covers all cloud services used, not just the primary production environment.</span></div>
      <div class="cheat-pill"><strong>Manage Access Rigorously</strong><span>Implement cloud access management including: multi-factor authentication for all cloud management access, just-in-time provisioning for privileged access, regular access reviews, prompt deprovisioning upon role changes or departures, and API credential management. Access management failures are consistently the most common cause of cloud security incidents.</span></div>
      <div class="cheat-pill"><strong>Govern Data in Cloud</strong><span>Maintain an inventory of data in cloud environments, enforce data classification policies for cloud resources, implement data lifecycle management to delete unnecessary data, use appropriate anonymization for non-production environments, and ensure data residency requirements are technically enforced rather than just contractually specified.</span></div>
    </div>`,
    quiz: { q: "A mid-size organization using cloud services says 'we don't need to worry about ISO 27017 — that's for cloud providers, not us.' Is this correct?", opts: ["Yes — ISO 27017 is a CSP-focused standard and only applies to organizations providing cloud services", "No — ISO 27017 explicitly addresses Cloud Service Customers as well as Cloud Service Providers. It specifies CSC responsibilities including CLD.12.4.5 (monitoring of cloud services), CLD.8.1.1 (roles and responsibilities), and CLD.8.1.2 (removal of access rights). Cloud customers who ignore ISO 27017 miss the customer-side security requirements.", "Yes — ISO 27017 is only relevant when an organization has ISO 27001 certification", "Partially — ISO 27017 only applies to CSCs when they use IaaS services, not SaaS or PaaS"], ans: 1, explain: "ISO 27017 is explicitly a bilateral standard — it addresses both Cloud Service Providers and Cloud Service Customers. The standard's structure identifies many controls as applying to CSCs rather than CSPs, recognizing that cloud customers have distinct and important security responsibilities. CLD.12.4.5 (monitoring) and CLD.8.1.2 (access rights) are specifically customer responsibilities. Organizations using cloud services that ignore ISO 27017 are missing a framework specifically designed to help them understand and fulfill their cloud security obligations — a gap that often doesn't become visible until a security incident reveals the uncovered responsibility." }
  },
  {
    title: "ISO 27017 and Cloud Service Level Agreements",
    tagline: "Security requirements that must flow through service agreements",
    body: `<p>The relationship between ISO 27017 controls and <span class="key-term">Cloud Service Level Agreements (SLAs)</span> is critical because many of the standard's customer-facing controls can only be implemented through contractual terms rather than direct technical implementation. ISO 27017 provides guidance on what security requirements customers should negotiate into their cloud service agreements — recognizing that a cloud customer without the right contractual protections cannot fully implement the standard regardless of their own security practices.</p>
    <div class="highlight-box"><strong>The contractual-technical boundary in cloud security:</strong> Some security controls can be implemented purely technically — a customer can configure multi-factor authentication in their cloud account without needing anything from the CSP. But many ISO 27017 controls require CSP commitments: the right to receive security incident notifications, the right to request data deletion and receive evidence of deletion, the right to access audit logs, and the right to review third-party security assessments. These rights must be established contractually — they don't exist unless negotiated.</highlight-box>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Security Performance Metrics</strong><span>SLAs typically focus on availability (uptime percentages) but often omit security performance metrics. ISO 27017 encourages customers to negotiate security-specific SLA elements: patch deployment timelines for critical vulnerabilities, incident notification response times, audit log delivery timelines, and maximum data deletion completion times. Measurable security commitments create accountability.</span></div>
      <div class="cheat-pill"><strong>Security Assessment Access</strong><span>Customers should negotiate rights to review CSP security assessments — either through direct audit rights (rare in large public cloud), third-party attestation access (SOC 2 Type II, ISO 27001 certification reports), or participation in CSP security briefings. Without this right, customers are relying on the CSP's word rather than verifiable evidence.</span></div>
      <div class="cheat-pill"><strong>Breach Notification Timelines</strong><span>Cloud SLAs must specify breach notification timelines that align with regulatory requirements. GDPR requires notification to supervisory authorities within 72 hours — the CSP must notify affected customers quickly enough to allow them to meet this obligation. Many standard cloud terms include vague notification timelines that may not support regulatory compliance.</span></div>
      <div class="cheat-pill"><strong>Data Handling on Termination</strong><span>Service agreements must explicitly address the data termination scenario: customer's right to export all data before termination, format and timing of data export, CSP's timeline for data deletion, and evidence of deletion. Without these terms, customers face the risk of cloud services ending with their data inaccessible or residual data persisting indefinitely on CSP infrastructure.</span></div>
      <div class="cheat-pill"><strong>Sub-Processor Visibility</strong><span>Customers should negotiate rights to know which third-party sub-processors handle their data, to review sub-processor security practices, and to be notified before new sub-processors are engaged with the right to object. This is particularly important under GDPR, which requires explicit controller identification and appropriate safeguards for all processors and sub-processors.</span></div>
      <div class="cheat-pill"><strong>Change Notification</strong><span>Major cloud providers regularly update their services — adding features, changing APIs, retiring capabilities. Security-relevant changes (changes to data handling, encryption defaults, access control mechanisms) should trigger customer notification in advance. SLAs should specify that security-relevant service changes are communicated with adequate notice for the customer to assess impact.</span></div>
    </div>`,
    quiz: { q: "An organization's cloud SLA specifies 99.9% availability but nothing about security incident notification, data deletion procedures, or audit access rights. If they experience a data breach in the cloud, what are the consequences of these SLA gaps?", opts: ["No significant consequences — breach response is the customer's responsibility regardless of the SLA", "Multiple serious consequences: the CSP may not notify them promptly enough to meet regulatory notification requirements (72 hours under GDPR), they may be unable to obtain the forensic evidence needed to understand the breach scope, and they may have no documented path for verifying complete data deletion afterwards. ISO 27017 SLA guidance exists specifically to prevent these gaps.", "The organization can pursue breach notification requirements through court order after the fact", "Security incident notification is always implied in cloud service agreements even if not specified"], ans: 1, explain: "SLA gaps around security incident notification, audit rights, and data deletion create real regulatory and operational consequences when breaches occur. Without contractual notification timelines, the CSP may notify on their own schedule — which may not meet GDPR's 72-hour requirement for affected organizations. Without contractual audit rights, the customer may be unable to gather the forensic evidence needed for breach scope assessment, regulatory reporting, and legal defense. Without defined data deletion procedures, the organization may be unable to demonstrate GDPR compliance after the incident. ISO 27017's SLA guidance is specifically designed to prevent these gaps from being discovered during crises." }
  },
  {
    title: "ISO 27017 and Related Standards — The Compliance Ecosystem",
    tagline: "How ISO 27017 connects to GDPR, ISO 27018, FedRAMP, CSA STAR, and more",
    body: `<p>ISO 27017 doesn't operate in isolation — it connects to and supports compliance with multiple other standards and regulations that organizations must address. Understanding these connections enables GRC professionals to build integrated compliance programs where ISO 27017 implementation supports multiple compliance objectives simultaneously.</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>ISO 27017 and GDPR</strong><span>ISO 27017 supports GDPR compliance for cloud data processing in multiple ways: the standard's security controls address GDPR's Article 32 requirement for appropriate technical and organizational security measures; its data deletion and portability guidance supports GDPR data subject rights; its sub-processor visibility requirements align with GDPR's processor requirements; and its breach notification guidance supports Article 33's 72-hour notification requirement.</span></div>
      <div class="cheat-pill"><strong>ISO 27017 and ISO 27018</strong><span>ISO 27018 is ISO 27017's companion standard, focused specifically on protecting PII in cloud environments. Organizations processing personal data in the cloud should implement both: ISO 27017 for overall cloud security controls and ISO 27018 for PII-specific protections (data minimization, consent, transparency, data subject rights in cloud environments). Many cloud providers seek both ISO 27017 and 27018 attestation.</span></div>
      <div class="cheat-pill"><strong>ISO 27017 and ISO 27001</strong><span>ISO 27001 is the certifiable ISMS standard that many organizations hold. ISO 27017 extends the ISO 27001 Annex A controls with cloud-specific guidance. Organizations with ISO 27001 certification who use cloud services should add ISO 27017 controls to their ISMS scope — often as part of a "cloud extension" to their existing ISMS. Some certification bodies offer ISO 27001 certification with explicit ISO 27017 scope extension.</span></div>
      <div class="cheat-pill"><strong>ISO 27017 and CSA STAR</strong><span>The Cloud Security Alliance's Security, Trust, Assurance, and Risk (STAR) program is a cloud-specific security assurance framework. CSA STAR uses the Cloud Controls Matrix (CCM) as its control reference. ISO 27017 controls map substantially to CSA CCM controls — organizations implementing ISO 27017 have significant overlap with CSA STAR requirements. CSA STAR Certification Level 2 is based on ISO 27001 with CCM controls, closely aligned with ISO 27017.</span></div>
      <div class="cheat-pill"><strong>ISO 27017 and NIST CSF / SP 800-53</strong><span>NIST's Cybersecurity Framework and SP 800-53 security controls (used for US federal systems including FedRAMP) have substantial overlap with ISO 27017 controls. Organizations serving both US federal and international markets can build integrated control sets that satisfy both NIST and ISO frameworks. The cloud-specific controls in ISO 27017 complement NIST's cloud computing security guidance (NIST SP 800-144, SP 800-145).</span></div>
      <div class="cheat-pill"><strong>ISO 27017 and FedRAMP</strong><span>FedRAMP (the US federal cloud authorization program) uses NIST SP 800-53 as its control baseline. While ISO 27017 certification doesn't satisfy FedRAMP authorization requirements (FedRAMP requires assessment against SP 800-53 and authorization by a federal agency or the JAB), the security concepts and controls are highly compatible. A CSP with ISO 27017 attestation has a strong security foundation for pursuing FedRAMP, but additional work against the specific SP 800-53 baseline is required.</span></div>
    </div>
    <div class="analogy-box"><strong>ISO 27017 as a compliance force multiplier:</strong> Organizations that implement ISO 27017 as part of their cloud security program often find that the same controls satisfy multiple compliance requirements simultaneously — ISO 27017 controls address GDPR security requirements, ISO 27018 requirements, CSA STAR CCM controls, and large portions of NIST 800-53 cloud-relevant controls. Rather than running separate compliance programs for each requirement, ISO 27017 implementation provides a foundation that many other frameworks build on. This "build once, satisfy many" approach is the GRC professional's most valuable skill — and ISO 27017 is a particularly effective foundation for cloud-centric compliance programs.</div>`,
    quiz: { q: "An organization has GDPR obligations for EU customer data they process in cloud services. How does implementing ISO 27017 support their GDPR compliance?", opts: ["ISO 27017 implementation automatically satisfies all GDPR cloud processing requirements", "ISO 27017 implementation provides a structured security control framework that addresses GDPR's Article 32 security requirements, supports data subject rights implementation (deletion, portability), aligns sub-processor governance with GDPR processor requirements, and provides breach notification guidance — but GDPR compliance requires additional legal basis work, privacy policy requirements, and data subject rights mechanisms beyond what ISO 27017 addresses.", "ISO 27017 only satisfies GDPR for non-EU cloud providers", "GDPR doesn't reference ISO standards, so ISO 27017 has no GDPR relevance"], ans: 1, explain: "ISO 27017 and GDPR have significant overlap in cloud environments — particularly around security (Article 32), processor requirements (Article 28), and data subject rights implementation. Implementing ISO 27017 provides documented, auditable evidence of appropriate technical and organizational security measures that Article 32 requires. However, ISO 27017 is a security standard, not a data protection law — it doesn't address legal basis for processing, privacy notices, or the full range of data subject rights that GDPR requires. Organizations must implement GDPR's legal requirements and use ISO 27017 as the technical security framework supporting those requirements, not as a substitute for them." }
  },
  {
    title: "Implementing ISO 27017 — Starting the Journey",
    tagline: "A practical approach to adopting the standard in your organization",
    body: `<p>Understanding ISO 27017 conceptually is the foundation — actually implementing it requires a structured approach that integrates with existing security programs, addresses both CSP and CSC perspectives, and prioritizes the most impactful controls for your specific cloud environment. Here's what effective ISO 27017 implementation looks like in practice.</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Phase 1 — Cloud Inventory and Assessment</strong><span>Before implementing any controls, map your cloud footprint: which cloud services are in use (including shadow IT), what data is stored in each service, what classification level that data carries, and what the current shared responsibility allocation is for each service. You cannot implement ISO 27017 for cloud services you don't know about.</span></div>
      <div class="cheat-pill"><strong>Phase 2 — Shared Responsibility Mapping</strong><span>For each cloud service in your inventory, document the security responsibility allocation using the CSP's published shared responsibility model. Identify gaps where responsibilities are unclear or where the customer has unimplemented responsibilities. This gap analysis becomes the implementation prioritization roadmap.</span></div>
      <div class="cheat-pill"><strong>Phase 3 — Service Agreement Review</strong><span>Review existing cloud service agreements for security provisions — incident notification, data deletion, audit rights, sub-processor visibility, and breach response coordination. Identify gaps and develop a renegotiation plan for agreements that don't adequately address ISO 27017 requirements. New cloud procurements should incorporate ISO 27017-aligned security requirements from the start.</span></div>
      <div class="cheat-pill"><strong>Phase 4 — Control Implementation</strong><span>Implement the 7 CLD controls applicable to your organization (CSP or CSC) and the extended ISO 27002 controls relevant to your cloud environment. Prioritize by risk — start with access management (most common failure point), then monitoring, then data classification and governance. CSPs implementing CLD.9.5.1/9.5.2 require technical architecture work that may be significant.</span></div>
      <div class="cheat-pill"><strong>Phase 5 — Integration with ISO 27001</strong><span>If your organization has ISO 27001 certification, integrate ISO 27017 controls into your existing ISMS scope. Update the Statement of Applicability (SoA) to include applicable ISO 27017 controls, update risk assessments to include cloud-specific risks, and ensure your ISMS audit program covers cloud security controls.</span></div>
      <div class="cheat-pill"><strong>Phase 6 — Ongoing Monitoring and Review</strong><span>Cloud environments change rapidly — cloud ISO 27017 implementation requires continuous maintenance. Establish processes for: monitoring new cloud service adoptions for compliance gaps, reviewing shared responsibility documentation when CSPs update their services, assessing security impacts of cloud architecture changes, and periodically re-assessing the full cloud inventory for new shadow IT or data governance violations.</span></div>
    </div>
    <div class="warning-box"><strong>The shadow cloud problem:</strong> One of the most significant obstacles to ISO 27017 implementation is shadow IT — cloud services adopted by business units or developers without IT or security team knowledge. Organizations often discover during ISO 27017 implementation that they have far more cloud services in use than their official inventory shows, many of which handle sensitive data without any security controls or shared responsibility documentation. Establishing processes to discover and govern unauthorized cloud adoption is a prerequisite for meaningful ISO 27017 compliance.</div>
    <div class="analogy-box"><strong>ISO 27017 implementation is a continuous practice, not a project:</strong> Unlike implementing a one-time security control (installing a firewall), ISO 27017 compliance requires continuous attention because the cloud environment it governs is continuously changing. New services are adopted, CSPs update their platforms, data moves to new locations, and the regulatory environment evolves. Organizations that treat ISO 27017 as a one-time implementation project rather than an ongoing management discipline will find their compliance degrading as their cloud footprint grows and changes.</div>`,
    quiz: { q: "An organization completes an ISO 27017 gap assessment and finds that 40% of their cloud services were adopted by business units without IT security involvement, none have documented shared responsibility allocations, and most handle sensitive customer data. What is the appropriate first step?", opts: ["Immediately shut down all unauthorized cloud services to achieve compliance", "Conduct a risk-based triage: categorize the unauthorized services by sensitivity of data handled, establish emergency incident response procedures for the highest-risk services, and develop a governance process for reviewing and formally accepting (with appropriate security controls) or decommissioning discovered cloud services based on business need and security risk.", "Document all discovered services in the CMDB and continue with the original implementation plan", "Report the findings to senior management and wait for direction before taking any action"], ans: 1, explain: "Discovering extensive shadow cloud adoption requires a risk-based response rather than either a blanket shutdown (which would disrupt business operations) or passive documentation. The highest-risk services — those handling sensitive customer data with no security controls — require immediate attention: assessing what data is exposed, implementing emergency access controls, and establishing incident response procedures in case of compromise. Medium and lower-risk services can be addressed on a more measured timeline through a governance process. The fundamental fix is establishing a cloud governance process that reviews and approves cloud services before adoption — preventing future shadow cloud growth rather than just documenting existing instances." }
  },
  {
    title: "ISO 27017 Certification and Attestation",
    tagline: "How organizations demonstrate ISO 27017 compliance to customers and regulators",
    body: `<p>A common question about ISO 27017 is: how do organizations — particularly CSPs — demonstrate compliance to their customers and regulators? Unlike ISO 27001, which is a certifiable management system standard, ISO 27017 is a code of practice. Understanding what certifications and attestations exist, and what each actually proves, is essential for both CSPs seeking to demonstrate security to customers and CSCs evaluating whether to trust a cloud provider's security claims.</p>
    <div class="highlight-box"><strong>The certification reality:</strong> Organizations cannot be directly "ISO 27017 certified" the way they can be ISO 27001 certified. ISO 27017 is a code of practice providing guidance — it doesn't specify management system requirements that can be certified. However, there are recognized ways to demonstrate ISO 27017 alignment that provide meaningful assurance to customers and regulators.</highlight-box>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>ISO 27001 with ISO 27017 Scope Extension</strong><span>The most common formal recognition approach: an organization holds ISO 27001 certification and extends its ISMS scope to explicitly include ISO 27017 controls. Certification bodies can note ISO 27017 compliance as part of the ISO 27001 certification scope statement, indicating that cloud-specific controls have been assessed alongside the standard ISMS requirements.</span></div>
      <div class="cheat-pill"><strong>SOC 2 with ISO 27017 Criteria</strong><span>Some cloud providers have their auditors assess ISO 27017 controls as part of their SOC 2 Type II audit, with findings documented in the audit report. The SOC 2 report can explicitly reference ISO 27017 controls assessed, providing customers with audited evidence of ISO 27017 alignment in a format many security teams are already familiar with reviewing.</span></div>
      <div class="cheat-pill"><strong>CSA STAR Certification</strong><span>The Cloud Security Alliance's STAR Certification (Level 2) is based on ISO 27001 certification plus assessment against the CSA Cloud Controls Matrix (CCM). Since the CCM maps closely to ISO 27017 controls, STAR Certification provides strong evidence of cloud security control implementation aligned with ISO 27017 principles, even without direct ISO 27017 reference.</span></div>
      <div class="cheat-pill"><strong>CSA STAR Self-Assessment</strong><span>The lowest-barrier CSA STAR program level: CSPs complete a Consensus Assessments Initiative Questionnaire (CAIQ) documenting their security practices against the CCM and publish it publicly in the STAR Registry. While self-assessed and not independently verified, it provides customers with documented evidence of security practices for evaluation.</span></div>
      <div class="cheat-pill"><strong>Third-Party Security Assessments</strong><span>Independent security assessments specifically covering ISO 27017 controls can provide evidence of compliance without formal certification. These assessments, conducted by qualified information security auditors, document which controls are implemented, how they are implemented, and any gaps identified. The assessment report can be provided to customers under NDA.</span></div>
      <div class="cheat-pill"><strong>Customer Contractual Attestations</strong><span>Some large cloud enterprise agreements include contractual provisions where the CSP attests to specific ISO 27017 control implementations. While not independently verified, contractual attestations create legal accountability for the CSP and may satisfy audit requirements in contexts where independent certification is not available or required.</span></div>
    </div>`,
    quiz: { q: "A CSP claims 'ISO 27017 certified' status in their marketing materials. A sophisticated enterprise customer's security team should be aware of what important nuance?", opts: ["ISO 27017 certification is a rigorous and well-understood designation that should be accepted at face value", "ISO 27017 is a code of practice — direct 'ISO 27017 certification' doesn't formally exist the way ISO 27001 certification does. The customer should ask specifically what certification body issued the certification, what scope it covers, and how ISO 27017 controls were assessed. The CSP may have ISO 27001 certification with ISO 27017 scope extension, or may be using the term loosely.", "ISO 27017 certification is only valid for CSPs, not cloud customers", "The certification is valid as long as it was issued in the last three years"], ans: 1, explain: "ISO 27017 is a code of practice rather than a management system standard with formal certification requirements — this means 'ISO 27017 certified' is not a formally defined term the way 'ISO 27001 certified' is. A CSP making this claim may mean: ISO 27001 certified with explicit ISO 27017 scope, CSA STAR certified with CCM controls that map to ISO 27017, or simply self-assessed against ISO 27017 controls. Enterprise security teams should ask for specifics: which accreditation body issued what certification, with what scope, against what standard exactly, and with what assessment methodology." }
  },
  {
    title: "ISO 27017 in Practice — Common Challenges and Failures",
    tagline: "The implementation gaps and misunderstandings most organizations encounter",
    body: `<p>Understanding common ISO 27017 implementation failures is as valuable as understanding the standard itself — because these are the gaps most likely to emerge in real cloud security programs and be identified in security assessments, audits, or incident investigations.</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Shared Responsibility Assumption Failure</strong><span>The most common cloud security failure and the most important ISO 27017 addresses: organizations assuming the CSP handles security aspects that are actually customer responsibilities. "The cloud provider has ISO 27017 — we're covered" is a dangerous misunderstanding. CSC responsibilities exist regardless of CSP certifications, and many security incidents can be traced directly to customers not implementing their side of the shared responsibility model.</span></div>
      <div class="cheat-pill"><strong>Inadequate Cloud Monitoring (CLD.12.4.5)</strong><span>Organizations frequently activate the minimum required logging for compliance purposes while never reviewing those logs or integrating them with security operations tools. Monitoring that generates logs nobody reviews provides no security value. CLD.12.4.5 implementation failures are typically discovered during incident response when adequate visibility would have enabled earlier detection.</span></div>
      <div class="cheat-pill"><strong>Access Right Retention (CLD.8.1.2)</strong><span>Persistent access rights for departed employees and terminated service relationships are one of the most consistently cited findings in cloud security assessments. Cloud platforms are often not included in standard HR offboarding processes — employees leave the organization but retain access to cloud services months or years later. This is especially common in organizations that adopted cloud services informally without integrating them into access management processes.</span></div>
      <div class="cheat-pill"><strong>Missing Data Deletion Verification</strong><span>Organizations move from one cloud provider to another, or terminate cloud services, without verifying that all data — including backups, replicas, and derived data — was actually deleted. "We closed the account" is not sufficient evidence of data deletion. Without contractual deletion procedures, a deletion certificate, or direct verification, organizations cannot confirm compliance with data protection retention requirements.</span></div>
      <div class="cheat-pill"><strong>Development Environment Data Governance</strong><span>Sensitive production data used in development and test cloud environments — "we just need real data to test the new feature" — is one of the most frequently exploited security gaps. Development environments typically have weaker security controls than production, and developers may have broader access and less oversight. ISO 27017's data classification guidance requires appropriate anonymization for non-production use.</span></div>
      <div class="cheat-pill"><strong>Sub-Processor Opacity</strong><span>Organizations sign cloud service agreements without investigating the CSP's sub-processors — third parties that process customer data as part of service delivery. Under GDPR, each sub-processor represents a data transfer and processing relationship that requires appropriate safeguards. When sub-processors are discovered during a breach investigation or regulatory inquiry, the governance gap they reveal can create significant regulatory exposure.</span></div>
    </div>
    <div class="warning-box"><strong>The "cloud native" security gap:</strong> Many cloud services include security features that are available but not enabled by default. Encryption at rest, enhanced access logging, security alert notifications, and network protection features often require explicit activation. Organizations that provision cloud services using default settings frequently discover during security assessments that available security controls were never activated. ISO 27017 implementation requires actively reviewing and enabling available security features — not assuming defaults are secure.</div>`,
    quiz: { q: "An organization's security assessment finds that a developer left the company 8 months ago and still has active administrator access to three production cloud environments containing customer payment data. Which ISO 27017 controls were not implemented?", opts: ["This is an HR failure unrelated to ISO 27017", "At minimum: CLD.8.1.2 (Removal or Adjustment of Access Rights) directly requires timely removal of access upon departure. Extended ISO 27002 access control guidance requires periodic access reviews that would have caught this. The failure suggests cloud services weren't included in HR offboarding processes and that access reviews weren't conducted — both ISO 27017 requirements.", "Only ISO 27002 access control is relevant here — not ISO 27017 specifically", "This only violates ISO 27017 if the access was actually used after departure"], ans: 1, explain: "CLD.8.1.2 exists precisely to address this scenario — the cloud-specific challenge of access rights persisting after relationship termination. When an employee departs, their access to cloud services must be removed along with their access to on-premise systems. The 8-month persistence of administrator access to production environments containing payment card data represents a critical security gap — the departed employee (who may have moved to a competitor or become disgruntled) retains the ability to access, modify, or exfiltrate sensitive customer data. Periodic access reviews — also required by ISO 27017 — should have caught this within months of departure." }
  },
  {
    title: "ISO 27017 at the VA — Federal Cloud Security Context",
    tagline: "Applying cloud security principles in Jason's professional environment",
    body: `<p>The Department of Veterans Affairs presents one of the most complex cloud security governance challenges in the US — operating as a massive healthcare organization subject to HIPAA, a federal agency subject to FISMA, and increasingly relying on cloud services for both clinical and administrative operations. Understanding how ISO 27017 principles apply in this federal healthcare cloud context connects the standard to Jason's professional reality.</p>
    <div class="highlight-box"><strong>The VA's cloud security context:</strong> The VA is one of the largest healthcare systems in the United States, with electronic health records for millions of veterans. Cloud adoption at the VA involves: FISMA compliance requirements (including FedRAMP authorization for cloud services), HIPAA security requirements for protected health information in cloud environments, VA-specific security requirements (VA Handbook 6500), and the complex shared responsibility model that applies when federal patient data is held by commercial cloud providers.</highlight-box>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>ISO 27017 vs. FedRAMP</strong><span>At the VA (as at all federal agencies), cloud services must have FedRAMP authorization rather than ISO 27017 certification. FedRAMP uses NIST SP 800-53 as its control baseline — but the security principles and many specific controls overlap significantly with ISO 27017. VA compliance professionals benefit from understanding ISO 27017's cloud security concepts even when implementing FedRAMP-required controls.</span></div>
      <div class="cheat-pill"><strong>Shared Responsibility at the VA</strong><span>When the VA uses FedRAMP-authorized cloud services, shared responsibility principles identical to ISO 27017's concepts apply. The FedRAMP shared responsibility matrix functions like ISO 27017's CLD.8.1.1 — explicitly allocating security responsibilities between the cloud provider and the VA. VA security teams must understand and fulfill the VA's side of this responsibility allocation.</span></div>
      <div class="cheat-pill"><strong>PHI in Cloud — ISO 27017 and HIPAA Intersection</strong><span>Veterans' protected health information (PHI) in cloud environments triggers both HIPAA Security Rule requirements and ISO 27017-equivalent cloud security controls. HIPAA requires Business Associate Agreements (BAAs) with cloud providers — analogous to ISO 27017's service agreement security requirements. The shared responsibility model for PHI in cloud aligns directly with ISO 27017's CSC responsibility framework.</span></div>
      <div class="cheat-pill"><strong>Data Deletion and Veteran Rights</strong><span>ISO 27017's data return and deletion controls are directly relevant to VA cloud governance. Veterans have rights regarding their health data, and VA contractual and legal obligations require clear data deletion procedures when cloud services are terminated. The principles governing cloud data deletion under ISO 27017 map to both HIPAA data disposition requirements and Privacy Act obligations.</span></div>
      <div class="cheat-pill"><strong>Multi-Cloud Monitoring</strong><span>The VA operates in a complex, multi-cloud environment — different systems may use different cloud providers for different purposes. ISO 27017's CLD.12.4.5 monitoring requirements apply across this environment: the VA must maintain security visibility into each cloud service used, integrate monitoring across cloud environments, and ensure security operations teams have visibility into VA data and systems regardless of which cloud they reside in.</span></div>
      <div class="cheat-pill"><strong>Applying ISO 27017 Knowledge in Federal Context</strong><span>Even in a FedRAMP-governed federal cloud environment, ISO 27017 knowledge provides value: understanding the cloud security risk landscape that both frameworks address, articulating cloud security requirements in procurement and service agreement negotiations, assessing cloud service security posture using international best practices, and translating between NIST framework language and ISO framework language when working with vendors or international partners.</span></div>
    </div>`,
    quiz: { q: "The VA is evaluating a new cloud-based clinical decision support system that will process veterans' mental health records. A security analyst is asked to assess whether the cloud provider's shared responsibility model is adequate. What ISO 27017 concepts should guide this assessment?", opts: ["ISO 27017 doesn't apply to US federal cloud environments — only FedRAMP matters", "The analyst should apply ISO 27017's shared responsibility framework to verify: the CSP's specific security responsibilities are documented (CLD.8.1.1), the VA's responsibilities as the CSC are clearly identified, controls for shared virtual infrastructure are adequate (CLD.6.3.1), monitoring capabilities available to the VA are sufficient (CLD.12.4.5), access management and termination procedures are defined (CLD.8.1.2), and the service agreement addresses incident notification, data deletion, and audit rights per ISO 27017 service agreement guidance.", "Shared responsibility assessment should only consider HIPAA BAA requirements for health data", "The assessment should focus entirely on encryption — mental health records require AES-256 minimum"], ans: 1, explain: "ISO 27017's cloud security framework provides the conceptual structure for a comprehensive cloud service security assessment, even in a primarily NIST/FedRAMP-governed environment. The shared responsibility model (CLD.8.1.1), multi-tenancy isolation (CLD.6.3.1), access right management (CLD.8.1.2), monitoring (CLD.12.4.5), and service agreement requirements are relevant to any cloud service handling sensitive health data — whether the compliance framework is ISO 27017, FedRAMP, or HIPAA. Understanding ISO 27017 gives security analysts a comprehensive cloud security lens to apply regardless of the specific regulatory framework governing a particular deployment." }
  },
  {
    title: "30-Day Review",
    tagline: "Everything we covered — in one final look",
    body: `<p>You've completed all 30 days of ISO/IEC 27017! Let's take a final inventory of what you now know about the international standard that brought cloud-specific security controls to the world's most widely used information security framework family.</p>
    <div class="tag-header">The Big Picture</div>
    <p>ISO/IEC 27017 is an international code of practice published by ISO/IEC JTC 1/SC 27. First published 2015, revised 2024. Extends ISO 27002's security controls with cloud-specific guidance and introduces 7 new cloud-specific controls (CLD prefix). Addresses both Cloud Service Providers (CSPs) and Cloud Service Customers (CSCs). Works alongside ISO 27001 (ISMS management system), ISO 27002 (general controls), and ISO 27018 (cloud privacy). Provides the shared responsibility framework that makes cloud security governance systematic rather than assumed.</p>
    <div class="tag-header">The 7 New Cloud-Specific Controls</div>
    <div class="badge-row">
      <span class="badge badge-cyan">CLD.6.3.1 — Shared ICT Infrastructure (multi-tenancy isolation)</span>
      <span class="badge badge-cyan">CLD.8.1.1 — Roles and Responsibilities (shared responsibility documentation)</span>
      <span class="badge badge-cyan">CLD.8.1.2 — Removal/Adjustment of Access Rights (termination procedures)</span>
      <span class="badge badge-cyan">CLD.9.5.1 — Segregation in Virtual Environments (CSP — tenant isolation)</span>
      <span class="badge badge-cyan">CLD.9.5.2 — Virtual Machine Hardening (CSP — hypervisor security)</span>
      <span class="badge badge-cyan">CLD.12.4.5 — Monitoring of Cloud Services (CSC — customer monitoring)</span>
      <span class="badge badge-cyan">CLD.13.1.4 — Virtual/Physical Network Security Alignment (CSP)</span>
    </div>
    <div class="tag-header">Key Concepts</div>
    <div class="badge-row">
      <span class="badge badge-cyan">Shared responsibility — foundation of all cloud security</span>
      <span class="badge badge-cyan">Multi-tenancy — core cloud risk requiring isolation controls</span>
      <span class="badge badge-cyan">CSP vs CSC — both have distinct obligations</span>
      <span class="badge badge-cyan">BYOK — Bring Your Own Key for maximum encryption control</span>
      <span class="badge badge-cyan">Service agreement security — contractual controls</span>
      <span class="badge badge-cyan">Shadow IT — unauthorized cloud creating compliance gaps</span>
      <span class="badge badge-cyan">Data residency — geographic data location control</span>
      <span class="badge badge-cyan">Sub-processors — third parties handling cloud customer data</span>
    </div>
    <div class="tag-header">Framework Relationships</div>
    <div class="badge-row">
      <span class="badge badge-green">ISO 27001 — ISMS framework ISO 27017 extends</span>
      <span class="badge badge-green">ISO 27002 — control catalog ISO 27017 adds cloud guidance to</span>

let current = 0;

function buildGrid(){
  const g = document.getElementById('dayGrid');
  g.innerHTML = '';
  for(let i = 0; i < days.length; i++){
    const b = document.createElement('button');
    b.className = 'day-pip' + (days[i].isCheatSheet ? ' cheat' : '') + (i === current ? ' active' : '');
    b.textContent = days[i].isCheatSheet ? 'CS' : (i + 1);
    b.title = days[i].title;
    b.onclick = (()=>{ const idx = i; return () => goTo(idx); })();
    g.appendChild(b);
  }
}

function goTo(idx){ current = idx; render(); }
function changeDay(dir){ current = Math.max(0, Math.min(days.length - 1, current + dir)); render(); }

function render(){
  const d = days[current];
  const total = days.length;
  document.getElementById('dayCounter').textContent = (current + 1) + ' / ' + total;
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === total - 1;
  document.getElementById('progBar').style.width = (((current + 1) / total) * 100) + '%';
  buildGrid();

  if(d.isCheatSheet){
    document.getElementById('lessonArea').innerHTML = `
      <div class="card">
        <div class="lesson-header">
          <div class="day-badge" style="background:#E1F5EE">
            <div class="day-num" style="color:#085041;font-size:14px">CHEAT</div>
            <div class="day-lbl" style="color:#0F6E56">SHEET</div>
          </div>
          <div class="lesson-meta">
            <h2>${d.title}</h2>
            <div class="tagline">${d.tagline}</div>
          </div>
        </div>
        <div class="lesson-body">${d.body}</div>
      </div>`;
    return;
  }

  const quizId = 'quiz_' + current;
  let quizHtml = '';
  if(d.quiz){
    const optsHtml = d.quiz.opts.map((o, i) =>
      `<button class="quiz-btn" onclick="checkAnswer(${i}, ${d.quiz.ans}, '${quizId}')">${o}</button>`
    ).join('');
    quizHtml = `<div class="quiz-box">
      <p>Quick check: ${d.quiz.q}</p>
      <div>${optsHtml}</div>
      <div class="answer-reveal" id="${quizId}"></div>
    </div>`;
  }

  document.getElementById('lessonArea').innerHTML = `
    <div class="card">
      <div class="lesson-header">
        <div class="day-badge">
          <div class="day-num">${current + 1}</div>
          <div class="day-lbl">Day</div>
        </div>
        <div class="lesson-meta">
          <h2>${d.title}</h2>
          <div class="tagline">${d.tagline}</div>
        </div>
      </div>
      <div class="section-label">Today's lesson</div>
      <div class="lesson-body">${d.body}</div>
      ${quizHtml}
    </div>`;
}

function checkAnswer(chosen, correct, qid){
  const el = document.getElementById(qid);
  const d = days[current];
  if(!d.quiz) return;
  const isRight = chosen === correct;
  el.innerHTML = `<strong>${isRight ? 'Correct!' : 'Not quite.'}</strong> ${d.quiz.explain}`;
  el.className = 'answer-reveal show';
  el.style.background = isRight ? '#EAF3DE' : '#FCEBEB';
  el.style.borderColor = isRight ? '#3B6D11' : '#0E7490';
  el.style.color = '#1a1a18';
}

render();
</script>
