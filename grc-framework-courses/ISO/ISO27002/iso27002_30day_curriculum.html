<script>
const days = [
{
  title:"What Is ISO/IEC 27002?",
  tagline:"The world&#8217;s most widely used catalog of information security controls",
  body:`<p>Imagine you are the CISO of a large organization and someone asks you: &#8220;How do you know your security program is complete?&#8221; You have firewalls, you have antivirus, you have password policies&#8212;but how do you know you haven&#8217;t forgotten something critical? How do you know your controls are consistent with what the rest of the world considers best practice? And when a customer asks you to prove your security posture, how do you speak a language they can understand and trust? The answer that most of the world has converged on is <span class="key-term">ISO/IEC 27002</span>.</p>
  <p>ISO/IEC 27002 is an international standard with the full title <strong>&#8220;Information Security, Cybersecurity and Privacy Protection &#8212; Information Security Controls.&#8221;</strong> It is a comprehensive catalog of information security controls and implementation guidance that organizations worldwide use to build, implement, and improve their information security programs. The current version, <strong>ISO/IEC 27002:2022</strong>, was published in February 2022 and reorganized 93 controls into four clean themes: Organizational, People, Physical, and Technological.</p>
  <div class="analogy-box"><strong>Real-world analogy:</strong> Think of ISO 27002 like a comprehensive building code for information security. Just as a building code doesn&#8217;t tell you exactly how to build your specific house&#8212;it tells you what safety requirements every house must address (electrical safety, structural integrity, fire protection, plumbing)&#8212;ISO 27002 doesn&#8217;t tell you exactly how to secure your specific organization. It tells you what security domains every organization must address and provides guidance on how to implement controls in each domain. Builders use building codes as their blueprint checklist; security professionals use ISO 27002 as their security control checklist.</div>
  <div class="highlight-box">Key facts about ISO/IEC 27002: International standard published by ISO/IEC JTC 1, Subcommittee 27 (SC 27). Current version: ISO/IEC 27002:2022 (published February 2022). A &#8220;code of practice&#8221;&#8212;providing guidance, not certification requirements. 93 controls organized into 4 themes. Companion to ISO 27001 (the certifiable ISMS standard). Used by organizations in over 150 countries. The reference control catalog for ISO 27001&#8217;s Annex A. Not standalone certifiable&#8212;organizations certify to ISO 27001, which implements ISO 27002 controls.</div>`,
  quiz:{q:"ISO 27002 is described as a &#8216;code of practice.&#8217; What does this mean for organizations that want to demonstrate ISO 27002 compliance?",opts:["Organizations can receive direct ISO 27002 certification from an accredited certification body","ISO 27002 is guidance rather than a certifiable standard&#8212;organizations cannot be &#8216;ISO 27002 certified.&#8217; Instead, they use ISO 27002 controls to build their security program and achieve certification through ISO 27001, which references ISO 27002&#8217;s controls in Annex A","ISO 27002 certification is available but only for large enterprises","Organizations self-certify to ISO 27002 without third-party assessment"],ans:1,explain:"ISO 27002&#8217;s &#8216;code of practice&#8217; designation means it provides guidance and best practice recommendations rather than requirements for a certifiable management system. You cannot be &#8216;ISO 27002 certified.&#8217; Instead, ISO 27002 serves as the control reference catalog for ISO 27001&#8212;the management system standard you do certify to. ISO 27001&#8217;s Annex A references all 93 ISO 27002 controls. When organizations achieve ISO 27001 certification, they demonstrate they have implemented appropriate controls from the ISO 27002 catalog within a functioning ISMS."}
},
{
  title:"A Brief History of ISO 27002",
  tagline:"How the world&#8217;s most important security control catalog evolved over three decades",
  body:`<p>ISO 27002 has a longer history than most security professionals realize&#8212;tracing its origins to a British commercial standard from the early 1990s that became the global reference for information security controls. Understanding this history helps explain why ISO 27002 is trusted so broadly and how its 2022 restructuring represents a genuine evolution rather than just cosmetic change.</p>
  <div class="highlight-box"><strong>The ISO 27002 lineage:</strong><br><br><strong>1992&#8212;DTI Code of Practice:</strong> The UK Department of Trade and Industry published a &#8220;Code of Practice for Information Security Management&#8221;&#8212;the first systematic effort to document information security best practices for businesses. This was essentially the ancestor of everything that followed.<br><br><strong>1995&#8212;BS 7799 Part 1:</strong> The British Standards Institution (BSI) formalized the DTI code into British Standard BS 7799 Part 1, &#8220;Code of Practice for Information Security Management.&#8221; This was the first widely adopted security control catalog, used primarily in the UK.<br><br><strong>2000&#8212;ISO/IEC 17799:2000:</strong> BS 7799 Part 1 was adopted as an international standard, renamed ISO/IEC 17799. This gave the security control catalog global reach and authority. Organizations worldwide began using it as their security reference framework.<br><br><strong>2005&#8212;ISO/IEC 17799:2005 and ISO/IEC 27001:2005:</strong> The standard was updated and simultaneously renamed ISO/IEC 27002 to fit within the new ISO 27000 family numbering scheme. ISO 27001 (the certifiable ISMS standard) was published simultaneously, formally connecting the management system to the control catalog.<br><br><strong>2013&#8212;ISO/IEC 27002:2013:</strong> Major revision expanding to 114 controls across 14 domains. This version became the global standard for over a decade, referenced by hundreds of national standards, regulations, and compliance frameworks worldwide.<br><br><strong>2022&#8212;ISO/IEC 27002:2022:</strong> The current version. Reduced to 93 controls across 4 themes, introduced 11 new controls addressing modern threats and technologies, consolidated redundant controls, and added a five-attribute tagging system for more flexible control selection.</div>
  <div class="analogy-box"><strong>Why the 2022 restructuring mattered:</strong> The 2013 version had 14 domains organized around technology categories that made sense in 2013 (&#8220;Communications Security,&#8221; &#8220;Supplier Relationships,&#8221; etc.). By 2022, cloud computing, AI-driven threats, and remote work had fundamentally changed the security landscape. The 2022 version reorganized around four fundamental questions: What policies and governance do we need (Organizational)? What do we need from our people (People)? What do we need to protect physically (Physical)? What technical measures do we need (Technological)? This simpler structure is more intuitive and maps more naturally to how modern organizations think about security.</div>`,
  quiz:{q:"Why is understanding ISO 27002&#8217;s history important for a GRC professional working with organizations that have existing security programs?",opts:["It is not important&#8212;only the current 2022 version matters","Many existing security programs were built against ISO 27002:2013 with 114 controls across 14 domains. Understanding the 2013-to-2022 transition&#8212;including which controls merged, which were renamed, and which 11 controls were added&#8212;is essential for helping organizations update their programs, close gaps from new controls, and avoid duplicating work they have already done.","History only matters for academic research","Only organizations planning ISO 27001 certification need to know the history"],ans:1,explain:"The 2013-to-2022 transition is one of the most common GRC challenges facing security programs today. Organizations with ISO 27001 certification issued under the 2013 standard must transition to the 2022 standard by October 2025. GRC professionals must understand: which of the 114 old controls map to which of the 93 new controls, which controls were merged (no gap), which were restructured (may require control updates), and which 11 are genuinely new (definite gap). Understanding this history prevents both missing genuine gaps and unnecessarily rebuilding controls that are already in compliance."}
},
{
  title:"ISO 27002 in the ISO 27000 Family",
  tagline:"Understanding how the control catalog fits with the broader standards ecosystem",
  body:`<p>ISO 27002 does not exist in isolation&#8212;it is the foundational security control reference for an entire family of ISO standards addressing information security, cybersecurity, and privacy management. Understanding how ISO 27002 relates to ISO 27001, ISO 27017, ISO 27018, ISO 27701, and other family members is essential for building integrated security and privacy programs efficiently.</p>
  <div class="highlight-box"><strong>ISO 27002&#8217;s role in the family:</strong> ISO 27002 is the &#8220;control catalog parent&#8221; of the ISO 27000 family. Almost every other standard in the family either: references ISO 27002 controls directly, extends ISO 27002 controls with domain-specific guidance, or adds new controls that complement the ISO 27002 baseline. Understanding ISO 27002 makes every other ISO 27000 family standard easier to understand and implement.</div>
  <div class="cheat-grid">
    <div class="cheat-pill"><strong>ISO 27001&#8212;The Certifiable ISMS</strong><span>The management system standard you certify to. ISO 27001 Annex A contains all 93 ISO 27002 controls as a reference list. Organizations use ISO 27001 to prove they have a functioning ISMS that selects and implements appropriate controls from ISO 27002. ISO 27001 is the &#8220;how you manage security&#8221;; ISO 27002 is &#8220;what security controls you implement.&#8221;</span></div>
    <div class="cheat-pill"><strong>ISO 27017&#8212;Cloud Security Extension</strong><span>Extends ISO 27002 controls with cloud-specific implementation guidance and adds 7 new cloud-specific controls (CLD prefix). For each applicable ISO 27002 control, ISO 27017 shows how to implement it in cloud environments. ISO 27002 is the base; ISO 27017 is the cloud layer on top.</span></div>
    <div class="cheat-pill"><strong>ISO 27018&#8212;Cloud Privacy Extension</strong><span>Extends ISO 27002 controls with PII-specific implementation guidance for cloud processors. Adds privacy controls addressing consent, transparency, and data subject rights. ISO 27002 provides security foundation; ISO 27018 adds the cloud privacy governance layer.</span></div>
    <div class="cheat-pill"><strong>ISO 27701&#8212;Privacy Management Extension</strong><span>Extends both ISO 27001 and ISO 27002 to create a Privacy Information Management System (PIMS). ISO 27701 Annex A provides privacy-specific implementation guidance for each relevant ISO 27002 control, showing how security controls must be adapted when the goal is protecting privacy as well as security.</span></div>
    <div class="cheat-pill"><strong>ISO 27035&#8212;Incident Management</strong><span>Provides detailed guidance specifically on information security incident management&#8212;expanding on ISO 27002&#8217;s incident management controls with a comprehensive incident response framework. Organizations implementing ISO 27002&#8217;s incident controls can use ISO 27035 for deeper operational guidance.</span></div>
    <div class="cheat-pill"><strong>ISO 27005&#8212;Information Security Risk Management</strong><span>Provides detailed guidance on information security risk assessment and treatment&#8212;the process that determines which ISO 27002 controls an organization needs to implement. ISO 27005 guides the risk management process; ISO 27002 provides the control catalog from which risk treatments are selected.</span></div>
  </div>
  <div class="analogy-box"><strong>ISO 27002 as the master ingredient list:</strong> If the ISO 27000 family is a restaurant, ISO 27002 is the master pantry&#8212;the comprehensive list of all possible security ingredients an organization might need. ISO 27001 is the quality management system ensuring the kitchen operates properly. ISO 27017, 27018, and 27701 are specialized cookbooks showing how to use specific pantry ingredients for cloud, privacy, and privacy management contexts. ISO 27005 is the recipe planning process that determines which ingredients are needed for your specific situation.</div>`,
  quiz:{q:"An organization has ISO 27001 certification. They are adopting cloud services and processing EU customer personal data. Which ISO 27000 family standards should guide their expanded security and privacy program?",opts:["ISO 27001 alone is sufficient&#8212;it covers all use cases","ISO 27017 for cloud security controls, ISO 27018 for cloud privacy processor obligations, and ISO 27701 for the Privacy Information Management System&#8212;all building on the ISO 27002 control foundation already established through ISO 27001. Each standard adds domain-specific depth to the base controls.","They need to replace ISO 27001 with GDPR","They need separate certifications that are not related to the ISO 27000 family"],ans:1,explain:"This scenario illustrates the ISO 27000 family&#8217;s layered design. The existing ISO 27001/27002 foundation covers general information security. Adding cloud services triggers ISO 27017 (cloud-specific security controls). Processing EU customer data as a cloud processor triggers ISO 27018 (cloud PII processor controls). Managing a comprehensive privacy program triggers ISO 27701 (PIMS). Each standard builds on ISO 27002 as the base rather than starting from scratch&#8212;this is the design efficiency the family structure is intended to provide."}
},
{
  title:"The 2022 Restructuring&#8212;From 14 Domains to 4 Themes",
  tagline:"Why the most significant reorganization in ISO 27002&#8217;s history matters for practitioners",
  body:`<p>The jump from ISO 27002:2013 to ISO 27002:2022 was the most significant structural change in the standard&#8217;s history. Understanding this restructuring is not just academic&#8212;every organization transitioning from the 2013 to 2022 version must understand what changed, why it changed, and what gaps the new controls address that the old version did not.</p>
  <div class="highlight-box"><strong>The 2013 to 2022 transformation at a glance:</strong><br><br>ISO 27002:2013: <strong>114 controls, 14 domains, 35 control objectives</strong><br>ISO 27002:2022: <strong>93 controls, 4 themes, 11 new controls</strong><br><br>Net change: 21 fewer controls (114 &#8594; 93), but this masks significant restructuring: controls were merged, renamed, and reorganized. 57 of the original controls remain essentially unchanged; 24 were merged into 11 combined controls; 23 were renamed with substantive scope changes; and 11 entirely new controls address topics not in the 2013 version at all.</div>
  <p>The four 2022 themes and their control counts:</p>
  <div class="cheat-grid">
    <div class="cheat-pill"><strong>5&#8202;&#8202;&#8212; Organizational Controls (37)</strong><span>Policies, roles, responsibilities, threat intelligence, information security in projects, asset management, access control policy, identity management, supplier relationships, incident management, business continuity, and compliance. The governance and process controls that frame everything else.</span></div>
    <div class="cheat-pill"><strong>6&#8202;&#8202;&#8212; People Controls (8)</strong><span>Screening, employment terms, awareness training, disciplinary process, responsibility after employment, confidentiality agreements, remote working, and information security event reporting. The human dimension of security.</span></div>
    <div class="cheat-pill"><strong>7&#8202;&#8202;&#8212; Physical Controls (14)</strong><span>Physical security perimeters, entry controls, office security, external threat monitoring, working in secure areas, clear desk/screen, equipment siting, supporting utilities, cabling security, equipment maintenance, asset disposal, equipment off premises, secure disposal, and unattended user equipment. The physical protection layer.</span></div>
    <div class="cheat-pill"><strong>8&#8202;&#8202;&#8212; Technological Controls (34)</strong><span>All the technical controls: user endpoints, privileged access, authentication, application access, secure configuration, malware protection, vulnerability management, audit logging, monitoring, web filtering, cryptography, network security, network segregation, and more. The largest theme by control count.</span></div>
  </div>
  <p>The 2013 version&#8217;s 14 domains (for reference when transitioning existing programs):</p>
  <div class="badge-row">
    <span class="badge badge-gray">A.5 Information Security Policies</span>
    <span class="badge badge-gray">A.6 Organization of Info Security</span>
    <span class="badge badge-gray">A.7 Human Resource Security</span>
    <span class="badge badge-gray">A.8 Asset Management</span>
    <span class="badge badge-gray">A.9 Access Control</span>
    <span class="badge badge-gray">A.10 Cryptography</span>
    <span class="badge badge-gray">A.11 Physical and Environmental Security</span>
    <span class="badge badge-gray">A.12 Operations Security</span>
    <span class="badge badge-gray">A.13 Communications Security</span>
    <span class="badge badge-gray">A.14 System Acquisition Development Maintenance</span>
    <span class="badge badge-gray">A.15 Supplier Relationships</span>
    <span class="badge badge-gray">A.16 Information Security Incident Management</span>
    <span class="badge badge-gray">A.17 Business Continuity Management</span>
    <span class="badge badge-gray">A.18 Compliance</span>
  </div>`,
  quiz:{q:"An organization&#8217;s ISO 27001 certification was issued in 2021 under the 2013 standard. By when must they transition to the 2022 version, and what work does the transition involve?",opts:["No transition is required&#8212;2013 certificates are permanently valid","They must transition to ISO 27002:2022 by October 2025. The transition work involves: mapping their existing 114 controls to the 93 new controls, identifying which of the 11 new controls apply to their context and implementing them, updating their Statement of Applicability to reference 2022 controls, and having their certification body conduct a transition audit.","They need a completely new ISO 27001 certification from scratch","Transition is voluntary and has no deadline"],ans:1,explain:"IAF (International Accreditation Forum) mandated that all ISO 27001 certifications must transition to the 2022 version by October 31, 2025. Certifications not transitioned by that date lapse. The transition involves substantive work: updating the Statement of Applicability from 114 to 93 controls (with explicit justification for inclusions and exclusions), implementing the 11 new controls where applicable, and having a certification body conduct a transition assessment verifying the updated ISMS meets the 2022 requirements. Organizations that wait until late 2025 face significant time pressure."}
},
{
  title:"The Five-Attribute Tagging System",
  tagline:"ISO 27002&#8217;s powerful new tool for filtering, selecting, and communicating controls",
  body:`<p>One of the most innovative features of ISO 27002:2022 is the introduction of a <span class="key-term">five-attribute tagging system</span> that categorizes each control along five independent dimensions. This attribute system transforms the control catalog from a simple list into a multidimensional taxonomy&#8212;enabling organizations to filter controls by purpose, security property, cybersecurity framework alignment, operational domain, or security domain in ways the 2013 version never supported.</p>
  <div class="highlight-box"><strong>Why the attribute system matters:</strong> Different stakeholders care about different attributes. A CISO preparing a risk treatment plan cares about control type (preventive vs. detective vs. corrective). A compliance team mapping to NIST CSF cares about cybersecurity concept alignment. A business unit owner cares about operational capability domain. A board-level risk committee cares about CIA triad properties. The same controls can be filtered and presented differently for each audience&#8212;without maintaining separate control catalogs.</highlight-box>
  <p>The five attributes and their values:</p>
  <div class="ctrl-em"><b>Attribute 1&#8212;Control Type</b><br>How the control acts on risk: <strong>Preventive</strong> (stops incidents from occurring), <strong>Detective</strong> (identifies incidents that have occurred), or <strong>Corrective</strong> (restores security after an incident). A control can have multiple types. Malware protection is primarily preventive; audit logging is primarily detective; incident response is primarily corrective.</div>
  <div class="ctrl-em"><b>Attribute 2&#8212;Information Security Properties</b><br>Which CIA triad properties the control supports: <strong>Confidentiality</strong> (prevents unauthorized disclosure), <strong>Integrity</strong> (prevents unauthorized modification), or <strong>Availability</strong> (ensures systems are accessible when needed). Most controls protect multiple properties; some primarily protect one.</div>
  <div class="ctrl-em"><b>Attribute 3&#8212;Cybersecurity Concepts</b><br>Alignment with the NIST Cybersecurity Framework 1.0 functions: <strong>Identify</strong>, <strong>Protect</strong>, <strong>Detect</strong>, <strong>Respond</strong>, or <strong>Recover</strong>. This attribute enables direct mapping between ISO 27002 and NIST CSF&#8212;a significant convenience for organizations operating under both frameworks or reporting to stakeholders familiar with NIST terminology.</div>
  <div class="ctrl-em"><b>Attribute 4&#8212;Operational Capabilities</b><br>The operational security domain the control belongs to, covering 13 domains including: Governance, Asset Management, Information Protection, Human Resource Security, Physical Security, System and Network Security, Application Security, Secure Configuration, Identity and Access Management, Threat and Vulnerability Management, Continuity, Supplier Relationships, and Legal and Compliance.</div>
  <div class="ctrl-em"><b>Attribute 5&#8212;Security Domains</b><br>Which of four broad security strategy domains the control addresses: <strong>Governance and Ecosystem</strong> (organizational context and supply chain), <strong>Protection</strong> (technical and administrative safeguards), <strong>Defence</strong> (active monitoring and response), or <strong>Resilience</strong> (continuity and recovery).</div>
  <div class="analogy-box"><strong>The attribute system as a control filter:</strong> Imagine a clothing store that tags every item with: fabric type, weather suitability, formality level, color family, and size. Rather than browsing every item, shoppers can filter to &#8220;wool, winter, formal, navy, size M&#8221; and see exactly what meets their needs. ISO 27002&#8217;s attribute system works the same way for controls. A security architect can filter to &#8220;Preventive, Confidentiality, Protect, Identity and Access Management&#8221; and instantly see all relevant controls without reviewing the entire catalog.</div>`,
  quiz:{q:"A security team wants to identify all ISO 27002:2022 controls that are primarily Detective in type and relate to the Detect function of the NIST Cybersecurity Framework. How does the attribute system help?",opts:["The attribute system does not help&#8212;controls must be reviewed individually","The attribute system enables filtering by Control Type = Detective AND Cybersecurity Concept = Detect. Controls tagged with both attributes are directly relevant. Without the attribute system, identifying these controls would require manually reviewing all 93 controls and subjectively categorizing them&#8212;time-consuming and inconsistent across team members.","Only the Technological theme contains detective controls","The NIST mapping requires a separate document not included in ISO 27002"],ans:1,explain:"The five-attribute system&#8217;s practical value lies precisely in enabling this kind of multi-dimensional filtering. Control Type = Detective + Cybersecurity Concept = Detect identifies controls like audit logging (8.15), monitoring activities (8.16), web filtering (8.23), and technical vulnerability management (8.8)&#8212;the controls an organization would implement to build its detection capability. This filtering would take minutes with the attribute system and potentially hours without it. ISO 27002:2022&#8217;s introduction of attributes directly addresses feedback that the 2013 version was difficult to navigate for purpose-specific control selection."}
},
{
  title:"Organizational Controls&#8212;Policies and Governance (5.1&#8211;5.8)",
  tagline:"The governance framework that makes everything else work",
  body:`<p>The <span class="key-term">Organizational controls</span> are the largest theme in ISO 27002:2022 (37 controls, 5.1&#8211;5.37), covering the governance structures, policies, roles, and processes that frame all security activity. Security cannot be effective without the organizational foundation these controls establish&#8212;technology controls without governance fail just as surely as governance without technology controls. We cover the foundational governance controls first.</p>
  <div class="highlight-box"><strong>Why governance controls matter most:</strong> Technical security controls are only as effective as the organizational decisions that deploy, configure, and maintain them. If no one has defined what information must be protected (information classification), who is responsible for protecting it (roles and responsibilities), or what the acceptable risk appetite is (risk management process), technical controls become disconnected tools solving undefined problems. Organizational controls provide the context within which technical controls make sense.</highlight-box>
  <div class="theme-org"><b>5.1&#8212;Policies for Information Security</b><br>The organization must define, approve, publish, and communicate information security policies&#8212;at both the strategic level (the overall information security policy) and at the topic-specific level (password policy, access control policy, acceptable use policy, etc.). Policies must be reviewed at planned intervals and updated when significant changes occur. This is the foundation all other controls rest on.</div>
  <div class="theme-org"><b>5.2&#8212;Information Security Roles and Responsibilities</b><br>All information security responsibilities must be defined, allocated, and communicated. Someone must own each security requirement&#8212;either a role (CISO, system owner, data custodian) or a named individual for specific assets. Unassigned security responsibilities reliably become no one&#8217;s responsibility in practice.</div>
  <div class="theme-org"><b>5.3&#8212;Segregation of Duties</b><br>Conflicting duties and areas of responsibility should be segregated to reduce opportunities for unauthorized or unintentional modification or misuse of the organization&#8217;s assets. No single person should control an entire end-to-end process for high-value or high-risk operations&#8212;the classic example being that the person who approves payments should not be the same person who can execute them.</div>
  <div class="theme-org"><b>5.4&#8212;Management Responsibilities</b><br>Management must actively require all personnel to apply information security in accordance with the established policies. Security compliance cannot be treated as optional or aspirational&#8212;it must be a formal management expectation with accountability. This control ensures security is a line management responsibility, not just a compliance department function.</div>
  <div class="theme-org"><b>5.5&#8212;Contact with Authorities</b><br>The organization must maintain appropriate contacts with relevant authorities (law enforcement, regulators, national cyber security centers). These contacts ensure the organization knows who to call when an incident has potential legal implications and can benefit from government threat intelligence.</div>
  <div class="theme-org"><b>5.6&#8212;Contact with Special Interest Groups</b><br>Maintain contacts with special interest groups&#8212;industry security associations, professional forums, vendor security communities, information sharing and analysis centers (ISACs). These contacts keep the security program current with evolving threats and best practices.</div>
  <div class="theme-org"><b>5.7&#8212;Threat Intelligence (New in 2022)</b><br>Information about threats should be collected, analyzed, and produced to inform security decisions. Organizations must establish processes for gathering threat intelligence from internal and external sources, analyzing its relevance, and using it to update risk assessments and security controls proactively.</div>
  <div class="theme-org"><b>5.8&#8212;Information Security in Project Management</b><br>Information security must be integrated into project management throughout the project lifecycle&#8212;not added as an afterthought after systems are built. Security requirements should be identified in project initiation, assessed during design, and verified before go-live. Projects that bypass security review produce systems requiring expensive retrofit.</div>`,
  quiz:{q:"A company launches a new customer-facing application without involving the security team until after deployment. The application then fails its security review and requires six months of remediation. Which ISO 27002 control was not followed?",opts:["5.1 Policies for Information Security&#8212;they lacked a security policy","5.8 Information Security in Project Management&#8212;security requirements must be incorporated throughout the project lifecycle, not assessed after deployment. Had security been integrated at the design stage, issues would have been identified when they were cheapest to fix&#8212;during design&#8212;not after deployment when remediation is most expensive.","5.2 Information Security Roles and Responsibilities","5.3 Segregation of Duties"],ans:1,explain:"5.8 Information Security in Project Management is specifically designed to prevent this costly scenario. The &#8220;security bolt-on&#8221; anti-pattern&#8212;building a system and then adding security afterward&#8212;is reliably more expensive and less effective than security-by-design. ISO 27002 requires that security requirements be identified at the start of projects, incorporated into system requirements, considered during design, and verified before deployment. When security is integrated throughout the SDLC, issues are found when they cost $1 to fix rather than $100 after deployment."}
},
{
  title:"Organizational Controls&#8212;Asset Management and Classification (5.9&#8211;5.14)",
  tagline:"You cannot protect what you do not know you have",
  body:`<p>A consistent finding across security assessments is that organizations trying to protect their information often do not know exactly what information they have, where it is, who owns it, or how sensitive it is. The asset management and information classification controls in ISO 27002 address this fundamental problem&#8212;you cannot implement appropriate security controls without knowing what you are protecting.</p>
  <div class="highlight-box"><strong>The asset management challenge in modern organizations:</strong> Traditional asset management tracked physical servers and computers. Modern information asset management must track: cloud-hosted data across multiple providers, data processed by third-party SaaS applications, information shared with partners and suppliers, data created and stored by employees on personal devices, and information generated by automated processes. Without systematic inventory, organizations routinely discover sensitive information in unexpected places only after a breach reveals it.</highlight-box>
  <div class="theme-org"><b>5.9&#8212;Inventory of Information and Other Associated Assets</b><br>Organizations must identify and maintain an inventory of information assets and their associated processing assets (hardware, software, networks, people, premises). The inventory should identify owners, classification levels, and locations. This is the foundational control&#8212;without knowing what you have, you cannot know what to protect or how to protect it appropriately.</div>
  <div class="theme-org"><b>5.10&#8212;Acceptable Use of Information and Other Associated Assets</b><br>Policies, procedures, and rules for acceptable use must be documented and implemented for all users accessing organizational information and assets. Acceptable use policies establish clear expectations: what employees can and cannot do with company systems and information, covering personal use, removable media, public Wi-Fi access, and handling of sensitive information.</div>
  <div class="theme-org"><b>5.11&#8212;Return of Assets</b><br>Personnel and other interested parties must return organizational assets upon termination or change of employment, role, or contract. Uncollected assets at offboarding is a surprisingly common security gap&#8212;former employees or contractors retaining laptops, mobile devices, access tokens, or copies of sensitive information create ongoing exposure.</div>
  <div class="theme-org"><b>5.12&#8212;Classification of Information</b><br>Information must be classified according to security requirements based on confidentiality, integrity, and availability needs. Classification schemes typically use labels like Confidential, Internal, Public (or similar). Classification determines which controls are appropriate for each information type&#8212;enabling proportionate security rather than treating all information identically.</div>
  <div class="theme-org"><b>5.13&#8212;Labeling of Information</b><br>Information classification labels must be applied to information in ways that are visible and meaningful. Labeled documents, emails, files, and databases make classification actionable&#8212;users and systems can apply appropriate handling procedures when classification is visible. Classification without labeling is classification in theory only.</div>
  <div class="theme-org"><b>5.14&#8212;Information Transfer</b><br>Policies, procedures, and controls must govern the transfer of information within and outside the organization, across all communication facilities (email, file transfer, physical media, voice). Information transfer controls prevent sensitive information from leaving the organization inappropriately and ensure that what does leave is appropriately protected in transit.</div>
  <div class="analogy-box"><strong>The safe deposit box analogy for classification:</strong> A bank does not put all customer items in one undifferentiated vault. Different items get different protection: cash goes in a secured vault, documents go in safe deposit boxes, public literature goes in the lobby. The bank classifies what it holds and applies proportionate protection. ISO 27002&#8217;s classification controls do the same for organizational information: identifying what it holds, labeling it by sensitivity, and applying controls proportionate to its sensitivity rather than treating all information identically.</div>`,
  quiz:{q:"An organization has a classification scheme (Confidential, Internal, Public) but does not apply labels to documents, emails, or files. Users handle information based on their own judgment about sensitivity. What control gap does this represent?",opts:["Only 5.12 Classification of Information is missing&#8212;the scheme itself is the key control","Both 5.12 (Classification of Information) and 5.13 (Labeling of Information) are poorly implemented. Having a classification scheme without applying labels means classification exists in policy only&#8212;users have no visible indicator to guide their handling. Without labels, the same document might be handled as Confidential by one user and Public by another, making consistent protection impossible.","5.13 is a minor optional control&#8212;only the scheme matters","Classification only applies to electronic documents, not emails"],ans:1,explain:"5.12 and 5.13 are designed as a pair. Classification (5.12) defines the scheme; Labeling (5.13) makes it actionable. A classification scheme without labeling is like a speed limit that isn&#8217;t posted anywhere&#8212;the rule exists but cannot be followed consistently. Without visible labels, users cannot know how to handle information appropriately, systems cannot apply automated protection based on classification, and recipients cannot know what handling the sender intended. Both controls are essential for classification to function as an operational security measure rather than just a policy commitment."}
},
{
  title:"Organizational Controls&#8212;Access Control and Identity (5.15&#8211;5.18)",
  tagline:"Governing who can access what, and ensuring that access is appropriate and controlled",
  body:`<p><span class="key-term">Access control</span> is one of the most fundamental information security concepts&#8212;ensuring that only authorized users can access information, and only the information they need to do their jobs. The ISO 27002 organizational access controls establish the governance framework: the policies, roles, and lifecycle management that make technical access controls meaningful.</p>
  <div class="highlight-box"><strong>Access control governance vs. access control technology:</strong> It is tempting to think of access control as a purely technical problem&#8212;configure the Active Directory rights, set the database permissions, configure the firewall rules. But technical access controls are only as good as the decisions that configure them. Who decides who gets access to what? How are access rights reviewed? What happens when someone changes roles? The organizational access controls in 5.15&#8211;5.18 govern these decisions; the technical controls in the Technological theme implement them.</highlight-box>
  <div class="theme-org"><b>5.15&#8212;Access Control Policy</b><br>The organization must establish, document, and review an access control policy based on business and information security requirements. This policy defines: the principles governing access (need-to-know, least privilege), the process for granting and revoking access, who has authority to approve access requests, and how access will be reviewed periodically. The policy is the framework within which all specific access decisions are made.</div>
  <div class="theme-org"><b>5.16&#8212;Identity Management</b><br>The full lifecycle of digital identities must be managed&#8212;from creation through modification to deactivation. Every individual accessing organizational systems must have a unique, personal identifier (no shared accounts for accountability reasons). Processes must ensure timely provisioning when people join, timely modification when roles change, and timely deprovisioning when people leave. Accumulated access rights (privilege creep) is one of the most common access control failures.</div>
  <div class="theme-org"><b>5.17&#8212;Authentication Information</b><br>Authentication information&#8212;passwords, cryptographic keys, biometric data, authentication tokens&#8212;must be managed through formal, controlled processes. This includes: secure password distribution when accounts are created, requirements for users to change initial credentials, guidance on creating strong authentication information, and storing authentication information securely (hashed, never in plain text).</div>
  <div class="theme-org"><b>5.18&#8212;Access Rights</b><br>Access rights to information and associated assets must be provisioned, reviewed, modified, and removed in accordance with the access control policy. Specific requirements include: formal authorization before access is granted, regular access reviews (at minimum annually), immediate revocation when access is no longer required, and periodic reconciliation between intended and actual access rights to identify unauthorized access.</div>
  <div class="analogy-box"><strong>Privilege creep&#8212;the most common access control failure:</strong> Imagine an employee who starts as a data entry clerk (access to enter data), then moves to data analysis (access to read all data), then temporarily fills in for the security team (access to all systems), then returns to analysis. At each step, new access is added&#8212;but the old access is never removed. After two years, this employee has accumulated administrator rights across multiple systems that their current role does not require. ISO 27002&#8217;s 5.18 access rights controls, particularly the regular review requirement, are specifically designed to catch and remediate this privilege creep before it becomes a significant security risk.</div>`,
  quiz:{q:"An access review reveals that 47 of 500 user accounts belong to employees who left the organization between 1 and 18 months ago and still have active access rights. Which ISO 27002 controls failed?",opts:["5.15 Access Control Policy failed&#8212;the policy is clearly inadequate","Multiple controls failed: 5.16 Identity Management (timely deprovisioning upon departure), 5.18 Access Rights (removal of access when no longer required, periodic access reviews that should have caught these accounts). The scale of the failure (47 accounts over 18 months) suggests systematic process failure rather than isolated incidents&#8212;either the offboarding process doesn&#8217;t include access deprovisioning, or access reviews are not being conducted.","Only 5.17 Authentication Information failed","This is an HR issue, not a security control failure"],ans:1,explain:"Active accounts for departed employees represents failures across 5.16 (Identity Management) and 5.18 (Access Rights). 5.16 requires timely deprovisioning&#8212;accounts should be disabled on the employee&#8217;s last day, not weeks or months later. 5.18 requires periodic access reviews that would identify and remediate orphaned accounts between offboarding events. 47 accounts spanning 18 months indicates both controls failed: the offboarding process did not reliably trigger access deprovisioning, and access reviews either were not conducted or failed to identify these accounts. This is exactly the risk that compromised accounts represent&#8212;a disgruntled former employee retaining access for 18 months."}
},
{
  title:"Organizational Controls&#8212;Supplier and Supply Chain Security (5.19&#8211;5.22)",
  tagline:"Extending security governance beyond organizational boundaries",
  body:`<p>Modern organizations rarely operate in isolation&#8212;they depend on dozens to hundreds of suppliers, vendors, and service providers who have varying degrees of access to organizational information, systems, and infrastructure. The <span class="key-term">supplier relationship controls</span> in ISO 27002 address one of the most significant and most commonly neglected dimensions of security: ensuring that your security posture is not undermined by the security practices of the organizations you depend on.</p>
  <div class="highlight-box"><strong>The supply chain security imperative:</strong> High-profile breaches including SolarWinds (2020) and MOVEit (2023) demonstrated conclusively that sophisticated attackers will target the suppliers of well-defended organizations as an attack vector. If a target organization&#8217;s own security is excellent, attackers will look for trusted suppliers with access to the target&#8212;compromising the supplier to compromise the target. ISO 27002&#8217;s supplier controls require organizations to extend their security governance outward through their supply chains rather than treating the organizational boundary as a security perimeter.</highlight-box>
  <div class="theme-org"><b>5.19&#8212;Information Security in Supplier Relationships</b><br>Processes and procedures must be implemented to manage information security risks associated with suppliers. This begins with identifying which suppliers have access to organizational information or systems, assessing the security risks each relationship creates, and establishing appropriate security requirements for each category of supplier relationship.</div>
  <div class="theme-org"><b>5.20&#8212;Addressing Information Security within Supplier Agreements</b><br>All relevant information security requirements must be established and agreed with each supplier. This means going beyond generic &#8220;you agree to maintain reasonable security measures&#8221; clauses to specific, measurable security requirements. What security certifications must the supplier maintain? What are their incident notification obligations? What data processing restrictions apply? What access controls govern their access to organizational systems?</div>
  <div class="theme-org"><b>5.21&#8212;Managing Information Security in the ICT Supply Chain</b><br>This 2022 control focuses specifically on the security of the information and communications technology supply chain&#8212;the hardware, software, and services that form the organization&#8217;s technology stack. Software Bill of Materials (SBOM), hardware component verification, and sub-supplier management are all addressed. SolarWinds made this control&#8217;s importance unmistakable.</div>
  <div class="theme-org"><b>5.22&#8212;Monitoring, Review, and Change Management of Supplier Services</b><br>Supplier security cannot be assessed once at contract signing and forgotten. Organizations must monitor supplier service delivery, review supplier security performance against agreed requirements, and manage changes to supplier services (including changes to the supplier&#8217;s own sub-suppliers). Annual supplier security reviews, right-to-audit clauses, and supplier security reporting requirements implement this control.</div>
  <div class="analogy-box"><strong>The franchisee audit analogy:</strong> A major fast food chain does not simply trust that every franchise outlet maintains food safety standards. They audit franchisees regularly, require compliance with specific food safety protocols, require immediate reporting of food safety incidents, and can revoke franchisee rights for persistent non-compliance. The brand&#8217;s food safety depends on every outlet&#8217;s practices&#8212;so they systematically verify those practices. ISO 27002&#8217;s supplier controls require organizations to apply the same systematic verification logic to their information security supply chain: the organization&#8217;s security posture depends partly on suppliers&#8217; security practices, so those practices must be systematically monitored.</div>`,
  quiz:{q:"A software vendor discovers that one of their key sub-suppliers (a cloud infrastructure provider) experienced a significant breach. The vendor&#8217;s customer organization had assessed the vendor&#8217;s security but never identified or assessed the sub-supplier relationship. Which control gap does this illustrate?",opts:["5.19 only&#8212;they should have better assessed the vendor&#8217;s security","5.21 Information Security in the ICT Supply Chain&#8212;organizations must understand and manage security risks not just in their direct supplier relationships but through the supply chain to significant sub-suppliers. The vendor assessment covered first-tier risk; 5.21 requires understanding the chain of dependencies. In practice, this means requiring vendors to disclose significant sub-supplier relationships and their security posture.","5.22 Monitoring failed because they should have monitored the breach","Supplier sub-suppliers are outside the scope of organizational security requirements"],ans:1,explain:"5.21 addresses exactly this multi-tier supply chain scenario. The SolarWinds attack demonstrated that sophisticated attackers target the trusted suppliers of well-defended organizations&#8212;not the organization directly. ISO 27002:2022 added 5.21 specifically to address ICT supply chain risk, requiring organizations to understand their supply chains beyond the first tier. In practice, this means requiring key vendors to disclose their significant sub-suppliers, including those in their supply chains in security assessments, and requiring notification when significant sub-supplier changes occur."}
},
{
  title:"Organizational Controls&#8212;Incident Management and Business Continuity (5.24&#8211;5.30)",
  tagline:"Preparing for, responding to, and recovering from security incidents",
  body:`<p>Security incidents are inevitable&#8212;every organization will eventually face a breach, a ransomware attack, an insider threat, or another security event. The question is not whether but when, and whether the organization is prepared to respond effectively. ISO 27002&#8217;s incident management and business continuity controls ensure organizations are not improvising their response when incidents occur.</p>
  <div class="theme-org"><b>5.24&#8212;Information Security Incident Management Planning and Preparation</b><br>Responsibilities and procedures must be established for effective response to information security incidents. The incident response plan must: define what constitutes an incident (and distinguish it from a lower-level event), establish escalation paths and communication procedures, identify who has authority to make which decisions during incidents, and assign clear roles to incident response team members. Plans that exist only in a document nobody has read are not prepared organizations.</div>
  <div class="theme-org"><b>5.25&#8212;Assessment and Decision on Information Security Events</b><br>Not every security event is a security incident requiring a full response. Organizations must establish criteria and processes for triaging security events&#8212;determining which require incident response, which require monitoring without escalation, and which are false positives. Consistent triage criteria prevent both over-reaction (activating incident response for routine events) and under-reaction (missing genuine incidents in noise).</div>
  <div class="theme-org"><b>5.26&#8212;Response to Information Security Incidents</b><br>Incidents must be responded to in accordance with documented procedures&#8212;including containment (stopping the spread), eradication (removing the cause), recovery (restoring normal operations), evidence collection (for legal and forensic purposes), and communication (to affected parties, regulators, law enforcement as appropriate). Each phase requires pre-defined procedures rather than improvised responses.</div>
  <div class="theme-org"><b>5.27&#8212;Learning from Information Security Incidents</b><br>After incidents are resolved, post-incident reviews must identify root causes and improvement opportunities. The lessons learned from incidents should feed back into updated security controls, revised incident response procedures, and enhanced training. Organizations that treat incidents as isolated events to be closed rather than opportunities to improve will face the same incidents repeatedly.</div>
  <div class="theme-org"><b>5.28&#8212;Collection of Evidence</b><span> (for legal proceedings)</span><br>When incidents may lead to legal action or disciplinary proceedings, evidence must be collected in ways that preserve its integrity and admissibility. Chain of custody procedures, forensic imaging of compromised systems, and documented evidence handling are required. Evidence improperly collected may be inadmissible in legal proceedings.</div>
  <div class="theme-org"><b>5.29&#8212;Information Security During Disruption</b><br>Security controls must remain effective during disruptions, crises, and adverse situations. Business continuity planning must consider information security&#8212;ensuring that recovery processes maintain appropriate security rather than lowering security posture in the pressure of an emergency.</div>
  <div class="theme-org"><b>5.30&#8212;ICT Readiness for Business Continuity</b><br>ICT continuity must be planned, implemented, maintained, and tested based on business continuity objectives. Recovery time and recovery point objectives drive the technical continuity measures required. Backup and recovery systems must be tested regularly&#8212;backups that have never been tested are not confirmed working.</div>`,
  quiz:{q:"An organization experiences a ransomware attack on Friday afternoon. Their incident response plan exists but has never been tested or rehearsed. Key personnel do not know their roles, recovery procedures have not been practiced, and backup restoration has never been tested. What controls were inadequate?",opts:["Only 5.26 Response to Security Incidents&#8212;they have a plan but could not execute it","Multiple controls were inadequate: 5.24 (incident management planning must include rehearsal and testing&#8212;having an untested plan is inadequate preparation), 5.26 (personnel must know their roles&#8212;this requires training and exercises, not just documented procedures), and 5.30 (ICT readiness for business continuity must include tested backup and recovery procedures). An untested incident response plan is not preparation; it is documentation.","Only 5.30 ICT Readiness failed","Incident response plans are inherently improvised&#8212;no controls were violated"],ans:1,explain:"The critical insight across 5.24, 5.26, and 5.30 is that documented plans without testing and rehearsal are inadequate preparation. 5.24 requires effective preparation&#8212;which means personnel who know their roles, plans that have been walked through, and processes that have been exercised. 5.30 specifically requires that ICT continuity measures (including backup and recovery) be tested. Organizations that discover during an actual ransomware attack that their backup restoration has never been tested, that personnel don&#8217;t know their incident roles, and that their incident plan has never been rehearsed are in a much worse position than organizations that regularly test and improve their capabilities."}
},
{
  title:"Organizational Controls&#8212;Legal, Compliance, and Privacy (5.31&#8211;5.37)",
  tagline:"Ensuring security programs address legal obligations and privacy requirements",
  body:`<p>The final cluster of organizational controls addresses the intersection of information security with legal and regulatory requirements, intellectual property, privacy, and cryptography policy. These controls ensure that information security programs operate within legal frameworks and satisfy the increasingly complex web of regulatory obligations modern organizations face.</p>
  <div class="cheat-grid">
    <div class="cheat-pill"><strong>5.31&#8212;Legal, Statutory, Regulatory and Contractual Requirements</strong><span>Organizations must identify, document, and keep current all relevant legal, statutory, regulatory, and contractual requirements relating to information security. This includes: sector-specific regulations (HIPAA, PCI DSS, financial regulations), privacy laws (GDPR, CCPA), contractual security requirements from customers and partners, and international obligations. Compliance requirements must flow into security controls.</span></div>
    <div class="cheat-pill"><strong>5.32&#8212;Intellectual Property Rights</strong><span>Procedures must ensure compliance with legal, regulatory, and contractual requirements related to intellectual property rights and use of proprietary software products. This includes: properly licensed software, compliance with open-source license requirements, protection of organizational intellectual property from unauthorized disclosure, and controls around software piracy on organizational systems.</span></div>
    <div class="cheat-pill"><strong>5.33&#8212;Protection of Records</strong><span>Records must be protected from loss, destruction, falsification, unauthorized access, and unauthorized release in accordance with legal, regulatory, contractual, and business requirements. Records retention schedules must define how long records are kept and how they are eventually disposed of. Inadequate record protection can have legal, regulatory, and operational consequences.</span></div>
    <div class="cheat-pill"><strong>5.34&#8212;Privacy and Protection of PII</strong><span>Privacy and protection of PII must be ensured as required by relevant laws and regulations. This control directly connects ISO 27002 security controls to privacy compliance&#8212;acknowledging that protecting personal information is both a security and privacy obligation. ISO 27002 provides the security foundation; ISO 27701 and ISO 27018 provide the privacy governance layers.</span></div>
    <div class="cheat-pill"><strong>5.35&#8212;Independent Review of Information Security</strong><span>The organization&#8217;s approach to managing information security must be reviewed independently at planned intervals or when significant changes occur. Internal audit programs provide periodic assurance; external audits (ISO 27001 certification audits, penetration tests, red team exercises) provide independent verification. Self-assessment without independent review is insufficient for mature security programs.</span></div>
    <div class="cheat-pill"><strong>5.36&#8212;Compliance with Policies, Rules, and Standards for Information Security</strong><span>Managers must regularly review compliance with security policy, standards, and procedures within their area of responsibility. This internal compliance review ensures security policies are actually followed in day-to-day operations&#8212;not just documented in policy documents. Compliance reviews identify implementation gaps before external audits or incidents reveal them.</span></div>
    <div class="cheat-pill"><strong>5.37&#8212;Documented Operating Procedures</strong><span>Operating procedures for information processing facilities must be documented, maintained, and available to all users who need them. Critical operational processes must not exist only in individual employees&#8217; heads&#8212;documented procedures ensure continuity when key personnel are unavailable and enable consistent execution of security-critical operations.</span></div>
  </div>`,
  quiz:{q:"An organization&#8217;s legal team discovers that they are subject to a new sector-specific privacy regulation that became effective three months ago. The security team was unaware of the regulation and has not assessed its security implications. Which control failed?",opts:["5.34 Privacy and Protection of PII&#8212;they should have implemented privacy controls","5.31 Legal, Statutory, Regulatory and Contractual Requirements&#8212;this control requires organizations to identify, document, and keep current all relevant legal and regulatory requirements. The identification process failed&#8212;the regulation was enacted three months ago and the security team was still unaware. The security team should have a process for monitoring regulatory developments and assessing their implications.","5.35 Independent Review failed","5.36 Compliance with Policies failed"],ans:1,explain:"5.31 is a proactive control&#8212;it requires organizations to identify and monitor legal and regulatory requirements, not just comply with them once discovered. The failure here is in the identification and monitoring process: a regulation in force for three months should not be unknown to the security team. Effective 5.31 implementation includes: subscribing to regulatory monitoring services, having legal counsel brief the security team on relevant new requirements, maintaining a regulatory register that is regularly reviewed and updated, and having a process for assessing new requirements&#8217; security implications. The compliance failure begins with the identification failure."}
},
{
  title:"People Controls (6.1&#8211;6.8)",
  tagline:"Security through the human dimension&#8212;screening, training, and managing the people risk",
  body:`<p>People remain both the most important security asset and the most significant security risk in any organization. The <span class="key-term">People controls</span> (eight controls, 6.1&#8211;6.8) address the complete lifecycle of human involvement with organizational security&#8212;from pre-employment screening through employment to departure. These controls recognize that technology alone cannot secure an organization where the human dimension is unmanaged.</p>
  <div class="highlight-box"><strong>Why people controls are essential:</strong> The Verizon Data Breach Investigations Report consistently finds that human factors&#8212;phishing, credential theft, insider threats, and social engineering&#8212;are involved in the majority of data breaches. No amount of technical sophistication in firewalls, SIEM systems, or encryption helps if employees click phishing links, share credentials, or intentionally exfiltrate data. People controls address the human factors that technical controls cannot solve.</highlight-box>
  <div class="theme-ppl"><b>6.1&#8212;Screening</b><br>Background verification checks on all candidates for employment must be carried out prior to joining, in accordance with applicable laws, regulations, and ethics. Checks should be proportional to the sensitivity of the role&#8212;candidates for privileged IT access or roles handling sensitive financial/health data warrant more thorough screening than those with no access to sensitive systems. Screening verifies that people are who they claim to be and identifies relevant history that informs access decisions.</div>
  <div class="theme-ppl"><b>6.2&#8212;Terms and Conditions of Employment</b><br>Employment agreements must include information security responsibilities. Employees should be aware of and agree to their information security obligations as a condition of employment&#8212;including handling of confidential information, reporting security incidents, compliance with security policies, and consequences of non-compliance. Security responsibilities that are not in employment agreements may be unenforceable.</div>
  <div class="theme-ppl"><b>6.3&#8212;Information Security Awareness, Education and Training</b><br>All personnel and relevant contractors must receive appropriate security awareness education and training. Initial training when joining, recurring annual awareness training, and role-specific training for those with security responsibilities are all required. Training must be current&#8212;covering actual threats like phishing, social engineering, and password hygiene&#8212;not generic content recycled from years ago.</div>
  <div class="theme-ppl"><b>6.4&#8212;Disciplinary Process</b><br>A formal disciplinary process must be in place and communicated to take action against personnel who have committed security policy violations. The disciplinary process serves both as a consequence for violations and as a deterrent. Security violations without consistent consequence create a culture where policies are optional.</div>
  <div class="theme-ppl"><b>6.5&#8212;Responsibilities After Termination or Change of Employment</b><br>Information security responsibilities that remain valid after termination (such as confidentiality obligations) must be defined, communicated, and enforced. Departing employees must understand which obligations persist after their last day&#8212;typically confidentiality of trade secrets, non-disclosure of customer data, and non-solicitation of clients for defined periods.</div>
  <div class="theme-ppl"><b>6.6&#8212;Confidentiality or Non-Disclosure Agreements</b><br>Confidentiality/NDA requirements reflecting the organization&#8217;s needs for information protection must be identified, documented, regularly reviewed, and signed by employees and contractors. NDAs formalize and make legally enforceable the confidentiality obligations that 6.5 describes as persisting after employment.</div>
  <div class="theme-ppl"><b>6.7&#8212;Remote Working</b><br>When personnel work remotely, security measures must be implemented to protect information accessed, processed, or stored outside organizational premises. VPN requirements, secure home network guidance, physical privacy in public spaces, prohibition on using personal devices for organizational work (or MDM if personal devices are permitted), and clear desk requirements all fall under this control.</div>
  <div class="theme-ppl"><b>6.8&#8212;Information Security Event Reporting</b><br>Mechanisms must enable personnel to report observed or suspected information security events through appropriate channels promptly. A culture where employees feel safe reporting events without fear of blame enables faster incident detection. Anonymous reporting channels may reduce under-reporting of events caused by human error.</div>`,
  quiz:{q:"An employee receives a suspicious email requesting their credentials, recognizes it as a phishing attempt, and successfully avoids it. However, they don&#8217;t report it because they are unsure who to tell and worry they will be blamed for &#8216;almost&#8217; falling for it. Which People control was inadequately implemented?",opts:["6.3 Information Security Awareness Training&#8212;they should have better phishing training","6.8 Information Security Event Reporting&#8212;personnel must have clear mechanisms for reporting security events and must feel psychologically safe doing so. An employee who recognized a threat but did not know how to report it or feared blame represents a failure to establish effective reporting mechanisms and a blame-free reporting culture.","6.4 Disciplinary Process&#8212;there should be penalties for not reporting","6.2 Terms of Employment&#8212;reporting should be in their employment agreement"],ans:1,explain:"6.8 addresses both the mechanism (clear, known reporting channels) and the culture (employees feel safe reporting without fear of blame). This scenario illustrates a critical secondary failure: the employee successfully avoided the phishing attempt (a positive outcome) but the missed report means the organization lost potentially valuable threat intelligence. Knowing which phishing campaigns are targeting the organization enables proactive blocking, targeted awareness training, and threat intelligence sharing. Blame-free security event reporting&#8212;where employees are celebrated for reporting, not blamed for nearly falling for attacks&#8212;is essential for maximizing the organization&#8217;s collective security intelligence."}
},
{
  title:"Physical Controls&#8212;Premises and Equipment Security (7.1&#8211;7.9)",
  tagline:"Protecting information by protecting the physical environments where it is processed",
  body:`<p>In an era focused on cyber threats, physical security is sometimes neglected&#8212;yet physical access to systems often provides more devastating attack capability than remote cyber attacks. A laptop left in a coffee shop, a server room accessible without proper authentication, or an improperly disposed hard drive can compromise entire security programs. The <span class="key-term">Physical controls</span> (14 controls, 7.1&#8211;7.14) address the physical dimension of information security that remains critical even as processing moves to the cloud.</p>
  <div class="theme-phy"><b>7.1&#8212;Physical Security Perimeters</b><br>Security perimeters&#8212;including walls, card-controlled entry gates, and manned reception desks&#8212;must be used to protect areas containing sensitive information and information processing facilities. The concept of &#8220;security zones&#8221; applies: outer perimeter (building access), inner perimeter (office area access), secure zones (server rooms, data centers), and restricted zones (high-security research areas). Proportionate physical security matches the sensitivity of what is being protected.</div>
  <div class="theme-phy"><b>7.2&#8212;Physical Entry Controls</b><br>Secure areas must be protected by appropriate entry controls to ensure that only authorized personnel are allowed access. Visitor management (all visitors logged, escorted, badged), access card management (cards issued only with authorization, deactivated when no longer needed), and monitoring of access (logs of who accessed what areas when) implement this control.</div>
  <div class="theme-phy"><b>7.3&#8212;Securing Offices, Rooms, and Facilities</b><br>Physical security for offices, rooms, and facilities must be designed and applied. This extends beyond server rooms to include offices where sensitive conversations occur, rooms where sensitive documents are handled, and meeting rooms where confidential business is conducted. Physical eavesdropping (planted bugs, open windows overlooking whiteboards) is a real threat in sensitive environments.</div>
  <div class="theme-phy"><b>7.4&#8212;Physical Security Monitoring</b><br>Premises must be continuously monitored for unauthorized physical access. CCTV surveillance, intrusion detection systems, security guard patrols, and access control system monitoring all implement this control. Monitoring deters unauthorized access and provides evidence for investigation when incidents occur.</div>
  <div class="theme-phy"><b>7.5&#8212;Protecting Against Physical and Environmental Threats</b><br>Physical protection against natural disasters, deliberate attacks, and accidents must be designed and applied. This includes: fire suppression systems, flood protection for basement server rooms, earthquake bracing for equipment in seismic zones, protection against power grid failures, and temperature/humidity control for equipment areas.</div>
  <div class="theme-phy"><b>7.6&#8212;Working in Secure Areas</b><br>Procedures for working in secure areas must be designed and applied. Secure areas require specific behavioral controls: limited access even for authorized personnel (only those with a need), no unauthorized recording equipment (cameras, phones in some environments), no unescorted visitors, and specific procedures for bringing equipment in and out.</div>
  <div class="theme-phy"><b>7.7&#8212;Clear Desk and Clear Screen</b><br>Clear desk policies for papers and removable storage media, and clear screen policies for information processing facilities must be implemented. Sensitive documents left on desks, whiteboards not erased after meetings, and screens displaying sensitive information visible to passers-by are simple physical security risks with simple solutions. Screen locks activating after short idle periods are the primary technical implementation.</div>
  <div class="theme-phy"><b>7.8&#8212;Equipment Siting and Protection</b><br>Equipment must be sited and protected to reduce risks from environmental threats and hazards and from unauthorized access. Server rooms must not be below flood risk areas or next to poorly maintained water infrastructure; equipment must not be visible from public areas where it could be targeted for physical attack or photographed for reconnaissance.</div>
  <div class="theme-phy"><b>7.9&#8212;Security of Assets Off-Premises</b><br>Assets taken off-premises (laptops, mobile devices, portable storage) must be protected. Equipment used outside the organization&#8217;s physical security perimeters faces different threat landscapes: theft in coffee shops and hotels, damage in transit, shoulder surfing in public spaces, and connection to uncontrolled networks. Off-premises security policies must address these mobile-specific risks.</div>`,
  quiz:{q:"An employee leaves their laptop in their car overnight. The next morning, the car window is broken and the laptop is stolen. The laptop contains unencrypted customer data including payment card information. Which physical controls failed, and what technical control would have mitigated the damage?",opts:["Only 7.9 Security of Assets Off-Premises failed&#8212;the laptop should not have been left in the car","7.9 (assets off-premises must be protected&#8212;leaving a laptop containing sensitive data overnight in a car is inadequate protection) failed in the physical dimension. The missing technical control is full disk encryption&#8212;if the laptop had been encrypted, the stolen hardware would provide no access to customer data regardless of the physical security failure. Physical and technical controls must work together; physical security failures are inevitable and encryption is the backstop.","7.1 Physical Security Perimeters failed","The employee is solely responsible&#8212;no organizational controls failed"],ans:1,explain:"This scenario illustrates the defense-in-depth principle central to ISO 27002. Physical control 7.9 establishes that assets taken off-premises must be adequately protected&#8212;leaving a laptop with sensitive data in an unattended car overnight is clearly inadequate. However, organizational policies requiring full disk encryption (a technological control, 8.5 or addressed in cryptography sections) provide the backstop when physical security fails. An encrypted laptop stolen from a car exposes the organization to hardware replacement cost and business disruption&#8212;not to data breach and PCI DSS violation. The absence of encryption converted a property crime into a data breach."}
},
{
  title:"Physical Controls&#8212;Media and Equipment Disposal (7.10&#8211;7.14)",
  tagline:"Protecting information at the end of its physical lifecycle",
  body:`<p>Information security at the end of the equipment and media lifecycle is consistently one of the most overlooked dimensions of physical security. Organizations invest heavily in protecting data in active use and largely forget that the same data may remain recoverable from decommissioned hard drives, printed documents, backup tapes, and retired equipment for years after it is nominally &#8220;disposed of.&#8221;</p>
  <div class="cheat-grid">
    <div class="cheat-pill"><strong>7.10&#8212;Storage Media</strong><span>Media containing information must be managed through acquisition, use, transportation, and disposal. Media lifecycle controls include: inventory of removable media, encryption for portable media containing sensitive information, restrictions on use of personal removable media on organizational systems (USB drives are one of the most common data exfiltration vectors), and secure handling when transporting media containing sensitive information.</span></div>
    <div class="cheat-pill"><strong>7.11&#8212;Supporting Utilities</strong><span>Information processing facilities must be protected from power failure and other disruptions caused by failures in supporting utilities. Uninterruptible power supplies (UPS) for critical systems, backup generators for extended outages, redundant cooling for server rooms, and water/gas supply protection for data center environments all implement this control. Utility failures are among the most common causes of availability incidents.</span></div>
    <div class="cheat-pill"><strong>7.12&#8212;Cabling Security</strong><span>Power and telecommunications cabling carrying data or supporting information services must be protected from interception, interference, or damage. Physical cable protection (armored conduit in high-risk areas), documentation of cable runs (so unauthorized cables can be identified), separation of power and data cables (to prevent electromagnetic interference), and protection of cable connections from tampering implement this control.</span></div>
    <div class="cheat-pill"><strong>7.13&#8212;Equipment Maintenance</strong><span>Equipment must be maintained correctly to ensure availability and integrity. Maintenance schedules based on manufacturer recommendations, maintenance performed only by authorized personnel, records kept of maintenance activities, proper handling when equipment must leave the premises for maintenance (including removal of sensitive data before external servicing), and return-to-service verification after maintenance all fall under this control.</span></div>
    <div class="cheat-pill"><strong>7.14&#8212;Secure Disposal or Reuse of Equipment</strong><span>All items of equipment containing storage media must be verified prior to disposal or reuse to ensure all sensitive data and licensed software has been removed or securely overwritten. This is one of the most chronically under-implemented physical controls&#8212;organizations routinely donate, sell, or discard equipment with recoverable sensitive data. Secure disposal must cover: hard drives (degaussing or physical destruction for highest sensitivity, certified wiping for reuse), printed documents (cross-cut shredding), backup tapes (degaussing or physical destruction), and all portable media.</span></div>
  </div>
  <div class="warning-box"><strong>The 7.14 failure pattern:</strong> IT asset disposal is a documented, persistent security failure. Academic and journalistic research regularly demonstrates that hard drives purchased on secondary markets and from recycling programs contain recoverable patient records, financial data, and employee information. Organizations that hand equipment to general-purpose recyclers without requiring certified data destruction documentation (NIST 800-88 compliance, chain-of-custody certificates) are effectively donating their data along with the hardware. The technical implementation of 7.14 requires certified media sanitization&#8212;not just &#8220;deleting files&#8221; or &#8220;formatting the drive.&#8221;</div>
  <div class="analogy-box"><strong>The document shredder analogy:</strong> Most people understand intuitively that sensitive paper documents should be shredded before disposal rather than placed in the recycling bin intact. The physical equivalent of the same understanding for digital media is full disk encryption plus certified wiping or physical destruction. Just as a determined adversary could reconstruct a document from a recycling bin, a forensics tool can recover data from an improperly wiped hard drive. 7.14 requires that organizations apply the same common-sense protection to digital media that they would naturally apply to sensitive paper documents.</div>`,
