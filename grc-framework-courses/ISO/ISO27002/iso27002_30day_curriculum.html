  quiz:{q:"An organization donates 50 retired computers to a local school without wiping the hard drives. The computers contain years of employee HR records including social security numbers. Which control failed, and what is the regulatory consequence?",opts:["No control failed&#8212;computers donated to schools are not a security risk","7.14 Secure Disposal or Reuse of Equipment failed. All equipment containing storage media must be verified to have sensitive data removed before disposal or reuse&#8212;regardless of the recipient. The regulatory consequence likely includes: data breach notification obligations to affected employees (HR records with SSNs), potential HIPAA violation if any health information is present, and potential FTC Act violation for failure to implement reasonable security measures. The financial and reputational consequences of this disposal failure could far exceed the value of the donated equipment.","Only 5.33 Protection of Records failed","7.10 Storage Media failed&#8212;they should not have kept employee data on computers"],ans:1,explain:"7.14 applies to all equipment disposal, reuse, donation, and sale&#8212;the recipient&#8217;s benign intent (a school) does not reduce the security obligation. The control requires verification that sensitive data has been removed or securely overwritten before any disposal. &#8216;Deleting files&#8217; or &#8216;formatting the drive&#8217; does not satisfy this requirement&#8212;standard forensic tools can recover data from formatted drives. Certified wiping to NIST 800-88 standards or physical destruction is required for sensitive data. This disposal failure creates: breach notification obligations to employees (HR records), potential regulatory penalties, and significant reputational damage when the breach is discovered&#8212;all for a disposal decision that should have cost $5-10 per drive in certified wiping services."}
},
{
  title:"Technological Controls&#8212;Identity, Authentication, and Access (8.1&#8211;8.6)",
  tagline:"The technical implementation of who can access what",
  body:`<p>The <span class="key-term">Technological controls</span> are the largest theme in ISO 27002:2022 (34 controls, 8.1&#8211;8.34), covering all the technical security measures that protect information systems. We begin with the identity, authentication, and access controls that determine which users can access which systems and information&#8212;the technical implementation of the governance decisions made in the Organizational access controls.</p>
  <div class="theme-tec"><b>8.1&#8212;User Endpoint Devices</b><br>Information processed, stored, or used on user endpoint devices (laptops, desktops, smartphones, tablets) must be protected. Endpoint security requirements include: full disk encryption for mobile devices (any device that can leave the premises), device lock screens with short timeout periods, remote wipe capability for lost or stolen devices, mobile device management (MDM) for corporate-managed devices, and up-to-date security software.</div>
  <div class="theme-tec"><b>8.2&#8212;Privileged Access Rights</b><br>Allocation and use of privileged access rights must be restricted and managed. Privileged accounts (domain administrators, root accounts, database administrators, security administrators) represent the greatest attack value for adversaries. Controls include: minimal privileged accounts (only as many as operationally necessary), no everyday use of privileged accounts for routine tasks (admin accounts only when admin functions required), time-limited privileged access (just-in-time), monitoring of all privileged account activity, and regular review of privileged account holders.</div>
  <div class="theme-tec"><b>8.3&#8212;Information Access Restriction</b><br>Access to information and application system functions must be restricted in accordance with the access control policy. This is the technical implementation of role-based access control&#8212;ensuring systems enforce least privilege by giving users access only to the functions and data their role requires. Application-level access control, database access controls, and API authorization all implement this at the technical layer.</div>
  <div class="theme-tec"><b>8.4&#8212;Access to Source Code</b><br>Access to program source code must be managed. Source code represents one of an organization&#8217;s most valuable intellectual assets and an attack vector if malicious code is injected. Access should be limited to developers who need it, all access should be logged, production source code repositories should be separate from development environments, and code review processes should include security review.</div>
  <div class="theme-tec"><b>8.5&#8212;Secure Authentication</b><br>Secure authentication technologies and procedures must be implemented based on information access restriction. Multi-factor authentication (MFA) for all remote access, privileged access, and access to sensitive systems is the current standard. Password complexity requirements, maximum password ages, lockout policies after failed attempts, prohibition of credential sharing, and detection of compromised credentials implement this control. Single-factor authentication is no longer adequate for most contexts.</div>
  <div class="theme-tec"><b>8.6&#8212;Capacity Management</b><br>The use of resources must be monitored and adjusted, and projections of future capacity requirements made to ensure the required system performance. Capacity management is both an availability control (preventing performance degradation from capacity exhaustion) and a security-relevant operation (unusual capacity consumption can indicate a security incident such as crypto mining malware or a denial-of-service attack).</div>
  <div class="analogy-box"><strong>The principle of least privilege in practice:</strong> A hospital analogy makes least privilege intuitive. A surgeon needs access to the operating room, patient records, and medication ordering. A billing clerk needs access to insurance and billing systems. A receptionist needs access to scheduling and limited contact information. None of these roles needs the access required by the others. Giving every employee access to all hospital systems for convenience would create enormous security risk. 8.2 and 8.3 implement this same principle technically: every user gets exactly the access their role requires, no more.</div>`,
  quiz:{q:"A security team discovers that a former database administrator&#8217;s privileged account is still active with full database access 60 days after termination. The account shows login attempts from an unknown IP address. Which controls failed and what is the severity?",opts:["A minor issue&#8212;the account should be deactivated but no harm has occurred yet","Multiple critical failures: 5.16/5.18 (identity management and access rights requiring timely deprovisioning of terminated employees), 8.2 (privileged access rights requiring ongoing monitoring of privileged accounts), and 8.5 (secure authentication monitoring for anomalous access patterns). The severity is critical: active privileged database access by an unknown actor 60 days post-termination likely represents an active intrusion or compromised credential use. This requires immediate incident response, not just account deactivation.","Only 6.5 Responsibilities After Termination failed","The attempts from an unknown IP are false positives&#8212;VPN routing commonly produces this"],ans:1,explain:"This scenario represents multiple concurrent control failures compounding into a critical security situation. 5.16/5.18 failed to deprovision the account at termination. 8.2 failed to detect through privileged account monitoring that a terminated employee&#8217;s account was still active with login activity. 8.5 failed to alert on anomalous authentication (unknown IP, unexpected timing). The presence of login attempts from an unknown IP address 60 days after termination should be treated as an active security incident: the account may have been used by the former employee (potentially unauthorized access), or the credentials may have been sold or stolen (enabling external attacker access with privileged database rights). Immediate response: disable the account, preserve logs for forensic analysis, initiate incident response."}
},
{
  title:"Technological Controls&#8212;System Security and Malware Protection (8.7&#8211;8.13)",
  tagline:"Defending systems against attack and maintaining their operational integrity",
  body:`<p>Protecting information systems from attack and maintaining their operational integrity requires a layered set of technological controls addressing malware, software installation, vulnerability management, configuration management, backup, and audit logging. These controls form the operational security backbone of most security programs.</p>
  <div class="cheat-grid">
    <div class="cheat-pill"><strong>8.7&#8212;Protection Against Malware</strong><span>Protection against malware (viruses, ransomware, spyware, trojans) must be implemented and supported by appropriate user awareness. Anti-malware tools on all endpoints and servers, email scanning for malicious attachments and links, web content filtering to block malicious sites, prohibition on downloading unauthorized software, and regular scanning schedules all implement this control. Anti-malware must have current signature updates to be effective.</span></div>
    <div class="cheat-pill"><strong>8.8&#8212;Management of Technical Vulnerabilities</strong><span>Information about technical vulnerabilities of information systems must be obtained in a timely fashion, the organization&#8217;s exposure assessed, and appropriate measures taken to address risk. Vulnerability scanning, penetration testing, patch management processes with defined timelines based on severity, and participation in vulnerability information sharing programs all implement this control. CISA&#8217;s Known Exploited Vulnerabilities catalog makes prioritization concrete for US federal environments.</span></div>
    <div class="cheat-pill"><strong>8.9&#8212;Configuration Management</strong><span>Configurations, including security configurations, of hardware, software, services, and networks must be established, documented, implemented, monitored, and reviewed. Security baselines (defined secure configurations for each system type), automated configuration management tools that detect drift, change management processes requiring review before configuration changes, and configuration audits all implement this control.</span></div>
    <div class="cheat-pill"><strong>8.10&#8212;Information Deletion</strong><span>Information stored in information systems, devices, or other storage media must be deleted when no longer required. This is the technical complement to 7.14 (secure disposal)&#8212;deletion of information that is no longer needed reduces the attack surface. Retention schedules that define when information should be deleted, automated deletion processes for information past retention periods, and verification that deletion was complete implement this control.</span></div>
    <div class="cheat-pill"><strong>8.11&#8212;Data Masking</strong><span>Data masking must be used in accordance with the organization&#8217;s access control policy and other applicable policies, based on business and security requirements. Masking personal information in non-production environments, masking payment card numbers except for last four digits in customer-facing displays, and masking health information in aggregate analytics datasets reduce exposure while maintaining utility.</span></div>
    <div class="cheat-pill"><strong>8.12&#8212;Data Leakage Prevention</strong><span>Data leakage prevention (DLP) measures must be applied to systems, networks, and other devices that process, store, or transmit sensitive information. DLP tools monitor and control data movement: preventing large files of sensitive data from being emailed externally, blocking uploads to unauthorized cloud storage, detecting and alerting on unusual data transfer patterns, and enforcing information classification policies technically.</span></div>
    <div class="cheat-pill"><strong>8.13&#8212;Information Backup</strong><span>Backup copies of information, software, and system images must be made and regularly tested in accordance with an agreed backup policy. Backup requirements include: regular backup schedules appropriate to the data&#8217;s criticality, off-site storage (physical or cloud) to protect against site-level disasters, encryption of backup data (backup tapes are a common breach vector), and most critically, regular restoration testing. Backups that have never been tested are not confirmed to work.</span></div>
  </div>
  <div class="analogy-box"><strong>The backup testing imperative:</strong> Many organizations treat backup creation as the backup objective and never test restoration. But a backup that fails to restore provides no actual protection. The analogy: if you had a fire extinguisher in your kitchen but never checked whether it contained pressure and had an intact nozzle, you have a false sense of security. ISO 27002&#8217;s 8.13 requirement to regularly test backups exists precisely because backup systems fail silently&#8212;you only discover the failure when you urgently need the backup and it does not work. Regular restoration tests catch backup failures when they can be corrected, not during an emergency.</div>`,
  quiz:{q:"An organization runs weekly backups of all critical systems to an on-site tape library. They have never tested restoration from backup. When ransomware encrypts all active systems, they discover the backup system has been corrupted by the same ransomware, and restoration is not possible. Which control most specifically failed?",opts:["8.7 Protection Against Malware&#8212;they should have prevented the ransomware","8.13 Information Backup specifically requires that backups be regularly tested&#8212;an untested backup process is not adequate backup. Additionally, backups stored on a network-connected system that ransomware could reach represent a single point of failure. Effective backup strategies include offline or immutable backups that ransomware cannot encrypt, and regular restoration tests that would have identified the vulnerability before an incident.","8.9 Configuration Management failed","8.8 Vulnerability Management should have prevented the ransomware from reaching backups"],ans:1,explain:"8.13&#8217;s requirement for regular testing is specifically intended to catch this scenario. An organization that believed it had working backups because it created backups (without testing them) had a false sense of security that may have reduced urgency around other ransomware protections. The testing requirement would have revealed: (1) that the backup system was network-accessible and vulnerable to ransomware, (2) that restoration was unreliable. Modern ransomware specifically targets backup systems to prevent recovery&#8212;making 8.13&#8217;s requirement for offline or immutable backups and tested restoration critical to ransomware resilience."}
},
{
  title:"Technological Controls&#8212;Audit Logging and Monitoring (8.15&#8211;8.16)",
  tagline:"Creating the visibility needed to detect and investigate security events",
  body:`<p><span class="key-term">Audit logging</span> and <span class="key-term">monitoring</span> are the foundation of security detection capability&#8212;you cannot detect what you cannot see, and you cannot investigate what was not logged. These two controls are among the most important in ISO 27002 because they enable all other security controls to be verified, they provide the evidence base for incident investigation, and they create the accountability that deters insider threats.</p>
  <div class="highlight-box"><strong>Why logging and monitoring are inseparable:</strong> Logs without monitoring are archives of past failures. Monitoring without comprehensive logs misses critical events. Together, they create a security operations capability: logs capture what happened, monitoring analyzes logs in real time to detect anomalies, and the combination enables both rapid incident detection and forensic investigation after incidents occur. ISO 27002 addresses both as distinct but complementary controls.</highlight-box>
  <div class="theme-tec"><b>8.15&#8212;Logging</b><br>Event logs recording user activities, exceptions, faults, and information security events must be produced, stored, protected, and analyzed. Logging requirements include:<br><br><strong>What to log:</strong> User authentication events (successes and failures), privileged user activities, administrator actions, configuration changes, access to sensitive data, security system events (firewall, IDS/IPS, antivirus), system errors and exceptions.<br><br><strong>Log quality:</strong> Timestamp accuracy (synchronized to a reliable time source), sufficient detail to enable event reconstruction, user and system identification in every log entry, log integrity protection (logs must not be modifiable by those whose activities they record).<br><br><strong>Log retention:</strong> Retention periods based on regulatory requirements and investigation needs. Logs that are overwritten before incidents are investigated are forensically useless. GDPR and sector-specific regulations often specify minimum retention periods; security best practice often requires longer retention for security investigation purposes.<br><br><strong>Log protection:</strong> Centralized log management (SIEM) prevents logs being deleted by compromised systems, protects log integrity, and enables correlation of events across systems.</div>
  <div class="theme-tec"><b>8.16&#8212;Monitoring Activities</b><br>Networks, systems, and applications must be monitored for anomalous behavior, and appropriate actions taken to evaluate potential information security incidents. Monitoring requires:<br><br><strong>Real-time analysis:</strong> Security Information and Event Management (SIEM) systems correlate events from multiple sources and generate alerts on anomalous patterns. Manual log review is inadequate for the volume of events generated by modern systems.<br><br><strong>Baseline establishment:</strong> Effective anomaly detection requires knowing what normal looks like. Behavioral baselines for users, systems, and network traffic enable detection of deviations that may indicate compromise.<br><br><strong>Tuning:</strong> Over-alerting (false positives overwhelming the security team) is as damaging as under-alerting. Alert rules must be continuously tuned to minimize false positives while maintaining detection of genuine threats.<br><br><strong>Response integration:</strong> Monitoring without response capability is surveillance without intervention. Detected anomalies must trigger defined response procedures.</div>
  <div class="analogy-box"><strong>The bank camera and alarm system analogy:</strong> A bank installs security cameras (logging) that record all activity in the branch. It also installs alarm systems (monitoring) that alert immediately when specific events occur (vault door opened after hours, motion detected in restricted areas). The cameras alone catch crimes after the fact; the alarms alone without cameras leave no evidence for prosecution. Together, they provide both immediate detection and forensic capability. ISO 27002&#8217;s 8.15 and 8.16 create the same complementary capability for information systems.</div>`,
  quiz:{q:"An organization&#8217;s SIEM generates 50,000 alerts per day. The security team reviews only 500 alerts daily. When an attacker who has been present in the network for 60 days is eventually discovered, investigation reveals 4,200 relevant alerts were generated but not reviewed. What is the monitoring control failure?",opts:["8.15 Logging failed&#8212;the logs were not adequate","8.16 Monitoring Activities failed specifically in alert tuning and capacity&#8212;generating 50,000 alerts daily where only 500 can be reviewed means 49,500 alerts go uninvestigated. This represents a monitoring program that creates a false sense of security (&#8216;we have a SIEM&#8217;) without providing actual detection capability. Effective monitoring requires: alert tuning to reduce false positives to manageable volumes, sufficient analyst capacity to review and respond to remaining alerts, and escalation paths for high-priority alerts that bypass normal queues.","Both controls failed equally","This is a budget issue, not a control failure"],ans:1,explain:"This scenario illustrates one of the most common monitoring failures: organizations implement security monitoring tools that generate alert volumes their security teams cannot realistically process. A SIEM that generates 50,000 daily alerts is not providing effective monitoring&#8212;it is creating alert fatigue that makes genuine threats less likely to be detected, not more. ISO 27002&#8217;s 8.16 requires monitoring activities that evaluate potential incidents&#8212;which requires alert volumes that can actually be evaluated. The solution involves SIEM tuning to reduce false positives, use-case-based alerting focused on highest-value detections, automation of routine alert classification, and security team capacity matched to actual alert volume. Security monitoring that cannot process its own output has not fulfilled the control requirement."}
},
{
  title:"Technological Controls&#8212;Network Security (8.20&#8211;8.22)",
  tagline:"Protecting the networks that carry organizational information",
  body:`<p>Networks are the pathways through which all networked information flows&#8212;and therefore one of the primary attack surfaces for both external and internal threats. ISO 27002&#8217;s network security controls address protection of the network infrastructure, management of network services, and the critical principle of network segregation that limits the blast radius of network-based attacks.</p>
  <div class="theme-tec"><b>8.20&#8212;Networks Security</b><br>Networks and network devices must be secured, managed, and controlled to protect information in systems and applications. Network security requirements include: documented network architecture showing all connections and data flows, firewalls at network perimeters and between security zones, intrusion detection and prevention systems (IDS/IPS) monitoring network traffic for attack signatures, network security event logging, and regular review of network security posture.<br><br>Modern networks extend beyond traditional perimeters to include cloud environments, remote worker connections, IoT devices, and third-party system interconnections. Network security controls must adapt to this expanded perimeter rather than relying solely on traditional edge defenses.</div>
  <div class="theme-tec"><b>8.21&#8212;Security of Network Services</b><br>Security mechanisms, service levels, and management requirements of all network services (whether provided internally or outsourced) must be identified, implemented, and monitored. When organizations use external network services (ISPs, managed security services, cloud networking), they must verify security capabilities, understand the division of security responsibilities, and monitor service security performance against agreed requirements.</div>
  <div class="theme-tec"><b>8.22&#8212;Segregation of Networks</b><br>Groups of information services, users, and information systems must be segregated on networks. Network segregation limits the ability of attackers who compromise one network segment to move laterally to other segments. Segregation approaches include: VLANs (logical network separation), firewalls between network zones, micro-segmentation (fine-grained segmentation to the workload level), and zero-trust network architectures that require authentication for every network access regardless of network location.<br><br>Key segregation principles: separate networks for different security levels (high-security research separate from general office), isolation of industrial control systems (OT networks separate from IT networks), guest network isolation (visitor WiFi separate from corporate systems), and cloud security groups/VPCs isolating different workloads within cloud environments.</div>
  <div class="cheat-grid">
    <div class="cheat-pill"><strong>The East-West Traffic Problem</strong><span>Traditional network security focused on North-South traffic (traffic crossing the network perimeter). Modern threats move East-West&#8212;laterally within the network, from one compromised system to others in the same network segment. Ransomware and APTs exploit East-West movement to maximize damage. Network segregation is the primary control limiting East-West lateral movement.</span></div>
    <div class="cheat-pill"><strong>Zero Trust Network Architecture</strong><span>Zero Trust architecture (NIST SP 800-207) replaces the implicit trust of traditional &#8220;inside the perimeter = trusted&#8221; network security with continuous verification: no network location is inherently trusted, every access request requires authentication regardless of originating network, and least-privilege network access is enforced at the workload level. 8.20 and 8.22 together support zero trust implementation.</span></div>
  </div>
  <div class="analogy-box"><strong>The submarine compartment analogy for network segregation:</strong> Submarines are designed with watertight compartments. If one compartment is flooded, bulkheads prevent flooding from spreading to other compartments&#8212;limiting the damage to one area and keeping the submarine operational. Network segregation works on the same principle: if one network segment is compromised, firewalls and access controls between segments prevent the compromise from spreading to all other systems. Without segregation, a single compromised device can reach everything on the flat network&#8212;exactly what ransomware exploits.</div>`,
  quiz:{q:"A ransomware infection enters through a phishing email on a marketing department workstation. The ransomware rapidly spreads to encrypt all systems on the organization&#8217;s flat (unsegregated) network, including production servers, financial systems, and backup systems. Which network control most directly could have limited the damage?",opts:["8.20 Networks Security&#8212;better firewall rules would have prevented the phishing email","8.22 Segregation of Networks&#8212;proper network segregation would have limited the ransomware&#8217;s ability to spread from the marketing workstation to production and financial systems. Separate network segments for marketing, production, financial systems, and backups&#8212;with firewall rules requiring authentication to cross segment boundaries&#8212;would have contained the infection to the marketing network segment while production remained operational.","8.21 Security of Network Services","8.7 Protection Against Malware should have been the primary control"],ans:1,explain:"This is the classic ransomware lateral movement scenario that network segregation (8.22) directly addresses. A flat network where all workstations and servers share the same subnet allows ransomware to probe and encrypt all accessible systems without crossing any network security boundaries. Proper segmentation would have contained the infection: marketing workstations cannot directly reach production servers (require authentication across firewall), financial systems are on isolated segments, and&#8212;critically&#8212;backup systems are on an isolated or offline segment ransomware cannot reach. The workstation would still be compromised, but the blast radius would be one department rather than the entire organization."}
},
{
  title:"Technological Controls&#8212;Cryptography and Secure Development (8.24&#8211;8.26, 8.28)",
  tagline:"Protecting information through encryption and building security into software",
  body:`<p>Cryptography is one of the most powerful tools in the information security toolkit&#8212;enabling confidentiality, integrity, and authenticity assurance for information in transit and at rest. Equally important is ensuring that the applications and systems that process information are themselves built securely&#8212;because insecure applications create vulnerabilities that all other security controls cannot compensate for.</p>
  <div class="theme-tec"><b>8.24&#8212;Use of Cryptography</b><br>Rules for the effective use of cryptography, including cryptographic key management, must be developed and implemented. Cryptography policy decisions include:<br><br><strong>Algorithm selection:</strong> Only approved, current algorithms should be used. AES-256 for symmetric encryption, RSA-2048/4096 or ECDSA for asymmetric operations, SHA-256 or stronger for hashing. Deprecated algorithms (DES, 3DES, MD5, SHA-1) must not be used for new implementations and should be replaced in existing systems.<br><br><strong>Key management:</strong> Cryptographic keys are the most sensitive information in most organizations. Key management requirements include: secure key generation, protected key storage (Hardware Security Modules for critical keys), key rotation policies (periodic key changes to limit exposure if keys are compromised), key distribution procedures, and secure key disposal. Encryption without proper key management is encryption in name only.</div>
  <div class="theme-tec"><b>8.25&#8212;Secure Development Lifecycle</b><br>Rules for the secure development of software and systems must be established and applied. Integrating security into the software development lifecycle (SDLC) includes: security requirements defined at project initiation, threat modeling during design, secure coding standards and developer training, security testing throughout development (SAST, DAST), code review including security review, penetration testing before release, and security validation in deployment. Applications built without security integration consistently contain exploitable vulnerabilities.</div>
  <div class="theme-tec"><b>8.26&#8212;Application Security Requirements</b><br>Information security requirements must be identified, specified, and approved when developing or acquiring applications. This control connects business security requirements to technical implementation: the security requirements for a new application must be explicitly defined (what authentication mechanisms, what encryption, what access control, what logging), not left to developer discretion. Applications built without explicit security requirements consistently under-implement security.</div>
  <div class="theme-tec"><b>8.28&#8212;Secure Coding</b><span> (New in 2022)</span><br>Secure coding principles must be applied to software development. This new 2022 control formally requires organizations to implement secure coding practices: developers trained in secure coding, coding standards addressing common vulnerability classes (OWASP Top 10), code review processes including security review, automated security testing integrated into build pipelines (SAST tools, dependency vulnerability scanning), and prohibition of known-dangerous functions (sprintf, strcpy in C; eval() in JavaScript; raw SQL queries in any language).</div>
  <div class="analogy-box"><strong>The OWASP Top 10 as a coding checklist:</strong> Just as pilots use pre-flight checklists to ensure nothing critical is overlooked before takeoff, developers should use security checklists (like the OWASP Top 10) to verify that common vulnerability classes are addressed in every application. The OWASP Top 10 (broken access control, cryptographic failures, injection, insecure design, security misconfiguration, vulnerable components, authentication failures, software integrity failures, logging failures, SSRF) represents the most commonly exploited application vulnerabilities. 8.28&#8217;s secure coding requirement is specifically designed to address these systematically.</div>`,
  quiz:{q:"A security assessment finds that an organization&#8217;s customer-facing web application is vulnerable to SQL injection, stores passwords in plain text, and uses SHA-1 for any remaining hashed data. Which technological controls are implicated?",opts:["Only 8.24 Use of Cryptography&#8212;the password and hashing issues are the primary concern","Multiple controls failed: 8.24 (Use of Cryptography&#8212;plain text passwords and SHA-1 hashing violate cryptography policy; passwords must be stored as salted hashes using bcrypt/Argon2/scrypt; SHA-1 is deprecated), 8.25/8.26 (Secure Development Lifecycle / Application Security Requirements&#8212;SQL injection indicates security requirements were not defined or security testing was not performed during development), and 8.28 (Secure Coding&#8212;SQL injection is one of the most well-documented vulnerability classes that secure coding practices specifically prevent).","Only 8.28 Secure Coding failed","This is a developer training issue, not a security control failure"],ans:1,explain:"Three distinct vulnerability types indicate multiple control failures. Plain text passwords and SHA-1 usage violate 8.24&#8217;s requirement to use appropriate cryptographic algorithms&#8212;password storage must use purpose-built password hashing algorithms (bcrypt, Argon2, scrypt) rather than encryption or general-purpose hash functions. SQL injection is one of the oldest and best-documented vulnerability classes, appearing at #3 in the OWASP Top 10 for decades&#8212;its presence in a production application indicates failures across 8.25 (no security testing caught it), 8.26 (application security requirements did not specify injection prevention), and 8.28 (secure coding practices that would have prevented it were not followed). These are not isolated technical failures&#8212;they indicate a development process without meaningful security integration."}
},
{
  title:"Technological Controls&#8212;The 11 New Controls in 2022",
  tagline:"What is genuinely new in ISO 27002:2022 that was not in the 2013 version",
  body:`<p>ISO 27002:2022 introduced <span class="key-term">11 entirely new controls</span> that did not exist in the 2013 version. These controls address threats, technologies, and security practices that emerged or matured significantly between 2013 and 2022. Understanding what is new&#8212;and why it was added&#8212;is essential for organizations transitioning from the 2013 to 2022 standard and for identifying whether their security programs have kept pace with the evolving threat landscape.</p>
  <div class="highlight-box"><strong>Why these 11 controls were new:</strong> The 2013 version was written before cloud computing became dominant infrastructure, before ransomware became the primary cybercrime business model, before supply chain attacks became a primary nation-state technique, and before data minimization became a legal requirement in privacy law. The 11 new controls address these changes in the security landscape.</highlight-box>
  <div class="ctrl-em"><b>5.7&#8212;Threat Intelligence</b><br>Collecting and analyzing threat intelligence to inform security decisions. Organizations must gather, analyze, and use intelligence about threats relevant to their industry, technology stack, and threat model. Without threat intelligence, security programs react to yesterday&#8217;s threats rather than anticipating tomorrow&#8217;s.</div>
  <div class="ctrl-em"><b>5.23&#8212;Information Security for Use of Cloud Services</b><br>Managing information security risks specific to cloud service use. Extends existing cloud security thinking by requiring systematic identification of cloud security responsibilities and controls for each cloud service model (IaaS, PaaS, SaaS). This control fills a gap that organizational cloud adoption had far outpaced security governance.</div>
  <div class="ctrl-em"><b>5.30&#8212;ICT Readiness for Business Continuity</b><br>Planning, implementing, and testing ICT continuity to support business continuity objectives. Previously, business continuity and ICT recovery were addressed separately&#8212;this control integrates them, requiring that ICT recovery objectives (RTO, RPO) be derived from business continuity objectives.</div>
  <div class="ctrl-em"><b>7.4&#8212;Physical Security Monitoring</b><br>Continuously monitoring for unauthorized physical access. Adds CCTV, intrusion detection, and physical security monitoring to the physical controls as an explicit requirement rather than an implied practice.</div>
  <div class="ctrl-em"><b>8.9&#8212;Configuration Management</b><br>Establishing and maintaining documented security configurations. Recognizes that configuration management&#8212;including security hardening baselines and detection of configuration drift&#8212;had become a distinct security discipline requiring its own explicit control rather than being implied within operations controls.</div>
  <div class="ctrl-em"><b>8.10&#8212;Information Deletion</b><br>Deleting information when no longer required. Addresses the privacy and security imperative of data minimization&#8212;required by GDPR and other privacy laws&#8212;as a standalone security control rather than a component of media disposal.</div>
  <div class="ctrl-em"><b>8.11&#8212;Data Masking</b><br>Using data masking to protect sensitive information. Explicitly addresses data masking in non-production environments and for reduced-privilege access scenarios as a distinct control.</div>
  <div class="ctrl-em"><b>8.12&#8212;Data Leakage Prevention</b><br>Implementing DLP measures to prevent unauthorized data exfiltration. Addresses the data loss prevention technology category as an explicit control, reflecting its maturity as a distinct security practice.</div>
  <div class="ctrl-em"><b>8.16&#8212;Monitoring Activities</b><br>Monitoring for anomalous behavior to identify security incidents. Separates security monitoring from audit logging, recognizing that both are distinct and essential activities requiring dedicated attention.</div>
  <div class="ctrl-em"><b>8.23&#8212;Web Filtering</b><br>Managing access to external websites to protect users from malicious content. Addresses web filtering as an explicit control rather than a component of malware protection, recognizing that browser-delivered threats represent a distinct and dominant attack vector.</div>
  <div class="ctrl-em"><b>8.28&#8212;Secure Coding</b><br>Applying secure coding principles across software development. Explicitly requires secure coding practices as a security control, reflecting the industry&#8217;s recognition that application security must be built in rather than tested in after the fact.</div>`,
  quiz:{q:"An organization transitioning from ISO 27002:2013 to ISO 27002:2022 has a mature security program covering all 2013 controls. Why must they specifically assess the 11 new controls, and which is most likely to be a genuine gap for organizations that have not been following privacy regulations closely?",opts:["The 11 new controls are optional enhancements&#8212;existing controls provide equivalent coverage","The 11 new controls address security topics that did not have dedicated controls in the 2013 version and likely have gaps in most existing security programs. 8.10 Information Deletion is most likely a genuine gap for organizations not focused on privacy regulation&#8212;data minimization and deletion of information when no longer required were not explicit security practices before GDPR created legal deletion obligations. Organizations often retain data indefinitely because storage is cheap and deletion requires effort.","Only the technology-related new controls need assessment","All 11 new controls automatically apply to every organization in scope"],ans:1,explain:"The 11 new controls are genuinely new security requirements, not restatements of existing 2013 controls. Organizations that map their 2013 compliance forward to 2022 may cover many controls but will have gaps in all 11 new areas by definition&#8212;those controls simply did not exist before. 8.10 (Information Deletion) is particularly likely to be a gap because data deletion as a security practice was rarely systematically implemented before privacy law created legal requirements. Organizations have historically asked &#8216;why delete when storage is cheap?&#8217; The answer is now both regulatory (GDPR requires deletion upon request and when no longer needed) and security-based (less data means smaller breach blast radius). 5.7 (Threat Intelligence) and 8.12 (Data Leakage Prevention) are other high-gap controls for organizations without dedicated security operations capabilities."}
},
{
  title:"ISO 27002 and ISO 27001&#8212;How They Work Together",
  tagline:"The relationship between the control catalog and the certifiable management system",
  body:`<p>ISO 27002 and ISO 27001 are designed as a pair&#8212;and understanding how they relate is essential for building an effective security program and achieving certification. The most common confusion is treating them as interchangeable or assuming that one implies the other. They are distinct documents serving distinct purposes that work together to create a complete, certifiable security program.</p>
  <div class="highlight-box"><strong>The fundamental distinction:</strong><br><br><strong>ISO 27001</strong> specifies requirements for establishing, implementing, maintaining, and continually improving an Information Security Management System (ISMS). It defines what a management system must include&#8212;the risk management process, leadership commitment, objectives, monitoring and measurement, internal audit, management review, and continuous improvement. This is what certification auditors verify exists and functions.<br><br><strong>ISO 27002</strong> provides guidance for selecting, implementing, and managing information security controls. It explains what each control does and how to implement it effectively. Organizations use ISO 27002 as their reference when selecting controls to address identified risks.<br><br><strong>ISO 27001 Annex A</strong> is the bridge: a reference list of all 93 ISO 27002 controls, organized by theme. During the ISO 27001 certification process, organizations must produce a Statement of Applicability (SoA) that documents which controls from Annex A they have selected, which they have excluded (with justification), and for each included control, whether it is implemented. The SoA is the intersection point of the two standards.</highlight-box>
  <div class="cheat-grid">
    <div class="cheat-pill"><strong>The Risk-Driven Control Selection Process</strong><span>ISO 27001&#8217;s risk assessment process identifies information security risks. Risk treatment decisions determine which risks require controls. ISO 27002 provides the control catalog from which controls are selected to address identified risks. Controls are selected to address specific risks&#8212;not universally applied. This is why ISO 27002 says &#8220;guidance&#8221; not &#8220;requirements&#8221;: not every control is appropriate for every organization.</span></div>
    <div class="cheat-pill"><strong>Statement of Applicability (SoA)</strong><span>The SoA is the document where ISO 27001 and ISO 27002 formally intersect. For each of the 93 Annex A controls, the SoA documents: whether the control is included or excluded, the justification for inclusion or exclusion (for excluded controls: why the risk is acceptable without this control; for included controls: what risk it addresses), and implementation status. The SoA is the primary artifact reviewed by certification auditors to verify control selection rationale.</span></div>
    <div class="cheat-pill"><strong>Controls Not in Annex A</strong><span>ISO 27001 allows organizations to include additional controls beyond those in Annex A if their risk assessment identifies risks requiring controls not covered by the 93 standard controls. These &#8220;supplementary controls&#8221; must be documented in the SoA alongside the Annex A controls. This provision allows organizations addressing novel risks (AI-specific threats, quantum computing risks) to include controls not yet in ISO 27002.</span></div>
    <div class="cheat-pill"><strong>Excluding Annex A Controls</strong><span>Not all 93 controls apply to every organization. A small software company with no physical data centers does not need equipment siting controls (7.8). An organization that does not develop software does not need secure development lifecycle controls (8.25). Excluding controls is expected and legitimate&#8212;but exclusions must be justified by demonstrating that the excluded control&#8217;s associated risk is acceptable, not that it would simply be inconvenient to implement.</span></div>
  </div>`,
  quiz:{q:"During an ISO 27001 certification audit, the auditor asks to see the Statement of Applicability. They notice that control 8.25 (Secure Development Lifecycle) is excluded, but the organization builds all its own software. What is the auditor&#8217;s concern?",opts:["Exclusions are always acceptable if the organization explains their reasoning","The auditor is concerned that the exclusion of 8.25 is not justified&#8212;an organization that develops its own software faces the specific risks that 8.25 addresses (application vulnerabilities, insecure code, lack of security testing). Excluding a directly applicable control requires demonstrating that the associated risk is acceptable, which is very difficult to justify for a software development organization. This exclusion is likely to become a finding requiring either implementing 8.25 or providing compelling risk acceptance rationale.","The auditor only reviews included controls, not excluded ones","Secure development is optional for organizations that do not sell their software externally"],ans:1,explain:"ISO 27001&#8217;s SoA process requires that control exclusions be justified by demonstrating that the associated risk is acceptable without the control. For 8.25 (Secure Development Lifecycle), a software development organization faces exactly the risks this control addresses: applications containing exploitable vulnerabilities due to insecure development practices. Excluding this control while developing software is equivalent to saying &#8220;we accept the risk of deploying insecure applications&#8221;&#8212;a risk acceptance position that requires explicit senior management documentation and that most certification auditors will challenge. The appropriate response is either implementing 8.25 or providing extraordinarily robust compensating controls that achieve equivalent risk reduction."}
},
{
  title:"ISO 27002 and Other Security Frameworks",
  tagline:"How the standard connects to NIST CSF, CIS Controls, SOC 2, and more",
  body:`<p>ISO 27002 does not exist in isolation within the global security standards landscape. Understanding how it relates to other major security frameworks enables organizations to build integrated security programs that satisfy multiple requirements simultaneously rather than maintaining parallel compliance programs for each framework they face.</p>
  <div class="cheat-grid">
    <div class="cheat-pill"><strong>ISO 27002 and NIST CSF 2.0</strong><span>The NIST Cybersecurity Framework (CSF) uses six functions (GOVERN, IDENTIFY, PROTECT, DETECT, RESPOND, RECOVER) as its organizing structure. ISO 27002:2022&#8217;s fifth attribute (Cybersecurity Concepts, mapped to NIST CSF 1.0 functions) explicitly supports this mapping. Organizations implementing both can map ISO 27002 controls to NIST CSF categories&#8212;satisfying CSF reporting requirements using the same controls that support ISO 27001 certification. The mapping is not perfect but covers 70-80% of both frameworks with shared controls.</span></div>
    <div class="cheat-pill"><strong>ISO 27002 and CIS Controls v8</strong><span>The CIS Critical Security Controls (18 controls with 153 safeguards) overlap significantly with ISO 27002. CIS Controls provide more prescriptive implementation detail for specific technical controls; ISO 27002 provides broader governance context. Organizations facing both frameworks can implement CIS Controls as the technical detail that satisfies the relevant ISO 27002 technological controls. CIS Implementation Groups provide tiered guidance that can be matched to organization size and risk profile.</span></div>
    <div class="cheat-pill"><strong>ISO 27002 and SOC 2</strong><span>SOC 2 Trust Services Criteria (TSC) and ISO 27002 have significant overlap, particularly in the Security criterion. Organizations pursuing both SOC 2 Type II attestation and ISO 27001/27002 certification can substantially reuse the same controls and evidence for both&#8212;though the evidence formats and audit procedures differ. The Common Criteria in SOC 2 (CC6, CC7, CC8, CC9) map closely to ISO 27002&#8217;s access control, operations security, and supplier management controls.</span></div>
    <div class="cheat-pill"><strong>ISO 27002 and PCI DSS</strong><span>PCI DSS v4.0 and ISO 27002:2022 overlap substantially in technical controls. Organizations handling payment card data and pursuing ISO 27001 certification can substantially satisfy PCI DSS&#8217;s security requirements through ISO 27002 controls&#8212;particularly in cryptography (Requirement 3, 4), access control (Requirement 7, 8), monitoring (Requirement 10), and vulnerability management (Requirement 6, 11). A documented mapping reduces duplicate compliance work.</span></div>
    <div class="cheat-pill"><strong>ISO 27002 and CMMC</strong><span>The Cybersecurity Maturity Model Certification (CMMC) is based on NIST SP 800-171 and 800-172, which themselves derive substantially from NIST SP 800-53&#8212;which shares significant common ground with ISO 27002. Organizations with ISO 27001/27002 programs pursuing CMMC have a strong security foundation; the gap analysis typically identifies CMMC-specific process maturity requirements and defense-sector-specific controls not fully addressed by ISO 27002.</span></div>
    <div class="cheat-pill"><strong>ISO 27002 and HIPAA</strong><span>HIPAA Security Rule Technical and Administrative Safeguards overlap significantly with ISO 27002 controls. ISO 27001/27002 implementation provides substantial evidence for HIPAA Security Rule compliance, though HIPAA has specific requirements around Business Associate Agreements, breach notification timelines, and risk analysis documentation that go beyond what ISO 27002 addresses. Healthcare organizations with ISO 27001 often use it as their HIPAA security program foundation with HIPAA-specific additions.</span></div>
  </div>
  <div class="highlight-box"><strong>The control harmonization opportunity:</strong> The most valuable GRC competency is not knowing any single framework deeply&#8212;it is understanding how multiple frameworks relate and building integrated programs where one set of controls satisfies multiple requirements simultaneously. ISO 27002&#8217;s breadth and its attribute system (which explicitly maps to NIST CSF) make it the natural hub of an integrated multi-framework security program. Implementing ISO 27002 comprehensively typically covers 70-80% of most other security frameworks&#8217; technical requirements, with framework-specific additions addressing the remaining 20-30%. This is exactly the GRC integration expertise that Jason&#8217;s credential stack (CISA &#8594; CRISC &#8594; AI governance) is designed to develop.</div>`,
  quiz:{q:"A defense contractor must satisfy ISO 27001 certification, CMMC Level 2, and NIST CSF requirements. They are building their security program from scratch. What is the most efficient approach?",opts:["Build three separate security programs&#8212;one for each framework","Build a single ISO 27002-based control framework, mapping each control to its applicable requirements across ISO 27001 (Annex A), CMMC (NIST SP 800-171 practices), and NIST CSF (using the Cybersecurity Concepts attribute). One implementation satisfies multiple requirements. Identify gaps&#8212;controls required by CMMC or NIST CSF not covered by ISO 27002&#8212;and add them as supplementary controls. This integrated approach is typically 40-60% less work than three separate programs.","Start with CMMC only since it is legally required and add others later","Use ISO 27002 only since it is the most comprehensive and the others will be automatically satisfied"],ans:1,explain:"The integration approach is the correct GRC answer for multi-framework compliance. ISO 27002 provides the comprehensive control catalog that forms the foundation; ISO 27001 provides the management system structure for certification; NIST CSF and CMMC map substantially to ISO 27002 controls with specific gaps to be addressed. The Cybersecurity Concepts attribute in ISO 27002:2022 was specifically designed to facilitate NIST CSF mapping. Building one control framework that satisfies all three requirements simultaneously&#8212;with documented mappings showing which controls satisfy which framework requirements&#8212;is the professional GRC approach that eliminates redundant work and creates a coherent program rather than three separate compliance silos."}
},
{
  title:"Implementing ISO 27002&#8212;The Control Selection Process",
  tagline:"How organizations determine which controls they need and how to implement them",
  body:`<p>ISO 27002 provides guidance for 93 controls. Not all 93 controls are appropriate for every organization&#8212;and even for applicable controls, the appropriate implementation depth varies by organization size, risk profile, and context. The control selection process bridges the gap between the comprehensive control catalog and the specific security program an individual organization needs.</p>
  <div class="highlight-box"><strong>The risk-driven control selection principle:</strong> ISO 27002 explicitly states that it is not a &#8220;do everything&#8221; standard. Controls are selected based on risk: an organization identifies the specific risks it faces, determines which controls would address those risks to acceptable levels, and implements those controls. This risk-driven approach is why ISO 27001&#8217;s risk assessment process is mandatory before controls are selected&#8212;controls without risk context are security theater.</highlight-box>
  <div class="cheat-grid">
    <div class="cheat-pill"><strong>Step 1&#8212;Risk Assessment</strong><span>Identify organizational assets, threats to those assets, vulnerabilities those threats could exploit, and the potential impact of exploitation. The risk assessment produces a prioritized list of risks that need treatment. ISO 27005 provides detailed risk assessment methodology. The output is not just &#8220;we have risks&#8221; but &#8220;we have specific risk X with likelihood Y and impact Z requiring treatment.&#8221;</span></div>
    <div class="cheat-pill"><strong>Step 2&#8212;Risk Treatment Decision</strong><span>For each identified risk, decide: Modify (implement controls to reduce likelihood or impact), Share (transfer risk to insurance or third parties), Avoid (stop the activity creating the risk), or Accept (document that the residual risk is within acceptable tolerance). Most risks will be Modified&#8212;requiring control selection. Accepted risks require documented senior management approval.</span></div>
    <div class="cheat-pill"><strong>Step 3&#8212;Control Selection from ISO 27002</strong><span>For each risk to be Modified, identify which ISO 27002 controls would address that risk. The attribute system helps: filter by relevant Operational Capability domain and Control Type to identify candidate controls. A risk around ransomware, for example, leads to controls in malware protection (8.7), backup (8.13), access control (8.2, 8.3), network segregation (8.22), and monitoring (8.16).</span></div>
    <div class="cheat-pill"><strong>Step 4&#8212;Statement of Applicability</strong><span>Document every Annex A control as either included (with the risk it addresses) or excluded (with justification that the risk is acceptable without it). For ISO 27001 certification, this SoA is a mandatory deliverable reviewed by certification auditors. For non-certification implementations, the SoA still provides valuable documentation of the rationale behind control selections.</span></div>
    <div class="cheat-pill"><strong>Step 5&#8212;Control Implementation</strong><span>Implement selected controls using ISO 27002&#8217;s implementation guidance. Each control section includes: purpose, the control statement, implementation guidance (specific steps and considerations), and other information (supplementary context). For complex controls (SIEM deployment, PKI infrastructure, incident response program), ISO 27002&#8217;s guidance may be supplemented by more specific standards (ISO 27035 for incident management, etc.).</span></div>
    <div class="cheat-pill"><strong>Step 6&#8212;Control Effectiveness Measurement</strong><span>Implemented controls must be monitored for effectiveness&#8212;not assumed effective because they were implemented. Control effectiveness metrics should be defined at implementation: if a control is &#8220;anti-malware on all endpoints,&#8221; the effectiveness metric might be &#8220;percentage of endpoints with current anti-malware signatures.&#8221; Controls that drift below effectiveness thresholds trigger remediation actions.</span></div>
  </div>`,
  quiz:{q:"An organization skips formal risk assessment and instead implements all 93 ISO 27002:2022 controls at maximum depth across all systems. What is wrong with this approach?",opts:["Nothing&#8212;implementing all controls at maximum depth provides the most comprehensive security","This approach fails the risk-proportionality principle central to ISO 27002: controls should be proportionate to risk. Without risk assessment, the organization cannot know which risks are most severe (and require the deepest control implementation) versus which are minor (and require lighter controls or possibly no controls at all). Implementing all controls at maximum depth wastes resources on low-risk areas and may paradoxically create gaps by spreading limited security resources across areas that don&#8217;t require them&#8212;rather than concentrating those resources on the highest risks.","Only technological controls need risk assessment&#8212;other controls are universally applicable","Organizations pursuing ISO 27001 certification must implement all 93 controls regardless of risk"],ans:1,explain:"Risk-proportionality is a core principle of the ISO security framework. Controls that don&#8217;t address identified risks waste resources that could be better applied to actual risk reduction. A retailer spending maximum resources on controls for physical document security (which may be low risk) at the expense of adequate investment in e-commerce application security (which may be high risk) has made the wrong prioritization decision. ISO 27001 explicitly requires risk assessment to drive control selection&#8212;certification auditors verify not just that controls are implemented, but that they address identified risks. Implementing controls without risk justification may not even satisfy ISO 27001 requirements despite the apparent comprehensiveness."}
},
{
  title:"Statement of Applicability and Control Tailoring",
  tagline:"Customizing the ISO 27002 control catalog to the organization&#8217;s specific context",
  body:`<p>The <span class="key-term">Statement of Applicability (SoA)</span> is the document that transforms ISO 27002 from a universal control catalog into a tailored security program. By explicitly documenting which controls are applicable, which are excluded, and why, the SoA creates a transparent, auditable record of the organization&#8217;s security control decisions. It is simultaneously a compliance artifact, a management document, and an accountability tool.</p>
  <div class="highlight-box"><strong>SoA structure and content:</strong> For each of the 93 ISO 27002:2022 Annex A controls, the SoA documents:<br><br><strong>Control reference:</strong> The ISO 27001/27002 control number and title<br><strong>Applicability determination:</strong> Is this control applicable (Included) or not applicable (Excluded)?<br><strong>Justification:</strong> For Included controls&#8212;which risk(s) does it address? For Excluded controls&#8212;why is the risk acceptable without this control?<br><strong>Implementation status:</strong> For Included controls&#8212;is it fully implemented, partially implemented, or planned?<br><strong>Evidence reference:</strong> Where is the evidence of implementation? (Policy reference, procedure document, technical control, audit evidence)</highlight-box>
  <div class="cheat-grid">
    <div class="cheat-pill"><strong>Legitimate Exclusion Criteria</strong><span>Controls can be legitimately excluded when: the organization does not perform the activity the control addresses (no software development &#8594; exclude 8.25 Secure Development Lifecycle), the associated risk is accepted with documented senior management approval and is within risk appetite, or compensating controls provide equivalent risk reduction. Excluding controls because they are difficult to implement without risk justification is not a legitimate exclusion.</span></div>
    <div class="cheat-pill"><strong>Partial Implementation Status</strong><span>Not all controls need to be fully implemented before certification is pursued. Controls can be partially implemented at certification, with documented plans for completing implementation. Certification auditors assess whether partial implementation is intentional and planned (acceptable) versus evidence of a control that was intended to be fully implemented but is not (a non-conformity). Transparency in the SoA about implementation status prevents audit surprises.</span></div>
    <div class="cheat-pill"><strong>Supplementary Controls</strong><span>Organizations whose risk assessments identify risks not addressed by the 93 Annex A controls can add supplementary controls to their SoA. These additional controls are documented alongside Annex A controls. Common supplementary controls include: quantum cryptography readiness, AI model security, and blockchain security for organizations with these specific risk profiles.</span></div>
    <div class="cheat-pill"><strong>SoA Maintenance</strong><span>The SoA is a living document that must be updated when: new risks are identified requiring additional controls, existing controls become inapplicable due to business changes, implementation status changes, or the ISO 27002 standard is revised (as in the 2013-to-2022 transition). An outdated SoA that does not reflect the organization&#8217;s current security program is a certification finding.</span></div>
    <div class="cheat-pill"><strong>Industry-Specific Additions</strong><span>Many industries have sector-specific security requirements that go beyond ISO 27002. Healthcare organizations add HIPAA-specific controls; financial organizations add banking regulation requirements; defense contractors add CMMC-specific controls. These additions are documented in the SoA alongside the Annex A controls, creating a single coherent control framework rather than separate compliance silos.</span></div>
    <div class="cheat-pill"><strong>The SoA as Communication Tool</strong><span>The SoA serves audiences beyond certification auditors. Customers and partners requesting security evidence can be shown the SoA to understand which controls are in place. Risk committees can review the SoA to assess the overall risk posture. New security team members can use the SoA to understand the security program&#8217;s scope and rationale. The SoA transforms implicit security decisions into explicit, documented governance.</span></div>
  </div>`,
  quiz:{q:"A cloud-native startup with no physical offices, no legacy on-premises infrastructure, and no physical media is building their ISO 27001 ISMS. They propose excluding all of Physical Theme 7 controls (7.1-7.14) from their SoA. Is this a valid exclusion?",opts:["No&#8212;all 14 physical controls are mandatory for all organizations","Some physical controls may be legitimately excluded, but the exclusion must be justified control-by-control. A cloud-native startup with no offices may legitimately exclude controls addressing premises they do not have (7.1 Physical Security Perimeters, 7.2 Physical Entry Controls, 7.3 Offices, 7.6 Secure Areas). But they still face physical risks from cloud hardware managed by providers (addressed through supplier controls), employee endpoints (7.7 Clear Desk/Screen applies in home offices, 7.9 Security of Assets Off-Premises for remote workers&#8217; equipment), and equipment disposal (7.14 applies when retiring laptops).","Blanket exclusion of an entire theme is always acceptable with a single justification","Cloud companies are exempt from ISO 27002 physical controls"],ans:1,explain:"SoA exclusions must be justified control-by-control based on specific applicability assessments&#8212;not blanket exclusions of entire themes. Even a fully cloud-native startup with no physical offices has physical security concerns: employees work from home offices, use company laptops (7.7 clear screen applies), and retire devices that must be securely wiped (7.14 applies). Premises-specific controls (7.1, 7.2, 7.3) may be legitimately excluded for a company with no physical premises. But the exclusion justification must be &#8220;we have no physical premises and this control addresses premises-based risks&#8221;&#8212;not &#8220;we are a cloud company and physical controls do not apply.&#8221;"}
},
{
  title:"ISO 27002 in Regulated Industries",
  tagline:"How the standard integrates with sector-specific security requirements",
  body:`<p>ISO 27002 is a general-purpose information security control standard&#8212;applicable across all industries. But regulated industries (healthcare, financial services, government, defense) have sector-specific security requirements that go beyond or alongside what ISO 27002 addresses. Understanding how ISO 27002 integrates with these sector-specific frameworks is essential for GRC professionals working in regulated environments.</p>
  <div class="cheat-grid">
    <div class="cheat-pill"><strong>Healthcare&#8212;HIPAA and ISO 27002</strong><span>HIPAA Security Rule Technical, Physical, and Administrative Safeguards map substantially to ISO 27002 controls. Organizations implementing ISO 27001/27002 for HIPAA compliance have a strong foundation: encryption (8.24 maps to HIPAA ePHI encryption), access controls (5.15-5.18, 8.2-8.3 map to HIPAA access management), audit controls (8.15 maps to HIPAA audit logging), and transmission security (8.24 maps to HIPAA transmission security). Gaps include: HIPAA-specific Business Associate Agreement requirements and HIPAA breach notification timelines.</span></div>
    <div class="cheat-pill"><strong>VA Healthcare Context</strong><span>The VA implements ISO 27002-equivalent controls through NIST SP 800-53&#8212;the US federal security control catalog. VA Handbook 6500 defines VA-specific security controls derived from NIST. GRC professionals at the VA benefit from ISO 27002 knowledge because: SP 800-53 and ISO 27002 share significant control overlap, VA systems increasingly use commercial cloud services where vendors may hold ISO 27001 certification, and ISO 27002&#8217;s attribute system aids in mapping VA requirements to commercial security frameworks for vendor assessment.</span></div>
    <div class="cheat-pill"><strong>Financial Services&#8212;Multiple Overlapping Requirements</strong><span>Financial organizations often face: SOC 2 (for demonstrating controls to customers), PCI DSS (for payment card processing), GLBA (for customer financial information), and potentially ISO 27001 (for international market credibility). ISO 27002&#8217;s comprehensive control catalog substantially satisfies all four frameworks&#8217; technical security requirements, with framework-specific additions. The integration opportunity is significant: one ISO 27002-based control framework can satisfy multiple regulatory requirements with documented mappings.</span></div>
    <div class="cheat-pill"><strong>Government&#8212;FISMA and NIST SP 800-53</strong><span>US federal agencies operate under FISMA, implemented through NIST SP 800-53 security controls. ISO 27002 and NIST SP 800-53 share significant common ground&#8212;both are comprehensive security control catalogs developed from similar security principles. Federal contractors who hold ISO 27001 certification have demonstrated security management practices that align well with FISMA requirements, though formal FISMA compliance requires assessment against SP 800-53 specifically. FedRAMP cloud services that hold ISO 27001 have a strong foundation for the FedRAMP authorization process.</span></div>
    <div class="cheat-pill"><strong>Defense&#8212;CMMC and ISO 27002</strong><span>CMMC Level 2 (based on NIST SP 800-171) requires 110 security practices. NIST SP 800-171 is derived from NIST SP 800-53, which shares substantial common ground with ISO 27002. Defense contractors with ISO 27001 certification have significant CMMC overlap but face CMMC-specific requirements around assessment methodology, maturity process requirements, and defense-specific controls that ISO 27002 does not address. ISO 27001/27002 is a strong foundation for CMMC preparation but not a substitute.</span></div>
    <div class="cheat-pill"><strong>Technology Sector&#8212;SOC 2 and ISO 27001</strong><span>Technology companies often pursue both SOC 2 Type II (preferred by US enterprise customers) and ISO 27001 (preferred by international enterprise customers). The two certifications cover substantially the same security ground with different evidence formats and audit procedures. Organizations that implement ISO 27002 controls comprehensively can substantially satisfy both audit programs with shared evidence. The incremental cost of pursuing both is far less than the cost of two independent security programs.</span></div>
  </div>`,
  quiz:{q:"A healthcare technology company has ISO 27001 certification and is being asked by a hospital customer to demonstrate HIPAA Security Rule compliance. How does ISO 27001 certification help their HIPAA compliance case?",opts:["ISO 27001 certification automatically satisfies HIPAA Security Rule requirements","ISO 27001 certification demonstrates that the organization has implemented a systematic information security management system with independently verified security controls&#8212;covering most of HIPAA&#8217;s Technical and Physical Safeguards and many Administrative Safeguards. However, HIPAA also requires a Business Associate Agreement (BAA), specific risk analysis documentation using HIPAA methodology, and breach notification procedures. ISO 27001 significantly advances HIPAA compliance but does not fully satisfy it without these HIPAA-specific additions.","ISO 27001 has no relevance to HIPAA compliance","ISO 27001 satisfies HIPAA only if the certification scope specifically includes ePHI processing"],ans:1,explain:"ISO 27001/27002 significantly supports HIPAA compliance because the underlying security requirements are substantially aligned. HIPAA&#8217;s Technical Safeguards (access control, audit controls, integrity, authentication, transmission security) map directly to ISO 27002 technological controls. HIPAA&#8217;s Physical Safeguards map to ISO 27002 physical controls. HIPAA&#8217;s Administrative Safeguards partially map to ISO 27002 organizational and people controls. An ISO 27001 certification audit verifies these controls are implemented and functioning&#8212;which is exactly the evidence HIPAA requires for reasonable and appropriate security measures. The gaps requiring HIPAA-specific additions are the legal framework elements: BAA, HIPAA-specific risk analysis documentation format, and HIPAA breach notification timelines."}
},
{
  title:"Common ISO 27002 Implementation Failures",
  tagline:"The patterns that appear in security assessments and audit findings",
  body:`<p>After decades of ISO 27002 implementation experience across thousands of organizations, consistent failure patterns have emerged. These failures appear in security assessments, ISO 27001 certification audits, and post-breach investigations. Recognizing them enables GRC professionals to anticipate and address gaps before they become incidents or audit findings.</p>
  <div class="cheat-grid">
    <div class="cheat-pill"><strong>Controls Without Risk Justification</strong><span>Implementing controls as compliance checkbox exercises rather than risk treatments. Controls implemented without understanding which specific risk they address cannot be properly calibrated, cannot be effectively measured, and tend to be implemented at arbitrary depths. The result is security theater&#8212;an impressive list of controls that may not address the organization&#8217;s actual risk profile.</span></div>
    <div class="cheat-pill"><strong>Incomplete Asset Inventory</strong><span>The most common foundational failure: organizations believe they know what they need to protect but consistently miss shadow IT systems, cloud services adopted without IT involvement, data repositories created for temporary projects that became permanent, and third-party integrations that process organizational data. An incomplete asset inventory means unknown risks and unprotected assets.</span></div>
    <div class="cheat-pill"><strong>Privilege Creep and Orphaned Accounts</strong><span>Access rights accumulated over time through role changes without corresponding access removal, combined with accounts not deactivated upon termination. These are among the most consistently cited findings in security assessments across all industries. Both 5.16/5.18 (access rights management) and 8.2 (privileged access management) address this, yet it remains ubiquitous in practice.</span></div>
    <div class="cheat-pill"><strong>Untested Backups and Incident Response</strong><span>Organizations that have backup systems and incident response plans but have never tested either. Discovered during a real incident when restoration fails or incident response team members do not know their roles. 8.13 explicitly requires backup testing; 5.24 requires effective preparation including rehearsal. Untested capabilities are not capabilities.</span></div>
    <div class="cheat-pill"><strong>Security as IT Department Function</strong><span>Treating information security as exclusively an IT problem rather than an organization-wide governance matter. 5.2 (information security roles and responsibilities) and 5.4 (management responsibilities) require security to be a business management function. Organizations where &#8220;security is IT&#8217;s problem&#8221; consistently fail to address the organizational, process, and people dimensions of security that technical IT controls cannot address.</span></div>
    <div class="cheat-pill"><strong>Patch Management Backlogs</strong><span>Technical vulnerability management (8.8) failures resulting in significant percentages of systems running with known, critical vulnerabilities unpatched for months or years. Patch management is operationally challenging&#8212;requiring testing before deployment, change windows that minimize disruption, and coordination across systems with complex dependencies. But the challenge does not reduce the risk of known exploitable vulnerabilities in production systems.</span></div>
    <div class="cheat-pill"><strong>Inadequate Third-Party Oversight</strong><span>Supplier security management (5.19-5.22) failures: suppliers approved based on questionnaire responses never verified, contractual security requirements that are never monitored, and changes to supplier services or sub-suppliers that are never communicated to customers. Supply chain attacks have become a primary attack vector precisely because organizational trust in suppliers is often poorly governed.</span></div>
    <div class="cheat-pill"><strong>Scope Gaming</strong><span>Designing ISO 27001 ISMS scope to exclude the highest-risk systems and processes, achieving certification for low-risk activities while the organization&#8217;s most critical systems operate outside the certified scope. Customers relying on certification for security assurance may discover that the scope does not cover the systems and data they care about. A transparent scope statement is essential for certification to provide meaningful assurance.</span></div>
  </div>`,
  quiz:{q:"An ISO 27001 surveillance audit finds that the organization&#8217;s vulnerability scanning covers 60% of their systems. The remaining 40% are cloud-hosted systems that the IT team &#8216;forgot&#8217; to include in the scanning program when they migrated to cloud. What failure does this represent?",opts:["A minor finding requiring documentation updates","Multiple control failures: 5.9 (Inventory of Information and Other Associated Assets&#8212;cloud systems are assets that must be in the inventory), 8.8 (Management of Technical Vulnerabilities&#8212;vulnerability management must cover all systems in scope), and potentially 5.23 (Information Security for Use of Cloud Services&#8212;cloud service adoption must include information security governance). Leaving 40% of systems outside vulnerability management is a significant security gap and likely a major non-conformity in ISO 27001 terms.","This is acceptable&#8212;cloud providers handle security for cloud-hosted systems","A finding only if the missing systems contain sensitive data"],ans:1,explain:"This scenario illustrates a common cloud adoption pattern: organizations migrate systems to cloud infrastructure without updating their security governance to cover the migrated systems. Three distinct controls fail: 5.9 (the asset inventory is incomplete, missing 40% of systems), 8.8 (vulnerability management is not comprehensive), and 5.23 (the new 2022 control specifically addressing cloud service security governance was not followed when the cloud migration occurred). In ISO 27001 terms, this represents at minimum a minor non-conformity (failure to implement a required control) and potentially a major non-conformity if the uncovered systems contain sensitive information. Surveillance auditors specifically look for this pattern because cloud migrations frequently create coverage gaps."}
},
{
  title:"30-Day Review",
  tagline:"Everything we covered&#8212;in one final look",
  body:`<p>You have completed all 30 days of ISO/IEC 27002! Let&#8217;s take a final inventory of what you now know about the world&#8217;s most widely used information security control catalog.</p>
  <div class="tag-header">The Big Picture</div>
  <p>ISO/IEC 27002 is the international information security control catalog published by ISO/IEC JTC 1, SC 27. Current version: ISO/IEC 27002:2022 (published February 2022). A &#8220;code of practice&#8221;&#8212;guidance, not a certifiable standard on its own. 93 controls in 4 themes (Organizational, People, Physical, Technological). Companion to ISO 27001 (the certifiable ISMS). Referenced in ISO 27001 Annex A. Used by organizations in over 150 countries as their security control reference. 11 new controls added in 2022. Introduces a five-attribute tagging system for multi-dimensional control filtering.</p>
