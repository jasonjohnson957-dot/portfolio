  <div class="tag-header">The Four Themes and Control Counts</div>
  <div class="badge-row">
    <span class="badge badge-purple">5&#8202;&#8202; Organizational (37 controls)&#8202;&#8202;</span>
    <span class="badge badge-rose">6&#8202;&#8202; People (8 controls)&#8202;&#8202;</span>
    <span class="badge badge-amber">7&#8202;&#8202; Physical (14 controls)&#8202;&#8202;</span>
    <span class="badge badge-blue">8&#8202;&#8202; Technological (34 controls)&#8202;&#8202;</span>
  </div>
  <div class="tag-header">The Five Attributes</div>
  <div class="badge-row">
    <span class="badge badge-em">Control Type: Preventive / Detective / Corrective</span>
    <span class="badge badge-em">Information Security Properties: Confidentiality / Integrity / Availability</span>
    <span class="badge badge-em">Cybersecurity Concepts: Identify / Protect / Detect / Respond / Recover (NIST CSF)</span>
    <span class="badge badge-em">Operational Capabilities: 13 domains</span>
    <span class="badge badge-em">Security Domains: Governance / Protection / Defence / Resilience</span>
  </div>
  <div class="tag-header">The 11 New 2022 Controls</div>
  <div class="badge-row">
    <span class="badge badge-em">5.7 Threat Intelligence</span>
    <span class="badge badge-em">5.23 Information Security for Use of Cloud Services</span>
    <span class="badge badge-em">5.30 ICT Readiness for Business Continuity</span>
    <span class="badge badge-em">7.4 Physical Security Monitoring</span>
    <span class="badge badge-em">8.9 Configuration Management</span>
    <span class="badge badge-em">8.10 Information Deletion</span>
    <span class="badge badge-em">8.11 Data Masking</span>
    <span class="badge badge-em">8.12 Data Leakage Prevention</span>
    <span class="badge badge-em">8.16 Monitoring Activities</span>
    <span class="badge badge-em">8.23 Web Filtering</span>
    <span class="badge badge-em">8.28 Secure Coding</span>
  </div>
  <div class="tag-header">ISO 27001 Connection</div>
  <div class="badge-row">
    <span class="badge badge-teal">ISO 27001 Annex A references all 93 ISO 27002 controls</span>
    <span class="badge badge-teal">Statement of Applicability (SoA) documents control selection and exclusions</span>
    <span class="badge badge-teal">Risk assessment drives control selection&#8212;not all 93 apply to every org</span>
    <span class="badge badge-teal">Transition deadline from 2013 to 2022: October 31, 2025</span>
  </div>
  <div class="tag-header">Key Framework Relationships</div>
  <div class="badge-row">
    <span class="badge badge-em">ISO 27001 &#8212; the certifiable ISMS (mandatory companion)</span>
    <span class="badge badge-teal">ISO 27017 &#8212; extends 27002 for cloud security</span>
    <span class="badge badge-rose">ISO 27018 &#8212; extends 27002 for cloud PII privacy</span>
    <span class="badge badge-purple">ISO 27701 &#8212; extends 27001 and 27002 for privacy management (PIMS)</span>
    <span class="badge badge-blue">NIST SP 800-53 &#8212; US federal counterpart (substantial overlap)</span>
    <span class="badge badge-cyan">NIST CSF 2.0 &#8212; mapped through Cybersecurity Concepts attribute</span>
    <span class="badge badge-slate">CIS Controls v8 &#8212; prescriptive implementation detail for technical controls</span>
  </div>
  <div class="highlight-box">Hit the green CS button above to access your complete ISO 27002 cheat sheet with all 93 controls organized by theme, the five attributes, the 11 new 2022 controls, the SoA structure, and all framework relationships in one comprehensive reference.</div>`,
  quiz:{q:"What single fact most clearly distinguishes ISO 27002 from ISO 27001 in terms of their respective roles in a security program?",opts:["ISO 27002 is newer&#8212;it was published after ISO 27001","ISO 27001 specifies the MANAGEMENT SYSTEM requirements (how security is governed, monitored, and improved) while ISO 27002 specifies the CONTROLS (what specific security measures are implemented). ISO 27001 is certifiable; ISO 27002 is a code of practice providing guidance. Together, ISO 27001 tells you how to run your security program and ISO 27002 tells you what security measures to put in it.","ISO 27001 covers only management topics while ISO 27002 covers only technical topics","ISO 27002 requires certification while ISO 27001 is voluntary guidance"],ans:1,explain:"The management system vs. control catalog distinction is the most important conceptual divide between the two standards. ISO 27001 defines the governance, risk management, leadership, monitoring, audit, and improvement processes that constitute a functioning ISMS&#8212;it is the &#8216;how we manage security&#8217; document. ISO 27002 defines the specific security controls (from policies to encryption to physical security to incident response) that address specific security risks&#8212;it is the &#8216;what security measures we implement&#8217; document. Neither is sufficient alone: ISO 27001 without ISO 27002 has a management framework with no control guidance; ISO 27002 without ISO 27001 has a control catalog with no governance framework. Together they create a complete, certifiable security program."}
},
{
  title:"ISO 27002 Cheat Sheet",
  tagline:"Your complete quick-reference guide",
  isCheatSheet:true,
  body:`
  <div class="cheat-section">
    <h3>What Is ISO/IEC 27002?</h3>
    <p style="font-size:13.5px;color:#6b6b68">ISO/IEC 27002 &#8212; &#8220;Information Security, Cybersecurity and Privacy Protection &#8212; Information Security Controls.&#8221; International standard published by ISO/IEC JTC 1, SC 27. Current version: ISO/IEC 27002:2022 (published February 2022). A &#8220;code of practice&#8221; providing guidance and best practice recommendations rather than certification requirements. 93 controls organized into 4 themes. Not directly certifiable&#8212;organizations certify to ISO 27001, which implements ISO 27002 controls via Annex A. Used by organizations in 150+ countries as their security control reference. Previous version: ISO/IEC 27002:2013 (114 controls, 14 domains). 2013-to-2022 transition deadline for existing ISO 27001 certificates: October 31, 2025.</p>
  </div>

  <div class="cheat-section">
    <h3>The Four Themes and Key Controls</h3>
    <div class="control-row">
      <div class="ctrl-card"><b style="color:#2E1065">5 &#8212; Organizational Controls (37 controls)</b><br>5.1 Policies &#8226; 5.2 Roles and Responsibilities &#8226; 5.3 Segregation of Duties &#8226; 5.4 Management Responsibilities &#8226; 5.5 Contact with Authorities &#8226; 5.6 Special Interest Groups &#8226; <b>5.7 Threat Intelligence (NEW)</b> &#8226; 5.8 Security in Project Management &#8226; 5.9 Asset Inventory &#8226; 5.10 Acceptable Use &#8226; 5.11 Return of Assets &#8226; 5.12 Information Classification &#8226; 5.13 Labeling &#8226; 5.14 Information Transfer &#8226; 5.15 Access Control Policy &#8226; 5.16 Identity Management &#8226; 5.17 Authentication Information &#8226; 5.18 Access Rights &#8226; 5.19-5.22 Supplier/Supply Chain &#8226; <b>5.23 Cloud Services (NEW)</b> &#8226; 5.24-5.28 Incident Management &#8226; 5.29 Security During Disruption &#8226; <b>5.30 ICT Continuity (NEW)</b> &#8226; 5.31 Legal Requirements &#8226; 5.32 Intellectual Property &#8226; 5.33 Records Protection &#8226; 5.34 Privacy and PII &#8226; 5.35 Independent Review &#8226; 5.36 Compliance Review &#8226; 5.37 Documented Operating Procedures</div>
      <div class="ctrl-card"><b style="color:#500D27">6 &#8212; People Controls (8 controls)</b><br>6.1 Screening &#8226; 6.2 Employment Terms and Conditions &#8226; 6.3 Awareness, Education and Training &#8226; 6.4 Disciplinary Process &#8226; 6.5 Responsibilities After Termination &#8226; 6.6 Confidentiality/NDA Agreements &#8226; 6.7 Remote Working &#8226; 6.8 Information Security Event Reporting<br><br><b style="color:#633806">7 &#8212; Physical Controls (14 controls)</b><br>7.1 Physical Security Perimeters &#8226; 7.2 Physical Entry Controls &#8226; 7.3 Offices and Facilities &#8226; <b>7.4 Physical Security Monitoring (NEW)</b> &#8226; 7.5 Environmental Threats &#8226; 7.6 Working in Secure Areas &#8226; 7.7 Clear Desk and Screen &#8226; 7.8 Equipment Siting &#8226; 7.9 Assets Off-Premises &#8226; 7.10 Storage Media &#8226; 7.11 Supporting Utilities &#8226; 7.12 Cabling Security &#8226; 7.13 Equipment Maintenance &#8226; 7.14 Secure Disposal</div>
    </div>

  </div>

  <div class="cheat-section">
    <h3>The Five Attributes</h3>
    <div class="control-row">
      <div class="ctrl-card"><b>1. Control Type</b><br>Preventive (stops incidents), Detective (identifies incidents), Corrective (restores after incidents). Controls can have multiple types.</div>
      <div class="ctrl-card"><b>2. Information Security Properties</b><br>Confidentiality, Integrity, Availability (CIA triad). Which properties does the control protect?</div>
      <div class="ctrl-card"><b>3. Cybersecurity Concepts</b><br>Maps to NIST CSF functions: Identify, Protect, Detect, Respond, Recover. Enables ISO 27002 &#8596; NIST CSF mapping.</div>

    <h3>ISO 27001 + ISO 27002 Integration</h3>
    <div class="control-row">
      <div class="ctrl-card"><b>ISO 27001</b> &#8212; MANAGEMENT SYSTEM (certifiable): how security is governed, risk-managed, monitored, audited, and improved. Annex A references all 93 ISO 27002 controls. Organizations certify to ISO 27001.</div>
      <div class="ctrl-card"><b>ISO 27002</b> &#8212; CONTROL GUIDANCE (code of practice): what specific security controls to implement and how. Not independently certifiable. Provides the control catalog that ISO 27001 Annex A references.</div>
      <div class="ctrl-card"><b>Statement of Applicability (SoA)</b> &#8212; Bridge document: for each of 93 Annex A controls, documents: Included or Excluded, justification (which risk addressed or why excluded), implementation status, and evidence reference. Mandatory for ISO 27001 certification. Living document requiring regular updates.</div>
      <div class="ctrl-card"><b>Control Selection Process</b> &#8212; Risk assessment &#8594; Risk treatment decision &#8594; Control selection from ISO 27002 &#8594; SoA documentation &#8594; Control implementation &#8594; Effectiveness measurement. Controls selected to address identified risks, not universally applied.</div>
    </div>

  <div class="cheat-section">
    <h3>Framework Relationships</h3>
    <div class="control-row">
      <div class="ctrl-card"><b>ISO 27001</b> &#8212; The certifiable ISMS. Mandatory companion. Annex A = ISO 27002 controls. Transition deadline: October 31, 2025.</div>
      <div class="ctrl-card"><b>ISO 27017</b> &#8212; Extends 27002 for cloud security. Adds 7 CLD controls for cloud-specific risks. Cloud implementation guidance for applicable 27002 controls.</div>
      <div class="ctrl-card"><b>ISO 27018</b> &#8212; Extends 27002 for cloud PII privacy. PII processor obligations in cloud. Often implemented with 27017.</div>
      <div class="ctrl-card"><b>ISO 27701</b> &#8212; Extends 27001 and 27002 for privacy management (PIMS). Annex A provides privacy implementation guidance for applicable 27002 controls. First certifiable privacy management standard.</div>
      <div class="ctrl-card"><b>NIST SP 800-53</b> &#8212; US federal security control catalog (used in FedRAMP, FISMA, CMMC). Substantial overlap with ISO 27002. Different organization and language; similar security coverage. NIST CSF maps via Cybersecurity Concepts attribute.</div>
      <div class="ctrl-card"><b>CIS Controls v8</b> &#8212; 18 controls, 153 safeguards. More prescriptive technical detail than ISO 27002. CIS safeguards can serve as implementation guidance for ISO 27002 technological controls. Implementation Groups = tiered adoption.</div>
      <div class="ctrl-card"><b>SOC 2</b> &#8212; US service organization attestation. Security criterion maps substantially to ISO 27002. Organizations pursuing both can substantially reuse controls and evidence with different formats for each audit.</div>

let current = 0;
function buildGrid(){
  const g=document.getElementById('dayGrid');g.innerHTML='';
  for(let i=0;i<days.length;i++){
    const b=document.createElement('button');
    b.className='day-pip'+(days[i].isCheatSheet?' cheat':'')+(i===current?' active':'');
    b.textContent=days[i].isCheatSheet?'CS':(i+1);
    b.title=days[i].title;
    b.onclick=(()=>{const idx=i;return()=>goTo(idx);})();
    g.appendChild(b);
  }
}
function goTo(idx){current=idx;render();}
function changeDay(dir){current=Math.max(0,Math.min(days.length-1,current+dir));render();}
function render(){
  const d=days[current];const total=days.length;
  document.getElementById('dayCounter').textContent=(current+1)+' / '+total;
  document.getElementById('prevBtn').disabled=current===0;
  document.getElementById('nextBtn').disabled=current===total-1;
  document.getElementById('progBar').style.width=(((current+1)/total)*100)+'%';
  buildGrid();
  if(d.isCheatSheet){
    document.getElementById('lessonArea').innerHTML=`<div class="card"><div class="lesson-header"><div class="day-badge" style="background:#E1F5EE"><div class="day-num" style="color:#085041;font-size:14px">CHEAT</div><div class="day-lbl" style="color:#0F6E56">SHEET</div></div><div class="lesson-meta"><h2>${d.title}</h2><div class="tagline">${d.tagline}</div></div></div><div class="lesson-body">${d.body}</div></div>`;
    return;
  }
  const quizId='quiz_'+current;let quizHtml='';
  if(d.quiz){
    const optsHtml=d.quiz.opts.map((o,i)=>`<button class="quiz-btn" onclick="checkAnswer(${i},${d.quiz.ans},'${quizId}')">${o}</button>`).join('');
    quizHtml=`<div class="quiz-box"><p>Quick check: ${d.quiz.q}</p><div>${optsHtml}</div><div class="answer-reveal" id="${quizId}"></div></div>`;
  }
  document.getElementById('lessonArea').innerHTML=`<div class="card"><div class="lesson-header"><div class="day-badge"><div class="day-num">${current+1}</div><div class="day-lbl">Day</div></div><div class="lesson-meta"><h2>${d.title}</h2><div class="tagline">${d.tagline}</div></div></div><div class="section-label">Today&#8217;s lesson</div><div class="lesson-body">${d.body}</div>${quizHtml}</div>`;
}
function checkAnswer(chosen,correct,qid){
  const el=document.getElementById(qid);const d=days[current];if(!d.quiz)return;
  const isRight=chosen===correct;
  el.innerHTML='<strong>'+(isRight?'Correct!':'Not quite.')+'</strong> '+d.quiz.explain;
  el.className='answer-reveal show';
  el.style.background=isRight?'#EAF3DE':'#ECFDF5';
  el.style.borderColor=isRight?'#3B6D11':'#065F46';
  el.style.color='#1a1a18';
}
render();
</script>
