  <div class="step-card"><b>Level 4&#8212;Administrative Controls</b><br>Implement policies, processes, and human oversight to reduce impact. Human review requirements for high-stakes AI decisions, mandatory AI decision documentation enabling appeal, bias monitoring programs, incident reporting requirements, and operator training on AI limitations all constitute administrative controls. Administrative controls are often essential but rely on consistent human execution, which introduces reliability limitations.</div>
  <div class="step-card"><b>Level 5&#8212;Transparency and Rights Measures</b><br>Ensure affected parties have meaningful information about AI decisions affecting them, recourse mechanisms to challenge incorrect decisions, and rights enabling their participation in AI governance. Transparency measures do not prevent AI impacts but enable affected parties to identify and respond to harmful outcomes. ISO 42005 treats transparency and rights measures as essential complements to technical and administrative mitigations.</div>
  <div class="step-card"><b>Residual Impact Assessment</b><br>After treatment measures are designed, the AISIA must assess the residual impact&#8212;what impact remains after treatment is implemented. Residual impact must be evaluated against acceptance criteria. If residual impact still exceeds acceptable thresholds, additional treatment is required or the deployment decision must be reconsidered. Treatment plans that assume mitigations will fully eliminate impacts without verifying their effectiveness do not satisfy ISO 42005 requirements.</div>`,
  quiz:{q:"An AISIA for a facial recognition system finds high error rates for darker-skinned individuals. The team proposes mitigating by training diversity staff to manually review low-confidence matches for darker-skinned individuals, ensuring human oversight of uncertain cases. Where does this fall in the mitigation hierarchy and what concerns does it raise?",opts:["This is a Level 1 (Elimination) mitigation because it ensures human review","This is a Level 4 (Administrative Control) mitigation&#8212;human review policy. Concerns include: (1) the underlying discriminatory error rate has not been reduced; (2) the mitigation relies on consistent human execution, which may not be reliable at scale; (3) singling out darker-skinned individuals for different processing may itself constitute differential treatment; and (4) Level 1-3 mitigations (improving model training data diversity, retraining to equalize error rates) should be attempted before accepting an administrative control that addresses consequences rather than causes.","Level 5 (Transparency) because it involves informing affected parties","This mitigation is insufficient at any level and cannot be implemented"],ans:1,explain:"This scenario illustrates both the appropriate application of the mitigation hierarchy and the limitations of administrative controls. Requiring manual review for low-confidence matches for darker-skinned individuals is an administrative control (Level 4) that addresses the consequence (uncertain results reviewed by humans) rather than the cause (model underperforms on darker-skinned individuals). ISO 42005&#8217;s hierarchy preference means Level 1-3 mitigations should be pursued first: improving training data to include better representation of darker-skinned individuals (substitution), retraining with fairness constraints (engineering control), or if the model cannot be sufficiently improved, reconsidering the system. The administrative control may be appropriate as a complement to technical mitigations but is not a substitute for addressing the underlying model performance disparity."}
},
{
  title:"Documentation Requirements",
  tagline:"Creating the records that make AI impact assessment credible and accountable",
  body:`<p><span class="key-term">Documentation</span> is what transforms an AI impact assessment from an internal reflection exercise into an accountable, auditable, and legally credible process. ISO 42005 requires comprehensive documentation of the assessment process, findings, decisions, and ongoing monitoring&#8212;creating an evidence record that supports regulatory compliance, legal accountability, and organizational learning.</p>
  <div class="highlight-box"><strong>Why documentation is a governance requirement, not a compliance burden:</strong> Assessment documentation serves multiple critical functions beyond regulatory compliance. It creates organizational memory&#8212;ensuring that impact assessment findings inform future AI development decisions rather than being forgotten after deployment. It enables external accountability&#8212;providing evidence to regulators, courts, and affected parties of how impact assessment was conducted and what was found. It enables learning&#8212;comparing assessment predictions with operational outcomes improves future assessment quality. And it creates deterrence&#8212;the knowledge that impact decisions must be documented and justified reduces the temptation to rationalize away inconvenient findings.</highlight-box>
  <p>ISO 42005 documentation requirements organized by assessment component:</p>
  <div class="cheat-grid">
    <div class="cheat-pill"><strong>Assessment Context Documentation</strong><span>Records of: the AI system being assessed (version, capabilities, training data, intended use), the scope of the assessment (what is included and excluded with justification), the assessment team (roles, qualifications, independence), the criteria against which impacts will be evaluated (established before assessment begins), and the methodology selected. Context documentation enables others to understand and evaluate the assessment&#8217;s design.</span></div>
    <div class="cheat-pill"><strong>Affected Party Documentation</strong><span>Records of: who was identified as an affected party (individuals, groups, communities, broader society), the rationale for inclusion or exclusion from assessment scope, the methods used to identify affected parties, and how affected community consultation was conducted (if applicable). Affected party documentation enables evaluation of whether the assessment considered the full range of potentially impacted parties.</span></div>
    <div class="cheat-pill"><strong>Impact Identification Records</strong><span>Records of: all impacts identified through assessment methods, the methods used to identify impacts (internal analysis, expert consultation, affected party engagement, analogous system review), and why specific identification methods were chosen. Identification records enable evaluation of whether the identification was comprehensive and methodologically sound.</span></div>
    <div class="cheat-pill"><strong>Impact Analysis Records</strong><span>Records of: the likelihood assessment for each identified impact (with supporting evidence and acknowledged uncertainties), the severity assessment for each impact (disaggregated where relevant), and the reasoning underlying analysis conclusions. Analysis records must be honest about uncertainty and disagreement&#8212;assessment documentation that presents only confident conclusions is not credible.</span></div>
    <div class="cheat-pill"><strong>Evaluation and Decision Records</strong><span>Records of: the evaluation criteria applied, the evaluation conclusion for each impact (acceptable, requires treatment, unacceptable), the rationale for evaluation decisions, who made evaluation decisions and with what authority, and any disagreements within the assessment team. Decision records create accountability for the judgments that shape AI deployment.</span></div>
    <div class="cheat-pill"><strong>Treatment Plan Documentation</strong><span>Records of: the treatment measures selected for each impact requiring treatment, the rationale for selecting those measures (including why higher-hierarchy mitigations were or were not pursued), the responsible party for each treatment action, the timeline for implementation, and the metrics for assessing treatment effectiveness. Treatment plans must be specific enough to enable implementation verification.</span></div>
  </div>`,
  quiz:{q:"An organization conducts an AISIA and produces a 3-page summary report with overall conclusions but no records of individual impact analyses, evaluation decisions, or treatment rationale. A regulator requests the AISIA documentation following a complaint. What documentation gap does this reveal?",opts:["The 3-page summary satisfies documentation requirements&#8212;regulators only need overall conclusions","ISO 42005 requires comprehensive process documentation, not just conclusions. Without records of individual impact analyses, the regulator cannot verify whether specific impacts were identified, how they were analyzed, or whether evaluation criteria were applied consistently. Without evaluation decision records, the regulator cannot assess whether acceptable impacts were genuinely acceptable or whether significant impacts were rationalized away. Without treatment rationale, the regulator cannot evaluate whether appropriate mitigations were selected. The 3-page summary is a conclusion without supporting evidence.","Documentation requirements only apply to high-risk AI systems","Regulators can only request documentation from AI providers, not deployers"],ans:1,explain:"This documentation failure is significant precisely because it prevents meaningful external accountability. A 3-page summary of conclusions tells a regulator what the organization decided but not how it decided, what evidence supported its conclusions, or whether its methodology was sound. ISO 42005&#8217;s comprehensive documentation requirements serve the accountability function: they create a record that can be examined by regulators, courts, and affected parties to evaluate whether the impact assessment was genuine or superficial. An assessment that produced only a summary conclusion rather than documented process evidence has the appearance of compliance without the substance of accountability."}
},
{
  title:"Communication of Assessment Results",
  tagline:"Sharing impact assessment findings with relevant parties",
  body:`<p><span class="key-term">Communication</span> of AISIA findings to relevant stakeholders transforms impact assessment from an internal exercise into an accountability mechanism and an enabler of informed decision-making. ISO 42005 requires that findings be communicated appropriately to decision-makers, affected parties, regulators, and the public&#8212;with the depth and format appropriate to each audience.</p>
  <div class="cheat-grid">
    <div class="cheat-pill"><strong>Communication to Organizational Leadership</strong><span>Leadership decision-makers (boards, executives, AI governance committees) need: a clear summary of significant impacts identified, the evaluation conclusions and their implications for deployment decisions, the treatment measures planned and their expected effectiveness, the residual impacts that will remain after treatment, and the ongoing monitoring commitments. Leadership communication should enable informed deployment decisions, not be designed to obtain approval by minimizing inconvenient findings.</span></div>
    <div class="cheat-pill"><strong>Communication to Operators and Developers</strong><span>People who will operate or further develop the AI system need technical detail: specific failure modes identified, the affected party categories most at risk, the treatment measures implemented (particularly those requiring operator compliance), the monitoring metrics being tracked, and the processes for reporting and responding to impact incidents. Operator communication is essential for translating impact assessment findings into day-to-day operational practice.</span></div>
    <div class="cheat-pill"><strong>Communication to Affected Parties</strong><span>Individuals and communities affected by AI decisions deserve meaningful information about: that they are subject to AI decision-making, the general nature of how AI influences decisions about them, what data is used, what their rights are (to contest, to appeal, to request human review), and how to exercise those rights. Transparency to affected parties is both an ethical obligation and a legal requirement in many jurisdictions. The communication should be accessible to the intended audience&#8212;not buried in technical documentation.</span></div>
    <div class="cheat-pill"><strong>Communication to Regulators</strong><span>Regulatory communication may be mandatory (EU AI Act requires fundamental rights impact assessments to be submitted to competent authorities for high-risk AI) or reactive (provided in response to regulatory inquiries or investigations). Regulatory communication requires the full documentation trail enabling verification of assessment methodology, findings, and decisions. Proactive regulatory transparency can reduce regulatory scrutiny and build institutional trust.</span></div>
    <div class="cheat-pill"><strong>Public Communication</strong><span>For AI systems with significant public impact, proactive public communication of impact assessment findings demonstrates responsible AI governance and enables public scrutiny. AI system cards, impact assessment summaries, and transparency reports all constitute forms of public communication that organizations with significant public-facing AI should consider. Public communication builds public trust and social license for AI deployment.</span></div>
    <div class="cheat-pill"><strong>Communication Limitations and Confidentiality</strong><span>Some AISIA findings may be subject to legitimate confidentiality constraints: legally privileged assessments, commercially sensitive information, and security-sensitive findings about AI system vulnerabilities. ISO 42005 recognizes these constraints while maintaining that confidentiality cannot be used to shield information that affected parties need to exercise their rights. The principle is maximum transparency consistent with legitimate confidentiality interests.</span></div>
  </div>
  <div class="analogy-box"><strong>The product recall analogy for affected party communication:</strong> When a safety defect is found in a consumer product, the manufacturer must notify affected consumers clearly, promptly, and in accessible language&#8212;not in legal fine print that consumers cannot find or understand. The purpose of the communication is to enable consumers to protect themselves, not to minimize organizational liability. ISO 42005&#8217;s requirements for communicating AI impacts to affected parties reflect the same principle: communication must be designed to enable affected parties to understand and respond to AI impacts, not to minimize organizational accountability.</div>`,
  quiz:{q:"A healthcare organization&#8217;s AISIA finds that their AI diagnostic tool performs significantly worse for elderly patients. They share this finding with their medical IT team and AI vendor but do not communicate it to treating physicians or patients. What communication requirement has been inadequately addressed?",opts:["Communication to the IT team and vendor is sufficient&#8212;clinical decisions remain with physicians","Communication to treating physicians is critical&#8212;they need to know the AI performs worse for elderly patients to calibrate their reliance on AI recommendations appropriately. Patients in the affected demographic (elderly) have a right to know that AI diagnostic tools assisting their care have known limitations for their population group. ISO 42005 requires communication to operators (physicians) and affected parties (patients) in addition to technical stakeholders. Limiting communication to technical teams while physicians unknowingly over-rely on a flawed AI tool amplifies rather than mitigates the impact.","Communication requirements only apply to external AI systems, not internal clinical tools","Regulatory communication is the only required form of communication for healthcare AI"],ans:1,explain:"This communication failure creates a dangerous situation: treating physicians are using an AI tool for elderly patient care without knowing that the tool has documented performance deficiencies for that exact population. The physician&#8217;s clinical judgment is being undermined by their trust in a tool whose limitations they are not aware of. ISO 42005&#8217;s requirement to communicate findings to operators (physicians) enables them to appropriately calibrate their reliance on AI outputs. The finding about elderly patient performance also raises the question of patient communication&#8212;elderly patients may reasonably want to know that AI tools assisting their care have documented performance disparities for their age group, enabling them to ask for additional human review or second opinions."}
},
{
  title:"AISIA Across the AI System Lifecycle",
  tagline:"When and how impact assessment applies at each stage of AI development and operation",
  body:`<p>ISO 42005 requires that AI system impact assessment be integrated throughout the AI system lifecycle&#8212;not conducted once at a single point in time. Understanding when AISIA activities are triggered, how their focus evolves across lifecycle stages, and how assessment findings feed back into system development and operation is essential for implementing ISO 42005 effectively.</p>
  <div class="highlight-box"><strong>The lifecycle integration principle:</strong> AI impacts are dynamic&#8212;they change as the AI system evolves, as deployment contexts change, as user behavior adapts, and as societal conditions shift. A static one-time assessment cannot adequately govern a system that is continuously updated, deployed in new contexts, and operating in a changing world. ISO 42005&#8217;s lifecycle integration requires AISIA to be an ongoing process woven throughout the AI system&#8217;s existence, not a gateway checkpoint.</highlight-box>
  <div class="cheat-grid">
    <div class="cheat-pill"><strong>Conception and Requirements Phase</strong><span>AISIA begins at the earliest design stage: should this AI system be built? What impacts might it create by design? Are there use cases that should be excluded? What constraints on system design are necessary to avoid unacceptable impacts? Early-stage assessment is most valuable because it can influence fundamental design decisions before significant development investment has been made&#8212;the equivalent of Privacy by Design, applied to impact assessment.</span></div>
    <div class="cheat-pill"><strong>Development and Training Phase</strong><span>As the AI system takes shape, AISIA examines training data for biases that may produce discriminatory outputs, evaluates model design choices for impact implications, tests prototype behavior against identified impact scenarios, and refines impact identification as the system&#8217;s actual capabilities become clearer. Development-phase assessment enables technical design changes that are far less expensive than post-deployment remediation.</span></div>
    <div class="cheat-pill"><strong>Testing and Validation Phase</strong><span>Pre-deployment testing specifically designed to evaluate identified impacts: fairness testing across demographic groups, adversarial testing for harmful use cases, red-team exercises targeting identified impact scenarios, and validation of treatment measure effectiveness. Testing-phase AISIA verifies whether the treatments designed during development are actually effective in practice rather than theoretically.</span></div>
    <div class="cheat-pill"><strong>Deployment and Launch Phase</strong><span>Pre-deployment assessment reviews testing outcomes, confirms treatment measures are implemented, establishes ongoing monitoring protocols, and produces the initial AISIA documentation. The deployment decision should be an informed, documented judgment based on AISIA findings&#8212;not an implicit assumption that deployment can proceed because development is complete.</span></div>
    <div class="cheat-pill"><strong>Operational Phase</strong><span>Ongoing AISIA during operation includes: continuous monitoring of AI performance metrics disaggregated by affected party groups, incident tracking when impacts materialize, regular review of monitoring data against assessment predictions, stakeholder feedback mechanisms, and periodic full reassessment. Operational monitoring detects impacts that were not predicted in pre-deployment assessment.</span></div>
    <div class="cheat-pill"><strong>Change, Update, and Retirement</strong><span>Changes to the AI system (model updates, training data changes, new use cases) trigger reassessment of relevant impact dimensions. Significant changes may require full reassessment; minor changes may require targeted review of affected impact areas. AI system retirement triggers assessment of data disposition, transition impacts on users who have relied on the system, and ongoing obligations for historical impact documentation.</span></div>
  </div>`,
  quiz:{q:"A company built and deployed an AI customer service chatbot without conducting an AISIA. Six months into operation, they are now planning to conduct their first AISIA. How should the operational-phase AISIA differ from an ideal pre-deployment assessment?",opts:["An operational AISIA is identical to a pre-deployment AISIA&#8212;assessment methodology does not change","The operational AISIA has both advantages and limitations compared to pre-deployment assessment. Advantages: actual operational data is available revealing real impacts that pre-deployment testing might not have captured; user feedback and incident reports provide empirical evidence of impacts; the assessment can examine actual rather than predicted behavior. Limitations: the assessment cannot prevent impacts that have already occurred; the ability to make design changes is constrained by sunk investment; and the organization must address both operational remediation and future prevention simultaneously. The operational AISIA should prioritize identifying and remediating ongoing harms in addition to establishing forward-looking monitoring.","An operational AISIA should only assess technical performance, not social impacts","Organizations that miss pre-deployment assessment cannot conduct AISIA once deployed"],ans:1,explain:"An operational-phase AISIA conducted after deployment requires a different approach than an ideal pre-deployment assessment. The practical advantages are significant: operational data reveals actual impact patterns that pre-deployment testing often misses, and real user feedback provides empirical grounding for impact identification. The limitations are also real: harms that have already occurred cannot be prevented, and the organizational investment in the deployed system creates pressure to rationalize rather than address identified impacts. The assessment team should approach an operational AISIA with explicit acknowledgment of this pressure and ensure that findings about ongoing harms are treated with appropriate urgency for remediation, not just documented."}
},
{
  title:"ISO 42005 and ISO 42001&#8212;The Management System Connection",
  tagline:"How AI impact assessment fits within the AI Management System",
  body:`<p>ISO 42005 and ISO 42001 (AI Management System) are designed as complementary standards&#8212;with ISO 42001 providing the organizational governance structure within which ISO 42005 impact assessments are conducted, and ISO 42005 providing the methodological substance that gives the management system genuine impact governance capability. Understanding how they connect is essential for organizations building comprehensive AI governance.</p>
  <div class="highlight-box"><strong>ISO 42001&#8217;s impact assessment requirements:</strong> ISO 42001 requires organizations to address the impacts of AI systems as part of their AIMS. Specifically, ISO 42001 requires organizations to determine the context of their AI use, assess risks and opportunities from their AI systems, and implement appropriate controls&#8212;all of which benefit from the structured impact assessment methodology that ISO 42005 provides. Organizations with ISO 42001 certification that implement ISO 42005 methodology are demonstrating a more robust approach to AI impact governance than those using only the management system framework.</highlight-box>
  <div class="cheat-grid">
    <div class="cheat-pill"><strong>ISO 42001 as Governance Structure</strong><span>ISO 42001 provides: leadership commitment and accountability for AI governance, policy framework establishing AI principles, risk management process structure, operational controls framework, internal audit and management review mechanisms, and continuous improvement requirements. These governance elements are the organizational infrastructure within which ISO 42005 assessments are conducted, reviewed, acted upon, and improved over time.</span></div>
    <div class="cheat-pill"><strong>ISO 42005 as Substantive Method</strong><span>ISO 42005 provides: structured methodology for comprehensive impact identification (going beyond organizational risk to external affected party impacts), specific techniques for impact analysis and evaluation, requirements for affected party consideration and consultation, lifecycle integration requirements, and documentation standards for impact assessment evidence. Where ISO 42001 creates the governance process, ISO 42005 fills that process with substantive impact assessment content.</span></div>
    <div class="cheat-pill"><strong>The AIMS Policy Connection</strong><span>ISO 42001 requires an AI policy establishing the organization&#8217;s commitments on AI use. ISO 42005 AISIA findings should inform and be consistent with this policy&#8212;an AI policy that commits to avoiding discrimination must be backed by AISIA processes that systematically assess discriminatory impacts and verify that mitigations are effective. The policy commitment without the AISIA methodology is aspiration; with it, it becomes a governed commitment.</span></div>
    <div class="cheat-pill"><strong>The Risk Management Connection</strong><span>ISO 42001 requires risk assessment for AI systems. ISO 23894 provides risk management methodology. ISO 42005 adds the external impact dimension. Together, ISO 42001 + ISO 23894 + ISO 42005 create a comprehensive picture: ISO 23894 addresses what could go wrong for the organization; ISO 42005 addresses what could go wrong for affected parties. The management system (ISO 42001) integrates both into organizational governance.</span></div>
    <div class="cheat-pill"><strong>The Audit and Review Connection</strong><span>ISO 42001 requires internal audit of the AIMS and management review of AI governance performance. AISIA documentation, treatment effectiveness metrics, and monitoring results all constitute evidence for internal audit and management review. The management review should explicitly examine whether AI systems are operating within assessed impact boundaries and whether emerging impacts require assessment updates.</span></div>
    <div class="cheat-pill"><strong>The Continual Improvement Connection</strong><span>ISO 42001&#8217;s PDCA-based continual improvement cycle applies to AISIA processes as well as to the AI systems themselves. Lessons from operational impact monitoring should improve future AISIA methodology. Discovered gaps between predicted and actual impacts should trigger methodology refinement. The AIMS provides the institutional mechanism for this learning and improvement that standalone assessments cannot provide.</span></div>
  </div>`,
  quiz:{q:"An organization has ISO 42001 certification but conducts AISIA as a one-time pre-deployment checklist without the methodology, documentation, or lifecycle integration required by ISO 42005. What risk does this create for their ISO 42001 certification?",opts:["No risk&#8212;ISO 42001 certification does not require ISO 42005 compliance","ISO 42001 requires organizations to address AI system impacts through appropriate processes. An internal audit reviewing the AIMS might find that the impact assessment process is insufficiently robust&#8212;lacking the methodology, documentation, stakeholder consideration, and lifecycle integration that constitute a genuine impact assessment program. This could result in non-conformities against ISO 42001&#8217;s requirements for AI impact governance, even if the organization is not seeking ISO 42005 certification specifically.","ISO 42005 compliance is automatically achieved through ISO 42001 certification","ISO 42001 auditors do not examine impact assessment methodology"],ans:1,explain:"ISO 42001 requires that organizations implement processes for addressing AI system impacts on affected parties&#8212;not just document that they conduct &#8216;impact assessments.&#8217; A certification audit examining impact assessment processes would look for evidence of: systematic identification of affected parties and potential impacts, analysis of impact likelihood and severity, evaluation against established criteria, treatment planning for unacceptable impacts, and ongoing monitoring. A checklist without these elements is a form without the substance ISO 42001 requires. ISO 42005 provides the methodological standard against which impact assessment process quality can be evaluated&#8212;organizations using ISO 42005 methodology have stronger evidence of genuine compliance with ISO 42001&#8217;s impact governance requirements."}
},
{
  title:"ISO 42005 and the EU AI Act",
  tagline:"How international impact assessment standards connect to AI regulation",
  body:`<p>The <span class="key-term">EU AI Act</span> (Regulation 2024/1689, entered into force August 2024) is the world&#8217;s first comprehensive AI regulation, establishing requirements for AI systems deployed in the EU market organized by risk level. ISO 42005 is directly relevant to EU AI Act compliance&#8212;particularly the fundamental rights impact assessment requirements for high-risk AI systems and the conformity assessment processes.</p>
  <div class="highlight-box"><strong>The EU AI Act&#8217;s assessment requirements:</strong><br><br><strong>Prohibited AI systems:</strong> AI systems posing unacceptable risk are prohibited outright (social scoring, real-time biometric surveillance in public spaces, subliminal manipulation). No impact assessment can make these systems compliant&#8212;the prohibition is absolute.<br><br><strong>High-risk AI systems:</strong> AI systems in high-risk categories (biometric identification, critical infrastructure, education, employment, essential services, law enforcement, migration, administration of justice, democratic processes) must undergo conformity assessment before deployment, including technical documentation, human oversight measures, and transparency requirements. Article 29a requires deployers of high-risk AI to conduct Fundamental Rights Impact Assessments (FRIAs).<br><br><strong>General-purpose AI models:</strong> Foundation models above certain capability thresholds face additional requirements for transparency, risk assessment, and adversarial testing.<br><br><strong>Lower-risk AI:</strong> Minimal-risk systems face limited specific requirements, primarily transparency obligations for certain AI interactions.</highlight-box>
  <div class="cheat-grid">
    <div class="cheat-pill"><strong>FRIA and AISIA Alignment</strong><span>The EU AI Act&#8217;s Fundamental Rights Impact Assessment (FRIA) requirement and ISO 42005&#8217;s AISIA methodology are closely aligned. Both require: identification of affected parties, assessment of potential impacts on fundamental rights, analysis of likelihood and severity, identification of mitigation measures, and documentation of findings and decisions. Organizations conducting ISO 42005 AISIAs for high-risk EU AI systems are producing the substance of what a FRIA requires.</span></div>
    <div class="cheat-pill"><strong>AI Act Certification Schemes</strong><span>The EU AI Act anticipates harmonized standards that can be used to demonstrate compliance. ISO standards (including those from ISO/IEC JTC 1/SC 42) are natural candidates for harmonized standard designation. An AI system assessed using ISO 42005 methodology and documented per ISO 42005 requirements may generate a presumption of conformity with corresponding EU AI Act requirements once harmonization is established.</span></div>
    <div class="cheat-pill"><strong>High-Risk Categories Requiring FRIA</strong><span>EU AI Act deployers must conduct FRIAs for AI systems in high-risk categories including: biometric identification, AI in education or vocational training, AI in employment recruitment, AI in essential services (credit, social benefits, emergency services), AI in law enforcement, AI in migration and asylum, AI in administration of justice. ISO 42005 provides the methodological framework for conducting these required assessments.</span></div>
    <div class="cheat-pill"><strong>Documentation for Regulatory Submission</strong><span>EU AI Act requires technical documentation to be maintained and provided to national competent authorities upon request. ISO 42005&#8217;s comprehensive documentation requirements&#8212;process records, impact analysis evidence, evaluation decisions, treatment plans&#8212;produce the documentation trail that regulatory compliance requires. Organizations with ISO 42005-compliant documentation are better positioned to respond to regulatory inquiries.</span></div>
    <div class="cheat-pill"><strong>Beyond EU AI Act Compliance</strong><span>ISO 42005 is designed for global applicability&#8212;not just EU AI Act compliance. Organizations operating in multiple jurisdictions benefit from ISO 42005&#8217;s framework providing a single methodology that can be documented to demonstrate compliance with multiple regulatory requirements simultaneously. The US AI Executive Order, Canada&#8217;s AIDA, the UK&#8217;s AI regulation proposals, and Brazil&#8217;s AI bill all contemplate impact assessment requirements where ISO 42005 provides relevant methodology.</span></div>
    <div class="cheat-pill"><strong>Timeline Considerations</strong><span>EU AI Act obligations apply on a phased timeline: prohibitions from August 2024, GPAI obligations from August 2025, high-risk AI obligations from August 2026. Organizations deploying high-risk AI in the EU who do not have established AISIA processes face increasing regulatory exposure as deadlines approach. ISO 42005 implementation provides the methodology for meeting these requirements systematically rather than as one-off compliance exercises.</span></div>
  </div>`,
  quiz:{q:"A US company uses an AI system for loan approvals that it plans to deploy in EU member states. The AI system falls under the EU AI Act&#8217;s high-risk category (AI in access to essential services). What specific EU AI Act requirement does ISO 42005 most directly address?",opts:["ISO 42005 addresses the EU AI Act&#8217;s technical performance testing requirements","ISO 42005 most directly addresses Article 29a&#8217;s Fundamental Rights Impact Assessment (FRIA) requirement for high-risk AI deployers. The FRIA requires assessment of potential impacts on fundamental rights of affected parties&#8212;precisely what ISO 42005&#8217;s AISIA methodology is designed to conduct. Implementing ISO 42005 for this loan approval AI produces the structured impact assessment documentation that the FRIA requirement anticipates.","ISO 42005 addresses the EU AI Act&#8217;s requirements for AI transparency labels","ISO 42005 is not relevant to EU AI Act compliance"],ans:1,explain:"EU AI Act Article 29a requires deployers of high-risk AI systems to conduct Fundamental Rights Impact Assessments before deployment and to update them when significant changes occur. The FRIA must assess impacts on fundamental rights&#8212;non-discrimination, dignity, privacy, fair trial, access to essential services&#8212;which is precisely the scope of ISO 42005&#8217;s AISIA methodology. A loan approval AI is clearly in the high-risk category (access to essential services). Implementing ISO 42005 for this system produces: systematic affected party identification, impact identification and analysis for fundamental rights dimensions, evaluation against rights-based criteria, and documented treatment plans&#8212;the substance of a FRIA. ISO 42005 may not be formally designated as the harmonized standard for FRIA yet, but it provides the internationally recognized methodological basis for conducting assessments that satisfy the requirement."}
},
{
  title:"ISO 42005 and Privacy Impact Assessments",
  tagline:"The intersection of AI impact assessment and data privacy governance",
  body:`<p>AI systems typically involve significant personal data processing&#8212;training data, inference inputs, and outputs that affect individuals. This means AI impact assessment and privacy impact assessment frequently address overlapping territories. Understanding how ISO 42005 relates to privacy-focused impact assessment standards (ISO 27701, GDPR&#8217;s DPIA, ISO 29134) enables organizations to build integrated assessment programs that address both AI impact and privacy impact without duplication.</p>
  <div class="link-card"><b>ISO 42005 and ISO 27701 (Privacy Information Management)</b><br>ISO 27701 includes requirements for Privacy Impact Assessments (PIAs) as part of the Privacy Information Management System. When AI systems process personal information, both ISO 42005 AISIA and ISO 27701 PIA requirements may apply. The AISIA addresses the full range of AI impacts on affected parties; the PIA specifically addresses privacy impacts of personal information processing. For AI systems with significant personal data dimensions, the two assessments should be integrated&#8212;avoiding duplicate data collection and analysis while ensuring both impact dimensions are comprehensively addressed.</div>
  <div class="link-card"><b>ISO 42005 and GDPR&#8217;s Data Protection Impact Assessment (DPIA)</b><br>GDPR Article 35 requires Data Protection Impact Assessments for processing that is &#8220;likely to result in a high risk to the rights and freedoms of natural persons.&#8221; AI systems processing personal data at scale, using sensitive data categories, or making automated decisions affecting individuals frequently trigger DPIA requirements. ISO 42005 AISIA and GDPR DPIA have complementary scope: the DPIA focuses specifically on personal data processing risks; the AISIA addresses the broader range of AI impacts. Organizations should integrate these assessments to avoid duplication while satisfying both requirements.</div>
  <div class="link-card"><b>ISO 42005 and ISO/IEC 29134 (Privacy Impact Assessment Guidelines)</b><br>ISO 29134 provides general guidance for privacy impact assessments applicable to any information system, not AI-specific. ISO 42005 provides AI-specific impact assessment methodology that encompasses but extends beyond privacy. Organizations conducting AISIA using ISO 42005 for AI systems that also process personal data can use the ISO 29134 framework to ensure comprehensive coverage of privacy-specific dimensions within the broader ISO 42005 assessment.</div>
  <div class="cheat-grid">
    <div class="cheat-pill"><strong>Where AI and Privacy Impact Assessment Overlap</strong><span>Privacy impacts of AI systems are a subset of the broader impact landscape ISO 42005 addresses. Both assessment types examine: unauthorized disclosure of personal information, inference of sensitive attributes, data accuracy impacts, and individual rights in relation to automated decisions. An integrated assessment can address these dimensions once rather than twice in separate processes.</span></div>
    <div class="cheat-pill"><strong>Where AI Impact Assessment Goes Beyond Privacy</strong><span>ISO 42005 AISIA addresses impact dimensions not covered by privacy assessment: discrimination not involving personal data (using proxy data), economic impacts on non-data-subjects, environmental impacts of AI infrastructure, impacts on democratic processes and civic participation, and societal-level structural effects that are not personal data processing impacts. Privacy assessment is a necessary but not sufficient component of AI impact assessment.</span></div>
    <div class="cheat-pill"><strong>Integrated Assessment Design</strong><span>Organizations implementing both ISO 42005 and ISO 27701 (or subject to GDPR DPIA requirements) should design integrated assessment templates that collect relevant information once, analyze it from both AI impact and privacy impact perspectives, and produce coordinated documentation satisfying both standards. Integration reduces assessment burden while ensuring comprehensive coverage.</span></div>
    <div class="cheat-pill"><strong>Sequential vs. Simultaneous Assessment</strong><span>For new AI systems, simultaneous AISIA and privacy impact assessment at design stage is most efficient. For existing AI systems adding ISO 42005 scope, sequencing may be necessary&#8212;using existing privacy assessment documentation as input to the broader AISIA rather than starting from scratch. The key principle is that neither assessment should be reduced to a formality in the interest of integration efficiency.</span></div>
  </div>`,
  quiz:{q:"An organization conducts a GDPR DPIA for an AI recruitment system, finding that automated screening of applicants is &#8216;high risk&#8217; processing requiring specific safeguards. They consider the DPIA to fulfill their impact assessment obligations completely. What important gap remains?",opts:["A GDPR DPIA fully satisfies all impact assessment obligations for AI systems","The DPIA addresses personal data processing risks under GDPR&#8212;an important but partial assessment of the recruitment AI&#8217;s impacts. ISO 42005 AISIA would additionally require: assessment of discriminatory impacts on applicants from protected groups (including discrimination patterns that don&#8217;t depend on personal data processing), examination of impacts on the broader labor market and affected communities, assessment of impacts on applicants who are not EU data subjects, and evaluation of environmental impacts of the AI infrastructure. The DPIA addresses privacy; the AISIA addresses the full impact landscape.","GDPR DPIA requirements are stricter than ISO 42005 and automatically satisfy all requirements","Only one impact assessment type is required for any given AI system"],ans:1,explain:"This distinction is important for GRC professionals advising organizations on AI governance. A GDPR DPIA for an AI recruitment system would address: the lawfulness of automated decision-making under GDPR Article 22, data minimization and purpose limitation for applicant data, security of applicant personal data, and data subject rights in relation to automated decisions. It would not systematically address: discriminatory screening patterns that emerge from model behavior rather than personal data processing (e.g., bias based on patterns in resumes that correlate with protected characteristics), impacts on applicants who are not covered by GDPR, labor market effects of widespread AI recruitment screening, or the environmental footprint of the AI infrastructure. ISO 42005 provides the methodology for this comprehensive assessment that the DPIA does not cover."}
},
{
  title:"High-Risk AI Systems and Enhanced Assessment",
  tagline:"When the stakes require more rigorous impact assessment",
  body:`<p>ISO 42005 applies proportionality to assessment depth&#8212;requiring more rigorous assessment for AI systems with higher potential impacts. Understanding what makes an AI system &#8220;high-risk&#8221; in the ISO 42005 sense, and what enhanced assessment requirements apply to such systems, is essential for calibrating assessment effort appropriately.</p>
  <div class="highlight-box"><strong>High-impact AI characteristics requiring enhanced assessment under ISO 42005:</strong> The following characteristics, individually or in combination, indicate that an AI system warrants more rigorous impact assessment: consequential decisions affecting individuals&#8217; fundamental rights or access to essential services; decisions that are automated without adequate human review; deployment affecting large numbers of individuals; use in contexts where affected parties are particularly vulnerable; decisions with irreversible or difficult-to-reverse consequences; novel AI approaches with uncertain behavior; use in critical infrastructure; deployment in domains with documented AI harm histories; and use by government or public authorities with power asymmetry over affected parties.</highlight-box>
  <div class="cheat-grid">
    <div class="cheat-pill"><strong>Criminal Justice AI</strong><span>Risk assessment tools, predictive policing algorithms, sentencing recommendation AI, and parole recommendation systems are among the highest-stakes AI deployments. They make or influence decisions affecting individuals&#8217; liberty&#8212;among the most fundamental human interests&#8212;often without adequate transparency or meaningful appeal. Enhanced assessment for criminal justice AI requires: deep engagement with affected communities (disproportionately marginalized groups), rigorous fairness analysis disaggregated by protected characteristics, examination of training data encoding historic bias, and assessment of aggregate community impacts.</span></div>
    <div class="cheat-pill"><strong>Healthcare AI</strong><span>Clinical diagnosis AI, treatment recommendation systems, patient triage tools, and healthcare resource allocation AI make or influence decisions affecting health and life. Enhanced assessment must examine: accuracy disparities across patient demographics, impacts of erroneous diagnoses (false positives causing unnecessary treatment; false negatives causing delayed treatment), effects on clinical professional judgment (deskilling, over-reliance), data privacy for sensitive health information, and equity of access across patient populations.</span></div>
    <div class="cheat-pill"><strong>Financial Services AI</strong><span>Credit scoring, insurance pricing, mortgage approval, and investment recommendation AI affect fundamental economic security and opportunity. Enhanced assessment requires: disparate impact analysis across protected characteristics, examination of proxy discrimination mechanisms (using geographic, behavioral, or consumption data that correlates with protected attributes), assessment of cumulative disadvantage effects, consumer transparency about AI use in decisions, and review of appeal mechanisms for affected individuals.</span></div>
    <div class="cheat-pill"><strong>Government and Public Administration AI</strong><span>AI used in benefit determination, immigration processing, tax enforcement, child welfare, and public service delivery combines power asymmetry (individuals have limited ability to challenge government AI decisions) with fundamental rights implications. Enhanced assessment must include: meaningful consultation with affected communities, assessment of digital access barriers creating disparate impacts, examination of appeals processes, and evaluation of constitutional and human rights compliance.</span></div>
    <div class="cheat-pill"><strong>Employment AI</strong><span>Hiring, performance management, promotion, and termination AI affect livelihoods and economic opportunity at scale. Enhanced assessment examines: discriminatory screening patterns across protected characteristics, impacts on worker autonomy and dignity (continuous AI monitoring), transparency to affected workers about AI use in employment decisions, assessment of worker recourse mechanisms, and aggregate labor market effects of widespread AI employment screening.</span></div>
    <div class="cheat-pill"><strong>Large-Scale Generative AI</strong><span>Foundation models and generative AI systems deployed at consumer scale can affect information access, cultural production, democratic discourse, and creative industries at societal scale. Enhanced assessment for large-scale generative AI must examine: disinformation and manipulation potential, intellectual property and cultural harm risks, environmental scale impacts of training and inference at massive scale, and effects on information quality and epistemic autonomy at the societal level.</span></div>
  </div>`,
  quiz:{q:"Why does ISO 42005 require enhanced assessment for AI systems making decisions without adequate human review, even when the AI system has high technical performance?",opts:["Human review always improves AI decisions&#8212;AI alone is inherently less reliable","High technical performance (accuracy, precision, recall) does not eliminate the risk of systematic bias, edge case failures, or contextually inappropriate decisions that human judgment would catch. When AI decisions are fully automated without human review, errors and biases are applied consistently at scale with no individual case review that might catch anomalous decisions. The absence of human oversight also eliminates the accountability mechanism that human decision-makers provide and removes the contextual judgment that allows exceptions to be recognized. Even highly accurate AI systems require enhanced assessment when operating without human review precisely because accuracy is not the only relevant performance dimension.","Enhanced assessment is only required when AI replaces human workers","Fully automated AI systems are actually lower risk because they are consistent"],ans:1,explain:"This answer captures one of ISO 42005&#8217;s most important insights: technical performance metrics (accuracy on a test set) and real-world impact quality are not the same thing. A credit scoring AI that achieves 90% accuracy may still systematically deny credit to qualified applicants from specific demographic groups. A medical AI with excellent average sensitivity may perform significantly worse for certain patient populations. When these systems operate without human review, each error and each systematic bias is applied automatically at scale without any individual case judgment that might catch and correct problematic decisions. Human oversight serves both quality control (catching individual AI errors) and accountability (creating a decision-maker who can be questioned and held responsible). Enhanced assessment for fully automated AI systems is essential precisely because the absence of human review amplifies rather than eliminates AI impact risks."}
},
{
  title:"Common Challenges in AI Impact Assessment",
  tagline:"The obstacles practitioners encounter and how to address them",
  body:`<p>ISO 42005 implementation faces consistent challenges across organizations and AI system types. Recognizing these challenges&#8212;and the approaches that address them effectively&#8212;is essential for building AISIA programs that are both methodologically rigorous and organizationally sustainable.</p>
  <div class="cheat-grid">
    <div class="cheat-pill"><strong>Assessment Theater</strong><span>The most fundamental challenge: organizations conducting the appearance of impact assessment without genuine engagement with potential harms. Signs of assessment theater include: predetermined conclusions that align with deployment decisions already made, impact identification conducted only by the development team rather than including affected community perspectives, assessment documentation that describes intended system behavior rather than examining potential harmful behavior, and treatment plans that are never implemented or monitored. ISO 42005&#8217;s documentation and process requirements help counter assessment theater by creating an auditable trail of genuine engagement.</span></div>
    <div class="cheat-pill"><strong>Scope Capture by Organizational Interests</strong><span>Assessment scope decisions are often made under organizational pressure to minimize what is examined. Limiting affected parties to &#8220;our customers&#8221; when AI decisions affect many non-customers; limiting impact dimensions to those the organization can easily control; and limiting temporal scope to avoid examining long-term systemic effects are all scope capture patterns. ISO 42005&#8217;s requirements for comprehensive affected party identification and explicit scope justification create pressure against these limitations.</span></div>
    <div class="cheat-pill"><strong>Difficulty Involving Affected Communities</strong><span>Genuine affected party consultation is methodologically essential but practically challenging: affected communities may be difficult to identify before deployment, may not trust the organizations assessing AI impacts on them, and may lack the technical background to engage meaningfully without support. Addressing this requires: partnership with community organizations who can facilitate engagement, paying for affected community participation, providing accessible plain-language descriptions of AI systems, and genuinely incorporating feedback rather than using consultation as rubber-stamping.</span></div>
    <div class="cheat-pill"><strong>Quantifying Uncertain Impacts</strong><span>AI impacts are often uncertain&#8212;particularly for novel systems, new use cases, and long-term systemic effects. Assessors face pressure to only assess what can be quantified, leading to underweighting of qualitative, uncertain, and long-term impacts that may be the most significant. ISO 42005 explicitly requires documentation of uncertainty in impact analysis&#8212;acknowledging what is not known is part of a credible assessment, not a failure of methodology.</span></div>
    <div class="cheat-pill"><strong>Organizational Authority to Act on Findings</strong><span>AISIA findings may indicate that a high-priority AI deployment should be delayed, redesigned, or abandoned. Assessors who lack organizational authority to act on such findings face pressure to soften conclusions to avoid conflict with deployment timelines and business priorities. ISO 42005&#8217;s documentation requirements and the principle that assessment criteria be established before assessment begins help protect assessor independence by creating a pre-committed standard against which findings are measured.</span></div>
    <div class="cheat-pill"><strong>Maintaining Assessment Quality at Scale</strong><span>Large organizations may deploy dozens or hundreds of AI systems, making comprehensive AISIA for each resource-intensive. Tiered assessment approaches&#8212;screening assessments to identify systems requiring deep assessment, full AISIA only for high-impact systems&#8212;are appropriate but require clear criteria for tier assignment. Organizations should resist the temptation to apply screening-level assessment to systems that warrant full assessment simply because full assessment is more demanding.</span></div>
  </div>
  <div class="warning-box"><strong>The assessment independence problem:</strong> Impact assessment conducted entirely by the team developing and deploying the AI system faces a fundamental independence challenge&#8212;the assessors have strong incentives (professional investment, career interests, timeline pressures) to reach conclusions supporting deployment. ISO 42005 does not require fully independent assessment but does require transparency about assessor roles and relationships. Organizations with mature AI governance typically establish internal independence mechanisms (AI ethics review boards with authority to challenge deployment decisions) or use external review for high-stakes AI systems.</div>`,
  quiz:{q:"An AISIA team completes a thorough 6-month impact assessment of a high-risk AI system and identifies three significant discriminatory impacts requiring substantial system redesign. The business unit deploying the AI argues that the launch timeline cannot accommodate redesign and proposes documenting the impacts as &#8216;acceptable residual risks&#8217; with a post-launch remediation plan. What should the AISIA team do?",opts:["Agree&#8212;documenting residual risks with remediation plans is a standard impact management approach","Reject this framing: ISO 42005&#8217;s residual risk acceptance requires that residual impacts be evaluated against established assessment criteria&#8212;not against business timeline pressures. If the identified discriminatory impacts exceed established acceptance criteria, they cannot be made acceptable simply by relabeling them as &#8216;residual risks&#8217; and promising post-launch remediation. The appropriate response is: escalate to the organization&#8217;s AI governance authority with the finding that deployment as planned violates impact assessment criteria, document the business pressure on assessment conclusions, and ensure that any deployment decision is made by accountable leadership with full awareness of the impact assessment findings.","Accept the compromise&#8212;post-launch remediation is equivalent to pre-launch mitigation","Impact assessment conclusions are advisory&#8212;the business unit can override them for schedule reasons"],ans:1,explain:"This scenario represents one of the most critical tests of AI impact assessment integrity. If discriminatory impacts that exceed assessment criteria can be recharacterized as &#8216;acceptable residual risks&#8217; whenever deployment timelines are at stake, the assessment process provides no real protection&#8212;it simply creates documentation of a predetermined deployment decision. ISO 42005&#8217;s requirement that evaluation criteria be established before assessment begins is designed precisely to prevent this ex-post rationalization. When assessment findings conflict with deployment plans, the appropriate response is to escalate to organizational leadership who have the authority and accountability to make an informed choice between the business interest and the documented impact risk&#8212;not to accommodate the conflict by softening assessment conclusions."}
},
{
  title:"Building an AISIA Program",
  tagline:"What it takes to make AI impact assessment a sustainable organizational capability",
  body:`<p>Conducting a single ISO 42005 AISIA is a project; building a sustainable AISIA program is an organizational capability. Organizations that treat each AISIA as a standalone exercise miss the institutional benefits of systematic AISIA capability: consistent methodology enabling comparison across AI systems, organizational learning from impact monitoring, efficient assessment processes that do not reinvent methodology for each assessment, and governance integration that makes impact assessment a genuine decision-making input rather than a post-hoc compliance exercise.</p>
  <div class="cheat-grid">
    <div class="cheat-pill"><strong>Phase 1&#8212;AISIA Framework Design</strong><span>Develop the organization&#8217;s AISIA methodology: assessment templates, impact taxonomy, likelihood and severity scales, evaluation criteria, documentation requirements, and the tier system for proportional assessment depth. The framework should be calibrated to the organization&#8217;s AI portfolio&#8212;a healthcare organization&#8217;s high-risk threshold will look different from a consumer technology company&#8217;s. Engage key stakeholders (legal, risk, privacy, affected communities) in framework design to build buy-in and incorporate diverse perspectives.</span></div>
    <div class="cheat-pill"><strong>Phase 2&#8212;AI System Inventory and Triage</strong><span>Inventory all existing AI systems across the organization&#8212;including shadow AI and externally sourced AI models embedded in business processes. Apply the tier system to assign assessment priority: high-impact systems requiring full AISIA first, lower-impact systems on a scheduled assessment timeline. The inventory exercise often reveals AI deployments that organizational leadership was not fully aware of, creating governance visibility where there was opacity.</span></div>
    <div class="cheat-pill"><strong>Phase 3&#8212;Capability Building</strong><span>Develop internal AISIA capability: train assessment practitioners in the AISIA methodology, build relationships with affected community organizations who can support participatory identification, develop technical capability for bias testing and performance disaggregation, and establish the documentation infrastructure for AISIA records. Consider whether external expertise is needed for specialized assessment dimensions (fairness research, environmental impact calculation, human rights assessment).</span></div>
    <div class="cheat-pill"><strong>Phase 4&#8212;Governance Integration</strong><span>Integrate AISIA into AI governance processes: require AISIA completion before AI deployment approval for systems above the relevant tier threshold, include AISIA review in AI governance committee agendas, connect AISIA findings to AI policy updates, and establish escalation paths for AISIA findings that exceed acceptance criteria. Governance integration ensures AISIA is a decision-making input, not an afterthought.</span></div>
    <div class="cheat-pill"><strong>Phase 5&#8212;Monitoring Program</strong><span>Implement operational monitoring for deployed AI systems: define metrics for tracking identified impacts during operation, establish reporting cadences for monitoring data, create incident reporting processes for materialized impacts, and schedule periodic reassessments. The monitoring program connects pre-deployment AISIA predictions to operational reality, enabling both early impact detection and assessment methodology improvement.</span></div>
    <div class="cheat-pill"><strong>Phase 6&#8212;Learning and Improvement</strong><span>Create systematic processes for learning from AISIA experience: compare pre-deployment assessment predictions with operational monitoring findings, identify assessment methodology improvements, update impact taxonomies based on discovered impacts, incorporate new knowledge about AI impacts from research and regulatory guidance, and build an internal case library of AISIA findings that informs future assessments. The AISIA program should be more capable with each assessment cycle.</span></div>
  </div>`,
  quiz:{q:"An organization has conducted five ISO 42005 AISIAs using different methodologies, different evaluation criteria, and different documentation formats for each AI system. What organizational capability gap does this reflect?",opts:["This is appropriate&#8212;different AI systems require completely different assessment approaches","This reflects the absence of an organizational AISIA framework&#8212;standardized methodology, evaluation criteria, documentation standards, and templates that apply consistently across the organization&#8217;s AI systems. Without a framework, each AISIA reinvents the methodology, preventing: comparison of impact profiles across AI systems, organizational learning from assessment experience, consistent accountability for similar impacts in different AI systems, and efficient assessment processes. Building the AISIA program capability (Phase 1) before conducting individual AISIAs creates the institutional infrastructure that makes assessment both efficient and meaningful.","Methodological variation is required by ISO 42005 to account for AI system differences","Only organizations with more than 10 AI systems need standardized AISIA methodology"],ans:1,explain:"Methodological inconsistency across assessments is one of the most common signs of an immature AISIA program. While different AI systems require different assessment focus, the underlying methodology&#8212;how affected parties are identified, how impacts are analyzed, how severity is rated, how evaluation criteria are applied&#8212;should be consistent to enable organizational learning and comparison. An organization that finds a discriminatory impact in one AI system should be able to check whether similar patterns exist in other AI systems using consistent methodology. Ad hoc methodology for each assessment creates an appearance of assessment activity without the institutional learning capability that a genuine AISIA program should provide."}
},
{
  title:"30-Day Review",
  tagline:"Everything we covered&#8212;in one final look",
  body:`<p>You have completed all 30 days of ISO/IEC 42005! Let&#8217;s take a final inventory of what you now know about the international standard for AI System Impact Assessment.</p>
  <div class="tag-header">The Big Picture</div>
  <p>ISO/IEC 42005 is an international standard published in 2025 by ISO/IEC JTC 1, Subcommittee 42 (SC 42) providing requirements and guidance for AI System Impact Assessment (AISIA). It requires organizations to systematically identify, analyze, evaluate, and address the potential impacts of AI systems on individuals, groups, communities, society, and the natural environment. It is the first dedicated international standard for AI impact assessment methodology, complementing ISO 42001 (AI management system) and supporting compliance with the EU AI Act and other AI regulations.</p>
  <div class="tag-header">Five AISIA Components</div>
  <div class="badge-row">
    <span class="badge badge-vio">1. Context Establishment (scope, criteria, methodology)</span>
    <span class="badge badge-vio">2. Impact Identification (all affected parties, all impact dimensions)</span>
    <span class="badge badge-vio">3. Impact Analysis (likelihood &#215; severity, disaggregated)</span>
    <span class="badge badge-vio">4. Impact Evaluation and Treatment (criteria, prioritization, mitigation hierarchy)</span>
    <span class="badge badge-vio">5. Documentation and Communication (auditable records, stakeholder communication)</span>
  </div>
  <div class="tag-header">Impact Dimensions</div>
  <div class="badge-row">
    <span class="badge badge-amber">Individual: privacy, autonomy, discrimination, dignity, safety, economic</span>
    <span class="badge badge-amber">Group: disparate impact, community access, democratic participation</span>
    <span class="badge badge-amber">Societal: labor markets, power concentration, cultural effects</span>
    <span class="badge badge-green">Environmental: energy/carbon, water, hardware/e-waste, biodiversity</span>
  </div>
  <div class="tag-header">Mitigation Hierarchy</div>
  <div class="badge-row">
    <span class="badge badge-vio">1. Elimination (most preferred)</span>
    <span class="badge badge-vio">2. Substitution</span>
    <span class="badge badge-vio">3. Engineering Controls</span>
    <span class="badge badge-vio">4. Administrative Controls</span>
    <span class="badge badge-vio">5. Transparency and Rights Measures (least preferred as sole mitigation)</span>
  </div>
  <div class="tag-header">Framework Relationships</div>
  <div class="badge-row">
    <span class="badge badge-em">ISO 42001 &#8212; AIMS governance structure (AISIA is a key AIMS process)</span>
    <span class="badge badge-em">ISO 23894 &#8212; AI risk management (organizational risk; AISIA addresses external impact)</span>
    <span class="badge badge-blue">EU AI Act &#8212; FRIA requirement for high-risk AI (AISIA provides the methodology)</span>
    <span class="badge badge-rose">ISO 27701 &#8212; Privacy management (privacy PIA integrates with AISIA)</span>
    <span class="badge badge-cyan">NIST AI RMF &#8212; US counterpart with aligned MEASURE function</span>
    <span class="badge badge-slate">ISO 29134 &#8212; General PIA guidelines (privacy dimension of AISIA)</span>
  </div>
  <div class="highlight-box">Hit the green CS button above to access your complete ISO 42005 cheat sheet with all five AISIA components, impact dimensions, the affected party taxonomy, the mitigation hierarchy, key principles, and framework relationships in one comprehensive reference.</div>`,
  quiz:{q:"What single principle most distinguishes the ISO 42005 AISIA approach from traditional organizational risk management?",opts:["ISO 42005 uses quantitative analysis while risk management is qualitative","ISO 42005 centers the perspective of affected parties external to the organization&#8212;examining what AI systems do to people who may have no relationship with the deploying organization. Traditional risk management centers the organization&#8217;s own interests and risk tolerance. This fundamental orientation difference means AISIA surfaces impacts that internal risk management was not designed to identify.","ISO 42005 applies only to AI while risk management applies to all technologies","ISO 42005 requires external certification while risk management is self-assessed"],ans:1,explain:"The affected party orientation is ISO 42005&#8217;s most fundamental and distinctive feature. Risk management frameworks ask &#8216;what could go wrong for our organization?&#8217;; impact assessment asks &#8216;what could we be doing to other people?&#8217; These are fundamentally different questions producing fundamentally different analyses. A credit scoring AI that efficiently reduces default risk for the lender while systematically denying credit to qualified applicants from protected groups is a risk management success and an impact assessment failure&#8212;and only the impact assessment framework reveals the problem. This external orientation is what makes ISO 42005 a genuinely novel contribution to AI governance rather than a rebranding of existing risk management approaches."}
