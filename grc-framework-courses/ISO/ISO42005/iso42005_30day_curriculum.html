  <div class="top-bar">

      <h1>ISO/IEC 42005 &#8212; 30-Day Classroom Guide</h1>
      <p>Taught for high school freshmen by a 20-year GRC veteran</p>
    </div>
    <div class="nav-row">
      <button id="prevBtn" onclick="changeDay(-1)">&#8592; Prev</button>

  </div>

<script>
const days = [
{
  title:"What Is ISO/IEC 42005?",
  tagline:"The international standard for assessing the real-world impacts of AI systems",
  body:`<p>Artificial intelligence systems are making consequential decisions affecting millions of people every day&#8212;approving or denying loans, screening job applicants, flagging social media content, triaging patients in hospital systems, recommending criminal sentencing, and predicting who might need child welfare services. Each of these decisions has real impacts on real people. Some of those impacts are positive: faster decisions, more consistent treatment, broader access to services. Others may be harmful: discriminatory outcomes, loss of privacy, erosion of human autonomy, or environmental costs from energy-intensive AI operations. The question is: how do we systematically identify, evaluate, and address those impacts before they cause harm? The international answer is <span class="key-term">ISO/IEC 42005</span>.</p>
  <p>ISO/IEC 42005 is an international standard titled <strong>&#8220;Information Technology &#8212; Artificial Intelligence &#8212; AI System Impact Assessment.&#8221;</strong> Published in <strong>2025</strong> by ISO/IEC Joint Technical Committee 1 (JTC 1), Subcommittee 42 (SC 42)&#8212;the same committee responsible for ISO 42001 and the broader family of AI governance standards. ISO 42005 provides requirements and guidance for conducting structured, systematic impact assessments of AI systems across their full lifecycle.</p>
  <div class="analogy-box"><strong>Real-world analogy:</strong> Think of ISO 42005 like the environmental impact assessment (EIA) process required before a major construction project can proceed. Before building a new highway, dam, or industrial facility, developers must assess: what species and habitats will be affected, what communities will experience disruption, what the downstream water quality implications are, and what long-term environmental consequences are likely. The EIA forces developers to see the full picture of consequences&#8212;not just the intended benefits&#8212;before construction begins. ISO 42005 does the same for AI systems: requiring organizations to systematically assess what impacts their AI will have on people, communities, society, and the environment before and during deployment.</div>
  <div class="highlight-box">Key facts about ISO/IEC 42005: International standard published by ISO/IEC JTC 1, Subcommittee 42 (SC 42). Published 2025. Provides requirements and guidance for AI System Impact Assessment (AISIA). Addresses impacts on individuals, groups, communities, society, and the natural environment. Designed to work alongside ISO 42001 (AI management system), ISO 23894 (AI risk management), and the broader AI governance ecosystem. Supports compliance demonstration for the EU AI Act and other AI regulations requiring impact assessment. The first dedicated international standard for AI impact assessment methodology.</div>`,
  quiz:{q:"What makes ISO 42005 historically distinctive compared to earlier AI standards like ISO 42001?",opts:["ISO 42005 is the first AI standard to address cybersecurity of AI systems","ISO 42005 is the first dedicated international standard specifically providing requirements and methodology for assessing the real-world impacts of AI systems on individuals, groups, society, and the environment&#8212;moving beyond internal organizational risk management to require explicit examination of external harms","ISO 42005 is the first AI standard published by ISO/IEC","ISO 42005 provides the first international definition of artificial intelligence"],ans:1,explain:"ISO 42005&#8217;s historical significance lies in its focus on external impact assessment&#8212;examining what AI systems do to the world outside the deploying organization. Earlier AI standards addressed internal concerns: ISO 42001 addresses how organizations manage AI internally; ISO 23894 addresses risk management for AI systems; ISO 24028 addresses AI trustworthiness overview. ISO 42005 specifically requires organizations to examine and document the actual impacts their AI systems have on affected parties&#8212;including individuals who may never interact with the organization deploying the AI but are affected by its decisions."}
},
{
  title:"Why Was ISO 42005 Created?",
  tagline:"The AI impact gap that demanded an international standard",
  body:`<p>By the early 2020s, AI systems had transitioned from research curiosities to infrastructure powering consequential decisions in healthcare, finance, criminal justice, employment, and public services. High-profile AI harms had documented real consequences for real people. Regulators worldwide were moving toward mandatory AI impact assessment requirements. But there was no internationally recognized, methodologically rigorous standard for how to conduct such an assessment. ISO 42005 was created to fill this critical gap.</p>
  <div class="highlight-box"><strong>The convergence of forces driving ISO 42005:</strong><br><br><strong>Documented AI harms:</strong> Facial recognition systems with higher error rates for darker-skinned faces, predictive policing algorithms amplifying historic discriminatory patterns, hiring algorithms screening out qualified candidates based on proxies for protected characteristics, healthcare allocation tools underestimating Black patients&#8217; pain, and credit scoring systems with disparate impacts across demographic groups. Each of these demonstrated that AI harms are not hypothetical&#8212;they are real, measurable, and sometimes catastrophic for affected individuals.<br><br><strong>Regulatory momentum:</strong> The EU AI Act (2024) requires conformity assessments and fundamental rights impact assessments for high-risk AI systems. The US AI Executive Order (2023) directed agencies to assess AI risks. Canada, the UK, and numerous other jurisdictions created AI assessment frameworks. Without an international standard, each regulatory framework was developing its own approach&#8212;creating compliance fragmentation for multinational organizations.<br><br><strong>The risk management gap:</strong> Existing risk management approaches (ISO 23894, NIST AI RMF) addressed risks from the deploying organization&#8217;s perspective. But AI impact is often most severe for people who are not the organization&#8217;s customers&#8212;people about whom decisions are made, who may have no relationship with and no recourse against the deploying organization. Standard risk management frameworks were not designed to center the perspective of affected parties external to the organization.<br><br><strong>The practitioner need:</strong> Organizations wanting to assess AI impacts responsibly had no methodological reference. What questions should an AI impact assessment ask? What data should it collect? Who should be involved? What makes an assessment credible? ISO 42005 answers all of these questions with international consensus methodology.</div>
  <div class="analogy-box"><strong>The medical clinical trial analogy:</strong> Before a new drug can be prescribed to patients, it must go through clinical trials demonstrating that benefits outweigh harms across the intended population. No regulatory body accepts a pharmaceutical company&#8217;s self-assessment that their drug is safe&#8212;structured, independent assessment against established methodology is required. ISO 42005 begins the same journey for AI systems: establishing that deploying organizations must conduct structured assessments of potential harms before and during deployment, not simply assert that their systems are beneficial.</div>`,
  quiz:{q:"What critical limitation of existing AI risk management frameworks (like ISO 23894) does ISO 42005 specifically address?",opts:["Existing frameworks were too complex for small organizations to implement","Existing frameworks primarily addressed risks to the deploying organization rather than impacts on individuals and communities who are affected by AI decisions but may have no relationship with the deploying organization. ISO 42005 specifically centers the perspective of affected parties external to the organization.","Existing frameworks did not address technical AI performance metrics","Existing frameworks were only applicable to healthcare AI systems"],ans:1,explain:"This is the key conceptual gap that ISO 42005 addresses. Organizational risk management asks: what could go wrong for our organization? AI impact assessment asks: what could go wrong for the people our AI affects? These are fundamentally different questions with different methodologies and different answers. A credit scoring AI might present minimal organizational risk (the lender is well-protected) while creating severe individual impact (applicants facing discriminatory denial of loans). Standard risk management frameworks would not identify the latter as a significant risk; ISO 42005&#8217;s impact assessment framework is specifically designed to identify it."}
},
{
  title:"The AI Standards Ecosystem&#8212;Where ISO 42005 Fits",
  tagline:"Understanding the family of AI standards that ISO 42005 works within",
  body:`<p>ISO 42005 does not exist in isolation&#8212;it is part of a growing international ecosystem of AI standards developed by ISO/IEC JTC 1/SC 42. Understanding how ISO 42005 relates to ISO 42001, ISO 23894, ISO 24028, and the broader AI governance landscape is essential for implementing it effectively and for understanding how it connects to AI regulation.</p>
  <div class="highlight-box"><strong>The ISO/IEC JTC 1/SC 42 AI standards family:</strong><br><br><strong>ISO/IEC 22989 &#8212; AI Concepts and Terminology:</strong> The vocabulary standard defining fundamental AI terms used across all SC 42 standards. Understanding ISO 42005 begins with ISO 22989&#8217;s definitions.<br><br><strong>ISO/IEC 23894 &#8212; AI Risk Management:</strong> Guidance on how to manage risks in AI systems from the organization&#8217;s perspective. ISO 42005 complements 23894 by focusing on impacts on external affected parties&#8212;the two standards work together to create a comprehensive risk and impact picture.<br><br><strong>ISO/IEC 24028 &#8212; Overview of Trustworthiness in AI:</strong> Conceptual overview of AI trustworthiness dimensions: accuracy, robustness, reliability, security, resilience, privacy, fairness, transparency, and accountability. ISO 42005 impact assessment examines how an AI system performs across these trustworthiness dimensions from affected parties&#8217; perspective.<br><br><strong>ISO/IEC 42001 &#8212; AI Management System (AIMS):</strong> The certifiable management system standard for governing AI across the organization. ISO 42005 impact assessment is a key process within an ISO 42001 AIMS&#8212;the management system provides the governance structure; the impact assessment provides the systematic evaluation of AI&#8217;s real-world effects.<br><br><strong>ISO/IEC 42005 &#8212; AI System Impact Assessment:</strong> The focus of this curriculum. Provides requirements and guidance for conducting structured AISIA assessments, identifying and evaluating impacts on all affected parties.<br><br><strong>ISO/IEC 42006 &#8212; AI System Life Cycle Processes:</strong> Addresses how AI systems are developed, deployed, and maintained. ISO 42005 impact assessment should be integrated into the lifecycle processes described in 42006.</div>
  <div class="cheat-grid">
    <div class="cheat-pill"><strong>The NIST AI RMF Connection</strong><span>NIST&#8217;s AI Risk Management Framework (AI RMF 1.0, 2023) provides a US-centric voluntary framework for AI risk management across the GOVERN, MAP, MEASURE, and MANAGE functions. ISO 42005 and the NIST AI RMF address similar goals&#8212;systematic assessment of AI impacts&#8212;with compatible methodologies. Organizations operating under both can build integrated programs where ISO 42005 assessments satisfy NIST AI RMF measurement requirements.</span></div>
    <div class="cheat-pill"><strong>The EU AI Act Connection</strong><span>The EU AI Act (2024) requires conformity assessments and fundamental rights impact assessments for high-risk AI systems under Article 10 and Article 29a. ISO 42005 provides a recognized international methodology for conducting these assessments. ISO 42005-based impact assessments can serve as structured evidence of compliance with EU AI Act assessment requirements.</span></div>
  </div>
  <div class="analogy-box"><strong>The ISO 42000s family as a complete AI governance architecture:</strong> Think of the ISO 42000s family like the architectural drawings for a building. ISO 22989 is the legend&#8212;the vocabulary defining every term. ISO 42001 is the structural drawings&#8212;the management system that holds everything together. ISO 23894 is the load-bearing analysis&#8212;risk management ensuring the structure can bear organizational risk. ISO 42005 is the environmental impact study&#8212;assessing how the building affects everyone around it. Together, they create a complete picture: internal governance AND external impact.</div>`,
  quiz:{q:"An organization has ISO 42001 certification (AI Management System). Their lead AI engineer says &#8216;We already do risk management under ISO 23894&#8212;we don&#8217;t need ISO 42005.&#8217; What important gap does this reasoning miss?",opts:["ISO 42005 replaces ISO 23894 for AI risk management","ISO 23894 manages risks from the organization&#8217;s perspective. ISO 42005 assesses impacts on people outside the organization who are affected by AI decisions&#8212;a fundamentally different question requiring different methodology. An organization can have excellent internal risk management while its AI causes significant harm to affected communities. Both perspectives are necessary.","ISO 42005 is only required for EU organizations","ISO 23894 already covers all impact assessment requirements"],ans:1,explain:"ISO 23894 and ISO 42005 address complementary but distinct questions. Risk management (23894) asks: what could go wrong for our organization&#8217;s operations, reputation, and objectives? Impact assessment (42005) asks: what are we doing to the people our AI affects? A hiring algorithm might pose minimal organizational risk (the company is protected by terms of service) while screening out qualified candidates from protected groups at high rates&#8212;a significant external impact that internal risk management would not necessarily identify. ISO 42005&#8217;s explicit focus on external affected parties fills the gap that risk management frameworks were not designed to address."}
},
{
  title:"Core Concepts&#8212;AI Systems and the Parties They Affect",
  tagline:"Building the vocabulary that makes meaningful impact assessment possible",
  body:`<p>Before conducting an AI System Impact Assessment, practitioners need a clear conceptual framework for understanding what AI systems are, who they affect, and what kinds of effects count as &#8220;impacts.&#8221; ISO 42005 builds on the foundational vocabulary of ISO 22989 (AI Concepts and Terminology) to establish the concepts that make systematic impact assessment possible.</p>
  <div class="highlight-box"><strong>What counts as an &#8220;AI system&#8221; under ISO 42005:</strong> Following ISO 22989&#8217;s definition, an AI system is a machine-based system that, for a given set of objectives, makes predictions, recommendations, decisions, or content influencing real or virtual environments. This broad definition encompasses: supervised machine learning classification systems, generative AI producing text, images, or code, reinforcement learning systems making sequential decisions, large language models deployed in organizational workflows, hybrid systems combining AI with traditional software, and AI embedded within larger systems and products. The breadth is deliberate&#8212;impact assessment requirements apply wherever AI is influencing consequential decisions.</highlight-box>
  <div class="cheat-grid">
    <div class="cheat-pill"><strong>AI Provider</strong><span>The organization that develops and makes an AI system available for use. The provider may build the AI from scratch, fine-tune a foundation model, or deploy a pre-built model. Providers have significant influence over the AI system&#8217;s design, training data, and capabilities&#8212;and bear substantial responsibility for impacts that are inherent in the system&#8217;s design.</span></div>
    <div class="cheat-pill"><strong>AI Deployer</strong><span>The organization that deploys an AI system provided by another party, or deploys their own AI system, in a specific operational context. Deployers determine the use case, the affected population, and the decision stakes. Many organizations are both providers and deployers. Deployers are often closest to the affected parties and bear primary responsibility for deployment-context impacts.</span></div>
    <div class="cheat-pill"><strong>Directly Affected Parties</strong><span>Individuals and groups who are directly subject to AI decisions, recommendations, or outputs. Job applicants screened by a hiring AI, patients triaged by a medical AI, loan applicants assessed by a credit AI. These parties experience the AI&#8217;s outputs directly&#8212;their decisions are shaped or made by the system. They are the primary focus of impact assessment.</span></div>
    <div class="cheat-pill"><strong>Indirectly Affected Parties</strong><span>Individuals, communities, or society more broadly who experience AI impacts without being direct subjects. The family members of someone denied parole by an AI risk assessment; the communities affected by AI-driven content moderation that shapes public discourse; workers whose industry is disrupted by AI automation. ISO 42005 requires considering these indirect impacts explicitly.</span></div>
    <div class="cheat-pill"><strong>AI Operators</strong><span>Individuals who use AI systems in professional contexts to perform their work&#8212;radiologists using AI-assisted diagnostics, loan officers using AI credit scoring, customer service representatives using AI-generated responses. Operators can experience impacts themselves (deskilling, job loss, liability for AI errors) and mediate impacts on affected parties.</span></div>
    <div class="cheat-pill"><strong>Broader Ecosystem Parties</strong><span>Organizations, institutions, and societal structures that experience systemic impacts from AI deployment at scale. Journalism disrupted by generative AI content. Electoral systems affected by AI-generated misinformation. Labor markets reshaped by AI automation. Cultural heritage affected by AI trained on protected works. ISO 42005 requires consideration of these broader systemic impacts.</span></div>
  </div>`,
  quiz:{q:"An AI system is deployed by a bank to automate mortgage approvals. An individual applies for a mortgage and is rejected. Which parties are &#8216;directly affected&#8217; and which are &#8216;indirectly affected&#8217; according to ISO 42005 concepts?",opts:["Only the bank is affected&#8212;applicants consent to AI assessment by applying","Directly affected: the mortgage applicant (directly subject to the AI&#8217;s approval/rejection decision). Indirectly affected: the applicant&#8217;s family who will not have the home, the neighborhoods that experience different housing access patterns due to AI lending patterns, and potentially entire communities if the AI systematically denies loans in certain areas (redlining-equivalent effects). ISO 42005 requires assessing both direct and indirect impacts.","Only the mortgage applicant is affected&#8212;the bank bears all organizational risk","The bank and the applicant are equally affected"],ans:1,explain:"ISO 42005 distinguishes between direct and indirect impacts because both matter for comprehensive assessment. The mortgage applicant is directly affected&#8212;the AI decision directly determines whether they can purchase a home. But the impacts extend further: the applicant&#8217;s household loses housing stability, the community may lose a resident, and at scale, systematic patterns in AI mortgage decisions can replicate or amplify historic discriminatory lending patterns (redlining) with discriminatory community effects. An impact assessment that only examines the direct applicant relationship misses these broader societal dimensions that ISO 42005 explicitly requires."}
},
{
  title:"The AISIA Framework&#8212;What ISO 42005 Requires",
  tagline:"The structure and requirements of an AI System Impact Assessment",
  body:`<p>An <span class="key-term">AI System Impact Assessment (AISIA)</span> under ISO 42005 is not a checklist or a form&#8212;it is a structured, evidence-based process for systematically identifying, analyzing, evaluating, and addressing the potential impacts of an AI system on all affected parties. Understanding the AISIA framework&#8212;what it requires, how it is organized, and what it produces&#8212;is the foundation of ISO 42005 implementation.</p>
  <div class="highlight-box"><strong>The AISIA is distinguished from simpler assessments by its:</strong><br><br><strong>Comprehensiveness:</strong> Requires consideration of all types of impacts (individual, group, societal, environmental) rather than focusing only on the organization&#8217;s interests or specific regulatory requirements.<br><br><strong>External perspective:</strong> Centers the experiences of affected parties rather than the deploying organization&#8217;s risk tolerance, explicitly including parties who may have no voice in the assessment process.<br><br><strong>Lifecycle integration:</strong> Applies throughout the AI system lifecycle&#8212;initial assessment before deployment, ongoing assessment during operation, and reassessment when systems or contexts change.<br><br><strong>Documentation and accountability:</strong> Requires documented evidence of assessment activities, findings, mitigation decisions, and residual impacts&#8212;creating an auditable record of organizational decision-making about AI impacts.<br><br><strong>Proportionality:</strong> Assessment depth should be proportionate to the significance of potential impacts&#8212;AI systems making minor recommendations require lighter assessment than AI systems making high-stakes decisions about individuals&#8217; freedom, health, or financial security.</highlight-box>
  <p>The five core components of an AISIA under ISO 42005:</p>
  <div class="step-card"><b>Component 1&#8212;Context Establishment</b><br>Define the AI system being assessed, the context of its use, the assessment scope, the stakeholders involved, and the criteria for evaluating impacts. This foundational component ensures the assessment is properly scoped and its findings will be meaningful and actionable.</div>
  <div class="step-card"><b>Component 2&#8212;Impact Identification</b><br>Systematically identify all potential impacts the AI system could have on all affected parties. This requires structured methods to surface impacts that may not be immediately obvious&#8212;particularly impacts on vulnerable groups, indirect impacts, and long-term systemic effects.</div>
  <div class="step-card"><b>Component 3&#8212;Impact Analysis</b><br>Analyze each identified impact for its likelihood of occurrence and its severity if it occurs. This analysis considers both the nature of the impact (reversible vs. irreversible, localized vs. widespread) and the characteristics of affected parties (including their vulnerability and capacity to respond).</div>
  <div class="step-card"><b>Component 4&#8212;Impact Evaluation and Treatment</b><br>Evaluate identified impacts against the assessment criteria established in Component 1. Determine which impacts require treatment (mitigation), which are acceptable, and which may require escalation or decision to not deploy the system. Document all decisions and their rationale.</div>
  <div class="step-card"><b>Component 5&#8212;Documentation and Communication</b><br>Produce and maintain assessment documentation, communicate findings to relevant stakeholders, and establish processes for ongoing monitoring and reassessment as the AI system operates and its context evolves.</div>`,
  quiz:{q:"An organization conducts an AISIA before launching an AI hiring tool, identifies several potential biases, implements some mitigation measures, and then considers the assessment complete. Under ISO 42005, what critical element of the AISIA framework has been omitted?",opts:["Nothing is missing&#8212;completing the pre-deployment assessment satisfies ISO 42005","The lifecycle integration requirement has been omitted. ISO 42005 requires ongoing assessment during operation, not just a one-time pre-deployment assessment. Mitigations may not work as intended; bias patterns may emerge with real-world applicant data that were not evident in testing; the context of use may change. The AISIA must continue through the AI system&#8217;s operational life with regular reassessment, not conclude at deployment.","Only the documentation component is missing","The organization should have involved external auditors in the initial assessment"],ans:1,explain:"ISO 42005&#8217;s lifecycle integration requirement is one of its most important features distinguishing it from simpler pre-deployment checklists. AI systems&#8217; real-world behavior often differs from their designed behavior once exposed to actual operational data and conditions. Bias that was not detectable in training data may emerge in production. Adversarial actors may exploit AI systems in ways that create harms not anticipated pre-deployment. Organizational context may change in ways that alter impact profiles. ISO 42005 requires ongoing assessment and reassessment throughout the operational lifecycle&#8212;the initial assessment is the beginning, not the end, of the impact assessment process."}
},
{
  title:"Scoping an AI System Impact Assessment",
  tagline:"Defining what the assessment covers and how deep it goes",
  body:`<p>The <span class="key-term">scope</span> of an AI System Impact Assessment determines what is included and excluded from the assessment, which affected parties are considered, which impact dimensions are examined, and how deeply each dimension is analyzed. Scoping is the most consequential decision in assessment design&#8212;a scope that is too narrow will miss critical impacts; a scope that is too broad may produce an assessment so comprehensive that it is never completed or acted upon.</p>
  <div class="highlight-box"><strong>ISO 42005&#8217;s proportionality principle for scoping:</strong> The depth and breadth of an AISIA should be proportionate to the significance of the AI system&#8217;s potential impacts. Factors indicating higher-impact AI systems that require deeper assessment include: decisions affecting legal rights or access to essential services, large numbers of affected individuals, irreversible or difficult-to-reverse decisions, decisions affecting vulnerable populations, novel technology with uncertain behavior, and deployment in high-stakes domains (healthcare, criminal justice, financial services, public benefit programs).</highlight-box>
  <div class="cheat-grid">
    <div class="cheat-pill"><strong>AI System Scope</strong><span>Which AI system(s) are being assessed? If assessing a complex system that includes multiple AI components, the scope must specify whether each component is assessed individually, whether the integrated system is assessed holistically, or both. The system scope also defines which version of the AI system is being assessed and how changes will be managed.</span></div>
    <div class="cheat-pill"><strong>Deployment Context Scope</strong><span>Where and how will the AI system be used? The same AI model may have very different impact profiles in different deployment contexts. A general-purpose large language model deployed for creative writing assistance has different impact implications than the same model deployed to provide medical advice or legal guidance. Context definition includes: intended use, operational setting, and foreseeable misuse.</span></div>
    <div class="cheat-pill"><strong>Affected Party Scope</strong><span>Which parties are in scope for the assessment? Directly affected subjects, indirectly affected communities, operators, third parties, and broader societal impacts may all be relevant. The scope decision determines whose impacts will be systematically examined. Exclusions must be justified&#8212;not just convenient. Vulnerable groups and marginalized communities must be explicitly considered in scope decisions.</span></div>
    <div class="cheat-pill"><strong>Impact Dimension Scope</strong><span>Which categories of impact will be assessed? Individual impacts (privacy, autonomy, discrimination, dignity), group impacts (differential treatment across demographic groups, community effects), societal impacts (democratic processes, labor markets, power dynamics), and environmental impacts (energy consumption, resource use, e-waste). Comprehensive assessment typically addresses all dimensions; proportional assessment may prioritize dimensions most relevant to the specific AI system.</span></div>
    <div class="cheat-pill"><strong>Temporal Scope</strong><span>What time horizon is the assessment considering? Short-term impacts (immediate effects of AI decisions) may be relatively predictable; medium-term impacts (effects as the AI system scales and becomes embedded in workflows) are more uncertain; long-term systemic impacts (effects on social structures, power dynamics, and institutional behaviors over years) are highly uncertain. ISO 42005 requires consideration of reasonably foreseeable impacts across relevant time horizons.</span></div>
    <div class="cheat-pill"><strong>Assessment Depth</strong><span>How rigorously will each identified impact be analyzed? Depth options include: screening-level assessment (identifying whether an impact exists), detailed qualitative analysis (examining nature and mechanism of impact), quantitative analysis (measuring magnitude and prevalence), and participatory assessment (involving affected parties in evaluating impacts). Higher-stakes AI systems require greater assessment depth.</span></div>
  </div>`,
  quiz:{q:"An organization scopes an AISIA for their AI-powered content moderation system to assess only impacts on the platform&#8217;s registered users. A researcher later demonstrates that the system systematically suppresses political speech from minority communities, affecting their civic participation. What scoping failure occurred?",opts:["The scope was appropriate&#8212;registered users are the primary affected party for a content moderation system","The affected party scope was too narrow. Content moderation impacts extend beyond registered users to: people seeking information about political events, journalists covering moderated communities, political organizations whose members are moderated, and democratic processes more broadly affected by systematic suppression of certain political speech. ISO 42005 requires considering all affected parties, not just direct users, and specifically flags effects on democratic processes as a societal impact dimension requiring assessment.","The scope should have been limited to privacy impacts only","Content moderation systems are exempt from impact assessment requirements"],ans:1,explain:"This scoping failure is common in platform AI assessments&#8212;focusing only on the organization&#8217;s registered user base while missing the broader societal impacts of content moderation decisions. Political speech moderation affects non-users who are seeking information (their access to political discourse), journalists covering moderated communities (their ability to report), and democratic institutions (civic participation patterns). ISO 42005 specifically identifies democratic processes as a societal impact dimension requiring assessment. A scope limited to &#8216;registered users&#8217; for a content moderation system is a classic example of scope too narrow to capture the most significant societal impacts."}
},
{
  title:"Identifying Stakeholders and Affected Parties",
  tagline:"Systematically mapping everyone who has a stake in the AI system&#8217;s outcomes",
  body:`<p>Comprehensive <span class="key-term">stakeholder and affected party identification</span> is the foundation of a meaningful AISIA. An assessment can only examine impacts on parties who have been identified as relevant&#8212;parties missed in identification will have their impacts unexamined and potentially unaddressed. ISO 42005 requires systematic, documented processes for identifying the full range of parties with interests in or potential impacts from an AI system.</p>
  <div class="highlight-box"><strong>Why systematic identification is necessary:</strong> Human tendency is to think first of the most salient, visible, and vocal stakeholders&#8212;direct customers, business partners, and regulatory bodies. AI impacts frequently fall most severely on less visible, less powerful parties: vulnerable individuals facing automated adverse decisions, marginalized communities experiencing systemic bias, people who are subjects of AI decisions but not customers, and future generations affected by AI-driven environmental change. ISO 42005&#8217;s identification requirements push assessors beyond the obvious to the overlooked.</highlight-box>
  <p>A systematic stakeholder and affected party identification process for AISIA:</p>
  <div class="step-card"><b>Step 1&#8212;Functional Role Mapping</b><br>Map all parties by their functional relationship to the AI system: providers (who built it), deployers (who operates it), operators (who uses it in their work), direct subjects (who are assessed or decided about by it), and indirect affected parties (who experience consequences without direct interaction). Starting with functional roles ensures systematic coverage.</div>
  <div class="step-card"><b>Step 2&#8212;Domain-Specific Party Analysis</b><br>For the specific domain of deployment, identify parties typical to that domain. Healthcare AI: patients, caregivers, clinicians, payers, regulators. Hiring AI: job applicants, employees, hiring managers, labor market participants. Criminal justice AI: defendants, victims, court officials, communities, law enforcement. Domain knowledge drives identification of parties specific to the use case.</div>
  <div class="step-card"><b>Step 3&#8212;Vulnerability Assessment</b><br>For each identified party, assess whether they may be particularly vulnerable to AI impacts. Vulnerability factors include: power asymmetry (parties with less power to challenge or refuse AI decisions), information asymmetry (parties who don&#8217;t know they are being assessed by AI), economic vulnerability (parties for whom adverse decisions have severe consequences), marginalization (parties already experiencing systemic discrimination), and limited recourse (parties who lack effective remedies for AI harms).</div>
  <div class="step-card"><b>Step 4&#8212;Temporal Party Analysis</b><br>Consider how the affected party landscape may change over time. Early adopters may be different from mass-market users; as AI deployment scales, new affected communities may emerge. Assess who will be affected as the system operates at scale, not just in early limited deployment.</div>
  <div class="step-card"><b>Step 5&#8212;Participatory Identification</b><br>Where feasible, involve affected communities in the identification process itself. Representatives of likely affected communities often identify impacts and affected parties that assessors from outside those communities miss. Participatory identification is both ethically appropriate and methodologically superior to purely expert-driven identification.</div>
  <div class="analogy-box"><strong>The traffic impact assessment analogy:</strong> When a city plans a major new road, traffic impact assessment identifies not just motorists on the new road but: pedestrians whose crossing patterns will change, cyclists who will face new hazards, residents on roads with redirected traffic, businesses whose delivery access will change, and emergency services whose response routes will be affected. The assessment is comprehensive because road impacts extend to everyone in the affected area, not just intended road users. AI impact assessment requires the same comprehensive identification.</div>`,
  quiz:{q:"An AISIA team for a predictive policing AI identifies the following stakeholders: police department leadership, patrol officers, IT staff maintaining the system, and criminal justice researchers. What critical party categories have been omitted?",opts:["The assessment team is comprehensive&#8212;these cover all relevant stakeholders","Multiple critical categories are omitted: (1) the communities being policed&#8212;the people about whom predictions are made, who face heightened police contact based on AI outputs; (2) individuals directly subject to AI-driven enforcement actions; (3) civil rights organizations representing affected communities; (4) defense attorneys and public defenders who will encounter AI-driven prosecutions; and (5) communities historically overpoliced who bear disproportionate risks from prediction errors. Identifying only the deploying organization&#8217;s staff and researchers omits the primary affected parties.","Criminal justice systems are exempt from stakeholder identification requirements","External stakeholders should only be identified after the AI is deployed"],ans:1,explain:"This stakeholder identification failure is significant because it entirely omits the parties most affected by the predictive policing AI&#8212;the communities and individuals subject to AI-driven policing decisions. ISO 42005 requires centering the affected parties&#8217; perspectives, not just the deploying organization&#8217;s internal stakeholders. Predictive policing systems have well-documented histories of encoding racial bias from historic arrest data, and the communities affected&#8212;disproportionately communities of color&#8212;are the most important parties for impact assessment. An assessment that only identifies police department staff and researchers will not examine the most significant impacts of the system."}
},
{
  title:"Impact Identification Methods",
  tagline:"Structured techniques for surfacing what AI systems actually do to people",
  body:`<p>Once stakeholders and affected parties are identified, the AISIA must systematically identify the potential impacts those parties may experience. <span class="key-term">Impact identification</span> is a creative and analytical challenge&#8212;requiring techniques that go beyond obvious, intended effects to surface unintended consequences, edge cases, and systemic effects that may only become apparent at scale or over time.</p>
  <div class="highlight-box"><strong>The identification challenge:</strong> AI impacts are often non-obvious for several reasons: AI systems behave differently in deployment than in testing; impacts emerge from interactions between AI outputs and human responses; impacts may only be visible at population scale rather than individual level; impacts may fall on parties not anticipated during design; and impacts may take months or years to manifest. ISO 42005 requires structured identification methods that push beyond obvious impacts to capture this full range.</highlight-box>
  <div class="cheat-grid">
    <div class="cheat-pill"><strong>Use Case Analysis</strong><span>Systematically map all intended use cases and reasonably foreseeable uses and misuses of the AI system. For each use case, identify: who is affected, what decision or action the AI enables, what could go wrong, and what the consequences of error are. Include edge cases and off-label uses&#8212;AI systems are routinely used in ways their developers did not anticipate.</span></div>
    <div class="cheat-pill"><strong>Failure Mode Analysis</strong><span>Systematically analyze what happens when the AI system fails&#8212;in different ways and for different affected parties. False positives, false negatives, distributional shift failures, adversarial manipulation, and degraded performance under novel conditions all create different impact patterns. Failure mode analysis is especially important for identifying impacts on vulnerable groups who may experience higher error rates.</span></div>
    <div class="cheat-pill"><strong>Analogous System Review</strong><span>Review documented impacts of analogous AI systems that have been deployed in similar contexts. Academic literature, regulatory findings, journalistic investigations, and civil society reports on AI harms in comparable contexts provide evidence-based starting points for impact identification. The field of AI ethics has accumulated substantial documentation of AI impacts across many domains.</span></div>
    <div class="cheat-pill"><strong>Affected Party Consultation</strong><span>Directly engage representatives of affected communities in identifying potential impacts. Affected parties often identify impacts that technical experts miss&#8212;both because they have lived experience of the domain and because they can anticipate how AI outputs will interact with existing social dynamics. Community consultation is methodologically essential, not just ethically appropriate.</span></div>
    <div class="cheat-pill"><strong>Expert Review</strong><span>Domain experts (clinicians for healthcare AI, lawyers for criminal justice AI, social workers for benefit AI) can identify impacts that general assessors miss because they understand the domain dynamics within which the AI operates. AI ethics researchers, fairness researchers, and social scientists who study AI impacts bring systematic knowledge of impact patterns across AI systems.</span></div>
    <div class="cheat-pill"><strong>Scenario Analysis and Red-Teaming</strong><span>Develop realistic scenarios depicting how the AI system will be used by different actors in different situations and analyze impacts in each scenario. Red-teaming&#8212;actively seeking to identify ways the AI system could cause harm or be misused&#8212;systematically surfaces impacts that optimistic impact identification might miss. Red-teaming is especially important for generative AI systems with broad applicability.</span></div>
  </div>`,
  quiz:{q:"An AISIA team for a large language model-based customer service AI identifies impacts using only the organization&#8217;s internal product team and the AI vendor&#8217;s technical documentation. What methodological weakness does this create?",opts:["This is sufficient&#8212;internal product teams understand customer impacts best","The identification relies entirely on parties with a stake in the AI system&#8217;s success. Without affected party consultation, analogous system review, or external expert input, the identification will likely miss: impacts on customers in vulnerable circumstances (mental health crises, financial distress, language barriers), patterns documented in similar AI systems deployed elsewhere, and impacts that emerge from the intersection of AI outputs with the social context customers inhabit. Internal and vendor perspectives are inherently optimistic; balanced identification requires perspectives from outside the system&#8217;s development ecosystem.","Only technical documentation is needed for customer service AI","Impact identification by affected parties creates bias in the assessment"],ans:1,explain:"ISO 42005 emphasizes methodological diversity in impact identification precisely because homogeneous identification teams systematically miss certain categories of impacts. A product team optimizing for customer satisfaction metrics may not identify how the AI responds to customers experiencing financial distress, domestic violence, or mental health crises. Academic literature on conversational AI harms documents specific failure patterns for vulnerable users that an internal team might not anticipate. Affected party consultation brings lived experience of the domain that shapes which impacts are most significant. The investment in methodological diversity pays off in a more complete impact landscape."}
},
{
  title:"Individual Impacts&#8212;What AI Does to People",
  tagline:"Assessing impacts on the fundamental interests and rights of individuals",
  body:`<p>The most concrete and often most immediate AI system impacts are those experienced by individuals&#8212;the people who are directly subject to AI decisions, recommendations, or outputs. ISO 42005 requires systematic assessment of a wide range of potential individual impacts, organized around fundamental interests that AI systems can advance or undermine.</p>
  <div class="highlight-box"><strong>Why individual impacts require systematic examination:</strong> Individual AI impacts often involve fundamental interests&#8212;access to credit, employment, housing, healthcare, freedom from undue surveillance&#8212;that have profound effects on people&#8217;s life trajectories. A single erroneous AI decision can cascade into a pattern of disadvantage: a wrongful credit denial leads to inability to purchase a home, leading to reduced wealth accumulation, leading to reduced ability to access further opportunities. AI impact assessment must examine not just immediate effects but consequential chains.</highlight-box>
  <div class="impact-card"><b>Privacy Impacts</b><br>AI systems that collect, analyze, or infer personal information create privacy impacts: surveillance (tracking behavior, location, communications), inference of sensitive attributes from non-sensitive data (inferring health conditions from purchasing patterns, political views from social media activity), identification of individuals in anonymized datasets, and aggregation of information from multiple sources creating profiles people would not recognize as their own. Privacy impacts are both immediate (I am being watched now) and consequential (information collected now will be used in future decisions).</div>
  <div class="impact-card"><b>Autonomy and Self-Determination Impacts</b><br>AI systems that make or heavily influence decisions that individuals previously made themselves, or that constrain individual choices based on AI predictions, undermine autonomy. The individual who is denied a loan based on AI assessment has their financial autonomy constrained. The employee whose work is continuously monitored by AI loses autonomy over their own professional behavior. The patient whose treatment options are shaped by AI clinical decision support has reduced autonomy in their healthcare decisions.</div>
  <div class="impact-card"><b>Discrimination and Fairness Impacts</b><br>AI systems can discriminate based on protected characteristics (race, gender, age, disability, religion, national origin, sexual orientation) through explicit use of protected attributes, through proxies correlated with protected attributes (zip code as a proxy for race in lending), through training data encoding historic discrimination, or through different error rates across demographic groups. Discrimination impacts can occur even when no discriminatory intent exists.</div>
  <div class="impact-card"><b>Dignity Impacts</b><br>AI systems can affect individuals&#8217; sense of dignity and self-worth: through dehumanizing treatment (being assessed by algorithms rather than humans in high-stakes situations), through exposure of intimate information without consent, through misclassification or misidentification, or through outputs that demean or stereotypetype certain groups. Dignity impacts may be less legally visible than discrimination impacts but are real dimensions of individual harm.</div>
  <div class="impact-card"><b>Safety Impacts</b><br>AI systems deployed in safety-critical contexts can cause direct physical harm: autonomous vehicles making incorrect navigation decisions, medical AI producing incorrect diagnoses or treatment recommendations, industrial automation creating workplace hazards, emergency response AI misprioritizing incidents. Safety impacts are often catastrophic and irreversible, requiring the most rigorous impact assessment.</div>
  <div class="impact-card"><b>Economic Impacts</b><br>AI-driven decisions affecting individuals&#8217; access to financial products, employment, housing, and insurance directly affect economic security. Job displacement from AI automation affects income and livelihood. Discriminatory AI in credit, insurance, or housing creates wealth impacts that compound over time. Individual economic impacts aggregate into community and societal economic effects.</div>`,
  quiz:{q:"A health insurance company&#8217;s AI system uses social determinants of health (SDP) data&#8212;zip code, occupation, household income, education level&#8212;to predict health risk and set premium prices. An AISIA identifies that this creates higher premiums for residents of lower-income neighborhoods. Which individual impact categories does this implicate?",opts:["Only economic impacts&#8212;premium pricing is a financial matter","Multiple individual impact categories: economic impacts (higher premiums reduce affordability of health insurance, affecting financial security), discrimination impacts (lower-income neighborhood correlates strongly with race due to historic housing segregation&#8212;using zip code as a proxy may constitute indirect racial discrimination), and autonomy impacts (individuals cannot realistically change their zip code to access lower premiums). The economic impact is also a dignity impact if individuals in these communities are systematically charged more for the same coverage.","Only privacy impacts&#8212;using personal data for pricing is primarily a privacy concern","Only discrimination impacts apply&#8212;all other categories require direct intent to cause harm"],ans:1,explain:"SDP-based insurance pricing illustrates how a single AI practice can implicate multiple individual impact categories simultaneously. Economic impacts are immediate&#8212;higher premiums may make insurance unaffordable for individuals in lower-income areas. Discrimination impacts arise from the correlation between zip code and race in the US housing market&#8212;using a geographic proxy that systematically disadvantages protected racial groups may constitute disparate impact discrimination regardless of intent. Autonomy impacts arise because insurance is not optional for individuals with health needs, and changing zip code to access better rates is not a realistic option for most people. ISO 42005 requires examining all relevant impact categories rather than treating impacts as falling neatly into a single category."}
},
{
  title:"Group and Societal Impacts&#8212;What AI Does to Communities",
  tagline:"Assessing impacts that emerge at population scale and affect social structures",
  body:`<p>Some of the most significant AI impacts are only visible when examining how AI systems affect groups and communities rather than isolated individuals. Group and societal impacts emerge from patterns across many individual interactions, from systemic effects on social institutions, and from the cumulative influence of AI systems on public discourse, political processes, and the distribution of power and opportunity in society.</p>
  <div class="highlight-box"><strong>Why individual impact assessment is not sufficient:</strong> An AI hiring system might reject each individual candidate through a process that appears non-discriminatory for that specific case&#8212;but when the pattern is examined across thousands of candidates, a consistent disparity in rejection rates across demographic groups emerges. Individual-level assessment would miss this group-level pattern. ISO 42005 explicitly requires group and societal impact analysis because some of the most significant AI harms are structural rather than individual.</highlight-box>
  <div class="cheat-grid">
    <div class="cheat-pill"><strong>Differential Group Impacts (Disparate Impact)</strong><span>AI systems may produce different outcomes for different demographic groups even without intent to discriminate. Facial recognition with higher error rates for darker-skinned individuals; credit scoring with higher denial rates for certain ethnic groups; content recommendation algorithms surfacing less relevant content for users in non-dominant language communities. Group impact assessment requires disaggregated analysis of AI outcomes across demographic dimensions.</span></div>
    <div class="cheat-pill"><strong>Community Resource and Access Effects</strong><span>AI systems affecting lending, hiring, housing, or public service access can systematically shape the resources available to specific communities. If an AI mortgage system denies loans at higher rates in certain zip codes, it affects the whole community&#8217;s ability to build wealth and maintain housing stock&#8212;not just individual applicants. Community-level impact assessment examines these aggregate resource effects.</span></div>
    <div class="cheat-pill"><strong>Democratic and Civic Participation Impacts</strong><span>AI systems shaping information access and political content can affect democratic participation. Social media algorithms that filter political information create information bubbles affecting civic deliberation. AI-generated political content at scale may undermine authentic political discourse. Automated voter registration or benefits eligibility systems may create access barriers for certain communities. Democratic impacts require specific assessment focus given their foundational importance.</span></div>
    <div class="cheat-pill"><strong>Labor Market and Economic Structure Impacts</strong><span>AI automation affects employment patterns across sectors and skill levels, with different impacts on different worker communities. Highly automated sectors shed lower-skilled jobs while creating demand for AI specialists&#8212;a distributional shift with significant community impacts. AI systems can also change power dynamics in labor markets if employers use AI to optimize for worker productivity in ways that reduce worker bargaining power.</span></div>
    <div class="cheat-pill"><strong>Power Concentration Impacts</strong><span>AI systems that provide significant competitive advantages can accelerate market concentration, consolidating economic and social power in the hands of the largest AI deployers. AI-driven surveillance capabilities can shift power toward governments and large corporations and away from individuals and civil society. Power concentration impacts are often slow-moving and difficult to reverse once established.</span></div>
    <div class="cheat-pill"><strong>Cultural and Identity Impacts</strong><span>AI systems trained primarily on dominant cultural data may underperform for minority language speakers, cultural minorities, and marginalized communities while simultaneously shaping cultural output in ways that reflect dominant perspectives. Generative AI trained on existing cultural production can amplify existing representations while marginalizing minority cultural expressions. Cultural impact assessment requires engagement with the communities most likely to be culturally affected.</span></div>
  </div>`,
  quiz:{q:"An AI system for screening social welfare benefit applications shows that applicants from rural areas are approved at lower rates than urban applicants, even controlling for income and asset levels. How should an AISIA characterize this finding?",opts:["This is an individual impact affecting rural applicants&#8212;each can appeal their individual decision","This is a group impact (disparate impact on a geographic-demographic community) with potential systemic causes: the AI may have been trained on data weighted toward urban living patterns; rural cost-of-living differences may be underweighted; or rural employment patterns may be incorrectly scored. The impact is not just on individual rural applicants but on the rural community as a whole if systematic underperformance in benefit access creates a pattern of economic disadvantage. ISO 42005 requires group-level analysis to surface these structural patterns.","Geographic differences in approval rates are expected and acceptable","Group impacts only apply to protected classes, not geographic groups"],ans:1,explain:"Geographic disparate impact in benefit access is a classic group impact that individual-level assessment would miss. If each individual denial appears reasonable based on the specific case data, there is no mechanism within individual assessment to detect the systematic pattern. But at the community level, systematically lower approval rates for rural applicants&#8212;even controlling for income and assets&#8212;represents a structural disadvantage that may reflect AI design choices rather than actual differences in benefit eligibility. ISO 42005&#8217;s group impact assessment requirements exist precisely to surface these structural patterns that are invisible at the individual case level but represent significant societal impacts when aggregated."}
},
{
  title:"Environmental Impacts of AI Systems",
  tagline:"Assessing the ecological footprint that AI systems create",
  body:`<p>Environmental impacts of AI systems are often overlooked in traditional risk and impact assessments&#8212;but ISO 42005 explicitly requires their consideration. AI systems&#8212;particularly large-scale machine learning systems, foundation models, and AI infrastructure&#8212;have significant and growing environmental footprints that constitute real-world impacts requiring systematic assessment alongside human-centered impacts.</p>
  <div class="highlight-box"><strong>Why environmental impacts belong in AI impact assessment:</strong> Environmental impacts of AI are not abstract&#8212;they are real consequences affecting communities, ecosystems, and future generations. A single training run for a large foundation model can emit carbon equivalent to multiple transatlantic flights. AI data center cooling systems compete with local communities for scarce water resources. Electronic waste from AI hardware creates persistent environmental hazards. And AI systems deployed for environmental applications (climate modeling, energy optimization) can have positive environmental impacts as well. ISO 42005 requires both negative and positive environmental impacts to be examined.</highlight-box>
  <div class="cheat-grid">
    <div class="cheat-pill"><strong>Energy Consumption and Carbon Footprint</strong><span>AI training and inference operations require substantial computational resources with significant energy demands. The carbon footprint depends on: the scale of computation (larger models require more energy), the carbon intensity of the electricity source (renewable vs. fossil-fuel powered), and the geographic location of compute resources. ISO 42005 requires assessing energy consumption impacts including: training energy, operational inference energy, and the carbon emissions associated with both.</span></div>
    <div class="cheat-pill"><strong>Water Consumption</strong><span>Data centers cooling AI hardware require substantial water for evaporative cooling systems. This water consumption creates impacts on local water availability&#8212;particularly significant in water-stressed regions where data centers are increasingly located. Large-scale AI infrastructure can place meaningful pressure on local water systems, competing with agricultural and community water needs.</span></div>
    <div class="cheat-pill"><strong>Hardware Manufacturing and E-Waste</strong><span>AI hardware (GPUs, TPUs, specialized AI chips) has significant manufacturing environmental impacts including rare earth mineral extraction, manufacturing pollution, and chemical waste. The rapid obsolescence cycle of AI hardware driven by competitive pressure creates substantial electronic waste. E-waste contains hazardous materials and creates environmental and health impacts in communities where it is processed.</span></div>
    <div class="cheat-pill"><strong>Land Use and Biodiversity</strong><span>Data center construction and expansion requires land development, sometimes in ecologically significant areas. The cooling infrastructure, electrical distribution systems, and associated logistics create land-use footprints that affect local ecosystems and biodiversity.</span></div>
    <div class="cheat-pill"><strong>Positive Environmental Impacts</strong><span>AI systems can also create positive environmental impacts: AI-driven energy grid optimization reducing overall energy consumption, AI climate modeling accelerating understanding of climate dynamics, AI-enabled materials discovery reducing manufacturing waste, precision agriculture AI reducing pesticide and fertilizer use, and AI wildlife monitoring supporting conservation. ISO 42005 requires balanced assessment of both positive and negative environmental impacts.</span></div>
    <div class="cheat-pill"><strong>Lifecycle Environmental Assessment</strong><span>Environmental impact assessment should cover the full AI system lifecycle: hardware manufacturing and deployment, training phase (often the most energy-intensive), operational inference phase (ongoing energy and water use), and hardware end-of-life (disposal, refurbishment, or recycling). Lifecycle assessment prevents focus on only one phase while missing significant impacts in others.</span></div>
  </div>`,
  quiz:{q:"A technology company argues that their AI system&#8217;s environmental impacts are not relevant to an AISIA because environmental regulation is separate from AI governance. How does ISO 42005 respond to this argument?",opts:["The company is correct&#8212;environmental impacts should be addressed through environmental regulations, not AI impact assessment","ISO 42005 explicitly includes environmental impacts within the scope of AI System Impact Assessment. Environmental impacts&#8212;energy consumption, water use, hardware manufacturing, e-waste&#8212;are real-world consequences of AI system deployment that affect communities and ecosystems just as surely as social impacts do. Separating environmental and social impact assessment creates an artificial boundary that produces incomplete assessment of AI systems&#8217; total real-world effects.","Environmental impacts only need to be assessed for AI systems specifically designed for environmental applications","Only carbon emissions, not other environmental impacts, are in scope for AISIA"],ans:1,explain:"ISO 42005&#8217;s explicit inclusion of environmental impacts reflects the standard&#8217;s commitment to comprehensive assessment of all real-world AI consequences. Environmental impacts of AI infrastructure are not hypothetical&#8212;the energy, water, land, and material requirements of AI systems create measurable ecological effects that affect communities and ecosystems. The argument that these are &#8216;environmental regulation&#8217; problems rather than AI governance problems creates accountability gaps where neither framework adequately addresses the impacts. ISO 42005 closes this gap by explicitly requiring environmental impact assessment as part of comprehensive AISIA."}
},
{
  title:"Impact Analysis&#8212;Likelihood and Severity",
  tagline:"Evaluating how probable and how serious identified impacts are",
  body:`<p>Once impacts are identified, the AISIA must <span class="key-term">analyze</span> each impact&#8212;examining how likely it is to occur and how severe it would be if it does occur. This two-dimensional analysis (likelihood &#215; severity) enables prioritization of impacts requiring urgent attention and helps determine appropriate treatment measures.</p>
  <div class="highlight-box"><strong>AI-specific challenges in likelihood and severity analysis:</strong> Traditional risk analysis methods (probability &#215; impact matrices) face specific challenges in AI contexts. AI systems&#8217; probabilistic behavior makes likelihood estimation inherently uncertain; distributional shift means deployment-phase performance may differ significantly from testing-phase performance; rare but catastrophic failure modes may be underweighted by probability-focused analysis; and the same AI behavior may have very different severity implications for different affected parties depending on their vulnerability and circumstances. ISO 42005 requires analysis methods adapted to these AI-specific challenges.</highlight-box>
  <div class="cheat-grid">
    <div class="cheat-pill"><strong>Likelihood Factors for AI Impacts</strong><span>Factors affecting the likelihood of AI impacts materializing include: the AI system&#8217;s error rate in relevant conditions (false positive and false negative rates disaggregated by relevant subgroups), the deployment scale (more individuals affected = more total impact events even at constant error rates), the frequency of use (high-frequency decisions create more opportunities for impact), foreseeable adversarial manipulation that increases impact likelihood, and contextual factors affecting vulnerability.</span></div>
    <div class="cheat-pill"><strong>Severity Factors for AI Impacts</strong><span>Severity assessment examines: reversibility (can the impact be undone if detected?), magnitude (how severely does the impact affect the fundamental interests of affected parties?), breadth (how many individuals or communities are affected?), duration (is the impact temporary or persistent?), and the vulnerability of affected parties (the same impact has greater severity for more vulnerable individuals). ISO 42005 emphasizes reversibility as a key severity dimension&#8212;irreversible impacts require prevention rather than remediation.</span></div>
    <div class="cheat-pill"><strong>Disaggregated Analysis</strong><span>Likelihood and severity must be analyzed for different affected party categories separately, not just on average. An AI system with good average performance may have significantly worse performance for certain demographic groups&#8212;and the most affected groups may also be the most vulnerable. Averaging across all affected parties obscures the disproportionate impacts that ISO 42005&#8217;s group impact assessment is designed to identify.</span></div>
    <div class="cheat-pill"><strong>Uncertainty and the Precautionary Dimension</strong><span>AI system behavior in deployment contexts is often uncertain&#8212;particularly for novel AI systems, new deployment contexts, and generative AI with broad applicability. ISO 42005 requires that uncertainty in impact analysis be explicitly documented and that precautionary measures be considered when uncertain impacts could be severe or irreversible. The appropriate response to uncertain but potentially catastrophic impacts is greater caution, not acceptance by default.</span></div>
  </div>
  <div class="analogy-box"><strong>The asymmetry principle in severity assessment:</strong> A medical principle states that the potential harm of an intervention should be weighed asymmetrically against its potential benefit when they are not reversible in the same way. A drug that might cure cancer is worth accepting substantial side-effect risk; a cosmetic treatment that might cause permanent disfigurement is not. ISO 42005 applies the same asymmetry to AI impact severity: reversible impacts of modest severity can be managed with normal risk management; irreversible impacts of significant severity require strong prevention measures before deployment. The key severity question is not just &#8220;how bad is it?&#8221; but &#8220;can it be undone?&#8221;</div>`,
  quiz:{q:"An AISIA is analyzing a criminal justice risk assessment AI. The analysis team estimates that the false positive rate (incorrectly classifying low-risk individuals as high-risk) is approximately 15% on average, but 28% for Black defendants. How should severity analysis approach this disparity?",opts:["The 15% average rate should be used for severity analysis&#8212;demographic disaggregation is a separate fairness question","The disaggregated analysis reveals two compounding severity factors: (1) the 28% false positive rate for Black defendants means incorrect high-risk classifications occur at nearly twice the average rate for this group; (2) Black defendants in the US are already overrepresented in the criminal justice system, making their vulnerability to additional adverse classification greater. Severity analysis using only the average rate systematically underestimates severity for the most-affected group. ISO 42005 requires disaggregated severity analysis for exactly this reason.","15% is an acceptable error rate for criminal justice applications","Severity analysis cannot include demographic disaggregation because it creates racial bias in the assessment"],ans:1,explain:"This scenario illustrates why ISO 42005 requires disaggregated likelihood and severity analysis rather than aggregate averages. A 15% average false positive rate masks the 28% rate for Black defendants&#8212;nearly double&#8212;and severity analysis using only the average would dramatically underestimate the burden falling on this already-vulnerable group. In criminal justice contexts, a false positive designation as high-risk can result in pretrial detention, harsher sentencing recommendations, or reduced parole approval&#8212;impacts with severe, potentially irreversible consequences. The combination of higher false positive rate AND greater vulnerability for the disproportionately affected group requires the most rigorous severity assessment and the strongest mitigation measures."}
},
{
  title:"Risk Evaluation and Prioritization",
  tagline:"Determining which impacts require treatment and how urgently",
  body:`<p>Following impact analysis, the AISIA must <span class="key-term">evaluate</span> analyzed impacts&#8212;comparing the results of likelihood and severity analysis against the criteria established at assessment scope to determine which impacts are acceptable as-is, which require treatment, and which may require the decision not to deploy the AI system. This evaluation phase transforms analysis findings into actionable prioritization.</p>
  <div class="highlight-box"><strong>Impact evaluation criteria:</strong> ISO 42005 requires that evaluation criteria be established before assessment begins&#8212;not derived from assessment findings. Pre-established criteria prevent confirmation bias (adjusting criteria to make a preferred outcome look acceptable) and ensure consistent application across different AI systems and assessment teams. Criteria should reflect organizational values, legal requirements, regulatory expectations, and the fundamental rights of affected parties.</highlight-box>
  <div class="cheat-grid">
    <div class="cheat-pill"><strong>Absolute Threshold Criteria</strong><span>Some impacts are unacceptable regardless of their probability or the organization&#8217;s risk appetite: impacts that violate fundamental human rights, impacts that constitute illegal discrimination, impacts that create risks to life and safety that cannot be adequately mitigated. ISO 42005 requires that absolute threshold criteria be established and that AI systems whose potential impacts exceed these thresholds not be deployed regardless of business case.</span></div>
    <div class="cheat-pill"><strong>Proportionality Criteria</strong><span>For impacts that do not cross absolute thresholds, evaluation examines whether the potential negative impacts are proportionate to the benefits the AI system provides. An AI system that improves a routine administrative process slightly while creating modest privacy risks may have proportionate impact. An AI system that improves decision efficiency by 5% while creating significant discrimination risk likely fails proportionality criteria.</span></div>
    <div class="cheat-pill"><strong>Rights-Based Evaluation</strong><span>Impact evaluation against fundamental rights frameworks (UDHR, ECHR, EU Charter of Fundamental Rights) provides a structured basis for evaluation that goes beyond organizational risk tolerance to universal ethical standards. EU AI Act compliance requires fundamental rights impact assessment&#8212;ISO 42005 provides the methodology for conducting rights-based impact evaluation.</span></div>
    <div class="cheat-pill"><strong>Comparative Evaluation</strong><span>Compare AI-enabled outcomes with the baseline alternative (human decision-making, no decision-making, or different AI approaches). If an AI system produces discrimination at a lower rate than the human processes it replaces, this comparative improvement is relevant context&#8212;though it does not eliminate the obligation to address the remaining AI-enabled discrimination. Comparative evaluation prevents both over-claiming AI benefits and ignoring meaningful improvements.</span></div>
    <div class="cheat-pill"><strong>Prioritization of Treatment</strong><span>Where multiple impacts require treatment but resources for treatment are constrained, prioritization criteria should rank impacts for treatment action. Priority factors include: severity (irreversible impacts prioritized over reversible), vulnerability of affected parties (impacts on more vulnerable parties prioritized), scale (impacts affecting more people prioritized), and treatability (impacts amenable to effective mitigation prioritized to maximize impact of treatment resources).</span></div>
    <div class="cheat-pill"><strong>The Deployment Decision</strong><span>ISO 42005 explicitly contemplates that AISIA evaluation may result in a decision not to deploy the AI system&#8212;if identified impacts cannot be adequately mitigated and exceed acceptable thresholds. This is a difficult decision with significant business implications, but it is a legitimate and sometimes necessary outcome of rigorous impact assessment. An assessment process that never results in deployment constraints has not been genuinely evaluative.</span></div>
  </div>`,
  quiz:{q:"An AISIA finds that an AI-powered benefit eligibility determination system will significantly reduce processing time (from 30 days to 2 days) but will incorrectly deny benefits to approximately 8% of eligible applicants with no adequate appeal mechanism. How should impact evaluation approach this trade-off?",opts:["The 30-to-2 day improvement clearly outweighs the 8% error rate&#8212;this is an acceptable trade-off","The evaluation requires examining: (1) whether incorrect benefit denial crosses absolute threshold criteria (denial of legally-required benefits to eligible individuals implicates legal and rights-based criteria); (2) whether 8% denial of eligible applicants is proportionate to the efficiency gain (8% of eligible applicants experiencing unlawful denial is a substantial impact on vulnerable people who depend on benefits); (3) whether an adequate appeal mechanism can be implemented as a mitigation; and (4) whether the 2-day processing time requires AI automation or whether a less impactful approach could achieve similar speed.","Benefit administration systems are exempt from proportionality evaluation because they are government functions","The 8% error rate is acceptable because human review processes also have error rates"],ans:1,explain:"This scenario illustrates a common pressure in AI deployment: real efficiency benefits being weighed against real harms to vulnerable parties. ISO 42005&#8217;s evaluation framework requires examining: whether incorrect benefit denial for eligible individuals crosses absolute threshold criteria (legal rights to benefits); whether the 8% rate is proportionate to the efficiency gain (an 8% wrongful denial rate affecting the most economically vulnerable people is substantial); whether rights-based evaluation supports this trade-off (the right to public benefits when eligible is a legal right, not just a preference); and whether alternative approaches could achieve similar efficiency with lower harm rates. The absence of an adequate appeal mechanism is particularly serious&#8212;people incorrectly denied benefits with no recourse face severe consequences that the efficiency benefit does not justify."}
},
{
  title:"Mitigation Measures and Treatment",
  tagline:"Designing and implementing responses to identified AI impacts",
  body:`<p>For impacts that have been evaluated as requiring treatment, the AISIA must identify and implement <span class="key-term">mitigation measures</span>&#8212;interventions designed to reduce the likelihood, severity, or scope of identified impacts to acceptable levels. ISO 42005 requires systematic treatment planning, not ad hoc responses, and demands that treatment effectiveness be verified rather than assumed.</p>
  <div class="highlight-box"><strong>The mitigation principle hierarchy:</strong> ISO 42005 applies a hierarchy of mitigation preference analogous to occupational health and safety&#8217;s hierarchy of controls. Preferred mitigations address the root cause of impact (eliminating the impact); acceptable mitigations reduce likelihood or severity substantially; least-preferred mitigations compensate for or remediate impacts that were not prevented. This hierarchy matters because downstream mitigations are less reliable than upstream prevention.</highlight-box>
  <div class="step-card"><b>Level 1&#8212;Elimination (Most Preferred)</b><br>Remove the feature, capability, or design element that creates the impact. If a hiring AI&#8217;s use of residential zip code creates discriminatory geographic bias, eliminating zip code from the feature set removes the bias at its source. Elimination is the most reliable mitigation but may require significant system redesign and may reduce system performance on intended objectives.</div>
  <div class="step-card"><b>Level 2&#8212;Substitution</b><br>Replace the impactful element with a less harmful alternative. If the AI system needs geographic information, replacing zip code with more granular and less-discriminatory geographic features may reduce bias while preserving some geographic signal. Substitution reduces but may not eliminate impact depending on the correlation structure of the substitute.</div>
  <div class="step-card"><b>Level 3&#8212;Engineering Controls</b><br>Modify the AI system&#8217;s design, training, or operational parameters to reduce impacts. Fairness constraints during model training, post-processing adjustments to equalize error rates across groups, decision threshold calibration to balance false positive and false negative rates across affected populations, and output filtering for harmful content all constitute engineering controls. These are technical interventions that require ongoing monitoring for effectiveness.</step-card>
