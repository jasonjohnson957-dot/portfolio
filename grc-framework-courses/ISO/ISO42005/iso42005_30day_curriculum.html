{
  title:"ISO 42005 Cheat Sheet",
  tagline:"Your complete quick-reference guide",
  isCheatSheet:true,
  body:`
  <div class="cheat-section">
    <h3>What Is ISO/IEC 42005?</h3>
    <p style="font-size:13.5px;color:#6b6b68">ISO/IEC 42005 &#8212; &#8220;Information Technology &#8212; Artificial Intelligence &#8212; AI System Impact Assessment.&#8221; Published 2025 by ISO/IEC JTC 1, Subcommittee 42 (SC 42). Provides requirements and guidance for conducting AI System Impact Assessments (AISIA). Addresses impacts on individuals, groups, communities, society, and the natural environment. Applies throughout the AI system lifecycle. Complements ISO 42001 (AI management system) and ISO 23894 (AI risk management). Supports EU AI Act FRIA compliance. The first dedicated international standard for AI impact assessment methodology. Key distinction from risk management: centers perspective of affected parties external to the organization, not just organizational risk tolerance.</p>
  </div>

  <div class="cheat-section">
    <h3>Key Parties in the AISIA Framework</h3>
    <div class="control-row">
      <div class="ctrl-card"><b>AI Provider</b> &#8212; Develops and makes AI system available. Bears responsibility for design-inherent impacts.</div>
      <div class="ctrl-card"><b>AI Deployer</b> &#8212; Deploys AI in specific operational context. Bears primary responsibility for deployment-context impacts.</div>
      <div class="ctrl-card"><b>Directly Affected Parties</b> &#8212; Individuals directly subject to AI decisions, recommendations, or outputs. Primary focus of individual impact assessment.</div>
      <div class="ctrl-card"><b>Indirectly Affected Parties</b> &#8212; Individuals, communities, or society experiencing AI consequences without direct interaction. Must be explicitly included in scope.</div>
      <div class="ctrl-card"><b>AI Operators</b> &#8212; Professionals using AI in their work. Can experience impacts themselves and mediate impacts on affected parties.</div>
      <div class="ctrl-card"><b>Broader Ecosystem</b> &#8212; Institutions, labor markets, democratic systems, cultural heritage. Systemic and structural impacts at societal level.</div>
    </div>
  </div>

  <div class="cheat-section">
    <h3>The Five AISIA Components</h3>
    <div class="control-row">
      <div class="ctrl-card"><b>1. Context Establishment</b> &#8212; Define: AI system being assessed, deployment context, assessment scope (with justification for inclusions/exclusions), evaluation criteria (established BEFORE assessment begins), methodology, and assessment team. Proportionality principle: depth calibrated to significance of potential impacts.</div>
      <div class="ctrl-card"><b>2. Impact Identification</b> &#8212; Systematically identify all potential impacts using: use case analysis, failure mode analysis, analogous system review, affected party consultation, expert review, scenario analysis/red-teaming. All affected party categories must be considered. Internal-only identification is insufficient for high-stakes systems.</div>
      <div class="ctrl-card"><b>3. Impact Analysis</b> &#8212; For each identified impact: assess likelihood (considering AI error rates, scale, frequency) and severity (reversibility, magnitude, breadth, duration, affected party vulnerability). MUST be disaggregated by affected party groups&#8212;averages conceal disparate impacts. Document uncertainty explicitly.</div>
      <div class="ctrl-card"><b>4. Evaluation and Treatment</b> &#8212; Evaluate analyzed impacts against pre-established criteria. Criteria types: absolute thresholds (never acceptable), proportionality (benefits vs. harms), rights-based, comparative. Apply mitigation hierarchy. Assess residual impacts. Deployment decision may result in &#8220;do not deploy.&#8221;</div>
      <div class="ctrl-card"><b>5. Documentation and Communication</b> &#8212; Comprehensive process records (context, affected parties, identification, analysis, decisions, treatment plans). Communicate to: leadership (deployment decisions), operators (impact-aware use), affected parties (transparency and rights), regulators (compliance evidence), public (for significant public-impact AI).</div>
    </div>
  </div>

  <div class="cheat-section">
    <h3>Impact Dimensions</h3>
    <div class="control-row">
      <div class="ctrl-card"><b>Individual Impacts</b><br>&#8226; Privacy (surveillance, inference, aggregation)<br>&#8226; Autonomy and self-determination<br>&#8226; Discrimination (disparate treatment/impact)<br>&#8226; Dignity<br>&#8226; Safety (safety-critical contexts)<br>&#8226; Economic (access to services, employment, wealth)</div>
      <div class="ctrl-card"><b>Group and Societal Impacts</b><br>&#8226; Disparate group impacts (disaggregated analysis)<br>&#8226; Community resource and access effects<br>&#8226; Democratic and civic participation<br>&#8226; Labor market and economic structure<br>&#8226; Power concentration<br>&#8226; Cultural and identity impacts</div>
      <div class="ctrl-card"><b>Environmental Impacts</b><br>&#8226; Energy consumption and carbon footprint<br>&#8226; Water consumption (data center cooling)<br>&#8226; Hardware manufacturing and e-waste<br>&#8226; Land use and biodiversity<br>&#8226; Positive environmental impacts (also required)<br>&#8226; Full lifecycle assessment</div>
    </div>
  </div>

  <div class="cheat-section">
    <h3>Mitigation Hierarchy (Most to Least Preferred)</h3>
    <div class="control-row">
      <div class="ctrl-card"><b>Level 1 &#8212; Elimination</b><br>Remove the feature or capability causing the impact. Most reliable but requires system redesign.</div>
      <div class="ctrl-card"><b>Level 2 &#8212; Substitution</b><br>Replace impactful element with less harmful alternative. Reduces but may not eliminate impact.</div>
      <div class="ctrl-card"><b>Level 3 &#8212; Engineering Controls</b><br>Technical modifications: fairness constraints, threshold calibration, output filtering. Requires ongoing effectiveness monitoring.</div>
      <div class="ctrl-card"><b>Level 4 &#8212; Administrative Controls</b><br>Policies, human oversight, training, incident reporting. Essential but reliability depends on consistent human execution.</div>
      <div class="ctrl-card"><b>Level 5 &#8212; Transparency and Rights</b><br>Disclosure to affected parties, appeal mechanisms, recourse. Necessary complement to technical mitigations; insufficient as sole mitigation for significant impacts.</div>
      <div class="ctrl-card"><b>Residual Impact</b><br>Evaluate remaining impact after treatment. Must meet acceptance criteria. If not: additional treatment or reconsider deployment. Document all decisions.</div>
    </div>
  </div>

  <div class="cheat-section">
    <h3>Lifecycle Integration Points</h3>
    <div class="badge-row">
      <span class="badge badge-vio">Conception &#8212; Should this AI be built? Design constraints?</span>
      <span class="badge badge-vio">Development &#8212; Training data bias, model design review</span>
      <span class="badge badge-vio">Testing &#8212; Fairness testing, red-team assessment</span>
      <span class="badge badge-vio">Deployment &#8212; Pre-deployment review, monitoring protocols established</span>
      <span class="badge badge-vio">Operation &#8212; Continuous monitoring, incident tracking, periodic reassessment</span>
      <span class="badge badge-vio">Change/Retirement &#8212; Change-triggered reassessment, data disposition</span>
    </div>
  </div>

  <div class="cheat-section">
    <h3>Framework Relationships</h3>
    <div class="control-row">
      <div class="ctrl-card"><b>ISO 42001 (AI Management System)</b> &#8212; AIMS governance structure within which AISIA is conducted, reviewed, acted upon, and improved. AISIA is a key process of the AIMS. ISO 42001 provides governance; ISO 42005 provides impact assessment substance.</div>
      <div class="ctrl-card"><b>ISO 23894 (AI Risk Management)</b> &#8212; Organizational perspective risk management (what could go wrong for us?). ISO 42005 adds external impact perspective (what are we doing to others?). Together: complete organizational + external impact picture.</div>
      <div class="ctrl-card"><b>EU AI Act (FRIA)</b> &#8212; Article 29a requires Fundamental Rights Impact Assessment for high-risk AI deployers. ISO 42005 provides the methodology. High-risk categories: biometrics, education, employment, essential services, law enforcement, migration, justice.</div>
      <div class="ctrl-card"><b>ISO 27701 (Privacy Management)</b> &#8212; Privacy Impact Assessment for personal data processing. AISIA integrates but exceeds PIA scope (also covers non-privacy impacts). Integrated assessment design recommended for AI systems with significant personal data dimensions.</div>
      <div class="ctrl-card"><b>NIST AI RMF</b> &#8212; US voluntary AI risk framework (GOVERN, MAP, MEASURE, MANAGE). ISO 42005 aligns with MEASURE function. Compatible methodologies enabling integrated programs for organizations subject to both frameworks.</div>
      <div class="ctrl-card"><b>ISO 29134 (Privacy Impact Assessment)</b> &#8212; General PIA methodology for information systems. ISO 42005 encompasses and extends beyond 29134 for AI-specific contexts. Use 29134 for privacy dimension depth within broader ISO 42005 assessment.</div>
    </div>
  </div>

  <div class="cheat-section">
    <h3>Key Principles and Facts</h3>
    <div class="badge-row">
      <span class="badge badge-vio">Published: 2025 by ISO/IEC JTC 1/SC 42</span>
      <span class="badge badge-vio">First dedicated international AI impact assessment standard</span>
      <span class="badge badge-vio">Addresses: individuals, groups, society, environment</span>
      <span class="badge badge-vio">Key distinction: centers affected party perspective, not organizational risk tolerance</span>
      <span class="badge badge-vio">Proportionality: assessment depth proportionate to impact significance</span>
      <span class="badge badge-vio">Disaggregation: analysis must be disaggregated by affected party groups</span>
      <span class="badge badge-vio">Lifecycle: ongoing assessment, not one-time pre-deployment checkpoint</span>
      <span class="badge badge-vio">Evaluation criteria established BEFORE assessment begins (prevents confirmation bias)</span>
      <span class="badge badge-vio">Documentation: comprehensive process records enabling external accountability</span>
      <span class="badge badge-vio">Deployment decision can legitimately be &#8220;do not deploy&#8221;</span>
      <span class="badge badge-vio">Environmental impacts explicitly in scope (energy, water, e-waste)</span>
      <span class="badge badge-vio">High-risk AI indicators: consequential decisions, automated without human review, affects vulnerable groups, irreversible consequences</span>
      <span class="badge badge-vio">Most common failure: assessment theater (appearance without genuine engagement)</span>
      <span class="badge badge-vio">Affected party consultation: methodologically essential, not just ethically appropriate</span>
      <span class="badge badge-vio">EU AI Act FRIA requirement: ISO 42005 provides the methodology</span>
    </div>
  </div>`
}
];

let current = 0;
function buildGrid(){
  const g=document.getElementById('dayGrid');g.innerHTML='';
  for(let i=0;i<days.length;i++){
    const b=document.createElement('button');
    b.className='day-pip'+(days[i].isCheatSheet?' cheat':'')+(i===current?' active':'');
    b.textContent=days[i].isCheatSheet?'CS':(i+1);
    b.title=days[i].title;
    b.onclick=(()=>{const idx=i;return()=>goTo(idx);})();
    g.appendChild(b);
  }
}
function goTo(idx){current=idx;render();}
function changeDay(dir){current=Math.max(0,Math.min(days.length-1,current+dir));render();}
function render(){
  const d=days[current];const total=days.length;
  document.getElementById('dayCounter').textContent=(current+1)+' / '+total;
  document.getElementById('prevBtn').disabled=current===0;
  document.getElementById('nextBtn').disabled=current===total-1;
  document.getElementById('progBar').style.width=(((current+1)/total)*100)+'%';
  buildGrid();
  if(d.isCheatSheet){
    document.getElementById('lessonArea').innerHTML=`<div class="card"><div class="lesson-header"><div class="day-badge" style="background:#E1F5EE"><div class="day-num" style="color:#085041;font-size:14px">CHEAT</div><div class="day-lbl" style="color:#0F6E56">SHEET</div></div><div class="lesson-meta"><h2>${d.title}</h2><div class="tagline">${d.tagline}</div></div></div><div class="lesson-body">${d.body}</div></div>`;
    return;
  }
  const quizId='quiz_'+current;let quizHtml='';
  if(d.quiz){
    const optsHtml=d.quiz.opts.map((o,i)=>`<button class="quiz-btn" onclick="checkAnswer(${i},${d.quiz.ans},'${quizId}')">${o}</button>`).join('');
    quizHtml=`<div class="quiz-box"><p>Quick check: ${d.quiz.q}</p><div>${optsHtml}</div><div class="answer-reveal" id="${quizId}"></div></div>`;
  }
  document.getElementById('lessonArea').innerHTML=`<div class="card"><div class="lesson-header"><div class="day-badge"><div class="day-num">${current+1}</div><div class="day-lbl">Day</div></div><div class="lesson-meta"><h2>${d.title}</h2><div class="tagline">${d.tagline}</div></div></div><div class="section-label">Today&#8217;s lesson</div><div class="lesson-body">${d.body}</div>${quizHtml}</div>`;
}
function checkAnswer(chosen,correct,qid){
  const el=document.getElementById(qid);const d=days[current];if(!d.quiz)return;
  const isRight=chosen===correct;
  el.innerHTML='<strong>'+(isRight?'Correct!':'Not quite.')+'</strong> '+d.quiz.explain;
  el.className='answer-reveal show';
  el.style.background=isRight?'#EAF3DE':'#F5F3FF';
  el.style.borderColor=isRight?'#3B6D11':'#7C3AED';
  el.style.color='#1a1a18';
}
render();
</script>
