<body>
<div class="wrap">
  <h2 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">30-day ISO 27001 curriculum for high school students with daily lessons and a final cheat sheet</h2>
  <div class="top-bar">
    <div class="title-block">
      <h1>ISO 27001 — 30-Day Classroom Guide</h1>
      <p>Taught for high school freshmen by a 20-year GRC veteran</p>
    </div>
    <div class="nav-row">
      <button id="prevBtn" onclick="changeDay(-1)">&#8592; Prev</button>
      <span id="dayCounter" style="font-size:13px;color:#6b6b68;min-width:60px;text-align:center"></span>
      <button id="nextBtn" onclick="changeDay(1)">Next &#8594;</button>
    </div>
  </div>
  <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progBar"></div></div>
  <div class="day-grid" id="dayGrid"></div>
  <div id="lessonArea"></div>
</div>

<script>
const days = [
  {
    title: "What Is ISO 27001?",
    tagline: "The international gold standard for information security management",
    body: `<p>Imagine you run a company that handles thousands of customers' personal and financial data. A major bank wants to do business with you — but first they ask: "How do we know your information security is good enough to trust with our customers' data?" You could hand them a 200-page policy document and hope they read it. Or you could show them one internationally recognized certificate that says an independent auditor has already verified your security program meets the world's highest standard. That certificate is <span class="key-term">ISO 27001</span>.</p>
    <p>ISO 27001 is the world's most widely recognized international standard for <strong>Information Security Management Systems (ISMS)</strong>. Its full official name is <em>ISO/IEC 27001:2022 — Information security, cybersecurity and privacy protection — Information security management systems — Requirements</em>. It was first published in 2005, significantly updated in 2013, and most recently revised in <strong>October 2022</strong>.</p>
    <div class="analogy-box"><strong>Real-world analogy:</strong> Think of ISO 27001 like a Michelin star rating for restaurants — but for information security. A Michelin star doesn't just mean the food is good today; it means the restaurant has been independently evaluated and consistently meets rigorous standards across cooking, ingredients, service, and consistency. ISO 27001 certification means an independent auditor has verified that an organization systematically manages information security risks — not just that they have some security tools in place.</div>
    <div class="highlight-box">ISO 27001 is certifiable — organizations can obtain an internationally recognized certificate from an accredited certification body proving they meet the standard. This certificate is accepted by customers, partners, regulators, and governments worldwide. It is not a law or regulation — it's a voluntary standard that has become a de facto market requirement in technology, finance, healthcare, and government contracting.</div>
    <p>Over 70,000 certificates have been issued worldwide across 150+ countries. ISO 27001 certification has become the primary way organizations prove information security competence to customers and partners globally.</p>`,
    quiz: { q: "What does ISO 27001 certify about an organization?", opts: ["That their software products have no bugs", "That they have independently verified they systematically manage information security risks through an Information Security Management System (ISMS)", "That they comply with GDPR", "That their network is unhackable"], ans: 1, explain: "ISO 27001 certifies that an organization has implemented a systematic, documented, and independently audited Information Security Management System (ISMS) for managing information security risks. It does not guarantee specific outcomes like 'no breaches' — it certifies the management system for identifying and treating risks." }
  },
  {
    title: "Why Was ISO 27001 Created?",
    tagline: "The global information security crisis that demanded a universal answer",
    body: `<p>By the late 1990s and early 2000s, the internet had transformed business — and with it, the attack surface for information security. Organizations were struggling with a familiar problem: every customer, partner, regulator, and auditor was asking different security questions, requiring different documentation, and accepting different evidence of security competence. Sound familiar? It's the same problem HITRUST solved for healthcare — except ISO 27001 solved it globally across all industries.</p>
    <div class="highlight-box"><strong>The origin story:</strong> ISO 27001's roots trace back to a 1995 UK government standard called BS 7799, developed by the British Standards Institution. This standard recognized that organizations needed a structured way to manage information security — not just buy security products and hope for the best. The standard was adopted by ISO in 2000 (as ISO 17799) and then restructured into the current certifiable management system standard (ISO 27001) in 2005.</div>
    <p>Several persistent problems drove the need for a global information security standard:</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>No Common Language</strong><span>Organizations couldn't compare security approaches because there was no common framework. "We take security seriously" meant something different to every organization.</span></div>
      <div class="cheat-pill"><strong>Questionnaire Overload</strong><span>Just like HITRUST addressed in healthcare, organizations were buried under incompatible security questionnaires from customers, partners, and regulators.</span></div>
      <div class="cheat-pill"><strong>Point-in-Time Compliance</strong><span>Security audits were snapshots that told you about the past, not the present. There was no way to demonstrate ongoing, systematic security management.</span></div>
      <div class="cheat-pill"><strong>Technology Focus Over Management</strong><span>Organizations bought firewalls and antivirus but had no systematic approach to identifying what information needed protecting, assessing risks, and making rational decisions about which controls to implement.</span></div>
    </div>
    <div class="analogy-box"><strong>The management system insight:</strong> ISO 27001's most important contribution isn't a list of security controls — it's the insight that information security requires a <em>management system</em>, not just security products. Just as quality management systems (ISO 9001) ensure consistent quality in manufacturing, an ISMS ensures consistent, systematic, improving information security management. The controls matter, but the system around them matters more.</div>`,
    quiz: { q: "What was the key management insight that made ISO 27001 different from simply listing security controls?", opts: ["It listed more controls than any other standard", "It recognized that information security requires a management system — a systematic, documented, and continuously improving approach — not just the purchase of security products", "It made security legally mandatory for the first time", "It was the first standard to mention cybersecurity"], ans: 1, explain: "ISO 27001's foundational insight is that effective information security is achieved through a management system — systematic processes for identifying risks, deciding how to treat them, implementing controls, monitoring effectiveness, and continuously improving. This is fundamentally different from simply implementing a list of technical security measures." }
  },
  {
    title: "ISO/IEC — The Standards Bodies Behind ISO 27001",
    tagline: "Understanding the international organizations that give ISO 27001 its global credibility",
    body: `<p>ISO 27001 is published jointly by two international organizations — <span class="key-term">ISO</span> (International Organization for Standardization) and <span class="key-term">IEC</span> (International Electrotechnical Commission). Understanding these bodies explains why ISO 27001 carries unique international authority.</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>ISO — International Organization for Standardization</strong><span>Founded 1947. Non-governmental. 170+ member countries. Each member is the national standards body for their country. Develops international standards across virtually every industry — quality (9001), environment (14001), AI (42001), food safety, and thousands more.</span></div>
      <div class="cheat-pill"><strong>IEC — International Electrotechnical Commission</strong><span>Founded 1906. Develops international standards for electrical, electronic, and related technologies. Partner with ISO for technology-related standards — which is why information security standards carry the "ISO/IEC" prefix.</span></div>
    </div>
    <div class="highlight-box">ISO 27001 belongs to a family of related standards called the <strong>ISO/IEC 27000 series</strong>. Each standard in the series addresses a specific aspect of information security management. Understanding the family helps explain ISO 27001's place in the broader landscape.</div>
    <p>Key standards in the ISO 27000 family:</p>
    <div class="badge-row">
      <span class="badge badge-gray">ISO 27000 — Overview and vocabulary (definitions)</span>
      <span class="badge badge-gray">ISO 27001 — Requirements (the certifiable standard)</span>
      <span class="badge badge-gray">ISO 27002 — Code of practice (guidance for implementing controls)</span>
      <span class="badge badge-gray">ISO 27005 — Information security risk management</span>
      <span class="badge badge-gray">ISO 27017 — Cloud security controls</span>
      <span class="badge badge-gray">ISO 27018 — Cloud privacy protection</span>
      <span class="badge badge-gray">ISO 27701 — Privacy information management (PIMS extension)</span>
    </div>
    <div class="analogy-box"><strong>27001 vs 27002 — the most important distinction:</strong> ISO 27001 is the <em>requirements</em> standard — it specifies what an ISMS must do and is what organizations certify against. ISO 27002 is the <em>guidance</em> standard — it provides detailed implementation guidance for each of the controls in Annex A of 27001. Think of 27001 as the exam questions and 27002 as the textbook that helps you answer them. Organizations must conform to 27001; they use 27002 as implementation guidance.</div>`,
    quiz: { q: "What is the key difference between ISO 27001 and ISO 27002?", opts: ["They are identical standards with different names", "ISO 27001 contains the requirements for certification (what must be done); ISO 27002 provides detailed implementation guidance (how to do it) for the controls in 27001's Annex A", "ISO 27002 is for cloud environments only", "ISO 27001 is for large organizations; ISO 27002 is for small ones"], ans: 1, explain: "ISO 27001 specifies the requirements that an ISMS must meet — organizations certify against ISO 27001. ISO 27002 provides implementation guidance and best practice for the controls referenced in ISO 27001's Annex A — it's the 'how to' companion document. Organizations use both, but only 27001 is the certification standard." }
  },
  {
    title: "The Information Security Management System (ISMS)",
    tagline: "The core concept that makes ISO 27001 different from every other security standard",
    body: `<p>The most important concept in all of ISO 27001 is the <span class="key-term">Information Security Management System (ISMS)</span>. Every clause, every control, every requirement in ISO 27001 is either part of the ISMS or serves to build and maintain it. If you understand what an ISMS is and why it matters, you understand ISO 27001.</p>
    <div class="highlight-box">ISO 27001 defines an ISMS as: a set of policies, procedures, processes, and systems that manage information security risks, covering the overall management of information security within an organization. The ISMS is not a piece of software. It's not a checklist. It's a <em>management system</em> — a systematic, documented, and continuously improving approach to managing information security.</div>
    <p>What makes an ISMS different from just "doing security":</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Systematic</strong><span>Every security decision follows a documented process — not ad hoc judgment. Risk assessments are formal. Control selection is documented and justified. Nothing is done randomly.</span></div>
      <div class="cheat-pill"><strong>Documented</strong><span>Policies, procedures, risk assessments, control implementations, and evidence of operations are written down. If it isn't documented, for audit purposes, it didn't happen.</span></div>
      <div class="cheat-pill"><strong>Risk-Based</strong><span>The ISMS is calibrated to the organization's specific risk profile — not a generic list of controls applied to every situation. Controls are selected because they address identified risks.</span></div>
      <div class="cheat-pill"><strong>Continuously Improving</strong><span>The ISMS is not static. Regular internal audits, management reviews, and the PDCA cycle ensure it improves over time as threats evolve and the organization changes.</span></div>
    </div>
    <div class="analogy-box"><strong>ISMS vs. "doing security" analogy:</strong> A person who eats vegetables occasionally is "doing health." A person with a documented nutrition plan, scheduled medical checkups, tracked health metrics, and a process for adjusting based on results has a health management system. ISO 27001 is the difference between "doing security" (ad hoc, reactive) and having an ISMS (systematic, documented, proactive, continuously improving). Both people care about health — but the outcomes are dramatically different.</div>
    <div class="info-box"><strong>Scope matters enormously:</strong> An ISMS has a defined scope — specific parts of the organization, specific systems, specific locations. An organization can certify an ISMS covering only one business unit, one geographic location, or one product. This flexibility makes ISO 27001 achievable for organizations of any size — but the scope must be honest and meaningful. A scope carefully designed to exclude all high-risk activities is not a credible ISMS.</div>`,
    quiz: { q: "What distinguishes an ISMS from simply having good security tools and practices?", opts: ["An ISMS requires more expensive security products", "An ISMS is systematic, documented, risk-based, and continuously improving — providing a structured management approach rather than ad hoc security decisions", "An ISMS only applies to cloud environments", "An ISMS means you have passed a security audit"], ans: 1, explain: "An ISMS provides systematic, documented, risk-based, and continuously improving management of information security. Organizations without an ISMS may have excellent security tools and practices — but without the management system, there's no consistent process for identifying risks, rationally deciding which controls to implement, monitoring effectiveness, and improving over time." }
  },
  {
    title: "The High-Level Structure and PDCA Cycle",
    tagline: "ISO 27001's architecture — and why it looks familiar",
    body: `<p>ISO 27001 follows ISO's <span class="key-term">High-Level Structure (HLS)</span> — the same 10-clause framework used by ISO 42001 (AI management), ISO 9001 (quality), and ISO 14001 (environment). This shared structure has two important implications: the frameworks integrate easily with each other, and learning ISO 27001's structure prepares you for all other ISO management system standards.</p>
    <div class="highlight-box">The 10-clause HLS structure of ISO 27001:<br><br>
    Clauses 1–3: Introduction (scope, normative references, terms) — informational only, not auditable requirements<br>
    Clause 4: Context of the Organization<br>
    Clause 5: Leadership<br>
    Clause 6: Planning<br>
    Clause 7: Support<br>
    Clause 8: Operation<br>
    Clause 9: Performance Evaluation<br>
    Clause 10: Improvement<br><br>
    Plus Annex A: Information Security Controls (93 controls in the 2022 version)</div>
    <p>These clauses map directly to the <span class="key-term">PDCA Cycle</span> — Plan, Do, Check, Act — which is the engine of continuous improvement in all ISO management systems:</p>
    <div class="pdca-grid">
      <div class="pdca-plan"><strong style="color:#0C447C">PLAN (Clauses 4, 5, 6)</strong><br><span style="font-size:12px;color:#1a1a18">Understand context. Get leadership commitment. Identify risks. Select controls. Set objectives. Design the ISMS.</span></div>
      <div class="pdca-do"><strong style="color:#085041">DO (Clauses 7, 8)</strong><br><span style="font-size:12px;color:#1a1a18">Provide resources. Train people. Implement controls. Run operations. Execute the plan.</span></div>
      <div class="pdca-check"><strong style="color:#633806">CHECK (Clause 9)</strong><br><span style="font-size:12px;color:#1a1a18">Monitor performance. Measure effectiveness. Internal audit. Management review. Verify it works.</span></div>
      <div class="pdca-act"><strong style="color:#501313">ACT (Clause 10)</strong><br><span style="font-size:12px;color:#1a1a18">Fix nonconformities. Take corrective action. Continually improve. Then Plan again.</span></div>
    </div>
    <div class="analogy-box"><strong>Why the cycle never stops:</strong> The PDCA cycle is called a cycle because it never ends. After you Act and improve, you Plan again — with better information than before. The threat landscape changes, your organization changes, technology changes. The ISMS must evolve with those changes. An ISO 27001 certification isn't a destination — it's a commitment to continuous improvement of security management.</div>`,
    quiz: { q: "Which PDCA phase does Clause 9 (Performance Evaluation) of ISO 27001 correspond to?", opts: ["Plan — because you're planning how to measure", "Do — because you're doing the measurement", "Check — because you're verifying that the ISMS is working as intended", "Act — because you're acting on information"], ans: 2, explain: "Clause 9 (Performance Evaluation) corresponds to the Check phase of PDCA. It covers monitoring, measurement, analysis, evaluation, internal audit, and management review — all of which verify whether the ISMS is working as intended and identify what needs to improve." }
  },
  {
    title: "Clause 4 — Context of the Organization (Part 1)",
    tagline: "Knowing your environment before you can design your security",
    body: `<p><span class="key-term">Clause 4</span> begins the ISMS by requiring organizations to deeply understand their context — both the environment they operate in and the people who have a stake in their information security. This understanding drives everything that follows: the scope of the ISMS, the risk assessment, the control selection, and the objectives.</p>
    <div class="clause-card"><b>Clause 4.1 — Understanding the Organization and Its Context</b><br>Determine external and internal factors that are relevant to the organization's purpose and affect the ISMS's ability to achieve its intended outcomes. This isn't a bureaucratic exercise — it's the foundation for a risk assessment that reflects reality rather than generic assumptions.</div>
    <p>External factors to consider:</p>
    <div class="badge-row">
      <span class="badge badge-gray">Regulatory environment — GDPR, HIPAA, sector-specific laws</span>
      <span class="badge badge-gray">Industry standards — customer security requirements, market expectations</span>
      <span class="badge badge-gray">Threat landscape — current attack trends affecting your sector</span>
      <span class="badge badge-gray">Technology environment — cloud adoption, supply chain dependencies</span>
      <span class="badge badge-gray">Geopolitical factors — data sovereignty requirements, international operations</span>
    </div>
    <p>Internal factors to consider:</p>
    <div class="badge-row">
      <span class="badge badge-blue">Business strategy and objectives that the ISMS must support</span>
      <span class="badge badge-blue">Organizational structure and culture</span>
      <span class="badge badge-blue">Existing information systems and their interdependencies</span>
      <span class="badge badge-blue">Current security capabilities and resources</span>
      <span class="badge badge-blue">Historical security incidents and near-misses</span>
    </div>
    <div class="analogy-box"><strong>Context changes everything:</strong> A payment processor's ISMS looks completely different from a research university's ISMS — even if both are ISO 27001 certified. The payment processor faces PCI-DSS requirements, sophisticated financial crime attackers, and high-value transaction data. The university faces open-access culture expectations, research IP theft threats, and diverse user populations. Context analysis ensures the ISMS is built for the actual organization, not a generic template.</div>
    <div class="highlight-box">Clause 4.1 is where organizations document the issues that will shape their entire ISMS. Auditors routinely ask to see this analysis — and a weak or superficial context analysis is a red flag that the entire ISMS may be generic rather than genuinely tailored to the organization's actual risk environment.</div>`,
    quiz: { q: "Why does ISO 27001 require understanding external and internal context (Clause 4.1) before building the ISMS?", opts: ["Because it is the easiest clause to demonstrate", "Because context determines what risks are relevant, what controls are appropriate, and how the ISMS should be designed — a generic ISMS without context understanding addresses the wrong risks", "Because regulators require a context analysis document", "Because ISO 27002 mandates it"], ans: 1, explain: "Context analysis is foundational because it drives the entire ISMS design. The risks a retail bank faces are completely different from those of a hospital or a startup. Without understanding external threats, regulations, and internal organizational factors, the subsequent risk assessment will be generic rather than targeted — and the controls selected will be poorly matched to the actual risks." }

  {
    title: "Clause 4 — Interested Parties and Scope",
    tagline: "Who cares about your security — and what does your ISMS actually cover?",
    body: `<p>The second half of Clause 4 addresses two critical questions: who has a stake in the organization's information security, and what exactly does the ISMS cover? These decisions have significant implications throughout the rest of the ISMS.</p>
    <div class="clause-card"><b>Clause 4.2 — Understanding Needs and Expectations of Interested Parties</b><br>Identify parties with a stake in the ISMS and their specific requirements. Their requirements become inputs to the ISMS design — some may even become compliance obligations.</div>
    <p>Typical interested parties in an ISO 27001 ISMS:</p>
    <div class="badge-row">
      <span class="badge badge-gray">Customers requiring security assurance (contractual obligations)</span>
      <span class="badge badge-gray">Regulators setting mandatory security standards</span>
      <span class="badge badge-gray">Shareholders expecting appropriate risk management</span>
      <span class="badge badge-gray">Employees with expectations about protecting their own data</span>
      <span class="badge badge-gray">Business partners with contractual security expectations</span>
      <span class="badge badge-gray">Cyber insurers requiring minimum security standards</span>
    </div>
    <div class="clause-card"><b>Clause 4.3 — Determining the Scope of the ISMS</b><br>Define the boundaries and applicability of the ISMS — which parts of the organization, which locations, which systems, and which processes are included. The scope must be documented and made available to interested parties.</div>
    <div class="analogy-box"><strong>Scope is a strategic decision:</strong> An organization can scope the ISMS broadly (covering the entire organization and all systems) or narrowly (covering only a specific business unit, product, or geographic location). A narrow scope reduces the certification effort — but it also reduces the assurance value. A customer asking "is your customer data management system in scope?" needs to hear yes. Scoping out the most critical systems undermines the certification's credibility.</div>
    <div class="clause-card"><b>Clause 4.4 — Information Security Management System</b><br>Establish, implement, maintain, and continually improve the ISMS in accordance with ISO 27001. This clause is the commitment clause — it says "now that you understand your context, actually build the system."</div>
    <div class="highlight-box"><strong>Scope creep in reverse:</strong> The most common scope mistake is making the scope too narrow to be credible — excluding the most sensitive systems or highest-risk activities to make certification easier. Certification bodies are aware of this and auditors will challenge scopes that seem designed to avoid difficult areas. The scope should reflect genuine information security management, not a carefully curated low-risk slice of the organization.</div>`,
    quiz: { q: "An organization scopes its ISO 27001 ISMS to exclude its customer database management system because it is the most complex to secure. Why is this problematic?", opts: ["Because it makes the certification more expensive", "Because scoping out the most sensitive or complex systems creates a certification that provides no assurance for the areas customers actually care about most — making the certification misleading", "Because ISO 27001 requires all systems to be in scope", "Because excluding systems is not permitted under ISO 27001"], ans: 1, explain: "ISO 27001 doesn't prohibit narrow scopes, but scoping out the most sensitive systems creates a certification that misleads interested parties. A customer relying on ISO 27001 certification to assess information security trusts that the certification covers meaningful operations. Discovering the most critical system is excluded would legitimately undermine confidence in the entire certification." }

  {
    title: "Clause 5 — Leadership and Commitment",
    tagline: "Why security must be owned at the top of the organization",
    body: `<p><span class="key-term">Clause 5</span> — Leadership — is where ISO 27001 makes its most important cultural demand: information security must be owned, championed, and actively supported by top management. This isn't about having an executive sponsor on a project plan. It's about genuine accountability at the board and CEO level.</p>
    <div class="clause-card"><b>Clause 5.1 — Leadership and Commitment</b><br>Top management must demonstrate leadership and commitment by: taking accountability for ISMS effectiveness, ensuring information security policy aligns with strategy, integrating ISMS requirements into business processes, making resources available, communicating the importance of security management, and promoting continual improvement.</div>
    <div class="highlight-box"><strong>The "demonstrate" requirement:</strong> ISO 27001 doesn't just require leadership to approve a security policy. It requires them to <em>demonstrate</em> commitment through visible, documentable actions. Auditors look for evidence of leadership involvement: signed policies, management review records, board-level security discussions, resource allocation decisions. A CEO who delegates security entirely to IT has not demonstrated leadership commitment under ISO 27001.</div>
    <div class="clause-card"><b>Clause 5.2 — Information Security Policy</b><br>Top management must establish an information security policy that: is appropriate to the organization's purpose, includes information security objectives or a framework for setting them, includes commitment to satisfying applicable requirements, includes commitment to continual improvement, and is communicated within the organization and available to interested parties.</div>
    <div class="analogy-box"><strong>The tone at the top effect:</strong> Research consistently shows that the single most powerful predictor of security program effectiveness is senior leadership's visible commitment to security. When employees see the CEO attending security briefings, when the board asks security questions, when security resources are protected from budget cuts — the message throughout the organization is clear: security matters. ISO 27001 codifies this insight into a formal requirement.</div>
    <div class="clause-card"><b>Clause 5.3 — Organizational Roles, Responsibilities, and Authorities</b><br>Top management must assign and communicate responsibilities and authorities for information security roles. Key roles include the ISMS owner (often the CISO), information asset owners, and internal auditors. Every significant security activity must have a named accountable person.</div>
    <div class="warning-box"><strong>The CISO role and ISO 27001:</strong> ISO 27001 doesn't mandate a specific role title — but it does require that clear responsibility exists. Many organizations create the CISO (Chief Information Security Officer) position specifically to fulfill Clause 5.3's accountability requirements. The ISMS owner is typically the most senior person responsible for the ISMS's effectiveness — and they must have sufficient authority to act, not just advise.</div>`,
    quiz: { q: "ISO 27001 Clause 5.1 requires top management to 'demonstrate' leadership commitment. What distinguishes demonstrating from simply approving?", opts: ["There is no difference — approval is sufficient demonstration", "Demonstrating requires visible, documentable actions — attending security reviews, allocating resources, communicating importance, holding people accountable — not just signing a policy document", "Demonstration only requires annual security awareness training completion", "Only the CEO can demonstrate leadership commitment"], ans: 1, explain: "Demonstrating leadership commitment under Clause 5.1 requires visible, auditable evidence of active engagement — signed policies, management review participation, resource allocation decisions, board-level security discussions. Simply approving a security policy document without ongoing active involvement does not satisfy the demonstration requirement." }

  {
    title: "Clause 6 — Planning: Risks and Opportunities",
    tagline: "Before you can secure anything, you must understand what you're securing it against",
    body: `<p><span class="key-term">Clause 6</span> is where the ISMS moves from context and commitment to concrete planning — specifically, what risks exist and what the organization will do about them. The risk assessment is the intellectual heart of ISO 27001.</p>
    <div class="clause-card"><b>Clause 6.1.1 — Actions to Address Risks and Opportunities</b><br>When planning for the ISMS, the organization must determine risks and opportunities that need to be addressed to ensure the ISMS achieves its intended outcomes, prevents or reduces undesired effects, and achieves continual improvement.</div>
    <div class="clause-card"><b>Clause 6.1.2 — Information Security Risk Assessment</b><br>Define and apply an information security risk assessment process that: establishes risk acceptance criteria, ensures repeated assessments produce consistent and comparable results, identifies risks associated with the loss of confidentiality, integrity, and availability of information, analyzes and evaluates those risks. The process must be documented.</div>
    <p>The three core concepts in information security risk:</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Confidentiality</strong><span>Information is only accessible to those authorized to access it. Breached by unauthorized disclosure, data theft, or exposure of sensitive information to unintended parties.</span></div>
      <div class="cheat-pill"><strong>Integrity</strong><span>Information is accurate and complete, and cannot be modified by unauthorized parties without detection. Breached by unauthorized modification, data corruption, or tampering.</span></div>
      <div class="cheat-pill"><strong>Availability</strong><span>Authorized users can access information and systems when needed. Breached by denial-of-service attacks, system failures, ransomware, or natural disasters disrupting access.</span></div>
    </div>
    <div class="analogy-box"><strong>The CIA Triad in everyday terms:</strong> Your bank account has confidentiality (only you and authorized bank staff can see your balance), integrity (the balance can't be changed to a wrong number without authorization), and availability (you can access your account when you need it). ISO 27001 requires identifying and assessing risks to all three properties across all information assets in scope — then systematically deciding how to manage those risks.</div>
    <div class="highlight-box">ISO 27001 does NOT prescribe a specific risk assessment methodology — organizations can use ISO 27005, NIST SP 800-30, OCTAVE, or any other structured methodology. What it does require is that the methodology is documented, produces consistent results, and is applied systematically. The risk assessment cannot be a one-time exercise — it must be reviewed periodically and when significant changes occur.</div>`,
    quiz: { q: "A company discovers that its customer portal can be accessed by guessing user IDs without authentication. In CIA Triad terms, which properties are primarily affected?", opts: ["Only Availability — the system is still running", "Confidentiality (unauthorized access to customer data) and Integrity (potential for unauthorized modification of customer records) are primarily affected", "Only Integrity — data accuracy is affected", "CIA Triad doesn't apply to authentication systems"], ans: 1, explain: "Authentication bypass primarily threatens Confidentiality (attackers can access other customers' data — unauthorized disclosure) and Integrity (attackers could modify records without authorization). Availability is not directly threatened — the system is accessible, though to the wrong people. The CIA Triad helps systematically think through the full impact of security vulnerabilities." }
  },
  {
    title: "Clause 6 — Risk Treatment and Statement of Applicability",
    tagline: "Deciding what to do about identified risks — and proving your decisions",
    body: `<p>Identifying risks is only half the work in Clause 6. Once risks are assessed, the organization must decide what to do about each one — this is called <span class="key-term">risk treatment</span>. And then it must produce one of ISO 27001's most important documents: the <span class="key-term">Statement of Applicability (SoA)</span>.</p>
    <div class="clause-card"><b>Clause 6.1.3 — Information Security Risk Treatment</b><br>Apply the risk treatment process to select appropriate risk treatment options (modify, retain, avoid, or share/transfer the risk). Determine all controls necessary to implement the chosen risk treatment options. Produce a risk treatment plan. Obtain risk owner sign-off on residual risk.</div>
    <p>The four risk treatment options:</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Modify (Mitigate)</strong><span>Implement controls to reduce the likelihood or impact of the risk to an acceptable level. The most common treatment — most risks are treated by implementing security controls.</span></div>
      <div class="cheat-pill"><strong>Retain (Accept)</strong><span>Consciously accept the risk because the cost of mitigation exceeds the expected loss, or the risk is within acceptable tolerance. Must be an explicit, documented decision — not just inaction.</span></div>
      <div class="cheat-pill"><strong>Avoid</strong><span>Stop the activity that creates the risk entirely. If storing certain data creates unacceptable risk, stop storing it. If a cloud provider is too risky, don't use them. Elimination rather than mitigation.</span></div>
      <div class="cheat-pill"><strong>Share/Transfer</strong><span>Transfer the financial impact to another party — typically through cyber insurance or contractual obligations on vendors. The risk itself doesn't disappear; the financial consequence is shared.</span></div>
    </div>
    <div class="clause-card"><b>The Statement of Applicability (SoA)</b><br>The SoA is a mandatory document listing all Annex A controls, stating whether each is implemented, and providing justification for inclusions and exclusions. It is the key audit document connecting the risk assessment to the control implementation — proving that control selection was deliberate and risk-based rather than arbitrary.</div>
    <div class="analogy-box"><strong>The SoA as the bridge:</strong> The SoA connects risk to controls. For every implemented Annex A control, the SoA shows which risk(s) it addresses. For every excluded control, it explains why the risk is not applicable, is already addressed another way, or has been accepted. A well-crafted SoA tells the story of the entire ISMS in a single document — making it the centerpiece of every ISO 27001 certification audit.</div>`,
    quiz: { q: "An organization identifies the risk of customer data being stolen through a phishing attack. After analysis, they decide to implement security awareness training and email filtering rather than stopping customer data collection. Which risk treatment option is this?", opts: ["Avoid — they are stopping a risky activity", "Retain — they are accepting the risk without controls", "Modify (Mitigate) — they are implementing controls to reduce the risk to an acceptable level", "Share — they are transferring risk to another party"], ans: 2, explain: "Implementing security awareness training and email filtering to reduce the likelihood and impact of a phishing-driven data breach is risk modification (mitigation). They are not avoiding the risk (which would mean not collecting customer data), accepting it without controls (retain), or transferring it (insurance/contractual). Mitigation is the most common risk treatment option in information security." }
  },
  {
    title: "Clause 6 — Information Security Objectives",
    tagline: "Setting measurable targets for your security program",
    body: `<p>Risk treatment planning tells you what controls to implement. But ISO 27001 also requires setting specific, measurable <span class="key-term">information security objectives</span> — targets that tell you whether the ISMS is actually achieving its goals, not just whether controls are in place.</p>
    <div class="clause-card"><b>Clause 6.2 — Information Security Objectives and Planning to Achieve Them</b><br>Establish information security objectives at relevant functions and levels. Objectives must be consistent with the information security policy, measurable (where practicable), take into account applicable requirements, be monitored, be communicated, and be updated as appropriate. The organization must determine what will be done, what resources are required, who is responsible, when it will be completed, and how results will be evaluated.</div>
    <p>What makes good information security objectives under ISO 27001:</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Specific</strong><span>"Reduce average time to patch critical vulnerabilities from 30 days to 7 days" — not "improve patching."</span></div>
      <div class="cheat-pill"><strong>Measurable</strong><span>Include a metric that can be tracked — percentage, count, time period. If you can't measure it, you can't manage it.</span></div>
      <div class="cheat-pill"><strong>Achievable</strong><span>Realistic given resources, timeline, and starting point. Objectives set for failure destroy program credibility.</span></div>
      <div class="cheat-pill"><strong>Time-bound</strong><span>With a specific deadline — not "eventually" or "ongoing." Deadlines create accountability.</span></div>
      <div class="cheat-pill"><strong>Owned</strong><span>Each objective has a named person accountable for achieving it. Shared ownership is no ownership.</span></div>
      <div class="cheat-pill"><strong>Aligned</strong><span>Objectives flow from the information security policy and address identified risks — not arbitrary technical metrics disconnected from business security goals.</span></div>
    </div>
    <div class="analogy-box"><strong>Objectives vs. controls:</strong> A control is "implement multi-factor authentication." An objective is "achieve 100% MFA adoption for all privileged accounts by Q2." The control describes what's implemented; the objective measures whether it's achieving its intended outcome. ISO 27001 requires both — controls without objectives leave you unable to answer "is our security program working?"</div>
    <div class="warning-box"><strong>Objective inflation:</strong> The most common objective-setting mistake is creating so many objectives that none receives adequate attention — or setting objectives so easy that achieving them demonstrates nothing meaningful about security improvement. ISO 27001 requires a thoughtful, focused set of objectives tied to the most significant risks and improvement opportunities, not an exhaustive list of every possible security metric.</div>`,
    quiz: { q: "An information security objective states 'We will improve our incident response capability.' Is this a well-formed ISO 27001 objective?", opts: ["Yes — it is clearly defined and achievable", "No — it is too vague. A well-formed objective would specify what 'improved' means measurably, by when, who is responsible, and how progress will be evaluated", "Yes — as long as it appears in the ISMS documentation", "No — incident response objectives must reference Annex A controls"], ans: 1, explain: "This objective fails ISO 27001's requirements because it is not measurable (what does 'improved' mean?), not time-bound (by when?), and not clearly owned (who is responsible?). A conforming objective might be: 'Reduce mean time to detect security incidents from 72 hours to 24 hours, measured monthly through our SIEM, achieved by Q3, owned by the Security Operations team.'" }
  },
  {
    title: "Clause 7 — Support: Resources and Competence",
    tagline: "Governance without resources is wishful thinking",
    body: `<p><span class="key-term">Clause 7</span> — Support — addresses the practical resources that make the ISMS function: people, money, knowledge, skills, and information. The most elegant ISMS design fails without adequate support to implement and operate it.</p>
    <div class="clause-card"><b>Clause 7.1 — Resources</b><br>Determine and provide the resources needed for the establishment, implementation, maintenance, and continual improvement of the ISMS. Resources include: personnel (security team, IT staff, management time), technology (security tools, monitoring systems), budget, and expert knowledge (internal or external).</div>
    <div class="clause-card"><b>Clause 7.2 — Competence</b><br>Determine the necessary competence for persons doing work under the organization's control that affects information security performance. Ensure those persons are competent based on appropriate education, training, or experience. Take action to acquire necessary competence where gaps exist. Retain documented evidence of competence.</div>
    <div class="highlight-box"><strong>Competence vs. awareness:</strong> Clause 7.2 is about competence — the actual ability to perform security functions. Clause 7.3 (awareness) is about general knowledge of the ISMS. The system administrator responsible for implementing access controls needs technical competence. Every employee needs awareness. These are different requirements addressed by different training programs.</div>
    <div class="clause-card"><b>Clause 7.3 — Awareness</b><br>Persons doing work under the organization's control must be aware of: the information security policy, their contribution to ISMS effectiveness, the implications of not conforming to ISMS requirements, and their specific security responsibilities. Awareness is the baseline for all employees; competence is the deeper requirement for those with security-specific roles.</div>
    <div class="analogy-box"><strong>The competence gap in security:</strong> One of the most common ISMS failures is the gap between documented security requirements and the actual competence of staff to implement them. An organization can have perfect policies requiring multi-factor authentication configuration, encryption key management, and security incident analysis — but if the staff responsible for these activities lack the technical skills to do them correctly, the policies are worthless. Clause 7.2 requires systematically identifying and addressing these gaps.</div>
    <div class="info-box"><strong>Training records are audit evidence:</strong> "We provide security training" is a claim. Training completion records, competency assessments, and certifications are evidence. ISO 27001 auditors will ask to see documented evidence of competence and awareness activities — not just descriptions of programs that theoretically exist.</div>`,
    quiz: { q: "An organization's ISMS requires network segmentation to be implemented and maintained. The IT administrator responsible has no formal networking training and learned on the job. Which Clause 7 requirement does this raise concerns about?", opts: ["Clause 7.1 — Resources (insufficient budget)", "Clause 7.2 — Competence (the responsible person may lack the necessary formal competence for a critical security task)", "Clause 7.3 — Awareness (general security awareness)", "Clause 7.4 — Communication (the requirement wasn't communicated)"], ans: 1, explain: "Clause 7.2 requires that persons performing work affecting information security performance are competent based on appropriate education, training, or experience. Network segmentation is a complex security control where implementation errors can have severe consequences — the organization must verify the IT administrator has the necessary competence and address any gaps through training or other means." }
  },
  {
    title: "Clause 7 — Communication and Documentation",
    tagline: "The right information reaching the right people, in the right way",
    body: `<p>The final requirements of Clause 7 address communication — how the ISMS information flows inside and outside the organization — and documentation — the written records that prove the ISMS exists and operates.</p>
    <div class="clause-card"><b>Clause 7.4 — Communication</b><br>Determine what needs to be communicated about the ISMS: what, when, to whom (internal and external), how, and by whom. This covers both planned communication (regular security updates to management, awareness campaigns for staff, responses to customer security questionnaires) and triggered communication (incident notifications, policy updates).</div>
    <div class="clause-card"><b>Clause 7.5 — Documented Information</b><br>Create and maintain documented information required by ISO 27001 and any additional documentation the organization determines is necessary. Documented information must be: available and suitable when needed, adequately protected (against loss of confidentiality, improper use, or loss of integrity), controlled for changes (version management), and retained appropriately.</div>
    <p>ISO 27001 mandatory documented information includes:</p>
    <div class="badge-row">
      <span class="badge badge-gray">Scope of the ISMS (Clause 4.3)</span>
      <span class="badge badge-gray">Information security policy (Clause 5.2)</span>
      <span class="badge badge-gray">Information security risk assessment process (Clause 6.1.2)</span>
      <span class="badge badge-gray">Information security risk treatment process (Clause 6.1.3)</span>
      <span class="badge badge-gray">Information security objectives (Clause 6.2)</span>
      <span class="badge badge-gray">Evidence of competence (Clause 7.2)</span>
      <span class="badge badge-gray">Statement of Applicability (Clause 6.1.3)</span>
      <span class="badge badge-gray">Risk assessment results (Clause 8.2)</span>
      <span class="badge badge-gray">Risk treatment plan results (Clause 8.3)</span>
      <span class="badge badge-gray">Evidence of monitoring and measurement (Clause 9.1)</span>
      <span class="badge badge-gray">Internal audit programme and results (Clause 9.2)</span>
