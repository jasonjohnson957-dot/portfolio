<script>
const days = [
  {
    title: "What Are the CIS Controls?",
    tagline: "The world's most widely adopted cybersecurity best practices",
    body: `<p>Imagine you're in charge of protecting a school's computer systems. There are thousands of different cybersecurity tools, techniques, and recommendations out there. How do you know which ones actually matter most? Which ones will prevent the most attacks? Where do you start? That's exactly the problem the <span class="key-term">CIS Controls</span> were designed to solve.</p>
    <p>The CIS Controls — officially called the <strong>CIS Critical Security Controls</strong> — are a prioritized set of best practices for cybersecurity. They are published by the <strong>Center for Internet Security (CIS)</strong>, a nonprofit organization. The current version is <strong>CIS Controls v8</strong>, released in May 2021, which contains <strong>18 Controls</strong> and <strong>153 Safeguards</strong>.</p>
    <div class="analogy-box"><strong>Real-world analogy:</strong> Think of the CIS Controls like a "most wanted" list for cybersecurity defenses. Just like law enforcement prioritizes the most dangerous criminals first, the CIS Controls prioritize the defenses that stop the most attacks. They're not a random list of everything you could possibly do for security — they're a ranked list of what you <em>must</em> do to prevent the most common, damaging attacks.</div>
    <p>What makes the CIS Controls unique:</p>
    <div class="badge-row">
      <span class="badge badge-purple">Evidence-based — developed from real attack data</span>
      <span class="badge badge-purple">Prioritized — ordered by impact and effectiveness</span>
      <span class="badge badge-purple">Prescriptive — specific enough to actually implement</span>
      <span class="badge badge-purple">Free — publicly available at no cost</span>
      <span class="badge badge-purple">Scalable — tiered for organizations of all sizes</span>
    </div>
    <div class="highlight-box">CIS Controls are sometimes called "CIS-18" (referring to the 18 controls in v8) or the "SANS Top 20" (the older name from when there were 20 controls). Both refer to the same framework. CIS Controls v8 is the current standard, and throughout this course, "CIS Controls" means CIS Controls v8 unless otherwise specified.</div>`,
    quiz: { q: "How many Controls and Safeguards does CIS Controls v8 contain?", opts: ["20 Controls and 200 Safeguards", "18 Controls and 153 Safeguards", "15 Controls and 100 Safeguards", "18 Controls and 200 Safeguards"], ans: 1, explain: "CIS Controls v8, released in May 2021, contains 18 Controls and 153 Safeguards. The 18 Controls represent high-level categories of cybersecurity activity, while the 153 Safeguards are the specific actions organizations take to implement each control." }
  },
  {
    title: "Why Were the CIS Controls Created?",
    tagline: "How a group of US government security experts changed cybersecurity forever",
    body: `<p>The story of the CIS Controls begins with a frustrating reality in the early 2000s: organizations were spending enormous amounts of money on cybersecurity — and still getting breached. The problem wasn't a lack of security products or awareness. The problem was that nobody agreed on what to actually do first.</p>
    <div class="highlight-box"><strong>The original insight (2008):</strong> The CIS Controls were first developed through a collaboration between US government agencies — including the NSA, the Department of Energy, and US Cyber Command — and private sector security experts. They analyzed actual attack data from real intrusions and asked a powerful question: "What are attackers actually doing? And what defenses would have stopped them?" The controls that emerged were directly reverse-engineered from real attacks.</div>
    <div class="analogy-box"><strong>The doctor analogy:</strong> Imagine if doctors had no agreed-upon protocols for treating common illnesses — every doctor made it up as they went. Medicine fixed this by studying what treatments actually worked and publishing evidence-based guidelines. The CIS Controls did the same for cybersecurity: instead of every organization guessing which security measures to implement, they analyzed what attackers actually do and built a prioritized defense guide based on that evidence.</div>
    <p>Several key problems drove the creation of the CIS Controls:</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Analysis Paralysis</strong><span>Too many security frameworks, standards, and recommendations existed with no clear priority order. Organizations didn't know where to start.</span></div>
      <div class="cheat-pill"><strong>Compliance vs. Security</strong><span>Organizations were passing compliance audits but still getting breached — proving that checkbox compliance wasn't the same as effective security.</span></div>
      <div class="cheat-pill"><strong>Attacker Advantage</strong><span>Attackers only need to find one weakness. Defenders felt overwhelmed trying to protect everything equally. A prioritized list of critical defenses was needed.</span></div>
      <div class="cheat-pill"><strong>Resource Constraints</strong><span>Most organizations — especially small ones — couldn't implement every possible security control. They needed guidance on what mattered most for their limited resources.</span></div>
    </div>`,
    quiz: { q: "What was the fundamental methodology behind the original development of the CIS Controls?", opts: ["They were based on the most expensive security products available", "They were reverse-engineered from real attack data — analyzing what attackers actually do and building defenses that would stop those specific attacks", "They were created by copying ISO 27001 into a simpler format", "They were developed by surveying which security tools were most popular"], ans: 1, explain: "The CIS Controls were originally developed by analyzing real intrusion data to understand what attackers actually do — then building defenses specifically designed to stop those attack patterns. This evidence-based, attacker-centric approach is what distinguishes the CIS Controls from frameworks built from theory or regulatory requirements." }
  },
  {
    title: "The Center for Internet Security (CIS)",
    tagline: "The nonprofit organization behind the world's most used security controls",
    body: `<p>The <span class="key-term">Center for Internet Security (CIS)</span> is a nonprofit organization founded in 2000 and headquartered in East Greenbush, New York. CIS develops and maintains cybersecurity best practices for both public and private sectors — including not just the CIS Controls but also the widely used CIS Benchmarks (detailed configuration hardening guides).</p>
    <div class="highlight-box">CIS's mission: "Making the connected world a safer place for people, businesses, and governments through our core competencies of collaboration and innovation." As a nonprofit, CIS makes its core resources — including the CIS Controls and CIS Benchmarks — available free of charge, funded through government contracts, membership fees, and product licensing.</div>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>CIS Controls</strong><span>The 18 prioritized cybersecurity best practices we're studying in this course. Provide the "what to do" at a high level for any organization.</span></div>
      <div class="cheat-pill"><strong>CIS Benchmarks</strong><span>Detailed technical configuration guides for specific systems — Windows, Linux, AWS, Azure, Kubernetes, browsers, databases. Over 100 benchmarks available free. The most widely accepted system hardening standards in the world.</span></div>
      <div class="cheat-pill"><strong>CIS-CAT Pro</strong><span>An automated tool that scans systems and measures how well they comply with CIS Benchmarks — identifying configuration gaps and generating remediation reports.</span></div>
      <div class="cheat-pill"><strong>Multi-State ISAC (MS-ISAC)</strong><span>CIS operates the MS-ISAC, which provides cyber threat intelligence, incident response support, and security services to US state, local, tribal, and territorial governments at no cost.</span></div>
    </div>
    <div class="analogy-box"><strong>Why "nonprofit" matters for credibility:</strong> Unlike security frameworks published by commercial vendors (who have an incentive to make everything sound necessary so you buy their products), CIS has no financial stake in which specific controls or tools you implement. The CIS Controls recommend defenses, not products — making them one of the most trusted, vendor-neutral security resources available. Any vendor claiming their product "implements the CIS Controls" must be evaluated critically.</div>
    <div class="info-box"><strong>CIS Controls Community:</strong> The CIS Controls are developed through an open, community-driven process involving hundreds of security professionals from industry, government, and academia who volunteer their expertise. This consensus process ensures the controls reflect practical real-world experience, not just theoretical best practices.</div>`,
    quiz: { q: "Why does CIS's nonprofit status contribute to the credibility of the CIS Controls?", opts: ["Nonprofits are legally required to produce more accurate security guidance", "CIS has no financial stake in which specific products you implement — making the controls vendor-neutral and trusted as genuinely evidence-based recommendations", "Nonprofits receive government funding that guarantees accuracy", "CIS is affiliated with the US Department of Defense"], ans: 1, explain: "CIS's nonprofit status means it has no financial incentive to recommend specific products or solutions. The CIS Controls recommend security practices, not particular vendors. This vendor-neutrality is a key reason the controls are widely trusted — organizations know the recommendations are based on what actually works, not on commercial relationships." }
  },
  {
    title: "CIS Controls History — From SANS Top 20 to CIS-18",
    tagline: "How the controls evolved from government intel to a global standard",
    body: `<p>The CIS Controls have undergone significant evolution over their 15+ year history. Understanding this evolution helps explain why the current v8 structure exists and why it represents a genuine advance over earlier versions.</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>2008 — SANS Top 20 (v1)</strong><span>First published as the "Consensus Audit Guidelines" by a consortium of US government agencies and security experts. 20 controls based on attack data from NSA and others. Quickly adopted across government and critical infrastructure.</span></div>
      <div class="cheat-pill"><strong>2010 — SANS Takes Over</strong><span>The SANS Institute becomes primary publisher. The list becomes known as the "SANS Critical Security Controls" or "SANS Top 20." Gains widespread private sector adoption. Updated periodically as the threat landscape evolves.</span></div>
      <div class="cheat-pill"><strong>2015 — CIS Assumes Stewardship (v5)</strong><span>The Center for Internet Security takes over maintenance from SANS. The framework is renamed "CIS Critical Security Controls." Maintains 20 controls but with significant content updates.</span></div>
      <div class="cheat-pill"><strong>2019 — CIS Controls v7.1</strong><span>Major update introducing sub-controls organized by Implementation Group (IG1/IG2/IG3). Expands applicability to organizations of all sizes. Adds coverage of cloud, mobile, and modern IT environments. Still 20 controls.</span></div>
      <div class="cheat-pill"><strong>2021 — CIS Controls v8 (Current)</strong><span>Most significant restructuring. Controls reduced from 20 to 18. Sub-controls renamed "Safeguards." Implementation Groups retained. Better reflects modern IT environments with cloud and remote work. Activity-centric rather than device-centric.</span></div>
      <div class="cheat-pill"><strong>Future Versions</strong><span>CIS updates the Controls every 3–5 years as the threat landscape evolves. v8 is the current version as of this writing. Organizations should track CIS's release schedule and plan transitions when new versions are published.</span></div>
    </div>
    <div class="highlight-box"><strong>Why v8 reduced from 20 to 18 controls:</strong> The restructuring wasn't just renumbering — it was a fundamental rethinking. Several older controls were merged because their activities naturally belong together in modern IT environments. The move from 20 to 18 reflects consolidation around activities rather than specific technologies, making the framework more applicable across cloud, hybrid, and traditional environments.</div>`,
    quiz: { q: "What significant change did CIS Controls v8 (2021) make to the framework structure compared to v7?", opts: ["Increased from 18 to 20 controls", "Reduced from 20 to 18 controls and renamed sub-controls as 'Safeguards' — reflecting a more activity-centric approach for modern IT environments", "Added a fourth Implementation Group for critical infrastructure", "Removed the cloud computing controls"], ans: 1, explain: "CIS Controls v8 reduced the controls from 20 to 18 by merging related controls and restructuring around activities rather than specific technologies. Sub-controls were renamed 'Safeguards.' This consolidation makes v8 better suited for modern environments that blend cloud, on-premises, and remote work rather than the device-centric world the earlier versions were designed for." }
  },
  {
    title: "The Architecture of CIS Controls v8",
    tagline: "Controls, Safeguards, and how they're organized",
    body: `<p>Before diving into each individual control, it's essential to understand how the CIS Controls framework is structured. Understanding the architecture makes navigating and implementing the controls much more straightforward.</p>
    <div class="highlight-box"><strong>Two levels of structure:</strong><br><br><strong>Controls (18 total):</strong> High-level categories of cybersecurity activity. Each Control represents a major area of security practice — like "Access Control Management" or "Incident Response Management." Think of Controls as the chapter headings of the cybersecurity playbook.<br><br><strong>Safeguards (153 total):</strong> Specific, actionable security practices within each Control. Each Safeguard describes a specific thing your organization should DO — a concrete security activity. Think of Safeguards as the specific instructions within each chapter.</div>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Safeguard Structure</strong><span>Each Safeguard has: a number (e.g., 1.1, 1.2), a title, a description of the activity, an asset type it protects, a security function it performs, and an Implementation Group assignment.</span></div>
      <div class="cheat-pill"><strong>Asset Types</strong><span>Each Safeguard applies to a specific type of asset: Devices, Software, Data, Users, Network, or Services. This categorization helps organizations understand what they're protecting with each control.</span></div>
      <div class="cheat-pill"><strong>Security Functions</strong><span>Each Safeguard maps to one of five security functions borrowed from the NIST Cybersecurity Framework: Identify, Protect, Detect, Respond, or Recover. This mapping helps organizations understand each control's purpose.</span></div>
      <div class="cheat-pill"><strong>Implementation Groups (IG1/IG2/IG3)</strong><span>Each Safeguard is assigned to one Implementation Group — IG1, IG2, or IG3. This assignment determines which organizations need to implement that Safeguard. We'll cover IGs in detail tomorrow.</span></div>
    </div>
    <div class="analogy-box"><strong>Controls vs. Safeguards in practice:</strong> CIS Control 5 is "Account Management." That's the Control — the chapter heading. Safeguard 5.1 says "Establish and Maintain an Inventory of Accounts." Safeguard 5.2 says "Use Unique Passwords." Safeguard 5.3 says "Disable Dormant Accounts." Each Safeguard is a specific, concrete action. The Control is the umbrella concept; the Safeguards are what you actually implement.</div>`,
    quiz: { q: "What is the difference between a CIS Control and a CIS Safeguard?", opts: ["They are the same thing with different names", "A Control is a high-level category of security activity; a Safeguard is a specific, actionable security practice within that Control", "Controls are for large organizations; Safeguards are for small ones", "Controls are mandatory; Safeguards are optional"], ans: 1, explain: "Controls are high-level categories (the 18 major areas of cybersecurity practice), while Safeguards are specific, concrete actions to take within each Control. CIS v8 has 18 Controls and 153 Safeguards. The Controls answer 'what domain?' and the Safeguards answer 'what specifically should we do?'" }
  },
  {
    title: "Implementation Groups — IG1, IG2, IG3",
    tagline: "Making CIS Controls work for organizations of every size",
    body: `<p>One of CIS Controls v8's most important features is the <span class="key-term">Implementation Group (IG)</span> system. This tiered approach acknowledges a fundamental reality: a 10-person dental practice and a national bank should not have identical cybersecurity requirements. The IG system makes the CIS Controls proportionate, practical, and scalable.</p>
    <div class="ig-grid">
      <div class="ig1">
        <strong style="color:#27500A">IG1 — Essential</strong><br>
        <strong style="font-size:11px;color:#27500A">56 Safeguards</strong><br>
        <span style="font-size:12px;color:#1a1a18;display:block;margin-top:4px">Small organizations with limited IT expertise. Low data sensitivity. Resource-constrained. Basic "cyber hygiene" — the absolute minimum every organization must do. If you do nothing else, do IG1.</span>
      </div>
      <div class="ig2">
        <strong style="color:#633806">IG2 — Foundational</strong><br>
        <strong style="font-size:11px;color:#633806">74 Safeguards (includes all IG1)</strong><br>
        <span style="font-size:12px;color:#1a1a18;display:block;margin-top:4px">Mid-size organizations. Handle sensitive data. Have dedicated IT staff but not necessarily a full security team. Multiple departments with different risk profiles. Moderate budget for security.</span>
      </div>
      <div class="ig3">
        <strong style="color:#4A1B0C">IG3 — Organizational</strong><br>
        <strong style="font-size:11px;color:#4A1B0C">153 Safeguards (all Safeguards)</strong><br>
        <span style="font-size:12px;color:#1a1a18;display:block;margin-top:4px">Large organizations. Handle highly sensitive data. Regulated industries. Have dedicated security teams. Subject to complex compliance requirements. Significant resources for security.</span>
      </div>
    </div>
    <div class="highlight-box">IG1 is <em>not</em> optional for any organization — it represents essential cyber hygiene that every organization with computers and internet connectivity should implement. IG2 adds depth for organizations with more resources and responsibility. IG3 represents comprehensive security for organizations with the most sensitive data and highest risk profiles. The IGs are cumulative: IG2 includes all IG1 Safeguards, and IG3 includes all IG1 and IG2 Safeguards.</div>
    <div class="analogy-box"><strong>The home vs. bank analogy:</strong> Your home has locks on the doors and windows (IG1 — basic security everyone needs). A small business might add an alarm system and a safe (IG2 — more protection for more sensitive assets). A bank has armed guards, vaults, surveillance cameras, and intrusion detection (IG3 — maximum protection for the most sensitive assets). Each level builds on the last, proportionate to risk.</div>`,
    quiz: { q: "A 15-person medical billing company handles PHI but has only one part-time IT person. Which CIS Implementation Group is the baseline for their security program?", opts: ["IG3 — because they handle medical data", "IG1 — as the essential baseline every organization must implement, with IG2 as the next target given their PHI handling", "IG2 only — IG1 is too basic", "No IG applies — they should use HIPAA instead"], ans: 1, explain: "IG1 is the essential baseline every organization must implement — it represents the minimum cyber hygiene regardless of size or sector. Given that the company handles PHI, IG2 should be their near-term target (since they handle sensitive data), but IG1 is the starting point. The IGs are cumulative — you always start with IG1 and build up." }
  },
  {
    title: "CIS Control 1 — Inventory and Control of Enterprise Assets",
    tagline: "You can't protect what you don't know you have",
    body: `<p><span class="key-term">CIS Control 1</span> is the logical foundation of the entire framework: <strong>Inventory and Control of Enterprise Assets</strong>. You cannot protect systems you don't know exist. You cannot patch vulnerabilities on devices that aren't in your inventory. You cannot detect unauthorized access to assets you've never documented. Everything in cybersecurity starts here.</p>
    <div class="highlight-box">CIS Control 1 requires: actively managing (inventorying, tracking, and correcting) all enterprise assets — including end-user devices, network devices, IoT devices, and servers. Both connected to the enterprise network AND those with the potential to connect. The goal is that only authorized and managed assets are allowed to connect.</div>
    <p>Key Safeguards in Control 1:</p>
    <div class="ctrl-num"><b>1.1</b> — Establish and Maintain Detailed Enterprise Asset Inventory: Maintain an accurate, detailed, and up-to-date inventory of all enterprise assets — hardware addresses, IP addresses, asset type, owner, and department. Update at least monthly or when new assets are added. [IG1]</div>
    <div class="ctrl-num"><b>1.2</b> — Address Unauthorized Assets: Ensure unauthorized assets are either removed, quarantined, or added to the inventory with documented exceptions. If a device isn't in the inventory, it shouldn't be on the network. [IG1]</div>
    <div class="ctrl-num"><b>1.3</b> — Utilize an Active Discovery Tool: Use an active discovery tool to identify assets that connect to enterprise infrastructure. Passive tools alone miss devices that are turned off or intermittently connected. [IG2]</div>
    <div class="ctrl-num"><b>1.4</b> — Use Dynamic Host Configuration Protocol (DHCP) Logging to Update Enterprise Asset Inventory: Use DHCP server logs to update the asset inventory automatically when devices connect. [IG2]</div>
    <div class="ctrl-num"><b>1.5</b> — Use a Passive Asset Discovery Tool: Use passive monitoring to capture assets that active scanning might miss — particularly IoT devices that may not respond to active probes. [IG3]</div>
    <div class="analogy-box"><strong>The hospital supply room analogy:</strong> A hospital that doesn't know exactly what medical equipment it has — where each device is, who's responsible for it, whether it's been calibrated recently — cannot function safely. A surgeon can't use equipment that's been lost, an unaccounted-for device could harbor infection, and equipment can't be maintained without an accurate inventory. IT assets work exactly the same way: without a complete inventory, security is impossible.</div>`,
    quiz: { q: "Why is CIS Control 1 (Asset Inventory) considered the foundation of the entire CIS Controls framework?", opts: ["Because it is the most expensive control to implement", "Because you cannot protect, patch, monitor, or respond to incidents involving assets you don't know exist — inventory is the prerequisite for all other security activities", "Because asset inventory is required by all regulations", "Because Control 1 has the most Safeguards"], ans: 1, explain: "Control 1 is foundational because every other security activity depends on knowing what you're protecting. You can't patch vulnerabilities on unknown devices, can't monitor traffic from untracked assets, can't respond to incidents involving devices you don't know exist, and can't control access to systems that aren't inventoried. Asset inventory is the prerequisite for all subsequent security controls." }
  },
  {
    title: "CIS Control 2 — Inventory and Control of Software Assets",
    tagline: "If you don't know what software is running, you can't secure it",
    body: `<p><span class="key-term">CIS Control 2</span> extends the inventory concept from hardware to software: <strong>Inventory and Control of Software Assets</strong>. Just as unknown hardware devices are a security risk, unknown and unauthorized software creates significant attack surface — through vulnerabilities in unpatched applications, malware disguised as legitimate software, or unlicensed software with hidden risks.</p>
    <div class="highlight-box">Control 2 requires: actively managing all software on enterprise assets — including operating systems and applications — so that only authorized software is installed. Unauthorized software must be prevented from installation or immediately detected and removed. This concept is called "whitelisting" or more precisely, "allowlisting."</div>
    <p>Key Safeguards in Control 2:</p>
    <div class="ctrl-num"><b>2.1</b> — Establish and Maintain a Software Inventory: Maintain an inventory of all authorized software on all enterprise assets — title, publisher, initial install/use date, and business purpose. Review and update at least monthly. [IG1]</div>
    <div class="ctrl-num"><b>2.2</b> — Ensure Authorized Software is Currently Supported: Only use software supported by the vendor with active security updates. Unsupported software cannot receive security patches — it becomes permanently vulnerable. [IG1]</div>
    <div class="ctrl-num"><b>2.3</b> — Address Unauthorized Software: Ensure unauthorized software is either removed or documented as an approved exception. Active scanning for unauthorized software should be conducted. [IG1]</div>
    <div class="ctrl-num"><b>2.4</b> — Utilize Automated Software Inventory Tools: Use software inventory tools to automate the detection and tracking of installed software across all enterprise assets. [IG2]</div>
    <div class="ctrl-num"><b>2.5</b> — Allowlist Authorized Software: Use technical controls to ensure only explicitly authorized software can execute on enterprise assets. Block or quarantine unauthorized executable attempts. [IG3]</div>
    <div class="analogy-box"><strong>The "shadow IT" problem:</strong> An employee downloads a free file-sharing app to work more efficiently. Nobody authorized it, nobody knows it's there, and it hasn't been checked for security vulnerabilities or data privacy risks. This is shadow IT — unauthorized software running on enterprise systems. Control 2 requires organizations to actively prevent and detect this, because unauthorized software is one of the most common initial attack vectors.</div>`,
    quiz: { q: "CIS Control 2 requires that organizations only use software that is 'currently supported.' Why is unsupported software such a significant security risk?", opts: ["Because unsupported software is slower", "Because software vendors stop releasing security patches for unsupported products — meaning any newly discovered vulnerabilities can never be fixed, leaving the software permanently exploitable", "Because unsupported software violates software licensing laws", "Because CIS doesn't certify unsupported software"], ans: 1, explain: "When software reaches end-of-life (becomes unsupported), the vendor stops releasing security patches. Any new vulnerabilities discovered after that point can never be officially fixed, creating permanently exploitable security holes. Attackers specifically target organizations running unsupported software because they know those vulnerabilities can never be patched." }

  {
    title: "CIS Control 3 — Data Protection",
    tagline: "Identifying, classifying, and securing your most valuable information",
    body: `<p><span class="key-term">CIS Control 3</span> — <strong>Data Protection</strong> — focuses on developing processes and technical controls to identify, classify, securely handle, retain, and dispose of data. Assets matter; software matters; but ultimately, <em>data</em> is what attackers are really after. This control ensures that data itself is treated as the critical asset it is.</p>
    <div class="highlight-box">Control 3 is built on the concept of data classification — recognizing that not all data deserves equal protection. A company's public press releases need minimal protection. Customer credit card numbers need maximum protection. A data protection program must first understand what data exists, then apply proportionate controls based on sensitivity.</div>
    <p>Key Safeguards in Control 3:</p>
    <div class="ctrl-num"><b>3.1</b> — Establish and Maintain a Data Management Process: Establish a data management process — including data inventory, data sensitivity classification, data handling requirements, and data retention and disposal schedules. [IG1]</div>
    <div class="ctrl-num"><b>3.2</b> — Establish and Maintain a Data Inventory: Document all data collection, processing, and storage locations — including third parties who hold organizational data. Update at least annually. [IG1]</div>
    <div class="ctrl-num"><b>3.3</b> — Configure Data Access Control Lists: Configure data access control lists — restricting access to data based on user's need. Not everyone in the organization should see everything. [IG1]</div>
    <div class="ctrl-num"><b>3.4</b> — Enforce Data Retention: Retain data according to legal and regulatory requirements. Delete data that is no longer needed to reduce the attack surface. [IG1]</div>
    <div class="ctrl-num"><b>3.5</b> — Securely Dispose of Data: Use a secure data disposal process. Ensure that sensitive data cannot be recovered from decommissioned devices or deleted files. [IG1]</div>
    <div class="ctrl-num"><b>3.6</b> — Encrypt Data on End-User Devices: Encrypt data on end-user devices that contain sensitive data — using full disk encryption on laptops, for example. [IG1]</div>
    <div class="ctrl-num"><b>3.11</b> — Encrypt Sensitive Data in Transit: Encrypt sensitive data when transmitted across networks, using TLS or equivalent protocols. Never transmit sensitive data in cleartext. [IG2]</div>
    <div class="analogy-box"><strong>Why "delete when done" matters:</strong> Every piece of data you store is a potential liability — it can be stolen, it costs money to protect, and it creates compliance obligations. Control 3's data retention requirements reflect a simple principle: don't keep data longer than you need it. The data you don't have can never be breached.</div>`,
    quiz: { q: "CIS Control 3 requires encrypting data on end-user devices. Why is this specifically important for laptops?", opts: ["Laptops are more likely to have viruses", "Laptops are frequently lost or stolen — encryption ensures that even if physical access is gained, the data cannot be read without the encryption key", "Laptops use less powerful processors that need encryption", "Only laptops are covered by data privacy regulations"], ans: 1, explain: "Full disk encryption on laptops is critical because laptops are frequently lost or stolen — left in cars, forgotten in airports, or taken in physical break-ins. Without encryption, anyone who obtains the physical device has complete access to all its data. With encryption, the data is unreadable without the correct credentials, even with physical access to the hardware." }

  {
    title: "CIS Control 4 — Secure Configuration",
    tagline: "Default settings are almost always insecure — lock things down",
    body: `<p><span class="key-term">CIS Control 4</span> — <strong>Secure Configuration of Enterprise Assets and Software</strong> — addresses one of the most pervasive and preventable security problems: insecure default configurations. Systems, operating systems, applications, and network devices come "out of the box" configured for ease of use and broad compatibility — not for security. Fixing this is Control 4's mission.</p>
    <div class="highlight-box">Default configurations are inherently dangerous because they are: publicly documented (attackers know exactly what the defaults are), designed for maximum compatibility (not minimum attack surface), and often include unnecessary services, open ports, weak passwords, and disabled security features. Control 4 requires establishing and maintaining secure configuration standards for all enterprise assets.</div>
    <p>Key Safeguards in Control 4:</p>
    <div class="ctrl-num"><b>4.1</b> — Establish and Maintain a Secure Configuration Process: Develop and document a secure configuration process for enterprise assets — hardware and software. Define who is responsible, how frequently configurations are reviewed, and how deviations are handled. [IG1]</div>
    <div class="ctrl-num"><b>4.2</b> — Establish and Maintain a Secure Configuration Process for Network Infrastructure: Specifically address network devices — routers, switches, firewalls, wireless access points. Network infrastructure misconfigurations are a primary attack vector. [IG1]</div>
    <div class="ctrl-num"><b>4.3</b> — Configure Automatic Session Locking on Enterprise Assets: Configure automatic session locking after a period of inactivity — preventing unauthorized access to unattended systems. [IG1]</div>
    <div class="ctrl-num"><b>4.4</b> — Implement and Manage a Firewall on Servers: Install and manage firewalls on all servers — not just at the network perimeter. Host-based firewalls provide protection even when perimeter defenses fail. [IG1]</div>
    <div class="ctrl-num"><b>4.7</b> — Manage Default Accounts on Enterprise Assets and Software: Manage default accounts — including disabling unused default accounts, changing default passwords, and removing unnecessary default services. [IG1]</div>
    <div class="analogy-box"><strong>The new router analogy:</strong> Every home router comes with a default username and password — usually "admin/admin" or something equally weak, published in the manual. Attackers know every manufacturer's defaults. If you never change these, anyone who accesses your network can take control of your router in seconds. CIS Control 4 applies this principle systematically across every device and application in an organization.</div>
    <div class="info-box"><strong>CIS Benchmarks are the implementation guide for Control 4:</strong> CIS publishes over 100 detailed Benchmarks — configuration guides for specific operating systems, cloud platforms, databases, and applications. These Benchmarks are the detailed technical specifications that organizations use to implement Control 4's secure configuration requirements.</div>`,
    quiz: { q: "Why are default configurations considered insecure in enterprise environments?", opts: ["Because they are too new to have been tested", "Because defaults are publicly documented, designed for maximum compatibility rather than security, and often include unnecessary services and weak credentials that attackers know and exploit", "Because defaults use too much bandwidth", "Because CIS hasn't approved them"], ans: 1, explain: "Default configurations are publicly documented in manufacturer manuals and online resources — attackers know exactly what every system's default settings are. They're designed for broad compatibility and ease of use, not security, meaning they often include unnecessary services (creating attack surface), weak default passwords (easily guessed), and disabled security features (deliberately relaxed for convenience)." }

  {
    title: "CIS Control 5 — Account Management",
    tagline: "Controlling the keys to your kingdom",
    body: `<p><span class="key-term">CIS Control 5</span> — <strong>Account Management</strong> — covers the complete lifecycle of user accounts: creation, maintenance, use, and termination. Compromised accounts are consistently one of the top attack vectors. Whether through stolen credentials, weak passwords, or forgotten dormant accounts, attackers frequently gain initial access through account-related weaknesses.</p>
    <div class="highlight-box">Account management means: knowing every account that exists, ensuring each account belongs to a known person with a business need, ensuring each account has only the access it needs, ensuring accounts are promptly disabled when no longer needed, and ensuring all accounts use strong authentication. Essentially: the right people have the right access at the right time — and nothing more.</div>
    <p>Key Safeguards in Control 5:</p>
    <div class="ctrl-num"><b>5.1</b> — Establish and Maintain an Inventory of Accounts: Maintain an inventory of all accounts — user, administrator, and service accounts — including the account's purpose and authorized approver. [IG1]</div>
    <div class="ctrl-num"><b>5.2</b> — Use Unique Passwords: Require unique, complex passwords for all accounts. Use a password manager to enable truly unique passwords across all systems without expecting humans to memorize them. [IG1]</div>
    <div class="ctrl-num"><b>5.3</b> — Disable Dormant Accounts: Disable accounts that have not been used in 45 days. Former employees, contractors, and service accounts for decommissioned systems are common sources of dormant accounts. [IG1]</div>
    <div class="ctrl-num"><b>5.4</b> — Restrict Administrator Privileges to Dedicated Administrator Accounts: Use separate accounts for administrative tasks. Administrators should use a standard account for everyday tasks and an admin account only when performing privileged operations. [IG1]</div>
    <div class="ctrl-num"><b>5.5</b> — Establish and Maintain an Inventory of Service Accounts: Track service accounts (non-human accounts used by applications and automated processes) separately. Service accounts are frequently overlooked and become persistent backdoors. [IG2]</div>
    <div class="ctrl-num"><b>5.6</b> — Centralize Account Management: Centralize account management through a directory — such as Active Directory or LDAP — enabling consistent authentication, access control, and auditing across all systems. [IG2]</div>
    <div class="analogy-box"><strong>The master key analogy:</strong> Imagine a hotel where housekeeping staff all have master keys that open every room — even though each staff member only cleans specific floors. If one key is stolen, the entire hotel is compromised. Good key management means each person gets a key to exactly what they need — nothing more. CIS Control 5 applies this principle to digital accounts.</div>`,
    quiz: { q: "An employee leaves the company but their accounts aren't disabled for two months. Which CIS Control 5 Safeguard specifically addresses this risk?", opts: ["5.1 — Account inventory", "5.2 — Unique passwords", "5.3 — Disable dormant accounts after 45 days", "5.4 — Restrict administrator privileges"], ans: 2, explain: "Safeguard 5.3 requires disabling accounts that haven't been used within 45 days. A former employee's account left active for months is a classic dormant account — it provides no business value but creates significant security risk if the former employee (or an attacker who obtained their credentials) attempts access." }

  {
    title: "CIS Control 6 — Access Control Management",
    tagline: "Making sure people can only access what they actually need",
    body: `<p><span class="key-term">CIS Control 6</span> — <strong>Access Control Management</strong> — goes beyond account existence to control what each account can actually access and do. While Control 5 manages accounts, Control 6 manages permissions — implementing the principle of least privilege across the organization's systems and data.</p>
    <div class="highlight-box"><strong>Principle of Least Privilege:</strong> Every user, service, and application should have only the minimum permissions necessary to perform its function — nothing more. This limits the damage an attacker can do with compromised credentials. If an attacker compromises a marketing employee's account, they shouldn't automatically have access to financial systems or customer databases that marketing doesn't need.</div>
    <p>Key Safeguards in Control 6:</p>
    <div class="ctrl-num"><b>6.1</b> — Establish an Access Granting Process: Establish a formal process for granting access to enterprise assets — requiring documented business justification, appropriate approval, and defined access levels. Don't grant access ad hoc without review. [IG1]</div>
    <div class="ctrl-num"><b>6.2</b> — Establish an Access Revoking Process: Establish a formal process for revoking access — triggered by role changes, terminations, or when access is no longer needed. Access revocation should be as prompt and systematic as access granting. [IG1]</div>
    <div class="ctrl-num"><b>6.3</b> — Require MFA for Externally-Exposed Applications: Require multi-factor authentication for all externally exposed applications — anything accessible from the internet. MFA dramatically reduces the risk of account compromise from stolen passwords. [IG1]</div>
    <div class="ctrl-num"><b>6.4</b> — Require MFA for Remote Network Access: Require MFA for remote network access — VPNs, remote desktop, and similar remote access methods. [IG1]</div>
    <div class="ctrl-num"><b>6.5</b> — Require MFA for Administrative Access: Require MFA for all administrative access — even on trusted internal networks. Admin accounts are the most valuable targets; they deserve the strongest authentication. [IG2]</div>
    <div class="ctrl-num"><b>6.6</b> — Establish and Maintain an Inventory of Authentication and Authorization Systems: Track all systems that manage authentication (identity providers, MFA systems, single sign-on platforms). Understand the authentication landscape to ensure no gaps. [IG2]</div>
    <div class="ctrl-num"><b>6.7</b> — Centralize Access Control: Centralize access control through an identity and access management (IAM) system — providing consistent access policies across all systems and enabling rapid access revocation when needed. [IG3]</div>
    <div class="analogy-box"><strong>Why MFA is IG1 (essential for everyone):</strong> Passwords alone are consistently the weakest link in security. They're reused, stolen, guessed, or phished. MFA adds a second factor — something you have (a phone, a hardware token) in addition to something you know (your password). Even if an attacker steals your password, they can't authenticate without the second factor. MFA is one of the highest-ROI security controls that exists.</div>`,
    quiz: { q: "CIS Control 6 places multi-factor authentication (MFA) for externally-exposed applications in IG1 — the essential baseline for all organizations. Why is MFA considered so fundamental?", opts: ["Because MFA is required by all government regulations", "Because passwords alone are consistently compromised through phishing, breaches, and reuse — MFA provides a second layer that prevents account takeover even when passwords are stolen", "Because MFA is inexpensive and easy to implement", "Because external applications are always more vulnerable than internal ones"], ans: 1, explain: "MFA is in IG1 because it is one of the single most effective controls against account compromise. Passwords are routinely stolen through phishing, credential stuffing, and data breaches. MFA means that even with a stolen password, an attacker cannot authenticate without the second factor — making it essential for any externally accessible application." }
  },
  {
    title: "CIS Control 7 — Continuous Vulnerability Management",
    tagline: "Finding and fixing security holes before attackers exploit them",
    body: `<p><span class="key-term">CIS Control 7</span> — <strong>Continuous Vulnerability Management</strong> — addresses the ongoing process of identifying, assessing, and remediating security vulnerabilities in enterprise assets. New vulnerabilities are discovered every day. Attackers know about them within hours. Organizations that don't have a systematic vulnerability management program are in a constant state of unknown — and therefore unmitigated — risk.</p>
    <div class="highlight-box">The vulnerability management lifecycle: Discover new vulnerabilities (via scanning and threat intelligence) → Assess severity and risk in your specific environment → Prioritize based on risk → Remediate by patching, configuring, or mitigating → Verify the fix worked → Monitor for new vulnerabilities. This process must be continuous — not an annual exercise.</div>
    <p>Key Safeguards in Control 7:</p>
    <div class="ctrl-num"><b>7.1</b> — Establish and Maintain a Vulnerability Management Process: Document the vulnerability management process — how vulnerabilities are identified, prioritized, and remediated. Assign ownership. Define timelines. [IG1]</div>
    <div class="ctrl-num"><b>7.2</b> — Establish and Maintain a Remediation Process: Establish remediation timelines based on severity. Critical vulnerabilities require faster remediation than low-severity ones. Document deviations with risk acceptance rationale. [IG1]</div>
    <div class="ctrl-num"><b>7.3</b> — Perform Automated Operating System Patch Management: Use automated tools to ensure operating systems receive security patches in a timely manner — without requiring manual intervention for every system. [IG1]</div>
    <div class="ctrl-num"><b>7.4</b> — Perform Automated Application Patch Management: Apply the same automated patching approach to applications — browsers, office software, plugins, and all enterprise applications. [IG1]</div>
    <div class="ctrl-num"><b>7.5</b> — Perform Automated Vulnerability Scans of Internal Enterprise Assets: Conduct quarterly vulnerability scans of all internal systems — using authenticated scanning for complete visibility into missing patches and misconfigurations. [IG2]</div>
    <div class="ctrl-num"><b>7.6</b> — Perform Automated Vulnerability Scans of Externally-Exposed Enterprise Assets: Scan external-facing systems more frequently than internal ones — monthly at minimum. External assets are directly exposed to attackers. [IG2]</div>
    <div class="ctrl-num"><b>7.7</b> — Remediate Detected Vulnerabilities: After scanning, actually fix what's found. Scanning without remediation creates a detailed map of weaknesses with no benefit — and potential liability if breached. [IG2]</div>
    <div class="analogy-box"><strong>The "patch window" reality:</strong> When a vendor releases a security patch, they are simultaneously telling the entire world — including attackers — that a vulnerability existed. Attackers use this information to craft exploits targeting unpatched systems. Historically, attackers begin exploiting newly disclosed vulnerabilities within 24–48 hours of public disclosure. Organizations that take 30–90 days to patch critical vulnerabilities are leaving known doors open for extended periods.</div>`,
    quiz: { q: "Why is vulnerability scanning without remediation potentially harmful?", opts: ["It wastes bandwidth", "It creates a detailed, documented map of an organization's security weaknesses — and if that documentation falls into the wrong hands or the organization is breached, it demonstrates known risks were not addressed", "Scanning tools can introduce new vulnerabilities", "It violates CIS guidance"], ans: 1, explain: "Scanning without remediation creates documented evidence that an organization knew about specific vulnerabilities and chose not to fix them — a problematic situation legally, regulatorily, and reputationally. It's worse than not scanning because you have a record of known, unaddressed risks. Scanning must always be paired with an active remediation program." }

  {
    title: "CIS Control 8 — Audit Log Management",
    tagline: "Recording everything that matters — then actually reviewing it",
    body: `<p><span class="key-term">CIS Control 8</span> — <strong>Audit Log Management</strong> — requires collecting, managing, protecting, and reviewing audit logs from enterprise assets. Logs are the security camera footage of your digital environment. Without them, you cannot detect attacks in progress, investigate incidents after the fact, or demonstrate compliance with security requirements.</p>
    <div class="highlight-box">The two failure modes of audit logging: (1) Not collecting logs at all — you're flying blind. (2) Collecting logs but never reviewing them — you have terabytes of data that tells you nothing because nobody looks at it. Control 8 addresses both: collect the right logs AND actively review and alert on them.</div>
    <p>Key Safeguards in Control 8:</p>
    <div class="ctrl-num"><b>8.1</b> — Establish and Maintain an Audit Log Management Process: Document what events are logged, how logs are stored, how long they're retained, and who reviews them. An ad hoc logging approach is not a logging strategy. [IG1]</div>
    <div class="ctrl-num"><b>8.2</b> — Collect Audit Logs: Collect audit logs covering authentication events, file access, system configuration changes, and network connections. Collect logs from all critical systems. [IG1]</div>
    <div class="ctrl-num"><b>8.3</b> — Ensure Adequate Audit Log Storage: Allocate sufficient storage for audit logs based on your log volume and retention requirements. Running out of log storage silently stops logging — often unnoticed until an incident occurs. [IG1]</div>
    <div class="ctrl-num"><b>8.4</b> — Standardize Time Synchronization: Synchronize all enterprise asset clocks to a consistent time source (NTP). Logs from systems with different times are nearly impossible to correlate during incident investigations. [IG1]</div>
    <div class="ctrl-num"><b>8.5</b> — Collect Detailed Audit Logs: Collect detailed event data beyond basic authentication — including command execution, file modifications, network connections, and privilege escalation. [IG2]</div>
    <div class="ctrl-num"><b>8.9</b> — Centralize Audit Logs: Collect all logs into a centralized log management system (SIEM — Security Information and Event Management). Centralization enables correlation, analysis, and alerting across all sources. [IG2]</div>
    <div class="ctrl-num"><b>8.11</b> — Conduct Audit Log Reviews: Conduct reviews of audit logs to identify anomalies or abnormal events. Automated alerting on known bad patterns should be supplemented by periodic human review. [IG2]</div>
    <div class="analogy-box"><strong>The time-sync lesson from real incidents:</strong> During a major 2011 cyberattack on RSA Security, investigators found that some systems' clocks were off by several hours. Correlating logs from different systems — essential for reconstructing the attack — was significantly hampered because timestamps didn't align. A simple NTP synchronization requirement (Safeguard 8.4) prevents this entirely preventable investigation challenge.</div>`,
    quiz: { q: "CIS Control 8 includes requiring time synchronization across all systems (Safeguard 8.4). Why is this a security requirement, not just an administrative convenience?", opts: ["Because it makes backups more efficient", "Because logs from systems with inconsistent clocks cannot be accurately correlated during incident investigation — making it impossible to reconstruct the timeline of an attack", "Because regulatory requirements mandate accurate clocks", "Because attackers can only exploit systems with incorrect time settings"], ans: 1, explain: "During incident investigations, analysts must reconstruct the exact sequence of events across many systems. If System A's logs say an event happened at 2:00 PM and System B's logs say it happened at 3:47 PM because the clock is wrong, the investigation timeline becomes unreliable or impossible to construct. Time synchronization is a forensic prerequisite that seems minor until you need it." }

  {
    title: "CIS Controls 9 and 10 — Email, Web, and Malware Defenses",
    tagline: "Protecting the most common attack paths into your organization",
    body: `<p><span class="key-term">CIS Control 9</span> — <strong>Email and Web Browser Protections</strong> — and <span class="key-term">CIS Control 10</span> — <strong>Malware Defenses</strong> — together address the most common initial attack vectors into organizations: malicious emails (phishing), malicious websites, and malware delivered through both channels.</p>
    <div class="highlight-box"><strong>Why email and web browsing are the top attack vectors:</strong> Studies consistently show that 90%+ of cyberattacks begin with a phishing email or a malicious website visit. Attackers focus their energy on these vectors because they're the most reliable path to reaching human users — who remain the weakest link in most organizations' security posture.</div>
    <p>Key Control 9 Safeguards:</p>
    <div class="ctrl-num"><b>9.1</b> — Ensure Use of Only Fully Supported Browsers and Email Clients: Use only browsers and email clients that receive active security updates. Old browsers and email clients contain known, unpatched vulnerabilities. [IG1]</div>
    <div class="ctrl-num"><b>9.2</b> — Use DNS Filtering Services: Use DNS filtering to block access to known malicious websites — before the connection is established. DNS filtering is highly effective against command-and-control traffic and drive-by downloads. [IG1]</div>
    <div class="ctrl-num"><b>9.3</b> — Maintain and Enforce Network-Based URL Filters: Block access to uncategorized websites and known malicious URLs at the network level. [IG2]</div>

    <div class="ctrl-num"><b>10.2</b> — Configure Automatic Anti-Malware Signature Updates: Ensure anti-malware signatures update automatically and frequently. Stale signature files miss new malware variants. [IG1]</div>

    quiz: { q: "Why does CIS place DNS filtering (Control 9, Safeguard 9.2) in IG1 — the essential baseline every organization must implement?", opts: ["Because DNS filtering is required by law", "Because DNS filtering is a high-impact, low-cost control that blocks access to known malicious sites before connections are established — protecting even unsophisticated users from common web-based attacks", "Because DNS filtering prevents all malware", "Because DNS filtering is the only way to block phishing emails"], ans: 1, explain: "DNS filtering is in IG1 because it is highly effective at low cost — it blocks connections to known malicious domains before any content is downloaded, protecting users even when they click malicious links. It's a network-level control that works automatically without requiring user awareness or action, making it one of the most high-ROI security controls available." }

  {
    title: "CIS Controls 11 and 12 — Data Recovery and Network Management",
    tagline: "Bouncing back from attacks and defending your network infrastructure",
    body: `<p><span class="key-term">CIS Control 11</span> — <strong>Data Recovery</strong> — and <span class="key-term">CIS Control 12</span> — <strong>Network Infrastructure Management</strong> — address two distinct but equally critical security domains: the ability to recover when things go wrong, and the protection of network infrastructure that attackers increasingly target.</p>
    <div class="highlight-box"><strong>Control 11: Data Recovery</strong> — Ransomware has made data recovery the most business-critical security control for many organizations. Organizations that maintain tested, isolated backups can recover from ransomware without paying a ransom. Those that don't face the choice between paying attackers or losing their data permanently.</div>
    <p>Key Control 11 Safeguards:</p>
    <div class="ctrl-num"><b>11.1</b> — Establish and Maintain a Data Recovery Process: Document the data recovery process — what gets backed up, how often, where backups are stored, and how recovery is performed. [IG1]</div>
    <div class="ctrl-num"><b>11.2</b> — Perform Automated Backups: Automate backups of in-scope enterprise assets. Rely on automated processes, not manual backup routines that are easily forgotten. [IG1]</div>
    <div class="ctrl-num"><b>11.3</b> — Protect Recovery Data: Protect backup data using the principle of least privilege and encryption. Attackers specifically target backup systems — if they can destroy your backups, ransomware becomes your only recovery option. [IG1]</div>
    <div class="ctrl-num"><b>11.4</b> — Establish and Maintain an Isolated Instance of Recovery Data: Maintain at least one backup instance in a location not continuously accessible to the rest of the network. Air-gapped or offline backups survive even complete ransomware incidents. [IG1]</div>
    <div class="ctrl-num"><b>11.5</b> — Test Data Recovery: Test data recovery at least quarterly. Many organizations discover their backups don't actually work during an incident — the worst time to find out. [IG2]</div>
    <p>Key Control 12 Safeguards — Network Infrastructure Management:</p>
    <div class="ctrl-num"><b>12.1</b> — Ensure Network Infrastructure is Up-to-Date: Ensure network devices run supported, patched firmware. Unpatched network devices are prime targets because they provide access to everything behind them. [IG1]</div>
    <div class="ctrl-num"><b>12.2</b> — Establish and Maintain a Secure Network Architecture: Segment the network — separate sensitive systems from general networks. A flat network where every device can reach every other device is an attacker's dream. [IG2]</div>
    <div class="ctrl-num"><b>12.6</b> — Use of Secure Network Management and Communication Protocols: Use encrypted protocols for all network management traffic — SSH instead of Telnet, HTTPS instead of HTTP, SNMPv3 instead of SNMP v1/2. [IG2]</div>
    <div class="analogy-box"><strong>The 3-2-1 backup rule:</strong> Data recovery best practice follows the "3-2-1 rule" — 3 copies of data, on 2 different media types, with 1 copy off-site (or isolated). Control 11's requirement for an isolated instance directly reflects this rule. Organizations that followed 3-2-1 during the WannaCry ransomware attack recovered quickly. Those that didn't faced weeks of downtime or paid ransoms.</div>`,
    quiz: { q: "CIS Control 11 requires maintaining 'an isolated instance of recovery data.' Why is this specifically important against ransomware attacks?", opts: ["Because isolated backups are faster to restore from", "Because ransomware often specifically seeks out and encrypts backup files — an isolated backup that ransomware cannot reach is the only way to recover without paying the ransom", "Because regulatory requirements mandate isolated backups", "Because regular backups are too large to store economically"], ans: 1, explain: "Modern ransomware specifically hunts for and encrypts backup files to eliminate recovery options and force ransom payment. An isolated backup — one not continuously connected to the main network — cannot be reached by ransomware. This is the critical difference between 'we got ransomwared but recovered in 4 hours' and 'we got ransomwared and paid $5 million or lost all our data.'" }

  {
    title: "CIS Control 13 — Network Monitoring and Defense",
    tagline: "Detecting attackers who are already inside your network",
    body: `<p><span class="key-term">CIS Control 13</span> — <strong>Network Monitoring and Defense</strong> — focuses on operating processes and tooling to establish comprehensive network monitoring and defense against threats. The assumption behind Control 13 is critical: not all attackers will be stopped at the perimeter. Some will get through. Network monitoring detects them before they can cause catastrophic damage.</p>
    <div class="highlight-box">The average "dwell time" — the time between an attacker first accessing a network and being detected — has historically been measured in months, not days. Attackers who operate undetected for months can cause vastly more damage than those detected in hours. Network monitoring dramatically reduces dwell time by identifying suspicious behavior as it occurs.</div>
    <p>Key Safeguards in Control 13:</p>
    <div class="ctrl-num"><b>13.1</b> — Centralize Security Event Alerting: Centralize security event alerting across enterprise assets using a SIEM or log aggregation platform. Aggregate events from multiple sources to detect patterns invisible in individual logs. [IG1]</div>
    <div class="ctrl-num"><b>13.2</b> — Deploy a Host-Based Intrusion Detection Solution: Deploy HIDS (Host-based Intrusion Detection Systems) to detect malicious activity at the individual device level. [IG2]</div>
    <div class="ctrl-num"><b>13.3</b> — Deploy a Network Intrusion Detection Solution: Deploy NIDS (Network Intrusion Detection Systems) to monitor network traffic for known attack patterns and anomalous behavior. [IG2]</div>
    <div class="ctrl-num"><b>13.4</b> — Perform Traffic Filtering Between Network Segments: Implement and enforce traffic filtering rules between network segments — not just between the internet and internal network. East-west traffic (between internal systems) requires filtering too. [IG2]</div>
    <div class="ctrl-num"><b>13.6</b> — Collect Network Traffic Flow Logs: Collect NetFlow or equivalent traffic flow logs from all network devices. Flow logs show who communicated with whom and when — essential for identifying command-and-control communications. [IG2]</div>
    <div class="ctrl-num"><b>13.7</b> — Deploy a Host-Based Intrusion Prevention Solution: Upgrade from detection to active prevention at the host level — automatically blocking detected malicious activity. [IG3]</div>
    <div class="ctrl-num"><b>13.8</b> — Deploy a Network Intrusion Prevention Solution: Upgrade from network detection to active network prevention — automatically blocking known attack traffic patterns. [IG3]</div>
    <div class="analogy-box"><strong>The "assume breach" mindset:</strong> Control 13 embodies the "assume breach" security philosophy — operate as if attackers will eventually get past your defenses, and build your capability to detect and respond when they do. Organizations focused entirely on prevention with no detection capability discover breaches months or years later, often from external parties (customers, law enforcement, journalists), not from their own monitoring.</div>`,
    quiz: { q: "The average historical 'dwell time' for attackers inside a network before detection has been measured in months. What does investing in Control 13 (Network Monitoring) directly address?", opts: ["It prevents attackers from entering the network in the first place", "It reduces dwell time by detecting suspicious behavior as it occurs — so attackers are discovered in hours or days rather than months, limiting the damage they can cause", "It stops ransomware from executing", "It prevents data exfiltration through encryption"], ans: 1, explain: "Network monitoring directly attacks the dwell time problem. While prevention controls aim to stop attacks before they start, monitoring detects attackers who get through — catching them early in the kill chain before they can accomplish their objectives. An attacker detected in day 2 causes dramatically less damage than one discovered in month 6." }

  {
    title: "CIS Control 14 — Security Awareness and Skills Training",
    tagline: "Your people are both the biggest vulnerability and the best defense",
    body: `<p><span class="key-term">CIS Control 14</span> — <strong>Security Awareness and Skills Training</strong> — addresses the human element of cybersecurity. Despite all the technical controls covered in previous lessons, humans remain the most exploited vulnerability in almost every organization. Phishing, social engineering, and insider threats all exploit human psychology rather than technical weaknesses. Training is the only way to address this.</p>
    <div class="highlight-box">Control 14 goes beyond generic annual "check-the-box" security awareness training. It requires: role-specific training for different job functions, training that addresses the actual threats employees face, regular reinforcement and testing (phishing simulations), and metrics to demonstrate training effectiveness. The goal is genuine security competence, not compliance theater.</div>
    <p>Key Safeguards in Control 14:</p>
    <div class="ctrl-num"><b>14.1</b> — Establish and Maintain a Security Awareness Program: Develop and maintain a comprehensive security awareness program — not just annual training, but an ongoing program with regular touchpoints and diverse learning formats. [IG1]</div>
    <div class="ctrl-num"><b>14.2</b> — Train Workforce Members to Recognize Social Engineering Attacks: Train all staff to recognize phishing, vishing (voice phishing), smishing (text phishing), and other social engineering techniques that bypass technical controls. [IG1]</div>
    <div class="ctrl-num"><b>14.3</b> — Train Workforce Members on Authentication Best Practices: Train employees on strong password practices, MFA usage, and the dangers of credential sharing and password reuse. [IG1]</div>
    <div class="ctrl-num"><b>14.4</b> — Train Workforce on Data Handling Best Practices: Ensure employees understand data classification, proper data handling, and the legal and organizational consequences of mishandling sensitive data. [IG1]</div>
    <div class="ctrl-num"><b>14.5</b> — Train Workforce Members on Causes of Unintentional Data Exposure: Train on accidental data exposure scenarios — emailing sensitive data to wrong recipients, leaving documents in public printers, working on sensitive data in public spaces. [IG1]</div>
    <div class="ctrl-num"><b>14.8</b> — Conduct Role-Specific Security Awareness and Skills Training: Provide role-specific training beyond general awareness — developers need secure coding training, system administrators need privileged access security, executives need targeted spear-phishing awareness. [IG2]</div>
    <div class="ctrl-num"><b>14.9</b> — Conduct Phishing Simulations: Regularly run phishing simulation campaigns — sending simulated phishing emails to employees and measuring click rates. Use results to target additional training for vulnerable groups. [IG2]</div>
    <div class="analogy-box"><strong>Why phishing simulations work:</strong> Telling someone "don't click suspicious links" is abstract. Showing someone that they personally clicked a simulated phishing email last month makes the risk concrete and personal. Phishing simulations consistently show that well-designed programs reduce click rates on simulated phishing emails by 60–80% over 12 months — a measurable security improvement from a purely human-focused intervention.</div>`,
    quiz: { q: "What distinguishes effective security awareness training (as required by CIS Control 14) from ineffective 'check-the-box' annual training?", opts: ["Duration — effective training must be at least 8 hours", "Ongoing reinforcement, role-specific content, phishing simulations, and measured outcomes — versus generic annual compliance training with no follow-up or measurement of effectiveness", "Cost — more expensive training is more effective", "Mandatory completion — all staff must pass the training"], ans: 1, explain: "Effective security awareness training per CIS Control 14 is ongoing (not just annual), role-specific (developers get different training than executives), tested with simulations, and measured for effectiveness. Generic annual compliance training that everyone sits through and immediately forgets does not produce behavior change — which is the actual security goal." }

  {
    title: "CIS Control 15 — Service Provider Management",
    tagline: "Your security is only as strong as your weakest vendor",
    body: `<p><span class="key-term">CIS Control 15</span> — <strong>Service Provider Management</strong> — addresses the security risks that come from third-party service providers. Modern organizations rely on dozens or hundreds of external service providers — cloud platforms, SaaS applications, managed security services, outsourced IT, and specialized vendors. Each one represents a potential attack vector into your organization.</p>
    <div class="highlight-box"><strong>The supply chain attack reality:</strong> The 2020 SolarWinds attack compromised over 18,000 organizations — including US government agencies — by inserting malicious code into a trusted software update from a widely-used vendor. Organizations with perfect internal security were breached through a third-party they trusted implicitly. Control 15 addresses this exact risk: extending your security requirements to the organizations you depend on.</div>
    <p>Key Safeguards in Control 15:</p>
    <div class="ctrl-num"><b>15.1</b> — Establish and Maintain an Inventory of Service Providers: Maintain a list of all third-party service providers, including what services they provide, what data they access, and what systems they connect to. [IG1]</div>
    <div class="ctrl-num"><b>15.2</b> — Establish and Maintain a Service Provider Management Policy: Create a formal policy governing how service providers are evaluated, selected, monitored, and terminated — with security requirements clearly defined. [IG1]</div>
    <div class="ctrl-num"><b>15.3</b> — Classify Service Providers: Classify service providers by the sensitivity of the data they access and the criticality of the services they provide. Higher-risk providers warrant more rigorous assessment and monitoring. [IG2]</div>
    <div class="ctrl-num"><b>15.4</b> — Ensure Service Provider Contracts Include Security Requirements: Include security requirements in all service provider contracts — required security standards, right-to-audit clauses, breach notification requirements, and data handling obligations. [IG2]</div>
    <div class="ctrl-num"><b>15.5</b> — Assess Service Providers: Assess providers before engaging them and periodically thereafter. Review their SOC 2 reports, HITRUST certifications, or other assurance documentation. Request security questionnaires for providers without certifications. [IG2]</div>
    <div class="ctrl-num"><b>15.6</b> — Monitor Service Providers: Monitor service providers for security incidents, certifications lapsing, and material changes to their security posture. A provider that passed assessment two years ago may have deteriorated significantly. [IG3]</div>
    <div class="analogy-box"><strong>Security is a chain:</strong> A security program is only as strong as its weakest link — and that link is often a third-party provider who has access to your systems or data. Most organizations rigorously secure their own environments while treating vendor access as an afterthought. Control 15 requires treating vendor security with the same rigor as internal security — because attackers don't distinguish between "your" systems and your vendor's systems if they both lead to your data.</div>`,
    quiz: { q: "The SolarWinds supply chain attack of 2020 compromised thousands of organizations through a trusted vendor's software update. Which CIS Control directly addresses this type of risk?", opts: ["Control 7 — Vulnerability Management", "Control 4 — Secure Configuration", "Control 15 — Service Provider Management", "Control 13 — Network Monitoring"], ans: 2, explain: "CIS Control 15 (Service Provider Management) directly addresses supply chain risks — the security practices of organizations that have access to your systems or data. The SolarWinds attack succeeded because organizations trusted software updates from a vendor without verifying their security. Control 15 requires assessing, monitoring, and contractually binding service providers to security standards." }

  {
    title: "CIS Control 16 — Application Software Security",
    tagline: "Building security into applications from the very beginning",
    body: `<p><span class="key-term">CIS Control 16</span> — <strong>Application Software Security</strong> — addresses the security of custom and third-party applications. Software vulnerabilities are among the most common attack vectors: SQL injection, cross-site scripting, authentication weaknesses, and insecure APIs give attackers direct access to systems and data that all other controls are trying to protect.</p>
    <div class="highlight-box">Control 16 is built on a core principle: security must be designed into applications, not bolted on after the fact. The cost of fixing a security flaw in production code is estimated to be 100 times higher than fixing it during design. Security testing after code is written finds flaws but misses architectural vulnerabilities baked into the design.</div>
    <p>Key Safeguards in Control 16:</p>
    <div class="ctrl-num"><b>16.1</b> — Establish and Maintain a Secure Application Development Process: Establish a secure Software Development Lifecycle (SDLC) — including security requirements, threat modeling, secure coding standards, and security testing requirements at each phase. [IG2]</div>
    <div class="ctrl-num"><b>16.2</b> — Establish and Maintain a Process to Accept and Address Software Vulnerabilities: Create a process for receiving, evaluating, and addressing vulnerability reports from internal security teams or external researchers. [IG2]</div>
    <div class="ctrl-num"><b>16.3</b> — Perform Root Cause Analysis on Security Vulnerabilities: When vulnerabilities are found, investigate why they occurred — not just how to fix the specific instance. Root cause analysis prevents the same class of vulnerability from appearing repeatedly. [IG2]</div>
    <div class="ctrl-num"><b>16.4</b> — Establish and Manage an Application Inventory: Maintain an inventory of custom-developed and third-party applications — including version, update schedule, and responsible owner. [IG2]</div>
    <div class="ctrl-num"><b>16.5</b> — Use Up-to-Date and Trusted Third-Party Software Components: Ensure third-party software components (libraries, frameworks, APIs) are up-to-date and from reputable sources. Vulnerable third-party components are responsible for a significant percentage of application security breaches. [IG2]</div>
    <div class="ctrl-num"><b>16.6</b> — Establish and Maintain a Severity Rating System for Software Vulnerabilities: Define severity ratings for software vulnerabilities to prioritize remediation. Not all vulnerabilities require the same urgency of response. [IG2]</div>
    <div class="ctrl-num"><b>16.8</b> — Separate Production and Non-Production Systems: Keep development, testing, and production environments separate. Using real customer data in test environments is a common, serious security violation. [IG2]</div>
    <div class="ctrl-num"><b>16.12</b> — Implement Code-Level Security Checks: Use static analysis (SAST), dynamic analysis (DAST), and software composition analysis (SCA) tools during development to identify vulnerabilities before deployment. [IG3]</div>
    <div class="analogy-box"><strong>The Log4Shell lesson:</strong> In December 2021, a vulnerability was discovered in Log4j — a Java logging library used in millions of applications worldwide. The vulnerability allowed remote code execution with a single line of input. Organizations that maintained an inventory of their software components (Control 16.4/16.5) could rapidly identify affected systems. Those with no software inventory spent weeks or months discovering they were vulnerable, often after being breached.</div>`,
    quiz: { q: "CIS Control 16 emphasizes keeping third-party software components (libraries, frameworks) up-to-date. Why was this made a specific IG2 Safeguard?", opts: ["Because third-party code is always poorly written", "Because vulnerable third-party components are a leading source of application security breaches — the Log4Shell vulnerability affected millions of applications that used a single vulnerable logging library", "Because third-party components cost more to license when outdated", "Because CIS certifies third-party software vendors"], ans: 1, explain: "Third-party components — libraries, frameworks, and SDKs included in applications — are frequently vulnerable and often untracked. Log4Shell (2021) demonstrated this at catastrophic scale: a single vulnerable library in millions of applications worldwide created one of the largest security events in history. Organizations that tracked their components (Control 16.4) could identify and patch affected systems; those that didn't faced weeks of frantic discovery work." }
