  {
    title: "CIS Control 17 — Incident Response Management",
    tagline: "What to do when — not if — a security incident occurs",
    body: `<p><span class="key-term">CIS Control 17</span> — <strong>Incident Response Management</strong> — addresses how organizations prepare for, detect, contain, eradicate, and recover from security incidents. The question is not whether your organization will face a security incident — it's whether you'll be prepared to respond effectively when one occurs. Organizations without an incident response plan consistently suffer more damage, longer downtime, and higher costs from incidents.</p>
    <div class="highlight-box">An incident response plan is NOT a document you write once, file away, and hope you never need. It is a living capability that must be exercised regularly, updated as your environment changes, and tested before you actually need it. Organizations that discover their IR plan has never been tested typically discover its flaws during an actual incident — the worst time to learn.</div>
    <p>Key Safeguards in Control 17:</p>
    <div class="ctrl-num"><b>17.1</b> — Designate Personnel to Manage Incident Handling: Designate specific people responsible for managing security incidents — not ad hoc responders discovered during the crisis. Everyone in the organization should know who to call when they suspect an incident. [IG1]</div>
    <div class="ctrl-num"><b>17.2</b> — Establish and Maintain Contact Information for Reporting Security Incidents: Maintain up-to-date contact information for internal IR teams, external IR vendors, law enforcement contacts, and regulatory bodies that require breach notification. [IG1]</div>
    <div class="ctrl-num"><b>17.3</b> — Establish and Maintain an Enterprise Security Incident Response Program: Document an enterprise-wide incident response plan — covering detection, escalation, containment, eradication, recovery, and post-incident review. [IG1]</div>
    <div class="ctrl-num"><b>17.4</b> — Establish and Maintain an Incident Severity Definition Schema: Define what constitutes different severity levels of incidents — ensuring consistent response prioritization. Not every alert is a critical incident; not every critical incident is treated with appropriate urgency. [IG1]</div>
    <div class="ctrl-num"><b>17.5</b> — Assign Key Roles and Responsibilities: Clearly assign incident response roles — who leads, who communicates with leadership, who handles technical containment, who manages legal and regulatory notifications. [IG2]</div>
    <div class="ctrl-num"><b>17.6</b> — Define Mechanisms for Communicating During Incident Response: Plan how the IR team will communicate when normal systems may be compromised. If email is compromised, you need an out-of-band communication channel — secure messaging, phone trees, pre-established bridge lines. [IG2]</div>
    <div class="ctrl-num"><b>17.7</b> — Conduct Routine Incident Response Exercises: Run tabletop exercises and simulated incident scenarios at least annually. Test whether the plan actually works before you depend on it during a real crisis. [IG2]</div>
    <div class="analogy-box"><strong>The fire drill analogy:</strong> Schools don't assume children will naturally know what to do during a fire — they run fire drills. Regular practice means that when a real emergency occurs, the response is automatic rather than panicked. Incident response exercises serve the same function: practicing the response until it becomes muscle memory ensures the team doesn't improvise under pressure when the stakes are highest.</div>`,
    quiz: { q: "CIS Control 17 emphasizes having out-of-band communication channels during incident response. Why can't the IR team simply use regular email and internal chat during a security incident?", opts: ["Because email is too slow during emergencies", "Because if the incident involves compromise of email or communication systems, the IR team would be communicating through channels the attacker can monitor or disrupt — defeating the response effort", "Because external parties can't receive internal email", "Because CIS prohibits email use during incidents"], ans: 1, explain: "If an attacker has compromised email systems (a common occurrence in advanced attacks), the IR team using email to coordinate their response gives the attacker visibility into the response strategy — and potentially the ability to disrupt it. Out-of-band communication (phone, secure messaging apps, pre-established conference bridges) ensures the response continues even when primary systems are compromised." }

  {
    title: "CIS Control 18 — Penetration Testing",
    tagline: "Hiring friendly attackers to find your weaknesses before real ones do",
    body: `<p><span class="key-term">CIS Control 18</span> — <strong>Penetration Testing</strong> — is the final control in the framework, and it serves as the ultimate validation of all the previous controls. Penetration testing (pen testing) involves simulating real-world attacks against your organization to identify vulnerabilities, misconfigurations, and control gaps that automated scanning and assessments miss.</p>
    <div class="highlight-box">Penetration testing answers the question that no other assessment can fully address: "If a skilled attacker tried to compromise our systems today, could they succeed — and how far could they get?" Vulnerability scanning finds known vulnerabilities. Penetration testing finds the creative, chained exploits that skilled attackers actually use — combining multiple weaknesses to achieve objectives that no single vulnerability would enable.</div>
    <p>Key Safeguards in Control 18:</p>
    <div class="ctrl-num"><b>18.1</b> — Establish and Maintain a Penetration Testing Program: Develop a repeatable penetration testing program with defined scope, objectives, methodology, and remediation processes. Ad hoc pen tests with no follow-through provide limited value. [IG2]</div>
    <div class="ctrl-num"><b>18.2</b> — Perform Periodic External Penetration Tests: Conduct external penetration tests — attacking internet-facing systems from an outside perspective — at least annually. For IG3 organizations, more frequent testing is expected. [IG2]</div>
    <div class="ctrl-num"><b>18.3</b> — Remediate Penetration Test Findings: Fix what pen testers find. Conducting a pen test and not remediating findings is arguably worse than not testing — you have documented proof of exploitable vulnerabilities. [IG2]</div>
    <div class="ctrl-num"><b>18.4</b> — Validate Security Measures: Validate that security measures that are expected to stop certain attacks actually do stop them. Use pen testing to confirm that defenses work, not just that they're configured. [IG3]</div>
    <div class="ctrl-num"><b>18.5</b> — Perform Periodic Internal Penetration Tests: Conduct internal penetration tests — simulating an attacker already inside the network (a compromised employee workstation or a breach of perimeter defenses). Internal tests reveal how far an attacker could pivot once they're inside. [IG3]</div>
    <div class="analogy-box"><strong>Why pen testing is in IG2 (not IG3):</strong> Penetration testing might seem like a luxury for large organizations — but it's in IG2 because mid-size organizations with sensitive data absolutely need to know whether their controls actually work. A small healthcare organization that implements all the other CIS Controls but never tests them might discover significant gaps only when a real attacker exploits them. Annual external pen testing at IG2 is a practical, essential validation of the entire security program.</div>
    <div class="warning-box"><strong>Red Team vs. Pen Test:</strong> A penetration test typically has a defined scope, timeline, and specific targets. A red team exercise is more open-ended — it simulates a sophisticated attacker operating covertly over an extended period, using any means necessary to achieve specific objectives (like exfiltrating data). Red team exercises reveal gaps in detection and response as well as prevention.</div>`,
    quiz: { q: "Why is penetration testing considered the ultimate validation of all other CIS Controls?", opts: ["Because penetration testing is legally required for compliance", "Because pen testing actively attempts to exploit the same weaknesses real attackers would use — revealing whether the controls implemented through Controls 1–17 actually prevent sophisticated, chained attacks in practice", "Because penetration testing finds all vulnerabilities that scanners miss", "Because it's the most expensive control, making it the most reliable"], ans: 1, explain: "Penetration testing validates whether all the other controls actually work in practice — not just whether they're configured or documented. A pen test might reveal that while all 17 previous controls were implemented, a specific combination of weaknesses allows an attacker to compromise the environment anyway. It's the difference between having a lock and knowing whether that lock can be picked." }

  {
    title: "CIS Controls and NIST Cybersecurity Framework",
    tagline: "How CIS Controls and NIST CSF work together",
    body: `<p>The <span class="key-term">NIST Cybersecurity Framework (NIST CSF)</span> and the CIS Controls are the two most widely used cybersecurity frameworks in the United States. Understanding how they relate — and how to use both — is essential for any security professional.</p>
    <div class="highlight-box"><strong>The key difference:</strong> NIST CSF is a high-level governance framework — it organizes security activities into five functions (Identify, Protect, Detect, Respond, Recover) and provides a way to communicate about cybersecurity risk at the executive and board level. CIS Controls are a prescriptive implementation guide — they tell you specifically what to do. NIST CSF answers "what domains of security do we need to address?" CIS Controls answer "specifically how do we address them?"</div>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>NIST CSF Functions</strong><span>Identify, Protect, Detect, Respond, Recover. Each function contains categories and subcategories. Excellent for governance conversations, maturity assessments, and program design. Less prescriptive about specific implementations.</span></div>
      <div class="cheat-pill"><strong>CIS Controls</strong><span>18 specific controls with 153 specific safeguards. Each safeguard maps to a NIST CSF function. Prescriptive and implementable. Excellent for operational security teams that need to know specifically what to do.</span></div>
    </div>
    <div class="highlight-box"><strong>The official mapping:</strong> CIS publishes an official mapping document showing exactly how each CIS Safeguard maps to NIST CSF subcategories. This means organizations can use CIS Controls as their implementation guide and NIST CSF as their governance and communication framework simultaneously — the same activities satisfy both frameworks.</div>
    <div class="analogy-box"><strong>Using both frameworks together:</strong> A CISO uses NIST CSF to present the security program to the board: "We've assessed our maturity across all five NIST functions and identified gaps in our Detect and Respond capabilities." The security team uses CIS Controls to know specifically what to implement: "To improve our Detect capabilities, we need to fully implement CIS Controls 8 (Audit Log Management) and 13 (Network Monitoring)." NIST CSF provides the strategic narrative; CIS Controls provide the tactical roadmap.</div>
    <div class="badge-row">
      <span class="badge badge-purple">CIS Control 1–2 → NIST Identify</span>
      <span class="badge badge-purple">CIS Control 3–12 → NIST Protect</span>

      <span class="badge badge-purple">CIS Control 17 → NIST Respond</span>
      <span class="badge badge-purple">CIS Control 11 → NIST Recover</span>
    </div>`,

  {
    title: "CIS Controls and HIPAA, HITRUST, SOC 2",
    tagline: "How CIS Controls connect to the frameworks we've already studied",
    body: `<p>One of the most practical aspects of the CIS Controls is how they integrate with other frameworks you've studied in this series. Understanding these connections allows compliance professionals to build unified programs that satisfy multiple frameworks simultaneously.</p>

let current = 0;

function buildGrid(){
  const g = document.getElementById('dayGrid');
  g.innerHTML = '';
  for(let i = 0; i < days.length; i++){
    const b = document.createElement('button');
    b.className = 'day-pip' + (days[i].isCheatSheet ? ' cheat' : '') + (i === current ? ' active' : '');
    b.textContent = days[i].isCheatSheet ? 'CS' : (i + 1);
    b.title = days[i].title;
    b.onclick = (()=>{ const idx = i; return () => goTo(idx); })();
    g.appendChild(b);
  }
}

function goTo(idx){ current = idx; render(); }
function changeDay(dir){ current = Math.max(0, Math.min(days.length - 1, current + dir)); render(); }

function render(){
  const d = days[current];
  const total = days.length;
  document.getElementById('dayCounter').textContent = (current + 1) + ' / ' + total;
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === total - 1;
  document.getElementById('progBar').style.width = (((current + 1) / total) * 100) + '%';
  buildGrid();

  if(d.isCheatSheet){
    document.getElementById('lessonArea').innerHTML = `
      <div class="card">
        <div class="lesson-header">
          <div class="day-badge" style="background:#E1F5EE">
            <div class="day-num" style="color:#085041;font-size:14px">CHEAT</div>
            <div class="day-lbl" style="color:#0F6E56">SHEET</div>
          </div>
          <div class="lesson-meta">
            <h2>${d.title}</h2>
            <div class="tagline">${d.tagline}</div>
          </div>
        </div>
        <div class="lesson-body">${d.body}</div>
      </div>`;
    return;
  }

  const quizId = 'quiz_' + current;
  let quizHtml = '';
  if(d.quiz){
    const optsHtml = d.quiz.opts.map((o, i) =>
      `<button class="quiz-btn" onclick="checkAnswer(${i}, ${d.quiz.ans}, '${quizId}')">${o}</button>`
    ).join('');
    quizHtml = `<div class="quiz-box">
      <p>Quick check: ${d.quiz.q}</p>
      <div>${optsHtml}</div>
      <div class="answer-reveal" id="${quizId}"></div>
    </div>`;
  }

  document.getElementById('lessonArea').innerHTML = `
    <div class="card">
      <div class="lesson-header">
        <div class="day-badge">
          <div class="day-num">${current + 1}</div>
          <div class="day-lbl">Day</div>
        </div>
        <div class="lesson-meta">
          <h2>${d.title}</h2>
          <div class="tagline">${d.tagline}</div>
        </div>
      </div>
      <div class="section-label">Today's lesson</div>
      <div class="lesson-body">${d.body}</div>
      ${quizHtml}
    </div>`;
}

function checkAnswer(chosen, correct, qid){
  const el = document.getElementById(qid);
  const d = days[current];
  if(!d.quiz) return;
  const isRight = chosen === correct;
  el.innerHTML = `<strong>${isRight ? 'Correct!' : 'Not quite.'}</strong> ${d.quiz.explain}`;
  el.className = 'answer-reveal show';
  el.style.background = isRight ? '#EAF3DE' : '#FCEBEB';
  el.style.borderColor = isRight ? '#3B6D11' : '#A32D2D';
  el.style.color = '#1a1a18';
}

render();
</script>
</body>
</html>
