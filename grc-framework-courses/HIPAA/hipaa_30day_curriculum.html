    quiz: { q: "A hospital knowingly fails to implement required HIPAA security safeguards, is notified by an auditor, and still fails to correct the violations within 30 days. Which penalty tier applies?", opts: ["Tier 1 — Did Not Know (lowest tier)", "Tier 2 — Reasonable Cause", "Tier 3 — Willful Neglect, Corrected", "Tier 4 — Willful Neglect, Not Corrected (highest tier)"], ans: 3, explain: "Tier 4 (Willful Neglect — Not Corrected) applies when violations are the result of willful neglect and not corrected within 30 days of discovery. This carries the highest penalties: $50,000 per violation with an annual cap of $1.9 million per identical violation category. This scenario — knowing violation, notification, no correction — is the definition of Tier 4." }
  },
  {
    title: "The Office for Civil Rights (OCR)",
    tagline: "The federal agency responsible for enforcing HIPAA",
    body: `<p>HIPAA is enforced primarily by the <span class="key-term">Office for Civil Rights (OCR)</span> within the US Department of Health and Human Services (HHS). Understanding how OCR operates — how it investigates complaints, initiates audits, and resolves violations — is essential for healthcare compliance professionals.</p>
    <div class="highlight-box">OCR's mandate: investigate complaints of HIPAA violations, conduct compliance reviews, perform education and outreach, and take enforcement actions when violations are found. OCR can investigate based on: individual complaints filed by patients, media reports of large breaches (500+ individuals automatically trigger scrutiny), and proactive compliance audits.</div>
    <p>The OCR investigation process:</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Complaint Intake</strong><span>OCR receives a complaint and determines whether it falls within HIPAA's scope. Many complaints are dismissed as outside OCR's jurisdiction (e.g., complaints against non-Covered Entities).</span></div>
      <div class="cheat-pill"><strong>Investigation</strong><span>OCR contacts the Covered Entity, requests documentation, conducts interviews. The investigation examines whether a violation occurred and what the level of culpability was.</span></div>
      <div class="cheat-pill"><strong>Resolution</strong><span>Most cases resolve through: technical assistance (educating the entity), corrective action plans (requiring specific changes), or resolution agreements (formal agreements with monetary penalties and corrective action). Formal civil monetary penalty proceedings are relatively rare.</span></div>
      <div class="cheat-pill"><strong>HIPAA Audit Program</strong><span>OCR conducts periodic compliance audits of Covered Entities and Business Associates — proactive examinations not triggered by complaints. Audits assess whether required policies and procedures are in place and being followed.</span></div>
    </div>
    <div class="analogy-box"><strong>States' Attorneys General:</strong> Since HITECH, state Attorneys General can also bring HIPAA enforcement actions on behalf of state residents. This creates dual federal-state enforcement risk. Several states — including Connecticut, Massachusetts, and New York — have brought significant HIPAA enforcement actions and negotiated substantial settlements with healthcare organizations.</div>
    <div class="info-box"><strong>Right of access enforcement:</strong> Since 2019, OCR has specifically prioritized enforcement of patients' right of access — the right to timely copies of their own medical records. OCR has settled dozens of cases with healthcare providers who denied or delayed patient record requests. These settlements range from $3,500 to $240,000 and serve as a warning that access rights violations are now an active enforcement priority.</div>`,
    quiz: { q: "A healthcare patient files a HIPAA complaint with OCR because their hospital denied their request for a copy of their medical records. What is the most likely OCR resolution for most cases?", opts: ["Immediate multi-million dollar fine against the hospital", "Criminal prosecution of hospital executives", "Technical assistance, a corrective action plan requiring the hospital to provide access and improve its procedures, or a resolution agreement — formal CMPs are used in more egregious cases", "Dismissal — OCR doesn't handle record access complaints"], ans: 2, explain: "Most OCR investigations resolve through corrective action plans or resolution agreements rather than formal civil monetary penalty proceedings. For right of access violations, OCR often requires the entity to provide the records, implement improved procedures, and train staff — reserving larger penalties for willful or repeated non-compliance. However, OCR has imposed fines specifically for access violations since 2019, so these cases are taken seriously." }
  },
  {
    title: "Risk Analysis and Risk Management",
    tagline: "The cornerstone of HIPAA Security Rule compliance",
    body: `<p>If there's one HIPAA requirement that rises above all others in importance, it's the <span class="key-term">risk analysis</span>. HHS has consistently stated that the Security Rule's risk analysis and risk management requirements are foundational — the starting point for all security compliance. And OCR's enforcement actions consistently cite inadequate risk analysis as a primary finding.</p>
    <div class="highlight-box">The risk analysis requirement (§164.308(a)(1)(ii)(A)) requires: an accurate and thorough assessment of the potential risks and vulnerabilities to the confidentiality, integrity, and availability of all ePHI that the organization creates, receives, maintains, or transmits. This is not a one-time exercise — it must be reviewed periodically and updated when operations or the environment change.</div>
    <p>A compliant HIPAA risk analysis must include:</p>
    <div class="badge-row">
      <span class="badge badge-pink">Scope: all ePHI created, received, maintained, or transmitted</span>
      <span class="badge badge-pink">Data collection: identifying where ePHI lives and flows</span>
      <span class="badge badge-pink">Threat identification: what could cause harm to ePHI</span>
      <span class="badge badge-pink">Vulnerability identification: weaknesses that could be exploited</span>
      <span class="badge badge-pink">Current controls: what safeguards are already in place</span>
      <span class="badge badge-pink">Likelihood determination: probability of each threat/vulnerability combination</span>
      <span class="badge badge-pink">Impact analysis: severity of potential harm if exploited</span>
      <span class="badge badge-pink">Risk level assignment: combining likelihood and impact</span>
      <span class="badge badge-pink">Documentation: written analysis that can be demonstrated to auditors</span>
    </div>
    <div class="analogy-box"><strong>Risk analysis feeds everything else:</strong> Think of the risk analysis as the foundation of a building. If you don't understand what risks exist — what threats could harm your ePHI and what vulnerabilities could be exploited — you can't rationally choose which security controls to implement. A hospital that buys expensive security software without doing a risk analysis might be protecting against threats that aren't actually present while remaining vulnerable to the real ones.</div>
    <div class="warning-box"><strong>Risk analysis ≠ risk management:</strong> Risk analysis identifies and evaluates risks. Risk management (§164.308(a)(1)(ii)(B)) implements security measures to reduce identified risks to a reasonable and appropriate level. Both are required. Many organizations do an excellent risk analysis and then fail to actually implement the recommended remediation — which is itself a HIPAA violation.</div>`,
    quiz: { q: "A medical practice buys a firewall and antivirus software but has never formally documented the threats and vulnerabilities facing its ePHI systems. From a HIPAA perspective, what is the key problem?", opts: ["No problem — having security tools is sufficient", "They may have appropriate controls but violated the required risk analysis specification — without documented analysis, they cannot demonstrate they understand their risks or that their controls address the actual risks present", "The problem is only the lack of documentation — not the security itself", "HIPAA doesn't require risk analysis for small practices"], ans: 1, explain: "The risk analysis requirement is a required specification — not addressable. Without a documented risk analysis, the practice cannot demonstrate: (1) that it understands its actual risks, (2) that the controls chosen are appropriate for the specific risks present, or (3) that it's complying with the foundational Security Rule requirement. Having tools without documented analysis is a HIPAA violation regardless of the tools' quality." }
  },
  {
    title: "HIPAA and Electronic Health Records (EHRs)",
    tagline: "The digital transformation of healthcare and its compliance implications",
    body: `<p>The widespread adoption of <span class="key-term">Electronic Health Records (EHRs)</span> represents one of the biggest HIPAA compliance challenges and opportunities in modern healthcare. EHRs centralize and interconnect patient information across care settings — creating powerful clinical tools while concentrating enormous amounts of ePHI in single systems.</p>
    <div class="highlight-box">Before EHRs, a patient's health information was distributed across paper files in dozens of separate offices. Breaches were limited by physical access. Today, a single compromised hospital EHR system might expose the complete medical histories of hundreds of thousands of patients simultaneously. The centralization that makes EHRs clinically powerful also makes them one of the most valuable and vulnerable targets for hackers.</div>
    <p>Key HIPAA compliance considerations for EHR systems:</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Access Controls</strong><span>Role-based access ensuring each user sees only the records relevant to their job. Single sign-on with unique user IDs. Automatic session timeout. Emergency access procedures that are audited.</span></div>
      <div class="cheat-pill"><strong>Audit Logs</strong><span>Complete logging of every access to patient records — who viewed what, when, from which device. Audit logs must be retained and regularly reviewed. Critical for detecting inappropriate access.</span></div>
      <div class="cheat-pill"><strong>Interoperability and Data Sharing</strong><span>EHRs often share data with other systems — labs, pharmacies, specialists, payers. Each data-sharing interface must be evaluated for HIPAA compliance. Business Associate Agreements with every receiving system.</span></div>
      <div class="cheat-pill"><strong>Patient Portal Rights</strong><span>Modern EHRs include patient portals allowing direct record access. HIPAA's Right of Access now includes the right to electronic copies in machine-readable format — a significant shift from paper-era records access.</span></div>
    </div>
    <div class="analogy-box"><strong>The "snooping" problem:</strong> One of the most common internal EHR compliance violations is employees accessing records of patients they aren't treating — celebrities, neighbors, family members, or former partners. Major hospitals have fired dozens of employees for snooping through EHRs out of curiosity. HIPAA's minimum necessary standard requires access controls preventing this, and audit log analysis is the primary tool for detecting it after the fact.</div>`,
    quiz: { q: "A nurse accesses the EHR of a celebrity patient who was admitted to her hospital, even though she has no clinical role in that patient's care. She doesn't share the information. Is this a HIPAA violation?", opts: ["No — employees of Covered Entities can access any record in their system", "Yes — accessing PHI without a treatment, payment, or operations purpose violates the Privacy Rule's minimum necessary standard, regardless of whether information is further disclosed", "Only if the celebrity finds out", "Only if the hospital has a specific policy against this"], ans: 1, explain: "Accessing a patient's EHR without a legitimate treatment, payment, or operations purpose violates HIPAA's Privacy Rule — specifically the minimum necessary standard. The lack of further disclosure doesn't matter; the impermissible access itself is the violation. Most hospitals have terminated employees and faced OCR investigations for exactly this type of 'celebrity snooping.'" }
  },
  {
    title: "HIPAA in the Age of Health Technology",
    tagline: "Wearables, apps, AI, and the evolving HIPAA landscape",
    body: `<p>The healthcare technology landscape has changed dramatically since HIPAA was enacted in 1996. Mobile health apps, wearable devices, telehealth, AI diagnostic tools, and cloud computing have created new privacy challenges that HIPAA's original framework was never designed to address.</p>
    <div class="warning-box"><strong>The consumer health app gap:</strong> HIPAA's most significant limitation in the digital age is its narrow scope. A fitness app that tracks your heart rate, sleep patterns, menstrual cycle, or mental health — and stores this information on a company's servers — is generally NOT subject to HIPAA. If you consent to sharing this data, the app company can sell it to advertisers, data brokers, and others. This creates a massive loophole: data that would be protected if your doctor collected it is completely unprotected if you collect it yourself through a consumer app.</div>
    <p>How HIPAA applies to emerging healthcare technologies:</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Telehealth</strong><span>Video consultations between patients and providers involve ePHI. HIPAA applies to the provider. Video platform must have a BAA (e.g., Zoom for Healthcare has a BAA; regular Zoom does not). Transmission must be secure.</span></div>
      <div class="cheat-pill"><strong>Connected Medical Devices</strong><span>Pacemakers, insulin pumps, glucose monitors, and other connected devices generate ePHI. Devices that transmit data to EHR systems or provider portals fall within HIPAA's scope. Security of these devices is an emerging focus.</span></div>
      <div class="cheat-pill"><strong>AI Diagnostic Tools</strong><span>AI systems that analyze medical images, predict diagnoses, or process patient records are ePHI systems subject to HIPAA. Vendors are Business Associates requiring BAAs. The AI's training data itself may be PHI requiring protection.</span></div>

let current = 0;

function buildGrid(){
  const g = document.getElementById('dayGrid');
  g.innerHTML = '';
  for(let i = 0; i < days.length; i++){
    const b = document.createElement('button');
    b.className = 'day-pip' + (days[i].isCheatSheet ? ' cheat' : '') + (i === current ? ' active' : '');
    b.textContent = days[i].isCheatSheet ? 'CS' : (i + 1);
    b.title = days[i].title;
    b.onclick = (()=>{ const idx = i; return () => goTo(idx); })();
    g.appendChild(b);
  }
}

function goTo(idx){ current = idx; render(); }
function changeDay(dir){ current = Math.max(0, Math.min(days.length - 1, current + dir)); render(); }

function render(){
  const d = days[current];
  const total = days.length;
  document.getElementById('dayCounter').textContent = (current + 1) + ' / ' + total;
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === total - 1;
  document.getElementById('progBar').style.width = (((current + 1) / total) * 100) + '%';
  buildGrid();

  if(d.isCheatSheet){
    document.getElementById('lessonArea').innerHTML = `
      <div class="card">
        <div class="lesson-header">
          <div class="day-badge" style="background:#E1F5EE">
            <div class="day-num" style="color:#085041;font-size:14px">CHEAT</div>
            <div class="day-lbl" style="color:#0F6E56">SHEET</div>
          </div>
          <div class="lesson-meta">
            <h2>${d.title}</h2>
            <div class="tagline">${d.tagline}</div>
          </div>
        </div>
        <div class="lesson-body">${d.body}</div>
      </div>`;
    return;
  }

  const quizId = 'quiz_' + current;
  let quizHtml = '';
  if(d.quiz){
    const optsHtml = d.quiz.opts.map((o, i) =>
      `<button class="quiz-btn" onclick="checkAnswer(${i}, ${d.quiz.ans}, '${quizId}')">${o}</button>`
    ).join('');
    quizHtml = `<div class="quiz-box">
      <p>Quick check: ${d.quiz.q}</p>
      <div>${optsHtml}</div>
      <div class="answer-reveal" id="${quizId}"></div>
    </div>`;
  }

  document.getElementById('lessonArea').innerHTML = `
    <div class="card">
      <div class="lesson-header">
        <div class="day-badge">
          <div class="day-num">${current + 1}</div>
          <div class="day-lbl">Day</div>
        </div>
        <div class="lesson-meta">
          <h2>${d.title}</h2>
          <div class="tagline">${d.tagline}</div>
        </div>
      </div>
      <div class="section-label">Today's lesson</div>
      <div class="lesson-body">${d.body}</div>
      ${quizHtml}
    </div>`;
}

function checkAnswer(chosen, correct, qid){
  const el = document.getElementById(qid);
  const d = days[current];
  if(!d.quiz) return;
  const isRight = chosen === correct;
  el.innerHTML = `<strong>${isRight ? 'Correct!' : 'Not quite.'}</strong> ${d.quiz.explain}`;
  el.className = 'answer-reveal show';
  el.style.background = isRight ? '#EAF3DE' : '#FCEBEB';
  el.style.borderColor = isRight ? '#3B6D11' : '#A32D2D';
  el.style.color = '#1a1a18';
}

render();
</script>
