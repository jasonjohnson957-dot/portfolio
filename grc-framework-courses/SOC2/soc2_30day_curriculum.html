  {
    title: "The Service Auditor's Role",
    tagline: "The independent professional whose opinion makes SOC 2 valuable",
    body: `<p>The entire credibility of SOC 2 rests on the independence and competence of the <span class="key-term">service auditor</span> — the licensed CPA firm that conducts the audit and issues the report. Understanding their role, constraints, and professional standards is fundamental to understanding why SOC 2 matters.</p>
    <div class="highlight-box">Only a licensed <strong>CPA firm</strong> (Certified Public Accountant) can issue a SOC 2 report. This is not optional or a technicality — SOC 2 is an attestation engagement under AICPA standards (specifically AT-C Section 205). Engaging a non-CPA security firm to conduct your "SOC 2 audit" produces a report that isn't a SOC 2 report, no matter what they call it.</div>
    <p>The service auditor's responsibilities include:</p>
    <div class="badge-row">
      <span class="badge badge-blue">Evaluating management's description of the system for accuracy</span>
      <span class="badge badge-blue">Testing controls to verify they operate as described</span>
      <span class="badge badge-blue">Sampling transactions and examining evidence</span>
      <span class="badge badge-blue">Interviewing key personnel</span>
      <span class="badge badge-blue">Issuing a professional opinion with appropriate qualifications</span>
      <span class="badge badge-blue">Maintaining independence from the client</span>
    </div>
    <div class="analogy-box"><strong>Independence is everything:</strong> If a company could hire any consultant to write a positive report about their own security, the report would be worthless. The service auditor's value comes from their independence — they have a professional and legal obligation to report what they find, not what the client wants them to find. A CPA who issues a false clean opinion risks losing their license and facing legal liability.</div>
    <div class="warning-box"><strong>Watch out for "SOC 2 readiness" vs. "SOC 2 audit":</strong> Many consulting firms offer "SOC 2 readiness assessments" — valuable preparation services, but not an audit. Only the formal CPA-issued report is a genuine SOC 2. Customers should always verify that a vendor's SOC 2 report was issued by a licensed CPA firm, not a non-CPA security consulting company.</div>`,

  {

  {
    title: "SOC 2 Cheat Sheet",
    tagline: "Your complete quick-reference guide",
    isCheatSheet: true,
    body: `
    <div class="cheat-section">
      <h3>What Is SOC 2?</h3>
      <p style="font-size:13.5px;color:#6b6b68">System and Organization Controls 2. An AICPA auditing standard evaluating whether a service organization's controls properly protect customer data across Security, Availability, Processing Integrity, Confidentiality, and Privacy. Voluntary but effectively required for B2B tech sales. Only licensed CPA firms can issue SOC 2 reports. Reports are confidential — shared under NDA. Built on the Trust Services Criteria (TSC), with the Common Criteria based on COSO's Internal Control framework.</p>
    </div>

    <div class="cheat-section">
      <h3>SOC Report Types</h3>
      <div class="control-row">
        <div class="ctrl-card"><b>SOC 1</b> — Internal controls over financial reporting. Used by payroll processors, benefits administrators, financial data handlers. Required for SOX compliance.</div>
        <div class="ctrl-card"><b>SOC 2</b> — Controls over Security, Availability, Processing Integrity, Confidentiality, and/or Privacy. Most widely requested in tech industry. Confidential — shared under NDA.</div>
        <div class="ctrl-card"><b>SOC 3</b> — Simplified, publicly shareable summary of SOC 2. Contains auditor's opinion only — no detailed controls or test results. Safe to post on company website.</div>
        <div class="ctrl-card"><b>SOC 2+</b> — SOC 2 plus additional framework coverage (HIPAA, PCI-DSS, ISO 27001, NIST). One audit satisfies multiple compliance requirements.</div>
      </div>
    </div>

    <div class="cheat-section">
      <h3>Type I vs. Type II</h3>
      <div class="tsc-grid">
        <div class="tsc-security"><strong style="color:#501313">Type I — Snapshot</strong><br><span style="font-size:12px;color:#1a1a18">Point-in-time. Evaluates whether controls are <em>suitably designed</em> as of a specific date. Does NOT test operating effectiveness over time. Stepping stone toward Type II. Less valuable to customers.</span></div>
        <div class="tsc-availability"><strong style="color:#0C447C">Type II — Film</strong><br><span style="font-size:12px;color:#1a1a18">Over a period (typically 6–12 months). Evaluates suitably designed AND <em>operating effectively</em>. Tests actual evidence. What enterprise customers almost always require. Renewable annually.</span></div>
      </div>
    </div>

    <div class="cheat-section">
      <h3>5 Trust Services Categories</h3>
      <div class="tsc-grid">
        <div class="tsc-security"><strong style="color:#501313">Security (MANDATORY)</strong><br><span style="font-size:12px;color:#1a1a18">Protects information and systems from unauthorized access, disclosure, or damage. Covered by the 9 Common Criteria (CC1–CC9). Foundation of every SOC 2.</span></div>
        <div class="tsc-availability"><strong style="color:#0C447C">Availability (optional)</strong><br><span style="font-size:12px;color:#1a1a18">Systems available for operation as committed. Covers uptime monitoring, capacity planning, backup and recovery, disaster recovery, SLA management.</span></div>
        <div class="tsc-integrity"><strong style="color:#633806">Processing Integrity (optional)</strong><br><span style="font-size:12px;color:#1a1a18">Processing is complete, valid, accurate, timely, and authorized. Critical for payment processors, payroll systems, financial software. The 5 elements: Complete | Valid | Accurate | Timely | Authorized.</span></div>
        <div class="tsc-confidential"><strong style="color:#3C3489">Confidentiality (optional)</strong><br><span style="font-size:12px;color:#1a1a18">Information designated as confidential is protected. Covers business secrets, trade secrets, proprietary data. Note: Confidentiality = business info; Privacy = personal info about individuals.</span></div>
        <div class="tsc-privacy"><strong style="color:#4B1528">Privacy (optional)</strong><br><span style="font-size:12px;color:#1a1a18">Personal information collected, used, retained, and disposed of per commitments and AICPA privacy criteria (GAPP). Aligns with GDPR, CCPA. 10 GAPP components: Notice | Choice/Consent | Collection | Use/Retention | Access | Disclosure | Security | Quality | Monitoring | Enforcement.</span></div>
      </div>
    </div>

    <div class="cheat-section">
      <h3>9 Common Criteria (CC) — Security Category</h3>
      <div class="control-row">
        <div class="ctrl-card"><b>CC1 — Control Environment</b> — Integrity and ethical values, board oversight, organizational structure, competency commitment, accountability. The governance foundation.</div>
        <div class="ctrl-card"><b>CC2 — Communication and Information</b> — Quality information for internal control, internal communication of responsibilities, external communications. Right info to right people.</div>
        <div class="ctrl-card"><b>CC3 — Risk Assessment</b> — Objectives clarity, risk identification and analysis, fraud risk consideration, identifying changes affecting controls. Formal and documented.</div>
        <div class="ctrl-card"><b>CC4 — Monitoring Activities</b> — Ongoing and separate evaluations of control functioning, communicating and correcting deficiencies. Continuous + periodic monitoring.</div>
        <div class="ctrl-card"><b>CC5 — Control Activities</b> — Selecting and implementing controls to mitigate risks, general technology controls, deploying via policies and procedures. The "what are you doing about it?" criterion.</div>
        <div class="ctrl-card"><b>CC6 — Logical and Physical Access Controls</b> — Access architecture, user registration, access removal (termination), physical access, data disposal, external threat protection, data transmission controls, malware protection. (8 sub-criteria — the most detailed.)</div>
        <div class="ctrl-card"><b>CC7 — System Operations</b> — Configuration monitoring, anomaly detection, incident classification, incident response program, incident recovery. Detect → respond → recover.</div>
        <div class="ctrl-card"><b>CC8 — Change Management</b> — Authorizing, designing, testing, approving, and implementing changes. Covers all change types including emergency changes. Unauthorized changes = control failure.</div>
        <div class="ctrl-card"><b>CC9 — Risk Mitigation</b> — Business disruption risk mitigation activities, vendor and business partner risk management. Supply chain security and continuity planning.</div>
      </div>
    </div>

    <div class="cheat-section">
      <h3>Key Structural Concepts</h3>
      <div class="control-row">
        <div class="ctrl-card"><b>CUECs (Complementary User Entity Controls)</b> — Controls the <em>customer</em> must implement for the vendor's system to be secure. Customer is responsible — not the vendor. Must be reviewed and implemented by every customer reading the SOC 2.</div>
        <div class="ctrl-card"><b>CSOCs (Complementary Subservice Organization Controls)</b> — Controls required from the vendor's own vendors (subservice orgs like AWS). Carve-out method: subservice org is out of scope, their own SOC 2 must be reviewed separately.</div>
        <div class="ctrl-card"><b>Auditor's Opinion Types</b> — Unqualified = clean opinion, controls effective. Qualified = exceptions found, some controls failed. Adverse = widespread failures. Disclaimer = insufficient evidence to form opinion.</div>
        <div class="ctrl-card"><b>SOC 2 Report Sections</b> — (1) Auditor's Opinion | (2) Management's Assertion | (3) System Description | (4) Trust Services Criteria, Controls, Tests, and Results. Read Section 4's exception column first.</div>
        <div class="ctrl-card"><b>Only CPA Firms Issue SOC 2</b> — SOC 2 is an AICPA attestation under AT-C Section 205. Non-CPA security firms cannot issue valid SOC 2 reports regardless of what they call their product.</div>
        <div class="ctrl-card"><b>Annual Renewal</b> — Enterprise customers expect annual SOC 2 renewal. Compliance is an ongoing program. GRC tools (Vanta, Drata, Secureframe) automate evidence collection and monitoring.</div>
      </div>
    </div>

    <div class="cheat-section">
      <h3>SOC 2 and Other Frameworks</h3>
      <div class="control-row">
        <div class="ctrl-card"><b>ISO 27001</b> — ~85% overlap. ISO 27001 = international ISMS standard (process-oriented). SOC 2 = US audit opinion. Many companies get both for global coverage.</div>
        <div class="ctrl-card"><b>GDPR</b> — SOC 2 Privacy ≈ GDPR principles. SOC 2 security controls support GDPR Art. 32. SOC 2 does not replace GDPR compliance — they are complementary.</div>
        <div class="ctrl-card"><b>HIPAA</b> — SOC 2 + HIPAA = SOC 2+ audit. Strong evidence for healthcare compliance. PHI protection requirements align with Security and Privacy categories.</div>
        <div class="ctrl-card"><b>NIST CSF</b> — NIST's Identify/Protect/Detect/Respond/Recover maps closely to CC criteria. NIST-based security programs align naturally with SOC 2 audit preparation.</div>
        <div class="ctrl-card"><b>PCI-DSS</b> — Payment card security. Companies needing both often pursue SOC 2+ to combine audits. PCI-DSS is more prescriptive; SOC 2 is more principles-based.</div>
        <div class="ctrl-card"><b>COBIT</b> — IT governance framework whose processes (change management, access control, risk management) directly build the controls SOC 2 audits. COBIT governs; SOC 2 audits.</div>
      </div>
    </div>

    <div class="cheat-section">
      <h3>Key Numbers and Facts to Remember</h3>
      <div class="badge-row">
        <span class="badge badge-blue">Published by: AICPA</span>
        <span class="badge badge-blue">TSC last updated: 2017 (2022 supplemental guidance)</span>
        <span class="badge badge-blue">5 Trust Services Categories</span>
        <span class="badge badge-blue">Security = MANDATORY</span>
        <span class="badge badge-blue">9 Common Criteria (CC1–CC9)</span>
        <span class="badge badge-blue">CC6 has the most sub-criteria (8)</span>
        <span class="badge badge-blue">Type I = point in time | Type II = 6–12 months</span>
        <span class="badge badge-blue">Type II = what enterprise customers require</span>
        <span class="badge badge-blue">SOC 3 = public version</span>
        <span class="badge badge-blue">CPA firms only can issue SOC 2</span>
        <span class="badge badge-blue">Unqualified opinion = clean</span>
        <span class="badge badge-blue">Annual renewal expected</span>
        <span class="badge badge-blue">5 Processing Integrity elements: Complete, Valid, Accurate, Timely, Authorized</span>
        <span class="badge badge-blue">GAPP = 10 Generally Accepted Privacy Principles (Privacy category)</span>
      </div>
    </div>
    `
  }
];

let current = 0;

function buildGrid(){
  const g = document.getElementById('dayGrid');
  g.innerHTML = '';
  for(let i = 0; i < days.length; i++){
    const b = document.createElement('button');
    b.className = 'day-pip' + (days[i].isCheatSheet ? ' cheat' : '') + (i === current ? ' active' : '');
    b.textContent = days[i].isCheatSheet ? 'CS' : (i + 1);
    b.title = days[i].title;
    b.onclick = (()=>{ const idx = i; return () => goTo(idx); })();
    g.appendChild(b);
  }
}

function goTo(idx){ current = idx; render(); }
function changeDay(dir){ current = Math.max(0, Math.min(days.length - 1, current + dir)); render(); }

function render(){
  const d = days[current];
  const total = days.length;
  document.getElementById('dayCounter').textContent = (current + 1) + ' / ' + total;
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === total - 1;
  document.getElementById('progBar').style.width = (((current + 1) / total) * 100) + '%';
  buildGrid();

  if(d.isCheatSheet){
    document.getElementById('lessonArea').innerHTML = `
      <div class="card">
        <div class="lesson-header">
          <div class="day-badge" style="background:#E1F5EE">
            <div class="day-num" style="color:#085041;font-size:14px">CHEAT</div>
            <div class="day-lbl" style="color:#0F6E56">SHEET</div>
          </div>
          <div class="lesson-meta">
            <h2>${d.title}</h2>
            <div class="tagline">${d.tagline}</div>
          </div>
        </div>
        <div class="lesson-body">${d.body}</div>
      </div>`;
    return;
  }

  const quizId = 'quiz_' + current;
  let quizHtml = '';
  if(d.quiz){
    const optsHtml = d.quiz.opts.map((o, i) =>
      `<button class="quiz-btn" onclick="checkAnswer(${i}, ${d.quiz.ans}, '${quizId}')">${o}</button>`
    ).join('');
    quizHtml = `<div class="quiz-box">
      <p>Quick check: ${d.quiz.q}</p>
      <div>${optsHtml}</div>
      <div class="answer-reveal" id="${quizId}"></div>
    </div>`;
  }

  document.getElementById('lessonArea').innerHTML = `
    <div class="card">
      <div class="lesson-header">
        <div class="day-badge">
          <div class="day-num">${current + 1}</div>
          <div class="day-lbl">Day</div>
        </div>
        <div class="lesson-meta">
          <h2>${d.title}</h2>
          <div class="tagline">${d.tagline}</div>
        </div>
      </div>
      <div class="section-label">Today's lesson</div>
      <div class="lesson-body">${d.body}</div>
      ${quizHtml}
    </div>`;
}

function checkAnswer(chosen, correct, qid){
  const el = document.getElementById(qid);
  const d = days[current];
  if(!d.quiz) return;
  const isRight = chosen === correct;
  el.innerHTML = `<strong>${isRight ? 'Correct!' : 'Not quite.'}</strong> ${d.quiz.explain}`;
  el.className = 'answer-reveal show';
  el.style.background = isRight ? '#EAF3DE' : '#FCEBEB';
  el.style.borderColor = isRight ? '#3B6D11' : '#A32D2D';
  el.style.color = '#1a1a18';
}

render();
</script>
