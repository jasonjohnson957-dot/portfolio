    body: `<p>Cloud computing creates both opportunities and challenges for CMMC compliance. Organizations that properly leverage cloud services can reduce their compliance burden significantly. Those that don't understand the requirements can inadvertently create major compliance gaps. Understanding <span class="key-term">CMMC cloud requirements</span> is essential for any modern defense contractor.</p>
    <div class="highlight-box"><strong>The fundamental cloud rule:</strong> Any cloud service used to process, store, or transmit CUI must meet security requirements equivalent to FedRAMP Moderate baseline — the federal government's cloud security standard. Simply putting CUI in a standard commercial cloud service (standard Microsoft 365, standard Google Workspace, standard Dropbox) without ensuring it meets these requirements is a CMMC compliance failure.</div>
    <p>Cloud service categories for CMMC:</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>FedRAMP Authorized (High/Moderate)</strong><span>The gold standard for government cloud. Services with FedRAMP Moderate or High authorization have been independently assessed against NIST SP 800-53 controls. These are explicitly permitted for CUI processing under CMMC.</span></div>
      <div class="cheat-pill"><strong>FedRAMP Equivalent</strong><span>Cloud services that haven't gone through formal FedRAMP authorization but meet equivalent security requirements. Requires documented evidence of equivalent controls. More complex to verify but available for services important to contractors.</span></div>
      <div class="cheat-pill"><strong>Government Community Cloud (GCC High)</strong><span>Microsoft 365 Government Community Cloud High — a dedicated cloud environment for US government and defense contractors that meets DoD requirements for CUI. Widely used in the defense industry. Separately licensed from commercial M365.</span></div>
      <div class="cheat-pill"><strong>Standard Commercial Cloud</strong><span>Standard commercial versions of cloud services (regular AWS, standard M365, Google Workspace) are generally NOT appropriate for CUI without additional security controls and agreements. Many contractors unknowingly store CUI in commercial cloud without understanding the compliance implications.</span></div>
    </div>
    <div class="analogy-box"><strong>The GCC High significance:</strong> Many defense contractors use Microsoft 365 for email and collaboration. Standard Microsoft 365 does not meet CUI requirements. Microsoft 365 Government Community Cloud High (GCC High) does — but it's a completely separate service requiring separate licensing, migration, and setup. The difference between standard M365 and GCC High is invisible to end users but represents a critical compliance distinction. Countless contractors have discovered mid-assessment that their email environment stores CUI in a non-compliant cloud environment.</div>
    <div class="warning-box"><strong>External Service Providers (ESPs) in scope:</strong> Cloud services that can affect the security of in-scope systems — even if they don't directly process CUI — may be in the CMMC assessment scope as "Security Protection Assets." This includes cloud identity providers (Azure AD, Okta), security monitoring services (SOC-as-a-Service), and backup services. ESPs must meet CMMC requirements or have appropriate controls to be used in a CMMC environment.</div>`,
    quiz: { q: "A defense contractor uses the standard commercial version of Microsoft 365 (not GCC High) to store and share CUI documents via SharePoint. Is this CMMC compliant?", opts: ["Yes — Microsoft 365 is a trusted enterprise cloud service", "No — standard commercial Microsoft 365 does not meet the FedRAMP Moderate equivalent requirement for CUI processing. The contractor must migrate CUI to a compliant environment like Microsoft 365 GCC High", "Only if Microsoft signs a specific agreement with the contractor", "It depends on the sensitivity level of the CUI"], ans: 1, explain: "Standard commercial Microsoft 365 does not meet the government's requirements for CUI processing. Microsoft 365 GCC High is Microsoft's FedRAMP-authorized cloud environment designed for CUI and defense contractor use. Using standard commercial M365 for CUI — even a basic document labeled as CUI — is a CMMC compliance failure. This is one of the most common and overlooked compliance gaps among defense contractors." }
  },
  {
    title: "CMMC and Small Businesses",
    tagline: "The unique challenges small defense contractors face — and how to address them",
    body: `<p>CMMC compliance poses particular challenges for small defense contractors and subcontractors. While the DoD has acknowledged these challenges and made some accommodations, the fundamental requirement — that all contractors handling CUI meet Level 2 — applies equally regardless of company size. The security of the defense supply chain cannot be compromised because an organization is small.</p>
    <div class="highlight-box"><strong>The small business dilemma:</strong> Many small defense subcontractors handle sensitive technical data — CUI — but have IT budgets measured in tens of thousands of dollars rather than millions. Achieving CMMC Level 2 compliance may cost $50,000–$500,000+ depending on the organization's starting point — a potentially prohibitive investment for a $1 million company with thin margins on government contracts. Yet the DoD has determined this investment is necessary because small contractors are often the easiest path into the defense supply chain for attackers.</div>
    <p>Strategies small businesses use to manage CMMC costs:</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Scope Minimization</strong><span>Network segmentation to create a small, isolated CUI environment dramatically reduces assessment scope. A 50-person company might have only 5 people who actually handle CUI — scoping to those 5 people and their systems is far more manageable than scoping the entire company.</span></div>
      <div class="cheat-pill"><strong>Managed Service Providers</strong><span>CMMC-compliant Managed Service Providers (MSPs) can implement and maintain many CMMC controls on behalf of small contractors. The MSP handles security monitoring, patching, endpoint management, and other technical controls — letting the small business focus on its core competency.</span></div>
      <div class="cheat-pill"><strong>Cloud-First Approach</strong><span>Moving CUI processing entirely to FedRAMP-authorized cloud environments (Microsoft GCC High, AWS GovCloud) can significantly reduce the on-premise compliance burden. The cloud provider handles many infrastructure-level controls.</span></div>
      <div class="cheat-pill"><strong>Cost-Sharing Consortium</strong><span>Some small businesses in the same geographic area or industry sector share compliance infrastructure and assessment costs. While each company must individually certify, shared tooling and resources can reduce individual costs.</span></div>
    </div>
    <div class="analogy-box"><strong>The market reality:</strong> CMMC compliance costs are real — but so are the business consequences of non-compliance. A small company that invests in CMMC compliance gains a competitive advantage over competitors who haven't. Prime contractors increasingly prefer — and will eventually require — CMMC-certified subcontractors. Early investment in compliance creates a sustainable competitive position in the defense market. Late adopters face higher costs, missed contracts, and potential removal from supply chains.</div>`,
    quiz: { q: "A 10-person machine shop makes precision parts for defense aircraft under a $500K DoD subcontract. They handle CUI technical specifications. The prime is requiring CMMC Level 2. What is the most cost-effective approach for this small company?", opts: ["Skip CMMC — the contract is too small to justify the investment", "Scope the CMMC environment to only the systems and personnel that actually handle CUI specifications, potentially using a CMMC-compliant MSP for technical controls and a cloud-based CUI environment", "Implement CMMC across the entire company immediately", "Ask the prime contractor to handle their CMMC compliance"], ans: 1, explain: "For a small contractor, scope minimization combined with managed services is typically the most cost-effective approach. If only 3 people actually handle the CUI technical specifications, those 3 people and their systems — potentially in a segregated CUI environment managed by a CMMC-compliant MSP — form the assessment scope. This is dramatically more manageable than applying 110 CMMC Level 2 practices across the entire company's IT environment." }
  },
  {
    title: "CMMC and GRC — Connections to Other Frameworks",
    tagline: "How CMMC integrates with the rest of your compliance portfolio",
    body: `<p>CMMC doesn't exist in isolation. Organizations subject to CMMC typically also have obligations under other frameworks — HIPAA, ISO 27001, SOC 2, CIS Controls, or NIST CSF. Understanding how these frameworks interact with CMMC enables efficient integrated compliance programs rather than duplicative parallel efforts.</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>CMMC and NIST CSF</strong><span>The NIST Cybersecurity Framework's five functions (Identify, Protect, Detect, Respond, Recover) map across all 14 CMMC Level 2 domains. NIST CSF is used for governance communication; CMMC Level 2 practices are the specific implementation requirements. Organizations can satisfy CMMC while organizing their program using NIST CSF as the governance framework.</span></div>
      <div class="cheat-pill"><strong>CMMC and ISO 27001</strong><span>ISO 27001 and CMMC Level 2 have substantial overlap — approximately 70% of CMMC Level 2 practices map to ISO 27001 Annex A controls. Organizations with ISO 27001 certification have a strong foundation for CMMC — but must address CMMC-specific requirements (SPRS scoring, government-specific incident reporting, CUI handling) that go beyond ISO 27001.</span></div>
      <div class="cheat-pill"><strong>CMMC and CIS Controls</strong><span>CIS Controls v8 IG2 and IG3 cover most of the technical practices in CMMC Level 2. CIS Benchmarks implement many of the configuration management requirements. Organizations implementing CIS Controls IG2 are likely 60-70% of the way to CMMC Level 2 for technical controls.</span></div>
      <div class="cheat-pill"><strong>CMMC and HIPAA</strong><span>Healthcare organizations in the defense supply chain (medical device manufacturers, battlefield medicine contractors) face both CMMC and HIPAA requirements. NIST SP 800-171 and HIPAA Security Rule have substantial overlap — a unified security program can address both, with CMMC-specific and HIPAA-specific requirements handled as supplements.</span></div>
      <div class="cheat-pill"><strong>CMMC and SOC 2</strong><span>SOC 2 provides security assurance for commercial customers; CMMC provides certification for DoD customers. They address different audiences with different evidence requirements. A defense contractor serving both commercial and government markets typically needs both. SOC 2 evidence can inform CMMC evidence collection but the certification processes are completely separate.</span></div>
      <div class="cheat-pill"><strong>CMMC and StateRAMP/FedRAMP</strong><span>Cloud service providers used for CMMC environments must be FedRAMP authorized (or equivalent). Organizations that operate cloud services used in the defense supply chain may themselves pursue FedRAMP authorization — making them preferred providers for CMMC-compliant contractors.</span></div>
    </div>
    <div class="highlight-box"><strong>The integration opportunity:</strong> Organizations that leverage framework mappings can build one integrated security program that satisfies CMMC Level 2, ISO 27001, and CIS Controls IG2 simultaneously — rather than maintaining three separate compliance programs. The NIST SP 800-171 A (assessment procedures) and NIST SP 800-53 crosswalk make these mappings explicit. Integrated compliance programs reduce cost, reduce audit fatigue, and produce more coherent security programs.</div>`,
    quiz: { q: "A defense contractor already has ISO 27001 certification. How does this position them for CMMC Level 2 compliance?", opts: ["ISO 27001 certification automatically satisfies CMMC Level 2 requirements", "ISO 27001 provides a strong foundation with approximately 70% overlap, but CMMC-specific requirements (SPRS scoring, CUI handling procedures, DoD-specific incident reporting) must still be implemented and the CMMC assessment is a completely separate process", "ISO 27001 and CMMC are incompatible frameworks", "ISO 27001 only satisfies Level 1 requirements"], ans: 1, explain: "ISO 27001 provides valuable foundation for CMMC — the management system approach, risk assessment methodology, and many Annex A controls overlap substantially with CMMC Level 2. However, CMMC has government-specific requirements (CUI handling, SPRS scoring, DoD incident reporting) that are not covered by ISO 27001. The ISO 27001 ISMS and documented evidence can be leveraged in the CMMC assessment, but ISO 27001 certification does not substitute for CMMC certification." }
  },
  {
    title: "CMMC Incident Reporting — The 72-Hour Rule",
    tagline: "What defense contractors must do when a cyber incident occurs",
    body: `<p>Defense contractors subject to CMMC have specific, mandatory incident reporting requirements that differ significantly from commercial cybersecurity incident response. Understanding these requirements is critical — violations can have severe contract consequences beyond the security impact of the incident itself.</p>
    <div class="highlight-box"><strong>The DFARS 252.204-7012 reporting requirement:</strong> Contractors who experience a cyber incident on systems that process, store, or transmit covered defense information (CDI, which includes CUI) must: report the incident to the DoD within <strong>72 hours</strong> of discovery, preserve images of compromised systems for 90 days (to support DoD forensic analysis), and rapidly report any malicious software discovered.</div>
    <p>What must be reported in a DoD cyber incident report:</p>
    <div class="badge-row">
      <span class="badge badge-blue">Company name and CAGE code</span>
      <span class="badge badge-blue">Contract numbers affected</span>
      <span class="badge badge-blue">Facility CAGE code where incident occurred</span>
      <span class="badge badge-blue">Date incident was discovered</span>
      <span class="badge badge-blue">Location of compromise</span>
      <span class="badge badge-blue">Type of compromise (insider threat, external, etc.)</span>
      <span class="badge badge-blue">Description of the technique used</span>
      <span class="badge badge-blue">Description of CUI categories potentially compromised</span>

let current = 0;

function buildGrid(){
  const g = document.getElementById('dayGrid');
  g.innerHTML = '';
  for(let i = 0; i < days.length; i++){
    const b = document.createElement('button');
    b.className = 'day-pip' + (days[i].isCheatSheet ? ' cheat' : '') + (i === current ? ' active' : '');
    b.textContent = days[i].isCheatSheet ? 'CS' : (i + 1);
    b.title = days[i].title;
    b.onclick = (()=>{ const idx = i; return () => goTo(idx); })();
    g.appendChild(b);
  }
}

function goTo(idx){ current = idx; render(); }
function changeDay(dir){ current = Math.max(0, Math.min(days.length - 1, current + dir)); render(); }

function render(){
  const d = days[current];
  const total = days.length;
  document.getElementById('dayCounter').textContent = (current + 1) + ' / ' + total;
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === total - 1;
  document.getElementById('progBar').style.width = (((current + 1) / total) * 100) + '%';
  buildGrid();

  if(d.isCheatSheet){
    document.getElementById('lessonArea').innerHTML = `
      <div class="card">
        <div class="lesson-header">
          <div class="day-badge" style="background:#E1F5EE">
            <div class="day-num" style="color:#085041;font-size:14px">CHEAT</div>
            <div class="day-lbl" style="color:#0F6E56">SHEET</div>
          </div>
          <div class="lesson-meta">
            <h2>${d.title}</h2>
            <div class="tagline">${d.tagline}</div>
          </div>
        </div>
        <div class="lesson-body">${d.body}</div>
      </div>`;
    return;
  }

  const quizId = 'quiz_' + current;
  let quizHtml = '';
  if(d.quiz){
    const optsHtml = d.quiz.opts.map((o, i) =>
      `<button class="quiz-btn" onclick="checkAnswer(${i}, ${d.quiz.ans}, '${quizId}')">${o}</button>`
    ).join('');
    quizHtml = `<div class="quiz-box">
      <p>Quick check: ${d.quiz.q}</p>
      <div>${optsHtml}</div>
      <div class="answer-reveal" id="${quizId}"></div>
    </div>`;
  }

  document.getElementById('lessonArea').innerHTML = `
    <div class="card">
      <div class="lesson-header">
        <div class="day-badge">
          <div class="day-num">${current + 1}</div>
          <div class="day-lbl">Day</div>
        </div>
        <div class="lesson-meta">
          <h2>${d.title}</h2>
          <div class="tagline">${d.tagline}</div>
        </div>
      </div>
      <div class="section-label">Today's lesson</div>
      <div class="lesson-body">${d.body}</div>
      ${quizHtml}
    </div>`;
}

function checkAnswer(chosen, correct, qid){
  const el = document.getElementById(qid);
  const d = days[current];
  if(!d.quiz) return;
  const isRight = chosen === correct;
  el.innerHTML = `<strong>${isRight ? 'Correct!' : 'Not quite.'}</strong> ${d.quiz.explain}`;
  el.className = 'answer-reveal show';
  el.style.background = isRight ? '#EAF3DE' : '#FCEBEB';
  el.style.borderColor = isRight ? '#3B6D11' : '#A32D2D';
  el.style.color = '#1a1a18';
}

render();
</script>
</body>
</html>
