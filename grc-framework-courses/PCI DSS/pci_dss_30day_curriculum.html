<script>
const days = [
  {
    title: "What Is PCI-DSS?",
    tagline: "The global security standard that protects every card payment you make",
    body: `<p>Think about the last time you bought something with a credit or debit card. Maybe it was at a coffee shop, an online store, or a gas station. In that single transaction, your card number, expiration date, and security code traveled through multiple systems — the merchant's terminal, their bank, the card network, and your issuing bank. Any one of those points could be attacked by criminals who want your financial data. The <span class="key-term">Payment Card Industry Data Security Standard</span> — PCI-DSS — is the global security standard that protects all of it.</p>
    <p>PCI-DSS is a set of security requirements that must be met by any organization that stores, processes, or transmits payment card data — credit cards, debit cards, and prepaid cards from Visa, Mastercard, American Express, Discover, and JCB. The current version is <strong>PCI-DSS v4.0.1</strong>, released in June 2024, which supersedes PCI-DSS v3.2.1. It is governed by the <strong>Payment Card Industry Security Standards Council (PCI SSC)</strong>, founded in 2006 by the five major card brands.</p>
    <div class="analogy-box"><strong>Real-world analogy:</strong> Think of PCI-DSS like the safety standards for electrical wiring in buildings. Every electrician, every building code, every country that uses modern electrical systems follows specific standards — not because governments mandated them internationally, but because the people who design, sell, and use electrical systems agreed that everyone needs to follow the same safety rules or the whole system fails dangerously. PCI-DSS is the "electrical code" for payment card security: agreed upon by the major card brands and enforced through contracts with every business that wants to accept card payments.</div>
    <div class="highlight-box">Key facts about PCI-DSS: Current version: v4.0.1 (June 2024). Governed by the PCI Security Standards Council (PCI SSC). Mandatory for all organizations that store, process, or transmit cardholder data. Not a law — enforced through contracts with card brands and acquiring banks. Non-compliance penalties include fines, increased transaction fees, and ultimately losing the ability to accept card payments. Applies globally — any business anywhere in the world that accepts payment cards from the five major brands must comply.</div>`,
    quiz: { q: "PCI-DSS is enforced through law in the United States. True or false?", opts: ["True — the US government mandates PCI-DSS compliance", "False — PCI-DSS is a contractual requirement enforced by card brands and acquiring banks, not a law. However, some US states have incorporated PCI-DSS standards into state data breach laws.", "True — the Federal Trade Commission enforces PCI-DSS", "False — PCI-DSS has no enforcement mechanism at all"], ans: 1, explain: "PCI-DSS is not a law — it is a contractual requirement. When a business signs an agreement with an acquiring bank to accept card payments, they contractually agree to comply with PCI-DSS. The card brands (Visa, Mastercard, etc.) enforce compliance through the acquiring banks. Penalties come in the form of fines, higher transaction fees, and loss of card acceptance privileges — not criminal prosecution. Some US states have incorporated PCI-DSS elements into state data breach statutes, but PCI-DSS itself is industry-driven, not government-mandated." }
  },
  {
    title: "Why Was PCI-DSS Created?",
    tagline: "The wave of card breaches that forced the industry to act",
    body: `<p>By the early 2000s, payment card fraud had become a massive and growing crisis. Criminals were targeting merchants, processors, and banks to steal cardholder data on an industrial scale. The problem was that each card brand — Visa, Mastercard, American Express, Discover — had its own separate security program with different requirements. A merchant accepting all five brands had to comply with five different, sometimes contradictory standards. The entire industry needed one unified standard.</p>
    <div class="highlight-box"><strong>The TJX breach — the case that changed everything:</strong> In 2005-2006, TJX Companies (parent of TJ Maxx, Marshalls, and HomeGoods) suffered the largest retail data breach ever recorded at the time. Attackers exploited weak wireless encryption in TJX's retail network and stole an estimated 45-94 million credit and debit card numbers over 18 months before detection. The breach cost TJX over $256 million in settlements and drove home the urgent need for consistent, enforceable security standards across the entire payment industry. PCI-DSS was already in development when the breach was discovered — the TJX case accelerated its adoption and gave it urgency.</div>
    <p>The founding context of PCI-DSS:</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Fragmented Standards</strong><span>Before 2004, each card brand had its own security program: Visa had CISP, Mastercard had SDP, American Express had DSOP. Each had different requirements, different assessment processes, and different reporting mechanisms — creating enormous compliance complexity for merchants.</span></div>
      <div class="cheat-pill"><strong>Escalating Fraud</strong><span>Card fraud losses were rising rapidly. Criminals had industrialized the theft of cardholder data, moving from individual skimming attacks to large-scale network intrusions that could steal millions of card numbers at once from merchant databases.</span></div>
      <div class="cheat-pill"><strong>Shared Infrastructure Risk</strong><span>The payment card ecosystem is interdependent — a breach at one merchant or processor affects all the card brands, all the issuing banks, and all the consumers who hold those cards. No single brand could solve the problem alone; a shared standard was necessary.</span></div>
      <div class="cheat-pill"><strong>Industry Self-Regulation</strong><span>The card brands chose to create their own standard rather than wait for government regulation — giving them control over the technical requirements and enforcement mechanisms. PCI-DSS became the industry's answer to the question: "How do we secure the global payment system before governments force us to?"</span></div>
    </div>
    <div class="analogy-box"><strong>The formation of PCI SSC:</strong> In 2006, Visa, Mastercard, American Express, Discover, and JCB International formed the PCI Security Standards Council — a neutral, independent body that owns and maintains PCI-DSS. This was unprecedented: five competing companies that fight fiercely for market share agreed to collaborate on a shared security standard because fraud threatened the entire payment ecosystem. The standard they jointly published became the foundation of payment security worldwide.</div>`,
    quiz: { q: "Why did five competing card brands agree to create a single shared security standard rather than maintaining their separate programs?", opts: ["Because government regulators forced them to consolidate", "Because payment card fraud threatened the entire shared ecosystem — a breach at one point affects all brands, and fragmented standards created compliance complexity that left merchants less secure rather than more", "Because it reduced their individual compliance costs", "Because Visa was dominant enough to force the others to adopt its standard"], ans: 1, explain: "The card brands created a unified standard because the payment ecosystem is interdependent — a cardholder data breach at a merchant affects all card brands whose cards were stored there, regardless of which brand the criminal targeted. Fragmented standards also created impossible compliance situations for merchants accepting multiple brands. The shared threat to the entire payment infrastructure overrode the competitive instinct to maintain separate programs." }
  },
  {
    title: "The PCI Security Standards Council",
    tagline: "The organization that owns, maintains, and evolves PCI-DSS",
    body: `<p>The <span class="key-term">PCI Security Standards Council (PCI SSC)</span> is the independent organization that develops, manages, and maintains PCI-DSS and related security standards. Understanding how the Council works, who its members are, and how it differs from the card brands that enforce the standard is essential for navigating the PCI-DSS ecosystem.</p>
    <div class="highlight-box">The PCI SSC is a separate entity from the card brands. The five founding card brands (Visa, Mastercard, American Express, Discover, JCB) are the Council's "founding members" and ultimate decision-makers — but the Council operates independently with its own staff, headquarters (in Wakefield, Massachusetts), and governance structure. Critically: the PCI SSC develops the standards but does NOT enforce them. Enforcement is done by each individual card brand through their own programs and through acquiring banks.</div>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Standards Development</strong><span>PCI SSC develops and maintains: PCI-DSS (the main standard), PA-DSS/PCI Secure Software Standard (for payment applications), PCI P2PE (point-to-point encryption), PCI TSP (token service providers), and other related standards. Each standard addresses a different component of the payment security ecosystem.</span></div>
      <div class="cheat-pill"><strong>Qualified Security Assessors (QSAs)</strong><span>PCI SSC certifies QSAs — independent security companies authorized to conduct formal PCI-DSS assessments for Level 1 merchants and service providers. QSAs must be certified by PCI SSC through a rigorous training and testing program. Their assessments carry official standing in the PCI compliance ecosystem.</span></div>
      <div class="cheat-pill"><strong>Approved Scanning Vendors (ASVs)</strong><span>PCI SSC approves ASVs — companies authorized to conduct the quarterly external vulnerability scans required by PCI-DSS. ASV tools and processes must meet PCI SSC specifications to ensure scans reliably identify vulnerabilities that PCI-DSS requires organizations to address.</span></div>
      <div class="cheat-pill"><strong>Participating Organizations</strong><span>Thousands of merchants, banks, service providers, and technology vendors participate in PCI SSC as "Participating Organizations" — providing industry input on standard development. Through a structured feedback program, these organizations influence how PCI-DSS evolves to address new payment technologies and threats.</span></div>
    </div>
    <div class="warning-box"><strong>The PCI SSC / card brand distinction matters:</strong> When a merchant is penalized for PCI non-compliance — fined, charged higher transaction fees, or terminated — that action comes from their acquiring bank acting on behalf of the card brands, NOT from PCI SSC. PCI SSC sets the rules; the card brands enforce them through the acquiring banks. Compliance programs, dispute resolution, and penalty appeals go through the card brands, not PCI SSC. This split between standards-setting and enforcement is a distinctive feature of the PCI compliance ecosystem.</div>`,
    quiz: { q: "A merchant receives a PCI non-compliance fine. Who issued this fine?", opts: ["The PCI Security Standards Council directly", "Their acquiring bank, acting on behalf of the relevant card brand(s) — PCI SSC sets the standards but enforcement and penalties flow through the card brands and acquiring banks", "The Federal Trade Commission", "A Qualified Security Assessor"], ans: 1, explain: "PCI SSC develops the standards but has no enforcement authority. Fines, penalties, and ultimately the ability to accept card payments are controlled by the card brands (Visa, Mastercard, etc.) working through the acquiring banks that process merchants' transactions. A merchant's acquiring bank is their direct enforcement relationship — the bank is responsible for ensuring their merchants comply with PCI-DSS and faces consequences from card brands if they don't." }
  },
  {
    title: "Cardholder Data — What PCI-DSS Protects",
    tagline: "The specific data elements that define what's in scope for PCI-DSS",
    body: `<p>PCI-DSS is not about protecting "all financial data" or "all customer information." It has a very specific scope: <span class="key-term">cardholder data</span> and <span class="key-term">sensitive authentication data</span>. Understanding exactly what counts as in-scope cardholder data is the foundation of PCI-DSS compliance — because the entire framework exists to protect these specific data elements, and organizations only have compliance obligations for systems that touch them.</p>
    <div class="highlight-box"><strong>The payment card data elements:</strong><br><br><strong>Cardholder Data (CHD) — can be stored with proper protection:</strong><br>• Primary Account Number (PAN) — the 16-digit card number. The most critical element; all other data is only in-scope if it exists alongside a PAN.<br>• Cardholder Name<br>• Expiration Date<br>• Service Code<br><br><strong>Sensitive Authentication Data (SAD) — can NEVER be stored after authorization, even encrypted:</strong><br>• Full magnetic stripe data (track data)<br>• CAV2/CVC2/CVV2/CID — the 3-4 digit security code<br>• PINs and PIN blocks</div>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>The PAN is the anchor</strong><span>The Primary Account Number (the 16-digit card number) is the central element. Without a PAN, other data elements like cardholder name and expiration date are not "cardholder data" for PCI-DSS purposes. The PAN is what makes data in-scope.</span></div>
      <div class="cheat-pill"><strong>SAD can never be stored</strong><span>Sensitive Authentication Data — especially the magnetic stripe contents and CVV/CVC codes — cannot be stored after a transaction is authorized, even if encrypted. This is one of PCI-DSS's most absolute prohibitions. The authorization network needs this data to approve transactions, but once approved, it must be gone.</span></div>
      <div class="cheat-pill"><strong>Truncation protects PAN</strong><span>Organizations that only store a truncated PAN (like the last four digits on a receipt) don't need to protect that data as a full PAN. Truncation is one of the key techniques for reducing PCI scope — if you only store "xxxx-xxxx-xxxx-1234" you don't have a full PAN.</span></div>
      <div class="cheat-pill"><strong>Tokenization</strong><span>Tokenization replaces the actual PAN with a random "token" that has no mathematical relationship to the real card number. Systems using only tokens — not actual PANs — can be removed from PCI scope entirely, because tokens are worthless to attackers even if stolen.</span></div>
    </div>
    <div class="analogy-box"><strong>Why CVV codes must never be stored:</strong> The CVV (Card Verification Value) is specifically designed to prove the physical card is present in a transaction. If merchants stored CVVs, attackers who stole a database of card numbers could also steal the CVVs — enabling them to make "card present" purchases even without the physical card. The no-CVV-storage rule is deliberately designed to limit what stolen data can do. Even if attackers steal a PAN database, without the CVV, they can't easily conduct certain types of fraud.</div>`,
    quiz: { q: "A merchant's database contains cardholder names and expiration dates, but not the Primary Account Number (PAN). Is this data subject to PCI-DSS requirements?", opts: ["Yes — any payment-related data is covered by PCI-DSS", "No — cardholder name and expiration date without a PAN are not cardholder data for PCI-DSS purposes. The PAN is the defining element that brings other data into scope.", "Yes — expiration dates always trigger PCI-DSS obligations", "It depends on the number of cards in the database"], ans: 1, explain: "PCI-DSS defines cardholder data as data that includes or is associated with a Primary Account Number (PAN). Cardholder name and expiration date stored without a corresponding PAN are not subject to PCI-DSS requirements as cardholder data — the PAN is the anchor that defines in-scope data. This distinction matters significantly for organizations that want to reduce their PCI scope by eliminating PAN storage." }
  },
  {
    title: "The Cardholder Data Environment (CDE)",
    tagline: "Defining what's in scope — the most important compliance decision you'll make",
    body: `<p>The <span class="key-term">Cardholder Data Environment (CDE)</span> is the network of people, processes, and technology that stores, processes, or transmits cardholder data. Everything within the CDE must comply with PCI-DSS. Everything connected to the CDE that could impact the security of cardholder data is also in scope. Understanding and carefully defining the CDE is the single most strategically important PCI-DSS decision — because scope determines the entire compliance program's cost, complexity, and effort.</p>
    <div class="highlight-box"><strong>Three categories of in-scope systems:</strong><br><br><strong>Category 1 — Systems that store, process, or transmit CHD/SAD:</strong> Payment terminals, payment applications, databases containing card data. These are unambiguously in scope.<br><br><strong>Category 2 — Systems that provide security services to Category 1:</strong> Authentication servers, SIEM systems, patch management servers, logging systems. These affect the security of Category 1 systems even if they don't touch card data directly.<br><br><strong>Category 3 — Systems connected to Category 1 that could impact security:</strong> Any system with network connectivity to the CDE that could be used as a pivot point to attack Category 1 systems.</div>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Scope reduction is strategic</strong><span>Every system removed from PCI scope is a system that doesn't need the full set of PCI-DSS controls. Organizations that aggressively and legitimately reduce scope — through network segmentation, tokenization, and avoiding card data storage — dramatically reduce the cost and complexity of PCI compliance.</span></div>
      <div class="cheat-pill"><strong>Network segmentation</strong><span>If the CDE is isolated from other networks through firewalls, routers, and other segmentation controls, systems outside the segmented CDE are not automatically in scope. Without segmentation, every system on the network could be in scope. Effective segmentation is one of the most powerful scope-reduction tools.</span></div>
      <div class="cheat-pill"><strong>Connected systems</strong><span>A critical scoping principle: any system that has network connectivity to the CDE — even if it doesn't touch card data — can be in scope if it could be compromised to attack the CDE. An HR system on the same flat network as payment systems is potentially in scope.</span></div>
      <div class="cheat-pill"><strong>Scope creep</strong><span>One of the most common PCI compliance failures is "scope creep" — cardholder data appearing in systems that aren't expected or intended to hold it. Log files capturing card numbers, email systems receiving card data from customers, and development environments with copies of production data are common scope creep sources.</span></div>
    </div>
    <div class="analogy-box"><strong>The quarantine analogy:</strong> Think of the CDE like a quarantine zone in a hospital. The quarantine zone contains the potentially dangerous material (card data). Segmentation is the barrier between the quarantine zone and the rest of the hospital. Systems in the quarantine zone must meet the strictest standards. Systems that serve the quarantine zone (like the HVAC system) also have obligations. Systems completely outside the quarantine zone with no connection to it are not subject to quarantine requirements. The goal is to make the quarantine zone as small as possible while still being able to function.</div>`,
    quiz: { q: "An organization uses network segmentation to isolate their payment processing systems on a separate network segment. Their employee HR system on a completely separate network has no connection to the payment network. Is the HR system in scope for PCI-DSS?", opts: ["Yes — all systems in an organization that accepts card payments are in scope", "No — with proper network segmentation, the HR system has no connectivity to the CDE and cannot impact card data security, removing it from PCI scope", "Only if the HR system processes employee expense reimbursements", "Yes — HR data and cardholder data are related"], ans: 1, explain: "With effective network segmentation, systems that have no connectivity to the CDE and cannot impact the security of cardholder data are out of scope for PCI-DSS. This is one of the primary benefits of network segmentation — it limits the scope of compliance requirements to systems that actually matter for card data security. The segmentation itself must be tested and validated periodically to confirm it actually isolates the CDE as intended." }
  },
  {
    title: "The 12 PCI-DSS Requirements — Overview",
    tagline: "The complete security framework organized into six goals",
    body: `<p>PCI-DSS v4.0 is organized into <strong>12 Requirements</strong> grouped under <strong>6 Goals</strong>. Each requirement addresses a distinct aspect of payment card security, from physical protection to software development practices. Understanding the structure before diving into individual requirements provides essential context for how the standard approaches comprehensive payment security.</p>
    <div class="goal-card"><b>Goal 1 — Build and Maintain a Secure Network and Systems</b><br>Requirement 1: Install and Maintain Network Security Controls<br>Requirement 2: Apply Secure Configurations to All System Components</div>
    <div class="goal-card"><b>Goal 2 — Protect Account Data</b><br>Requirement 3: Protect Stored Account Data<br>Requirement 4: Protect Cardholder Data with Strong Cryptography During Transmission Over Open, Public Networks</div>
    <div class="goal-card"><b>Goal 3 — Maintain a Vulnerability Management Program</b><br>Requirement 5: Protect All Systems and Networks from Malicious Software<br>Requirement 6: Develop and Maintain Secure Systems and Software</div>
    <div class="goal-card"><b>Goal 4 — Implement Strong Access Control Measures</b><br>Requirement 7: Restrict Access to System Components and Cardholder Data by Business Need to Know<br>Requirement 8: Identify Users and Authenticate Access to System Components<br>Requirement 9: Restrict Physical Access to Cardholder Data</div>
    <div class="goal-card"><b>Goal 5 — Regularly Monitor and Test Networks</b><br>Requirement 10: Log and Monitor All Access to System Components and Cardholder Data<br>Requirement 11: Test Security of Systems and Networks Regularly</div>
    <div class="goal-card"><b>Goal 6 — Maintain an Information Security Policy</b><br>Requirement 12: Support Information Security with Organizational Policies and Programs</div>
    <div class="analogy-box"><strong>The layered defense approach:</strong> Notice how the 12 requirements build on each other in layers. You start by securing the network perimeter (Requirements 1-2), then protect the data itself (3-4), then hunt and fix vulnerabilities (5-6), then control who can access what (7-9), then watch for problems continuously (10-11), and underpin everything with organizational policy (12). This layered approach — sometimes called "defense in depth" — means attackers face multiple independent barriers rather than a single point of failure.</div>`,
    quiz: { q: "Which of the six PCI-DSS goals addresses the human and organizational side of security — policies, programs, and organizational responsibilities?", opts: ["Goal 1 — Build and Maintain a Secure Network", "Goal 4 — Implement Strong Access Control Measures", "Goal 6 — Maintain an Information Security Policy (Requirement 12)", "Goal 3 — Maintain a Vulnerability Management Program"], ans: 2, explain: "Goal 6 (Requirement 12 — Support Information Security with Organizational Policies and Programs) addresses the human and organizational foundation of PCI compliance: the security policies, procedures, roles, responsibilities, and awareness programs that make technical controls effective. Without this organizational layer, even perfectly deployed technical controls are undermined by human error and unclear accountability." }
  },
  {
    title: "Requirement 1 — Network Security Controls",
    tagline: "Firewalls, routers, and the barriers that protect the cardholder data environment",
    body: `<p><span class="key-term">Requirement 1</span> — "Install and Maintain Network Security Controls" — establishes the network perimeter defenses that protect the CDE from the broader network and internet. Network security controls (NSCs) — firewalls, routers, and equivalent technologies — are the first line of defense against attacks on cardholder data systems.</p>
    <div class="highlight-box">Requirement 1 covers: installing network security controls on all network connections between the CDE and untrusted networks; maintaining a current diagram of all network connections to the CDE; using stateful inspection firewalls that track connection state; reviewing firewall and router rules at least every six months; and prohibiting direct public access between the internet and any component in the CDE.</div>
    <p>Key Requirement 1 mandates:</p>
    <div class="req-card"><b>1.2.1 — Network Security Control Policies</b><br>All security features and settings for network security controls must be documented and reviewed regularly. "Install a firewall and forget about it" is not compliance — rules must be reviewed, approved, justified, and documented.</div>
    <div class="req-card"><b>1.2.3 — Network Diagrams</b><br>A current diagram showing all connections between the CDE and other networks must be maintained and kept up to date. Auditors look for this diagram — if you can't map your own network, you can't know what's in scope.</div>
    <div class="req-card"><b>1.3.2 — Restrict Inbound and Outbound Traffic</b><br>Inbound and outbound traffic to and from the CDE must be restricted to only what is necessary for business purposes. Both directions matter — inbound prevents unauthorized access; outbound prevents data exfiltration and malware command-and-control communications.</div>
    <div class="req-card"><b>1.4.2 — No Direct Public Access to CDE</b><br>Direct connections between the internet and any system component in the CDE are prohibited. All internet-facing services must go through a DMZ or equivalent architecture with additional network security controls between the internet and CDE systems.</div>
    <div class="req-card"><b>1.5.1 — Security Controls for Personal Devices</b><br>Security policies and operational procedures for managing network security controls on personal devices used to connect to the CDE must be documented and implemented.</div>
    <div class="analogy-box"><strong>The firewall rules review analogy:</strong> Firewall rules are like the locks on a building. Over time, if nobody reviews which doors are locked, old passkeys accumulate, unnecessary rooms get unlocked, and temporary access granted years ago never gets revoked. PCI-DSS requires reviewing firewall rules every six months specifically because rule sets tend to grow over time as exceptions are added but rarely removed — creating an expanding attack surface that nobody notices. The review is the discipline that prevents "security archaeology" — digging through years of rules to find why a door is open.</div>`,
    quiz: { q: "Requirement 1.4.2 prohibits direct public internet access to CDE systems. Why is a DMZ (demilitarized zone) architecture required rather than just having a firewall between the internet and CDE?", opts: ["Because DMZs are less expensive than firewalls", "Because a DMZ creates an additional segmented network layer between the internet and the CDE — if an internet-facing server is compromised, the attacker still faces another barrier before reaching cardholder data systems rather than having direct access", "Because firewalls alone are not required by PCI-DSS", "Because DMZs are required by law for any organization handling financial data"], ans: 1, explain: "A DMZ architecture places internet-facing services (web servers, email gateways) in a network zone between two sets of firewalls — the outer firewall faces the internet, the inner firewall faces the CDE. If an attacker compromises an internet-facing server in the DMZ, they still face the inner firewall before reaching CDE systems. This defense-in-depth approach means a single firewall compromise doesn't give attackers direct access to cardholder data." }
  },
  {
    title: "Requirement 2 — Secure Configurations",
    tagline: "Locking down every system before it ever touches card data",
    body: `<p><span class="key-term">Requirement 2</span> — "Apply Secure Configurations to All System Components" — addresses a fundamental security truth: systems come from vendors with default configurations optimized for ease of setup, not security. Default passwords, unnecessary services, open ports, and permissive settings must all be hardened before any system is allowed in the CDE.</p>
    <div class="highlight-box">Requirement 2 covers: eliminating vendor defaults including default passwords; disabling or removing unnecessary services, ports, protocols, and functionality; establishing configuration standards for all system types in the CDE; and applying secure configurations consistently across all CDE components — servers, workstations, network devices, databases, and applications.</div>
    <div class="req-card"><b>2.2.1 — Configuration Standards</b><br>Configuration standards for all system components must be developed, implemented, and maintained. These standards must address: changing vendor defaults, disabling unnecessary functionality, documenting implemented services, and protecting systems against known vulnerabilities.</div>
    <div class="req-card"><b>2.2.7 — Non-Console Administrative Access</b><br>All non-console administrative access (remote access for administration) must use strong cryptography. Administrative interfaces accessed over the network must be encrypted — plain-text Telnet, HTTP, or FTP for administrative purposes is prohibited.</div>
    <div class="req-card"><b>2.3.1 — Wireless Security</b><span> If wireless technology is connected to or used in the CDE, all wireless vendor defaults must be changed, including default passwords and security keys. Wireless access points must use strong encryption (WPA3 or WPA2 AES minimum).</span></div>
    <div class="warning-box"><strong>Why vendor defaults are dangerous:</strong> Every system administrator, security researcher, and attacker knows the default usernames and passwords for common systems: "admin/admin" for many routers, "sa/blank" for SQL Server, "cisco/cisco" for Cisco devices. These defaults are published in vendor documentation and widely known in the security community. Any system deployed with default credentials in the CDE is trivially compromised — it's essentially an unlocked door with the combination printed on the door handle. PCI-DSS makes changing vendor defaults non-negotiable.</div>
    <div class="analogy-box"><strong>Hardening and the principle of least functionality:</strong> Requirement 2's approach is built on "least functionality" — systems should only run services, open ports, and enable features that are necessary for their intended business function. A payment processing server doesn't need a file transfer service, a web server, and a gaming client installed on it. Every unnecessary service is a potential attack vector. "If it's not needed, disable it" is the operational principle behind Requirement 2.</div>`,
    quiz: { q: "A new payment server is deployed in the CDE. The vendor documentation shows the system comes with 12 default services enabled. Only 3 are needed for payment processing. Under Requirement 2, what must be done with the other 9 services?", opts: ["They can remain enabled as long as they have firewalls protecting them", "The unnecessary 9 services must be disabled or removed — Requirement 2 mandates disabling all functionality not required for business purposes to minimize the attack surface", "They must be documented but can remain enabled", "They only need to be disabled if they have known vulnerabilities"], ans: 1, explain: "Requirement 2 mandates disabling or removing unnecessary services, ports, protocols, and functions — not just documenting them or protecting them with additional controls. Every enabled service that isn't needed is unnecessary attack surface. Attackers routinely exploit services that organizations forgot were running. The principle of least functionality requires that only what's necessary for the intended purpose is enabled — everything else must go." }
  },
  {
    title: "Requirement 3 — Protect Stored Account Data",
    tagline: "If you must store card data, you must protect it with every tool available",
    body: `<p><span class="key-term">Requirement 3</span> — "Protect Stored Account Data" — is built around a powerful underlying message: <em>don't store cardholder data unless you absolutely have to.</em> Every piece of card data stored is a potential liability. When storage is genuinely necessary, Requirement 3 specifies exactly how to protect it. And for certain sensitive data elements, no amount of protection is sufficient — they simply cannot be stored after authorization.</p>
    <div class="highlight-box"><strong>The storage minimization principle:</strong> PCI-DSS's starting position is that cardholder data storage should be minimized. Before implementing Requirement 3's protections, organizations should ask: do we actually need to store this? Can we use a token instead? Can we truncate the PAN? Can we redesign the business process to avoid storage? The best protection for data is not storing it in the first place.</div>
    <div class="req-card"><b>3.2.1 — SAD Must Not Be Stored Post-Authorization</b><br>Sensitive Authentication Data (full magnetic stripe, CVV/CVC codes, PINs) must not be stored after authorization, even if encrypted. This is an absolute prohibition — no business justification can override it. After the authorization network has processed the transaction, this data must be gone.</div>
    <div class="req-card"><b>3.3.1 — Protect SAD During Pre-Authorization</b><br>SAD captured during transaction processing must be protected with strong cryptography during the authorization process. Even though it can't be stored after authorization, it must be protected during the brief period when it's being used for authorization.</div>
    <div class="req-card"><b>3.4.1 — PAN Must Be Unreadable Where Stored</b><br>The Primary Account Number must be rendered unreadable wherever it is stored — through strong one-way hash functions, truncation (storing only the last 4 digits), index tokens, or strong cryptography with key management. A stored PAN in plain text is a critical PCI violation.</div>
    <div class="req-card"><b>3.5 — Encryption Key Management</b><br>Organizations that use cryptography to protect stored PANs must have documented key management procedures covering: key generation, distribution, storage, retirement, and destruction. The security of encrypted card data depends entirely on the security of the encryption keys — poor key management renders encryption useless.</div>
    <div class="analogy-box"><strong>Why truncation is so powerful:</strong> If a receipt shows "xxxx-xxxx-xxxx-1234" — the last four digits — that data simply cannot be used to make fraudulent transactions. You can't reconstruct the full 16-digit PAN from the last four digits. Truncation is one of the simplest, most effective PCI scope-reduction techniques: if you only keep the last four digits of every PAN, you no longer have cardholder data that needs PCI protection. Many organizations that thought they needed to store full PANs discover they only need the last four for their actual business purposes.</analogy-box>`,
    quiz: { q: "A merchant's system stores the full magnetic stripe data from customer cards to enable 'card-on-file' recurring billing. Is this permissible under PCI-DSS?", opts: ["Yes — stored magnetic stripe data is acceptable if encrypted with AES-256", "No — storing full magnetic stripe data (track data) is prohibited regardless of encryption. Track data is Sensitive Authentication Data that can never be stored after authorization under any circumstances.", "Yes — if the merchant has Level 1 compliance certification", "Only if the merchant has obtained explicit customer consent"], ans: 1, explain: "Full magnetic stripe data (track data) is Sensitive Authentication Data — one of the data elements that cannot be stored after authorization under any circumstances, regardless of encryption, compliance level, or business justification. Storing magnetic stripe data enables the creation of counterfeit cards. PCI-DSS's absolute prohibition on post-authorization SAD storage specifically exists to prevent this attack vector." }
  },
  {
    title: "Requirement 4 — Cryptography During Transmission",
    tagline: "Protecting card data as it travels across networks you don't control",
    body: `<p><span class="key-term">Requirement 4</span> — "Protect Cardholder Data with Strong Cryptography During Transmission Over Open, Public Networks" — addresses the security of card data in transit. While Requirement 3 protects data at rest, Requirement 4 ensures that when card data must travel across networks — especially the public internet — it is protected from interception.</p>
    <div class="highlight-box">Open public networks include: the internet, wireless technologies (WiFi, Bluetooth), cellular networks, satellite communications, and general use of radio technologies. Any transmission of cardholder data across these networks must use strong cryptography — specifically TLS (Transport Layer Security) version 1.2 or higher, or equivalent strong cryptographic protocols. Older protocols like SSL, TLS 1.0, and TLS 1.1 are explicitly prohibited by PCI-DSS v4.0.</div>
    <div class="req-card"><b>4.2.1 — Strong Cryptography for Transmissions</b><br>Strong cryptography must be used to safeguard PAN during transmission over open, public networks. Trusted keys and certificates must be confirmed before transmission. The protocol and cryptographic strength must be validated — not just "HTTPS is enabled" but the specific cipher suites and protocol version must be appropriate.</div>
    <div class="req-card"><b>4.2.2 — PAN in Messaging Technologies</b><br>PANs must not be sent via messaging technologies such as email, SMS, or chat — unless the messaging technology has been secured with strong end-to-end encryption. Sending card numbers in plain-text emails to process phone orders is prohibited, regardless of how convenient it might be for the business.</div>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>TLS Protocol Versions</strong><span>PCI-DSS v4.0 requires TLS 1.2 minimum for all transmissions of cardholder data over public networks. TLS 1.3 is preferred. SSL, TLS 1.0, and TLS 1.1 are all explicitly prohibited — these older protocols have known vulnerabilities (POODLE, BEAST, DROWN) that cannot be adequately mitigated.</span></div>
      <div class="cheat-pill"><strong>Certificate Management</strong><span>The TLS certificates that enable encrypted connections must be from trusted certificate authorities, must not be expired, and must be validated before trusting a transmission. Self-signed certificates without proper validation can enable man-in-the-middle attacks that undermine encryption entirely.</span></div>
    </div>
    <div class="analogy-box"><strong>Why "HTTPS is enough" is wrong:</strong> Many organizations assume that displaying a padlock icon in the browser means they're PCI compliant for data transmission. But PCI-DSS requires specific, current protocol versions and cipher suites. An HTTPS connection using TLS 1.0 (which has known exploitable vulnerabilities) fails PCI-DSS requirements even though it technically uses "HTTPS." PCI compliance requires validating that encryption is actually strong — not just technically present. This is why automated scanning and configuration testing are part of PCI assessments.</div>`,
    quiz: { q: "A customer service representative receives a customer's card number via email and processes the transaction manually. The email system does not use end-to-end encryption. Does this violate PCI-DSS?", opts: ["No — email is an internal system, not a public network", "Yes — Requirement 4.2.2 prohibits sending PANs via messaging technologies including email unless end-to-end encryption is in place. Receiving a card number via unencrypted email violates PCI-DSS transmission requirements.", "Only if the email is external — internal emails are exempt", "No — the card data is processed immediately and not stored"], ans: 1, explain: "Receiving a card number via unencrypted email violates Requirement 4.2.2, regardless of whether the email is internal or external and regardless of whether the data is immediately processed. Email is a messaging technology, and PANs cannot be transmitted via messaging technologies without proper end-to-end encryption. Organizations frequently discover this violation in their call center and customer service operations — customers are often willing to send card numbers via email, and without explicit policy and technical controls preventing acceptance, this creates PCI violations." }
  },
  {
    title: "Requirement 5 — Malware Protection",
    tagline: "Defending against the software that attackers use to steal card data",
    body: `<p><span class="key-term">Requirement 5</span> — "Protect All Systems and Networks from Malicious Software" — addresses the malware threats that enable most large-scale payment card breaches. Point-of-sale malware, RAM scrapers, keyloggers, and other malicious software are the primary tools attackers use once they've gained access to payment systems. Requirement 5 establishes the defenses against these tools.</p>
    <div class="highlight-box">Requirement 5 covers: deploying anti-malware solutions on all applicable systems, keeping anti-malware current (updated signatures and software versions), performing regular scans and active real-time monitoring, protecting against phishing (a common malware delivery vector), and — recognizing that malware evolves rapidly — periodically evaluating whether systems not commonly affected by malware still pose a risk.</div>
    <div class="req-card"><b>5.2.1 — Anti-Malware on All Applicable Systems</b><br>Anti-malware solutions must be deployed on all system components unless periodically evaluated and documented as not at risk from malware. The "not at risk" exception is narrow — most CDE systems must have anti-malware deployed. Mainframes and some Unix systems may qualify for the exception with documented evidence and risk evaluation.</div>
    <div class="req-card"><b>5.2.3 — Periodic Evaluation of Non-Covered Systems</b><br>For systems not covered by anti-malware, a documented periodic evaluation must confirm they are not at risk. This evaluation must be performed at least once per defined period and the results documented. The evaluation cannot simply assert "this system type doesn't get malware" — it must be based on current threat intelligence.</req-card>
    <div class="req-card"><b>5.3.3 — Anti-Malware Updates and Scans</b><br>Anti-malware mechanisms must be maintained with current definitions and software versions, and active real-time protection must be enabled. Scheduled scans are required and must be performed at a frequency appropriate to the risk.</div>
    <div class="req-card"><b>5.4.1 — Phishing Protection</b><br>Processes and automated technical mechanisms must be in place to detect and protect personnel against phishing attacks. In PCI-DSS v4.0, anti-phishing is now an explicit requirement — recognizing that phishing is the most common initial access vector for payment system attacks.</div>
    <div class="analogy-box"><strong>Point-of-sale malware — how the biggest breaches happen:</strong> The Target breach (2013, 40 million cards stolen), the Home Depot breach (2014, 56 million cards), and numerous other major retail breaches all followed the same pattern: attackers gained initial access to the corporate network, then moved to payment systems, then installed RAM-scraping malware that captured card data as it was processed in memory (where it briefly exists in plain text even on encrypted systems). Anti-malware detection and endpoint monitoring are the primary technical defenses against this attack pattern — which is why Requirement 5 is central to PCI-DSS.</div>`,
    quiz: { q: "A POS terminal vendor tells a merchant that their specific POS system is 'not susceptible to malware' and doesn't need anti-malware software. Under PCI-DSS Requirement 5, can the merchant accept this claim at face value?", opts: ["Yes — vendor statements about system security are acceptable documentation", "No — the merchant must document a periodic evaluation confirming the system is not at risk from malware, based on current threat intelligence. A vendor claim alone is insufficient — it must be independently validated and documented.", "Yes — if the vendor is PCI-certified", "Only if the merchant has a written attestation from the vendor"], ans: 1, explain: "PCI-DSS Requirement 5.2.3 requires that any system not covered by anti-malware be subject to periodic documented evaluation confirming the system is not at risk from malware. This evaluation must be based on threat intelligence and documented — a vendor claim alone is not sufficient documentation. The merchant bears responsibility for validating the claim and keeping the evaluation current, because malware threats evolve and a system that wasn't historically targeted may become a target." }
  },
  {
    title: "Requirement 6 — Secure Systems and Software",
    tagline: "Building security into every system and fixing vulnerabilities before they become breaches",
    body: `<p><span class="key-term">Requirement 6</span> — "Develop and Maintain Secure Systems and Software" — addresses vulnerability management and secure development practices. It requires organizations to apply security patches promptly, protect externally facing systems against known attacks, and ensure software development follows secure coding practices.</p>
    <div class="highlight-box">Requirement 6 covers: implementing a vulnerability management process that prioritizes patches by risk, applying critical patches within one month (and critical vendor security updates within the defined timeframe), protecting web-facing applications from known attacks, using secure software development practices (SDLC), and protecting all payment software against tampering.</div>
    <div class="req-card"><b>6.3.3 — All Software Components Protected from Known Vulnerabilities</b><br>All system components are protected from known vulnerabilities by installing applicable security patches and updates. Critical patches must be installed within one month of release. Non-critical patches must be installed within a timeframe defined in the organization's patch management policy. Unpatched systems with known vulnerabilities in the CDE are one of the most common findings in PCI assessments.</div>
    <div class="req-card"><b>6.4.1 and 6.4.2 — Web Application Protection</b><br>Public-facing web applications must be protected against known web-based attacks. This can be done either by reviewing applications against the OWASP Top 10 (or equivalent) plus remediating vulnerabilities, or by deploying a Web Application Firewall (WAF) in front of public-facing web applications.</div>
    <div class="req-card"><b>6.4.3 and 6.5 — Script Management and Secure Development</b><br>All payment page scripts that load and execute on consumer browsers must be managed to prevent unauthorized modifications. Secure software development principles must be followed including: security training for developers, protection against common vulnerabilities (SQL injection, XSS, CSRF), and code review or testing before deployment.</div>
    <div class="analogy-box"><strong>The Heartbleed lesson:</strong> In April 2014, the Heartbleed vulnerability in OpenSSL was disclosed — a critical flaw that allowed attackers to read server memory, potentially exposing private keys and session tokens. Merchants that had implemented Requirement 6's patching requirements applied the fix within days. Those that didn't were left with an exploitable vulnerability visible to every attacker on the internet indefinitely. Critical patch management isn't about bureaucratic compliance — it's about closing specific, documented attack vectors before attackers exploit them.</div>`,
    quiz: { q: "A merchant's web application accepts payment and has a SQL injection vulnerability that could expose cardholder data. Under Requirement 6.4.1, what must the merchant do?", opts: ["Install a WAF to block the attack — that's sufficient", "Either remediate the SQL injection vulnerability in the application code (preferred), or deploy a WAF as a compensating control — but the WAF must actively block SQL injection attacks, not just log them", "Document the vulnerability as a known risk and move on", "SQL injection doesn't apply to PCI-DSS requirements"], ans: 1, explain: "Requirement 6.4.1 requires protecting public-facing web applications against known web-based attacks. This can be accomplished either by fixing the vulnerability in the application (code review plus remediation) or by deploying a WAF that actively blocks attacks. If a WAF is used, it must be configured to block — not just alert — SQL injection attempts. However, using a WAF as a permanent substitute for fixing the underlying vulnerability is poor security practice even if technically compliant; the root cause should be addressed." }
  },
  {
    title: "Requirement 7 — Restrict Access by Business Need",
    tagline: "The principle of least privilege applied to payment card data",
    body: `<p><span class="key-term">Requirement 7</span> — "Restrict Access to System Components and Cardholder Data by Business Need to Know" — applies the principle of least privilege to the CDE. Nobody should be able to access cardholder data unless their specific job function requires it. Access should be the minimum necessary for the task, and every access grant should be justified by a documented business need.</p>
    <div class="highlight-box">Requirement 7 is built on two foundational principles: need-to-know (individuals only receive access to information required for their specific job function) and least privilege (access rights granted are the minimum necessary to perform the required function). These principles apply to all system components and cardholder data — not just the most sensitive elements.</div>
    <div class="req-card"><b>7.2.1 — Access Control Systems</b><br>All access to system components and cardholder data is restricted based on documented and approved need. This means every access grant must have: a business justification, an approval from an authorized person, and documentation of what was approved. Ad hoc access grants without documented approval violate Requirement 7.</req-card>
    <div class="req-card"><b>7.2.2 — Privilege Assignment</b><br>Privileges are assigned to individuals based on their job classification and function, using documented procedures. Job roles should have defined access requirements — hiring managers, cashiers, system administrators, and customer service representatives all have different access needs that should be defined before individuals are onboarded.</req-card>
    <div class="req-card"><b>7.2.5 — Privileged Accounts</b><br>All application and system accounts and related access privileges are assigned and managed as follows: accounts are assigned only to necessary functionality; minimum necessary access is given; assignment of privileges follows documented access policies; and accounts are reviewed at least once every six months to confirm need.</req-card>
    <div class="req-card"><b>7.3.1 — Access Control Reviews</b><br>User accounts and related access privileges are reviewed at least every six months to ensure access is appropriate and that access is revoked when no longer needed. Access reviews are one of the most consistently violated PCI requirements — organizations frequently have employees with far more access than their job requires, and former employees with active accounts.</req-card>
    <div class="analogy-box"><strong>The hotel key analogy:</strong> When you check into a hotel, your keycard opens your room, the pool, and the gym — but not other guests' rooms, the safe deposit area, or the hotel's financial systems. Each keycard is provisioned for exactly the access needed for your role as a guest. Requirement 7 applies this same discipline to payment systems: the cashier's login accesses the payment terminal; the IT administrator's account accesses the server; and neither can access the other's domain without explicit authorization and justification.</div>`,
    quiz: { q: "An employee transfers from the payment processing team to the marketing department. Six months later, an access review discovers they still have full access to the cardholder database. Which Requirement 7 control failed?", opts: ["The initial access grant procedure — access should have been denied when they were in payment processing", "Access review and access revocation processes — access should have been revoked when the employee changed roles, and the periodic access review should have caught any access that remained inappropriate after the role change", "The database encryption requirement", "Requirement 7 doesn't cover role changes"], ans: 1, explain: "Two controls failed here. First, access revocation should occur as part of a role change process (HR/IT coordination to remove inappropriate access when employees change jobs). Second, the periodic access review (required at least every six months) should have identified that a marketing employee has access to the cardholder database — a clear mismatch with business need. This scenario of role-change access accumulation is one of the most common PCI compliance gaps organizations discover during formal access reviews." }
  },
  {
    title: "Requirement 8 — User Identification and Authentication",
    tagline: "Every user, every login, every access — uniquely identified and strongly authenticated",
    body: `<p><span class="key-term">Requirement 8</span> — "Identify Users and Authenticate Access to System Components" — establishes the authentication controls that verify users are who they claim to be before granting access to CDE systems. Authentication quality directly determines whether authorized access controls actually work — the strongest access permissions are meaningless if stolen credentials allow anyone to authenticate as an authorized user.</p>
    <div class="highlight-box">Requirement 8 covers: unique user IDs for every person with access (no shared accounts), strong authentication requirements (complex passwords or passphrases), multi-factor authentication (MFA) for all access into the CDE, account lockout after failed login attempts, and management of all accounts and credentials throughout their lifecycle.</highlight-box>
    <div class="req-card"><b>8.2.1 — Unique User IDs</b><br>All users must have a unique user ID. Shared or generic user accounts cannot be used for accessing system components in the CDE. The requirement for unique IDs is fundamental to accountability — shared accounts make it impossible to determine which individual performed an action in audit logs, destroying the traceability that security investigations depend on.</req-card>
    <div class="req-card"><b>8.3.1 — Strong Authentication Factors</b><br>Authentication factors must be: known only to the user (passwords/passphrases), possessed only by the user (physical tokens, certificates), or inherent to the user (biometrics). For passwords specifically: minimum 12 characters (or 8 characters if the system doesn't support 12), combination of uppercase, lowercase, numeric, and special characters, and must not be the same as the last four passwords used.</req-card>
    <div class="req-card"><b>8.4.2 — Multi-Factor Authentication for CDE Access</b><br>MFA is required for all access into the CDE. This applies to: administrator access from within the network, all remote access to the CDE, and all non-console access to system components. PCI-DSS v4.0 significantly expanded MFA requirements — making it mandatory for all CDE access, not just remote access as in earlier versions.</req-card>
    <div class="req-card"><b>8.3.6 and 8.3.9 — Account Lockout and Session Management</b><br>After six failed login attempts, the account must be locked for at least 30 minutes or until unlocked by an administrator. Active sessions that have been idle for more than 15 minutes must require re-authentication before allowing further access.</req-card>
    <div class="analogy-box"><strong>Why MFA for ALL CDE access in v4.0 matters:</strong> Previous versions of PCI-DSS required MFA only for remote access. v4.0 extended this requirement to all non-console access into the CDE, including from internal networks. This change reflects the reality that internal network attackers — whether external attackers who gained internal access or malicious insiders — are a significant threat. Requiring MFA internally means even an attacker with stolen credentials inside the network still cannot access the CDE without the second factor.</div>`,
    quiz: { q: "A team of five call center agents all log into the payment system using the shared account 'callcenter_user' with a single shared password. What PCI-DSS violation does this create?", opts: ["This is compliant as long as the password meets complexity requirements", "This violates Requirement 8.2.1 requiring unique user IDs for every person. Shared accounts make it impossible to attribute specific actions to specific individuals in audit logs, destroying accountability and making security investigations impossible.", "This only violates requirements if the agents have admin privileges", "Shared accounts are permitted in call center environments"], ans: 1, explain: "Requirement 8.2.1 explicitly prohibits shared user accounts — every person accessing CDE systems must have their own unique user ID. Shared accounts make it impossible to determine which individual performed specific actions in audit logs, preventing accountability, enabling fraud without detection, and making security investigations meaningless. When something goes wrong, 'callcenter_user did it' tells you nothing about which of the five people was responsible." }
  },
  {
    title: "Requirement 9 — Physical Access Controls",
    tagline: "Protecting the physical hardware and media that hold cardholder data",
    body: `<p><span class="key-term">Requirement 9</span> — "Restrict Physical Access to Cardholder Data" — addresses the physical security of the CDE. Digital security controls protect against network-based attacks, but physical access creates attack vectors that bypass all network defenses: an attacker with physical access to a server can copy data directly, install hardware keyloggers, replace legitimate devices with rogue ones, or steal storage media. Physical security is the foundation that logical security is built on.</p>
    <div class="highlight-box">Requirement 9 covers: physical access controls to server rooms, data centers, and network equipment; visitor access procedures; protection and management of physical media containing cardholder data; secure disposal of media; point-of-interaction (POI) device protection; and anti-skimming measures for payment terminals.</div>
    <div class="req-card"><b>9.2.1 — Physical Access Controls</b><br>Appropriate facility entry controls must limit and monitor physical access to systems in the CDE. Physical access controls include: badge readers, biometric access systems, security guards, video surveillance, and visitor access logs. Every entry into the CDE must be controlled and logged.</req-card>
    <div class="req-card"><b>9.2.4 — Visitor Access Management</b><br>Visitors must be authorized before entering areas where cardholder data is processed or maintained. Visitors must be escorted and identified (e.g., visitor badges) during their visit, and visitor logs must be maintained for at least three months.</req-card>
    <div class="req-card"><b>9.4.6 — Secure Disposal of Hardcopy Materials</b><br>Hardcopy materials containing cardholder data must be destroyed in a way that makes it impossible to reconstruct the data — cross-cut shredding, incineration, or pulping. Putting paper containing card numbers in a recycling bin violates PCI-DSS.</req-card>
    <div class="req-card"><b>9.5.1 — POI Device Protection</b><br>Point-of-interaction devices (card readers, payment terminals) must be protected from tampering and substitution. This includes: maintaining an inventory of all POI devices, periodically inspecting devices to detect tampering or substitution, and training personnel to recognize signs of tampering.</req-card>
    <div class="warning-box"><strong>Skimming attacks — the physical PCI threat:</strong> Card skimming attacks involve installing a physical device over legitimate payment terminals that captures card data during transactions. Gas station pumps and ATMs are most commonly targeted. PCI-DSS Requirement 9.5 specifically requires merchants to inspect payment terminals regularly and train staff to recognize tampering. Gas station chains discovered systematic skimmer installation at their pumps have faced massive PCI fines and reputational damage — preventable with basic physical inspection programs.</div>`,
    quiz: { q: "A merchant finds a suspicious device attached to one of their payment terminals that appears to be a card skimmer. Under Requirement 9, which processes should have prevented this from going undetected?", opts: ["Anti-malware software should have detected the device", "Regular periodic inspection of POI devices for tampering or substitution (required by 9.5.1), combined with staff training to recognize signs of skimmer installation, should have detected the device during routine inspection before it captured significant card data.", "The device should have been blocked by the firewall", "This is a law enforcement issue, not a PCI compliance issue"], ans: 1, explain: "Requirement 9.5.1 requires merchants to periodically inspect all POI devices for evidence of tampering or substitution. This includes visual inspection for attached devices, checking that serial numbers match inventory records, and training staff to immediately report suspicious device conditions. Regular inspection programs are specifically designed to catch skimmer installations before they capture significant card data — organizations without these programs often discover skimmers only after large-scale fraud alerts from their card brands." }
  },
  {
    title: "Requirement 10 — Logging and Monitoring",
    tagline: "If it can't be seen, it can't be stopped — the security camera system for card data",
    body: `<p><span class="key-term">Requirement 10</span> — "Log and Monitor All Access to System Components and Cardholder Data" — requires comprehensive logging of activity across all CDE systems and active review of those logs. Logs are the security camera system of the digital environment: they record what happened, when it happened, and who did it. Without them, security investigations are nearly impossible and attackers can operate undetected for months.</p>
    <div class="highlight-box">Requirement 10 covers: implementing audit logs for all system components in the CDE, capturing specific events (login attempts, access to cardholder data, account management changes, configuration changes), protecting log files from modification or deletion, retaining logs for at least 12 months with three months immediately available, and reviewing logs regularly for suspicious activity.</div>
    <div class="req-card"><b>10.2.1 — Audit Log Events</b><br>Audit logs for all system components must capture at minimum: all individual user access to cardholder data; all actions by root/administrator accounts; access to all audit trails; invalid logical access attempts; use of and changes to identification and authentication mechanisms; initialization/stopping/pausing of audit logs; creation/deletion of system-level objects. Each event must include: user ID, event type, date/time, success/failure, origination, and identity of affected data or component.</req-card>
    <div class="req-card"><b>10.3.3 — Log Protection</b><br>Audit log files must be protected to prevent modifications or tampering. Logs must be promptly backed up to a centralized log management server that is difficult for attackers to modify — a compromise of a system should not enable the attacker to also delete the evidence of that compromise.</req-card>
    <div class="req-card"><b>10.4.1 and 10.4.2 — Log Reviews</b><br>Logs from critical systems must be reviewed daily (or automated with daily review of alerts). Logs from other CDE systems must be reviewed periodically. Many organizations use SIEM (Security Information and Event Management) systems to automate log aggregation and correlation, enabling detection of patterns that manual review would miss.</req-card>
    <div class="req-card"><b>10.5.1 — Log Retention</b><br>Retain audit log history for at least 12 months, with at least the most recent three months available for immediate analysis. The retention requirement exists because breaches are often not detected until months after they begin — having historical logs enables investigators to reconstruct attack timelines.</req-card>
    <div class="analogy-box"><strong>The dwell time problem and log retention:</strong> The average time between a breach occurring and its detection has historically been measured in months. In major retail breaches, attackers were in the network for months before discovery. Log retention requirements directly address this: if logs are only kept for 30 days and the breach started 60 days ago, investigators cannot reconstruct what happened. The 12-month retention requirement ensures that even late-discovered breaches can be fully investigated and the scope of exposure understood.</div>`,
    quiz: { q: "An attacker compromises a CDE server and immediately deletes all logs on that server to hide their activity. Which Requirement 10 control should have made this ineffective?", opts: ["Requirement 10.2.1 — because they should have logged more events", "Requirement 10.3.3 — logs should be sent to a separate, centralized log management server promptly after creation. If logs are forwarded immediately to a central system, deleting logs on the compromised server doesn't destroy the evidence — it's already been replicated elsewhere.", "Requirement 10.4.1 — because daily review should have caught the deletion", "Requirement 10.5.1 — because annual retention prevents deletion"], ans: 1, explain: "Centralized log management (referenced in 10.3.3 as part of log protection) is the primary defense against evidence destruction. When logs are generated on a system and simultaneously forwarded to a separate, hardened log management server, deleting the local copies after compromise doesn't destroy the evidence — the central repository has already received it. This is why security architects design log infrastructure so that compromising a monitored system doesn't also compromise the monitoring." }
  },
  {
    title: "Requirement 11 — Security Testing",
    tagline: "Proactively finding vulnerabilities before attackers do",
    body: `<p><span class="key-term">Requirement 11</span> — "Test Security of Systems and Networks Regularly" — requires organizations to actively test their own defenses rather than assuming they work. Security controls degrade over time as systems change, patches create new configurations, and human errors introduce vulnerabilities. Regular testing detects these degradations before attackers exploit them.</p>
    <div class="highlight-box">Requirement 11 requires: quarterly vulnerability scans of internal and external network components; annual penetration testing of internal and external networks and CDE systems; detection of unauthorized wireless access points; and file integrity monitoring on critical files. PCI-DSS v4.0 also added requirements for testing network segmentation controls — you must periodically verify that your CDE isolation is actually working.</highlight-box>
    <div class="req-card"><b>11.3.1 and 11.3.2 — External and Internal Vulnerability Scans</b><br>External vulnerability scans must be performed quarterly by an Approved Scanning Vendor (ASV) approved by PCI SSC. Internal vulnerability scans must also be performed quarterly. After significant changes to the network, rescanning is required. Critical vulnerabilities found must be remediated and rescanned to confirm remediation.</req-card>
    <div class="req-card"><b>11.4.1 — Annual Penetration Testing</b><br>External and internal penetration testing must be performed at least annually and after significant changes. Penetration testing goes beyond vulnerability scanning — it actively attempts to exploit vulnerabilities to determine what an attacker could actually accomplish. The pentesting methodology must include the OWASP testing guide for web applications and must cover the entire CDE perimeter.</req-card>
    <div class="req-card"><b>11.4.4 and 11.4.5 — Network Segmentation Testing</b><br>If network segmentation is used to reduce CDE scope, that segmentation must be tested at least every six months and after any changes to segmentation controls. This requirement directly validates the scope-reduction strategy — if your firewall rules that isolate the CDE are broken, your entire scope calculation is wrong.</req-card>
    <div class="req-card"><b>11.5.2 — File Integrity Monitoring (FIM)</b><br>A change-detection mechanism must be deployed to alert personnel to unauthorized modification of critical system files, configuration files, and content files. FIM detects when files that shouldn't change (system binaries, security configurations) are modified — a common indicator of malware installation or configuration tampering.</req-card>
    <div class="analogy-box"><strong>Penetration testing vs. vulnerability scanning:</strong> Vulnerability scanning is automated — scanners probe systems for known vulnerabilities and report what's found. Penetration testing is manual and creative — skilled security professionals actively attempt to compromise systems, chaining multiple vulnerabilities together, using social engineering, and thinking like attackers. A scan tells you the door looks weak. A pen test tells you whether an experienced criminal could actually kick it in. Both are required because scanners miss what humans can see, and humans miss what automation catches consistently.</div>`,
    quiz: { q: "An organization's quarterly ASV scan finds a critical vulnerability in their public-facing payment web server. The scan was completed on March 31. Under Requirement 11.3.1, what must happen next?", opts: ["The organization has until the next quarterly scan (June 30) to remediate", "The critical vulnerability must be remediated, and a rescan must be performed to confirm the vulnerability is fixed before the quarterly compliance cycle is considered complete", "The organization must file a report with PCI SSC", "Critical findings only require a remediation plan, not a rescan"], ans: 1, explain: "When an ASV scan finds vulnerabilities, the organization must remediate and then rescan to confirm the vulnerability is fixed. Simply acknowledging a critical finding and waiting until the next quarterly scan is not compliant. The rescan confirms the remediation was successful. This cycle — scan, find, remediate, rescan — is the core of PCI-DSS's continuous vulnerability management approach." }
  },
  {
    title: "Requirement 12 — Security Policy and Programs",
    tagline: "The organizational foundation that makes all technical controls effective",
    body: `<p><span class="key-term">Requirement 12</span> — "Support Information Security with Organizational Policies and Programs" — is the capstone requirement that addresses the human and organizational factors that make technical controls work (or fail). Even perfect technical implementation fails without the policies, procedures, training, and risk management that direct how people interact with cardholder data systems.</p>
    <div class="highlight-box">Requirement 12 covers: an information security policy covering all PCI-DSS requirements; a risk assessment process; documented operational security procedures; security awareness training for all personnel; screening of personnel before hiring; incident response planning; and management of service providers and their compliance obligations.</div>
    <div class="req-card"><b>12.1.1 and 12.1.2 — Information Security Policy</b><br>An overall information security policy must be established, published, maintained, and disseminated to all relevant personnel. The policy must be reviewed at least annually and updated when the environment changes. The policy must define roles and responsibilities for information security.</req-card>
    <div class="req-card"><b>12.3.1 — Risk Assessment</b><br>A targeted risk assessment must be performed at least annually and whenever there are significant changes to the CDE. The risk assessment must: identify critical assets and processes, identify threats, assess the likelihood and impact of threats, and drive a prioritized remediation approach. PCI-DSS doesn't prescribe a risk methodology — NIST 800-30, ISO 27005, and others are all acceptable.</req-card>
    <div class="req-card"><b>12.6.1 and 12.6.2 — Security Awareness Program</b><br>A formal security awareness program must exist for all personnel. This program must include: initial security training upon hire, recurring training at least annually, and specific training relevant to each individual's role. Security awareness is the human complement to technical controls — the training that prevents employees from defeating those controls through error or ignorance.</req-card>
    <div class="req-card"><b>12.10 — Incident Response Plan</b><br>An incident response plan must be implemented and ready to activate immediately upon a system breach. The plan must include roles, responsibilities, and communications with card brands and acquiring banks. Critically, the plan must be tested at least annually — a plan nobody has practiced is unlikely to function effectively during an actual breach.</req-card>
    <div class="analogy-box"><strong>The incident response plan — why practice matters:</strong> Organizations that have never exercised their incident response plan regularly discover during actual breaches that: the designated incident lead no longer works there, the card brand notification numbers are out of date, nobody knows who to call at the acquiring bank, and the forensic investigator contract has expired. An untested incident response plan is not a plan — it's a document. Annual tabletop exercises that practice the response to a realistic breach scenario are the difference between a plan and a capability.</div>`,
    quiz: { q: "A company's PCI compliance program includes all technical controls but has never conducted security awareness training for employees who handle cardholder data. Which Requirement 12 obligation is violated?", opts: ["Only if an employee caused a breach due to lack of training", "Requirement 12.6 requires a formal security awareness program including training for all personnel upon hire and at least annually thereafter — the training obligation exists regardless of whether incidents have occurred", "Only for employees with direct system access", "Security awareness is a best practice, not a PCI requirement"], ans: 1, explain: "Requirement 12.6.1 requires a formal security awareness program that includes ongoing security training for all personnel. This is not triggered by incidents — it's a proactive, ongoing compliance obligation. Training must be provided at hire and refreshed at least annually. Employees who handle cardholder data (including customer service staff who take phone orders) must specifically be trained on their PCI responsibilities and the importance of protecting card data." }
  },
  {
    title: "PCI-DSS Compliance Levels",
    tagline: "How the amount of card data you handle determines your compliance requirements",
    body: `<p>Not all organizations handling card data have identical PCI compliance obligations. The card brands tier their compliance requirements based on transaction volume — the more cards processed, the higher the stakes and the more rigorous the compliance requirements. This tiered system balances security rigor against the compliance burden placed on smaller merchants.</p>
    <div class="highlight-box">Compliance levels are set separately by each card brand, but they follow similar structures. Visa and Mastercard's merchant levels are the most widely referenced. Note: compliance levels are set by card brands, not PCI SSC — the levels described here are those used by Visa and Mastercard, which most other brands track closely. Service providers have their own separate level structure.</div>
    <div class="level-grid">
      <div class="level-1c"><strong style="color:#4A1B0C">Level 1 — Highest Risk</strong><br><span style="font-size:12px;color:#1a1a18">Merchants processing more than 6 million Visa/Mastercard transactions annually, OR any merchant that has experienced a data breach. Required: Annual on-site assessment by a QSA (or internal audit if qualified), quarterly network scans by an ASV, and annual penetration testing. Largest merchants like Amazon, Walmart, major airlines.</span></div>
      <div class="level-2c"><strong style="color:#633806">Level 2</strong><br><span style="font-size:12px;color:#1a1a18">Merchants processing 1-6 million transactions annually. Required: Annual Self-Assessment Questionnaire (SAQ) completed by internal staff, quarterly ASV scans. May be required to have SAQ validated by a QSA depending on the card brand.</span></div>
      <div class="level-3c"><strong style="color:#27500A">Level 3</strong><br><span style="font-size:12px;color:#1a1a18">Merchants processing 20,000-1 million e-commerce transactions annually. Required: Annual SAQ, quarterly ASV scans. Smaller online merchants fall into this category.</span></div>
      <div class="level-4c"><strong style="color:#042C53">Level 4 — Lowest Risk</strong><br><span style="font-size:12px;color:#1a1a18">Merchants processing fewer than 20,000 e-commerce transactions OR fewer than 1 million other transactions annually. The vast majority of merchants — local restaurants, small retailers, etc. Required: Annual SAQ (potentially), quarterly scans may be recommended. Requirements defined by acquiring bank.</span></div>
    </div>
    <div class="cheat-grid">
