      <div class="cheat-pill"><strong>After a Breach</strong><span>Any merchant that suffers a data breach involving cardholder data is automatically elevated to Level 1 compliance requirements, regardless of their transaction volume. The breach itself demonstrates that their security posture was inadequate — maximum compliance scrutiny follows.</span></div>
      <div class="cheat-pill"><strong>Service Provider Levels</strong><span>Service providers (companies that process, store, or transmit cardholder data on behalf of merchants) have their own level structure: Level 1 (over 300,000 transactions annually) requires QSA assessment; Level 2 (under 300,000) allows SAQ. Cloud providers, payment processors, and data centers often fall into service provider level 1.</span></div>
    </div>
    <div class="analogy-box"><strong>Why post-breach Level 1 elevation makes sense:</strong> Imagine a restaurant that failed a health inspection and caused a food poisoning outbreak. After the outbreak, health authorities would inspect that restaurant far more frequently and rigorously than a restaurant with a clean record — regardless of its size. PCI's post-breach Level 1 elevation works the same way: a breach proves that existing security practices weren't adequate, warranting the most rigorous compliance verification going forward until trust is re-established.</div>`,
    quiz: { q: "A small local coffee shop processes 50,000 card transactions per year and has never had a breach. What PCI compliance level is this merchant, and what is their primary compliance obligation?", opts: ["Level 1 — requires an annual QSA assessment", "Level 4 — the coffee shop is likely a Level 4 merchant with requirements determined by their acquiring bank, typically including annual SAQ completion and potentially quarterly external scans", "Level 3 — requires quarterly ASV scans and annual SAQ", "PCI-DSS doesn't apply to merchants processing fewer than 1 million transactions"], ans: 1, explain: "A merchant processing 50,000 card transactions annually with no breach history is a Level 4 merchant — the category covering the vast majority of small businesses. Level 4 requirements are set by the acquiring bank but typically include completing an annual Self-Assessment Questionnaire. PCI-DSS applies to every merchant that accepts card payments regardless of transaction volume — Level 4 just has lighter compliance requirements than larger merchants." }
  },
  {
    title: "Self-Assessment Questionnaires (SAQs)",
    tagline: "The compliance tools that let most merchants self-certify their PCI status",
    body: `<p>The <span class="key-term">Self-Assessment Questionnaire (SAQ)</span> is a validation tool that allows smaller merchants and service providers to self-assess their PCI-DSS compliance without a formal Qualified Security Assessor. SAQs are a critical part of how PCI compliance works in practice — they're the mechanism through which millions of small businesses demonstrate their compliance to acquiring banks without the cost of an annual QSA assessment.</p>
    <div class="highlight-box">PCI SSC publishes multiple SAQ versions, each designed for specific merchant environments. The appropriate SAQ type depends entirely on how the merchant accepts payments and whether they store, process, or transmit cardholder data. Choosing the wrong SAQ type is a compliance failure — it means answering questions that don't apply to your environment while potentially missing requirements that do. The SAQ also includes an Attestation of Compliance (AOC) — a formal declaration signed by a company officer certifying the accuracy of the SAQ responses.</highlight-box>
    <p>Key SAQ types:</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>SAQ A</strong><span>The simplest SAQ. For card-not-present merchants that have fully outsourced all cardholder data functions to PCI-compliant third parties. No electronic cardholder data storage. E-commerce merchants using a hosted payment page where the card data never touches their systems qualify. ~22 requirements.</span></div>
      <div class="cheat-pill"><strong>SAQ A-EP</strong><span>For e-commerce merchants that redirect customers to a third-party payment page but whose website could affect the security of that redirect (JavaScript on the page, etc.). More requirements than SAQ A because the merchant's website partially controls the payment flow.</span></div>
      <div class="cheat-pill"><strong>SAQ B</strong><span>For merchants with imprint machines only OR standalone POS terminals that are not connected to the internet or other systems. Most small retail and hospitality merchants that use standalone dial-up terminals qualify. ~41 requirements.</span></div>
      <div class="cheat-pill"><strong>SAQ B-IP</strong><span>For merchants using standalone, IP-connected POS terminals. The internet connectivity increases the attack surface and the number of applicable requirements compared to SAQ B.</span></div>
      <div class="cheat-pill"><strong>SAQ C</strong><span>For merchants whose payment application systems are connected to the internet. Includes most merchants using POS systems connected to broader networks. ~160 requirements.</span></div>
      <div class="cheat-pill"><strong>SAQ D</strong><span>The most comprehensive SAQ — applies to all other merchants not covered by SAQ A through C, and all service providers. Covers all PCI-DSS requirements. Used when merchants store cardholder data or have complex payment environments. ~329 requirements.</span></div>
    </div>
    <div class="analogy-box"><strong>Why the right SAQ matters:</strong> A restaurant using a simple standalone terminal (SAQ B) that incorrectly completes SAQ A (designed for fully outsourced e-commerce) is certifying compliance with requirements that don't apply to their situation while potentially never addressing the requirements that do. The SAQ selection drives everything — get it wrong and the entire self-assessment is built on a false foundation.</div>`,
    quiz: { q: "An e-commerce merchant uses a third-party payment provider's hosted checkout page — when customers buy something, they are redirected to the payment provider's website to enter card information, and the merchant never sees or stores the card data. Which SAQ type most likely applies?", opts: ["SAQ D — because they operate an e-commerce site", "SAQ A — for card-not-present merchants that have fully outsourced all cardholder data functions to PCI-compliant third parties, with no electronic storage of cardholder data", "SAQ B — because they are a non-storefront merchant", "SAQ C — because they have an internet-connected system"], ans: 1, explain: "SAQ A is designed specifically for e-commerce merchants that have fully outsourced card data handling to a PCI-compliant third-party payment page (often called 'hosted payment pages' or 'payment overlays'). If card data is entered on the payment provider's page and never touches the merchant's systems, the merchant qualifies for SAQ A — the simplest SAQ with the fewest requirements. This arrangement significantly reduces PCI compliance scope and burden for e-commerce merchants." }
  },
  {
    title: "Qualified Security Assessors (QSAs) and the Assessment Process",
    tagline: "Independent experts who verify Level 1 merchants meet PCI-DSS requirements",
    body: `<p>Level 1 merchants and some service providers cannot self-certify their PCI compliance — they require an assessment by a <span class="key-term">Qualified Security Assessor (QSA)</span>. QSAs are independent security professionals certified by PCI SSC to conduct formal PCI-DSS assessments and issue Reports on Compliance (ROC). Understanding the QSA assessment process is essential for anyone working in enterprise payment security.</p>
    <div class="highlight-box">QSA companies are organizations certified by PCI SSC that employ individual QSA assessors who have passed PCI SSC's training and testing requirements. QSAs must maintain their certification through continuing education and periodic recertification. PCI SSC publishes a list of approved QSA companies on their website — organizations should verify their assessor's current qualification status. The QSA's job is to independently verify compliance, not to help achieve it — though QSA companies may offer separate consulting services.</highlight-box>
    <p>The QSA assessment process:</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Scoping and Documentation Review</strong><span>The QSA works with the organization to define the CDE scope, reviews network diagrams and documentation, and confirms the scope accurately reflects where cardholder data lives. Scope agreement between the organization and QSA is the foundation of the assessment.</span></div>
      <div class="cheat-pill"><strong>Onsite Assessment</strong><span>The QSA conducts interviews with staff, reviews system configurations, tests technical controls, and observes operations. Each of the 12 requirements is assessed against documented evidence — policies, procedures, configurations, scan results, and test results.</span></div>
      <div class="cheat-pill"><strong>Report on Compliance (ROC)</strong><span>The primary assessment output is a Report on Compliance — a comprehensive document where the QSA documents their findings for each PCI-DSS requirement. The ROC is submitted to the acquiring bank and is the formal evidence of compliance for Level 1 merchants.</span></div>
      <div class="cheat-pill"><strong>Attestation of Compliance (AOC)</strong><span>The AOC is a shorter summary document that both the QSA and the assessed organization sign, attesting that the assessment was completed according to PCI-DSS requirements and that the organization is compliant. The AOC is often shared with business partners as compliance evidence.</span></div>
      <div class="cheat-pill"><strong>Compensating Controls</strong><span>When an organization cannot meet a specific PCI requirement due to a documented technical or business constraint, they may implement a compensating control — an alternative control that achieves an equivalent level of protection. The QSA must validate that compensating controls are genuinely equivalent.</span></div>
      <div class="cheat-pill"><strong>Timeline</strong><span>Level 1 assessments for large, complex organizations can take months. Preparation (documentation gathering, internal testing, gap remediation) typically takes 2-4 months before the QSA's formal assessment visit. Organizations should begin preparation well before their annual compliance deadline.</span></div>
    </div>`,
    quiz: { q: "What is the difference between a Report on Compliance (ROC) and an Attestation of Compliance (AOC)?", opts: ["They are the same document with different names", "The ROC is the comprehensive technical assessment document prepared by the QSA detailing findings for each requirement; the AOC is the shorter summary attestation signed by both the QSA and the assessed organization confirming compliance. The AOC is typically shared with acquirers and partners; the full ROC is more detailed.", "The AOC is prepared by the QSA; the ROC is self-prepared", "Only service providers need a ROC; merchants only need an AOC"], ans: 1, explain: "The ROC and AOC serve different purposes. The ROC is the comprehensive, detailed assessment document that the QSA prepares documenting their specific findings, testing methods, and evidence reviewed for each PCI-DSS requirement. It is the full technical record of the assessment. The AOC is a shorter summary document that serves as the official attestation of compliance — both parties sign it, and it's what gets submitted to acquirers and shared with business partners. The AOC says 'we are compliant'; the ROC explains why in detail." }
  },
  {
    title: "PCI-DSS v4.0 — What Changed from v3.2.1",
    tagline: "The most significant PCI-DSS update in a decade and what it means for compliance",
    body: `<p>PCI-DSS v4.0 was released in March 2022 (with v4.0.1 in June 2024 providing minor clarifications) and represented the most comprehensive revision to PCI-DSS since its original publication. Understanding what changed and why matters for organizations migrating from v3.2.1 and for anyone building a PCI compliance program today.</p>
    <div class="highlight-box"><strong>The v3.2.1 to v4.0 transition timeline:</strong> v3.2.1 was retired on March 31, 2024. v4.0 and v4.0.1 are now the only current valid versions. All organizations must now comply with v4.0.1 requirements. Some v4.0 requirements were designated "best practices until March 31, 2025" — as of 2025, those are now fully mandatory.</div>
    <p>Key changes in PCI-DSS v4.0:</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Customized Approach (New)</strong><span>v4.0 introduced a "customized approach" option alongside the traditional "defined approach." Organizations can now propose alternative security controls that achieve the stated security objective of a requirement rather than implementing the specific control described — with QSA validation. This enables innovation while maintaining security.</span></div>
      <div class="cheat-pill"><strong>Expanded MFA Requirements</strong><span>v4.0 significantly expanded multi-factor authentication requirements. MFA is now required for all access into the CDE (not just remote access as in v3.2.1). This is one of the most impactful technical changes for many organizations.</span></div>
      <div class="cheat-pill"><strong>Password Length Increase</strong><span>Minimum password length increased from 7 to 12 characters (8 if the system doesn't support 12). The 7-character minimum in v3.2.1 was widely criticized as too weak for modern computing environments where 7-character passwords can be cracked quickly.</span></div>
      <div class="cheat-pill"><strong>Anti-Phishing Requirements (New)</strong><span>v4.0 added explicit anti-phishing requirements under Requirement 5.4 — recognizing that phishing is the primary initial access vector for payment system attacks. Organizations must have technical and process controls specifically targeting phishing threats.</span></div>
      <div class="cheat-pill"><strong>E-Commerce Script Management (New)</strong><span>Requirements 6.4.3 and 6.5.1 added new requirements for managing scripts on payment pages — addressing Magecart and similar attacks that inject malicious JavaScript into payment pages to steal card data. Organizations must maintain an inventory of all scripts on payment pages and monitor them for unauthorized changes.</span></div>
      <div class="cheat-pill"><strong>Targeted Risk Analysis</strong><span>v4.0 allows some requirements (particularly around frequencies of certain activities) to be determined by the organization's own risk analysis rather than fixed timeframes, with documented justification. This enables risk-based compliance rather than arbitrary periodic activities.</span></div>
    </div>
    <div class="analogy-box"><strong>Why the script management requirement was added:</strong> The Magecart attacks (a form of "digital skimming" that began around 2015 and escalated through the late 2010s) involved injecting malicious JavaScript into e-commerce payment pages to capture card data at the point of browser entry — before the data even left the customer's browser. These attacks compromised thousands of websites including Ticketmaster, British Airways, and Newegg. PCI-DSS v4.0's new Requirements 6.4.3 and 6.5.1 directly address this threat by requiring organizations to inventory and monitor all scripts on payment pages.</div>`,

  {
    title: "Tokenization and Point-to-Point Encryption (P2PE)",
    tagline: "The technologies that can dramatically reduce your PCI scope",
    body: `<p>Two technologies have transformed PCI compliance strategy over the past decade: <span class="key-term">tokenization</span> and <span class="key-term">point-to-point encryption (P2PE)</span>. Both work by eliminating or transforming cardholder data before it enters merchant systems — reducing or eliminating the scope of PCI-DSS requirements. Understanding both is essential for any GRC professional advising on payment security strategy.</p>
    <div class="highlight-box"><strong>The scope reduction principle:</strong> PCI compliance costs and complexity scale with scope — the more systems that touch card data, the more that must comply with all 12 requirements. Both tokenization and P2PE reduce scope by ensuring that by the time card data reaches most merchant systems, it's either encrypted beyond usability or already replaced with a surrogate value. The more card data you eliminate from your environment, the less compliance effort you need.</highlight-box>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Tokenization — What It Is</strong><span>Tokenization replaces a real PAN with a random "token" — a substitute value that has no mathematical relationship to the actual card number. The token can be stored and used for recurring transactions, refunds, and business analytics, but is worthless to attackers because it can't be reverse-engineered into a real PAN. Only the tokenization vault (which maps tokens to real PANs) holds the actual card numbers.</span></div>
      <div class="cheat-pill"><strong>Tokenization — Scope Impact</strong><span>Systems that store and process only tokens (not real PANs) can potentially be removed from PCI scope. If a merchant's CRM, order management, and loyalty systems all see only tokens, those systems may be out of scope for PCI-DSS — dramatically reducing the compliance footprint. Only the tokenization vault itself remains fully in scope.</span></div>
      <div class="cheat-pill"><strong>P2PE — What It Is</strong><span>Point-to-point encryption encrypts card data at the swipe/dip/tap point — inside the payment terminal — before transmitting it. The data travels encrypted through the merchant's environment and is only decrypted at the payment processor's secure environment. The merchant never sees plaintext card data.</span></div>
      <div class="cheat-pill"><strong>P2PE — Scope Impact</strong><span>With a validated P2PE solution, merchants that accept only encrypted card data from P2PE-certified terminals may qualify for a significantly abbreviated SAQ (SAQ P2PE) with just ~34 requirements — far fewer than SAQ D. The logic: if plaintext card data never exists in the merchant environment, most PCI requirements are simply not applicable.</span></div>
      <div class="cheat-pill"><strong>PCI-Validated P2PE</strong><span>PCI SSC maintains a list of validated P2PE solutions. For maximum scope reduction, merchants should use only solutions on this list — self-declared P2PE provides some security benefit but doesn't deliver the same compliance scope reduction as formally validated P2PE.</span></div>
      <div class="cheat-pill"><strong>The Combination Approach</strong><span>Many large merchants use both: P2PE eliminates plaintext card data from capture through processing; tokenization replaces any PAN at the point of storage with a surrogate value for subsequent business use. Together, these can reduce a complex PCI compliance scope to a very small, manageable perimeter.</span></div>
    </div>`,
    quiz: { q: "A retail chain implements a PCI-validated P2PE solution where card data is encrypted inside the payment terminal before any data touches their network, and decryption only occurs at the payment processor. What compliance benefit does this provide?", opts: ["No benefit — all merchants must comply with all 12 requirements regardless of technology", "The retail chain may qualify for SAQ P2PE with significantly fewer applicable requirements, because plaintext cardholder data never exists within their environment — the scope of systems that must comply with full PCI-DSS requirements is dramatically reduced", "They no longer need to file any compliance documentation", "Only Level 4 merchants can use P2PE for scope reduction"], ans: 1, explain: "Validated P2PE eliminates plaintext cardholder data from the merchant's environment — the data is encrypted inside the terminal before traversing any merchant systems. Since the merchant never processes or stores plaintext card data, many PCI-DSS requirements (covering protection of plaintext data in transit and at rest) simply aren't applicable. Merchants using validated P2PE solutions may qualify for SAQ P2PE with approximately 34 requirements rather than the hundreds that would otherwise apply." }

  {
    title: "Service Providers and PCI-DSS",
    tagline: "How PCI obligations flow through the payment ecosystem supply chain",
    body: `<p>Most merchants don't process payments entirely on their own — they use service providers: payment processors, cloud hosting companies, managed security providers, e-commerce platforms, and dozens of other vendors. <span class="key-term">Service providers</span> that store, process, or transmit cardholder data on behalf of merchants are themselves subject to PCI-DSS, and merchants are responsible for managing their service providers' compliance. The payment security chain is only as strong as its weakest link.</p>
    <div class="highlight-box">PCI-DSS defines a service provider as an entity (not a payment brand) that is directly involved in the processing, storage, or transmission of cardholder data on behalf of another entity. This includes: payment processors, payment gateways, managed hosting providers, managed security services providers, backup and storage providers, cloud service providers handling cardholder data, and any organization that could affect the security of cardholder data on behalf of a merchant.</highlight-box>
    <div class="req-card"><b>Requirement 12.8 — Service Provider Management</b><br>Organizations must manage their service providers through: a list of all service providers; a written agreement including acknowledgment of responsibility for applicable PCI-DSS requirements; a process for engaging service providers and confirming their compliance status before engagement; a program for monitoring service providers' PCI compliance annually; and a process for responding when a service provider fails to maintain compliance.</req-card>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Shared Responsibility</strong><span>PCI-DSS uses a shared responsibility model: the merchant is responsible for requirements they control; the service provider is responsible for requirements they control; and both are jointly responsible for shared activities. This model must be clearly documented — the famous "responsibility matrix" or "shared responsibility matrix" outlines who owns each applicable requirement.</span></div>
      <div class="cheat-pill"><strong>Service Provider AOC</strong><span>Merchants should obtain and review the AOC from each service provider. The AOC confirms the service provider's compliance scope and status. Merchants cannot assume a service provider is compliant — they must verify it annually. An expired AOC means the merchant cannot confirm that the service provider continues to meet PCI requirements.</span></div>
      <div class="cheat-pill"><strong>Chain of Responsibility</strong><span>If a merchant uses a non-compliant service provider that suffers a breach, the merchant can still be held liable for that breach's PCI fines and card brand penalties. The "I didn't know they weren't compliant" defense doesn't work — Requirement 12.8 requires merchants to actively verify and monitor service provider compliance.</span></div>
      <div class="cheat-pill"><strong>Cloud Environments</strong><span>Cloud service providers like AWS, Azure, and Google Cloud publish PCI compliance responsibility matrices and maintain their own PCI Level 1 certifications. Merchants using cloud infrastructure inherit the provider's compliance for the infrastructure components they manage, but remain responsible for the application layer, data handling, and configuration of cloud services they control.</span></div>
    </div>
    <div class="analogy-box"><strong>The contractor analogy:</strong> If you hire a general contractor to renovate your home, and the contractor's electrician installs wiring that violates fire code, both you (for hiring an uncertified subcontractor) and the contractor bear responsibility. PCI service provider management works similarly — the merchant bears responsibility for ensuring their payment-related contractors meet PCI standards, not just trusting them to do so.</div>`,

  {
    title: "PCI-DSS and Other Frameworks",
    tagline: "How PCI-DSS connects to the rest of your compliance portfolio",
    body: `<p>PCI-DSS exists within an ecosystem of other security and compliance frameworks. Organizations subject to PCI-DSS frequently also have obligations under NIST frameworks, ISO 27001, HIPAA, SOC 2, and state privacy laws. Understanding how these frameworks relate enables GRC professionals to build integrated compliance programs rather than redundant parallel efforts.</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>PCI-DSS and NIST CSF 2.0</strong><span>NIST CSF 2.0's six functions (GOVERN, IDENTIFY, PROTECT, DETECT, RESPOND, RECOVER) map across PCI-DSS's 12 requirements. Organizations using NIST CSF as their enterprise governance framework and PCI-DSS as their payment security standard can build an integrated program: CSF provides the strategic language for board reporting; PCI provides the specific payment security requirements. Significant overlap in PROTECT and DETECT functions.</span></div>
      <div class="cheat-pill"><strong>PCI-DSS and ISO 27001</strong><span>ISO 27001's Annex A controls overlap substantially with PCI-DSS requirements. Approximately 75-80% of PCI-DSS requirements have corresponding ISO 27001 controls. Organizations pursuing both can build a unified control framework. Key differences: PCI-DSS is payment-specific with precise prescriptive requirements; ISO 27001 is broader but less prescriptive. Both are valuable — ISO 27001 for enterprise credibility; PCI for payment security specifically.</span></div>
      <div class="cheat-pill"><strong>PCI-DSS and SOC 2</strong><span>SOC 2 auditors increasingly accept PCI-DSS documentation as evidence for overlapping controls. A PCI-compliant organization has strong evidence of security controls relevant to SOC 2 Trust Services Criteria — particularly around security, availability, and confidentiality. However, SOC 2 has broader scope (any sensitive customer data, not just payment cards) and requires a CPA firm assessment rather than a QSA.</span></div>
      <div class="cheat-pill"><strong>PCI-DSS and HIPAA</strong><span>Healthcare organizations that accept payment cards must comply with both PCI-DSS (for card data) and HIPAA (for protected health information). The two standards have overlapping requirements — both require access controls, audit logging, encryption, vulnerability management, and incident response. However, they address different data and have different enforcement mechanisms.</span></div>
      <div class="cheat-pill"><strong>PCI-DSS and GDPR/CCPA</strong><span>Payment card data is personal data under GDPR and CCPA. Organizations subject to both must satisfy the more stringent requirement where standards conflict. GDPR's breach notification timeline (72 hours to supervisory authority) is more demanding than PCI's breach reporting requirements. GDPR's data minimization principle aligns well with PCI's data storage minimization approach.</span></div>
      <div class="cheat-pill"><strong>PCI-DSS and CIS Controls</strong><span>The CIS Controls v8 were specifically designed to implement cybersecurity best practices that satisfy multiple compliance frameworks — including PCI-DSS. CIS provides a "PCI-DSS v4.0 mapping" that shows which CIS Controls implementation groups satisfy which PCI requirements. Organizations using CIS Controls as their technical security framework and PCI-DSS as their payment standard can leverage this mapping for integrated compliance.</span></div>
    </div>
    <div class="highlight-box"><strong>The integration opportunity:</strong> Organizations that treat each compliance framework as a separate silo — maintaining separate policies, separate controls documentation, separate assessments — multiply their compliance costs without improving security. The most sophisticated compliance programs build a unified control framework that satisfies multiple standards simultaneously: one access control policy that satisfies PCI Requirement 7, HIPAA administrative safeguards, and ISO 27001 A.9 controls simultaneously. This "build once, satisfy many" approach requires cross-framework mapping expertise — a core GRC competency.</highlight-box>`,

  {
    title: "Common PCI Compliance Failures and How to Avoid Them",
    tagline: "Learning from the mistakes that turn compliance programs into breaches",
    body: `<p>Understanding common PCI compliance failures is as important as understanding the requirements themselves. The same patterns of failure appear repeatedly across industries and organization sizes. Recognizing these patterns — and building controls that specifically prevent them — is how mature PCI programs are built.</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Scope Creep — Card Data Where It Shouldn't Be</strong><span>The most common PCI failure: cardholder data appears in systems that weren't identified as in-scope. Log files capture PANs. Customer service emails contain card numbers. Development environments use production card data. Regular data discovery scans specifically looking for PAN data in unexpected locations are essential.</span></div>
      <div class="cheat-pill"><strong>Default Credentials Left Unchanged</strong><span>Systems deployed with vendor default usernames and passwords are trivially compromised. Despite being PCI's first explicit requirement since the standard's beginning, default credential findings remain among the most common in PCI assessments — particularly on network devices and appliances that were set up quickly and forgotten.</span></div>
      <div class="cheat-pill"><strong>Patching Delays</strong><span>Critical patches taking more than 30 days to deploy is a compliance failure and a real security risk. Organizations with poor patch management processes often have dozens or hundreds of critical vulnerabilities outstanding in their CDE, representing documented attack vectors that attackers can exploit. Automated patch management is essential at scale.</span></div>
      <div class="cheat-pill"><strong>Inadequate Log Review</strong><span>Organizations implement logging as required but nobody reviews the logs. Centralized log management systems generating thousands of alerts per day with no triage process, no escalation procedures, and no human review effectively nullify Requirement 10. Logging without review is a compliance checkbox with no security value.</span></div>
      <div class="cheat-pill"><strong>Orphaned Access</strong><span>Former employees and contractors with active system access are a persistent finding. Organizations with high turnover — retail, hospitality, seasonal businesses — frequently have significantly more active accounts in cardholder data systems than active employees. Regular access reviews (required every six months) specifically target this problem.</span></div>
      <div class="cheat-pill"><strong>Third-Party Risk Blindness</strong><span>Merchants assuming their payment processor or POS vendor handles all their PCI compliance. The merchant remains responsible for their portion of the shared responsibility model and for verifying that service providers are actually compliant. The Target breach (2013) began with a vendor's credentials — a third-party risk that inadequate oversight failed to catch.</span></div>
    </div>
    <div class="warning-box"><strong>The point-of-compromise pattern:</strong> Post-breach analysis consistently shows that most major payment card breaches followed a predictable pattern: attackers gained initial access through phishing or exploiting an internet-facing vulnerability; moved laterally through the network to payment systems; installed malware to capture card data in memory; exfiltrated data for months before detection. Effective PCI compliance is specifically designed to interrupt this kill chain at multiple points — but only if controls are genuinely implemented and operating, not just documented.</div>`,
    quiz: { q: "During an annual penetration test, the assessor discovers that a development server in the same network segment as payment systems still uses vendor default credentials ('admin/admin') from when it was installed three years ago. This violates multiple PCI requirements. Which ones?", opts: ["Only Requirement 2 — secure configurations", "At minimum: Requirement 2.2 (secure configurations — vendor defaults must be changed), Requirement 1 (network segmentation — a development server may not belong in the same segment as the CDE), and Requirement 11.4 (penetration testing should have found this previously)", "Only Requirement 11 — penetration testing should have found it", "Only Requirement 8 — authentication requirements"], ans: 1, explain: "Multiple requirements are violated. Requirement 2 requires changing vendor defaults on all systems — 'admin/admin' is explicitly the type of default that must be changed. Requirement 1 requires proper network segmentation — a development server may create scope and risk issues by being in the CDE network. And the fact that a penetration test (Requirement 11.4) found something this basic after three years suggests the prior tests were inadequate or this server was not in scope for previous assessments. Compliance failures rarely involve just one requirement." }

  {
    title: "PCI-DSS Cheat Sheet",
    tagline: "Your complete quick-reference guide",
    isCheatSheet: true,
    body: `
    <div class="cheat-section">
      <h3>What Is PCI-DSS?</h3>
      <p style="font-size:13.5px;color:#6b6b68">Payment Card Industry Data Security Standard. Global security standard for organizations that store, process, or transmit payment card data. Governed by PCI Security Standards Council (PCI SSC), founded 2006 by Visa, Mastercard, American Express, Discover, and JCB International. Current version: PCI-DSS v4.0.1 (June 2024). NOT a law — contractually mandated through card brand programs. Enforced via acquiring banks. Penalties: fines, higher transaction fees, loss of card acceptance privileges. Applies globally — any organization worldwide accepting major payment cards must comply.</p>
    </div>

    <div class="cheat-section">
      <h3>Cardholder Data Definitions</h3>
      <div class="control-row">
        <div class="ctrl-card"><b>CHD — Cardholder Data (can be stored with protection):</b><br>• PAN — Primary Account Number (the 16-digit card number) — THE anchor element<br>• Cardholder Name<br>• Expiration Date<br>• Service Code<br><em>Other data only in-scope if stored alongside a PAN</em></div>
        <div class="ctrl-card"><b>SAD — Sensitive Authentication Data (NEVER store post-authorization, even if encrypted):</b><br>• Full magnetic stripe / track data<br>• CAV2/CVC2/CVV2/CID — the 3-4 digit security code<br>• PINs and PIN blocks<br><em>Post-auth storage is an absolute prohibition — no exceptions</em></div>
        <div class="ctrl-card"><b>CDE — Cardholder Data Environment:</b> Systems that store, process, or transmit CHD; systems providing security services to those; systems connected to the CDE that could impact security. Scope reduction via: network segmentation, tokenization, truncation, P2PE.</div>
      </div>
    </div>

    <div class="cheat-section">
      <h3>The 12 Requirements in 6 Goals</h3>
      <div class="control-row">
        <div class="ctrl-card"><b>Goal 1 — Build and Maintain Secure Networks</b><br><b>Req 1:</b> Network Security Controls — firewalls, routers, DMZ, rule reviews every 6 months, no direct internet-to-CDE access.<br><b>Req 2:</b> Secure Configurations — change all vendor defaults, disable unnecessary services/ports, configuration standards for all system types.</div>
        <div class="ctrl-card"><b>Goal 2 — Protect Account Data</b><br><b>Req 3:</b> Protect Stored Account Data — minimize storage, never store SAD post-auth, render PAN unreadable (hash/truncate/token/encrypt), key management.<br><b>Req 4:</b> Cryptography in Transit — TLS 1.2+ minimum, no SSL/TLS 1.0/1.1, no PAN via unencrypted messaging (email/SMS).</div>
        <div class="ctrl-card"><b>Goal 3 — Vulnerability Management</b><br><b>Req 5:</b> Malware Protection — anti-malware on all applicable systems, current definitions, active monitoring, anti-phishing.<br><b>Req 6:</b> Secure Systems and Software — critical patches within 1 month, web app protection (OWASP/WAF), secure SDLC, script management for payment pages.</div>
        <div class="ctrl-card"><b>Goal 4 — Strong Access Controls</b><br><b>Req 7:</b> Need-to-Know Access — least privilege, documented access approvals, access reviews every 6 months.<br><b>Req 8:</b> User Authentication — unique IDs (no shared accounts), 12-char passwords, MFA for all CDE access, 6-failed-attempt lockout, 15-min session timeout.<br><b>Req 9:</b> Physical Access — entry controls, visitor management, media protection/disposal, POI device inspection and anti-skimming.</div>
        <div class="ctrl-card"><b>Goal 5 — Monitor and Test</b><br><b>Req 10:</b> Logging and Monitoring — audit logs for all CDE systems, specific mandatory events, protect logs (centralized), daily review of critical systems, 12-month retention (3 months immediately available).<br><b>Req 11:</b> Security Testing — quarterly external ASV scans, quarterly internal scans, annual penetration testing, segmentation testing every 6 months, file integrity monitoring.</div>
        <div class="ctrl-card"><b>Goal 6 — Information Security Policy</b><br><b>Req 12:</b> Policy and Programs — annual info security policy, annual risk assessment, security awareness training (hire + annual), incident response plan (tested annually), service provider management, personnel screening.</div>
      </div>
    </div>

    <div class="cheat-section">
      <h3>Merchant Compliance Levels (Visa/Mastercard)</h3>
      <div class="level-grid">
        <div class="level-1c"><strong style="color:#4A1B0C">Level 1</strong><br><span style="font-size:12px">6M+ transactions/year OR any breach. Annual QSA onsite assessment (or internal audit). Quarterly ASV scans. Annual pen test.</span></div>
        <div class="level-2c"><strong style="color:#633806">Level 2</strong><br><span style="font-size:12px">1M–6M transactions/year. Annual SAQ (QSA validation may be required). Quarterly ASV scans.</span></div>
        <div class="level-3c"><strong style="color:#27500A">Level 3</strong><br><span style="font-size:12px">20K–1M e-commerce transactions/year. Annual SAQ. Quarterly ASV scans.</span></div>
        <div class="level-4c"><strong style="color:#042C53">Level 4</strong><br><span style="font-size:12px">&lt;20K e-comm or &lt;1M other transactions. Annual SAQ (bank-directed). Vast majority of merchants.</span></div>
      </div>
      <p style="font-size:12px;color:#6b6b68;margin-top:.4rem">Service Providers: Level 1 (&gt;300K transactions) = QSA required. Level 2 = SAQ.</p>
    </div>

    <div class="cheat-section">
      <h3>SAQ Types (Self-Assessment Questionnaires)</h3>
      <div class="control-row">
        <div class="ctrl-card"><b>SAQ A (~22 req)</b> — Card-not-present, fully outsourced to PCI-compliant third party, no electronic CHD storage. E-commerce with hosted payment page where card data never touches merchant systems.</div>
        <div class="ctrl-card"><b>SAQ A-EP</b> — E-commerce merchants redirecting to third-party payment page but whose website could impact security of that redirect.</div>
        <div class="ctrl-card"><b>SAQ B (~41 req)</b> — Imprint machines only OR standalone dial-up POS terminals not connected to internet or other systems.</div>
        <div class="ctrl-card"><b>SAQ B-IP</b> — Standalone, IP-connected POS terminals. More requirements than SAQ B due to internet connectivity.</div>
        <div class="ctrl-card"><b>SAQ C (~160 req)</b> — Payment application systems connected to the internet. Most merchants with networked POS systems.</div>
        <div class="ctrl-card"><b>SAQ D (~329 req)</b> — All other merchants not covered by SAQ A-C AND all service providers. Covers all PCI-DSS requirements. Used when storing CHD or complex environments.</div>
      </div>
    </div>

    <div class="cheat-section">
      <h3>Key PCI Ecosystem Roles</h3>
      <div class="control-row">
        <div class="ctrl-card"><b>PCI SSC</b> — Develops and maintains the standards. Does NOT enforce. Certifies QSAs and approves ASVs. Headquartered in Wakefield, MA.</div>
        <div class="ctrl-card"><b>Card Brands (Visa, MC, etc.)</b> — Enforce PCI-DSS through acquiring banks. Issue fines and penalties. Set merchant compliance levels (which may vary slightly by brand).</div>
        <div class="ctrl-card"><b>Acquiring Bank</b> — Direct enforcement relationship with merchants. Must ensure merchants comply. Passes card brand fines/penalties to non-compliant merchants.</div>
        <div class="ctrl-card"><b>QSA — Qualified Security Assessor</b> — PCI SSC-certified independent assessors. Required for Level 1 assessments. Produce ROC and co-sign AOC. Must be independent of the assessed entity.</div>
        <div class="ctrl-card"><b>ASV — Approved Scanning Vendor</b> — PCI SSC-approved companies. Conduct quarterly external vulnerability scans. Required for all merchants doing external scans.</div>
        <div class="ctrl-card"><b>Internal Security Assessor (ISA)</b> — Employees trained by PCI SSC to conduct internal assessments. Can validate SAQs for Level 2 merchants at some card brands. Not as authoritative as QSA for formal assessments.</div>
      </div>
    </div>

    <div class="cheat-section">
      <h3>Scope Reduction Technologies</h3>
      <div class="control-row">
        <div class="ctrl-card"><b>Network Segmentation</b> — Isolate CDE with firewalls/routers. Systems outside isolated CDE can be out of scope. Segmentation must be tested every 6 months. Most powerful scope reduction tool for complex environments.</div>
        <div class="ctrl-card"><b>Tokenization</b> — Replace PAN with random non-exploitable token. Systems using only tokens (not PANs) may be out of scope. Tokenization vault remains in scope. Eliminates stored card data risk.</div>
        <div class="ctrl-card"><b>P2PE — Point-to-Point Encryption</b> — Encrypt card data inside terminal before any network transmission. Plaintext card data never exists in merchant environment. PCI-validated P2PE qualifies for SAQ P2PE (~34 requirements).</div>
        <div class="ctrl-card"><b>Truncation</b> — Store only last 4 digits of PAN. No full PAN = not cardholder data. Receipts showing xxxx-xxxx-xxxx-1234 don't require PCI protection.</div>
      </div>
    </div>

    <div class="cheat-section">
      <h3>Key Assessment Documents</h3>
      <div class="control-row">
        <div class="ctrl-card"><b>ROC — Report on Compliance</b> — Comprehensive QSA assessment document. Details findings for every requirement. Used by Level 1 merchants and service providers.</div>
        <div class="ctrl-card"><b>AOC — Attestation of Compliance</b> — Summary compliance attestation signed by QSA and assessed entity. Shared with acquirers and business partners. Both parties attest to assessment accuracy.</div>
        <div class="ctrl-card"><b>SAQ — Self-Assessment Questionnaire</b> — Self-completed compliance documentation for Level 2-4 merchants. Multiple versions (A through D) for different merchant types. Includes AOC.</div>
        <div class="ctrl-card"><b>ASV Scan Report</b> — Quarterly external vulnerability scan results. Must show no unresolved high-severity vulnerabilities. Required for compliance certification.</div>
      </div>
    </div>

    <div class="cheat-section">
      <h3>Key Numbers and Facts</h3>
      <div class="badge-row">
        <span class="badge badge-wine">Founded: PCI SSC formed 2006 by 5 card brands</span>
        <span class="badge badge-wine">Current version: v4.0.1 (June 2024)</span>
        <span class="badge badge-wine">v3.2.1 retired: March 31, 2024</span>
        <span class="badge badge-wine">12 Requirements in 6 Goals</span>
        <span class="badge badge-wine">5 founding brands: Visa, MC, AmEx, Discover, JCB</span>
        <span class="badge badge-wine">SAD: NEVER store post-authorization (no exceptions)</span>
        <span class="badge badge-wine">PAN must be unreadable where stored</span>
        <span class="badge badge-wine">Quarterly: external ASV scans, internal scans</span>
        <span class="badge badge-wine">Annual: penetration testing, access reviews, risk assessment, IR test</span>
        <span class="badge badge-wine">Every 6 months: firewall rule review, segmentation test, access reviews</span>
        <span class="badge badge-wine">Critical patches: within 1 month</span>
        <span class="badge badge-wine">Log retention: 12 months, 3 months immediately available</span>
        <span class="badge badge-wine">Session timeout: 15 minutes idle</span>
        <span class="badge badge-wine">Account lockout: 6 failed attempts, 30-minute lockout</span>
        <span class="badge badge-wine">Password minimum: 12 characters (8 if system limits)</span>
        <span class="badge badge-wine">MFA: required for ALL access into CDE (v4.0 expansion)</span>
        <span class="badge badge-wine">TLS: 1.2 minimum (1.3 preferred); SSL/TLS 1.0/1.1 prohibited</span>
        <span class="badge badge-wine">Level 1 threshold: 6M+ transactions or any breach</span>
        <span class="badge badge-wine">P2PE validated: ~34 requirements (SAQ P2PE)</span>
      </div>
    </div>

    <div class="cheat-section">
      <h3>Framework Relationships</h3>
      <div class="control-row">
        <div class="ctrl-card"><b>NIST CSF 2.0</b> — CSF provides enterprise governance language; PCI-DSS provides payment-specific requirements. CSF PROTECT/DETECT functions map to PCI Goals 2-5. Complementary layers for payment organizations.</div>
        <div class="ctrl-card"><b>ISO 27001</b> — ~75-80% control overlap. ISO 27001 Annex A maps across PCI requirements. ISO provides broader enterprise security certification; PCI provides payment-specific depth.</div>
        <div class="ctrl-card"><b>NIST RMF</b> — Federal agencies accepting card payments must satisfy both. RMF provides system authorization process; PCI provides payment security requirements. Both can be addressed through integrated control sets.</div>
        <div class="ctrl-card"><b>SOC 2</b> — Significant overlap in Trust Services Criteria. PCI compliance evidence supports SOC 2 audits. Different audiences: PCI satisfies card brands; SOC 2 satisfies enterprise customers. Both often pursued by payment processors.</div>
        <div class="ctrl-card"><b>HIPAA</b> — Healthcare organizations need both. Different data scopes (card vs. PHI). Overlapping controls (access, encryption, logging, incident response). Unified compliance programs serve both simultaneously.</div>
        <div class="ctrl-card"><b>GDPR/CCPA</b> — Card data is personal data under privacy laws. GDPR's 72-hour breach notification stricter than PCI requirements. Data minimization principles align. Compliance teams must address both for EU/California card holders.</div>
      </div>
    </div>
    `
  }
];

let current = 0;

function buildGrid(){
  const g = document.getElementById('dayGrid');
  g.innerHTML = '';
  for(let i = 0; i < days.length; i++){
    const b = document.createElement('button');
    b.className = 'day-pip' + (days[i].isCheatSheet ? ' cheat' : '') + (i === current ? ' active' : '');
    b.textContent = days[i].isCheatSheet ? 'CS' : (i + 1);
    b.title = days[i].title;
    b.onclick = (()=>{ const idx = i; return () => goTo(idx); })();
    g.appendChild(b);
  }
}

function goTo(idx){ current = idx; render(); }
function changeDay(dir){ current = Math.max(0, Math.min(days.length - 1, current + dir)); render(); }

function render(){
  const d = days[current];
  const total = days.length;
  document.getElementById('dayCounter').textContent = (current + 1) + ' / ' + total;
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === total - 1;
  document.getElementById('progBar').style.width = (((current + 1) / total) * 100) + '%';
  buildGrid();

  if(d.isCheatSheet){
    document.getElementById('lessonArea').innerHTML = `
      <div class="card">
        <div class="lesson-header">
          <div class="day-badge" style="background:#E1F5EE">
            <div class="day-num" style="color:#085041;font-size:14px">CHEAT</div>
            <div class="day-lbl" style="color:#0F6E56">SHEET</div>
          </div>
          <div class="lesson-meta">
            <h2>${d.title}</h2>
            <div class="tagline">${d.tagline}</div>
          </div>
        </div>
        <div class="lesson-body">${d.body}</div>
      </div>`;
    return;
  }

  const quizId = 'quiz_' + current;
  let quizHtml = '';
  if(d.quiz){
    const optsHtml = d.quiz.opts.map((o, i) =>
      `<button class="quiz-btn" onclick="checkAnswer(${i}, ${d.quiz.ans}, '${quizId}')">${o}</button>`
    ).join('');
    quizHtml = `<div class="quiz-box">
      <p>Quick check: ${d.quiz.q}</p>
      <div>${optsHtml}</div>
      <div class="answer-reveal" id="${quizId}"></div>
    </div>`;
  }

  document.getElementById('lessonArea').innerHTML = `
    <div class="card">
      <div class="lesson-header">
        <div class="day-badge">
          <div class="day-num">${current + 1}</div>
          <div class="day-lbl">Day</div>
        </div>
        <div class="lesson-meta">
          <h2>${d.title}</h2>
          <div class="tagline">${d.tagline}</div>
        </div>
      </div>
      <div class="section-label">Today's lesson</div>
      <div class="lesson-body">${d.body}</div>
      ${quizHtml}
    </div>`;
}

function checkAnswer(chosen, correct, qid){
  const el = document.getElementById(qid);
  const d = days[current];
  if(!d.quiz) return;
  const isRight = chosen === correct;
  el.innerHTML = `<strong>${isRight ? 'Correct!' : 'Not quite.'}</strong> ${d.quiz.explain}`;
  el.className = 'answer-reveal show';
  el.style.background = isRight ? '#EAF3DE' : '#FCEBEB';
  el.style.borderColor = isRight ? '#3B6D11' : '#A32D2D';
  el.style.color = '#1a1a18';
}

render();
</script>
