    body: `
    <div class="cheat-section">
      <h3>What Is FISMA?</h3>
      <p style="font-size:13.5px;color:#6b6b68">Federal Information Security Modernization Act. US federal law enacted December 2014 (updating the 2002 Federal Information Security Management Act). Requires all executive branch federal agencies to develop, document, and implement comprehensive information security programs. Applies to federal agencies AND contractors/service providers operating federal information systems. Does NOT apply to Congress or the federal judiciary (executive branch only). Enforced through OMB policy oversight, independent Inspector General annual evaluations, annual congressional reporting, CISA Binding Operational Directives, and budget/funding mechanisms. FISMA is the law; NIST RMF is the system-level implementation process; NIST SP 800-53 is the security control catalog that agencies implement.</p>
    </div>

    <div class="cheat-section">
      <h3>Key Agencies and Their Roles</h3>
      <div class="control-row">
        <div class="ctrl-card"><b>OMB — Office of Management and Budget</b> — Central policy and oversight authority. Issues cybersecurity memoranda (M-21-31 logging, M-22-09 Zero Trust). Reviews agency performance. Submits annual FISMA report to Congress. Controls agency budgets — the primary enforcement lever for non-compliance.</div>
        <div class="ctrl-card"><b>NIST — National Institute of Standards and Technology</b> — Develops technical standards: SP 800-37 (RMF), SP 800-53 (controls), SP 800-53A (assessment procedures), SP 800-60 (info type catalog), SP 800-137 (continuous monitoring), FIPS 199, FIPS 200, NIST CSF 2.0. No enforcement authority — publishes the blueprint that OMB mandates agencies follow.</div>
        <div class="ctrl-card"><b>CISA — Cybersecurity and Infrastructure Security Agency</b> — Operational federal cybersecurity. Operates CDM (free monitoring tools). Issues mandatory Binding Operational Directives. Maintains KEV catalog (mandatory patching). Operates Einstein/NCPS network monitoring. Provides incident response support. US-CERT receives agency incident reports.</div>
        <div class="ctrl-card"><b>Inspector General (IG)</b> — Annual independent FISMA evaluation per agency. Dual reporting: agency head AND Congress. Cannot be removed without congressional notification. Findings are public. Evaluates: ATO coverage, continuous monitoring, identity management, incident response, training, POA&M management. The primary FISMA auditor.</div>
        <div class="ctrl-card"><b>GAO — Government Accountability Office</b> — Congressional watchdog. Independent deep-dive reviews. High-Risk List (federal information security on it since 1997). Reports drive legislative and budget action. Not part of the executive branch — provides Congress independent evaluation capability.</div>
        <div class="ctrl-card"><b>Agency Roles</b> — Agency Head: ultimate FISMA accountability. CIO: information security program management. CISO: day-to-day security operations. SAOP (added 2014): privacy requirements and PIAs. AO (Authorizing Official): accepts system risk and issues ATOs. System Owner: operational accountability. ISSO: system-level security management.</div>
      </div>
    </div>

    <div class="cheat-section">
      <h3>FISMA's 8 Core Requirements</h3>
      <div class="control-row">
        <div class="ctrl-card"><b>1. Risk Assessments</b> — Periodic assessments of risk to agency operations from operating information systems. Probability and magnitude of harm. Feeds NIST RMF CATEGORIZE step.</div>
        <div class="ctrl-card"><b>2. Policies and Procedures</b> — Agency-wide information security policies covering all operations: risk management, planning, training, testing, remediation, incident response.</div>
        <div class="ctrl-card"><b>3. System Security Plans (SSP)</b> — Security plan for each system documenting controls in place or planned. Rules of behavior for system access. Primary artifact for each authorization.</div>
        <div class="ctrl-card"><b>4. Security Training</b> — Annual awareness training for all personnel including contractors. Role-based training for security staff. Completion tracked. Not optional — 100% required.</div>
        <div class="ctrl-card"><b>5. Testing and Evaluation</b> — Annual testing of security policies, procedures, and controls. Management, operational, and technical controls all tested. Results drive remediation.</div>
        <div class="ctrl-card"><b>6. POA&Ms</b> — Plans of Action and Milestones for correcting deficiencies. Named owners. Realistic deadlines. Quarterly reporting to OMB. Must be actively managed to closure — not just documented.</div>
        <div class="ctrl-card"><b>7. Incident Response</b> — Detect, report, respond to incidents. Report to CISA/US-CERT per category timelines. Major incidents: notify Congress within 7 days. Capability must be tested — not just documented.</div>
        <div class="ctrl-card"><b>8. Continuity of Operations</b> — Business continuity and disaster recovery plans for system disruptions. Availability is a FISMA requirement alongside confidentiality and integrity.</div>
      </div>
    </div>

    <div class="cheat-section">
      <h3>Key Documents</h3>
      <div class="control-row">
        <div class="ctrl-card"><b>ATO — Authorization to Operate</b> — Senior official's (AO) formal risk acceptance and authorization for system operation. Typically valid up to 3 years. NOT a security certification — it's a documented risk acceptance decision. No ATO = FISMA violation. Types: Full ATO, ATO with Conditions, Denial (DATO), Ongoing Authorization.</div>
        <div class="ctrl-card"><b>SSP — System Security Plan</b> — Complete system documentation: purpose, boundary, information types, FIPS 199 categorization, implementation statements for all selected controls, roles, interconnections. Must be current at all times. Primary authorization evidence reviewed by the AO.</div>
        <div class="ctrl-card"><b>SAR — Security Assessment Report</b> — Independent assessor's findings on control effectiveness: Satisfied, Other Than Satisfied, Not Applicable. Source of all POA&M items. One of the three authorization package documents. Must be produced by independent assessors.</div>
        <div class="ctrl-card"><b>POA&M — Plan of Action and Milestones</b> — Tracked remediation plan for all security deficiencies. Named owner, deadline, resource requirements, status. Reported quarterly to OMB. IG evaluates POA&M management quality. Aging open items without progress = compliance failure.</div>
      </div>
    </div>

    <div class="cheat-section">
      <h3>CISA Enforcement Tools</h3>
      <div class="control-row">
        <div class="ctrl-card"><b>Binding Operational Directives (BODs)</b> — Mandatory for federal civilian agencies. Must be implemented within specified timeframes. BOD 22-01: KEV catalog — patch listed vulnerabilities within 14 days critical / 30 days others. BOD 18-01: email security/DMARC.</div>
        <div class="ctrl-card"><b>Emergency Directives (EDs)</b> — Highest urgency. Hours-to-days response window. Reserved for critical zero-days or active mass exploitation of federal systems. ED 21-04 (Exchange): 24-48 hour response required.</div>
        <div class="ctrl-card"><b>CDM — Continuous Diagnostics and Mitigation</b> — Free tools and dashboards for continuous monitoring: asset management, vulnerability scanning, identity management, network monitoring. Feeds Federal Dashboard for government-wide visibility. Enrollment tracked as primary continuous monitoring metric.</div>
        <div class="ctrl-card"><b>KEV Catalog</b> — Known Exploited Vulnerabilities. BOD 22-01 mandatory patching deadlines. Most concrete FISMA compliance requirement with specific timelines. Non-compliance tracked and reported publicly.</div>
      </div>
    </div>

    <div class="cheat-section">
      <h3>Major Executive Orders Shaping FISMA</h3>
      <div class="control-row">
        <div class="ctrl-card"><b>EO 13636 (2013)</b> — Created NIST CSF. Launched modern federal cybersecurity governance era. Required government-private threat intelligence sharing.</div>
        <div class="ctrl-card"><b>EO 13800 (2017)</b> — Made NIST CSF mandatory for all federal agencies. Government-wide cybersecurity risk assessment. DoD cyber deterrence assessment.</div>
        <div class="ctrl-card"><b>EO 14028 (2021)</b> — SolarWinds/Colonial Pipeline response. Mandated: EDR, enhanced logging (M-21-31), SBOM for software vendors, Zero Trust architecture (M-22-09). Most impactful cybersecurity EO since FISMA 2014.</div>
        <div class="ctrl-card"><b>NSM-8 (2022)</b> — Applied EO 14028 requirements to DoD/IC with classified additions. Zero Trust for national security systems.</div>
      </div>
    </div>

    <div class="cheat-section">
      <h3>Common FISMA Failures (Consistent IG Findings)</h3>
      <div class="badge-row">
        <span class="badge badge-red">Shadow IT / incomplete system inventory</span>
        <span class="badge badge-red">ATO lapses — systems operating without current authorization</span>
        <span class="badge badge-red">Privileged account proliferation and orphaned accounts</span>
        <span class="badge badge-red">Configuration drift from secure baselines</span>
        <span class="badge badge-red">Security training completion gaps (especially contractors)</span>
        <span class="badge badge-red">POA&M aging without active remediation</span>
        <span class="badge badge-red">Continuous monitoring theater (tools deployed, data not used)</span>
        <span class="badge badge-red">Inadequate incident reporting to CISA</span>
      </div>
    </div>

    <div class="cheat-section">
      <h3>Framework Relationships</h3>
      <div class="control-row">
        <div class="ctrl-card"><b>NIST RMF (SP 800-37)</b> — Primary implementation process for FISMA. 7 steps produce ATOs. FISMA is the law; RMF is the documented methodology for demonstrating compliance system by system.</div>
        <div class="ctrl-card"><b>NIST SP 800-53 Rev 5</b> — Security control catalog. 20 families, 1,000+ controls. Low/Moderate/High baselines via SP 800-53B. Rev 5 added PT (privacy) and SR (supply chain) families. Used in RMF SELECT step.</div>
        <div class="ctrl-card"><b>NIST CSF 2.0</b> — Enterprise governance framework. Mandatory for federal agencies per EO 13800. 6 functions map to FISMA requirements. Strategic governance language above the RMF tactical process.</div>
        <div class="ctrl-card"><b>FedRAMP</b> — FISMA for cloud services. Mandatory for agencies using cloud for federal data. "Do once, use many" authorization model. JAB P-ATO highest authorization level. FedRAMP Marketplace at marketplace.fedramp.gov.</div>
        <div class="ctrl-card"><b>CMMC</b> — DoD supply chain security. Based on SP 800-171 derived from SP 800-53. FISMA-adjacent for defense contractors handling CUI. Different scope and enforcement than FISMA but sharing NIST control foundations.</div>
        <div class="ctrl-card"><b>HIPAA (at VA)</b> — VA satisfies both. FISMA: all VA systems. HIPAA: veterans' protected health information specifically. Unified compliance approach with integrated control mapping reduces duplication across both frameworks.</div>
      </div>
    </div>

    <div class="cheat-section">
      <h3>Key Numbers and Facts</h3>
      <div class="badge-row">
        <span class="badge badge-slate">Enacted: December 2014 (FISMA 2014); Original: 2002</span>
        <span class="badge badge-slate">Full name: Federal Information Security MODERNIZATION Act</span>
        <span class="badge badge-slate">7-day rule: congressional notification for major incidents</span>
        <span class="badge badge-slate">ATO validity: typically up to 3 years</span>
        <span class="badge badge-slate">Quarterly: POA&M reporting to OMB</span>
        <span class="badge badge-slate">Annual: security training, testing, IG evaluation, FISMA report to Congress</span>
        <span class="badge badge-slate">14 days: typical BOD 22-01 KEV critical patch deadline</span>
        <span class="badge badge-slate">GAO High-Risk List: federal information security on it since 1997</span>
        <span class="badge badge-slate">Applies to: executive branch only (NOT Congress or judiciary)</span>
        <span class="badge badge-slate">FIPS 199 impact levels: Low, Moderate (most common ~70-80%), High</span>
        <span class="badge badge-slate">High watermark principle: overall impact = highest individual CIA rating</span>
        <span class="badge badge-slate">SAOP: privacy role added explicitly by FISMA 2014</span>
        <span class="badge badge-slate">CDM: free CISA continuous monitoring tools for all agencies</span>
        <span class="badge badge-slate">FedRAMP: mandatory for cloud services with federal data</span>
        <span class="badge badge-slate">EO 14028 (2021): most significant cybersecurity EO since FISMA</span>
        <span class="badge badge-slate">Zero Trust: mandated by EO 14028 and OMB M-22-09</span>
        <span class="badge badge-slate">Phishing-resistant MFA: FIDO2/WebAuthn or PIV/CAC (not SMS)</span>
        <span class="badge badge-slate">SP 800-53 Rev 5: 20 control families, 1,000+ controls</span>
        <span class="badge badge-slate">SolarWinds (2020): drove supply chain risk management requirements</span>
      </div>
    </div>
    `
  }
];

let current = 0;

function buildGrid(){
  const g = document.getElementById('dayGrid');
  g.innerHTML = '';
  for(let i = 0; i < days.length; i++){
    const b = document.createElement('button');
    b.className = 'day-pip' + (days[i].isCheatSheet ? ' cheat' : '') + (i === current ? ' active' : '');
    b.textContent = days[i].isCheatSheet ? 'CS' : (i + 1);
    b.title = days[i].title;
    b.onclick = (()=>{ const idx = i; return () => goTo(idx); })();
    g.appendChild(b);
  }
}

function goTo(idx){ current = idx; render(); }
function changeDay(dir){ current = Math.max(0, Math.min(days.length - 1, current + dir)); render(); }

function render(){
  const d = days[current];
  const total = days.length;
  document.getElementById('dayCounter').textContent = (current + 1) + ' / ' + total;
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === total - 1;
  document.getElementById('progBar').style.width = (((current + 1) / total) * 100) + '%';
  buildGrid();

  if(d.isCheatSheet){
    document.getElementById('lessonArea').innerHTML = `
      <div class="card">
        <div class="lesson-header">
          <div class="day-badge" style="background:#E1F5EE">
            <div class="day-num" style="color:#085041;font-size:14px">CHEAT</div>
            <div class="day-lbl" style="color:#0F6E56">SHEET</div>
          </div>
          <div class="lesson-meta">
            <h2>${d.title}</h2>
            <div class="tagline">${d.tagline}</div>
          </div>
        </div>
        <div class="lesson-body">${d.body}</div>
      </div>`;
    return;
  }

  const quizId = 'quiz_' + current;
  let quizHtml = '';
  if(d.quiz){
    const optsHtml = d.quiz.opts.map((o, i) =>
      `<button class="quiz-btn" onclick="checkAnswer(${i}, ${d.quiz.ans}, '${quizId}')">${o}</button>`
    ).join('');
    quizHtml = `<div class="quiz-box">
      <p>Quick check: ${d.quiz.q}</p>
      <div>${optsHtml}</div>
      <div class="answer-reveal" id="${quizId}"></div>
    </div>`;
  }

  document.getElementById('lessonArea').innerHTML = `
    <div class="card">
      <div class="lesson-header">
        <div class="day-badge">
          <div class="day-num">${current + 1}</div>
          <div class="day-lbl">Day</div>
        </div>
        <div class="lesson-meta">
          <h2>${d.title}</h2>
          <div class="tagline">${d.tagline}</div>
        </div>
      </div>
      <div class="section-label">Today's lesson</div>
      <div class="lesson-body">${d.body}</div>
      ${quizHtml}
    </div>`;
}

function checkAnswer(chosen, correct, qid){
  const el = document.getElementById(qid);
  const d = days[current];
  if(!d.quiz) return;
  const isRight = chosen === correct;
  el.innerHTML = `<strong>${isRight ? 'Correct!' : 'Not quite.'}</strong> ${d.quiz.explain}`;
  el.className = 'answer-reveal show';
  el.style.background = isRight ? '#EAF3DE' : '#FCEBEB';
  el.style.borderColor = isRight ? '#3B6D11' : '#A32D2D';
  el.style.color = '#1a1a18';
}

render();
</script>
