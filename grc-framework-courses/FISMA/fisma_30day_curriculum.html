<div class="wrap">
  <h2 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">30-day FISMA curriculum for high school students with daily lessons and a final cheat sheet</h2>
  <div class="top-bar">
    <div class="title-block">
      <h1>FISMA — 30-Day Classroom Guide</h1>
      <p>Taught for high school freshmen by a 20-year GRC veteran</p>
    </div>
    <div class="nav-row">
      <button id="prevBtn" onclick="changeDay(-1)">&#8592; Prev</button>
      <span id="dayCounter" style="font-size:13px;color:#6b6b68;min-width:60px;text-align:center"></span>
      <button id="nextBtn" onclick="changeDay(1)">Next &#8594;</button>
    </div>
  </div>
  <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progBar"></div></div>
  <div class="day-grid" id="dayGrid"></div>

</div>
<script>
const days = [
  {
    title: "What Is FISMA?",
    tagline: "The law that makes cybersecurity mandatory across the entire US federal government",
    body: `<p>Imagine you are the Secretary of Veterans Affairs. The VA operates hundreds of information systems holding medical histories, mental health records, service records, and financial data for millions of veterans — some of the most sensitive personal information in existence. And the VA, like every federal agency, faces sophisticated cyberattacks every day from foreign adversaries and criminal organizations. How does the US government ensure all of this is systematically protected? The answer is <span class="key-term">FISMA</span>.</p>
    <p>FISMA stands for the <strong>Federal Information Security Modernization Act</strong>. It is a US federal law enacted in <strong>December 2014</strong> that establishes a comprehensive framework for ensuring the security of federal government information and information systems. The 2014 version updated and replaced the original Federal Information Security Management Act of 2002. FISMA creates legal obligations for every federal executive branch agency to develop, document, and implement security programs that protect federal information and the systems that hold it.</p>
    <div class="analogy-box"><strong>Real-world analogy:</strong> Think of FISMA like the building code for federal cybersecurity. Just as every building constructed with federal funds must meet specific safety standards — fire suppression, structural integrity, electrical safety — every information system operated by or for the federal government must meet FISMA's security requirements. Building codes protect physical safety; FISMA protects information security. Both are mandatory, both have independent inspections, and both have real consequences for non-compliance.</div>
    <div class="highlight-box">Key facts about FISMA: Enacted December 2014 (updating the 2002 original). Full name: Federal Information Security Modernization Act. Applies to all federal executive branch agencies. Requires comprehensive, continuous information security programs. Mandates annual independent evaluations and reporting to Congress. Implemented through NIST standards and guidelines. Enforced through OMB oversight and Inspector General evaluations. Affects millions of federal employees, contractors, and citizens whose data federal agencies hold.</div>
    <p>FISMA is the legal foundation on which the entire federal cybersecurity ecosystem is built. The NIST Risk Management Framework, NIST SP 800-53 security controls, FedRAMP for cloud services, and every federal security authorization process — all exist because FISMA creates the legal obligation for them. Understanding FISMA is understanding why federal cybersecurity works the way it does.</p>`,
    quiz: { q: "What is the correct full name and year of enactment for the current version of FISMA?", opts: ["Federal Information Security Management Act, enacted 2002", "Federal Information Security Modernization Act, enacted December 2014", "Federal Infrastructure Security Management Act, enacted 2016", "Federal Information Systems Management Act, enacted 2010"], ans: 1, explain: "The current version is the Federal Information Security Modernization Act, enacted in December 2014. It updated the original Federal Information Security Management Act of 2002. The key word change — 'Modernization' replacing 'Management' — reflected the 2014 law's shift from static compliance documentation to continuous, risk-based security management. Many practitioners still refer to both versions collectively as 'FISMA.'" }
  },
  {
    title: "Why Was FISMA Created?",
    tagline: "The federal cybersecurity crisis that demanded a legislative solution",
    body: `<p>The federal government operates some of the world's most sensitive and valuable information systems — and by the late 1990s, it was dangerously clear that the security of those systems was completely inadequate. Before FISMA, there was no consistent, mandatory framework for federal information security. Each agency did whatever it chose — or nothing at all.</p>
    <div class="highlight-box"><strong>The pre-FISMA problem:</strong> A 2001 GAO report on federal computer security was devastating. It found: major agencies lacked basic security controls; most agencies couldn't identify all the systems they operated; security training was rare; incident response was ad hoc; and there was no consistent way to measure or report on security posture. The federal government was holding sensitive data on hundreds of millions of Americans with essentially no systematic security requirements. One GAO official called it a "chronic governmentwide problem."</div>
    <p>Several high-profile incidents in the late 1990s and early 2000s accelerated the push for legislation:</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Solar Sunrise (1998)</strong><span>Hackers penetrated unclassified DoD systems during the Gulf deployment buildup. Initially feared to be Iraqi state actors, it turned out to be two California teenagers. The fact that teenage hackers could penetrate DoD systems and go undetected for days triggered serious congressional concern about federal security practices.</span></div>
      <div class="cheat-pill"><strong>Moonlight Maze (1998–1999)</strong><span>A sustained, sophisticated intrusion into Pentagon, NASA, DoE, and research university systems, believed to originate from Russia. Classified documents and military research data were exfiltrated for nearly two years before detection — one of the first documented nation-state cyber espionage campaigns against US federal systems.</span></div>
      <div class="cheat-pill"><strong>GAO High-Risk Designation</strong><span>The Government Accountability Office placed federal information security on its "High-Risk List" — reserved for federal programs representing the greatest risk to the nation. This powerful designation, maintained since 1997, created enormous pressure for legislation by making federal cybersecurity failures a permanent fixture of congressional oversight.</span></div>
      <div class="cheat-pill"><strong>FISMA 2002 to 2014 Evolution</strong><span>FISMA 2002 was an improvement over no law — but it devolved into a compliance checkbox exercise focused on documentation rather than actual security. Agencies produced security paperwork while being actively breached. The 2014 update fundamentally shifted emphasis from documentation compliance to continuous monitoring and genuine risk management.</span></div>
    </div>
    <div class="analogy-box"><strong>The annual physical vs. continuous health monitor:</strong> FISMA 2002 was like requiring only an annual physical exam — a snapshot that may not reflect current health reality. FISMA 2014 is like requiring a continuous health monitor — real-time visibility with alerts when something goes wrong. For cybersecurity in a dynamic threat environment, continuous visibility beats annual snapshots. This shift from periodic to continuous security management is FISMA 2014's most important contribution.</div>`,
    quiz: { q: "What was the fundamental flaw in how FISMA 2002 was implemented that FISMA 2014 sought to correct?", opts: ["FISMA 2002 had too many technical requirements for agencies to follow", "FISMA 2002 devolved into a compliance checkbox exercise — agencies produced security documentation while remaining vulnerable. FISMA 2014 shifted focus to continuous monitoring and genuine risk-based security management rather than paperwork production.", "FISMA 2002 only applied to DoD systems and not civilian agencies", "FISMA 2002 required too much spending on security tools"], ans: 1, explain: "FISMA 2002 created an enormous compliance industry focused on producing documentation rather than improving security. Agencies could show green-light compliance indicators in annual reports while simultaneously being actively compromised. FISMA 2014 addressed this by requiring continuous monitoring of security controls, automated security metrics, and outcomes-based evaluation — focusing the law on actual security posture rather than documentation status." }
  },
  {
    title: "FISMA's Scope — Who Must Comply?",
    tagline: "Understanding the reach of the law that governs federal information security",
    body: `<p>Understanding <span class="key-term">FISMA's scope</span> is essential — it extends well beyond government employees to include contractors, grantees, and service providers who touch federal information. This broad reach ensures that security requirements follow federal data wherever it goes, not just to government buildings.</p>
    <div class="highlight-box"><strong>FISMA's core scope:</strong> FISMA applies to all federal executive branch departments and agencies, including independent agencies. It covers all federal information systems — systems operated by the federal government AND systems operated by contractors on behalf of federal agencies. Any organization that processes, stores, or transmits federal information as part of a government contract must comply with applicable FISMA requirements. This brings hundreds of thousands of private-sector contractors, cloud service providers, and research institutions into the FISMA compliance ecosystem.</div>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Civilian Federal Agencies</strong><span>All executive branch departments (HHS, VA, Treasury, State, etc.) and independent agencies (EPA, FDA, SEC, etc.) are fully subject to FISMA. OMB oversees their compliance. Annual FISMA reports to Congress cover these agencies' security posture, ATO coverage, and continuous monitoring maturity.</span></div>
      <div class="cheat-pill"><strong>Department of Defense</strong><span>DoD is subject to FISMA but implements it through its own security frameworks (DoD RMF) that align with but extend beyond civilian FISMA requirements. DoD requirements are typically more stringent given the national security nature of DoD systems and data.</span></div>
      <div class="cheat-pill"><strong>Intelligence Community</strong><span>The IC operates under FISMA but with additional classified requirements from the Director of National Intelligence. IC security requirements are typically the most stringent — classified data and intelligence sources require security measures beyond standard civilian FISMA.</span></div>
      <div class="cheat-pill"><strong>Federal Contractors</strong><span>Private companies with federal contracts involving federal information systems or data must comply with applicable FISMA requirements. IT services firms, cloud providers, defense contractors, and research institutions with federal contracts all have FISMA-derived security obligations.</span></div>
      <div class="cheat-pill"><strong>Federal Grantees</strong><span>Organizations receiving federal grants may have FISMA-derived obligations if the grant involves federal information systems or data. Research universities, state governments, and nonprofits receiving federal grants often have security obligations specified in grant terms.</span></div>
      <div class="cheat-pill"><strong>NOT Congress or Judiciary</strong><span>FISMA applies to the executive branch only. Congress and the federal courts are not subject to FISMA — they have their own independent security requirements. This is a common misconception among students of federal cybersecurity law.</span></div>
    </div>
    <div class="analogy-box"><strong>Why contractor inclusion matters:</strong> The federal government outsources enormous portions of its IT operations. If FISMA only covered federal employees operating government systems, vast amounts of federal data — held by cloud providers, IT service firms, defense contractors, and research institutions — would exist outside the security framework. The contractor inclusion ensures that FISMA's security requirements follow federal data wherever it goes, not just to systems physically operated by government employees.</div>`,
    quiz: { q: "A private cloud company wins a federal contract to host a federal agency's financial management system. Is this company subject to FISMA requirements?", opts: ["No — FISMA only applies to federal government employees", "Yes — contractors operating federal information systems or handling federal data are subject to applicable FISMA requirements through their contracts. Security obligations follow the federal data, not just the government employees who oversee it.", "Only if the company has more than 500 federal government customers", "Only for contracts worth more than $10 million"], ans: 1, explain: "FISMA explicitly extends to systems operated by contractors on behalf of federal agencies. A cloud company hosting a federal financial management system is operating a federal information system — they must implement applicable security controls, support the agency's FISMA compliance program, and often must achieve a formal security authorization (ATO). The security obligation follows the federal information, regardless of whether government employees or private contractors operate the system." }
  },
  {
    title: "The FISMA Ecosystem — Key Agencies and Their Roles",
    tagline: "Understanding who does what in the federal cybersecurity governance structure",
    body: `<p>FISMA creates a complex ecosystem of agencies, each with distinct roles and responsibilities. Understanding who does what — and who has authority over what — is essential for navigating FISMA compliance professionally.</p>
    <div class="agency-card"><b>OMB — Office of Management and Budget</b><br>The central policy and oversight authority for FISMA across the executive branch. OMB issues government-wide cybersecurity policy via memoranda (M-21-31 on logging, M-22-09 on Zero Trust), sets annual FISMA reporting requirements, reviews agency performance, and submits the annual FISMA report to Congress. OMB has budget authority over agencies — making its cybersecurity directives effectively mandatory regardless of whether they carry explicit legal weight.</div>
    <div class="agency-card"><b>NIST — National Institute of Standards and Technology (Dept. of Commerce)</b><br>Develops and publishes the technical standards and guidelines agencies use to implement FISMA. Key publications: SP 800-37 (RMF), SP 800-53 (security controls), SP 800-53A (assessment procedures), SP 800-60 (information type categorization), SP 800-137 (continuous monitoring), FIPS 199, FIPS 200, and the Cybersecurity Framework (CSF 2.0). NIST has no enforcement authority — it provides the technical blueprint; OMB and IGs enforce it.</div>
    <div class="agency-card"><b>CISA — Cybersecurity and Infrastructure Security Agency (Dept. of Homeland Security)</b><br>The operational cybersecurity agency for the federal government. CISA operates the Continuous Diagnostics and Mitigation (CDM) program (providing agencies with free security monitoring tools), manages the Einstein/NCPS network monitoring system protecting federal networks, issues Binding Operational Directives (BODs) that agencies must follow, and maintains the Known Exploited Vulnerabilities (KEV) catalog. CISA is the "fire department" of federal cybersecurity.</div>
    <div class="agency-card"><b>Inspector Generals (IGs)</b><br>Each major federal agency has an independent Inspector General who conducts annual independent evaluations of the agency's FISMA program. IGs report to both the agency head and Congress — they cannot be removed without congressional notification. IG FISMA findings are public, reported to Congress, and carry significant accountability weight. Negative IG findings embarrass agency leadership and drive congressional scrutiny. The IG is FISMA's primary auditor.</div>
    <div class="agency-card"><b>GAO — Government Accountability Office</b><br>The congressional watchdog that independently evaluates the effectiveness of federal agency programs including cybersecurity. GAO conducts deep-dive reviews of agency security practices, issues public reports on governmentwide weaknesses, and maintains the High-Risk List. Federal information security has been on GAO's High-Risk List since 1997 — reflecting the persistent, systemic nature of federal cybersecurity challenges.</div>
    <div class="agency-card"><b>Agency Heads, CIOs, CISOs, and SAOPs</b><br>Agency heads bear ultimate FISMA accountability. The Chief Information Officer (CIO) manages the agency's information security program. The Chief Information Security Officer (CISO) runs day-to-day security operations. The Senior Agency Official for Privacy (SAOP) — added by FISMA 2014 — oversees privacy requirements integrated into the security framework. These officials sign annual FISMA attestations and bear professional accountability for their agencies' security posture.</div>`,
    quiz: { q: "An agency CISO receives a CISA Binding Operational Directive (BOD) requiring all agencies to patch a specific critical vulnerability within 14 days. Must the agency comply?", opts: ["No — BODs are advisory guidance, not mandatory requirements", "Yes — CISA BODs are mandatory directives for federal civilian executive branch agencies. OMB has confirmed that BODs carry mandatory compliance obligations, and agencies that miss BOD deadlines face IG findings and OMB scrutiny.", "Only if OMB separately issues a memorandum confirming the requirement", "Only for agencies with more than 10,000 employees"], ans: 1, explain: "CISA Binding Operational Directives are mandatory for federal civilian executive branch agencies — the word 'binding' is deliberate. CISA has statutory authority to issue these directives, OMB has confirmed their mandatory nature, and IG FISMA evaluations assess whether agencies met BOD requirements within specified timeframes. Missing BOD deadlines — particularly for CISA's KEV catalog patching requirements — is a FISMA compliance finding that appears in IG reports and the annual FISMA congressional report." }
  },
  {
    title: "FISMA's Eight Core Requirements",
    tagline: "What the law actually mandates — the specific statutory obligations agencies must fulfill",
    body: `<p>FISMA creates specific legal requirements for federal agencies. Understanding these requirements in their actual statutory form — not just conceptually — is essential for FISMA compliance work. The law delegates significant implementation detail to OMB policy and NIST standards, but the core obligations are established directly in the statute.</p>
    <div class="req-card"><b>Requirement 1 — Periodic Risk Assessments</b><br>Agencies must conduct periodic assessments of risk to agency operations, assets, and individuals from operating information systems. Risk assessments must consider the probability and magnitude of harm, accounting for threats and vulnerabilities. This feeds directly into the NIST RMF's CATEGORIZE and SELECT steps and informs security investment prioritization.</div>
    <div class="req-card"><b>Requirement 2 — Policies, Procedures, and Practices</b><br>Agencies must develop, document, and implement agency-wide information security policies and procedures covering the security of all operations and assets. These must address risk management, security planning, security training, periodic testing, remediation of deficiencies, and incident response — forming the policy backbone of the entire security program.</div>
    <div class="req-card"><b>Requirement 3 — System Security Plans (SSPs)</b><br>Agencies must develop, maintain, and implement a security plan for each information system documenting the security controls in place or planned, along with rules of behavior for system access. The System Security Plan (SSP) is the primary document created to satisfy this requirement and is the foundation of every security authorization.</div>
    <div class="req-card"><b>Requirement 4 — Security Awareness Training</b><br>Agencies must provide security awareness training to all personnel with responsibilities for information systems, including contractors. Personnel with significant security responsibilities must receive specialized role-based training appropriate to their functions. Training must be ongoing — not one-time onboarding — and completion must be tracked and reported.</div>
    <div class="req-card"><b>Requirement 5 — Periodic Testing and Evaluation</b><br>Agencies must periodically test and evaluate the effectiveness of security policies, procedures, and practices. Testing must occur at least annually and must include testing of management, operational, and technical controls. Results must feed back into remediation planning and the continuous improvement of the security program.</div>
    <div class="req-card"><b>Requirement 6 — Plans of Action and Milestones (POA&Ms)</b><br>Agencies must develop and implement Plans of Action and Milestones for correcting deficiencies and reducing vulnerabilities. POA&Ms must be tracked, reported quarterly to OMB, and managed to closure. They are both a remediation tool and a management accountability mechanism — converting discovered weaknesses into tracked, managed commitments.</div>
    <div class="req-card"><b>Requirement 7 — Incident Response</b><br>Agencies must develop and implement procedures for detecting, reporting, and responding to security incidents. Agencies must report incidents to CISA/US-CERT within category-specific timeframes. FISMA 2014 added a specific requirement: agencies must notify Congress within 7 days of discovering a "major incident" — one with significant impact on national security, public health, or public confidence.</div>
    <div class="req-card"><b>Requirement 8 — Continuity of Operations</b><br>Agencies must develop and maintain plans for the continuity of operations in the event of information system disruption. Business continuity and disaster recovery planning are FISMA requirements — protecting the availability of federal information systems is as important as protecting their confidentiality and integrity under the CIA triad.</div>`,
    quiz: { q: "Under FISMA's incident response requirement, a federal agency discovers a breach affecting 3 million veterans' health records on a Monday. What must happen within 7 days?", opts: ["The agency has 30 days to notify affected veterans before congressional reporting is required", "The agency must notify Congress within 7 days — this is a 'major incident' given its significant impact on public confidence and the potential harm to millions of veterans. The agency must also report to CISA and begin breach response simultaneously.", "Congressional notification is not required — only OMB notification is mandatory", "The 7-day requirement only applies to national security incidents, not health record breaches"], ans: 1, explain: "FISMA 2014 added a specific congressional notification requirement: agencies must report 'major incidents' to Congress within 7 days of discovery. A breach affecting 3 million veterans' health records clearly qualifies — it has significant potential impact on public confidence in government and creates real harm risk for millions of citizens. Simultaneously, the agency must report to CISA/US-CERT per the standard incident reporting categories and timelines, and begin its incident response procedures. All three streams run concurrently." }
  },
  {
    title: "FIPS 199 — Categorizing Federal Information Systems",
    tagline: "The standard that determines how much protection every federal system needs",
    body: `<p>Before a federal agency can implement security controls for a system, it must first determine how much protection that system needs. This determination — called security categorization — is governed by <span class="key-term">FIPS 199</span>: Federal Information Processing Standard 199, "Standards for Security Categorization of Federal Information and Information Systems." Getting categorization right is foundational; getting it wrong cascades into either over-spending on protection that isn't needed or under-protecting data that deserves more.</p>
    <div class="highlight-box">FIPS 199 establishes three impact levels — Low, Moderate, and High — based on the potential adverse impact if the information's Confidentiality, Integrity, or Availability is compromised. Each of the three security objectives is evaluated independently for each information type the system handles. The system's overall categorization is determined by the highest individual rating across all three objectives — the "high watermark" principle.</div>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Low Impact</strong><span>Compromise would have a limited adverse effect on agency operations, assets, or individuals. Examples: public-facing websites, internal scheduling systems with no sensitive data, non-critical administrative applications. Implements the Low SP 800-53 baseline (~130 controls).</span></div>
      <div class="cheat-pill"><strong>Moderate Impact (Most Common)</strong><span>Compromise would have a serious adverse effect. The most common categorization — approximately 70-80% of federal systems. Examples: most general-purpose federal systems handling PII, benefits processing, financial operations. Implements the Moderate baseline (~340 controls).</span></div>
      <div class="cheat-pill"><strong>High Impact</strong><span>Compromise would have a severe or catastrophic adverse effect. Examples: systems supporting critical mission functions where failure could cause loss of life, systems with national security implications, critical financial infrastructure. Implements the comprehensive High baseline (~430 controls).</span></div>
    </div>
    <p>The three security objectives evaluated for each information type:</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Confidentiality</strong><span>What would happen if unauthorized parties accessed this information? Classified data: High. PII for millions of citizens: High or Moderate. Publicly available information: Low. Confidentiality failures can harm individuals through identity theft, discrimination, or national security damage.</span></div>
      <div class="cheat-pill"><strong>Integrity</strong><span>What would happen if information were modified or destroyed without authorization? Financial transaction systems: High (altered payments have direct consequences). Medical records: High (wrong data could cause wrong treatment). Integrity failures enable fraud, incorrect decisions, and unsafe actions.</span></div>
      <div class="cheat-pill"><strong>Availability</strong><span>What would happen if the system were unavailable when needed? Emergency response systems: High (downtime prevents life-saving action). Internal report systems: Low (downtime is inconvenient but not mission-threatening). Availability failures can prevent mission accomplishment and cause cascading operational failures.</span></div>
    </div>
    <div class="analogy-box"><strong>FIPS 199 at the VA:</strong> A VA electronic health records system handles veterans' mental health records (High confidentiality), clinical treatment data (High integrity — wrong information could harm patients), and supports active clinical operations (High availability — clinical decisions require record access). All three objectives are High. Overall categorization: High. This drives selection of the comprehensive High control baseline from SP 800-53 — the most demanding set of security controls appropriate for systems where failures could directly harm veterans.</div>`,
    quiz: { q: "A federal HR system contains employee names, social security numbers, and salary data (Moderate confidentiality). The same system calculates payroll where errors have serious financial consequences (High integrity). It runs during business hours only and downtime overnight is merely inconvenient (Low availability). What is the system's overall FIPS 199 impact level?", opts: ["Moderate — the average of the three ratings", "High — the high watermark principle means the overall system impact level equals the highest individual rating across all three security objectives. One High rating (integrity) makes the entire system High.", "Low — availability determines overall impact for most systems", "Moderate-High — a hybrid rating between the two dominant values"], ans: 1, explain: "The FIPS 199 high watermark principle is unambiguous: the overall system impact level equals the highest individual rating across all three security objectives. This system has Confidentiality = Moderate, Integrity = High, Availability = Low. The highest is High, so the system is categorized High overall — requiring the High SP 800-53 control baseline despite having two lower ratings. This ensures protection is calibrated to the most sensitive aspect of the system, not the average." }
  },
  {
    title: "FIPS 200 and NIST SP 800-53 — The Security Control Foundation",
    tagline: "The standards that translate impact levels into specific security requirements",
    body: `<p>Once FIPS 199 categorization determines the impact level of a federal system, two additional standards translate that level into specific security requirements. <span class="key-term">FIPS 200</span> establishes the minimum security requirement categories that must be addressed. <span class="key-term">NIST SP 800-53</span> provides the specific controls that satisfy those requirements. Together, these documents form the technical heart of federal information security.</p>
    <div class="highlight-box"><strong>FIPS 200 — Minimum Security Requirements:</strong> Specifies minimum security requirements for federal information and information systems in 17 security-related areas corresponding to the control families in SP 800-53. FIPS 200 establishes the "what" — every area that must be addressed. SP 800-53 provides the "how" — the specific controls implementing those requirements at each impact level.</div>
    <div class="highlight-box"><strong>NIST SP 800-53 Rev 5 (2020) — The Master Control Catalog:</strong> Over 1,000 individual controls and control enhancements organized into 20 control families. Three pre-selected baselines (Low, Moderate, High) provide starting sets appropriate for each impact level. Organizations then tailor these baselines for their specific system. Rev 5 added two new families: PT (PII Processing and Transparency) integrating privacy throughout the catalog, and SR (Supply Chain Risk Management) addressing the SolarWinds-class threat of compromised supply chains.</div>
    <p>The 20 SP 800-53 Rev 5 control families:</p>
    <div class="badge-row">
      <span class="badge badge-slate">AC — Access Control</span>
      <span class="badge badge-slate">AT — Awareness and Training</span>
      <span class="badge badge-slate">AU — Audit and Accountability</span>
      <span class="badge badge-slate">CA — Assessment, Authorization, and Monitoring</span>
      <span class="badge badge-slate">CM — Configuration Management</span>
      <span class="badge badge-slate">CP — Contingency Planning</span>
      <span class="badge badge-slate">IA — Identification and Authentication</span>
      <span class="badge badge-slate">IR — Incident Response</span>
      <span class="badge badge-slate">MA — Maintenance</span>
      <span class="badge badge-slate">MP — Media Protection</span>
      <span class="badge badge-slate">PE — Physical and Environmental Protection</span>
      <span class="badge badge-slate">PL — Planning</span>
      <span class="badge badge-slate">PM — Program Management</span>
      <span class="badge badge-slate">PS — Personnel Security</span>
      <span class="badge badge-slate">PT — PII Processing and Transparency (new in Rev 5)</span>
      <span class="badge badge-slate">RA — Risk Assessment</span>
      <span class="badge badge-slate">SA — System and Services Acquisition</span>
      <span class="badge badge-slate">SC — System and Communications Protection</span>
      <span class="badge badge-slate">SI — System and Information Integrity</span>
      <span class="badge badge-slate">SR — Supply Chain Risk Management (new in Rev 5)</span>
    </div>
    <div class="analogy-box"><strong>The FISMA-FIPS-800-53 stack:</strong> FISMA is the building code requiring safe buildings. FIPS 200 is the list of building code categories (fire safety, electrical, structural, plumbing) that every building must address. SP 800-53 is the detailed building code specifications — exactly what fire suppression systems must do, how electrical wiring must be installed, what structural requirements must be met. Each layer gets more specific, from the law through the categories to the specific implementation requirements.</div>`,
    quiz: { q: "SP 800-53 Rev 5 added the SR (Supply Chain Risk Management) control family. What real-world cyber attack directly motivated adding this family?", opts: ["The OPM data breach of 2015, which exposed federal employee background investigations", "The SolarWinds attack of 2020, in which attackers compromised a trusted software update mechanism to gain persistent access to 18,000+ organizations including federal agencies — demonstrating that supply chain compromise could bypass all internal security controls", "The Colonial Pipeline ransomware attack, which disrupted fuel supplies", "The Equifax breach, which exposed 147 million consumer records"], ans: 1, explain: "The SolarWinds attack exemplified the supply chain threat that SR controls address. Attackers compromised SolarWinds' build environment and injected malicious code into legitimate software updates — meaning organizations with excellent internal security installed the malware themselves when updating trusted vendor software. SP 800-53 Rev 5's SR family directly addresses this class of attack by requiring organizations to manage risks from hardware, software, and service providers throughout their supply chains." }

  {
    title: "The NIST Risk Management Framework — FISMA's Implementation Process",
    tagline: "The seven-step process through which agencies fulfill their FISMA obligations system by system",
    body: `<p>FISMA is the law that creates the security obligation. The <span class="key-term">NIST Risk Management Framework (RMF)</span> — documented in NIST SP 800-37 Revision 2 (2018) — is the process through which agencies fulfill that obligation system by system. Understanding the FISMA-RMF relationship is fundamental: FISMA says what agencies must do; the RMF provides the disciplined process for demonstrating they've done it.</p>
    <div class="highlight-box">The seven RMF steps and their FISMA connections:<br><br><strong>Step 1 — PREPARE:</strong> Establish organizational and system-level security context and roles. Satisfies FISMA's requirements for risk management strategy, security program establishment, and organizational accountability.<br><br><strong>Step 2 — CATEGORIZE:</strong> Apply FIPS 199 to classify information and systems by impact level. Directly fulfills FISMA's risk assessment mandate.<br><br><strong>Step 3 — SELECT:</strong> Choose the appropriate SP 800-53 control baseline and tailor it. Satisfies FISMA's requirement for policies and procedures covering all security domains.<br><br><strong>Step 4 — IMPLEMENT:</strong> Deploy security controls and document implementation in the System Security Plan (SSP). Directly fulfills FISMA's system security planning requirement.<br><br><strong>Step 5 — ASSESS:</strong> Independently evaluate whether controls are implemented correctly and producing desired outcomes. Satisfies FISMA's periodic testing and evaluation requirement.<br><br><strong>Step 6 — AUTHORIZE:</strong> The Authorizing Official issues an Authorization to Operate (ATO) — the formal risk acceptance decision. No ATO means FISMA violation; an expired ATO is a FISMA violation.<br><br><strong>Step 7 — MONITOR:</strong> Continuously track security controls, respond to changes, and maintain the authorization's validity. Fulfills FISMA 2014's core continuous monitoring requirement.</div>
    <div class="analogy-box"><strong>FISMA vs. RMF — law vs. process:</strong> FISMA is like the food safety law requiring restaurants to maintain safe, sanitary conditions. The RMF is like the health department's inspection protocol — the specific, documented process through which compliance is demonstrated. The law creates the obligation; the process creates the evidence. A restaurant that maintains good food safety practices but doesn't follow the inspection protocol can't prove compliance. Federal agencies that have good security practices but don't follow RMF can't demonstrate FISMA compliance to IGs and OMB.</div>`,
    quiz: { q: "An agency CISO says: 'We're FISMA compliant — we've completed the full RMF process for all our systems.' Is this an accurate statement of complete FISMA compliance?", opts: ["Yes — completing the RMF for all systems means complete FISMA compliance", "Partially — RMF completion is the primary system-level demonstration of FISMA compliance, but FISMA also requires ongoing security awareness training for all personnel, active incident response capability with CISA reporting, quarterly POA&M management, and continuous monitoring programs that extend beyond any single system's RMF cycle.", "No — FISMA and RMF are separate requirements with no relationship", "Only for civilian agencies — DoD uses entirely different compliance criteria"], ans: 1, explain: "Completing the RMF for all systems is the primary but not the complete picture of FISMA compliance. FISMA also requires: ongoing security awareness training for every employee annually, active incident response capability with specific CISA reporting timelines, quarterly POA&M reporting to OMB, continuous monitoring programs beyond individual system ATO maintenance, and the overall agency information security program infrastructure. A system with a current ATO is FISMA-compliant for that system; the agency's overall FISMA compliance requires all these additional program elements working together." }
  },
  {
    title: "The Authorization to Operate (ATO) — FISMA's Core Accountability Mechanism",
    tagline: "Why every federal system needs a senior official to formally accept its risk",
    body: `<p>The <span class="key-term">Authorization to Operate (ATO)</span> is the centerpiece of FISMA compliance at the system level. Before any federal information system can begin operations — or continue operations — a senior federal official must formally accept the residual security risk of that system. This formal risk acceptance, documented in an ATO, is FISMA's mechanism for ensuring that accountable senior leaders, not just technical staff, are responsible for the security posture of federal systems.</p>
    <div class="highlight-box"><strong>What an ATO actually means:</strong> An ATO is not a security certification or a statement that a system is perfectly secure. It is a documented decision by an Authorizing Official (AO) — a senior government executive — stating: "I have reviewed the security assessment of this system. I understand the identified risks and the security controls in place. I formally accept that this system can operate at an acceptable level of risk." The ATO acknowledges residual risk exists and documents that a responsible official has accepted it. Without an ATO, no system should operate — that is FISMA's rule. Operating without one is a FISMA violation.</highlight-box>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>The Authorization Package</strong><span>The three-document package the AO reviews: the System Security Plan (SSP, describing what the system does and how controls are implemented), the Security Assessment Report (SAR, from the independent assessor showing which controls are working), and the Plan of Action and Milestones (POA&M, documenting known deficiencies and remediation plans).</span></div>
      <div class="cheat-pill"><strong>Full ATO</strong><span>The AO determines risk is acceptable and issues a full ATO, typically valid for up to three years. Any significant change that materially alters security posture may require reauthorization before expiration. The ATO includes the AO's name, date, and validity period — making risk acceptance both formal and personally attributed.</span></div>
      <div class="cheat-pill"><strong>ATO with Conditions</strong><span>The AO authorizes operation but with specific conditions — closing specific POA&Ms within defined timeframes, implementing additional controls. Failure to meet conditions can result in the ATO being revoked. Used when the risk is marginally acceptable with near-term remediation commitments that reduce residual risk to truly acceptable levels.</span></div>
      <div class="cheat-pill"><strong>Denial of ATO (DATO)</strong><span>The AO determines the risk is unacceptable and refuses to authorize the system. The system cannot operate until sufficient remediation makes the risk acceptable for resubmission. DATOs are rare — they can delay mission-critical systems — but they serve an important accountability function when security posture is genuinely inadequate.</span></div>
      <div class="cheat-pill"><strong>Ongoing Authorization</strong><span>SP 800-37 Rev 2 introduced ongoing authorization — the AO's decision is continuously supported by monitoring data rather than requiring periodic full reassessment. Risk-conscious agencies use real-time dashboards giving AOs continuous visibility into authorized systems' current security posture.</span></div>
      <div class="cheat-pill"><strong>ATO Expiration</strong><span>Operating a system after ATO expiration without renewal is a direct FISMA violation found in every IG evaluation. Agencies must track ATO expiration dates and begin reauthorization well in advance. ATO lapses are one of the most consistently cited FISMA compliance failures across agencies and years.</span></div>
    </div>`,
    quiz: { q: "A federal system's ATO expired six months ago. The ISSO discovers this during a routine records review and finds the system has been continuously operating during those six months. What is the compliance situation?", opts: ["Not a problem if continuous monitoring showed no security incidents during those six months", "A serious FISMA compliance failure — the system has operated for six months without an AO's formal risk acceptance, violating the core FISMA authorization requirement. This will appear prominently in the IG evaluation. The agency must immediately either obtain an emergency reauthorization or shut down the system.", "The ATO can be retroactively renewed to cover the lapsed period", "Acceptable as a temporary gap if the system is in the reauthorization process"], ans: 1, explain: "Operating a system without a current ATO is a direct FISMA violation regardless of whether security incidents occurred during the lapse. The ATO is the formal risk acceptance mechanism — without it, the system is operating without senior official approval of its security posture. Six months of unauthorized operation will appear as a significant IG finding. The agency cannot retroactively authorize past operations — they can only authorize future operations. This requires immediate escalation, emergency reauthorization if appropriate, and documentation of the process failure." }
