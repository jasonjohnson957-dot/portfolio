  {
    title: "Design Factors — Tailoring COBIT to Your Organization",
    tagline: "Why COBIT looks different for a startup vs. a hospital",
    body: `<p>One of COBIT 2019's most important improvements over previous versions is its emphasis on <span class="key-term">Design Factors</span>. These are the characteristics of your specific organization that determine how COBIT should be applied — because COBIT is not one-size-fits-all.</p>
    <p>COBIT 2019 defines <strong>11 Design Factors</strong> that influence how you prioritize and implement its governance system:</p>
    <div class="badge-row">
      <span class="badge badge-amber">Enterprise strategy</span>
      <span class="badge badge-amber">Enterprise goals</span>
      <span class="badge badge-amber">Risk profile</span>
      <span class="badge badge-amber">I&T-related issues</span>
      <span class="badge badge-amber">Threat landscape</span>
      <span class="badge badge-amber">Compliance requirements</span>
      <span class="badge badge-amber">Role of IT (support vs. strategic)</span>
      <span class="badge badge-amber">Sourcing model (in-house vs. outsourced)</span>
      <span class="badge badge-amber">IT implementation methods (agile, waterfall, etc.)</span>
      <span class="badge badge-amber">Technology adoption strategy (early adopter vs. follower)</span>
      <span class="badge badge-amber">Enterprise size (large vs. small/medium)</span>
    </div>
    <div class="analogy-box"><strong>Design Factor analogy:</strong> Imagine two restaurants: a fast food chain and a Michelin-star fine dining establishment. Both need food safety practices, staff management, and financial controls. But the specific processes, staffing levels, and standards are completely different. A burger chain and a 5-star restaurant don't run the same kitchen. Design Factors let COBIT reflect your organization's specific reality.</div>
    <div class="highlight-box">A small startup will prioritize very different COBIT processes than a large bank subject to heavy regulation. A hospital where system downtime could cost lives needs much stronger continuity planning than a marketing agency. Design Factors ensure your COBIT implementation is realistic and proportionate to what your organization actually faces.</div>`,
    quiz: { q: "Why are COBIT 2019 Design Factors important?", opts: ["They determine how much COBIT costs to implement", "They allow organizations to tailor COBIT to their specific context rather than applying it identically to every organization", "They rank COBIT objectives by difficulty", "They are only relevant to large enterprises"], ans: 1, explain: "Design Factors allow organizations to tailor COBIT to their specific context — their size, industry, risk profile, regulatory environment, and IT strategy. This prevents the mistake of applying COBIT identically to organizations with very different needs." }
  },
  {
    title: "Focus Areas — Pre-Packaged COBIT Guidance",
    tagline: "Ready-made packages for common governance challenges",
    body: `<p>COBIT 2019 introduced <span class="key-term">Focus Areas</span> — specialized guidance packages that address specific, common governance challenges. Think of Focus Areas as pre-configured COBIT implementations for particular topics or industries.</p>
    <p>Focus Areas provide targeted guidance for topics including:</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Information Security</strong><span>COBIT guidance specifically for organizations building or improving their cybersecurity and information security programs.</span></div>
      <div class="cheat-pill"><strong>DevOps</strong><span>How COBIT applies to organizations using modern software development practices that combine development and operations teams.</span></div>
      <div class="cheat-pill"><strong>Small and Medium Enterprises (SMEs)</strong><span>A scaled-down COBIT implementation for organizations that don't have a large IT department or governance team.</span></div>
      <div class="cheat-pill"><strong>Cloud Computing</strong><span>Governance guidance for organizations migrating to or operating significantly in cloud environments.</span></div>
      <div class="cheat-pill"><strong>Cybersecurity</strong><span>Detailed COBIT guidance for implementing a comprehensive cybersecurity program aligned with major security frameworks.</span></div>
      <div class="cheat-pill"><strong>Digital Transformation</strong><span>How COBIT supports organizations fundamentally changing their business model through technology.</span></div>
    </div>
    <div class="analogy-box"><strong>Focus Area analogy:</strong> Think of Focus Areas like specialty instruction books that come with a new appliance. The full COBIT framework is the complete technical manual for the entire product line. A Focus Area is the quick-start guide for a specific feature. If your immediate challenge is cybersecurity, you don't have to read everything — start with the cybersecurity Focus Area.</div>
    <div class="highlight-box">Focus Areas are published separately from the main COBIT 2019 framework and are continuously updated as new topics become relevant. This keeps COBIT current without requiring a complete framework redesign every few years.</div>`,
    quiz: { q: "A small business with 50 employees wants to implement COBIT but doesn't have a large IT team. Which Focus Area is most relevant?", opts: ["DevOps", "Cloud Computing", "Small and Medium Enterprises (SMEs)", "Digital Transformation"], ans: 2, explain: "The SME Focus Area provides scaled-down COBIT guidance specifically for smaller organizations that don't have the resources or complexity to implement the full framework. It makes COBIT practical and proportionate for smaller enterprises." }
  },
  {
    title: "The 7 Components of a Governance System",
    tagline: "It takes more than processes to make governance work",
    body: `<p>A common misconception about COBIT is that it's just a collection of processes. In reality, COBIT 2019 recognizes that effective governance requires <span class="key-term">7 types of components</span> working together as a system. Processes alone are never enough.</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>1. Processes</strong><span>Structured sets of activities that transform inputs into outputs to achieve governance or management objectives.</span></div>
      <div class="cheat-pill"><strong>2. Organizational Structures</strong><span>The decision-making bodies — IT steering committees, risk committees, audit committees, the CIO role.</span></div>
      <div class="cheat-pill"><strong>3. Principles, Policies, and Frameworks</strong><span>The written rules that channel behavior — IT policies, security standards, acceptable use policies.</span></div>
      <div class="cheat-pill"><strong>4. Information</strong><span>The data and information flows needed to make governance decisions — performance reports, risk assessments, audit findings.</span></div>
      <div class="cheat-pill"><strong>5. Culture, Ethics, and Behavior</strong><span>The informal norms and values that shape how people actually behave — the real governance beyond the written policies.</span></div>
      <div class="cheat-pill"><strong>6. People, Skills, and Competencies</strong><span>The human capabilities needed to execute governance and management — not just technical skills, but governance and leadership skills.</span></div>
      <div class="cheat-pill"><strong>7. Services, Infrastructure, and Applications</strong><span>The technology tools that enable and support governance — GRC platforms, monitoring tools, audit management systems.</span></div>
    </div>
    <div class="analogy-box"><strong>Why 7 components?</strong> Imagine trying to make a sports team great by only working on plays (processes). Without talented players (people/skills), team culture (culture/ethics), a good coach structure (organizational structures), game film analysis (information), team rules (policies), and proper equipment (services/infrastructure) — the best plays in the world won't win games. Governance is the same.</div>`,
    quiz: { q: "An organization has excellent COBIT processes documented, but employees routinely ignore the policies because 'that's not how things are done here.' Which governance component is failing?", opts: ["Processes", "Organizational Structures", "Culture, Ethics, and Behavior", "Services, Infrastructure, and Applications"], ans: 2, explain: "Culture, Ethics, and Behavior is the governance component that covers informal norms and actual behavior. Having great written processes and policies means nothing if organizational culture encourages people to ignore them. Culture often trumps process." }
  },
  {
    title: "Processes — The Core of COBIT in Practice",
    tagline: "What processes actually look like inside COBIT",
    body: `<p>Every one of COBIT's 40 governance and management objectives is described as a <span class="key-term">process</span> — a structured set of activities that transforms inputs into outputs. Each COBIT process has a standard structure.</p>
    <p>Every COBIT process includes:</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Process Description</strong><span>A plain-language explanation of what the process does and why it matters.</span></div>
      <div class="cheat-pill"><strong>Process Purpose Statement</strong><span>The specific outcome the process is designed to achieve when working well.</span></div>
      <div class="cheat-pill"><strong>Process Goals</strong><span>Measurable targets that define success — metrics that can be tracked.</span></div>
      <div class="cheat-pill"><strong>Activities</strong><span>The specific tasks that make up the process — what people actually do.</span></div>
      <div class="cheat-pill"><strong>RACI Chart</strong><span>Who is Responsible, Accountable, Consulted, and Informed for each activity.</span></div>
      <div class="cheat-pill"><strong>Inputs and Outputs</strong><span>What information flows into the process and what it produces for other processes to use.</span></div>
    </div>
    <div class="analogy-box"><strong>RACI Chart analogy:</strong> Every school project has roles: someone who does the work (Responsible), a teacher who grades it and is on the hook for the outcome (Accountable), classmates who give input (Consulted), and parents who know it's happening (Informed). RACI charts assign these roles to every governance activity — so nobody can say "I didn't know that was my job."</div>
    <div class="highlight-box"><strong>The RACI principle:</strong> Every governance activity must have exactly ONE person who is Accountable — the person who will be held responsible if it fails. Multiple people can be Responsible (doing the work), but split accountability means no accountability. This is a critical governance principle.</div>`,
    quiz: { q: "In a COBIT RACI chart, what is the difference between 'Responsible' and 'Accountable'?", opts: ["They are the same thing", "Responsible means doing the work; Accountable means owning the outcome — and there must be exactly one Accountable per activity", "Responsible is for senior staff; Accountable is for junior staff", "Accountable means being consulted; Responsible means being informed"], ans: 1, explain: "Responsible = the person(s) doing the work. Accountable = the single person who owns the outcome and is 'on the hook' if it fails. Having exactly one Accountable prevents the 'everyone's responsible, nobody's responsible' problem." }
  },
  {
    title: "Capability Levels — How Mature Is Your Process?",
    tagline: "Measuring how well an organization's IT processes actually perform",
    body: `<p>COBIT 2019 uses a <span class="key-term">capability level</span> system to measure how well an organization's governance and management processes are actually performing. Not all organizations implement every process at the same depth — and that's fine, as long as it's intentional.</p>
    <p>COBIT 2019 defines <strong>5 capability levels</strong> based on the CMMI (Capability Maturity Model Integration) framework:</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Level 0 — Incomplete</strong><span>The process doesn't exist or fails to achieve its purpose. No consistent practice. Problems are common and unaddressed.</span></div>
      <div class="cheat-pill"><strong>Level 1 — Initial (Performed)</strong><span>The process works sometimes, but it's ad hoc and unpredictable — dependent on individual heroes rather than defined procedures.</span></div>
      <div class="cheat-pill"><strong>Level 2 — Managed</strong><span>The process is planned, monitored, and adjusted. It produces consistent results, but mainly in one team or area.</span></div>
      <div class="cheat-pill"><strong>Level 3 — Defined</strong><span>A standard process exists across the whole organization. Everyone follows the same approach. Results are consistent company-wide.</span></div>
      <div class="cheat-pill"><strong>Level 4 — Quantitatively Managed</strong><span>The process is measured with data and statistics. Leaders use numbers — not gut feelings — to manage and improve it.</span></div>
      <div class="cheat-pill"><strong>Level 5 — Optimizing</strong><span>The process continuously improves itself, learning from data and feedback. Best-in-class organizations operate here for critical processes.</span></div>
    </div>
    <div class="analogy-box"><strong>Student analogy:</strong> Level 0 = doesn't study at all. Level 1 = studies sometimes when scared of failing. Level 2 = has a study schedule that mostly works. Level 3 = follows a consistent, proven study system. Level 4 = tracks study hours and test scores to optimize the method. Level 5 = continuously refines the approach based on what the data says works best.</div>`,
    quiz: { q: "A company's cybersecurity patching process works when dedicated staff remember to do it, but there's no documented procedure and results vary. What capability level is this?", opts: ["Level 0 — Incomplete", "Level 1 — Initial", "Level 3 — Defined", "Level 5 — Optimizing"], ans: 1, explain: "Level 1 (Initial/Performed) describes processes that work sometimes but are ad hoc and hero-dependent — no consistent documentation, unpredictable results. The process works when the right person remembers to do it, not because there's a reliable system." }
  },
  {
    title: "Performance Management — Measuring What Matters",
    tagline: "If you can't measure it, you can't manage it",
    body: `<p>COBIT 2019 has a robust <span class="key-term">performance management system</span> built around the idea that what gets measured gets managed. Every governance and management objective has associated metrics to track whether it's working.</p>
    <div class="highlight-box">COBIT uses two types of metrics:<br><br><strong>Goal Metrics</strong> (also called lag indicators or KGIs — Key Goal Indicators): Measure the outcome — did we achieve what we set out to achieve? Example: "Percentage of IT projects delivered on time and on budget."<br><br><strong>Practice Metrics</strong> (also called lead indicators or KPIs — Key Performance Indicators): Measure how well the process is performing day-to-day. Example: "Average time to resolve a critical IT incident."</div>
    <div class="analogy-box"><strong>KGI vs. KPI analogy:</strong> Imagine you're trying to lose weight. The goal metric (KGI) is your actual weight — did it go down? The performance metric (KPI) is how many days you exercised and how many calories you consumed. The KPI tells you how the process is running; the KGI tells you whether it's working. You need both.</div>
    <p>COBIT also introduces <span class="key-term">Balanced Scorecard</span> thinking into IT governance. Rather than measuring only technical metrics (server uptime, patch rates), COBIT encourages organizations to also measure business value delivered, risk managed, customer satisfaction, and people development — a balanced view of IT performance.</p>
    <div class="info-box"><strong>Common COBIT metrics in practice:</strong> Percentage of IT projects aligned to business goals. Number of security incidents per month. IT cost as a percentage of revenue. Time to recover from a major outage (Recovery Time Objective). User satisfaction scores with IT services.</div>`,
    quiz: { q: "A company tracks 'number of critical security patches applied within 48 hours of release.' This is an example of which type of COBIT metric?", opts: ["A Goal Metric (KGI) — it measures the outcome", "A Practice Metric (KPI) — it measures day-to-day process performance", "A Design Factor — it shapes governance design", "A Capability Level — it measures process maturity"], ans: 1, explain: "This is a Practice Metric (KPI — Key Performance Indicator). It measures how well the patching process is performing day-to-day. A Goal Metric (KGI) would measure the outcome — like 'number of security breaches attributable to unpatched vulnerabilities.'" }
  },
  {
    title: "Organizational Structures — Who Makes IT Decisions?",
    tagline: "The committees, roles, and bodies that govern IT",
    body: `<p>Governance doesn't happen by accident — it happens through <span class="key-term">organizational structures</span>. These are the formal groups, roles, and decision-making bodies that COBIT identifies as essential for IT governance to function.</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Board of Directors</strong><span>Sets overall risk appetite and approves IT governance framework. Accountable for the organization's use of technology.</span></div>
      <div class="cheat-pill"><strong>Executive Committee</strong><span>Senior leadership team that makes major IT investment and strategy decisions.</span></div>
      <div class="cheat-pill"><strong>IT Strategy Committee</strong><span>Board-level committee that advises on IT strategic direction and major IT matters.</span></div>
      <div class="cheat-pill"><strong>IT Steering Committee</strong><span>Senior management-level committee overseeing IT projects, priorities, and performance.</span></div>
      <div class="cheat-pill"><strong>Chief Information Officer (CIO)</strong><span>Senior executive accountable for IT strategy and IT management performance.</span></div>
      <div class="cheat-pill"><strong>Chief Information Security Officer (CISO)</strong><span>Senior executive accountable for information security strategy and program.</span></div>
      <div class="cheat-pill"><strong>Risk Committee</strong><span>Oversees the organization's overall risk management, including IT and cybersecurity risk.</span></div>
      <div class="cheat-pill"><strong>Audit Committee</strong><span>Board-level oversight of internal and external audit, including IT audit findings.</span></div>
    </div>
    <div class="analogy-box"><strong>Why so many committees?</strong> Different decisions require different perspectives and different levels of authority. A decision about patching a server (operational) doesn't need the Board. A decision about spending $50 million on a new ERP system (strategic) absolutely does. COBIT maps specific decisions to the right organizational level — preventing both micromanagement and governance gaps.</div>`,
    quiz: { q: "The CIO presents a proposal to spend $20 million on a new AI platform to a committee of senior executives who prioritize IT projects and budgets. This committee is most likely the:", opts: ["Board of Directors", "IT Strategy Committee", "IT Steering Committee", "Audit Committee"], ans: 2, explain: "The IT Steering Committee is a senior management-level committee that oversees IT projects, priorities, resource allocation, and performance. It's the right forum for prioritizing a major IT investment proposal." }
  },
  {
    title: "Policies, Standards, and Procedures",
    tagline: "The written rules that channel behavior across the organization",
    body: `<p>COBIT recognizes that governance requires clear <span class="key-term">principles, policies, and frameworks</span> — the written rules that define acceptable behavior and required practices across the organization. Without written rules, governance is just suggestions.</p>
    <p>COBIT distinguishes between three levels of written guidance:</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Principles</strong><span>High-level statements of belief and values that guide decision-making. Example: "All IT decisions must consider security by default." Set by senior leadership.</span></div>
      <div class="cheat-pill"><strong>Policies</strong><span>Mandatory rules that everyone must follow. Example: "All employees must use multi-factor authentication to access company systems." Approved by management.</span></div>
      <div class="cheat-pill"><strong>Standards</strong><span>Technical or procedural specifications that define HOW policies are implemented. Example: "Multi-factor authentication must use TOTP or hardware tokens — not SMS." Written by IT/security teams.</span></div>
      <div class="cheat-pill"><strong>Procedures</strong><span>Step-by-step instructions for carrying out a standard. Example: "How to enroll a new employee in the MFA system." Written by operational teams.</span></div>
    </div>
    <div class="analogy-box"><strong>School analogy:</strong> Principle: "Students will be treated with respect." Policy: "Bullying is prohibited." Standard: "Bullying includes verbal, physical, and cyberbullying." Procedure: "When a bullying incident is reported, the teacher completes Form B-7 within 24 hours and notifies the principal." Each level is more specific and operational than the one above it.</div>
    <div class="highlight-box">A common governance failure is having policies that nobody reads, standards that are outdated, and procedures that don't match what people actually do. COBIT's governance system requires that policies be reviewed regularly, communicated effectively, and enforced consistently — not just written and filed away.</div>`,
    quiz: { q: "A company has a rule that says 'No employee may install unauthorized software on a company device.' What type of written governance document is this?", opts: ["A Principle — it guides decision-making at a high level", "A Policy — it is a mandatory rule everyone must follow", "A Standard — it specifies technical requirements", "A Procedure — it provides step-by-step instructions"], ans: 1, explain: "This is a Policy — a mandatory rule that all employees must follow. A Standard would specify what 'authorized software' means technically. A Procedure would describe how to request software approval. A Principle would be the higher-level belief like 'We protect company assets.'" }
  },
  {
    title: "Culture, Ethics, and Behavior",
    tagline: "The invisible governance force that overrides everything else",
    body: `<p>Of all COBIT's 7 governance components, <span class="key-term">culture, ethics, and behavior</span> is the most underestimated — and often the most powerful. Culture is the informal set of values, norms, and behaviors that define "how things are actually done here," regardless of what the policies say.</p>
    <div class="highlight-box"><strong>The culture paradox in governance:</strong> An organization can have perfect processes, excellent policies, state-of-the-art technology, and skilled people — and still have terrible governance if the culture doesn't support it. Culture is what people do when nobody is watching.</div>
    <div class="analogy-box"><strong>A real example:</strong> A large bank had excellent written security policies forbidding employees from sharing passwords. But because the culture rewarded "getting things done fast" above all else, employees routinely shared passwords to avoid approval delays. The written policy was perfect; the culture made it meaningless. The result was a major data breach.</div>
    <p>COBIT identifies specific cultural behaviors that good governance requires:</p>
    <div class="badge-row">
      <span class="badge badge-amber">Leaders model the governance behaviors they expect from others</span>
      <span class="badge badge-amber">Raising concerns about governance failures is encouraged, not punished</span>
      <span class="badge badge-amber">Risk awareness is part of everyday decision-making</span>
      <span class="badge badge-amber">Accountability for outcomes — not just activities — is the norm</span>
      <span class="badge badge-amber">Continuous improvement is expected, not optional</span>
    </div>
    <p>Changing culture is one of the hardest governance challenges. COBIT acknowledges this and recommends starting from the top: if executives don't follow governance processes, nobody else will. Leadership behavior is the single most powerful shaper of organizational culture.</p>`,
    quiz: { q: "Despite having a written policy against it, employees at a company routinely bypass security procedures because their manager says 'just get it done.' What governance component is primarily failing?", opts: ["Processes", "Services, Infrastructure, and Applications", "Culture, Ethics, and Behavior", "Information flows"], ans: 2, explain: "Culture, Ethics, and Behavior is failing. When management models behavior that contradicts written policies, culture overrides process. Effective governance requires that leaders demonstrate the behaviors the governance system demands." }
  },
  {
    title: "Information Flows — The Lifeblood of Governance",
    tagline: "Decision-makers can only govern what they can see",
    body: `<p>Governance decisions are only as good as the information that informs them. COBIT recognizes <span class="key-term">information flows</span> as a critical governance component — because a board or executive team that doesn't have accurate, timely information about IT performance cannot make good governance decisions.</p>
    <div class="highlight-box">Every COBIT process has defined <strong>inputs</strong> (information it needs to function) and <strong>outputs</strong> (information it produces for other processes to use). These inputs and outputs create a network of information flows across the entire governance system.</div>
    <p>Key types of governance information flows include:</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Performance Dashboards</strong><span>Regular reports showing how IT is performing against targets — given to the IT Steering Committee and board.</span></div>
      <div class="cheat-pill"><strong>Risk Reports</strong><span>Updates on IT risks — new threats identified, incidents occurred, risk mitigation progress.</span></div>
      <div class="cheat-pill"><strong>Audit Findings</strong><span>Results of internal and external audits — what's working well and what needs improvement.</span></div>
      <div class="cheat-pill"><strong>Project Status Reports</strong><span>Updates on IT project progress, budget consumption, and issue escalation.</span></div>
      <div class="cheat-pill"><strong>Compliance Reports</strong><span>Evidence that applicable laws and regulations are being followed.</span></div>
      <div class="cheat-pill"><strong>Incident Reports</strong><span>Details of security incidents, outages, and near-misses — feeding into risk management.</span></div>
    </div>
    <div class="analogy-box"><strong>Information flow analogy:</strong> Imagine a pilot flying a plane without any instruments — no altitude gauge, no speed indicator, no fuel level. They might be a brilliant pilot, but without information, they're flying blind. Governance without information flows is the same: leaders making decisions without knowing what's actually happening.</div>`,
    quiz: { q: "A company's board receives an IT risk report showing a critical vulnerability has been open for 6 months. This report is an example of which governance component?", opts: ["An organizational structure", "A policy", "An information flow", "A capability level"], ans: 2, explain: "The risk report is an information flow — it carries information from the operational level to the governance level, enabling the board to make informed decisions. Without this flow, the board would be governing without visibility into what's actually happening." }
  },
  {
    title: "People, Skills, and Competencies",
    tagline: "Governance is ultimately a human activity",
    body: `<p>No matter how well-designed the processes, policies, and structures are — governance ultimately depends on <span class="key-term">people, skills, and competencies</span>. COBIT explicitly recognizes that the right human capabilities are essential to making any governance system work.</p>
    <p>COBIT identifies three categories of skills needed for IT governance:</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Technical Skills</strong><span>The IT-specific knowledge: programming, cybersecurity, network management, cloud architecture, data analytics. The "hard" skills.</span></div>
      <div class="cheat-pill"><strong>Business Skills</strong><span>Understanding how the business works: finance, project management, strategy, risk management, communication. Connecting IT to business value.</span></div>
      <div class="cheat-pill"><strong>Governance Skills</strong><span>Understanding governance itself: audit, compliance, policy development, board dynamics, accountability frameworks. The "soft" governance skills.</span></div>
    </div>
    <div class="analogy-box"><strong>The T-shaped professional:</strong> The best IT governance professionals are "T-shaped" — deep expertise in one area (the vertical bar of the T) combined with broad knowledge across multiple areas (the horizontal bar). A cybersecurity expert who also understands business risk, regulatory requirements, and board communication is far more effective than a pure technical specialist.</div>
    <div class="highlight-box"><strong>The COBIT skills gap problem:</strong> One of the biggest challenges in IT governance today is that technical IT staff often lack business and governance skills — and business leaders often lack sufficient IT knowledge to govern effectively. COBIT recommends training, hiring, and professional development plans that specifically address these gaps. Certifications like CISA, CRISC, and CGEIT from ISACA are directly aligned to COBIT's skills framework.</div>
    <p>COBIT processes include RACI charts that identify what skills are needed at each role level — from board members to entry-level staff.</p>`,
    quiz: { q: "A CISO is technically brilliant at cybersecurity but struggles to communicate risks to the board in business terms. Which COBIT skills category does this gap fall in?", opts: ["Technical Skills", "Business Skills", "Governance Skills", "Both Business and Governance Skills"], ans: 3, explain: "Both Business Skills (understanding how to frame issues in financial/business impact terms) and Governance Skills (understanding how to communicate with boards and governance bodies) are the gaps here. The CISO has strong technical skills but needs development in the other two categories." }
  },
  {
    title: "COBIT and Risk Management",
    tagline: "Risk is at the center of everything COBIT does",
    body: `<p>Risk management isn't just one part of COBIT — it runs through the entire framework. COBIT treats <span class="key-term">IT-related risk</span> as central to governance, dedicating processes in multiple domains to its identification, assessment, and management.</p>
    <p>COBIT's approach to risk management covers three categories:</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>IT Benefit/Value Enablement Risk</strong><span>Risk that IT won't deliver the business value expected — failed projects, poor ROI, misaligned technology investments.</span></div>
      <div class="cheat-pill"><strong>IT Program and Project Delivery Risk</strong><span>Risk that IT projects will fail — over budget, behind schedule, wrong requirements, poor quality.</span></div>
      <div class="cheat-pill"><strong>IT Operations and Service Delivery Risk</strong><span>Risk that IT systems will fail or be compromised — outages, cyberattacks, data breaches, performance problems.</span></div>
    </div>
    <div class="analogy-box"><strong>Risk appetite analogy:</strong> Different people have different risk tolerances. Some people invest their savings in volatile stocks; others keep everything in cash. COBIT requires organizations to define their IT risk appetite — how much technology risk is acceptable in pursuit of business goals. A startup might accept high technical risk for fast growth; a hospital must accept very low operational risk because downtime can cost lives.</div>
    <div class="highlight-box">Key COBIT processes for risk management include: <strong>EDM03</strong> (Ensure Risk Optimization — governance level), <strong>APO12</strong> (Managed Risk — strategic level), and <strong>APO13</strong> (Managed Security — operational security risk). Together these create a complete risk management lifecycle from board oversight down to daily security operations.</div>
    <p>Risk is also connected to the concept of <strong>residual risk</strong> — the risk that remains after controls are applied. COBIT requires that residual risk be acknowledged and accepted by appropriate governance bodies, not hidden or ignored.</p>`,
    quiz: { q: "A hospital's IT system goes offline during surgery because of a ransomware attack. Which type of COBIT IT risk does this represent?", opts: ["IT Benefit/Value Enablement Risk", "IT Program and Project Delivery Risk", "IT Operations and Service Delivery Risk", "Compliance Risk"], ans: 2, explain: "This is IT Operations and Service Delivery Risk — the risk that IT systems will fail or be compromised during normal operations. Ransomware causing operational downtime is a classic operations and service delivery risk event." }
  },
  {
    title: "COBIT and Compliance",
    tagline: "How COBIT connects to GDPR, SOX, ISO 27001, and beyond",
    body: `<p>One of the most practical applications of COBIT is helping organizations manage <span class="key-term">regulatory compliance</span>. Because COBIT is a comprehensive IT governance framework, it creates the controls and documentation that regulators look for when assessing whether an organization is managing its IT responsibly.</p>
    <div class="highlight-box">COBIT is not a compliance standard itself — it's a governance framework that <em>enables</em> compliance with many different standards and regulations. Think of COBIT as the foundation: build a strong COBIT implementation, and compliance with multiple external requirements becomes much easier.</div>
    <p>Key frameworks and regulations that align with COBIT:</p>
    <div class="badge-row">
      <span class="badge badge-amber">SOX (Sarbanes-Oxley) — Financial controls over IT systems</span>
      <span class="badge badge-amber">GDPR — Data protection and privacy controls</span>
      <span class="badge badge-amber">ISO 27001 — Information security management systems</span>
      <span class="badge badge-amber">NIST Cybersecurity Framework — US cybersecurity guidance</span>
      <span class="badge badge-amber">ISO 38500 — IT governance standard for boards</span>
      <span class="badge badge-amber">ITIL — IT service management best practices</span>
      <span class="badge badge-amber">PCI-DSS — Payment card data security standard</span>
      <span class="badge badge-amber">HIPAA — US healthcare data protection</span>
    </div>
    <div class="analogy-box"><strong>Framework integration analogy:</strong> Think of COBIT as a complete house structure — the foundation, walls, and roof. Specific regulations like GDPR or ISO 27001 are like specific rooms — the bedroom, kitchen, bathroom. COBIT provides the overall structure that makes every specific room possible. Having a strong COBIT implementation is like having a solid house that can accommodate whatever rooms compliance requires.</div>`,
    quiz: { q: "A company implements COBIT and finds it helps them comply with GDPR, SOX, and ISO 27001 simultaneously. Why does COBIT serve multiple compliance needs?", opts: ["Because COBIT was written by the same authors as GDPR", "Because COBIT is a comprehensive governance framework whose controls underpin many specific compliance requirements", "Because COBIT is legally required alongside all other regulations", "Because COBIT replaces the need for other compliance programs"], ans: 1, explain: "COBIT is a comprehensive governance framework — not a compliance standard itself. The strong governance and management processes it creates underpin the controls required by many different regulations and standards, making multi-framework compliance more efficient." }
  },
  {
    title: "COBIT and ITIL — Two Frameworks, One Goal",
    tagline: "How COBIT and ITIL work together (and how they differ)",
    body: `<p>COBIT is frequently used alongside <span class="key-term">ITIL</span> (Information Technology Infrastructure Library), another widely used IT framework. Understanding the difference between them — and how they complement each other — is essential for IT governance professionals.</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>COBIT</strong><span>Governance and management framework. Answers: What should IT do? Who is responsible? How do we measure and control it? Broad scope — covers all of IT governance.</span></div>
      <div class="cheat-pill"><strong>ITIL</strong><span>IT service management framework. Answers: How should IT services be designed, delivered, and supported? Narrower scope — focused on service delivery excellence.</span></div>
    </div>
    <div class="analogy-box"><strong>The simple difference:</strong> COBIT asks "Are we doing the right things?" ITIL asks "Are we doing things right?" Both questions matter. COBIT sets the direction and governance; ITIL provides detailed operational guidance for delivering IT services excellently. They're complementary, not competing.</div>
    <div class="highlight-box"><strong>How they work together in practice:</strong> A company uses COBIT's EDM domain for board-level oversight, APO for strategic planning, and MEA for performance monitoring. For the actual delivery of IT services — helpdesk, incident management, change management, service catalog — they follow ITIL's detailed process guidance. COBIT says "managed incidents are required" (DSS02); ITIL tells you exactly how to run a world-class incident management process.</div>
    <p>Other frameworks that complement COBIT include: <strong>TOGAF</strong> (enterprise architecture), <strong>PRINCE2</strong> (project management), <strong>PMBOK</strong> (project management), <strong>ISO 31000</strong> (risk management), and <strong>COSO</strong> (internal controls). COBIT is designed to integrate with all of them.</p>`,
    quiz: { q: "A company uses COBIT to govern its IT and ITIL to manage its IT service delivery. How do these two frameworks relate to each other?", opts: ["They conflict — you must choose one or the other", "COBIT is outdated; ITIL has replaced it", "They complement each other — COBIT provides governance; ITIL provides service management detail", "They are identical frameworks with different names"], ans: 2, explain: "COBIT and ITIL are complementary. COBIT provides the governance framework — what needs to be done and who's accountable. ITIL provides detailed operational guidance for IT service management. Many organizations use both together." }
  },
  {
    title: "Implementing COBIT — The Design and Implementation Guide",
    tagline: "How organizations actually put COBIT into practice",
    body: `<p>One of the most common questions about COBIT is: <em>"Where do we start?"</em> COBIT 2019 includes a dedicated <span class="key-term">Design and Implementation Guide</span> that gives organizations a practical approach to implementing the framework.</p>
    <p>The implementation approach has three phases:</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Phase 1: Understand the Context and Strategy</strong><span>Identify your design factors. Understand what the organization is trying to achieve. Define your governance system scope.</span></div>
      <div class="cheat-pill"><strong>Phase 2: Determine the Initial Scope</strong><span>Based on design factors, identify which COBIT objectives are most important for your organization. Not all 40 are equally critical.</span></div>
      <div class="cheat-pill"><strong>Phase 3: Refine the Scope</strong><span>Use additional analysis — risk profile, compliance requirements, current pain points — to further prioritize and finalize your COBIT implementation plan.</span></div>
    </div>
    <div class="highlight-box">COBIT explicitly warns against trying to implement everything at once. A phased approach — starting with the highest-priority governance and management objectives — is strongly recommended. The most common mistake in COBIT implementations is trying to be perfect from day one rather than building capability progressively.</div>
    <div class="analogy-box"><strong>Implementation analogy:</strong> Starting a fitness journey: you don't join every sport, hire 5 personal trainers, and overhaul your diet all at once. You identify your biggest health risks (design factors), set priority goals (scope), and start with a manageable but consistent routine (phased implementation). Progress beats perfection.</div>
    <p>COBIT implementation also requires ongoing maintenance. As the organization's strategy, technology, and risk environment change, the governance system must evolve — this connects to COBIT's principle of a <em>Dynamic Governance System</em>.</p>`,
    quiz: { q: "What is the most common mistake organizations make when implementing COBIT for the first time?", opts: ["Starting with the EDM domain instead of APO", "Trying to implement all 40 objectives simultaneously rather than using a phased approach", "Skipping the Design Factors analysis", "Not using a Balanced Scorecard"], ans: 1, explain: "Trying to implement all 40 COBIT objectives at once is the most common mistake. COBIT's own guidance recommends a phased approach: start with highest-priority objectives based on design factors and build capability progressively." }
  },
  {
    title: "COBIT Assessments and Audits",
    tagline: "How do you know if your COBIT implementation is actually working?",
    body: `<p>Implementing COBIT is one thing — knowing whether it's actually working is another. COBIT 2019 provides a comprehensive <span class="key-term">assessment and audit framework</span> for evaluating governance system effectiveness.</p>
    <p>COBIT assessments serve several purposes:</p>
    <div class="badge-row">
      <span class="badge badge-amber">Determine current capability levels for key processes</span>
      <span class="badge badge-amber">Identify gaps between current and target performance</span>
      <span class="badge badge-amber">Support internal audit and external compliance reviews</span>
      <span class="badge badge-amber">Demonstrate governance maturity to regulators, auditors, and boards</span>
      <span class="badge badge-amber">Drive continuous improvement by identifying weaknesses</span>
    </div>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>Self-Assessments</strong><span>Internal teams evaluate their own processes against COBIT criteria. Fast and low-cost, but less objective. Good for initial baseline or ongoing monitoring.</span></div>
      <div class="cheat-pill"><strong>Internal Audit Assessments</strong><span>The organization's own internal audit team conducts the assessment. More objective than self-assessment. Standard practice in large organizations.</span></div>
      <div class="cheat-pill"><strong>Independent External Assessments</strong><span>An external auditor or consulting firm conducts the assessment. Most objective and credible — often required by regulators or for SOX compliance.</span></div>
    </div>
    <div class="analogy-box"><strong>Assessment analogy:</strong> A school measures learning through homework (self-assessment), tests graded by the teacher (internal assessment), and standardized exams graded by outside bodies (external assessment). Each has a role — self-assessment gives frequent feedback; external assessment provides independent credibility. COBIT governance uses the same layered approach.</div>`,
    quiz: { q: "A regulator requires a company to provide independent proof that its IT governance and controls are effective. Which type of COBIT assessment would best satisfy this requirement?", opts: ["A self-assessment by the IT team", "An assessment by the IT Steering Committee", "An independent external assessment by a qualified auditor", "A verbal confirmation from the CIO"], ans: 2, explain: "An independent external assessment provides the most credible, objective evidence of governance effectiveness. Regulators generally require external, independent assessment because self-assessments and management statements lack objectivity." }
  },
  {
    title: "COBIT and Cybersecurity",
    tagline: "How COBIT addresses one of the greatest IT challenges of our time",
    body: `<p>Cybersecurity has become one of the most critical IT governance concerns for organizations worldwide. COBIT addresses cybersecurity both through specific processes and through its dedicated <span class="key-term">Cybersecurity Focus Area</span>.</p>
    <p>Key COBIT processes that directly address cybersecurity:</p>
    <div class="cheat-grid">
      <div class="cheat-pill"><strong>EDM03 — Ensure Risk Optimization</strong><span>Board-level oversight of cybersecurity risk — ensuring cyber risk is within the organization's appetite.</span></div>
      <div class="cheat-pill"><strong>APO12 — Managed Risk</strong><span>Strategic cyber risk management — identifying, assessing, and treating cybersecurity threats.</span></div>
      <div class="cheat-pill"><strong>APO13 — Managed Security</strong><span>Designing and maintaining the information security management system (ISMS).</span></div>
      <div class="cheat-pill"><strong>BAI06 — Managed IT Changes</strong><span>Ensuring changes to IT systems don't introduce new security vulnerabilities.</span></div>
      <div class="cheat-pill"><strong>DSS05 — Managed Security Services</strong><span>Day-to-day security operations — monitoring, access management, incident response.</span></div>
      <div class="cheat-pill"><strong>MEA02 — Managed System of Internal Control</strong><span>Assessing whether security controls are actually working as designed.</span></div>
    </div>
    <div class="highlight-box">The COBIT Cybersecurity Focus Area maps COBIT processes to the <strong>NIST Cybersecurity Framework</strong> (Identify, Protect, Detect, Respond, Recover) — one of the most widely used cybersecurity frameworks in the US. This mapping allows organizations to use COBIT governance while speaking the language of NIST when needed.</div>
    <div class="analogy-box"><strong>Cybersecurity governance reality:</strong> Most organizations treat cybersecurity as a purely technical problem — buy the best firewall, hire great security engineers. COBIT teaches that cybersecurity is fundamentally a governance problem: Who is accountable? What risks are acceptable? Are the right decisions being made at the right level? Technology alone never solves governance failures.</div>`,
    quiz: { q: "A company's board wants to understand whether cyber risk is within the organization's risk appetite. Which COBIT process addresses this at the governance level?", opts: ["DSS05 — Managed Security Services", "APO13 — Managed Security", "EDM03 — Ensure Risk Optimization", "BAI06 — Managed IT Changes"], ans: 2, explain: "EDM03 — Ensure Risk Optimization — is the governance-level process where the board evaluates and ensures that overall IT risk (including cyber risk) is within the organization's accepted risk appetite. It's the governance oversight function for risk, sitting above the management-level APO12 and APO13 processes." }
  },
  {
    title: "30-Day Review",
    tagline: "Everything we covered — in one final look",
    body: `<p>You've made it through all 30 days! Let's take stock of everything you now know about COBIT.</p>
    <div class="tag-header">The Big Picture</div>
    <p>COBIT (Control Objectives for Information and Related Technologies) is ISACA's globally recognized framework for the governance and management of enterprise IT. Current version: COBIT 2019. It's voluntary — organizations adopt it because it works. It connects technology to business value through a structured system of objectives, metrics, and governance components.</p>
    <div class="tag-header">6 Principles of COBIT 2019</div>
    <div class="badge-row">
      <span class="badge badge-amber">Provide Stakeholder Value</span>
      <span class="badge badge-amber">Holistic Approach</span>
      <span class="badge badge-amber">Dynamic Governance System</span>
      <span class="badge badge-amber">Governance Distinct from Management</span>
      <span class="badge badge-amber">Tailored to Enterprise Needs</span>
      <span class="badge badge-amber">End-to-End Governance System</span>
    </div>
    <div class="tag-header">5 Domains — 40 Objectives</div>
    <div class="badge-row">
      <span class="badge badge-red">EDM — Evaluate, Direct, Monitor (5 — Governance)</span>
      <span class="badge badge-amber">APO — Align, Plan, Organize (14 — Management)</span>
      <span class="badge badge-blue">BAI — Build, Acquire, Implement (11 — Management)</span>
      <span class="badge badge-green">DSS — Deliver, Service, Support (6 — Management)</span>
      <span class="badge badge-purple">MEA — Monitor, Evaluate, Assess (4 — Management)</span>
    </div>
    <div class="tag-header">7 Governance System Components</div>
    <div class="badge-row">
      <span class="badge badge-gray">Processes</span>

let current = 0;

function buildGrid(){
  const g = document.getElementById('dayGrid');
  g.innerHTML = '';
  for(let i = 0; i < days.length; i++){
    const b = document.createElement('button');
    b.className = 'day-pip' + (days[i].isCheatSheet ? ' cheat' : '') + (i === current ? ' active' : '');
    b.textContent = days[i].isCheatSheet ? 'CS' : (i + 1);
    b.title = days[i].title;
    b.onclick = (()=>{ const idx = i; return () => goTo(idx); })();
    g.appendChild(b);
  }
}

function goTo(idx){ current = idx; render(); }
function changeDay(dir){ current = Math.max(0, Math.min(days.length - 1, current + dir)); render(); }

function render(){
  const d = days[current];
  const total = days.length;
  document.getElementById('dayCounter').textContent = (current + 1) + ' / ' + total;
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === total - 1;
  document.getElementById('progBar').style.width = (((current + 1) / total) * 100) + '%';
  buildGrid();

  if(d.isCheatSheet){
    document.getElementById('lessonArea').innerHTML = `
      <div class="card">
        <div class="lesson-header">
          <div class="day-badge" style="background:#E1F5EE">
            <div class="day-num" style="color:#085041;font-size:14px">CHEAT</div>
            <div class="day-lbl" style="color:#0F6E56">SHEET</div>
          </div>
          <div class="lesson-meta">
            <h2>${d.title}</h2>
            <div class="tagline">${d.tagline}</div>
          </div>
        </div>
        <div class="lesson-body">${d.body}</div>
      </div>`;
    return;
  }

  const quizId = 'quiz_' + current;
  let quizHtml = '';
  if(d.quiz){
    const optsHtml = d.quiz.opts.map((o, i) =>
      `<button class="quiz-btn" onclick="checkAnswer(${i}, ${d.quiz.ans}, '${quizId}')">${o}</button>`
    ).join('');
    quizHtml = `<div class="quiz-box">
      <p>Quick check: ${d.quiz.q}</p>
      <div>${optsHtml}</div>
      <div class="answer-reveal" id="${quizId}"></div>
    </div>`;
  }

  document.getElementById('lessonArea').innerHTML = `
    <div class="card">
      <div class="lesson-header">
        <div class="day-badge">
          <div class="day-num">${current + 1}</div>
          <div class="day-lbl">Day</div>
        </div>
        <div class="lesson-meta">
          <h2>${d.title}</h2>
          <div class="tagline">${d.tagline}</div>
        </div>
      </div>
      <div class="section-label">Today's lesson</div>
      <div class="lesson-body">${d.body}</div>
      ${quizHtml}
    </div>`;
}

function checkAnswer(chosen, correct, qid){
  const el = document.getElementById(qid);
  const d = days[current];
  if(!d.quiz) return;
  const isRight = chosen === correct;
  el.innerHTML = `<strong>${isRight ? 'Correct!' : 'Not quite.'}</strong> ${d.quiz.explain}`;
  el.className = 'answer-reveal show';
  el.style.background = isRight ? '#EAF3DE' : '#FCEBEB';
  el.style.borderColor = isRight ? '#3B6D11' : '#A32D2D';
  el.style.color = '#1a1a18';
}

render();
