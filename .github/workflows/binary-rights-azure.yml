name: Binary Rights website
on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/binary-rights-azure.yml']
  pull_request:
    branches: [main]
    paths: ['website/**', '.github/workflows/binary-rights-azure.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node website/scripts/build.cjs
      - run: node --test website/tests/*.test.cjs
      - run: npm ci --prefix website/api
      - run: git diff --exit-code -- website/public website/api/seed.json
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy website and managed API
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: website/public
          api_location: website/api
          output_location: ''
          skip_app_build: true
